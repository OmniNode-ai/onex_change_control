#
# DB Boundary Exception Registry
#
# Validated by: uv run check-db-boundary --validate-all --registry registry/db-boundary-exceptions.yaml
#
# Each exception documents an approved deviation from the one-service-one-database
# principle. See docs/policy/db-boundary-policy.md for the full policy.
#
# Schema per entry:
#   repo: <repo-name>                           # Repository containing the exception
#   file: src/path/to/file.py                   # Exact file path
#   usage: <brief description>                  # What the cross-boundary access does
#   reason_category: READ_MODEL | TEST_ONLY | BOOTSTRAP | LEGACY_MIGRATION
#   justification: <why this is necessary>      # Explicit rationale
#   owner: <person or team>                     # Who is responsible
#   approved_by: <approver>                     # Who approved the exception
#   review_by: "YYYY-MM"                        # When to re-evaluate (must not be expired)
#   status: APPROVED | PENDING | EXPIRED | REVOKED
#
# As of 2026-03-13: 3 exceptions registered for cross-service discovery patterns.
#
# Review method (OMN-16058): an entry is renewed only if deleting it re-exposes a live
# violation under `check-db-boundary --repo <repo> --path <clone>`. If the grandfathered
# surface is gone, DELETE the entry rather than extending review_by. Renewals are one
# quarter. Renewing without re-running that check is a deadline extension, not a review.

exceptions:
  # reviewed 2026-08-14 (OMN-16058): RENEWED — handler still reads the env var at line 643
  # (`db_url or os.environ.get("OMNIBASE_INFRA_DB_URL")`) as the idempotency-repo DSN fallback;
  # deleting this entry re-exposes [cross_service_env] at that exact line. Migration to an
  # omniintelligence-owned schema has not started.
  - repo: omniintelligence
    file: src/omniintelligence/nodes/node_gmail_intent_evaluator_effect/handlers/handler_gmail_intent_evaluate.py
    usage: References OMNIBASE_INFRA_DB_URL for idempotency table access
    reason_category: LEGACY_MIGRATION
    justification: Gmail intent handler uses omnibase_infra DB for idempotency checks; planned migration
      to own schema
    owner: jonah
    approved_by: jonah
    review_by: "2026-11"
    status: APPROVED
  # reviewed 2026-08-14 (OMN-16058): RENEWED — import is live at line 43
  # (`from omnibase_infra.models.discovery import ModelIntrospectionConfig`, used at line 214);
  # deleting this entry re-exposes [cross_service_import] at that line. The stated migration
  # target does not exist yet: ModelIntrospectionConfig is defined only in
  # omnibase_infra/src/omnibase_infra/models/discovery/model_introspection_config.py:78 —
  # absent from both omnibase_spi and omnibase_core.
  - repo: omniintelligence
    file: src/omniintelligence/runtime/introspection.py
    usage: Imports ModelIntrospectionConfig from omnibase_infra.models.discovery
    reason_category: LEGACY_MIGRATION
    justification: Shared introspection config model used for service discovery; will migrate to omnibase_spi
    owner: jonah
    approved_by: jonah
    review_by: "2026-11"
    status: APPROVED
  # reviewed 2026-08-14 (OMN-16058): RENEWED — import is live at line 42 (used at line 211);
  # deleting this entry re-exposes [cross_service_import] at that line. Same unmaterialized
  # omnibase_spi migration target as the omniintelligence entry above; both should retire
  # together when ModelIntrospectionConfig moves out of omnibase_infra.
  - repo: omnimemory
    file: src/omnimemory/runtime/introspection.py
    usage: Imports ModelIntrospectionConfig from omnibase_infra.models.discovery
    reason_category: LEGACY_MIGRATION
    justification: Shared introspection config model used for service discovery; will migrate to omnibase_spi
    owner: jonah
    approved_by: jonah
    review_by: "2026-11"
    status: APPROVED
