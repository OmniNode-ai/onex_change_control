#
# OMN-16007 Rule G shrink-only baseline: OMN-14431 inert runner-injected token
# prefixes (`PR_NUMBER=<literal>; ... gh pr view ${PR_NUMBER}`).
#
# WHY THIS BASELINE EXISTS AT ALL. The `inert-token-prefix` detector shipped in
# OMN-14431 and has always been HARD tier, but the only surface that ran it was
# the changed-files pre-commit hook -- ci.yml's "Run full pre-commit" step
# carried a `github.base_ref != 'dev'` carve-out, so on dev (this repo's default
# branch, where every real merge lands) the corpus was never scanned. OMN-16007
# removes that carve-out. Its first real execution surfaced 84 inherited
# instances, byte-identical to origin/dev -- pre-existing debt the carve-out had
# been hiding, not anything OMN-16007 introduced. Rules A/B/C/D/F were already
# frozen under .onex_ratchets/; this class was the one with no baseline.
#
# WHY EXACT EQUALITY IS SAFE HERE, unlike OMN-15411 Rule E. 62 of these 84 ids
# match the Rule E generated-producer shape (`occ-self-bind-pr-<n>` and friends),
# and Rule E had to CARVE OUT that shape precisely because ratcheting a
# machine-authored, monotonically-growing set wedges every future autobind PR.
# That hazard does not apply to this class, because the producer already
# retired the shape: the highest PR number in any flagged id is 4407, while
# 1351 `occ-self-bind-pr-<n>` items with n > 4407 exist across 629 contracts and
# every one of them is clean. The producer moved from the inert
# `PR_NUMBER=4312; REPO=...; gh pr view ${PR_NUMBER} --repo ${REPO}` form to a
# literal-pinned `gh pr view 6435 --repo OmniNode-ai/onex_change_control` form.
# The set is CLOSED, so freezing it exactly cannot wedge the fleet -- and if the
# producer ever regresses, the equality assertion is exactly what catches it.
# That retirement is pinned as a test rather than asserted here in prose:
# test_rule_g_generated_producer_retired_the_inert_shape.
#
# SHRINK-ONLY, set EQUALITY, same contract as Rules A/B/C/D/F:
#   * a NEW instance not in this file hard-fails (both the linter's own exit
#     code via scripts/lint_contract_check_values.py's baseline filter, and the
#     corpus ratchet in tests/unit/scripts/
#     test_lint_contract_check_values_corpus_baseline.py);
#   * repairing a contract WITHOUT deleting its entry here hard-fails too --
#     a stale entry silently defeats the ratchet's purpose.
#
# Burn-down is tracked in its own Linear ticket, filed alongside this freeze
# and covering all 1175 baselined findings across rules A/B/D/F/G. This file
# is the frozen census, not a permission slip.
#
# Reproduce with:
#
#   python3 -c "
#   import sys; sys.path.insert(0,'scripts')
#   from pathlib import Path
#   import lint_contract_check_values as L
#   for p in sorted(Path('contracts').glob('*.yaml')):
#       for _ps, label, _f in L.lint_contract(p):
#           if 'inert-token-prefix' in label:
#               print('contracts/%s::%s' % (p.name, label.split(':', 1)[0]))
#   " | sort -u
#
# Frozen 2026-08-14: 84 dod_evidence items.
