#
# Frozen, shrink-only roster of publishing repos whose dev-vs-tag staleness is
# MEASURED and REPORTED but does not yet BLOCK (OMN-18010, deliverable 3).
#
# Why these seven and not zero: the staleness gate's context is asserted on
# every onex_change_control PR, and OCC is the evidence-companion repo for the
# whole org, so a red gate here stops every product PR everywhere. Release-on-
# merge exists on omnimarket alone today; on the seven below the release is
# still a manual tag push, so a lane hitting a red check would have no action
# available to clear it. Each is stale RIGHT NOW and each prints in the finding
# table on every run — measured 2026-09-07T05:3xZ against the latest vX.Y.Z tag
# with the packaged-path filter, and independently cross-checked with
# `git rev-list <tag>..origin/dev -- src pyproject.toml uv.lock` in the
# canonical clones (identical sha, count and timestamp on every row sampled):
#
#   omnibase_core     v0.47.5   1 packaged unreleased commit, oldest  1.4h
#   omnibase_infra    v0.38.19  9 packaged unreleased commits, oldest 14.7h
#   omnibase_spi      v0.23.3   1 packaged unreleased commit, oldest  123.1h
#   omnibase_compat   v0.5.7    0 packaged unreleased commits (FRESH today)
#   omnimemory        v0.18.1   5 packaged unreleased commits, oldest 134.5h
#   omniintelligence  v0.24.0  98 packaged unreleased commits, oldest 2026-05-25
#   omniclaude        v0.25.1  68 packaged unreleased commits, oldest 2026-06-04
#
# RATCHET DISCIPLINE: this list may only SHRINK. Do NOT add an entry — marking a
# repo enforced=false that is not already named here is a hard failure of
# `check_release_staleness.py --check-roster` and of
# tests/test_check_release_staleness.py. A repo that already blocks may never
# stop blocking; the roster is not a dial.
#
# Remove a name here in the SAME PR that lands that repo's release-on-merge
# workflow and flips `enforced: true` in
# scripts/validation/release_staleness_policy.yaml. The reason each repo is
# listed lives in that policy file's `deferral_reason`, not here — one home per
# fact.
unenforced:
  - omnibase_compat
  - omnibase_core
  - omnibase_infra
  - omnibase_spi
  - omniclaude
  - omniintelligence
  - omnimemory
