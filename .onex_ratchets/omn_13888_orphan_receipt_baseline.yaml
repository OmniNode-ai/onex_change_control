# declared dod_evidence item in their ticket contract.
#
# WHY A BASELINE AND NOT A CUTOFF DATE: run_timestamp is producer-written,
# and the newest orphans in this corpus were minted the same day the rule
# landed, so no date separates 'legacy' from 'live'. An enumerated path
# list does, and it names the debt instead of hiding it behind a
# comparison.
#
# WHY NOT A BACK-FILL MIGRATION: back-filling contract_entry_sha256 into
# these receipts would REWRITE merged receipt files, which the OCC
# Append-Only Gate rejects as receipt_file_mutated. Repair is append-only:
# declare the item in contracts/<ticket>.yaml and mint a NET-NEW receipt
# (or supersession) bound per entry, then shrink this file in the same PR.
#
# RATCHET DISCIPLINE: this list may only SHRINK. A newly minted orphan is a
# hard failure — node_occ_companion_compute refuses to mint one as of
# OMN-13888, so a new entry here means a producer regressed.
#
# MEASURED DRIFT RATE, and it is why this list is dated rather than open-ended:
# regenerated at 18:20Z it held 439 entries; at 19:15Z, 441; at 19:32Z, 442; at
# 20:05Z, 442 again after another rebase. Every addition was minted in those
# windows by the still-deployed producer, one per second-and-later consumer of
# an already-merged contract, all by lanes unrelated to this one. That mint side
# is closed in omnimarket#2414; until its runtime image carries the fix this
# list grows by a few entries per rebase, and every addition is a receipt that
# already existed on dev at the merge base -- never one this PR introduced.
#
# Regenerate (repair PRs only):
#   uv run python scripts/validation/check_receipt_hardening.py \
#     --write-orphan-baseline
