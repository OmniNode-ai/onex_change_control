# OMN-18239 — acceptance-criterion binding adoption, frozen floors.
#
# GROW-ONLY. A run measuring fewer than any number below FAILS. Raising a
# number here is a deliberate edit in the pull request that raised the count,
# so what is written here is always a measurement somebody made rather than a
# number somebody remembered.
#
# Measured 2026-09-12 against this repository's default branch, by parsing
# every contracts/OMN-*.yaml rather than grepping it: a contract whose prose
# mentions the field is not a contract that declares one.
#
#   contracts scanned: 8838
#
# A CORRECTION THE MEASUREMENT ITSELF PRODUCED. A substring count over the same
# corpus returns 67, and the plan quotes 61 from an earlier such count. The
# parsed number is 63. The four-contract difference is contracts whose PROSE
# names the field while declaring none -- OMN-15651, OMN-16106, OMN-17276 and
# OMN-18073 each contain the sentence "It declares no binds_ac because ...".
# A substring count reports documentation about the mechanism as adoption of
# it, which is why this file freezes a parsed number and the test that produces
# it carries a control asserting prose is not counted.
#
# `contracts` itself is deliberately NOT frozen. The corpus grows every day for
# reasons unrelated to this ticket, and freezing the total would make the
# ratchet fire on every contract anybody adds.
#
# What each number means, and why three rather than one:
#
#   declaring        contracts DECLARING a non-empty `binds_ac` on an
#                    evidence item. The OMN-18056 adoption number, measured
#                    rather than grepped (see the correction above).
#   with_records     contracts carrying an `ac_bindings` record, accepted or
#                    draft. OMN-18236 adoption: how many claims are pinned to a
#                    criterion revision rather than floating. Zero here because
#                    the field lands in the same window as this file.
#   with_acceptance  contracts carrying a record somebody accepted. The number
#                    the plan's criterion is actually about, and the only one a
#                    proposer cannot raise on its own.
#
# Honest limit: this prevents a regression. It cannot cause a rise, and a lane
# that mass-accepted the corpus would satisfy it. The count is evidence for a
# human reading the trend, not a replacement for reading it.
declaring: 63
with_records: 0
with_acceptance: 0
