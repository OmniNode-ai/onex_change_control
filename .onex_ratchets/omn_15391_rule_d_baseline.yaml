#
# Frozen, shrink-only baseline of pre-existing OMN-15391 Rule D
# (fail-open zero-count pipe) violations across contracts/*.yaml as of the
# OMN-15391 round-2 landing commit.
#
# Each entry asserts absence by piping a producer into
# `grep -c '<marker>' | grep -qx 0`. check_values run under `sh -c` without
# pipefail, so a producer that 404s, is denied, or hits a network error emits
# nothing, `grep -c` prints 0, and the check passes GREEN having read nothing.
# Proven by execution at OMN-15391 round-2 authoring time: the shape returns
# rc=0 against OmniNode-ai/no_such_repo_xyz, a repository that does not exist.
#
# WHY THESE ARE FROZEN RATHER THAN REPAIRED HERE: OMN-15391 round 2 repairs
# every instance in the contracts it already touches -- the twelve
# `-rb15391` absence legs OCC#5481 introduced, the two in contracts/
# OMN-15391.yaml, and the OMN-15376 AC2 leg. The entries below are older
# `dod-00N`-era items in contracts this PR does not otherwise touch; each
# needs its own anchor chosen against the real file at the real ref, which is
# per-item research, not a mechanical rewrite. They are tracked here so the
# count can only go down.
#
# RATCHET DISCIPLINE: this list may only SHRINK. A new violation not in this
# list hard-fails; a stale entry no longer reproduced by a live scan also
# hard-fails. See tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py.
