#
# OMN-15479 Rule F -- FROZEN, SHRINK-ONLY baseline of files carrying a folded
# (`>`/`>-`/`>+`) block scalar whose parsed value contains an internal newline,
# as of the OMN-15479 landing commit.
#
# WHAT AN ENTRY MEANS. This is the CORRUPTION PRECONDITION, not the corruption:
# these scalars are still intact, and the next commit that touches one of these
# files hands it to yamlfmt, which will replace every internal newline with
# `#magic___^_^___line` and destroy the newline. They are loaded guns, and the
# fix is mechanical -- re-author the scalar as a literal block (`|` / `|-`),
# which survives yamlfmt byte-identical even above `max_line_length`.
#
# MEASURED SCOPE. 15 files (13 receipts + 1 contract + 1 workflow), of which
# exactly 1 also appears in the Rule S baseline. The workflow entry arrived with
# the 2026-07-30 scope widening (the gate now derives its file set from the
# yamlfmt hook's own `files`/`exclude` instead of hardcoding contracts/ +
# drift/dod_receipts/) and is the highest-value loaded gun in the list:
# workflows/stale-todo-gate.yml carries a multi-line `runs-on:` expression as a
# folded scalar, it is NOT under the yamlfmt exclude, and the file's own header
# tells readers to copy it into every repo's .github/workflows/. A yamlfmt pass
# would inject the sentinel into a runner selector. Note the contrast with the
# 7,286 files carrying SINGLE-paragraph folded scalars: those are a proven-safe
# control
# (they survive yamlfmt byte-identical) and are deliberately NOT baselined here,
# because flagging them would be a 7,286-file false-positive wall that teaches
# authors to ignore the gate.
#
# RATCHET DISCIPLINE. Enforced in BOTH directions by
# scripts/validation/check_yamlfmt_contamination.py --corpus: a NEW path fails,
# a GROWN count on a listed path fails, and a stale entry a live scan no longer
# reproduces fails until this file is shrunk. This list may only SHRINK.
#
# Format: `<repo-relative path>: <folded-with-internal-newline scalars>`.
baseline:
  contracts/OMN-13165.yaml: 1
  drift/dod_receipts/OMN-11730/dod-trigger-audit/command.yaml: 1
