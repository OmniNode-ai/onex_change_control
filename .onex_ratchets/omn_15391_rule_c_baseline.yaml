#
# Frozen, shrink-only baseline of OMN-15391 Rule C (tautological
# self-comparison) violations across contracts/*.yaml.
#
# THIS LIST IS EMPTY, AND THAT IS THE FINDING.
#
# Rule C fires only when a check_value's ENTIRE jq program is
# `.number == <the same PR the command selects>` -- an `N == N` assertion,
# true by construction for every PR that exists, incapable of going RED for
# any product reason.
#
# A first draft of the rule matched the identity comparison anywhere in the
# value. That draft reported 32 corpus violations, but 24 of them were FALSE
# POSITIVES: the long-standing `occ-self-bind-pr-<n>` idiom ANDs the identity
# comparison with `.state` and `.headRefName` predicates, which ARE falsifiable
# (the PR can be OPEN rather than MERGED, the branch can be renamed), so those
# checks can go RED and are not tautologies. The rule was narrowed to require
# the identity comparison to be the whole program, and a negative control drawn
# from the live text of contracts/OMN-15383.yaml pins that behaviour
# (test_rule_c_allows_identity_conjoined_with_falsifiable_predicate).
#
# After narrowing, the true corpus count was 8 -- every one of them introduced
# by OCC#5481, the PR this round remediates, and every one retired here by
# append-only supersession. There is no historical Rule C debt: the defect
# class was created and retired within two PRs of each other.
#
# The file is kept, empty, on purpose. It is the ratchet's zero point: the
# corpus test asserts set equality against it, so ANY new pure tautology
# anywhere in contracts/ hard-fails immediately with nowhere to hide. Do not
# delete it, and do not add entries to it -- a new violation is a bug to fix,
# not debt to record. Note also that no admissible replacement check exists for
# an OCC self-bind stamp (both candidate shapes are refused by the OMN-14505
# predicate; see tests/unit/test_occ_self_bind_unprovable_on_record_omn15391.py),
# so the correct repair is to record the binding as unprovable-on-record rather
# than to swap in another command.
#
# RATCHET DISCIPLINE: this list may only SHRINK. A new violation not in this
# list hard-fails; a stale entry no longer reproduced by a live scan also
# hard-fails. See tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py.
baseline: []
