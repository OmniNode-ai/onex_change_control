# OMN-15479 Rule S -- FROZEN, SHRINK-ONLY baseline of files already carrying the
# yamlfmt v0.21.0 internal line-marker sentinel `#magic___^_^___line` inside a
# parsed YAML value, as of the OMN-15479 landing commit.
#
# WHAT AN ENTRY MEANS. yamlfmt rewrote the parsed value of a folded (`>`) block
# scalar in this file: every internal newline was replaced by the 19-character
# sentinel and the newline destroyed, while the hook reported `Passed`. The file
# still parses, which is why 805 of these merged unnoticed. Each entry is
# CORRUPTED CONTENT awaiting repair by whoever owns that receipt, contract or
# module -- the original probe output cannot be recovered from the mutated file,
# so repair means re-running the probe or marking the value unrecoverable, not
# editing the sentinel out.
#
# SCOPE WIDENING, 2026-07-30. The first cut of this baseline covered 510 files
# because the gate was hardcoded to contracts/ + drift/dod_receipts/, while
# yamlfmt formats every YAML file except ^(\.github/|templates/). 151 files were
# formatter-exposed and ungated; 8 of them were ALREADY contaminated and are
# added here in one additions-only step (verified additions-only: zero existing
# entries removed, zero counts changed):
#
#   tests/fixtures/evidence_admissibility_cases.yaml            11
#   schemas/dogfood_scorecard.yaml                               4
#   src/onex_change_control/handlers/contract.yaml               1
#   src/onex_change_control/integrations/contract.yaml           1
#   src/onex_change_control/nodes/node_contract_drift_compute/contract.yaml       1
#   src/onex_change_control/nodes/node_contract_drift_effect/contract.yaml        1
#   src/onex_change_control/nodes/node_contract_drift_orchestrator/contract.yaml  1
#   src/onex_change_control/boundaries/migration_inventory.yaml   1
#
# Five of those are LIVE NODE CONTRACT DESCRIPTIONS -- the corruption reached
# shipped node metadata, not only evidence. This is the only sanctioned growth
# of this file: it admits pre-existing debt that a too-narrow gate could not
# see, it does not admit anything a commit introduced. The gate now derives its
# scope from the yamlfmt hook's own `files`/`exclude`, so this class of gap
# cannot re-open by the two declarations drifting apart.
#
# WHY FROZEN RATHER THAN REPAIRED HERE. 518 files, each belonging to a different
# ticket's evidence chain or module. A flat repo-wide assertion would be
# permanently red and therefore unmergeable, and rewriting 518 merged receipts
# in one PR would itself be an unreviewable mutation of the evidence control
# plane.
#
# RATCHET DISCIPLINE. Enforced in BOTH directions by
# scripts/validation/check_yamlfmt_contamination.py --corpus:
#   * a NEW path not in this list hard-fails;
#   * a listed path whose count GROWS hard-fails (a baselined path is frozen
#     debt at a frozen count, not a licence to add more);
#   * a listed path a live scan no longer reproduces hard-fails until this file
#     is shrunk to match.
# This list may only SHRINK. Never add a path to make a red build green.
#
# Format: `<repo-relative path>: <sentinel occurrences in parsed values>`.
