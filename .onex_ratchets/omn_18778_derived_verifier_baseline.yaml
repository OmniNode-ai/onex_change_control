# Frozen, shrink-only baseline of pre-existing OMN-18778
# DERIVED_VERIFIER receipts across drift/dod_receipts/**: post-
# HARDENING_CUTOFF PASS receipts whose verifier handle is the runner
# handle, or an affix extension of it, once separators are normalized.
#
# WHY A BASELINE AND NOT A CUTOFF DATE: run_timestamp is producer-written,
# and the newest entries here were minted the same day the rule landed,
# so no date separates 'legacy' from 'live'. An enumerated path list
# does, and it names the debt instead of hiding it behind a comparison.
#
# WHY NOT A BACK-FILL: rewriting a merged receipt's verifier field is
# exactly what the OCC Append-Only Gate rejects as receipt_file_mutated,
# and a relabelled verifier is the defect, not the repair. Repair is
# append-only: mint a net-new receipt (or supersession) naming a verifier
# the runner does not control, then shrink this file in the same PR.
#
# RATCHET DISCIPLINE: this list may only SHRINK. A newly minted
# derived-verifier receipt is a hard failure on the per-receipt rule.
#
# open_repairs: corpus members that are deliberately NOT suppressed, so
# the gate names them to whichever lane next stages them.
#
# Regenerate (repair PRs only):
#   uv run python scripts/validation/check_receipt_hardening.py \
#     --write-derived-verifier-baseline
