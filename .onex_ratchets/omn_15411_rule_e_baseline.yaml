#
# Frozen, shrink-only baseline of pre-existing OMN-15411 Rule E
# (sigpipe-fragile early-exit consumer) instances across contracts/*.yaml as
# of the OMN-15411 lint-assist landing commit.
#
# WHAT THE CLASS IS: `cmd | grep -q 'X'` -- `grep -q` exits at the first match
# and closes its stdin, the upstream producer is killed by SIGPIPE (exit 141),
# and under the dod_verify runner's `bash -o pipefail` (omnimarket#1949 /
# OMN-15382) that 141 becomes the pipeline's exit status. The result is a false
# RED on evidence that is genuinely present -- and the same command exits 0
# when run by hand outside pipefail, which is what makes the class so hard to
# diagnose in the field. The first three live instances were repaired in
# OCC#5496 and OCC#5523 with the buffered-read idiom.
#
# SCOPE: this baseline holds TIER 1 only -- producers whose output is unbounded
# by construction (base64-decoded file body, `gh pr diff`, git history walk,
# `--paginate` list, iterating `--jq '.[]'` projection), each MEASURED to
# reproduce 141 against the corpus' own real inputs under `bash -o pipefail -c`
# (5 runs each, 2026-07-29). The tier-2 advisory set (`find`, `cat`, `rg`,
# `docker logs`, pytest output -- 87 instances) is deliberately NOT baselined:
# those reproduce 141 only above a volume threshold, and the corpus' ~84
# `find <one-receipt-dir> -type f | grep -q .` instances measured 0/5, i.e. are
# provably not exposed. Freezing them would be 87 entries of non-debt.
#
# GENERATED-ITEM CARVE-OUT (59 further tier-1 instances, deliberately absent):
# the live OCC companion producer mints `dod-deploy-assessment` with
# `gh pr diff ${PR_NUMBER} --repo ${REPO} --name-only | grep -qiE '...'` on
# EVERY companion contract, and older producer revisions minted the same shape
# in `dod-<repo>-pr-<n>-ci` and `*self-bind-pr-<n>` items. Ratcheting those ids
# would hard-fail every future autobind PR -- a producer-side defect cannot be
# fixed by a consumer-side ratchet. They are exempted by
# `_is_generated_sigpipe_item()` in
# tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py and are
# tracked for repair at the producer (omnimarket node_occ_companion_compute).
#
# RATCHET DISCIPLINE: this list may only SHRINK. A NEW non-generated instance
# hard-fails
# tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py's set
# equality assertion. Remove an entry here only when the contract has actually
# been repaired (append-only `supersedes_dod_evidence:` supersession, per
# OCC#5496 / OCC#5523) or the contract file has been deleted. Partial removal
# without the matching repair, and padding with new entries, both hard-fail
# equally loudly.
#
# Format: one "contracts/OMN-<n>.yaml::<dod_id>" entry per affected
# dod_evidence item (an item with several fragile checks contributes one entry
# -- the id is the unit of remediation, not the individual check).
