#
# Frozen, shrink-only baseline of pre-existing OMN-15382 Rule B
# (per-item PR binding) violations across contracts/*.yaml as of the OMN-15382
# landing commit. Each entry is a dod_evidence item whose id embeds a PR
# number (matches pr-(\d+)) but whose gh pr view/checks/diff check_value(s)
# use only the bare ${PR_NUMBER} runner placeholder -- never the literal
# number from the id. This is the OMN-15382 class-3 mis-binding defect
# (originally found in contracts/OMN-14968.yaml's
# dod-OmniNode-ai-omnibase_infra-pr-2536, repaired in the same PR that adds
# this rule): the check silently re-targets whatever PR the compliance runner
# happens to be evaluating instead of the PR the id declares.
#
# A corpus-wide survey at OMN-15382 landing found this defect recurs roughly
# a thousand times historically (mostly the OMN-14431-era "PRODUCT_PR_NUMBER=
# <n>; ...; gh pr view $PRODUCT_PR_NUMBER" and "occ-self-bind-pr-<n>" /
# "dod-pr-<n>-head" idioms, which -- unlike the bare ${PR_NUMBER} form here --
# usually DO carry the literal number via a differently-named shell variable
# and so are a DIFFERENT, less severe shape than OMN-14968's; they are frozen
# here rather than repaired in this PR because the remediation is a distinct,
# large-blast-radius rebind sweep, not a lint-mechanism change).
#
# RATCHET DISCIPLINE: this list may only SHRINK -- see
# .onex_ratchets/omn_15382_rule_a_baseline.yaml for the full discipline
# statement (identical here). Remove an entry only when its contract has been
# rebound (append-only supersedes_dod_evidence entry pinning the literal PR
# number). Partial removal or padding both hard-fail the set-equality test.
#
# Format: one "contracts/OMN-<n>.yaml::<dod_id>" entry per violating item.
#
# Frozen count: 835 (shrunk 2026-08-08, OCC#6172: 11 entries across
# contracts/OMN-14864.yaml and contracts/OMN-15120.yaml healed by this PR's
# append-only supersession rebinds -- OMN-14864 dod-OmniNode-ai-onex-change-control-pr-4512
# + occ-self-bind-pr-4512, and all 9 OMN-15120.yaml entries)
