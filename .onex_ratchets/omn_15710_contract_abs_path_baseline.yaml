# Frozen, shrink-only baseline of pre-existing OMN-15710 ABS_PATH violations
# in contracts/<TICKET>.yaml dod_evidence[*].checks[*].check_value entries,
# as of the OMN-15710 landing commit.
#
# WHY A BASELINE HERE AND A TIME CUTOFF (OMN_15710_CUTOFF) FOR RECEIPTS:
# receipts carry run_timestamp, so the ABS_PATH/STDOUT_EMIT rules can (and
# do) exempt everything minted before OMN_15710_CUTOFF the same way
# HARDENING_CUTOFF exempts pre-2026-06-12 receipts from the OTHER rules in
# this file. Contracts carry no per-entry timestamp — a contract file is a
# single multi-entry append-only document with entries added over months —
# so a time cutoff cannot discriminate "this specific dod_evidence entry
# predates the rule." This baseline mirrors
# omn_15459_supersession_binding_baseline.yaml's FILE FORMAT/precedent only
# (a frozen `violations:` list of `<path>::<id>` entries) — it does NOT
# mirror that baseline's ENFORCEMENT MECHANISM. The 15459 baseline is
# protected by `--supersession-corpus` (asserts set equality against the
# baseline in BOTH directions, so padding a new entry in fails the same as
# a new unbaselined violation) plus `--check-supersession-wiring` (an
# anti-removal anchor), both wired as required CI (ci.yml) and pre-commit
# jobs. This baseline has none of that: no corpus-mode flag, no
# set-equality assertion, no CI/pre-commit wiring — it is loaded and
# consulted only by the plain per-file `check_receipt_hardening.py` scan
# (see `load_contract_abs_path_baseline`). Nothing today stops a future
# edit from padding this list with an unrelated entry to silence a new
# finding, or from a stale entry surviving after its underlying violation
# is fixed. That gap is a known, tracked residual of this "gate extensions
# only, no sweep audit" scope (operator ruling R-c) — see the module
# docstring's OMN-15710 section — not a claimed-closed mechanism.
#
# Each entry is `<contract path>::<dod_evidence item id>`.
#
# RATCHET DISCIPLINE (intent, not mechanically enforced here — see above):
# this list is meant to only SHRINK. Do NOT add entries — a new absolute
# path in a contract's check_value is meant to be a hard failure of
# scripts/validation/check_receipt_hardening.py, full stop (no allowlist is
# honored for receipt/contract check bodies — see the ABS_PATH rule's own
# docstring). Remove an entry only when the named dod_evidence item's
# check_value has been edited to a repo-relative or env-var-resolved path.
#
# Generated by a one-off corpus scan against contracts/*.yaml at OMN-15710
# landing time (2026-08-05); NOT regenerated by any script flag — this file
# is hand-frozen, matching the ticket's "gate extensions only, no sweep
# audit" scope (fixing these 19 pre-existing entries is out of scope here).
