---
schema_version: "1.0.0"
ticket_id: "OMN-20230"
title: "Release Staleness Gate positive control measures a bounded depth of releases"
summary: >-
  The release-staleness positive control measured omnimarket from its earliest release tag, so the history
  it read grew with the repository's age; on 2026-09-30 omnimarket src history since v0.2.0 passed the
  2,000-commit GraphQL page bound and the control failed on every onex_change_control PR while the sweep
  itself passed. The control base is now the tag CONTROL_TAG_DEPTH (30) releases behind the newest, and
  a repo whose control measurement cannot be read is skipped for the next policy repo.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria declared on OMN-20230, transcribed from the ticket body.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the positive control chooses a base tag a bounded number of releases behind the newest one, so the history it reads does not grow with the repository's age, and it still fails closed when that base yields no stale row -- falsifier: uv run pytest tests/test_check_release_staleness.py -q
      - id: "AC2"
        statement: |-
          AC2: a control whose chosen repo raises a pagination bound error falls through to the next policy repo instead of failing the whole gate, and fails only when no repo can serve as a control -- falsifier: uv run pytest tests/test_check_release_staleness.py -q -k control
      - id: "AC3"
        statement: |-
          AC3: the release-staleness context on onex_change_control dev reads success after the fix merges -- falsifier: python3 scripts/validation/check_release_staleness.py --positive-control run on dev
evidence_requirements:
  - kind: "tests"
    description: "The release-staleness script's behavioural suite, including the three OMN-20230 control
      tests."
    command: "uv run pytest tests/test_check_release_staleness.py -q"
  - kind: "ci"
    description: "The ordinary pull-request checks pass on the immutable source head."
    command: "gh pr checks 12013 --repo OmniNode-ai/onex_change_control"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-release-staleness-control-suite"
    description: |-
      AC1 and AC2: the release-staleness behavioural suite passes, including the
      bounded-depth control base, the skip past an unreadable control repo, and
      the fail when no repo supplies a readable measurement.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_check_release_staleness.py -q"
  - id: "dod-release-staleness-live-control"
    description: |-
      AC3: the positive control, run live against GitHub from this branch,
      passes on a bounded base instead of exceeding the history page bound.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run python scripts/validation/check_release_staleness.py --positive-control"
