    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the node is a canonical package -- init.py, contract.yaml, handler.py and a pure core module under src/omnibase_core/nodes/node_sprint_roll_compute/, with request and response models under src/omnibase_core/models/nodes/sprint_roll/ -- falsifier: python3 -m pytest tests/ -k canonical_file_shape with the package moved outside nodes/
      - id: "AC2"
        statement: |-
          AC2: the core is pure -- no network, no filesystem, no clock, no global state; every input arrives on the request model -- falsifier: python3 -m pytest tests/nodes/sprint_roll -q with the network disabled; the suite still passes
      - id: "AC3"
        statement: |-
          AC3: the sprint drained is the one ending or most recently ended, never one that has just begun -- falsifier: python3 -m pytest tests/nodes/sprint_roll -k drains with the final-day branch removed
      - id: "AC4"
        statement: |-
          AC4: every sprint after the source is filled to the cap and none exceeds it, and a pre-full later sprint yields its slots rather than queueing the roll behind it -- falsifier: python3 -m pytest tests/nodes/sprint_roll -k rebalance with the pool restricted to the source sprint
      - id: "AC5"
        statement: |-
          AC5: capacity is measured in tickets by default and an unestimated ticket never costs zero in points mode -- falsifier: python3 -m pytest tests/nodes/sprint_roll -k velocity with the median imputation removed
      - id: "AC6"
        statement: |-
          AC6: a ticket's own Gate line decides its criterion and is never overridden by a text match; a weak overlap assigns nothing and names the near miss -- falsifier: python3 -m pytest tests/nodes/sprint_roll -k criterion with the strong threshold lowered to 4
