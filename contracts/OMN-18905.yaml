  - id: "ac1-ac2-guard-behavior-proof"
    description: |-
      Binds AC1 and AC2 to the behavior suite that exercises the guard, rather than
      to a content grep at a pinned sha.

      AC1's falsifier is two-sided on purpose — `/ready` must return non-ready and
      NAME the topic and the gap when a topic is behind its bound, AND must return
      ready when the cache is caught up, "so the test is not passing on an
      unconditional refusal." AC2's falsifier requires that a client can
      MECHANICALLY distinguish a stale exposure from live data, under whichever
      shape was chosen. Both are properties of running code, and the suite below
      drives them.

      Live corroboration is recorded on the ticket and is not claimed as this
      item's proof: on the `.201` dev lane 2026-09-22, `/ready` refused and named
      the topic with its numbers at 07:30:57Z where on 09-20 the same endpoint
      returned ready with all 16 topics true (AC1), and every exposure continued to
      serve HTTP 200 carrying an explicit machine-readable `staleness` block, which
      is AC2's second sanctioned shape rather than a violation.

      AC3 AND AC5 ARE DELIBERATELY LEFT UNBOUND HERE, and that is a judgement, not
      an omission. AC3 asks for the freeze mechanism to be stated "with a
      measurement from the running process"; AC5 asks for a `.201` readback showing
      the guard firing and then clearing, with timestamps. Both are settled by
      measuring a live lane. Binding either to a check reachable from this gate
      would mean greping a file that describes a measurement, which proves the file
      was written and never that the lane was read — the static-to-live proof class
      OMN-18577 refuses, and refused on OMN-16504 AC3 for exactly this reason.
      Both criteria are met in substance and their measurements are on the ticket;
      they read as reasoned visible gaps rather than as manufactured passes.

      AC4 and AC6 are NOT met. See `retire-ac4-ac6-pinned-sha-overbinding` above.
    source: "manual"
    status: "pending"
    binds_ac:
      - "AC1"
      - "AC2"
    checks:
      - check_type: "test_passes"
        check_value: |-
          uv run pytest tests/test_omn18905_per_exposure_staleness_guard.py tests/test_projection_api_server.py -q
        cwd: "${OMNI_HOME}/omnimarket"
