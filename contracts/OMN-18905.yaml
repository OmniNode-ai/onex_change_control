  - id: "retire-ac4-ac6-pinned-sha-overbinding"
    description: |-
      OMN-18577 retirement. Withdraws AC4 and AC6 from all three Evidence-Source
      autobind items on this contract. Appended rather than editing them, which
      the append-only gate refuses and which would destroy their entry hashes.

      WHAT THE THREE ITEMS BIND, AND WHY IT CANNOT SETTLE AC4 OR AC6.

      `dod-OmniNode-ai-omnimarket-pr-2721`, `-2728` and `-2731` each carry
      `binds_ac: [AC1..AC6]` — all six criteria, three times over, by autobind.
      All three rest on the same check: a `grep -c 'def _staleness_block'` against
      `api_server.py` at `?ref=8e8f351b70376fdd254a938d3e7a53582b64e423`.

      The ref is a pinned sha, so the check returns 1 permanently regardless of
      what the lane does afterwards. Run verbatim 2026-09-22 it returns 1, and a
      negative control on the same file and ref (`grep -c` for a name that does
      not exist) returns 0 — so the instrument discriminates between strings. It
      does not, and cannot, discriminate between a met and an unmet criterion.

      AC4 — "the board's own freshness badge reflects real freshness ... read back
      from the live lane, host named." The board panels are C4/C5/C6
      (OMN-18771, OMN-18772, OMN-18773). C4 was pushed 2026-09-22 and is neither
      merged nor deployed; C5 and C6 are unstarted. There is no rendered panel on
      any lane to read a badge from, so no reading of this criterion is currently
      possible, let alone one a pinned grep could perform.

      AC6 — "a ledger TERMINAL row exists for the implementing lane and the OCC
      companion PR merged BEFORE the product PR." The three companions here are
      Evidence-Source autobind mints that followed their product PRs, which
      inverts the ordering the criterion requires. A grep for a function name
      neither reads the ledger nor compares two merge timestamps.

      WHAT IS NOT WITHDRAWN. AC1, AC2, AC3 and AC5 keep their existing bindings.
      Those criteria ARE met on today's measurements and withdrawing a binding
      that reaches the right verdict was not asked for and is not done here.
      Their evidence is recorded separately below and on the ticket.

      Ruled by @jonah in Slack #standups, 2026-09-22 18:23, following the shape he
      set on OMN-16964 on 2026-09-17.

      ONE DEVIATION FROM THE RULING AS WORDED, STATED RATHER THAN BURIED. He named
      the `supersedes_dod_evidence:<id>` marker. That marker does not do this job:
      `model_ac_binding_retirement.py`'s own docstring records that the
      acceptance-criterion binding gate never reads it, so "a supersession appended
      beside a wrong binding left that binding claiming its criteria and passing
      its check ... it would have looked like a fix and changed nothing", which is
      why onex_change_control#9980 was closed unmerged. `supersedes_ac_binding` is
      the shape that IS read by the binding gate, and it is a list, so his "one
      append-only item" holds exactly — all six withdrawals ride on this one entry.

      THE HONEST LIMIT, from the same docstring: the evidence closer in
      omnibase_infra does not read this field either. This retirement corrects the
      authoring record and the binding gate's verdict; the closer goes on reading
      the original `binds_ac` until that repository changes.
    source: "manual"
    status: "verified"
    supersedes_ac_binding:
      - item: "dod-OmniNode-ai-omnimarket-pr-2721"
        label: "AC4"
        reason: |-
          AC4 requires a freshness badge read back from a rendered board panel on a
          named live host. No such panel is deployed on any lane, and this item's
          check is a content grep at a pinned sha, which contacts no lane at all.
      - item: "dod-OmniNode-ai-omnimarket-pr-2721"
        label: "AC6"
        reason: |-
          AC6 requires a ledger TERMINAL row and the companion merged before the
          product PR. This companion is an autobind mint that followed its product
          PR, and a grep for a function name reads neither the ledger nor two merge
          timestamps.
      - item: "dod-OmniNode-ai-omnimarket-pr-2728"
        label: "AC4"
        reason: |-
          Same pinned-sha content grep as the other two autobind items, and the same
          defect against AC4: no rendered panel exists to read a freshness badge
          from, and the check contacts no live lane.
      - item: "dod-OmniNode-ai-omnimarket-pr-2728"
        label: "AC6"
        reason: |-
          Same pinned-sha content grep, and the same defect against AC6: this
          companion followed its product PR rather than preceding it, and the check
          reads neither the ledger nor any merge ordering.
      - item: "dod-OmniNode-ai-omnimarket-pr-2731"
        label: "AC4"
        reason: |-
          Same pinned-sha content grep, and the same defect against AC4: the
          criterion is settled by reading a rendered panel on a live host, which
          this check does not and structurally cannot do.
      - item: "dod-OmniNode-ai-omnimarket-pr-2731"
        label: "AC6"
        reason: |-
          Same pinned-sha content grep, and the same defect against AC6: an autobind
