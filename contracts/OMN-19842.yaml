      - id: "AC4"
        statement: |-
          AC4: On .201 after deploy, omnipc2-verify-runner-* rows appear in the runner_fleet_liveness read model within 180 s of a monitor cycle -- falsifier: the lab readback in the PR body shows no .202 row within 180 s of a cycle.
