      - id: "AC4"
        statement: |-
          AC4: per decision D2 (plan section 9, was question Q2, settled by the operator's accepted answers, rolling ledger RULING 2026-09-25T17:30:10Z ticket OMN-19612): the verifier refuses a carry-over receipt (carried_from set) whenever the profile's handler_kind is runtime_image, foundation_override, pypi_sibling_override or k8s_namespace, or whenever the PR's current pr_diff_digest does not equal the carried receipt's digest; carry-over is accepted only for script_replay, web_render and exempt profiles with an unchanged digest -- falsifier: uv run pytest over a carry-over fixture matrix covering all four runtime handler kinds plus a changed-digest case on a non-runtime profile
