requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (the decline is legible): a skip:NO_RED_DERIVABLE_CHECK decline names the exact candidate files it considered and, for each, why it failed the RED proof -- falsifier: trigger a decline and assert the emitted text enumerates the considered paths with a per-path reason; today it prints only aggregate counts, so a reader cannot tell whether a given file was examined and rejected or never looked at.
      - id: "AC2"
        statement: |-
          AC2 (changelog-only release PRs are deterministic): the #3850 and #3868 shapes are both reproduced as tests and both reach the same recorded outcome -- falsifier: run the emitter against the two file lists, which are identical, and assert the verdicts match; it fails today, since one minted and one declined. Whichever outcome is chosen must be the outcome for both, and if the answer is that a changelog-only release PR needs no companion, that belongs in a derived no-companion-required outcome in the OMN-18848 style rather than in a decline.
      - id: "AC3"
        statement: |-
          AC3 (a one-line source diff is provable, or the decline says what would make it so): a diff changing a single literal in a single tracked file yields a RED-proven content-bound candidate -- falsifier: replay omnibase_core#1709 and assert a mint; if the emitter still declines, the decline text must state the concrete condition that would have made it provable, and a decline with no such statement fails this criterion.
      - id: "AC4"
        statement: |-
          AC4 (non-determinism is eliminated, not papered over): two runs of the emitter against the same product PR at the same head produce the same verdict -- falsifier: run it twice against #3868's head and compare; a verdict that depends on ordering, cache state or sibling-repo availability fails, and the fix must name what the varying input was rather than adding a retry.
      - id: "AC5"
        statement: |-
          AC5 (labelled criterion — no probe is invented to satisfy this): nothing here relaxes the OMN-15247 falsifiability bar; a diff with no provable surface still declines -- falsifier: construct such a diff and assert the refusal, and grep the diff of the fix for any probe that greens on the changed file merely containing its own text.
      - id: "AC6"
        statement: |-
          AC6 (the hand path stops being the routine outcome): after the fix, a week of release-train and small-diff PRs produces no hand-authored companion -- falsifier: count companions on branches matching the hand-authored naming convention over the following seven days; a non-zero count with no recorded reason fails.
