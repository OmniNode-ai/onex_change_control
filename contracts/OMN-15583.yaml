      exits 0 (prints 1) when run by an identity that can read the log; its
      receipt still records the AC1 measurement with its serving-database
      readback and three positive controls; both this item and the superseded
      one are reported WARN in the gate output, never PASS; and the AC2 item
      below is an EXECUTED, FALSIFIABLE, outside-its-own-diff hosted check that
      PASSES, so this contract still certifies the code it claims about.
      The AC1 probe remains executable by the local Done gate and by any
      identity with Actions:Read on omninode_infra.
