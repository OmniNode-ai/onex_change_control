      drift; that is why the residual is recorded and routed instead of being papered over with a check
      that cannot run. RESIDUAL OWNERSHIP - a new ticket was deliberately NOT minted, because a dedupe
      search found the class already owned three times: OMN-15391 (an item's description narrates a proof
      its command cannot produce - admissible, green, vacuous), OMN-15309 (no admissible hermetic form
