      supersession retired the only `ssh omni-201-ts` probe, and all four replacements are pinned either
      to immutable SHAs or to a file the same PR authored, so not one of them can go RED on runtime drift:
      if the dev lane is redeployed, rolled back, or reclaimed to zero containers tomorrow, `dod_verify
      OMN-15352` stays green. AC4 declares proof_class live-readback and is now satisfied, mechanically,
      by static text. WHAT GENUINELY IMPROVED, and it is not nothing: auditability - a durable, tamper-sealed
      record of a readback that did happen - plus two genuinely admissible static assertions where there
      had been none. WHAT REMAINS OPEN: runtime falsifiability. This entry does not close it and does
