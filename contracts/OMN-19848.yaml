      - id: "AC3"
        statement: |-
          AC3: The workflow's own conclusion goes red when a bump leg genuinely fails, with no blanket continue-on-error hiding it -- falsifier: on a branch of this fix, force one leg to fail (break its pattern) and confirm the run's top-level conclusion is failure, and the run summary names the failing repo
      - id: "AC4"
        statement: |-
          AC4: scripts/pin_bump.py has positive and negative unit tests for its pattern handling -- falsifier: uv run pytest tests/unit/scripts/test_pin_bump.py -v includes a passing test asserting bump_file raises ValueError on a non-matching pattern and a passing test asserting a successful rewrite on a matching pattern Annotation: distinct from OMN-18596 (dependency-cascade.yml, the workflow that opens downstream pin-bump PRs on release publish) — this ticket is the OMN-9050 publish-downstream-pin-bump.yml workflow and its scripts/pin_bump.py, a different workflow and script with no overlapping acceptance criteria.
