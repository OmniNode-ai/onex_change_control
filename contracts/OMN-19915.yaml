    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the Vite dev proxy for the projection API routes (/projection, /api/projections,
          /api/delegation, /api/generate, /api/compare) answers an unreachable upstream with
          HTTP 502, a status line naming the target and the cause (for example "502 Projection
          backend unreachable: http://dead-projection-api:3002 (ECONNREFUSED)"), and a typed JSON
          body (error: projection_backend_unreachable, target, cause, remedy) -- falsifier:
          tests/vite-middleware/proxy-config.test.ts's parametrized case "answers an unreachable
          projection backend on %s with a 502 that names the target and the cause" for both
          /projection and /api/projections
      - id: "AC2"
        statement: |-
          AC2: the unreachable-backend handler stands down once the response has already started
          answering (headersSent), leaving Vite's own proxy behavior untouched -- falsifier:
          tests/vite-middleware/proxy-config.test.ts's case "leaves a response alone when the
          backend already started answering"
      - id: "AC3"
        statement: |-
          AC3: a live positive control against a reachable upstream (the .201 dev-lane projection
          API) shows the new handler does not alter a real response -- an upstream 200 and the
          API's own 503 not_yet_bus_backed both pass through unchanged. Not covered by the
          committed unit suite (it exercises a live network target); bound instead to the
          lab-readback transcript recorded in the PR body -- falsifier: the PR body's positive
          control section no longer states that swarm.runs.v1 passed the API's own 503 through
          unchanged
