          AC1: the first POST /v1/tenants/me/inference-credentials in a fresh onex-api process completes inside omniweb's client budget. -- falsifier: pytest in omnimarket asserts the adapter module is already in sys.modules before _build_secret_store is first called on the deployed startup path, and fails if the import is still lazy at request time.
      - id: "AC2"
        statement: |-
          AC2: an upstream timeout reaches the customer and the walk record as a timeout, not as a generic retry sentence. -- falsifier: pnpm vitest in omniweb asserts addCredential surfaces a distinct message and the numeric status for ApiError(504), and fails on the current single-string branch.
      - id: "AC3"
        statement: |-
          AC3: the walk cannot record a green dashboard leg for a tenant holding zero provider keys. -- falsifier: pnpm vitest asserts the signon-walk's S4/S5 legs read the resolved key count and fail when it is zero or unresolved, and fails against today's spec.
      - id: "AC4"
        statement: |-
          AC4: three consecutive scheduled m3-signon-walk-chain runs pass with S3-provider-key-step ok. -- falsifier: gh run list --repo OmniNode-ai/omniweb --workflow m3-signon-walk-chain.yml --limit 3 --json event,conclusion shows three schedule runs, all success, and each run's signon-walk-golden.json records S3-provider-key-step ok: true.
