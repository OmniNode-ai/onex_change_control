  `llm/pilot.py` (including the PROMINENT rendering branch) and `llm/schemas.py`; plus BOTH single-criterion
  pre-registration overlays, tracked and bound to the delegation-backed provider from day one (`contracts_data/overlays/foundry_60_asym_v1_salience_default_delegation.yaml`
  and `..._prominent_delegation.yaml`). Scope honesty: the acceptance BATTERY was deliberately deferred
  out of #223 and executed separately under OMN-15171 (steel#224), then scored in steel#231 (acceptance-battery
  evidence) and steel#232 (pre-registered SALIENCE-EMERGENT scoring) — so this ticket's own scope is complete
  and its downstream battery is complete too, but the battery is NOT what this contract proves. Every
  check is pinned to the merge SHA and was executed GREEN at authoring time.
is_seam_ticket: false
