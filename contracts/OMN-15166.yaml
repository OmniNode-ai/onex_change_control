dod_evidence:
  - id: "dod-omn-15166-pr-223-merged"
    description: >-
      steel PR #223 ("OMN-15166 — display-salience arm #1: mechanism + prereg + delegation-bound overlay")
      is MERGED with merge commit exactly f9b11aea61e48cbddc40ddaac844c25814375127. State and SHA asserted
      together so closed-unmerged, still-open, and re-landed-elsewhere all yield count 0.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 223 --repo jonahgabriel/steel_onslaught --json state,mergeCommit --jq '.state + " " + (.mergeCommit.oid // "none")' | grep -cFx 'MERGED f9b11aea61e48cbddc40ddaac844c25814375127' | grep -qx 1
  - id: "dod-omn-15166-salience-enum-bound"
    description: >-
      At the merge SHA, `src/steel_onslaught/contracts/pilot.py` defines the mechanism as a StrEnum (`class
      SODisplaySalience(StrEnum):`) AND binds it at PILOT-SPEC level with a DEFAULT-preserving field (`display_salience:
      SODisplaySalience = SODisplaySalience.DEFAULT`). Both facts matter: the enum alone would be an unbound
      mechanism, and the default is what guarantees the pre-existing rendering is byte-for-byte unchanged
      for every non-arm pilot — a non-defaulted field would silently alter every existing match and returns
      count 0 here.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/contracts/pilot.py?ref=f9b11aea61e48cbddc40ddaac844c25814375127' --jq '.content' | base64 -d | grep -cF 'class SODisplaySalience(StrEnum):' | grep -qx 1
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/contracts/pilot.py?ref=f9b11aea61e48cbddc40ddaac844c25814375127' --jq '.content' | base64 -d | grep -cF 'display_salience: SODisplaySalience = SODisplaySalience.DEFAULT' | grep -qx 1
  - id: "dod-omn-15166-prominent-branch"
    description: >-
      The mechanism actually changes rendering rather than sitting inert in the contract layer: at the
      merge SHA `src/steel_onslaught/llm/pilot.py` carries exactly one PROMINENT dispatch branch (`if
      display_salience is SODisplaySalience.PROMINENT:`), and `src/steel_onslaught/llm/schemas.py` threads
      the same field through with the same DEFAULT. A contract-only change — enum declared, renderer untouched
      — is the vacuous-arm failure mode this pair discriminates, and it returns count 0 on the pilot.py
      leg.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/llm/pilot.py?ref=f9b11aea61e48cbddc40ddaac844c25814375127' --jq '.content' | base64 -d | grep -cF 'if display_salience is SODisplaySalience.PROMINENT:' | grep -qx 1
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/llm/schemas.py?ref=f9b11aea61e48cbddc40ddaac844c25814375127' --jq '.content' | base64 -d | grep -cF 'display_salience: SODisplaySalience = SODisplaySalience.DEFAULT' | grep -qx 1
  - id: "dod-omn-15166-prereg-overlays"
    description: >-
      BOTH pre-registration overlays are tracked at the merge SHA — the single-criterion pre-registration
      is only meaningful as a pair (default corner and prominent corner). Probed as one anchored count
      over the `contracts_data/overlays` directory listing asserting exactly 2 matches, so a single-overlay
      landing (count 1) or a rename (count 0) both go RED, which a per-file existence probe would not
      catch as cleanly.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/contracts_data/overlays?ref=f9b11aea61e48cbddc40ddaac844c25814375127' --jq '.[].name' | grep -cE '^foundry_60_asym_v1_salience_(default|prominent)_delegation\.yaml$' | grep -qx 2
