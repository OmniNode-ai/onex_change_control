summary: >-
  OMN-15166 is a false-Backlog ticket, and it is fully done — both halves, not partial. The arm landed
  on jonahgabriel/steel_onslaught `main` in PR #223, merge commit f9b11aea61e48cbddc40ddaac844c25814375127,
  merged 2026-07-26T22:24:22Z, while the Linear ticket held a single Backlog stateHistory entry throughout.
