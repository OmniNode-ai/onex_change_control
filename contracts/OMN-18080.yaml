ticket_id: "OMN-18080"
title: "Dashboard logout does not end the Keycloak SSO session (next login refused as already signed in)"
summary: >
  OCC companion, bound by hand (union-resolve), for the four product PRs of OMN-18080: OmniNode-ai/omniweb
  PR #365 (the app half), OmniNode-ai/omnibase_infra PR #3363 and OmniNode-ai/omninode_infra PR #1279
  (the two byte-identical copies of the Keycloak client declaration, parity-gated), and OmniNode-ai/omnidash
  PR #316 (a transposed post-logout host in that repo's own client declaration). Hand-minted for the same
  reason OCC#8787 and OCC#8760 were: OMN-18073 records that autobind is not minting companions in this
  window, so a product PR left without one has no receipt to cite and fails the Receipt Gate on the missing
  citation rather than on anything wrong with the change. Cause of the ticket, reported by the operator
  in-session on 2026-09-09: signing out of the dev customer surface did not work, and the next sign-in
  attempt was refused by Keycloak as already signed in, which made signing in as a second synthetic tenant
  impossible in the same browser. Root cause, established from source rather than inferred: omniweb's
  whole sign-out was next-auth v5's LOCAL signOut with a redirect to the marketing home, which clears
  the app's own session cookie and contacts the identity provider not at all, so the Keycloak SSO session
  survived every sign-out and the next authorization request auto-resolved to the still-signed-in user.
  The "already signed in" text is Keycloak's own; a case-insensitive grep for it over omniweb at origin/dev
  returns zero hits. A second blocker sat underneath: the JWT callback persisted the access token, the
  refresh token and the expiry but NOT the ID token, so the id_token_hint a silent end-session call needs
  was retained nowhere. omniweb#365 adds a discovery-resolved end-session resolver (the endpoint is read
  from the configured issuer's own well-known document, never hardcoded, because the dev pods point at
  one realm host and the production-facing lane at another), persists the ID token through sign-in and
  refresh, clears the local session FIRST and then hands the client an absolute end-session URL carrying
  id_token_hint and post_logout_redirect_uri, and adds the registered /signed-out landing route together
  with the proxy entry that keeps it reachable without a session. omnibase_infra#3363 and omninode_infra#1279
  register that post-logout URI on the omniweb client in the committed reconciler input, applied by the
  sanctioned seeding Job; NO live kcadm write was performed at any point. omnidash#316 corrects a host
  transposition in that repo's own committed client declaration, where every host read dash.dev.omninode.ai
  rather than the dev.dash.omninode.ai the repo actually serves; the runtime side there needed no change,
  because keycloak-connect's logout middleware already sends both parameters when a session grant exists,
  and the earlier anonymous probe that saw a bare end-session URL proves nothing about a real session.
  AC4 is bound here and is proved RED-then-GREEN in-lane. AC1, AC2 and the live half of AC3 are NOT bound:
  they require a browser session and a read-only realm session readback on the dev-system cluster after
  these merge, and rule 24 applies -- the .201 compose lane runs no omniweb, no dashboard and no Keycloak,
  so no lab pass can cover a browser OIDC round trip, and no lab proof is claimed. No credential was rotated,
  re-issued, revoked or minted, no secret value was read or printed, no cluster object was mutated and
  no realm was contacted (rule 22).
is_seam_ticket: false
