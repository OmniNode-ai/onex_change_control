---
schema_version: "1.0.0"
ticket_id: "OMN-16878"
title: "ci(OMN-16878): wire receipt-honesty + contract-validation + omniclaude deploy-gate into their
  repos' real enforcement surfaces"
summary: >-
  OCC evidence for the three product PRs that promote advisory-but-unblocking CI contexts into the enforcement
  surface each repo actually gates with. omniclaude gains "deploy-gate", "receipt-honesty" and "contract-validation"
  across all three of its coupled surfaces (branch protection, scripts/ci/ci_summary_gate.py EXPECTED_EXTERNAL_CONTEXTS,
  and the .github/required-checks.yaml v3 manifest reconciled hourly against live protection). omnibase_infra
  gains "receipt-honesty" and "contract-validation" in EXPECTED_EXTERNAL_CONTEXTS, which is its whole
  enforcement surface by the OMN-4497 single-umbrella design (dev requires exactly one context, "CI Summary").
  omnimarket gains "receipt-honesty" there ("contract-validation" was already present). Executes items
  1-2 of the OMN-16876 enforcement census; the dormant-validator freeze-baseline items 3-10 stay in that
  ticket. CI-config-only change across all three repos - no source, contract API, topic schema, envelope,
  or live runtime-lane mutation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-unenforced-gap-readback"
    description: >-
      The gap is real and was read from live state, not assumed. Pre-change, none of the three contexts
      appears in omniclaude's dev required_status_checks (58 contexts) nor in its EXPECTED_EXTERNAL_CONTEXTS;
      neither "receipt-honesty" nor "contract-validation" appears in omnibase_infra's EXPECTED_EXTERNAL_CONTEXTS
      (and infra dev requires only "CI Summary"); and "receipt-honesty" is absent from omnimarket's EXPECTED_EXTERNAL_CONTEXTS.
      Receipt records the branch-protection readback and the constant-tuple extraction per repo.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omniclaude/contents/.github/workflows/receipt-honesty.yml?ref=dev\"
          --jq .content | base64 -d | grep 'validator_receipt_honesty' > /dev/null"
  - id: "dod-nonvacuity-negative-tests"
    description: >-
      OMN-16876 finding 5 requires proof that a promoted checker is not a vacuous pass. Each of the three
      checkers was run locally against deliberately-bad real input and exited non-zero, with a positive
      control on real committed input that exited zero: validate_pr_deploy_required.py (runtime path +
      no deploy evidence -> 1; docs-only -> 0); omnibase_core.validation.validator_receipt_honesty (gamed
      receipt with verifier == runner -> 1; real committed receipt -> 0); validate-yaml (schema-invalid
      contract -> 1; contracts/OMN-10041.yaml -> 0). Receipt records each command and exit status.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/validation/validator_receipt_honesty.py?ref=main\"
          --jq .content | base64 -d | grep 'SELF_ATTESTATION' > /dev/null"
  - id: "dod-admission-measurement"
    description: >-
      Each promoted context was measured over 16 real merged dev PR head SHAs per repo before being admitted,
      matching the admission discipline every existing EXPECTED_EXTERNAL_CONTEXTS entry carries. All seven
      repo/context pairs measured 16/16 present and 16/16 green, so no context is admitted on a red-rate
      that would convert a flaky producer into a merge outage, and no freeze-baseline ratchet is indicated
      on the presence/greenness axis.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnibase_infra/contents/scripts/ci/ci_summary_gate.py?ref=dev\"
          --jq .content | base64 -d | grep 'EXPECTED_EXTERNAL_CONTEXTS' > /dev/null"
  - id: "dod-deploy-assessment"
    description: >-
      Deploy-gate assessment: CI-configuration-only change in omniclaude, omnibase_infra and omnimarket
      (branch-protection contexts, scripts/ci/ci_summary_gate.py constant tuples, .github/required-checks.yaml
      manifest rows, and their pinning tests). No source, contract API, topic schema, envelope, or live
      runtime-lane (dev/stability/prod/judge) mutation. No live deploy, runtime restart, topic mutation,
      or .201 mutation was performed or required pre-merge.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omniclaude/contents/.github/actions/deploy-gate/validate_pr_deploy_required.py?ref=dev\"
          --jq .content | base64 -d | grep 'RUNTIME_PATH_PATTERNS' > /dev/null"
  - id: "dod-occ-pr"
    description: >-
      Self-binding receipt for this OCC PR, which carries the central contracts/OMN-16878.yaml consumed
      by the three product PRs' Receipt Gate and DoD Evidence Check via Evidence-Source.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/scripts/ci/ci_summary_gate.py?ref=dev\"
          --jq .content | base64 -d | grep 'contract-validation' > /dev/null"
  - id: "dod-OmniNode-ai-omniclaude-pr-2062"
    description: >-
      Evidence-Source rebind for OmniNode-ai/omniclaude#2062, the omniclaude product PR of this ticket.
      The five receipts authored on OCC#7433 all carry pr_number 7433 (the OCC companion itself), so occ-preflight
      resolved no PASS receipt bound to #2062 and returned pr_ticket_mismatch. This item carries a content-bound
      probe that is GREEN at the #2062 head SHA and RED at its merge-base, so the binding attests the
      product change itself rather than the existence of the OCC PR.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omniclaude/contents/scripts/ci/ci_summary_gate.py?ref=4a974122b694dc7b8ea38bb211e79047a687810f"
          --jq .content | base64 -d | grep -c 'receipt-honesty'
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2973"
    description: >-
      Evidence-Source rebind for OmniNode-ai/omnibase_infra#2973, the omnibase_infra product PR of this
      ticket. Same defect and same remedy as the omniclaude entry above: a content-bound probe that is
      GREEN at the #2973 head SHA and RED at its merge-base, binding OMN-16878 evidence to the product
      PR instead of to OCC#7433.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/ci/ci_summary_gate.py?ref=938d674294ae812e07b6317dba93da1593735073"
          --jq .content | base64 -d | grep -c 'receipt-honesty'
  - id: "occ-self-bind-pr-7454"
    description: >-
      OCC companion PR #7454 — self-bind for OMN-16878 (OMN-14650 / OMN-16353). Binds the ticket to this
      second, same-ticket companion by pr_number so eligibility can resolve a PASS receipt for the evidence
      PR itself; without it this PR fails missing_occ_self_bind.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 7454 --repo OmniNode-ai/onex_change_control --json number,state,headRefName"
