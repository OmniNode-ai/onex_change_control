---
schema_version: "1.0.0"
ticket_id: "OMN-16286"
title: "dependency-cascade.yml: base=dev, honest cascade evidence, provenance guard"
summary: >
  Hand-authored OCC Evidence-Source contract for OMN-16286: three confirmed bugs in omnibase_core's .github/workflows/dependency-cascade.yml
  (job open-bump-pr, fired by release.yml post-release). (1) --base main was hardcoded even though every
  downstream repo checks out dev, producing a dirty dev-vs-main-divergence PR and violating dev-only-promotion
  policy -- fixed to --base dev. (2) cascade PRs carried no OMN ticket and no Evidence-Source, so Receipt-Gate
  and occ-preflight/eligibility hard-failed on every downstream PR -- release.yml now resolves the release's
  own merged PR and re-threads its real Evidence-Ticket/Evidence-Source pair into every cascade PR it
  opens. (3) no check_dep_provenance.py --check-movable guard (omnibase_infra's own copy has had one since
  OMN-15604) -- ported verbatim to fail loud before a [tool.uv.sources] git-overridden pin produces a
  silent no-op or a suspicious full-file uv.lock rewrite (as happened on omniintelligence#827).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1571 CI checks (omnibase_core)"
    command: "gh pr checks 1571 --repo OmniNode-ai/omnibase_core"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_core-pr-1571"
    description: "PR #1571 on OmniNode-ai/omnibase_core — Evidence-Source binding."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1571 --repo OmniNode-ai/omnibase_core --json number,state,headRefName"
  - id: "dod-omnibase_core-pr-1571-base-dev-fix"
    description: >
      Content-bound behavioral probe confirming dependency-cascade.yml's open-bump-pr job passes --base
      dev to gh pr create (not the hardcoded --base main bug) at the PR's head ref.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "body=\"$(gh api repos/OmniNode-ai/omnibase_core/contents/.github/workflows/dependency-cascade.yml?ref=9aed0ba2b90177672d666f576f70f8c666dca7f9
          --jq .content | base64 -d)\" && printf '%s' \"$body\" | grep -qE -- '--base dev'"
  - id: "dod-omnibase_core-pr-1571-provenance-guard"
    description: >
      Content-bound behavioral probe confirming the check_dep_provenance.py --check-movable guard is wired
      into dependency-cascade.yml at the PR's head ref (port of omnibase_infra's OMN-15604 guard).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "body=\"$(gh api repos/OmniNode-ai/omnibase_core/contents/.github/workflows/dependency-cascade.yml?ref=9aed0ba2b90177672d666f576f70f8c666dca7f9
          --jq .content | base64 -d)\" && printf '%s' \"$body\" | grep -qF -- '--check-movable'"
