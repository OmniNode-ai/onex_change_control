requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Every image digest pinned under k8s/onex-prod resolves in ECR -- falsifier: a test that parses every image: line under k8s/onex-prod, probes each ECR digest, and fails naming any that returns ImageNotFoundException; run today it must FAIL naming omniintelligence and omniweb, and after the fix it must pass, with the same test used for both readings
      - id: "AC2"
        statement: |-
          AC2: A pinned production digest cannot be expired by a lifecycle rule -- falsifier: for each repository referenced by a k8s/onex-prod pin, the resolved lifecycle policy is read back and the test fails if any rule with tagStatus=untagged can select a digest that a k8s/onex-prod manifest pins; omniweb's existing tagStatus=tagged rule must NOT satisfy this criterion, since it cannot select an untagged image
      - id: "AC3"
        statement: |-
          AC3: The gap closes without a production deploy being the discovery mechanism -- falsifier: a scheduled check asserts the pins resolve and reports on its own cadence; disabling it or pointing it at a repository with no k8s/onex-prod pin makes it fail rather than pass silently
      - id: "AC4"
        statement: |-
          AC4: promote-to-prod reaches the OMN-14209 grant gate -- falsifier: a deploy_target=runtime-only dispatch whose step 14 passes and whose grant-gate step reports an outcome rather than skipped; the run id and the gate's verbatim text must be cited, and a run that stops before step 28 for any reason does not satisfy this
evidence_requirements:
  - kind: "ci"
    description: "PR #1679 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
