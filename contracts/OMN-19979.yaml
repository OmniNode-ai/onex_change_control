---
schema_version: "1.0.0"
ticket_id: "OMN-19979"
title: "transcript-based savings estimate as nodes, with estimated rows kept out of measured sums"
summary: "Hand-authored OCC evidence companion (OMN-15247) for omnimarket#3528. node_claude_code_history_read_effect
  reads a developer's own Claude Code history on opt-in into typed prompt records, and node_savings_estimate_compute
  prices them into rows typed estimated that no measured savings fold accepts."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-estimated-not-measured"
    statement: "Estimated savings rows are typed estimated, carry Overview's baseline string, and never
      enter a measured savings total."
    acceptance:
      - id: "AC1"
        statement: "AC1: estimated and measured figures are never summed together -- falsifier: uv run
          pytest tests/test_golden_chain_savings_estimate_omn19979.py -k overview_measured_total_excludes_the_estimate
          -q"
      - id: "AC2"
        statement: "AC2: the CSV's baseline column equals Overview's baseline string -- falsifier: uv
          run pytest tests/test_golden_chain_savings_estimate_omn19979.py -k csv_baseline_column_equals_overview_baseline
          -q"
evidence_requirements:
  - kind: "tests"
    description: "Run the savings estimate golden chain and both nodes' focused tests."
    command: "uv run pytest tests/test_golden_chain_savings_estimate_omn19979.py tests/nodes/node_claude_code_history_read_effect
      tests/nodes/node_savings_estimate_compute -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19979-measured-excludes-estimate"
    description: "Overview's measured total over one measured run and one estimated row is the measured
      run's alone."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_savings_estimate_omn19979.py -k overview_measured_total_excludes_the_estimate
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19979-csv-baseline-equals-overview"
    description: "The estimate CSV's baseline column equals Overview's baseline string."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_savings_estimate_omn19979.py -k csv_baseline_column_equals_overview_baseline
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-deploy-probe-omnimarket-pr-3528"
    description: "Deploy probe: the exact omnimarket#3528 head carries ModelSavingsEstimateRow in the
      shared savings_estimate models; at omnimarket dev the file is absent and the probe exits non-zero."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          deploy_probe=1; body=$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/savings_estimate/model_savings_estimate.py?ref=195c5aeed00ab0c7ddb12632a12087820bf05423' --jq '.content' | base64 -d) && printf '%s\n' "$body" | grep -cF 'class ModelSavingsEstimateRow'
