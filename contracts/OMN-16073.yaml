schema_version: "1.0.0"
ticket_id: "OMN-16073"
title: "Re-enable shared CI env for same-repo dev PRs, right-size 10-min job timeouts"
summary: >-
  OCC companion for OmniNode-ai/omnibase_infra#2752. The OMNI_CI_SHARED_ENV_ENABLED expression in ci.yml
  still disabled the host-local prebuilt dependency environment for same-repo PRs targeting dev -- a leftover
  from when internal PR CI ran on ubuntu-latest, stale once internal PRs were rerouted onto the trusted
  self-hosted fleet. Every same-repo dev PR job took the isolated `uv sync --no-cache` path (fleet-measured
  setup floor median 317s / max 613s per job, n=38), with jobs at timeout-minutes: 10 killed during setup.
  The fix deletes the stale dev-base clause so trusted same-repo PRs reuse the digest-keyed shared env
  exactly as push/merge_group events already do (fork PRs keep isolated setup), and right-sizes the 11
  jobs at job-level timeout-minutes: 10 to 15 to cover the measured 613s worst-case cold setup after a
  lockfile-change PR. Lineage stays honest by construction: the env digest includes pyproject.toml + uv.lock,
  so a dependency-pin move produces a new digest and a cold install of the new pin.
is_seam_ticket: false
