      && grep -Fq '21891 passed' drift/dod_receipts/OMN-14899/dod-omnibase-infra-pr-2400-verification/command.yaml"
  - kind: "manual"
    description: "omninode_infra PR #728 is open at the recorded OMN-14899 head."
