  - kind: "manual"
    description: "omninode_infra PR #728 is limited to strict OmniDash RDS TLS configuration and regression
      coverage."
    command: "test -f drift/dod_receipts/OMN-14899/dod-OmniNode-ai-omninode_infra-pr-728-ci/command.yaml
