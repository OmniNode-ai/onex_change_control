title: "Create app_dashboard Postgres RLS read role"
summary: >-
  Central OCC evidence for omnibase_infra PR #2400. The PR adds the app_dashboard Postgres role as a role-only
  migration with NOSUPERUSER and NOBYPASSRLS asserted, no LOGIN credential material, rollback coverage,
  schema fingerprint refresh, and migration tests. The change is a database migration and test-only prerequisite
  for OMN-14894; it does not perform a live deploy, restart, cloud secret mutation, image push, or runtime
  grant.
