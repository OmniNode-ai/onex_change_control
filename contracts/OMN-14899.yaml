    command: "test -f drift/dod_receipts/OMN-14899/dod-omnibase-infra-pr-2400-scope/command.yaml && grep
      -Fq 'docker/migrations/forward/094_create_app_dashboard_role.sql' drift/dod_receipts/OMN-14899/dod-omnibase-infra-pr-2400-scope/command.yaml
      && grep -Fq 'tests/integration/migrations/test_094_app_dashboard_role.py' drift/dod_receipts/OMN-14899/dod-omnibase-infra-pr-2400-scope/command.yaml"
  - kind: "manual"
