          AC1: A restore operand that the hook environment resolves is expanded through the module's existing _expand_path before the dirty-path check, and is judged on the expanded path, proven by a test that fails today -- falsifier: uv run pytest tests/hooks -k shared_tree_restore_expands_env_operand -q in omniclaude, feeding git checkout HEAD -- "$P" with P exported to a clean tracked path and asserting admission
      - id: "AC2"
        statement: |-
          AC2: An operand the helper cannot resolve (a variable assigned inside the command, command substitution, brace expansion) is still refused as indeterminate -- falsifier: uv run pytest tests/hooks -k shared_tree_restore_unresolvable_still_refused -q feeding a for-loop variable and a command substitution operand, asserting refusal for both
      - id: "AC3"
        statement: |-
          AC3: An expanded operand that names a path with uncommitted changes is refused exactly as its literal spelling is, as the negative control -- falsifier: uv run pytest tests/hooks -k shared_tree_restore_expanded_dirty_refused -q with P exported to a dirty path, asserting refusal
      - id: "AC4"
        statement: |-
          AC4: The indeterminate refusal names the remedy on its first actionable line: pass literal paths, or commit first and restore by path per Operating Rule 17 -- falsifier: uv run pytest tests/hooks -k shared_tree_restore_refusal_names_remedy -q asserting both remedies appear in the refusal text The tests run in the omniclaude hooks suite, which the required CI job already executes, so the behaviour is enforced by the gate the guard ships through rather than by convention.
