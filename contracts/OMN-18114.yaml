  - id: "dod-omn18114-ac4-ac5-carrier-actually-starts"
    description: >
      AC4 and AC5 — the MECHANISM half. The five checks on dod-omn18114-ac4-both-lanes-carry-others-inert
      are each a `grep -c` over a compose or test file at a pinned ref. They prove the carrier is DECLARED.
      AC4's own wording is that both lanes each "run" a carrier, and a file grep cannot distinguish a
      declared service from a running one — which is how AC4 and AC5 came to be recorded as met while
      the lane census reported `container_absent` for `omnimarket-stability-test-tenant-projection-writer`
      at severity critical, on the very surface the `stability-proven` premise of every live prod-promotion
      grant resolves from. The gap is not in the declaration. `resolve_lane_runtime_services` in scripts/deploy-runtime.sh
      appends a lane's `*_LANE_ONLY_RUNTIME_SERVICES` array ONLY when no build override is in play, and
      both governed refresh scripts ALWAYS export `RUNTIME_BUILD_SERVICES_OVERRIDE`. So for the two lanes
      this repo refreshes, that array is unreachable and each refresh script's own `REFRESH_BUILD_SERVICES`
      is the entire restart set. PR #3385 added the carrier to the arrays and to both overlays, and to
      neither refresh script, so the governed path could never start it. Checks 1-2 assert each refresh
      script now names the carrier in its build scope. Checks 3-4 assert the two-derivation gate exists
      — the restart-set derivation and the compose-derived one that holds even if the arrays are wrong.
      Check 5 asserts the gate is wired as a pre-commit hook, so the two halves cannot drift apart in
      one commit; Operating Rule 5, enforcement rather than detection. Check 6 is the NEGATIVE CONTROL
      for blast radius, and is fail-closed on a broken fetch: the prod compose overlay must still name
      `omninode-runtime` and must name the carrier ZERO times, so a future edit that reached prod fails
      this item rather than passing quietly. This item is the mechanism. The live readback that AC4 and
      AC5 literally ask for — a RUNNING container on each lane and the consumer group Stable with falling
      lag — is recorded separately after the sanctioned lane refresh, and is what returns the ticket to
      Done.
