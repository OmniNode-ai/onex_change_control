    description: "ruff, mypy strict pass for changed files."
    command: "See drift/dod_receipts/OMN-11187/dod-lint/command.yaml"
  - kind: "manual"
    description: "Terminal topic receives envelope after delegation event written to DB."
    command: "See drift/dod_receipts/OMN-11187/dod-deploy-terminal-topic/command.yaml"
  - kind: "ci"
