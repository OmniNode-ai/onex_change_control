dod_evidence:
  - id: "dod-omn-15167-pr-218-merged"
    description: >-
      steel PR #218 ("OMN-15167 — terminal-event bus forwarder (4 terminal classes, match_id-keyed, contract-declared
      topic)") is MERGED with merge commit exactly f378cd488fd7914a1fe73898f3ee75a289873b10. State and
      SHA asserted together so closed-unmerged, still-open, and re-landed-elsewhere all yield count 0.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 218 --repo jonahgabriel/steel_onslaught --json state,mergeCommit --jq '.state + " " + (.mergeCommit.oid // "none")' | grep -cFx 'MERGED f378cd488fd7914a1fe73898f3ee75a289873b10' | grep -qx 1
  - id: "dod-omn-15167-forwarder-topic-once"
    description: >-
      At the merge SHA, `src/steel_onslaught/bus/kafka_forwarder.py` defines `class KafkaTerminalEventForwarder:`
      and declares the topic literal EXACTLY ONCE as a typed module constant: `STEEL_MATCH_TERMINAL_TOPIC:
      str = "onex.evt.steel-onslaught.match-terminal.v1"`. The exactly-once count is the load-bearing
      assertion, not the presence of the string: a second free-string occurrence of the topic anywhere
      at declaration shape would break the governed topic-registration requirement, and asserting count
      1 on the full typed-declaration line is what makes that regression RED.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/bus/kafka_forwarder.py?ref=f378cd488fd7914a1fe73898f3ee75a289873b10' --jq '.content' | base64 -d | grep -cF 'class KafkaTerminalEventForwarder:' | grep -qx 1
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/bus/kafka_forwarder.py?ref=f378cd488fd7914a1fe73898f3ee75a289873b10' --jq '.content' | base64 -d | grep -cF 'STEEL_MATCH_TERMINAL_TOPIC: str = "onex.evt.steel-onslaught.match-terminal.v1"' | grep -qx 1
  - id: "dod-omn-15167-four-terminal-classes"
    description: >-
      The boundary whitelist admits EXACTLY the four terminal classes the ticket scopes and no more: MATCH_STARTED,
      MATCH_ENDED, MATCH_SCORED, VICTORY_DECLARED, asserted as exactly 4 anchored `    SOEventType.<CLASS>,`
      whitelist entries. This is the check that enforces the leak constraint — intent, telemetry, and
      LLM-evidence events must never cross onto the platform bus. Adding a fifth class returns 5 and goes
      RED; dropping one returns 3 and goes RED. A substring probe for the four names would pass on the
      module docstring alone, so the pattern is anchored to the whitelist's own indentation and trailing
      comma.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/bus/kafka_forwarder.py?ref=f378cd488fd7914a1fe73898f3ee75a289873b10' --jq '.content' | base64 -d | grep -cE '^    SOEventType\.(MATCH_STARTED|MATCH_ENDED|MATCH_SCORED|VICTORY_DECLARED),$' | grep -qx 4
  - id: "dod-omn-15167-subscribed-in-composition"
    description: >-
      The forwarder is actually wired, and wired the way the ticket requires: at the merge SHA `src/steel_onslaught/match/composition.py`
      constructs it transport-INJECTED (`KafkaTerminalEventForwarder(transport=kafka_transport)`) rather
      than letting composition build its own transport, and subscribes its publish callable exactly once
      (`dependencies.kafka_forwarder.publish,`) — the single-line rollback point. A defined-but-never-subscribed
      forwarder is the silent-no-op class this pair discriminates, and the subscribe leg returns count
      0 in that case.
    source: "manual"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/match/composition.py?ref=f378cd488fd7914a1fe73898f3ee75a289873b10' --jq '.content' | base64 -d | grep -cF 'KafkaTerminalEventForwarder(transport=kafka_transport)' | grep -qx 1
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/match/composition.py?ref=f378cd488fd7914a1fe73898f3ee75a289873b10' --jq '.content' | base64 -d | grep -cF 'dependencies.kafka_forwarder.publish,' | grep -qx 1
