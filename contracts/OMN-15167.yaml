schema_version: "1.0.0"
ticket_id: "OMN-15167"
title: "Terminal-event Kafka-forwarding subscriber (4 terminal classes only) — receipt contract for already-merged,
  live-proven work (false-Backlog reconciliation)"
summary: >-
  OMN-15167 is a false-Backlog ticket, and it is stronger than code-only — it is live-proven. The forwarder
  landed on jonahgabriel/steel_onslaught `main` in PR #218, merge commit f378cd488fd7914a1fe73898f3ee75a289873b10,
  merged 2026-07-26T11:37:58Z, while the Linear ticket held a single Backlog stateHistory entry throughout.
  This contract is the receipt surface for the dod_verify path; it makes no status change. What landed:
  `src/steel_onslaught/bus/kafka_forwarder.py` with a transport-injected `KafkaTerminalEventForwarder`,
  the topic literal declared EXACTLY ONCE as `STEEL_MATCH_TERMINAL_TOPIC = "onex.evt.steel-onslaught.match-terminal.v1"`
  and referenced by that symbol at the publish site (never a free string, per the gate ruling that the
  exact literal go through the governed topic-registration surfaces), a 4-class terminal whitelist over
  the full SOEventType enum, match_id-keyed partitioning, and a single-line-rollback subscription in `match/composition.py`.
  Live proof already banked by the accepted OMN-15172 acceptance battery — 376 event_ledger rows on that
  exact topic, offsets 38-413 contiguous, all 60 published match_ids carrying exactly 4 events each, consumer
  group Stable at LAG 0, all 4 terminal events forwarded 30/30 in both corners. That runtime evidence
  is NOT re-probed here: it requires .201 lane access, and every check in this contract is deliberately
  hosted-runnable, so the runtime facts are cited to the OMN-15172 receipt rather than restated as a check
  that a hosted runner could not execute. Every check below is pinned to the merge SHA and was executed
  GREEN at authoring time.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "events"
  - "topics"
evidence_requirements:
  - kind: "ci"
    description: "steel PR #218 is MERGED on jonahgabriel/steel_onslaught main at merge commit f378cd48"
    command: "gh pr view 218 --repo jonahgabriel/steel_onslaught --json state,mergeCommit"
emergency_bypass:
  enabled: false
  justification: ""
