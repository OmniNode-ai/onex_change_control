  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a ticket Linear records as blocking a walk earns a pill on that walk's row whatever its age and whether or not its text names the walk -- falsifier: python3 -m pytest tests/scripts/test_sprint_board_data.py -k TestWalkPills reporting any failure
      - id: "AC2"
        statement: |-
          AC2: a blocking relation gates the whole walk and names no criterion, so its gate entry carries an empty acs and the verdict reason reads "open and blocking this walk" rather than naming an AC -- falsifier: python3 -m pytest tests/scripts/test_sprint_board_data.py -k TestWalkVerdict reporting any failure, or a gate derived from a blocks edge carrying an AC number
      - id: "AC3"
        statement: |-
          AC3: an open blocker makes a closed, fully ticked walk read FAIL, and a completed blocker lets the same walk read PASS -- falsifier: python3 -m pytest tests/scripts/test_sprint_board_data.py -k TestWalkVerdict reporting any failure
      - id: "AC4"
        statement: |-
          AC4: only the reverse direction is read, so a ticket the walk itself blocks earns neither a pill nor a gate -- falsifier: python3 -m pytest tests/scripts/test_sprint_board_data.py -k TestWalkPills reporting any failure, or a forward relations edge producing a pill
      - id: "AC5"
        statement: |-
          AC5: the published board carries an OMN-19917 pill on both OMN-20222 and OMN-20223 -- falsifier: a board publish whose generated matrix has no OMN-19917 pill on either dashboard walk row
