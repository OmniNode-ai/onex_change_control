      - id: "AC2"
        statement: |-
          AC2: The same merge moves one lab host's canonical clone of that repo within 30 seconds -- falsifier: the lab host's refresh receipt on the bus names the host, the repo and an after sha equal to the merge sha, read with rpk topic consume
      - id: "AC3"
        statement: |-
          AC3: A burst of five merge events for one repo produces one or two sync runs on a host, never five -- falsifier: uv run pytest tests/unit/clone_refresh_bus -q -k coalesce in omnimarket
      - id: "AC4"
        statement: |-
          AC4: An event whose state is open or closed, or whose repo has no canonical clone on the host, runs no sync and is logged as skipped -- falsifier: uv run pytest tests/unit/clone_refresh_bus -q -k skip in omnimarket
      - id: "AC5"
        statement: |-
          AC5: A remote lane created right after a merge starts its worktree at the merged sha from the host clone and makes no GitHub fetch -- falsifier: the remote-lane receipt names source=host-clone and the lane's gh and git call log on the host holds no fetch of that repo between the merge and the worktree add
      - id: "AC6"
        statement: |-
          AC6: With the bus or the serve process down, the 180 s timer still advances every clone -- falsifier: stop the serve unit, merge one PR, and read a trigger timer ADVANCED line for it in canonical-clone-sync.jsonl within 200 s
