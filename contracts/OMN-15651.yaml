  - id: "dod-core-1541-schema-exact-universe"
    description: >-
      Exact-head source probe proves ModelDelegationRequest.task_type's Literal in model_delegation_wire_request.py
      now carries all 15 Market-authority task classes exactly (was 13, missing documentation + validator_generation).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/models/delegation/wire/model_delegation_wire_request.py?ref=4cb7ba9a6ca1713a692a2b4092f4440e9237ed40' --jq .content | base64 -d | python3 -c 'import sys,re; src=sys.stdin.read(); m=re.search(r"task_type: Literal\[(.*?)\]", src, re.S); members=sorted(x.strip().strip("\"") for x in m.group(1).split(",") if x.strip()); universe={"agent_delegation","code_generation","code_review","complex_reasoning","document","documentation","escalation","planning","reasoning","refactor","research","review","summarization","test","validator_generation"}; assert set(members) == universe, set(members) ^ universe; assert len(members) == 15, len(members); print("OK 15-member Literal matches Market universe exactly")'
