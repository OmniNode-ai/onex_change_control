      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a pure fold over joined delegation and verdict rows computes a DoD pass rate per (task type, tier, model), counts only verdicts whose status decided the run (verified or failed), counts a pass only for outcome done, keeps the latest verdict per delegation run, applies the recency window and lookback, and suppresses a tier only at or above the minimum sample with a pooled rate below the floor -- falsifier: uv run pytest tests/unit/routing/test_dod_overlay.py in omnimarket
      - id: "AC2"
        statement: |-
          AC2: the reader runs the join filtered to one tenant with app.tenant_id set, returns no overlay on a read failure so routing stays static, and raises the missing-tenant refusal before any SQL under enforcement -- falsifier: uv run pytest tests/unit/routing/test_dod_overlay.py -k reader plus a real-Postgres join test in omnimarket
      - id: "AC3"
        statement: |-
          AC3: the deployed-lane routing-intent handler threads the DoD overlay into the routing reducer, logs one line citing each (tier, model) sample count and pass rate, moves the selected tier off a suppressed one, and makes the same decision as before when no reader is wired -- falsifier: uv run pytest tests/unit/routing/test_handler_routing_intent_dod_overlay.py in omnimarket
      - id: "AC4"
        statement: |-
          AC4: the local dispatch-port selector wires the same DoD read, so the bus-less path and the deployed lane consult one signal -- falsifier: uv run pytest tests/unit/routing/test_dod_overlay.py -k port_selection in omnimarket
      - id: "AC5"
        statement: |-
          AC5: on the .201 dev lane the Probe query returns the per-(task type, model) DoD pass rate, and a deployed-lane routing decision log line from the runtime cites that rate for the same task type -- falsifier: the Probe psql on .201 plus docker logs of the routing consumer grepped for the DoD routing line, with a positive control on a known correlation id
