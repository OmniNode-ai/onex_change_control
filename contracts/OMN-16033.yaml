---
schema_version: "1.0.0"
ticket_id: "OMN-16033"
title: "Settle the seam-graph tracing convention and re-score S6 at the pinned ref"
summary: >-
  The delegation seam graph never stated which surface it describes, so edge S6 was unscoreable: its claim
  is true at omnibase_infra upstream HEAD and false at the revision omnimarket resolves, and both trees
  report version 0.38.4 so the version string cannot tell them apart. The decision is convention A, PINNED_REF
  - an edge is scored against the surface that actually executes for omnimarket, which for a dependency
  is the revision resolved from pyproject [tool.uv.sources] plus uv.lock, never that repo's upstream HEAD.
  It is recorded as a top-level tracing_convention object in the graph JSON rather than prose. S6 re-scored
  at the pin measures UNMATCHED severity high, restoring the 2026-08-08 finding. seams.v1.yaml is generated,
  so the graph source was corrected first and scripts/seed_seams_registry.py re-run; exactly one of fifteen
  registry rows changes.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2076 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: >-
      The seam goldens, the gates suite and both registry suites pass against the re-derived registry,
      including the tautological-observation guards that forbid a NOT_CLAIMED-only module from supplying
      an observed projection.
    command: "uv run pytest tests/gates/ tests/seam_goldens/ tests/test_seams_registry_contract.py tests/test_seams_registry_match_integration.py
      -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
