  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: An append to the rolling ledger whose row type is outside the canonical set is refused with a non-zero exit, the message names the allowed types and the canonical type the legacy one maps to, and nothing is written -- falsifier: uv run pytest tests/test_ledger_lock_row_grammar.py -q with a positive and a negative case per rule
      - id: "AC2"
        statement: |-
          AC2: A canonical row missing a required field is refused and the message names the missing field; MSG and ACK require from, to and id, ACK requires re, HOLD requires id and a scope field, RELEASE requires re, and an id that cites a line number is refused -- falsifier: uv run pytest tests/test_ledger_lock_row_grammar.py -q
      - id: "AC3"
        statement: |-
          AC3: A MSG or ACK row carrying consent-shaped content is refused -- falsifier: uv run pytest tests/test_ledger_lock_row_grammar.py -q -k consent
      - id: "AC4"
        statement: |-
          AC4: ledger_lock.py --print-grammar emits the grammar as JSON from the committed module, the single source other tools cite -- falsifier: python3 scripts/ledger_lock.py <ledger> --print-grammar piped to python3 -m json.tool exits 0 and lists ten or more types
      - id: "AC5"
        statement: |-
          AC5: Rows already in the ledger are never re-validated, and every reader that closes or indexes rows (ruling guard, claim index, reconciler, workflows) still reads legacy rows -- falsifier: uv run pytest tests/test_ledger_lock_ruling_guard.py tests/test_claim_index.py tests/test_ledger_reconcile.py -q
      - id: "AC6"
        statement: |-
          AC6: A human grammar reference with the legacy to canonical mapping is published in knowledge-base-internal reference/ledger-row-grammar.md -- falsifier: git -C $KNOWLEDGE_BASE_INTERNAL_PATH show origin/main:reference/ledger-row-grammar.md exits 0
