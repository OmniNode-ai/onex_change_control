  - id: "dod-b11-19256-ac6-grammar-reference-published"
    description: |-
      AC6 proof (evid-B11-2a21, OMN-17427). A live readback of knowledge-base-internal reference/ledger-row-grammar.md at ref main: the file exists, carries a Legacy to canonical mapping section, and every legacy type that section lists maps to the same canonical type as omnibase_internal's committed legacy_type_map (at least twenty rows, none disagreeing). The check prints how many of the committed map's entries the page lists.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          env -u PYTHONPATH uv run --project "${OMNIBASE_INTERNAL_HOME:-${OMNI_HOME}/../omnibase_internal}" python -c '
          import base64, json, re, subprocess
          from omnibase_internal.ledger import ledger_grammar as g
          raw = json.loads(subprocess.check_output(["gh", "api", "repos/OmniNode-ai/knowledge-base-internal/contents/reference/ledger-row-grammar.md?ref=main"]))
          doc = base64.b64decode(raw["content"]).decode()
          sec = doc.split("## Legacy to canonical mapping", 1)[1].split("\n## ", 1)[0]
          rows = {}
          for line in sec.splitlines():
              m = re.match(r"\|\s*([A-Z][A-Z0-9_-]*)\s*\|\s*\d+\s*\|.*\|\s*(.+?)\s*\|\s*$", line)
              if m:
                  rows[m.group(1)] = m.group(2)
          known = [k for k in rows if k in g.LEGACY_TYPE_MAP]
          bad = [k for k in known if g.LEGACY_TYPE_MAP[k] not in rows[k]]
          print(raw["path"], "size", raw["size"], "| legacy rows in doc", len(known), "of", len(g.LEGACY_TYPE_MAP), "| disagreeing with the committed map", bad)
          assert len(known) >= 20 and not bad
          '
    binds_ac:
      - "AC6"
