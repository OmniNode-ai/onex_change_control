    acceptance:
      - id: "AC1"
        statement: |-
          AC-1: The hourly host maintenance converge pulls /data/omninode/omni_home so its ledger tracks the published tip — falsifier: a converge tick completing with the clone's HEAD unchanged while the remote has advanced, which is today's behaviour and is the red test
      - id: "AC2"
        statement: |-
          AC-2: Every .201 reader of the ledger asserts the age of the file's last row and emits a red ledger stale row once it exceeds two hours, rather than rendering recent rows as absent — falsifier: a reader returning a clean or empty verdict against a ledger whose newest row is older than two hours
      - id: "AC3"
        statement: |-
          AC-3: The staleness verdict is derived from the last row's own timestamp, not from file mtime — falsifier: a touched-but-unchanged file reading as fresh
      - id: "AC4"
        statement: |-
          AC-4: The converge writes as the clone's owner, not as root — falsifier: any root-owned path under that clone's .git after a converge tick
      - id: "AC5"
        statement: |-
          AC-5: A reader that cannot find or parse the ledger at all emits the same red row rather than silence — falsifier: a missing file producing no row, which is the false zero that found this ticket
