      so unlike its predecessor this cannot expire. The `--watch` of the original is deliberately not
      reproduced: a blocking poll inside an evidence probe hangs the executor.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-supersede-003-pr3040-occ-cascade-only"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_infra/commits/6706fc109ac171cdf3509f206382261868674e63/check-runs?per_page=100" --jq '[.check_runs[]] | group_by(.name) | map(max_by(.started_at)) | map(select(.conclusion | IN("success","skipped","neutral") | not)) | length == 0' | grep -qx true
