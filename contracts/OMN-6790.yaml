      cascade cleared, `CI Summary` went green on run 33324340197 job 99307966267, and #3040 merged. This
      entry makes the STRONGER, unqualified claim the original boilerplate was reaching for — on the reviewed
      head 6706fc109ac171cdf3509f206382261868674e63, taking the LATEST attempt per check name, there is
      not one check run whose conclusion is outside {success, skipped, neutral}. No exclusion list, no
