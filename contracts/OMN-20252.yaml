schema_version: "1.0.0"
ticket_id: "OMN-20252"
title: "Source-bound evidence for the OMN-20252 receipt honesty classifier fix"
summary: >-
  Companion evidence for the OCC source change in PR #12115. The fast changed-path classifier now uses
  the same frozen scanner-retirement classification as the authoritative corpus gate, while unknown and
  mutated identities remain fail-closed.
contract_completeness: ENRICHED
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-changed-path-classifier-parity"
    statement: >-
      The fast changed-path receipt honesty gate must apply the frozen corpus scanner-retirement rule
      to the same immutable origin receipt identity and exact bytes. Unknown identities, pending receipts,
      copied identities, and mutated retired bytes remain findings.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: A selected receipt retired by the frozen origin scanner yields the same finding classification
          in changed-path evaluation as in corpus evaluation. Falsifier: `uv run --locked pytest tests/unit/validation/test_receipt_honesty_ratchet.py::test_changed_gate_tolerates_only_exact_scanner_retired_identity
          -q` fails, or an exact frozen retired receipt remains an unexpected fast-gate finding.
      - id: "AC2"
        statement: >-
          AC2: Mutating a frozen scanner-retired receipt does not inherit retirement, and a new or unknown
          identity remains fail-closed. Falsifier: `uv run --locked pytest tests/unit/validation/test_receipt_honesty_ratchet.py::test_changed_gate_rejects_mutated_scanner_retired_receipt
          -q` admits the mutation.
evidence_requirements:
  - kind: "tests"
    description: "The complete receipt honesty ratchet suite passes at the exact source tree."
    command: "uv run --locked pytest tests/unit/validation/test_receipt_honesty_ratchet.py -q"
  - kind: "tests"
    description: "The exact scanner-retired identity selector passes at the source PR tree."
    command: "uv run --locked pytest tests/unit/validation/test_receipt_honesty_ratchet.py::test_changed_gate_tolerates_only_exact_scanner_retired_identity
      -q"
  - kind: "tests"
    description: "The mutated retired receipt selector remains fail-closed at the source PR tree."
    command: "uv run --locked pytest tests/unit/validation/test_receipt_honesty_ratchet.py::test_changed_gate_rejects_mutated_scanner_retired_receipt
      -q"
  - kind: "ci"
    description: "The authoritative frozen receipt corpus classifier passes at the exact source tree."
    command: "uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --corpus"
  - kind: "ci"
    description: "The changed-path and corpus classifier wiring check passes at the exact source tree."
    command: "uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --check-wiring"
  - kind: "ci"
    description: "Each corpus-confirmed retired receipt identity is accepted by the fast changed-path
      gate."
    command: "uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --changed
      drift/dod_receipts/OMN-12659/dod-precommit/command.yaml"
  - kind: "ci"
    description: "The OMN-7466 local-verification retired identity is accepted by the fast changed-path
      gate."
    command: "uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --changed
      drift/dod_receipts/OMN-7466/dod-omnimarket-pr-951-local-verification/command.yaml"
  - kind: "ci"
    description: "The OMN-9743 pre-commit retired identity is accepted by the fast changed-path gate."
    command: "uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --changed
      drift/dod_receipts/OMN-9743/dod-precommit/command.yaml"
  - kind: "ci"
    description: "All required OCC pre-commit hooks pass on the clean source commit."
    command: "uv run --locked pre-commit run --all-files"
  - kind: "ci"
    description: >-
      Hosted Tests, Type Check, and Pre-commit jobs pass on the actual e804 source PR workflow run; the
      relevant source and test blobs are independently confirmed identical to the source-bound c1 tree.
    command: "gh run view 36853236339 --repo OmniNode-ai/onex_change_control --json headSha,jobs"
  - kind: "ci"
    description: "The source and test blobs on c1 and the hosted e804 commit are identical."
    command: >-
      git ls-tree c1fb0f65bdad745455a21c1ccdad3ac7470049cf -- src/onex_change_control/validation/receipt_honesty_ratchet.py
      tests/unit/validation/test_receipt_honesty_ratchet.py && git ls-tree e80414b52d70a7f6f75104279c2c0f9c81abb1fa
      -- src/onex_change_control/validation/receipt_honesty_ratchet.py tests/unit/validation/test_receipt_honesty_ratchet.py
