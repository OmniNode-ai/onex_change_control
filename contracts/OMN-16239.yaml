ticket_id: "OMN-16239"
title: "OCC evidence for OMN-16239"
summary: >
  Manual OCC companion for OmniNode-ai/omnibase_infra PR #2803 (resolve ProjectionTableTarget schema through
  physical_schema_mapping at SQL emission). ProjectionTableTarget carried the raw contract schema straight
  into the schema-qualified SQL built by _execute_upsert/_execute_query, while the grant check ran the
  same declaration through physical_grant_schema_for_table() -- so for every relation still under the
  OMN-15359 relocation bridge, grant validation passed against the physical schema while the statement
  that actually executed named the declared one. The fix resolves the physical schema exactly once in
  _resolve_projection_database_target and feeds both the grant check (threaded in as grant_schema, replacing
  its own second resolution) and the emitted SQL from that single value. Records a RED-before/GREEN-after
  differential as two independently falsifiable single-command source probes, each pinned to an immutable
  git blob: the buggy form present at the merge-base and absent at head, and the fixed form absent at
  the merge-base and present at head. Hand-authored rather than waiting on the live occ_companion_emitter:
  the born-path call-occ-autobind run (32228344745) for this PR sat QUEUED for over an hour behind an
  omnibase_infra backlog that grew 192 -> 247 while queued, so the canonical producer was not converging.
is_seam_ticket: true
