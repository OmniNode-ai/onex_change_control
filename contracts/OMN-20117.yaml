    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a delegate-skill command whose orchestrator restarts between intake and inner completion ends with exactly one delegate-skill terminal on the bus, completed when the inner result arrives after restart, otherwise failed with a typed failure cause naming the restart -- falsifier: a pytest in omnimarket node_delegate_skill_orchestrator that replays intake, restarts the handler state, then delivers or withholds the inner completion and counts terminals
      - id: "AC2"
        statement: |-
          AC2: a delegate-skill command still in flight when its bound expires is terminalised failed with that typed cause, and the cause is in the contract terminal_failure_cause enum -- falsifier: a pytest in omnimarket that advances the clock past the contract bound with no inner completion and asserts the failed terminal and its cause
      - id: "AC3"
        statement: |-
          AC3: on the lab dev lane, a warm runtime restart issued while an onex delegate request is in flight returns a typed failed or completed reply to the CLI instead of a silent timeout -- falsifier: onex delegate from a lab host with a runtime restart issued mid-flight, reading the CLI exit and the delegate-skill terminal for its correlation id
