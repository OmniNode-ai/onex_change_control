---
schema_version: "1.0.0"
ticket_id: "OMN-15449"
title: "OCC companion for OMN-15449"
summary: >
  Hand-authored OCC Evidence-Source companion for the two-repo OMN-15449 fix (dod_verify's cross-ticket
  contamination false-Done vector). The writer half (RuntimeLocal stamps a run_id into workflow_result.json,
  OmniNode-ai/omnibase_core#1561) and the reader half (receipt_mode.py refuses on a run_id mismatch/absence,
  OmniNode-ai/omnibase_infra#2796) are two separate PRs by design — the reader PR is opened as a DRAFT
  and is intentionally blocked on the writer PR merging and releasing before it can come out of draft;
  this contract cites both PRs' current heads as the evidence available today, not a claim that either
  has merged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1561 CI checks"
    command: "gh pr checks 1561 --repo OmniNode-ai/omnibase_core"
  - kind: "ci"
    description: "PR #2796 CI checks (draft)"
    command: "gh pr checks 2796 --repo OmniNode-ai/omnibase_infra"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_core-pr-1561"
    description: "PR #1561 on OmniNode-ai/omnibase_core — Evidence-Source binding."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1561 --repo OmniNode-ai/omnibase_core --json number,state,headRefName"
  - id: "dod-omnibase_core-pr-1561-run-id-stamp"
    description: >
      Content-bound behavioral probe confirming RuntimeLocal._write_state actually stamps run_id into
      workflow_result.json at the PR's head ref — the writer half of the anchor-join fix, not just a touched
      file (OMN-15309 admissibility: reads product content at a pinned ref, not PR/issue metadata).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "body=\"$(gh api repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/runtime/runtime_local.py?ref=7b07c723ecf48f6166579be1f6c4ce22df7f6fa0
          --jq .content | base64 -d)\" && printf '%s' \"$body\" | grep -qF '\"run_id\": str(self.run_id)'"
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2796"
    description: >
      PR #2796 on OmniNode-ai/omnibase_infra — Evidence-Source binding. DRAFT: this repo's own OMN-13873
      gate forbids a git-source bridge override to the not-yet-released core fix, so the PR necessarily
      pins the currently-published omnibase-core release and cannot merge until PR #1561 above merges
      and releases. The evidence below binds to the PR's current head, not to a merge or release state.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr view 2796 --repo OmniNode-ai/omnibase_infra --json number,state,headRefName,isDraft"
  - id: "dod-omnibase_infra-pr-2796-fail-closed-join"
    description: >
      Content-bound behavioral probe confirming _verify_workflow_data_identity's fail-closed comparison
      (workflow_result.json's stamped run_id must equal the current invocation's own) is actually present
      at the PR's head ref, not just described in the PR body.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "body=\"$(gh api repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/cli/receipt_mode.py?ref=99404d2b57d2caa10d43e61f04b722994a09aa7f
          --jq .content | base64 -d)\" && printf '%s' \"$body\" | grep -qF 'if stamped == str(run_id):'"
