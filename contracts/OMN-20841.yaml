---
schema_version: 1.0.0
ticket_id: OMN-20841
title: Remote-lane Codex landing step keeps the change when the lab host's commit or push fails
summary: Hand-authored evidence for OmniNode-ai/omniclaude-internal#509 (squash 17ea864ad1e3). AC1 to
  AC5 are bound to their own test selections of tests/test_remote_lane.py, run at the merge commit and,
  as a must-fail control, at the merge parent with the merged tests overlaid. AC6 is bound to a read of
  the pull request body with a control body.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The acceptance criteria this ticket's author declared, transcribed verbatim from the ticket
      body. The ticket body is the source and this block is the copy; each criterion's id is the label
      the sibling binds_ac entry claims.
    acceptance:
      - id: AC1
        statement: 'AC1: a lane whose commit or push fails leaves a durable artifact of its staged change
          on the launching host, named in the receipt with the failure shape -- falsifier: uv run pytest
          tests/test_remote_lane.py -q -k landing_failure_preserves_change'
      - id: AC2
        statement: 'AC2: such a lane''s TERMINAL and parent notice carry a landing-failed status and the
          failure shape -- falsifier: uv run pytest tests/test_remote_lane.py -q -k landing_failure_status'
      - id: AC3
        statement: 'AC3: re-working a held PR branch pushes with force-with-lease against the start head
          and refuses a moved head -- falsifier: uv run pytest tests/test_remote_lane.py -q -k existing_branch_lease_push'
      - id: AC4
        statement: 'AC4: a hook failure the resumed thread leaves unchanged twice in a row stops early
          and reports the hook name -- falsifier: uv run pytest tests/test_remote_lane.py -q -k unchanged_hook_failure_stops'
      - id: AC5
        statement: 'AC5: the landing push and PR open target the repository URL, not a remote name the
          host clone may lack -- falsifier: uv run pytest tests/test_remote_lane.py -q -k landing_pushes_to_repo_url'
      - id: AC6
        statement: 'AC6: the PR body carries a lab readback on h201 showing a hook-refused commit, a refused
          push and one normal landing -- falsifier: the lab line in the PR body names host h201, the three
          runs and their receipts'
evidence_requirements:
  - kind: tests
    description: The Codex landing-failure tests of tests/test_remote_lane.py pass at the merge commit.
    command: uv run --no-project --python 3.13 --with-requirements tests/skill_suites_requirements.txt
      python -m pytest -q tests/test_remote_lane.py -k 'landing_failure or existing_branch_lease_push
      or unchanged_hook_failure_stops or landing_pushes_to_repo_url'
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20841-ac1-landing-failure-preserves-change
    description: 'AC1: tests/test_remote_lane.py -k landing_failure_preserves_change passes at the merge
      commit (3 tests) and fails on the merge parent with the merged tests overlaid.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: |-
          M=17ea864ad1e395112680c8fe8c79cf6331a53af7
          P=b8bd50ca93acf48943045e3feed66df93b5b98ed
          gh api repos/OmniNode-ai/omniclaude-internal/commits/$M --jq .sha || exit 2
          git cat-file -e $M^{commit} || exit 2
          git cat-file -e $P^{commit} || exit 2
          fix="$(mktemp -d)" || exit 2
          base="$(mktemp -d)" || exit 2
          trap 'rm -rf "$fix" "$base"' EXIT
          git archive $M | tar -x -C "$fix" || exit 2
          git archive $P | tar -x -C "$base" || exit 2
          git show $M:tests/test_remote_lane.py > "$base/tests/test_remote_lane.py" || exit 2
          run() { d="$1"; shift; (cd "$d" && env -u PYTHONPATH uv run --no-project --python 3.13 --with-requirements tests/skill_suites_requirements.txt python -m pytest -q -p no:cacheprovider -p no:randomly "$@" 2>&1 | tail -n 1); }
          merged="$(run "$fix" tests/test_remote_lane.py -k landing_failure_preserves_change)"
          echo "merged $M: $merged"
          case "$merged" in *passed*) ;; *) exit 1;; esac
          case "$merged" in *failed*|*error*) exit 1;; esac
          parent="$(run "$base" tests/test_remote_lane.py -k landing_failure_preserves_change)"
          echo "merge parent $P with the merged tests: $parent"
          case "$parent" in *failed*) ;; *) exit 1;; esac
        cwd: ${OMNI_HOME}/omniclaude-internal
    binds_ac:
      - AC1
    ac_bindings:
      - label: AC1
        criterion_hash: 6b195a9e65ae33a4afe6951909a3f50717c2a39f961d0495c803ba61527b72ac
        proposed_by: lane=contracts-merged-5d21
