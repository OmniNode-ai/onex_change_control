  - id: dod-omn20841-ac6-pr-body-lab-readback
    description: 'AC6: the body of omniclaude-internal#509 carries Lab lines for host h201 showing a hook-refused
      commit (shape commit-hook-unchanged), a refused push (shape push-non-fast-forward) and one normal
      landing (landing_failure=null), and the body of omniclaude-internal#508 does not satisfy the same
      check. The body names the runs by their proof labels and their outputs; it names a receipt directory
      for one run only, and the accepting lane decides whether that meets ''and their receipts''.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          gh api repos/OmniNode-ai/omniclaude-internal/commits/17ea864ad1e395112680c8fe8c79cf6331a53af7 --jq .sha || exit 2
          check() { printf '%s\n' "$1" | grep -c '^Lab: host=h201 ' | awk '$1 >= 3 { ok = 1 } END { exit !ok }' && printf '%s\n' "$1" | grep -q 'landing_failure shape=commit-hook-unchanged' && printf '%s\n' "$1" | grep -q 'landing_failure shape=push-non-fast-forward' && printf '%s\n' "$1" | grep -q 'landing_failure=null'; }
          body="$(gh api repos/OmniNode-ai/omniclaude-internal/pulls/509 --jq .body)" || exit 2
          other="$(gh api repos/OmniNode-ai/omniclaude-internal/pulls/508 --jq .body)" || exit 2
          echo "h201 Lab lines in pull request 509: $(printf '%s\n' "$body" | grep -c '^Lab: host=h201 ')"
          echo "h201 Lab lines in pull request 508: $(printf '%s\n' "$other" | grep -c '^Lab: host=h201 ')"
          check "$body" || exit 1
          if check "$other"; then echo "control failed: a body without the readback satisfied the check"; exit 1; fi
          echo "pull request 509 body names host h201, a hook-refused commit (commit-hook-unchanged), a refused push (push-non-fast-forward) and a normal landing (landing_failure=null); the control body does not"
