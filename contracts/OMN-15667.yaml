  that same record. Frozen public Core names/fields sourced from Linear comment cfb64e0f-c2e6-4ae2-94cf-308c7e1a1efb
  on OMN-15666, matched field-for-field against the R2 harness pin (omni_worktrees/OMN-15663/omninode_infra-renewal/tests/fixtures/omn_15663_r2/target_models.py,
  READ-ONLY).
