---
schema_version: "1.0.0"
ticket_id: "OMN-17961"
title: "A0 compile-only dependency and ownership gate"
summary: >-
  Records the bounded, fail-closed A0 preflight for the forward-migration descriptor-provider plan. The
  authority pins are independently hash-matched, the compile-only ticket-pipeline request is compiled
  without a runtime observation, and implementation readiness remains blocked pending owner-supplied inputs
  and parent-object reachability in an implementation checkout. No provider, database, deployment, image,
  service, or child runtime action is authorized or claimed.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: >-
      The A0 checklist records all implementation repositories and their owner boundaries: omnibase_core
      owns the canonical logical overlay and capability contracts; omnibase_spi remains only the existing
      secret-store protocol and is not a materializer or child-handoff authority; omnibase_infra owns
      provider-specific descriptor composition and the sole child-side MigrationRunnerCredentialAdapter
      to the parent RunnerCredentialDescriptor/PGPASSFILE seam; and omnimarket contributes vendored migration
      inputs whose complete bundle identity must be proven before handoff. Every edge refuses closed on
      a missing typed input, and no environment or compatibility fallback is permitted.
  - kind: "manual"
    description: >-
      The A0 checklist classifies immutable plan authorities and the explicit parent authority/capability/secret
      union plus single descriptor-to-runner adapter seam as supplied. Parent-object reachability in an
      implementation checkout, core overlay semver and cutover, migration-image and descriptor-format
      owners, journal persistence owner, target identity and provenance, provider registry and capability
      allowlist, immutable image, complete migration bundle, mount policy, and child attestation trust/transport
      remain blocked or owner-supplied. No value is inferred.
  - kind: "ci"
    description: >-
      Pinned authority probes confirm the exact private plan PR head and blob hash plus the exact public
      parent plan commit, path, and blob hash; a mismatch fails the gate.
    command: >-
      gh pr view 142 --repo OmniNode-ai/knowledge-base-internal --json headRefOid --jq .headRefOid | grep
      -Fx 10b1b7850bbc1cc374db70706375a08eda4ce80c && gh api -H 'Accept: application/vnd.github.raw+json'
      'repos/OmniNode-ai/knowledge-base-internal/contents/beta/plans/2026-09-05-forward-migration-contract-descriptor-provider-plan.md?ref=10b1b7850bbc1cc374db70706375a08eda4ce80c'
      | shasum -a 256 | awk '$1 == "c68ba4c7ec728a9cda045f628016181fa3fa1dbc0fab3043d0da6565190a321d"
      && $2 == "-" {found=1} END {exit !found}' && gh api repos/OmniNode-ai/knowledge-base/commits/1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c
      --jq .sha | grep -Fx 1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c && gh api -H 'Accept: application/vnd.github.raw+json'
      'repos/OmniNode-ai/knowledge-base/contents/plans/2026-09-05-prepush-migration-bounded-db-runner-replacement.md?ref=1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c'
      | shasum -a 256 | awk '$1 == "8e35bfac55404e8b1c25b45722138df8526ff9ec0bbc4ce61a525ea7f3c65793"
      && $2 == "-" {found=1} END {exit !found}'
  - kind: "tests"
    description: >-
      The canonical ticket-pipeline adapter accepts the bounded dry-run request in compile-only mode and
      emits runtime-evidence/v2 with status=compiled, runtime_observation.status=UNOBSERVED, and reason=compile_only.
    command: >-
      gh api repos/OmniNode-ai/omnimarket/commits/b87de14494eed6dc559d693eba6098ca05deed88 --jq .sha |
      grep -Fx b87de14494eed6dc559d693eba6098ca05deed88 && tmp="$(mktemp -d)" && gh repo clone OmniNode-ai/omnimarket
      "$tmp" -- --filter=blob:none --no-checkout && git -C "$tmp" checkout --detach b87de14494eed6dc559d693eba6098ca05deed88
      && (cd "$tmp" && env -u PYTHONPATH uv run python scripts/run_codex_runtime_request.py --compile-only
      --command-name ticket_pipeline --payload '{"correlation_id":"6e851124-12c8-4d75-80c3-02e80a791d69","ticket_id":"OMN-17961","skip_test_iterate":false,"dry_run":true,"requested_at":"2026-09-05T15:52:42Z"}'
      --timeout-ms 600000)
emergency_bypass:
