      Hosted CI verifies the exact public parent plan commit, path, and blob hash. The matching receipt
      records the private plan PR head/blob from the local Done gate; it proves remote reachability only,
      and parent-object reachability in an implementation checkout remains blocked.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/knowledge-base/commits/1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c --jq
          .sha | grep -Fx 1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c && gh api -H 'Accept: application/vnd.github.raw+json'
          'repos/OmniNode-ai/knowledge-base/contents/plans/2026-09-05-prepush-migration-bounded-db-runner-replacement.md?ref=1f0baa0d0b41a89b72c78a5017244ae12d0d5d5c'
          | shasum -a 256 | awk '$1 == "8e35bfac55404e8b1c25b45722138df8526ff9ec0bbc4ce61a525ea7f3c65793"
          && $2 == "-" {found=1} END {exit !found}'
  - id: "dod-a0-compile-only-ticket-pipeline"
