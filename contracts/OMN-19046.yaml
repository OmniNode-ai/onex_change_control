---
schema_version: 1.0.0
ticket_id: OMN-19046
title: Contracts enumerate no acceptance criteria, so the DoD-to-Linear serializer has no input
summary: |-
  OMN-18270 landed the writer that renders a contract's
  requirements[].acceptance[] into a ticket's acceptance-criteria section, and
  it could not repair a single ticket: 0 of 9,275 contracts carried a
  requirements key. This gives the writer its first input, on the ticket the
  operator named as the first case, and proves the whole path end to end
  against the validator that actually blocks merges.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: |-
      The C6 contract's model and its binding agree, the rendered section reads
      back through the OMN-18236 reader as the eight labels the contract binds,
      and the merge-blocking validator refuses the body as it was and passes the
      serialized one with no hand edit between the two runs.
    command: uv run pytest tests/test_omn_19046_c6_contract_binds_its_own_model.py -q
  - kind: tests
    description: |-
      The OMN-18270 serializer and the OMN-18236 binding gate are unchanged by
      this addition; no source file is touched by this change at all.
    command: uv run pytest tests/test_omn_18270_ac_section_serializer.py tests/test_omn_18236_ac_criteria.py
      tests/test_omn_18236_ac_binding_acceptance.py -q
  - kind: ci
    description: PR CI checks green
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: the-binding-finally-has-a-model
    description: |-
      The defect this ticket closes, asserted on the live contract rather than
      on a fixture copy of it. From PR #9240 on 2026-09-12 until now,
      contracts/OMN-18167.yaml bound AC1..AC8 against a model that enumerated
      nothing -- what the 2026-09-12 closeout adjudication called "eight names
      with no referents". Equality is asserted in BOTH directions deliberately:
      a criterion nothing binds is itself a refusal under
      ac_binding_criterion_unbound, so padding the model to cover one of the
      bound check's provenance pins would break the contract rather than
      improve it. The falsifier leg is included in the same item because a
      criterion with no named falsifier is prose that reads like a requirement,
      which is the failure mode one level up from the one being fixed.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_every_bound_label_is_enumerated_by_the_models_own_criteria
          tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_each_criterion_names_the_check_that_would_settle_it
          -q
  - id: the-gate-flips-across-serialization
    description: |-
      The load-bearing end-to-end claim, driven through
      check_contract_ac_bindings -- the validator that blocks merges -- and not
      through the reader it is built on. The "after" body is taken from
      plan_acceptance_criteria_update rather than typed into the test, so no
      hand edit can sit between the refusal and the pass; that gap is exactly
      how a repair gets credited to a process a person actually performed. The
      pre-serialization body is the real one, fetched from Linear, so the
      refusal being reproduced is the refusal that was actually there.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_the_gate_refuses_the_body_as_it_was_and_passes_the_serialized_one
          tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_the_rendered_section_reads_back_as_the_eight_labels_it_binds
          -q
  - id: the-write-was-additive-on-a-ticket-already-done
    description: |-
      OMN-18167 was Done before this change and is Done after it. A serializer
      that reflowed the body would rewrite a closed ticket's history for a
      cosmetic reason, so the original text is asserted to survive as a literal
      PREFIX rather than merely to be present somewhere -- "still in there
      somewhere" is what a reflow also satisfies.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_serialization_only_appends_and_leaves_the_prose_byte_for_byte
          -q
  - id: binding-survives-linears-normaliser
    description: |-
      The finding only an actual write could produce, pinned so it cannot
      regress silently. OMN-18270 never wrote to Linear, so nobody had seen a
      managed section come back. Linear rewrites it on save: "- " bullets become
      "* " and _emphasis_ becomes *emphasis*. The criterion text is untouched
      and the reader's list-item grammar accepts either bullet, so the eight
      labels still resolve and the gate still passes. The fixture is the real
      post-write body, so this asserts what Linear actually stores rather than
      what a normaliser was assumed to do. The failure mode it guards is silent:
      if the reader ever narrowed to one bullet character, every serialized
      ticket in the corpus would resolve to zero criteria while looking
      perfectly serialized in the UI.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_19046_c6_contract_binds_its_own_model.py::test_the_gate_still_passes_the_body_after_linear_normalised_it
          -q
  - id: no-source-file-is-touched-by-this-change
    description: |-
      The scope claim, made mechanical. This change is a contract, a test and
      two fixtures; it adds no producer, no generator and no ingest step,
      because none is needed to make this ticket work -- the model is authored
      and the BODY is what a process writes. Asserting the absence of a src/
      diff is also what keeps this PR out of the privileged-path rule, which
      would otherwise refuse it as human-authored.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: test -z "$(git diff --name-only origin/dev...HEAD -- src/ scripts/ .github/)"
  - id: the-producer-reproduces-its-split-and-refuses
    description: |-
      Added by a certifying second actor, which is not the lane that built the
      producer. The four items above certify the hand-authored C6 contract that
      came first; nothing in this contract covered the producer itself, so the
      change that makes the corpus-wide repair possible had no evidence of its
      own.

      THE CLAIM. Run as a dry run against ticket bodies fetched live from the
      tracker, the producer plans a fill for every bound contract whose
      criteria it can derive unambiguously, and REFUSES the rest by name rather
      than writing a plausible model over them. The refusals are the load-
      bearing half: a backfill that guessed would leave a corpus that looks
      repaired and is not, which is the failure one level up from the empty
      model this ticket exists to fill.

      MEASURED BY THE CERTIFYING ACTOR, 2026-09-22, against bodies fetched from
      the tracker that same day, over the bound corpus at this head: 361
      changed, 4 unchanged, 8 refused. That reproduces the producing lane's
      reported split exactly, under that lane's own file selection -- every
      contract file carrying a binds_ac key, 373 of them. Two numbers around
      it did NOT reproduce and are corrected here rather than left standing:
      the denominator is 373 files, not 374, and only 370 of those carry a
      NON-EMPTY binds_ac, so under the stricter reading the split is 361 fill,
      1 agree, 8 refuse. The three extra agreements are files whose binds_ac
      is empty, which agree vacuously rather than because a model matches a
      binding. The fill count and the refusal count, which are the load-bearing
      figures, are identical under both readings.

      EACH OF THE 8 REFUSALS WAS CORROBORATED INDEPENDENTLY, through the
      repository's own criterion reader and hash function rather than through
      the producer's planner, so the second reading cannot inherit a planner
      bug: 4 stale pins (OMN-18033 AC1 and AC2, OMN-18399 AC1 through AC3,
      OMN-18402 AC3 and AC4, OMN-18655 AC1 -- each label recomputed and
      compared to its recorded pin), 2 bindings with no criterion under the
      bound label (OMN-18747 binds a label its body does not declare, OMN-19056
      binds two), and 2 bodies carrying two criteria that resolve to one label
      (OMN-18508 and OMN-18802, both located line by line in the fetched body).
      All 8 are real defects in the corpus, not producer noise, and none is in
      any backfill batch.

      WHAT THE CHECK BELOW RUNS, and why it is not the dry run itself. A dry
      run needs live tracker bodies and a credential the DoD runner does not
      hold, so a check shaped that way would be red for a reason unrelated to
      the producer -- a check that cannot pass is worse than one that cannot
      fail. The check instead executes the producer's refusal and idempotence
      behaviour over the fixtures in this same change: the absent body, the
      bound label the body lacks, the two criteria collapsing to one label, the
      stale pin, the current pin that must NOT be mistaken for a stale one, the
      annotation outside the section that is not a duplicate at all, the
      arbitration when a pin matches one of two candidates, running it twice,
      and a body whose bullets the tracker renormalised. Every one of those is
      a rule the corpus measurement above exercised for real, and each fails
      individually if the rule regresses.
    source: manual
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_19046_ac_requirements_backfill.py::TestItRefusesRatherThanGuess
          tests/test_omn_19046_ac_requirements_backfill.py::TestItIsIdempotentThroughTheReader tests/test_omn_19046_ac_requirements_backfill.py::TestItDoesNotOverwriteAnAuthoredModel
          -q
  - id: the-src-diff-is-exactly-the-producer
    description: |-
      Appended by the certifying second actor, and it SUPERSEDES
      no-source-file-is-touched-by-this-change rather than editing it, so that
      item's own bytes and its existing receipt are left untouched.

      WHY IT HAD TO BE SUPERSEDED. That item asserts this change touches no
      source file at all, and measured at this head the assertion is simply
      FALSE: the producer lives in src/, so the item's own check exits 1 and
      the contract BLOCKs. It was not wrong when it was written. It was written
      for the earlier change on this ticket, which was a contract, a test and
      two fixtures, and it correctly recorded that that change added no
      producer. This ticket then acquired a second change that deliberately
      adds one, and a single contract cannot carry both claims. A claim whose
      subject has moved is not repaired by deleting it; it is repaired by
      stating the claim the current change can actually make.

      WHAT SURVIVES, which is the half that was load-bearing. The original item
      was never really about the number zero. It was a BLAST-RADIUS claim, that
      nothing in src/ moved except what this ticket is for. That claim is still
      true here and is still mechanical, so it is asserted directly: the set of
      paths this branch changes under src/, scripts/ and .github/ is EXACTLY
      the two producer modules, compared as a sorted set rather than as a
      count, because a count passes just as happily when one expected file is
      absent and one unexpected file is present.

      WHAT IS HONESTLY LOST. The superseded item's second sentence noted that
      an empty src/ diff also kept the pull request out of the privileged-path
      rule. That is no longer true and is not claimed: this change touches a
      privileged path, and it is opened through the writer-App dispatch path
      for exactly that reason. Recording the loss here rather than dropping the
      sentence, because a supersession that quietly sheds half a claim is how a
      contract gets weaker while every check stays green.

      CONTROLS RUN BY THE APPENDING ACTOR. The command exits 0 at this head.
      With either expected path removed from the comparison string it exits 1,
      and with a third path added it exits 1, so the equality is doing the work
      rather than the substring.

      WHY THE PATH LIST COMES FROM THE FORGE AND NOT FROM `git diff`, which is
      the second defect this item had to fix rather than inherit. The first
      version of this check read the same set with
      `git diff --name-only origin/dev...HEAD`, exactly as the item it
      supersedes does. That form is measured GREEN locally and, in CI, prints
      `fatal: origin/dev...HEAD: no merge base` and exits 1 -- the checkout
      there is shallow, so the merge base does not exist in it at all. The
      check was therefore not measuring the property in CI; it was erroring,
      and its exit code happened to look like a verdict. The superseded item
      carries the SAME latent defect, which means its red in CI was never
      evidence about the source diff either. Reading the changed-file list from
      the forge's own pull-request API needs no history depth, so it cannot be
      silenced by a shallow clone; and because it reports the pull request's
      files rather than the runner's checkout, a truncated or unresolvable
      response fails the equality rather than emptying it into a pass.
    source: manual
    evidence_artifact: supersedes_dod_evidence:no-source-file-is-touched-by-this-change
    checks:
      - check_type: command
        check_value: test "$(gh api repos/OmniNode-ai/onex_change_control/pulls/10756/files --paginate
          --jq '.[].filename' | grep -E '^(src|scripts|[.]github)/' | sort | paste -sd, -)" = "src/onex_change_control/scripts/backfill_ac_requirements.py,src/onex_change_control/serialization/ac_requirements.py"
