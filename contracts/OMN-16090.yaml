schema_version: "1.0.0"
ticket_id: "OMN-16090"
title: "OCC evidence for OMN-16090 — hook-event-capture gateway contract (FENCED)"
summary: >
  OCC companion for OmniNode-ai/omninode_infra PR #914. Adds the hook-event-capture workflow type to the
  gateway catalog (landing FENCED) and the array-aware payload validation it depends on, so 1931 hook/skill
  events stranded in a local emit spool have a contract-governed path to the cloud that adds no new API
  route and never lets a caller name a topic.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  # A new public workflow_type on POST /v1/workflows (public_api), bound to a new
  # onex.cmd.* command topic constant (topics), with a new wire payload
  # passthrough spec on the canonical command envelope (envelopes).
  - "public_api"
  - "topics"
  - "envelopes"
evidence_requirements:
  - kind: "ci"
    description: "PR #914 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
