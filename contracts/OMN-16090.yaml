      line reads `tenant` at the PR's merge-base (88f62b95) and `public` at its head (0189536f) -- the
      exact `hook_events` schema-mismatch fix OMN-16090 describes. File confirmed to contain exactly one
      `schema:` line, so the grep is unambiguous.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          base_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_hook_event_capture/contract.yaml?ref=88f62b95047b28f94d3b20f24fcf04f95a03bf8d"
          --jq .content | base64 -d)"; head_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_hook_event_capture/contract.yaml?ref=0189536ffe24364e4f051e2de0bc604a9a39b92c"
          --jq .content | base64 -d)"; printf '%s' "$base_body" | grep -qF 'schema: tenant' && ! printf
          '%s' "$base_body" | grep -qF 'schema: public' && ! printf '%s' "$head_body" | grep -qF 'schema:
          tenant' && printf '%s' "$head_body" | grep -qF 'schema: public' && echo "OMN-16090-PR-2103-DIFFERENTIAL-PROBE-PASS:
          hook_events contract schema is tenant at merge-base and public at head"
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2787-real"
    description: >
      PR #2787 on OmniNode-ai/omnibase_infra -- replaces the pre-existing dod-OmniNode-ai-omnibase_infra-pr-2787
      entry above (same bare `gh pr view --json number,state` inadmissibility as the omnimarket-2103 companion).
      Real differential over docker/catalog/database-topology/onex-dev.yaml via the GitHub contents API:
      finds `hook_events`' first occurrence in each blob, then the nearest following `schema:` line (the
      grant block's own field, always after `objects:`/`privileges:` in this catalog's block order) --
      that line reads `schema: tenant` at merge-base (b99e1a9a) and `schema: public` at head (550758e0),
      confirmed against the two raw fetched blobs, not asserted from the PR description.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          base_body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/catalog/database-topology/onex-dev.yaml?ref=b99e1a9a90dcf889ef4e77d02b52845b85bb3a8c"
          --jq .content | base64 -d)"; head_body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/catalog/database-topology/onex-dev.yaml?ref=550758e02a681231eb5f83a794674f79f0015b53"
          --jq .content | base64 -d)"; base_line="$(printf '%s' "$base_body" | grep -n 'hook_events' |
          head -1 | cut -d: -f1)"; head_line="$(printf '%s' "$head_body" | grep -n 'hook_events' | head
          -1 | cut -d: -f1)"; base_schema="$(printf '%s' "$base_body" | awk -v s="$base_line" 'NR>=s &&
          /schema:/{print; exit}' | tr -d ' ')"; head_schema="$(printf '%s' "$head_body" | awk -v s="$head_line"
          'NR>=s && /schema:/{print; exit}' | tr -d ' ')"; [ "$base_schema" = "schema:tenant" ] && [ "$head_schema"
          = "schema:public" ] && echo "OMN-16090-PR-2787-DIFFERENTIAL-PROBE-PASS: hook_events' nearest
          enclosing schema: line is tenant at merge-base and public at head"
