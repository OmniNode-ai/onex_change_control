        check_value: "body=\"$(gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_hook_event_capture/migrations/0001_create_hook_events.sql?ref=8043d3d9f3de945c30e612a696be0db5e98f6d09
