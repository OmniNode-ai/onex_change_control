      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a shared, reusable anti-growth CI check (pluggable parser per validator, fails on growth vs merge-base, passes on decrease) is wired as a required job for each of the six largest-baseline validators (onex_change_control supersession-binding 2344, omnibase_core pydantic extra=forbid 1086, omnimarket dependency-health 584, onex_change_control yamlfmt contamination 517, omnimarket state-coverage 496, onex_change_control orphan corpus 440) -- falsifier: a test per wired validator that raises its baseline by one fails the check and the unmodified baseline passes, run with uv run pytest <test path> -q in each repo
      - id: "AC2"
        statement: |-
          AC2: each of the six wired checks appears in its repo's required CI summary roster or required status checks on the default branch -- falsifier: gh api repos/OmniNode-ai/<repo>/commits/<head>/check-runs --paginate --jq '.check_runs[].name' lists the new job name for the PR head
      - id: "AC3"
        statement: |-
          AC3: every one of the 22 warn-only-but-required validators from list B is resolved to either blocking or removed-from-required-with-a-stated-reason, never left required-and-unable-to-fail -- falsifier: python3 -c "import yaml; d=yaml.safe_load(open('reference/validator-catalogue.yaml')); bad=[x['id'] for x in d['validators'] if x['required'] and x['flags'].get('warn_only')]; assert not bad, bad" against the catalogue re-read after the PRs land
      - id: "AC4"
        statement: |-
          AC4: no PR in this body of work lowers an anti-growth baseline without a fix for the debt it recorded landing in the same PR -- falsifier: git show <pr head> -- <baseline file> shows a decreased or unchanged value only alongside a non-baseline-file diff in the same commit range; a bare baseline decrease with no other changed file is absent
