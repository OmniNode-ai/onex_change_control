---
schema_version: "1.0.0"
ticket_id: "OMN-20039"
title: "Run OCC Tests in parallel and reuse the yamlfmt corpus scan"
summary: |-
  The OCC Tests job runs pytest workers with loadfile distribution, while the yamlfmt
  contamination test module reuses its cached corpus scan. This is CI tooling internal
  to onex_change_control; it changes no cross-repository seam or public interface.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: >-
      The yamlfmt contamination test module collects all its tests under the configured parallel loadfile
      distribution (the full module run is executed by the CI Tests job).
    command: >-
      uv run pytest tests/unit/scripts/test_yamlfmt_contamination_gate.py --collect-only -q -p no:randomly
      -n 2 --dist loadfile
  - kind: "ci"
    description: >-
      The Tests workflow contains one parallel pytest invocation using loadfile distribution.
    command: >-
      grep -cF 'pytest -n auto --dist loadfile' .github/workflows/ci.yml
  - kind: "ci"
    description: >-
      The development dependency group declares pytest-xdist.
    command: >-
      grep -cF 'pytest-xdist>=3.6.0' pyproject.toml
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
