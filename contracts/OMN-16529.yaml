schema_version: "1.0.0"
ticket_id: "OMN-16529"
title: "Off-box onex delegate never engages the platform Kafka bus — probe authority determination fix"
summary: >-
  probe_kafka's AUTHORITATIVE tier (omnibase_infra/src/omnibase_infra/backends/backend_probe.py) compared
  the caller's dialed bootstrap host string against the broker's advertised listener host. For a Tailscale/MagicDNS-fronted
  broker (e.g. .201's dev-lane redpanda) dialed by its plain LAN IP, the broker always advertises its
  MagicDNS hostname back, never the caller's dialed IP — so this check can never pass for an off-box caller
  no matter how healthy the broker genuinely is (live-reproduced: pinned at HEALTHY, reason "broker mismatch",
  100% reproducible). Fix: probe_kafka gains an authority_topic param; a live Stable consumer group bound
  to that topic (matched via the .__t.<topic> scope suffix every derive_consumer_group_id -minted group
  ID carries) is sufficient for AUTHORITATIVE ahead of the broken broker-identity check — real wiring-truth
  liveness, works identically on-box or off-box. resolve_default_bus (omnibase_infra/src/omnibase_infra/cli/cli_delegate.py)
  wires the delegation command topic through as authority_topic. Client-tooling CLI change (onex delegate)
  — no live deployed server/container is redeployed by this fix; the checks below are content-bound probes
  against the pushed PR head commit (OMN-14051 hermetic/compute-only shape).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
