      - id: "AC4"
        statement: |-
          AC4: two concurrent acquirers racing on one expired claim never delete a fresh claim the other just wrote -- falsifier: uv run pytest tests/unit/hooks/test_pr_claim_registry_expired_reclaim.py -k race -q
