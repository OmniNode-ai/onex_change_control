        check_value: |-
          gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/beta/requirements/2026-09-04-beta-prd.md?ref=6900b1cbc2cd5b45f76fb6410ce6e6ccfc82f455' --jq '.content' | base64 -d | grep -F '| 11 | G2 |' | grep -F 'OMN-18054'
  - id: "ac3-prd-row-11-cites-omn-18052"
    description: >-
      AC3 binding. Reads the immutable merged PRD carrier and requires the row-11 record itself to cite
