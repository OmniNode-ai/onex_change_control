---
schema_version: "1.0.0"
ticket_id: "OMN-18052"
title: "C27 row 11 probe: a clean machine installs the published package"
summary: >
  OCC evidence contract for OmniNode-ai/knowledge-base-internal PR #318. Filed in response to the in-progress-probe-hygiene
  sweep, which recorded that this ticket declared no executable close probe and was therefore invisible
  to the evidence closer rather than failing it. The checks below execute the guide's own CLAIM against
  the live package index, not merge state.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #318 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "manual"
    description: |-
      The correction this ticket makes is a factual claim about the published package: that
      `omnimarket` no longer excludes CPython 3.13. That is checkable against PyPI, so the
      probe reads the index rather than re-reading the sentence.
    command: |-
      curl -sf https://pypi.org/pypi/omnimarket/0.4.41/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['requires_python'])"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  # OMN-14051: the live index read is NON-HERMETIC — a CI runner has no route for
  # it, so as a contract check it could never pass and would block the PR with a
  # runtime error even when the work is real. The probe therefore runs OUT OF
  # BAND and is recorded in the receipt (probe_command / probe_stdout /
  # exit_code / status), and the contract check greps that receipt. The evidence
  # is unchanged — it is the live index read either way; only where it executes
  # moves.
  - id: "dod-omn-18052-no-upper-interpreter-bound"
    description: >-
      The published omnimarket 0.4.41 declares requires-python with NO upper bound. This is the claim
      the guide correction rests on, executed against the live package index — if the bound ever returns,
      this check goes red and the guide is wrong again.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          grep -q '^status: PASS$' "$CONTRACT_REPO_DIR/drift/dod_receipts/OMN-18052/dod-omn-18052-no-upper-interpreter-bound/command.yaml"
  - id: "dod-omn-18052-guide-states-no-upper-bound"
    description: >-
      The corrected paragraph is present in guides/customer-getting-started.md at the PR head — the guide
      now says what the index says.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=6900b1cbc2cd5b45f76fb6410ce6e6ccfc82f455' --jq '.content' | base64 -d | grep -c 'with no upper bound'
  - id: "dod-omn-18052-prd-row-11-carries-the-probe"
    description: >-
      The beta PRD row 11 records the probe result rather than a Done-carrier list, which is the 2026-09-08
      ruling this row was the first to close under.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/beta/requirements/2026-09-04-beta-prd.md?ref=6900b1cbc2cd5b45f76fb6410ce6e6ccfc82f455' --jq '.content' | base64 -d | grep -c 'Python 3.13.15'
  - id: "occ-self-bind-pr-8775"
    description: |-
      OCC self-binding receipt for PR #8775, the in-repo evidence PR carrying this contract.
      Binds OMN-18052 to the OCC PR by pr_number so eligibility can resolve a PASS receipt
      for the evidence PR itself.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 8775 --repo OmniNode-ai/onex_change_control --json number,state,headRefName
  - id: "ac1-clean-published-install-and-cli-version"
    description: >-
      AC1 binding. Creates a fresh temporary tool directory outside every checkout, installs the published
      omnibase-core package with the documented omnimarket companion, executes the installed onex CLI,
      and verifies that the printed version equals the installed distribution version. The onex cloud
      help assertion proves the companion command is present in that same clean tool environment. A package-manager
      download cache may be reused; no environment or installed tool is.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: |-
          EVIDENCE_SOURCE=repos/OmniNode-ai/knowledge-base-internal/commits/6900b1cbc2cd5b45f76fb6410ce6e6ccfc82f455 OMN_18052_LIVE_PYPI=1 uv run pytest tests/integration/test_omn_18052_clean_published_install.py -q
  - id: "ac2-delegation-half-owned-by-omn-18054"
    description: >-
      AC2 binding for the criterion's explicit deferral alternative. Reads the immutable merged PRD carrier
      and requires its row-11 statement to name OMN-18054 as the later credential criterion that must
      clear before the delegation half can run; the same ownership sentence is now closer-visible in the
