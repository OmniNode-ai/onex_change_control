      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a deploy job's own rewrite of workspace/sibling-pin-comparison.json and workspace/sibling-vcs-provenance.json does not, by itself, block the next self-update boundary. Falsifier: a test runs a job that rewrites both files, then calls self_update and asserts it proceeds (pulls/re-execs when the clone is genuinely behind origin/<tracking ref>), rather than skipping on the tracked-diff check.
      - id: "AC2"
        statement: |-
          AC2: a self-update skip caused by a tracked modification names which file(s) are dirty in its journal line, distinguishably from a skip caused by the kill-switch (DEPLOY_AGENT_NO_SELF_UPDATE=1) or skip=True. Falsifier: the journal line for both cases reads identically, so a lane cannot tell "genuinely can't safely pull" from "will always be dirty by design" without reading git status by hand, as runtime-train had to here.
      - id: "AC3"
        statement: |-
          AC3 (positive control): a REAL uncommitted change to a file the agent does not itself generate as a byproduct still blocks self-update. Falsifier: the fix widens the exemption past the specific generated-byproduct files and stops protecting genuine uncommitted work, regressing the OMN-16442 guard it extends.
