      | grep -c ''resolveConfiguredTenant() ?? catalogue.tenant'''
  - kind: ci
    description: The omnimarket local dashboard catalogue declares the tenant it serves at the PR head
      and not at the merge base.
    command: 'gh api -H ''Accept: application/vnd.github.raw'' "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_local_dashboard_serve_effect/handlers/handler_local_dashboard_serve.py?ref=49f6a112645c15f582f8df34ee4bd4db2107110a"
      | grep -c ''"tenant": tenant,'''
