ticket_id: "OMN-15730"
title: "CI concurrency auto-cancel stopgap — onex_change_control + omnibase_infra"
summary: >-
  Stopgap fix for the 2026-08-08 CI gridlock: every `pull_request`-triggered workflow in onex_change_control
  and omnibase_infra gets a top-level `concurrency` block keyed by `${{ github.workflow }}-${{ github.event.pull_request.number
  || github.ref }}` with `cancel-in-progress: true`, so a superseded push cancels its own prior check
  wave instead of leaving it queued to compete for saturated runner capacity. Self-contained OCC-side
  code change lands in this same PR (#6190); the omnibase_infra half lands in a sibling PR (#2682). This
  is the STOPGAP, not the end-state (durable fix tracked separately per the OMN-15730 ticket body's STOPGAP-vs-END-STATE
  split).
