title: "DLQ depth monitor and baselines scheduler resolve the dev-lane broker from the lane declaration
  on the deploy runner"
summary: >
  OCC companion for OmniNode-ai/omnibase_infra PR #3362. Bound by hand (union-resolve) because the autobind
  producer mints nothing today (OMN-18073), the same reason OCC#8760 and OCC#8782 were hand-minted in
  this window. dlq-depth-monitor.yml (added 93c42ada4, PR #2946, OMN-16769) had NEVER passed: 545 runs
  since 2026-08-28T05:17:29Z, 543 failure, 2 cancelled, 0 success, every one raising "Unable to bootstrap
  from [('localhost', 19092, AF_UNSPEC)]" at handler_dlq_depth_monitor.py:156. The zero is not vacuous
  - the same success filter returns 1246 for runner-routing-audit.yml and 1394 for runtime-rebuild-trigger.yml.
  baselines-scheduler.yml carried the identical defect and its last 8 scheduled runs were all failure.
  The ticket's original causal claim (the runner selector was repointed after the workflow was authored)
  is FALSIFIED by the chronology: the org routing variable was already ["ubuntu-latest"] at 2026-08-27T04:36:53Z,
  the workflow merged 2026-08-28T02:27:16Z about 22 hours later, and its first run was already hosted
  and already red. There was no regression; it shipped broken, merged green because its own CI never runs
  it, and its red therefore carried zero information for its entire existence - so onex.dlq.omnibase-infra.quarantine.v1,
  the ~8.88M-record sink that hid the OMN-16767 delegation outage, was never measured. Three compounding
  causes are fixed together: (1) runs-on read the trusted-CI routing variable resolving to ubuntu-latest,
  and the omnibase-ci label the old comment named would not have worked either because those runners are
  containers with no host networking and no extra_hosts - the constraint is NETWORK NAMESPACE, not trust,
  so runs-on is now the literal [self-hosted, omnibase-deploy]; (2) the KAFKA_BOOTSTRAP_SERVERS default
  fired unconditionally because no secret of that name exists at repo scope (7 secrets, positive control
  total_count == 7) or org scope (positive control - the same read did return the two SASL names), and
  the ~/.omnibase/.env sourcing is a no-op on both runner classes; (3) OMN-18012 Phase B enabled SASL/SCRAM-SHA-256
  on the .201 dev-lane external listener at ~2026-09-07T16:40Z and neither workflow injected the four
  variables build_aiokafka_auth_kwargs_from_env reads, so a runner-only fix would have moved the failure
  from Errno 111 to an auth failure. Both workflows now resolve address AND transport from omnimarket
  config/ci_bus_lanes.yaml through load_lane_transport, which raises rather than returning a default;
  the SCRAM principal arrives as step environment from the org secrets, by name, never argv. scripts/run_baselines_batch_compute.py
  loses its own DEFAULT_BOOTSTRAP_SERVERS and gains build_confluent_auth_config_from_env. NO runner-routing
  variable was touched at any of the six scopes (OMN-16682 single-owner; hosted routing is asserted intent
  per config/runner_routing_policy.yaml expected_json, which is unmodified), no .201 lane, listener, credential
  or DLQ topic was mutated, and rule 22 is respected - nothing rotated, re-issued, revoked or minted,
  and no secret value read, printed or decoded.
