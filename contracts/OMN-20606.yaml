      - id: "AC5"
        statement: |-
          AC5: on the dev-202 lane a forced failing first attempt followed by its fallback leaves a fallback row whose parent_correlation_id is the failed row's correlation_id -- falsifier: the Probe line above, run on h202 against the dev-202 postgres
