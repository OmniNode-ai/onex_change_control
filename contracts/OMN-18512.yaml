  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: which environment provides the workflow agent's onex is established and stated before any fix -- falsifier: a comment names the resolved interpreter path and the environment it belongs to, for both the CLI and hooks environments, and says which one the workflow agent was reaching; a conclusion drawn without both paths read fails this criterion
      - id: "AC2"
        statement: |-
          AC2: a workflow agent resolves the CLI from a declared location, not from an ambient PATH -- falsifier: the resolution site is cited by file and line, and removing the ambient entry from the agent's shell leaves the command still resolvable
      - id: "AC3"
        statement: |-
          AC3: an unreachable delegation chain is reported in the run's own output rather than absorbed -- falsifier: a run with the binary deliberately unresolvable names the absent command and the location searched, and its report does not present the fallback's output as a delegation result; RED first against today's behaviour
      - id: "AC4"
        statement: |-
          AC4: a successful delegation is distinguishable from a fallback in the recorded output -- falsifier: two runs, one delegated and one fallen back, differ in a field a reader can branch on; a pair that differ only in latency fails this criterion
      - id: "AC5"
        statement: |-
          AC5: the fallback still produces the work -- falsifier: the unreachable-chain run completes its task and reports the degradation, rather than failing the sweep; a fix that turns a working fallback into an outage fails this criterion
      - id: "AC6"
        statement: |-
          AC6: gh pr checks green on the pull request before merge, or any red context named and attributed -- falsifier: the squash sha and check summary cited on this ticket
