---
schema_version: "1.0.0"
ticket_id: "OMN-17491"
title: "Branch-protection audit must preserve the review-gated OCC main"
summary: >-
  onex_change_control main deliberately requires approving and code-owner review as the anti-self-issue
  anchor for its governance files. The generic audit still asserted the solo-dev invariant on every main,
  so it reported this required protection as a failure. The audit now has an explicit review-gated-main
  set: onex_change_control main must report both GraphQL requiresApprovingReviews=true and requiresCodeOwnerReviews=true,
  while ordinary repositories and all dev branches retain their existing solo-dev assertion. This change
  updates only the audit and its tests; it does not mutate branch settings.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Review-gated OCC main passes only when both approving and code-owner reviews are enforced;
      ordinary repo behavior remains unchanged."
    command: "uv run pytest tests/test_audit_branch_protection_release_synced.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-review-gated-main-tests"
    description: >-
      The focused behavioral suite drives the real shell audit with a stubbed gh. It proves the OCC main
      review-gated positive path, rejects approving reviews without code-owner reviews, and preserves
      the ordinary-repository CI Summary and solo-dev assertions. The GraphQL fixture includes the authoritative
      requiresCodeOwnerReviews field used by the script.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/test_audit_branch_protection_release_synced.py -q
  - id: "dod-review-gated-main-static-quality"
    description: >-
      The changed shell script parses successfully, the focused test module passes Ruff checks, and the
      candidate diff has no whitespace errors.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          bash -n scripts/audit_branch_protection.sh && uv run ruff check tests/test_audit_branch_protection_release_synced.py
          && git diff --check
