  - id: "dod-omn17740-dod3-blast-radius-zero"
    description: |-
      DoD 3, blast-radius half. The round trip above was safe to run because the added key reaches no workload. Measured before the write, not assumed: namespace onex-dev carries 24 Deployment/StatefulSet/DaemonSet workloads and ZERO of them carry the secrets.infisical.com/auto-reload annotation, so no managed-Secret change can trigger a restart. The managed Secret onex-dev/omniweb-credentials has exactly ONE consumer, Deployment/omniweb, and it binds six named keys through individual secretKeyRef entries (OMNIBASE_INFRA_DB_URL, OMNIWEB_DB_URL, NEXTAUTH_SECRET, KEYCLOAK_SIGNUP_CLIENT_SECRET, NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_HOST) rather than a whole-secret envFrom - so a key the deployment does not name is not injected anywhere at all. No existing key was read for its value, written or touched.
      MEASUREMENT PROVENANCE: the census was first taken BEFORE the write at 14:30:58Z and re-taken cleanly at 14:45:27Z (5be0aa0d-6758-41b7-a6ea-f6b1fc4fe7de) reading 24 workloads / 0 auto-reload both times; the bound check cites the clean invocation because the earlier one exited non-zero on an unrelated later step in the same script, and a check should not read its evidence out of a failed command. POSITIVE CONTROL on the zero: the same census over pod-template annotations finds 2 distinct keys with 15 occurrences of kubectl.kubernetes.io/restartedAt, so the auto-reload zero is a reading rather than a probe that returned nothing.
      CONFIRMED AFTER: ca168465-519f-45cd-a197-25efbb86d13c at 14:41:18Z shows both omniweb pods Running with restartCount 0 and startTime 2026-09-10T00:14:06Z / 00:14:21Z, fourteen hours BEFORE the write - so neither pod restarted during the round trip. The same readback shows all six InfisicalSecret CRs still True on all three conditions, and the managed Secret restored to its exact pre-write key set and version annotation.
    source: "manual"
    status: "verified"
