      - check_type: "command"
        check_value: |-
          env AWS_PAGER= aws ssm get-command-invocation --region us-east-1 --command-id 5be0aa0d-6758-41b7-a6ea-f6b1fc4fe7de --instance-id i-06169517a92b45f86 --query 'StandardOutputContent' --output text | grep -c 'ENVFROM_WHOLE_SECRET_BINDINGS=0 NAMED_KEYREF_BINDINGS=6'
      - check_type: "command"
