  - id: "dod-omn17740-dod5-public-cluster-read"
    description: |-
      DoD 5 - the related public-cluster ticket's Done state reconciled against a live read of the surface it actually names. Read-only SSM 97eba021-aea7-4d85-a2cb-6bc376a17a10 at 2026-09-10T14:38:33Z on EC2 i-0e596e8b557e27785 (omninode-k3s-system-public, node ip-10-40-12-45), --comment omn17740-dod3-dod5. NOTHING on that instance was mutated.
      VERDICT: OMN-16526 is GENUINELY FIXED on its own surface, so this ticket's break is a distinct regression on a different cluster rather than a contradiction of that closure. The CR onex-dev/omniweb-infisical-secret reports LoadedInfisicalToken=True, ReadyToSyncSecrets=True and AutoRedeployReady=True with the message "Last reconcile synced 5 secrets", and the managed Secret onex-dev/omniweb-credentials carries exactly 5 keys (KEYCLOAK_CLIENT_SECRET, KEYCLOAK_SIGNUP_CLIENT_SECRET, NEXTAUTH_SECRET, OMNIBASE_INFRA_DB_URL, OMNIWEB_DB_URL), matching that ticket's stated criterion of five. Names only; no value was read or printed.
      HONEST LIMIT, stated rather than left absent: this is a CONDITION read, not a subsequent-sync proof. The conditions on that cluster last transitioned 2026-08-30T21:06:33Z and a condition does not re-stamp on an unchanged sync, so this readback cannot by itself distinguish a live controller from one that stopped and left True frozen - which is precisely the failure shape DoD 4's gate exists to catch. Proving the stronger property there needs the operator log window on that instance, which is out of this lane's read-only boundary as scoped.
      TWO UNRELATED FAILURES OBSERVED ON THAT CLUSTER, recorded because they were seen, owned by neither this ticket nor OMN-16526 and NOT acted on: dev/omnidash-credentials has LoadedInfisicalToken=False since 2026-08-30T19:48:58Z and ReadyToSyncSecrets=False since 2026-08-20T00:00:10Z ("authentication failed for strategy [UNIVERSAL_MACHINE_IDENTITY]"), and onex-prod/umami-infisical-sync has ReadyToSyncSecrets=False since 2026-08-19T13:16:44Z. The probe key used for DoD 3 was confirmed ABSENT everywhere on this cluster, as it must be - it was never written here.
