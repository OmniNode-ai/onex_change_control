  - id: "dod-omn17740-dod1-stale-consumer-not-stale-secret"
    description: |-
      DoD 1 - the root cause, named and distinguished from the related public-cluster ticket's. The failure was a STALE CONSUMER, not stale secret material: the credentials Secret onex-dev/universal-auth-credentials carries no write after 2026-08-30T09:27:57Z, while the operator that was serving on 2026-08-31T00:00:26Z had been running since 2026-07-28T19:50:32Z and the 2026-09-05T12:03Z repair was a pod restart with NO secret changed. The operator logs in once per CR at container start and never renews (0 of 335 access tokens on this instance carry a renewal), so a write to that Secret is invisible to it for the remaining life of its cached token - the 14.5-hour gap. The bound check re-reads the live SSM readback of 2026-09-10T10:41Z and asserts the Secret's last write is still 2026-08-30T09:27:57Z, which is the half that makes "the consumer was stale" rather than "the material was stale" the true statement. This SUPERSEDES nothing; it attaches the criterion label to evidence the ticket already carried in prose.
    source: "manual"
    status: "verified"
    binds_ac:
      - "DoD1"
    checks:
