        check_value: |-
          env AWS_PAGER= aws ssm get-command-invocation --region us-east-1 --command-id 9633f23e-b92c-4aac-8f50-f12594382094 --instance-id i-06169517a92b45f86 --query 'StandardOutputContent' --output text | grep -c 'CREDENTIALS onex-dev/universal-auth-credentials LASTWRITE=2026-08-30T09:27:57Z'
