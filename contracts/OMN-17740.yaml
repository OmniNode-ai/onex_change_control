  - id: "dod-omn17740-dod3-store-round-trip"
    description: |-
      DoD 3 - the round-trip proof, performed 2026-09-10T14:31-14:41Z by lane omn17740-dod3-dod5 on EC2 i-06169517a92b45f86 (omninode-k3s-dev-system). One throwaway NON-CREDENTIAL key OMN17740_ROUNDTRIP_PROBE was written into the live store at /dev/omniweb/ (project omninode-rw-ht, env dev) through the Infisical API, observed to arrive in the managed Secret onex-dev/omniweb-credentials, then deleted and observed to disappear. The probe value was generated on-cluster and never printed; only its sha256-12 (2396b9221ce5) and length (34) were recorded. Every observation is a read-only SSM send-command with --comment omn17740-dod3-dod5.
      TIMELINE. BASELINE e9f50cd9-b732-41d2-8275-618060ad8f88 at 14:31:55Z: 10 keys, probe absent, annotation W/"secrets-783-30EF734A". WRITE b6df08a2-f08a-4b1e-81c6-c3bf2dbfc450 at 14:33:05Z: HTTP 200, secret version 1, id abf41fa1-3eb7-4602-98a7-634e2649f509. ARRIVAL 6fe26a87-4637-4ec7-9bc8-574e51c178fd at 14:35:40Z: 11 keys, probe present, annotation W/"secrets-843-C9D79881". PERSISTENCE 07c18a8c-876e-4211-af72-dd9161156eb9 at 14:37:40Z: still 11, resourceVersion unchanged at 10492448. DELETE 74c1b0c0-2088-4b88-807c-0b4222953d0d at 14:38:07Z: HTTP 200 on the same secret id. REMOVAL 8cb85767-f5bb-4671-a171-6a44a0d95eee at 14:40:50Z: back to 10 keys, probe absent, annotation back to the byte-identical pre-write W/"secrets-783-30EF734A".
      WHY THE WAIT IS THE EVIDENCE. The CR's resyncInterval is 60 s and the operator logs "Secrets unchanged (server ETag match), skipping reconciliation" on every interval where the upstream ETag has not moved (OMN-15329). A write and a delete inside one 60 s window would therefore prove nothing: the operator would never observe either. So the write was held across THREE reconciles that reported "Successfully synced 11 secrets" (14:33:07Z, 14:34:07Z, 14:35:07Z) and two more before the delete (14:36:08Z, 14:37:08Z), and the removal across three that reported 10 (14:38:08Z, 14:39:08Z, 14:40:08Z). Arrival and removal each crossed at least two FULL intervals.
      This is a live-store round trip and it is NOT a credential action: nothing was rotated, re-issued, revoked or minted, and the key carried no credential value. The store write and delete are the only two mutations this lane performed; both went through the store API, never kubectl.
