      - id: "AC3"
        statement: |-
          AC-3: A new unrouted construction under scripts/ fails at commit rather than being found by the next census. -- falsifier: the same guard test as AC-1 wired as a pre-commit hook and a CI gate in the same pull request, with a positive control asserting it returns non-zero on a planted construction.
      - id: "AC4"
        statement: |-
          AC-4: With the variable set, an operator publisher writes to the prefixed topic and the unprefixed topic's high watermark does not move. -- falsifier: run one publisher against the lab broker with the variable set, then read both topics' high watermarks with authenticated rpk before and after; the prefixed one advances and the unprefixed one does not.
      - id: "AC5"
        statement: |-
          AC-5: The deploy-agent decision above is recorded with its reason. -- falsifier: the pull request body names which of the two options was taken and why; a body that changes deploy-agent behaviour without naming the choice fails review.
