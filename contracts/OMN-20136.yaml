---
schema_version: "1.0.0"
ticket_id: "OMN-20136"
title: "Lock the OCC receipt-honesty ratchet to the uv.lock core scanner"
summary: |-
  The Receipt Honesty Gate stops checking out omnibase_core dev and runs the
  receipt-honesty scanner from the omnibase-core distribution pinned by this
  repo's uv.lock, so CI and pre-commit run one scanner. This is CI tooling
  internal to onex_change_control; it changes no cross-repository seam or
  public interface.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: >-
      The ratchet's wiring check resolves the scanner from the locked omnibase-core distribution and passes.
    command: >-
      uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --check-wiring
  - kind: "tests"
    description: >-
      The R3a gate-validator-ref tests pass, including the guard that the honesty-gate job has no live
      omnibase_core checkout and sets UV_LOCKED=1.
    command: >-
      uv run pytest tests/unit/test_r3a_gate_validator_ref_enforcement_omn15706.py -q -p no:randomly
  - kind: "ci"
    description: >-
      The honesty-gate job in ci.yml sets UV_LOCKED so a stale lock fails closed.
    command: >-
      grep -cF 'UV_LOCKED: "1"' .github/workflows/ci.yml
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "ratchet-wiring-locked-core-scanner"
    description: |-
      The receipt-honesty ratchet wiring check, run from the locked environment,
      reported the core scanner source from the uv.lock-pinned omnibase-core wheel
      and passed.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run --locked python -m onex_change_control.validation.receipt_honesty_ratchet --check-wiring
  - id: "honesty-gate-no-live-core-checkout"
    description: |-
      The R3a gate-validator-ref test module passed, including the OMN-20136 guard
      that honesty-gate checks out no omnibase_core source and sets UV_LOCKED=1.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/unit/test_r3a_gate_validator_ref_enforcement_omn15706.py -q -p no:randomly
  - id: "honesty-gate-uv-locked"
    description: |-
      The ci.yml grep for the UV_LOCKED setting printed 1 in the worktree of the
      OMN-20136 branch.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -cF 'UV_LOCKED: "1"' .github/workflows/ci.yml
