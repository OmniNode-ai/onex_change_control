      - id: "AC2"
        statement: |-
          AC2: the onex-lab render gives omninode-runtime-effects an OMNIMARKET_PROJECTION_RUNTIME_BINDING_OVERLAY file whose database_url_secret_ref is env:OMNINODE_INTERNAL_DB_URL and whose broker is the lab Redpanda, with no inline credential -- falsifier: kubectl kustomize k8s/onex-lab in omninode_infra, then read the rendered effects Deployment env and the rendered binding ConfigMap
      - id: "AC3"
        statement: |-
          AC3: after the lab overlay is applied by the deploy agent, one bus delegation on the onex-lab lane leaves exactly one new row in omninode_internal.delegate_skill_command_claims keyed by its delivery id -- falsifier: the Probe query before and after one delegation submitted with --bus kafka --locus deployed-lane on onex-lab
      - id: "AC4"
        statement: |-
          AC4: the staging overlay (k8s/onex-dev-overlay-dev) sets the same binding only after AC3 is observed, and the staging runtime digest carries the AC1 fix -- falsifier: kubectl kustomize k8s/onex-dev-overlay-dev shows the env on omninode-runtime-effects, and the ledger shows the AC3 readback row timestamped before that PR opened
