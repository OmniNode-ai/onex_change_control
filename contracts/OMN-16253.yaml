ticket_id: "OMN-16253"
title: "onex-prod InfisicalSecret hostAPI points at a namespace that never existed"
summary: >
  Fixes OmniNode-ai/omninode_infra PR #949: every InfisicalSecret CR in onex-prod (omniweb, omniintelligence,
  umami, onex-runtime, omnidash) plus the onex-prod runtime ConfigMap's INFISICAL_ADDR pointed at http://infisical.prod.svc.cluster.local:8080,
  a namespace that has never existed on this cluster (only 'dev' does). DNS never resolved, so onex-prod's
  Infisical sync failed 100% of the time since the namespace's bootstrap (2026-05-25) -- the omniweb-credentials
  Secret never existed there, blocking OMN-16205's cutover pre-flight (verdict: UNSAFE). Corrects all
  6 occurrences to the one real self-hosted Infisical instance (infisical.dev.svc.cluster.local:8080,
  live-verified healthy on onex-dev's own CR). Also adds a regression test covering InfisicalSecret hostAPI
  (the existing test only checked ConfigMap INFISICAL_ADDR string shape, which is why the 85-day-old defect
  was never caught) and corrects that test's stale OMN-12253 docstring claim.
