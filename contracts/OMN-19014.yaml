---
schema_version: "1.0.0"
ticket_id: "OMN-19014"
title: "Raise omnimarket's omnibase_core floor to 0.47.20 so its CI can import the infra runtime at dev"
summary: >
  Hand-authored OCC companion for OmniNode-ai/omnimarket PR #2747, authored on the OMN-15247 path after
  the occ-autobind producer stood down terminally for head 7b313173bdc2849a2441c4cc59fab91a570f04d9. The
  producer's structural pin-only classifier does not recognise tool.uv.override-dependencies as a dependency-pin
  surface, so a diff of pyproject.toml plus uv.lock alone was read as owing evidence nobody had written.
  That classifier gap is filed separately as OMN-19027; this contract supplies the evidence the gate asks
  for, and both checks below are content-bound and derive RED against the merge base 35b30395ae56fa1db28b293c19634b5dca7163c9.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2747 CI checks green"
    command: "gh pr checks 2747 --repo OmniNode-ai/omnimarket"
  - kind: "manual"
    description: |-
      Content-bound proof that the declared floor and the resolved lock both
      name omnibase-core 0.47.20 at the PR head and neither does at the merge
      base. Read from the GitHub contents API at an explicit ref rather than
      from a working tree, so the probe observes the pull request rather than
      the machine running it.
    command: "gh api repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=7b313173bdc2849a2441c4cc59fab91a570f04d9"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnimarket-pr-2747"
    description: >-
      PR #2747 on OmniNode-ai/omnimarket — hand-authored evidence that the omnibase-core floor NAMES 0.47.20
      in both dependency tables at the head and names neither at the merge base.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=7b313173bdc2849a2441c4cc59fab91a570f04d9 --jq '.content' | base64 -d | grep -cF 'omnibase-core>=0.47.20,<0.48.0'
  - id: "dod-omnimarket-2747-lock-resolves-core-0-47-20"
    description: >-
      PR #2747 on OmniNode-ai/omnimarket — hand-authored evidence that uv.lock RESOLVES omnibase-core
      to 0.47.20 at the head, which is the half the range alone never proved and the half CI actually
      installs.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api -H 'Accept: application/vnd.github.raw' repos/OmniNode-ai/omnimarket/contents/uv.lock?ref=7b313173bdc2849a2441c4cc59fab91a570f04d9 | grep -A1 '^name = "omnibase-core"$' | grep -cF 'version = "0.47.20"'
