      reachable by that job's token) — this was confirmed live before this entry was authored: the same
      "Could not resolve to a Repository" error surfaces against that job's token on any command targeting
      the repo, but the job's admissibility classifier treats a bare `gh pr view` probe as non-blocking
      INERT while a `gh api ... | base64 -d | python3` pipeline is classified as an admissible, blocking
      probe — so specifically the second check_value hard-404s in CI, leaving a standing red advisory
      on that job for every future PR touching this contract. Supersession operates at item granularity
      (evidence_collector.py's `supersedes_dod_evidence:<id>` marker resolves a whole dod_evidence id,
      not a single check within one), so this entry supersedes the whole dod-OmniNode-ai-omninode_infra-pr-811-repin
      item rather than only its failing check; that item stays verbatim above for audit and its checks
      are not re-executed once superseded. This entry's own check below re-verifies the superseded item's
      surviving, working first assertion (PR #811 MERGED at the pinned merge commit and base ref), so
      the merged-#811 fact this contract depends on remains live-asserted, not merely narrated. The retired
      digest facts (source_rev 2e5ef7da5d08df9f1bcbe7eff58eed696c14d1e4, runtime digest sha256:5507667152e2dc420fc4dd6bd337f8dbe2ecf592939572dc8f353efb10a05dd6,
      migrate digest sha256:b1e2a561cc48aac49b36b6746f6d2df0afedb4bfa43aacb20f340e1eb4d2f0a2) remain live-verifiable
      against the merged readiness composition document at ref cf9f737c03ffb3e9940c17edc8865c9f0f061655
      by any caller whose token CAN reach the private repo; they are simply no longer asserted by a contract
      check_value that OCC's own compliance job cannot execute.
