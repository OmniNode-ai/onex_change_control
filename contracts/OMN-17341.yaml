evidence_requirements:
  - kind: "ci"
    description: "PR #402 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #402 on OmniNode-ai/omniweb changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (app/(admin)/admin/events/_components/EventsClient.tsx, app/(admin)/admin/waitlist/page.tsx, app/(marketing)/training/get-access/actions.ts, app/(marketing)/waitlist/actions.ts) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
  - kind: "ci"
    description: "PR #1411 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
      Behavior proof for PR #1411 on OmniNode-ai/omninode_infra, derived from the PR's own diff: the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omninode_infra`.
    command: |-
      uv run pytest docker/onex-api/tests/test_gateway_routes.py docker/onex-api/tests/test_platform_admin.py docker/onex-api/tests/test_rate_limiting.py -q
  - kind: "ci"
    description: "PR #1413 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #1413 on OmniNode-ai/omninode_infra changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (k8s/onex-dev-overlay-dev/patches/omniweb-deployment.yaml) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
