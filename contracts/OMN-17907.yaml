  - id: "ac4-never-empty-band-is-pinned"
    description: |-
      Binds AC4 to the check that proves it. NET-NEW; the merged
      `dod-omn17907-ac4-behavior-proof` above is untouched, keeps its receipt and stays in the
      record — merged entries are immutable (Append-Only Gate, ci.yml:1446), and the operator
      ruled 2026-09-10 that a criterion is bound by APPENDING a superseding item, never by
      editing the merged one.

      THE BINDING IS TRANSCRIBED, NOT INFERRED. The test module states the criterion itself, in
      its own docstring at line 3: "OMN-17907 AC4: the 'never empty' deterministic band is
      pinned by a test." So naming AC4 here repeats the module's own statement rather than
      substituting my judgement for it.

      AC4 reads: "One test pinning the raise." `_shape_override_deterministic` raises
      ValueError on an empty or non-list `deterministic` band
      (handler_delegation_routing.py:1014). Before omnimarket#2319 that behaviour rested on the
      reader's eye — correct, and unexercised. The bound check runs the 10 cases that exercise
      it, including the corrected UNCONSTRAINED keying.

      WHY AC1, AC2 AND AC3 ARE DELIBERATELY NOT BOUND HERE. Their evidence lives in
      `test_quality_gate_short_form_deterministic_floor_omn17765.py`, which is a real and
      passing suite — but that module declares no AC labels anywhere. Its single reference to
      this ticket is one prose line, ":213, 'This calls the reducer rather than reconstructing
      it (OMN-17907)'". Binding AC1-AC3 to it would be MY reading of which test covers which
      criterion, which is exactly the surrogate this evidence class refuses. Same call, same
      reason, as the three unbound classes on OMN-18048.

      AC5 IS NOT BINDABLE AT ALL. It is a recorded design decision — keep the raise at request
      time, evidenced by measurement on omnimarket#2319 — not a behaviour a test can execute.
      Pointing binds_ac at a passing test would be a non-probative surrogate.

      NET EFFECT ON THE PROBATIVE RATIO IS ZERO, AND THAT IS MEASURED, NOT SPECULATED. This
      companion mints its own mandatory `occ-self-bind-pr-<n>`, which classifies `surrogate`.
      So one behaviour binding arrives with one counterweight — the arithmetic recorded on this
      ticket in `61b329e1` and ruled on as OMN-18075 ("evidence companions stop minting the
      non-probative self-bind"). Binding AC4 is still correct: the hold this answers is
      `gap_ac_unbound`, which is about which criterion a check proves, not about the ratio.
    source: "manual"
    binds_ac: ["AC4"]
    evidence_artifact: "supersedes_dod_evidence:dod-omn17907-ac4-behavior-proof"
    checks:
