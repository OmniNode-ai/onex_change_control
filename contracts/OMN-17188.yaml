schema_version: "1.0.0"
ticket_id: "OMN-17188"
title: "omnidash first-ever CodeQL scan — 13 alerts dispositioned"
summary: >
  OCC contract for OmniNode-ai/omnidash PR #302. omnidash's first CodeQL analysis returned 13 open alerts.
  Eight were judged reachable-or-cheap and fixed in code (auth-boundary and static/SPA rate limiting,
  log-injection and tainted-format-string on the projection read path, three dead defensive guards); five
  were dismissed through the code-scanning API with written justifications citing the code. The query
  suite was not narrowed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #302 CI checks green"
    command: "gh pr checks 302 --repo OmniNode-ai/omnidash"
  - kind: "tests"
    description: >
      14 new vitest cases land with this change and are the behavior proof for the security fixes. The
      log-injection cases are written as the injection ATTEMPT the flagged code used to permit, asserting
      refusal; the rate-limiting cases pin middleware mount ORDER (a limiter mounted after the auth boundary
      protects nothing) and prove the skipSuccessfulRequests semantics the auth fix depends on. This is
      a hand-authored, ticket-scoped target, not a ticket-independent suite standing in for proof.
    command: "npx vitest run server/projection-utils.test.ts server/__tests__/rate-limiting.test.ts"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
