  - id: "ac5-architecture-no-regression"
    description: >-
      AC5 binding: the epic OMN-16776 architectural no-regression constraint, asserted over this ticket's
      merged omnimarket PRs #2396 (6e6f0d6a), #2560 (60c9a97e) and #2562 (fa7f0d26), and over the tree
      at fa7f0d26, the latest of them. One git command, run in the omnimarket clone, exits non-zero when
      any of three things is true. (1) A merge commit adds a file under scripts/, at the repo root or
      nested (pathspec **/scripts/**, renames counted as additions). (2) src/omnimarket/projection/ contains
      a string literal ending in /metrics, or make_asgi_app, or Instrumentator, which would register a
      metrics route on the projection-api app. (3) A .py file in src/omnimarket/projection/ or src/omnimarket/nodes/node_projection_consumer_flow/
      defines a class named Plugin*, or a class whose base list names Plugin* (on the class line, or on
      its own line in a wrapped base list). The command first resolves all three merge commits and proves
      that both packages are readable at fa7f0d26, so a missing commit or a moved package fails instead
      of passing an empty grep. Negative controls, run against synthetic commits on fa7f0d26 in a throwaway
      clone: a root scripts file, a nested scripts file, a file renamed into scripts/, a /metrics decorator,
      a make_asgi_app mount, an inline Plugin* base, a wrapped Plugin* base, a Plugin*-named class, and
      a removed api_server.py all exit 1. Real commits that add scripts files (65c237cd, 3cb8acce) exit
      1, and an unknown SHA exits 128. The "no polling loop" clause is diff-reviewed and not mechanically
      asserted; no check here claims it. The src/ diffs of all three PRs were read in full: #2396 api_server.py;
      #2560 the consumer-flow contract.yaml, api_server.py, discovery.py and models.py; #2562 contract.yaml.
      #2560's pyproject.toml and uv.lock changes are only the version bump. Every added line, tests included,
      was also searched for while, sleep, poll, asyncio, thread, Timer, schedule, interval, loop and for...in.
      The only matches are for-loops and comprehensions over finite collections: rank tiers, enum values,
      contract topics, rows already fetched for a page, and test fixtures. Not covered: open PR #2566,
      which a later item will bind once it merges. The tree legs also pass at omnimarket origin/dev 1ae66ce1,
      where neither package has changed since fa7f0d26; that run is context only.
    source: "manual"
    status: "verified"
    binds_ac: ["AC5"]
