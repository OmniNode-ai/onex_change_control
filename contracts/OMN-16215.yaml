        check_value: "gh pr view 1562 --repo OmniNode-ai/omnibase_core --json number,state,headRefName"
  - id: "dod-OmniNode-ai-omnibase_core-pr-1562-ci"
    description: "PR #1562 on OmniNode-ai/omnibase_core — product diff scope check (OMN-14425): touches
      only .github/workflows/ci.yml and the new pinning test module, no runtime source."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1562 --repo OmniNode-ai/omnibase_core --json files"
  - id: "dod-omnibase_core-1562-draft-gate-present"
    description: "The draft admission clause is actually present in .github/workflows/ci.yml at PR #1562's
      draft-control commit d11b02feea0afbeb6b7d959cbd2be607ad7df46b — one occurrence on each gated job
      (test-parallel, tests-integration) — proving the mechanism is landed in the workflow file, not just
      claimed in the PR description."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_core/contents/.github/workflows/ci.yml?ref=d11b02feea0afbeb6b7d959cbd2be607ad7df46b" --jq '.content' | base64 -d | grep -c 'github.event.pull_request.draft'
  - id: "dod-omnibase_core-1562-draft-red-control"
    description: "OMN-16215 AC(b), live: at PR #1562's draft commit d11b02feea0afbeb6b7d959cbd2be607ad7df46b
      both Tests Gate and CI Summary concluded `failure`, not `success` and not green-by-skip. The draft
      PR is therefore genuinely un-mergeable against live branch protection — the admission gate does
      not open a skip-vector."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_core/commits/d11b02feea0afbeb6b7d959cbd2be607ad7df46b/check-runs?per_page=100" --paginate --jq '.check_runs[] | select(.name=="Tests Gate" or .name=="CI Summary") | "\(.name)=\(.conclusion)"' | grep -c '=failure$'
  - id: "dod-omnibase_core-1562-gated-jobs-unexpanded"
    description: "OMN-16215 AC(a), live: at the same draft commit the two gated jobs appear as exactly
      two `skipped` check runs whose names still carry the UNEXPANDED `${{ matrix.split }}` placeholder
      (`Tests (Split ${{ matrix.split }}/...)` and `Integration Tests (Split ${{ matrix.split }}/4)`).
      An unexpanded matrix name is the machine-checkable signature that GitHub never fanned the matrix
      out at all — zero of the up-to-40 test-parallel shards and zero of the 4 tests-integration shards
      were ever scheduled, so the draft consumed zero runner minutes on the gated jobs rather than merely
      exiting them early."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_core/commits/d11b02feea0afbeb6b7d959cbd2be607ad7df46b/check-runs?per_page=100" --paginate --jq '.check_runs[] | select(.conclusion=="skipped") | .name' | grep -c 'matrix.split'
