---
schema_version: "1.0.0"
ticket_id: "OMN-16215"
title: "gate expensive CI workflows behind non-draft PR state — omnibase_core"
summary: >
  Central OCC evidence for OmniNode-ai/omnibase_core PR #1562, the omnibase_core arm of the OMN-16214
  org-wide fan-out of the draft-state CI admission gate first proven on onex_change_control#6686 (OMN-15731).
  The PR changes .github/workflows/ci.yml only: the pull_request trigger gains an explicit types list
  including ready_for_review (so undrafting re-evaluates the current head without a new push), and the
  two largest cost drivers -- test-parallel (up to 40 shards x 70m) and tests-integration (4 shards x
  30m) -- each gain a "(github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft)"
  admission clause. The ~50 cheap single-shard quality-gate leaves are deliberately NOT gated (documented
  scoping decision, pinned by a scope-lock test), and main-targeting PRs are untouched so the promotion
  boundary still runs full CI unconditionally. Fail-closed behaviour needed no new code: the gated jobs
  feed Tests Gate, whose existing OMN-15315 per-upstream skip policy treats a skipped upstream as a FAILURE
  unless zone-filter reports docs_only, and Tests Gate is a GATE_JOBS completeness anchor in scripts/ci/ci_summary_gate.py,
  so CI Summary (the sole required dev context) fails closed. PR #1562 was filed as a DRAFT on purpose:
  it is itself the live RED control for acceptance criterion (b).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1562 CI and receipt gates green"
    command: "gh pr checks 1562 --repo OmniNode-ai/omnibase_core"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
