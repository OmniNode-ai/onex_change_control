      predicates so the collector binds (OmniNode-ai/onex_change_control, 6453) at tier 2 and the appended
      live-state assertion probes THIS carrier rather than falling through to the receipt-carrier tier.
      Executor shape: `test` is the first shlex token and no $() contains an embedded quote character.
      KNOWN STRUCTURAL CAVEAT, disclosed rather than hidden: like every per-PR self-bind, this entry is
      authored BEFORE its PR is known to merge, so if #6453 were to close unmerged this stamp would become
