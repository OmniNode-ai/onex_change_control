  - id: "dod-omn15963-retire-autobind-stamp-infra885"
    description: >-
      Retires dod-OmniNode-ai-omninode_infra-pr-885, APPENDED under OCC append-only doctrine rather than
      edited in place: a merged dod_evidence entry is immutable (validator_occ_append_only) and merged
      receipts pin the per-entry hash, so an in-place rewrite trips the gate AND staleness-invalidates
      the receipt binding. Why the retired item can never pass: its id matches the structured dod-<org>-<repo>-pr-<n>
      binding form and its only declared check is `gh pr view 885 --repo OmniNode-ai/omninode_infra ...`,
      so node_dod_verify derives the live-PR binding (OmniNode-ai/omninode_infra, 885) from BOTH the id
      and the same-clause pin and appends a synthetic ::pr-live-state assertion that is VERIFIED only
      when the bound PR is MERGED with green required checks (fail-closed). omninode_infra#885 CLOSED
      UNMERGED at 2026-08-13T18:49:40Z with mergeCommit null, so that assertion can never clear and the
      entry is permanently red. The autobind companion onex_change_control#6406 stamped #885 as the Evidence-Source
      and itself merged at 1c98fab75559fe04a242730c984c475e8840b092, which is the integrity defect this
      entry repairs: a MERGED OCC evidence record bound to a product PR whose diff never reached dev.
      Corrected binding fact asserted here, which is the fact the retired stamp existed to record: the
      gateway-ingress auth surface OMN-15963 tracks landed instead as omninode_infra#884, squash-merged
      at 0fa14c8ff0c3ee85dcf23f65db86abfd561fdeee. This check pins BOTH that exact merge SHA AND state
      MERGED, and additionally asserts via the compare API that #885's preserved head a2545fd7fc3f9a50d4e90a29a88c8eb4c98d69de
      is NOT an ancestor of dev (status=diverged) — so a closed, still-open, or silently-relanded carrier
      each yield a mismatch. RED-proven three ways at authoring time: an all-zero merge SHA exits 1; the
      compare predicate pinned to identical instead of diverged exits 1; the same shape aimed at the dead
      carrier #885 exits 1. HONEST DIVERGENCE FROM THE onex_change_control#5771 PRECEDENT, stated because
      copying that precedent's claim here would be false: that repair could assert the dead carrier's
      head commit was a member of the landing PR's commit set (same content, merged). That does NOT hold
      here. #885's own commits (ba04f4e48c76d204155e98ec44908a92e7b3f25c, a2545fd7fc3f9a50d4e90a29a88c8eb4c98d69de)
      are absent from #884's commit set, and #885's distinctive symbol GATEWAY_ATTACH_PATH is absent from
      dev's docker/onex-api/main.py. #885's diff genuinely did not land in any form. What landed is a
      DIFFERENT and stronger fix for the same defect class: #885 proposed making the three gateway paths
      public at the middleware level by adding them to PUBLIC_V1_PATHS; #884 instead added a separate
      GATEWAY_V1_PATHS set and routes those paths through _resolve_gateway_tenant_from_request inside
      m4_usage_metering_middleware, resolving the tenant from the gateway bearer rather than exempting
      the paths from auth. The bootstrap-circularity defect #885 identified is therefore genuinely closed
      on dev, by different code. This entry claims supersession of the binding, not equivalence of the
      diffs. Executor shape: `test` is the first shlex token and no $() contains an embedded quote character,
      so the pre-execution shape guard (evidence_collector._invalid_check_value_reason, shlex.split(posix=True))
      cannot mis-branch; verified by importing that function directly and applying it to this exact string
      (returned None). PR-binding derivation was likewise verified directly: _hardcoded_pr_bindings_in_value
      returns only (OmniNode-ai/omninode_infra, 884) for this check_value, and this item's own id pins
      no PR number, so the appended live-state probe targets the MERGED carrier and never falls back to
      the dead one. Supersession semantics: the retired entry stays verbatim for audit and resolves to
      status=superseded at runtime; this removes a FALSE green (a merged OCC evidence record vouching
      for unlanded code) and manufactures no new green, since the retired item's own claim is re-asserted
      here against the carrier that actually merged, and this item must itself VERIFY for the retirement
      to take effect at all (_supersession_is_in_effect anti-laundering).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: 'test "$(gh pr view 884 --repo OmniNode-ai/omninode_infra --json mergeCommit --jq
          .mergeCommit.oid)" = "0fa14c8ff0c3ee85dcf23f65db86abfd561fdeee" && test "$(gh pr view 884 --repo
          OmniNode-ai/omninode_infra --json state --jq .state)" = "MERGED" && test "$(gh api repos/OmniNode-ai/omninode_infra/compare/a2545fd7fc3f9a50d4e90a29a88c8eb4c98d69de...dev
          --jq .status)" = "diverged"'
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omninode_infra-pr-885"
  - id: "dod-omn15963-retire-diffscope-stamp-infra885"
    description: >-
      Retires dod-OmniNode-ai-omninode_infra-pr-885-ci — the second of the two entries on this contract
      bound to omninode_infra#885, which CLOSED UNMERGED at 2026-08-13T18:49:40Z — under the same append-only
      supersession mechanism and the same permanently-failing ::pr-live-state root cause as the entry
      above. The retired item is the OMN-14425 product-diff-scope stamp: its recorded probe_stdout enumerates
      three files (docker/onex-api/main.py, docker/onex-api/routers/gateway.py, docker/onex-api/tests/test_gateway_public_v1_paths.py)
      as the product diff backing this ticket. That claim is now false at the only level that matters
      — none of those additions are on dev, because the carrier closed unmerged. A diff-scope stamp that
      survives its own PR's closure asserts product coverage that does not exist, which is a strictly
      worse failure mode than a stale binding: it is the evidence record that a reviewer would read as
      proof the work shipped. Falsifiable content is chosen to discriminate exactly that, rather than
      to re-probe the dead PR: the load-bearing assertion is that GATEWAY_ATTACH_PATH — the symbol #885
      exported from routers/gateway.py and consumed in main.py, and the distinctive marker of #885's approach
      — appears ZERO times in dev's docker/onex-api/main.py, so #885's product diff demonstrably did not
      land; paired with the assertion that GATEWAY_V1_PATHS, the replacement surface, is present in docker/onex-api/main.py
      at #884's immutable merge commit 0fa14c8ff0c3ee85dcf23f65db86abfd561fdeee, so the defect class is
      nonetheless closed. The absence predicate is pinned to the moving ref dev deliberately: if #885's
      approach is ever relanded, this retirement should go red and be revisited rather than silently persist.
      RED-proven two ways at authoring time: flipping the absence predicate to -ge 1 (i.e. claiming #885's
      symbol DID land) exits 1, and pointing the presence predicate at GATEWAY_ATTACH_PATH instead of
      GATEWAY_V1_PATHS at #884's merge commit exits 1. DISCLOSED NEGATIVE-CONTROL LIMIT: the compare-status
      predicate used by the sibling entry above does NOT discriminate a squash-merged carrier, because
      a squash merge also leaves its own head diverged from dev — aiming that predicate at #884's head
      f65a1aecd42249c32df8dbdea559603374a2c090 still exits 0. That is why the content-absence assertion,
      not the compare status, is the load-bearing discriminator on this entry. Executor shape mirrors
      the sibling: `test` is the first shlex token and no $() contains an embedded quote character (verified
      against evidence_collector._invalid_check_value_reason, returned None), and _hardcoded_pr_bindings_in_value
      returns only (OmniNode-ai/omninode_infra, 884) so the appended live-state probe targets the merged
      carrier. The retired entry stays verbatim for audit and resolves to status=superseded at runtime;
      per _supersession_is_in_effect this retirement takes effect only because THIS item verifies in its
      own right.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: 'test "$(gh api -X GET repos/OmniNode-ai/omninode_infra/contents/docker/onex-api/main.py
          -f ref=dev -H Accept:application/vnd.github.raw | grep -c GATEWAY_ATTACH_PATH)" = "0" && test
          "$(gh api -X GET repos/OmniNode-ai/omninode_infra/contents/docker/onex-api/main.py -f ref=0fa14c8ff0c3ee85dcf23f65db86abfd561fdeee
          -H Accept:application/vnd.github.raw | grep -c GATEWAY_V1_PATHS)" -ge "1" && test "$(gh pr view
          884 --repo OmniNode-ai/omninode_infra --json state --jq .state)" = "MERGED"'
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omninode_infra-pr-885-ci"
