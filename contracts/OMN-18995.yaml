    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A refused write is counted and reported. -- falsifier: a writer test driving one advancing and then one non-advancing ingest_sequence through the real upsert asserts the second returns zero written rows and a refusal count of at least 1.
      - id: "AC2"
        statement: |-
          AC2: A successful write reports no refusals. -- falsifier: the same test's first message asserts rows written at least 1 and a refusal count of 0, so the field cannot be a constant.
      - id: "AC3"
        statement: |-
          AC3: The count is the number of rows the guard actually refused, not a boolean in disguise. -- falsifier: a test driving a batch in which some rows advance and some do not asserts the refusal count equals the non-advancing subset rather than 1.
      - id: "AC4"
        statement: |-
          AC4: The floor names an omnibase_infra release carrying the consumer half. -- falsifier: pyproject.toml requires that version or higher and a fresh uv lock --check succeeds; without it the field is sent to a runtime that ignores it and the ERROR keeps firing.
      - id: "AC5"
        statement: |-
          AC5: Lab proof with its positive control. -- falsifier: after deploy, the heartbeat topic's redelivery window shows the INFO line and zero ERROR lines from ConsumerFlowProjectionWriter, while LabLaneHealthProjectionWriter still emits ERROR until OMN-18769 lands. If both go quiet the change suppressed the class rather than classifying it, which is a failure. Consumer half: omnibase_infra#3919. Measurement and rationale: OMN-18992. Related: OMN-18769, OMN-18918.
