  - id: "dod-infra-2956-nullable-adds"
    description: >
      omnibase_infra PR #2956 corrects the consumer-flow reconciliation idiom. #2955 turned the OMN-15376
      static gate green by adding guarded ADD COLUMNs spelled "... NOT NULL", which cannot reconcile a
      drifted table holding rows -- PostgreSQL raises 'column "<col>" of relation "<t>" contains null
      values' and ON_ERROR_STOP=1 kills the migration Job, the same deploy-stopping failure the reconciliation
      exists to prevent. Proven by execution on the .201 dev lane 2026-08-28 against a seeded drifted
      table: dev's 0000 exits 3 on `topic`; #2956's 0000/0001/0002 chain exits 0 and converges 14 and
      7 columns with rows preserved. Proves zero NOT NULL guarded adds remain across all three files at
      the pushed PR head.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          test "$(for f in 0000_create_consumer_flow_windows.sql 0001_reconcile_consumer_flow_window_columns.sql 0002_reconcile_consumer_flow_window_shapes.sql; do gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_consumer_flow/$f?ref=cb645970c26af62513c74b62f96e5a5478debf30" --jq '.content' | base64 -d; done | grep -c 'ADD COLUMN IF NOT EXISTS .* NOT NULL;')" = "0"
  - id: "dod-infra-2956-fence-markers"
    description: >
      omnibase_infra PR #2956 adds the BEGIN/END OMN-15376 fence markers that 0000 and 0001 lacked. Without
      them tests/integration/migrations/test_node_migration_shape_drift_omn15376.py cannot derive the
      pre-fix variant by stripping that region, so this node's migrations sat outside the RED/GREEN execution
      proof entirely even after #2955. Proves both files carry both table markers (4 total) at the pushed
      PR head.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          test "$(for f in 0000_create_consumer_flow_windows.sql 0001_reconcile_consumer_flow_window_columns.sql; do gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_consumer_flow/$f?ref=cb645970c26af62513c74b62f96e5a5478debf30" --jq '.content' | base64 -d; done | grep -c 'BEGIN OMN-15376 shape reconciliation')" = "4"
  - id: "dod-infra-2956-supersession-rows"
