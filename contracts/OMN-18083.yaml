  - id: "ac1-model-and-trigger-job"
    description: >-
      AC1. The landed trigger model accepts the lane's typed projection_readback declaration while retaining
      the later ledger_readback field, and the probative Runtime Rebuild Trigger path completed successfully.
      The source probe is pinned to omnibase_infra#3395's merge, where both fields coexist; checking both
      prevents an older projection-only snapshot from masquerading as current evidence. Run 34403898614
      is deliberately evaluated at job level: its Trigger node_redeploy Start job succeeded after reaching
      overlay validation, while the top-level run failed only in the downstream Verify dev lane applied
      the redeploy job. Treating that top-line failure as the trigger verdict would make good evidence
      red.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC1"
    checks:
      - check_type: "command"
        check_value: |-
          source_body="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/scripts/trigger_rebuild_on_merge.py?ref=f628876c0b58953b28659d744218bca92602c86b' -H 'Accept: application/vnd.github.raw')" && test "$(printf '%s' "$source_body" | grep -cF 'projection_readback: ModelCiBusLaneDsnReference')" = 1 && test "$(printf '%s' "$source_body" | grep -cF 'ledger_readback')" -ge 1 && test "$(gh api 'repos/OmniNode-ai/omnibase_infra/actions/runs/34403898614/attempts/1/jobs' --jq '.jobs[] | select(.name == "Trigger node_redeploy Start") | .conclusion')" = success && printf '%s\n' 'AC1 model-fields=present trigger-job=success'
  - id: "ac2-extra-forbid-test"
    description: >-
      AC2. The merged OMN-18083 regression module contains the named case that exercises an unknown lane
      key and requires the model to reject it. That pins extra="forbid" instead of accepting a repair
      that widens the model to ignore unknown inputs, which would re-open the typo-routing hole the model
      exists to close. The file is read at omnibase_infra#3395's immutable merge commit rather than a
      moving branch.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC2"
    checks:
      - check_type: "command"
        check_value: |-
          test_body="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/unit/scripts/test_omn_18083_lane_model_tracks_the_live_overlay.py?ref=f628876c0b58953b28659d744218bca92602c86b' -H 'Accept: application/vnd.github.raw')" && test "$(printf '%s' "$test_body" | grep -cF 'def test_extra_forbid_is_retained_so_a_typo_is_still_refused')" = 1 && printf '%s\n' 'AC2 extra-forbid-test=present'
  - id: "ac3-live-overlay-binding"
    description: >-
      AC3. The merged regression module contains the named test that validates the trigger model against
      omnimarket's live lane overlay, and the dedicated ci-bus-overlay-binding job succeeded in push run
      34403897618 at the #3371 squash cc8974408. The pair matters: the committed test names the recurrence
      guard, while the job proves the cross-repository input was actually supplied and validated instead
      of the ordinary local no-overlay path being skipped.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC3"
    checks:
      - check_type: "command"
        check_value: |-
          test_body="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/unit/scripts/test_omn_18083_lane_model_tracks_the_live_overlay.py?ref=f628876c0b58953b28659d744218bca92602c86b' -H 'Accept: application/vnd.github.raw')" && test "$(printf '%s' "$test_body" | grep -cF 'def test_the_live_overlay_still_validates_against_this_repos_lane_model')" = 1 && test "$(gh api 'repos/OmniNode-ai/omnibase_infra/actions/runs/34403897618/attempts/1/jobs' --jq '.jobs[] | select(.name == "ci-bus-overlay-binding") | .conclusion')" = success && printf '%s\n' 'AC3 live-overlay-test=present binding-job=success'
  - id: "ac4-no-onset-early-exits"
    description: >-
      AC4. There was no delayed onset to explain. All four apparently green Runtime Rebuild Trigger runs
      in the measured window—34380153311, 34352081911, 34339513322 and 34330947198—printed the exact No
      rebuild trigger early-exit marker and therefore never reached overlay validation. The authoritative
      omnimarket#2420 mergedAt value is 2026-09-09T02:15:02Z, not the previously propagated local-time
      rendering. Together these facts establish that projection_readback was fatal from the overlay's
      landing; the apparent green-to-red transition only separated non-probative early exits from runs
      that actually parsed the overlay. This deliberately does not revive the retracted #3357 correlation.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC4"
    checks:
      - check_type: "command"
        check_value: |-
          for run_id in 34380153311 34352081911 34339513322 34330947198; do gh run view "$run_id" --repo OmniNode-ai/omnibase_infra --attempt 1 --log | grep -qF 'No rebuild trigger: no runtime_change label or runtime path changes detected.' || exit 1; done && test "$(gh pr view 2420 --repo OmniNode-ai/omnimarket --json mergedAt --jq .mergedAt)" = '2026-09-09T02:15:02Z' && printf '%s\n' 'AC4 early-exits=4 overlay-mergedAt=2026-09-09T02:15:02Z'
