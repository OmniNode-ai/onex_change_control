  - id: "dod-OmniNode-ai-omnibase-infra-pr-2570-attempt1"
    description: >-
      Append-only replacement for dod-OmniNode-ai-omnibase-infra-pr-2570. The superseded entry pinned
      a TRANSIENT job state as durable evidence: its check 2 asserted `occ-preflight / eligibility` concluded
      `failure` on omnibase_infra run 30565261108 via the attempt-less /actions/runs/<id>/jobs endpoint,
      which always reports the LATEST attempt. That run was re-run; it is now attempt 2, where the same
      job concluded `success`. The assertion therefore inverted through no fault of the contract, and
      check 2 now BLOCKs deterministically on every OCC PR that carries this contract (observed on OCC#5629
      and OCC#5656). Pinning a red job state to a mutable "latest attempt" view is unsound as a class
      — a legitimate re-run flips it, so the evidence decays the moment anyone retries CI. This replacement
      asserts the SAME AC4 falsifier the superseded entry claimed — that the shared hold gate concluded
      SUCCESS in the SAME CI run in which occ-preflight/eligibility concluded failure, so no unrelated
      upstream failure can cascade-skip it, and the check fails if the gate is ever made needs-gated —
      but binds it to a STABLE fact instead of a transient one. Both legs now read /actions/runs/30565261108/attempts/1/jobs.
      A completed attempt's job records are immutable: a re-run mints attempt N+1 and never rewrites attempt
      N, so the observation this entry encodes cannot be flipped by any later retry. The same-run coupling
      the superseded entry relied on is preserved and tightened to same-run-same-attempt. Shape properties,
      each deliberate and matching the OMN-15430 / OMN-15471 supersession precedent in this repo: SIGPIPE-safe
      — the `gh api` producer is drained into a shell variable before any grep reads it, so a short-circuiting
      `grep -q` cannot kill a streaming upstream under the runner's `bash -o pipefail -c` (the OMN-15411
      / OCC#5496 failure mode the superseded entry's naked-pipe form was exposed to); fail-closed on producer
      failure, because a 404, auth failure or rate-limit leaves the variable empty and `grep -qx` goes
      RED rather than passing on absence; admissible under the OMN-14505 predicate with `gh-api` in command
      position, not bare `gh`; shlex-parseable with balanced quotes. Falsifiability proven by execution
      at authoring time, not asserted: GREEN 3/3 per leg under `bash -o pipefail -c` and 1/1 under `sh
      -c` against the live API, and RED (exit 1) under three independent mutations — repointed at attempt
      2 (the post-rerun state that breaks the superseded entry), a nonexistent run id, and a nonexistent
      job name.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omnibase-infra-pr-2570"
    checks:
      - check_type: "command"
        check_value: |-
          out="$(gh api 'repos/OmniNode-ai/omnibase_infra/actions/runs/30565261108/attempts/1/jobs' --jq '.jobs[]|select(.name=="merge-hold-gate / evaluate")|.conclusion')" && printf '%s\n' "$out" | grep -qx success
      - check_type: "command"
        check_value: |-
