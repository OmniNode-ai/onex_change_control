title: "Assert exact attach-token audience set and lifetime bound"
summary: >
  OCC companion for OmniNode-ai/omnibase_infra PR #2737. The attach validator trusted whatever audiences
  and lifetime Keycloak returned — a membership check plus a denylist of one known-bad broker audience,
  and no bound on exp - iat at all. This companion binds the evidence that both are now relying-party
  assertions on the presented token, so an IdP-side mapper or token-lifespan change fails closed at the
  gateway instead of silently widening every token minted thereafter. Supersedes the boilerplate Evidence-Source
  autobind (occ-self-bind-pr-6450 below, kept per append-only) with AC-bound probes.
