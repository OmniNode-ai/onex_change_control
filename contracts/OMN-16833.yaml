  - id: "dod-omn16833-ac1-ac3-bindability-gate"
    description: |-
      AC1 + AC3, diff-derived behavior proof. AC1 asks that every backend a deployed tier references
      either resolves a complete endpoint_url on the lane or is not referenced by that lane's tiers;
      AC3 asks for a check that FAILS when the tier config references a backend the contract cannot
      resolve. omnimarket#2438 satisfies AC1 through its second limb — `cloud-vertex-gemini` and
      `local-ds-v4-flash` are no longer referenced by any tier — and satisfies AC3 by making that
      condition mechanically refusable rather than silently droppable.

      The decision per backend was measured, not inferred. `cloud-vertex-gemini` has no binding path on
      ANY lane: the deploy-time renderer never reads endpoint bindings from the process environment (its
      own module docstring), so BIFROST_VERTEX_GEMINI_ENDPOINT_URL is inert there, and the typed lane
      overlay that IS the binding authority admits only unauthenticated local http:// chat-completions
      endpoints, so a bearer-authenticated cloud backend is unrepresentable in it by construction.
      `local-ds-v4-flash` was probed on 2026-09-10: GET .200:8101/v1/models returned curl exit 7
      "Couldn't connect to server", http=000, with two controls proving the probe itself ran — ping .200
      returned 2/2 packets at 0.0% loss, and the same probe against .201:8000 returned HTTP 200. All
      three lab lane overlays declare serving false on it (OMN-16999) and onex-dev declares locale cloud
      with zero local backends, so every lane in the fleet renders endpoint_url null.

      This check is RED-derivable: the validator failed on the parent tree naming exactly
      cloud-vertex-gemini (cloud_endpoint_url_null) and local-ds-v4-flash (local_bound_by_no_lane), and
      the test module carries a positive control that re-references a parked backend in a scratch copy of
      the tiers file and requires the validator to name it, so a clean tree cannot be mistaken for a
      check that does not work.
    source: "generated"
