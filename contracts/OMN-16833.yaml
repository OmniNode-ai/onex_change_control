    description: |-
      AC2 — `test`, `summarization` and `documentation` each resolve a zero-cost local rung before any
      metered rung. Unaffected by this PR and asserted directly: `test` is served in the local tier by
      `local-coder` and `summarization` / `documentation` by `local-heavy-reasoning`, both of which are
      bound serving true by the dev, judge and lakshman lane overlays against .201:8000 (probed
      2026-09-10, HTTP 200). The local tier precedes cheap_cloud in every one of those three classes'
      escalation_policy.tier_order, so a local rung that exists is a local rung that is tried first.

      The named test is the OMN-16442 completeness assertion for exactly these three classes; it fails if
      any of them loses its last local declarant. The bindability gate in the same run is what makes that
      assertion mean something on the lane rather than only in the file — before this PR a class could
      hold a local declarant that every lane dropped, which is how AC2 read as satisfied on paper while
      the ladder degraded to paid-first.
    source: "generated"
