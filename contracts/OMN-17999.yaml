---
schema_version: "1.0.0"
ticket_id: "OMN-17999"
title: "Stop naming the private knowledge base in the public OCC README"
summary: >
  Remove the public README list entry that named the private knowledge-base repository and characterized
  its contents. The public knowledge-base pointer remains, and no contracts, receipts, or governance evidence
  are changed by the README edit itself.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "docs"
    description: >
      The public README no longer names the private knowledge-base repository, read at a pinned immutable
      ref rather than at whatever HEAD happens to be.
    command: |-
      gh api 'repos/OmniNode-ai/onex_change_control/contents/README.md?ref=4e0d7609ab0a207c9e69391f10e3de72ac3e36c6' --jq .content | base64 -d | python3 -c 'import re,sys; n=sum(1 for line in sys.stdin.read().splitlines() if re.search(r"knowledge-base-internal|internal process docs", line, re.I)); print(n); sys.exit(0 if n == 0 else 1)'
  - kind: "docs"
    description: >
      POSITIVE CONTROL. The identical pinned read at the pre-fix parent finds the reference, so the zero
      above is a removal and not a probe that matches nothing anywhere.
    command: |-
      gh api 'repos/OmniNode-ai/onex_change_control/contents/README.md?ref=d1fdfd169438772e9904c026c47062b83781a203' --jq .content | base64 -d | python3 -c 'import re,sys; n=sum(1 for line in sys.stdin.read().splitlines() if re.search(r"knowledge-base-internal|internal process docs", line, re.I)); print(n); sys.exit(0 if n == 1 else 1)'
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-public-readme-private-kb-reference-removed"
    description: >
      README.md at PR #8414 head 4e0d7609 no longer names the private knowledge-base repository, nor carries
      the label that described its contents. The content is read at a pinned immutable ref, so the check
      is executed, falsifiable and re-runnable from any runner and at any later HEAD.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/onex_change_control/contents/README.md?ref=4e0d7609ab0a207c9e69391f10e3de72ac3e36c6' --jq .content | base64 -d | python3 -c 'import re,sys; n=sum(1 for line in sys.stdin.read().splitlines() if re.search(r"knowledge-base-internal|internal process docs", line, re.I)); print(n); sys.exit(0 if n == 0 else 1)'
  - id: "dod-public-readme-positive-control"
    description: >
      POSITIVE CONTROL for the item above, and the reason its zero is evidence. The identical pinned read
      at the pre-fix parent d1fdfd16 returns exactly one match; a probe that returned zero at both refs
      would be broken rather than proving a removal.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/onex_change_control/contents/README.md?ref=d1fdfd169438772e9904c026c47062b83781a203' --jq .content | base64 -d | python3 -c 'import re,sys; n=sum(1 for line in sys.stdin.read().splitlines() if re.search(r"knowledge-base-internal|internal process docs", line, re.I)); print(n); sys.exit(0 if n == 1 else 1)'
  - id: "occ-self-bind-pr-8414"
    description: >
      Binds OMN-17999 to OCC PR #8414. This PR is itself the evidence record: the OCC-repo producers decline
      to mint a companion for a PR inside OCC (occ_self_companion, OMN-16440) and the autobind declines
      a README-only diff as not RED-derivable (OMN-15247), so the contract and its receipts are carried
      in this PR's own diff, which is the surface occ-preflight evaluates for an in-repo PR.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/onex_change_control/pulls/8414 --jq '.number' | grep -x '8414'
