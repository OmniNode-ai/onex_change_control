title: "OCC evidence for OMN-18475"
summary: >
  OCC contract for OmniNode-ai/omninode_infra PR #1515. The deployable omninode-cloud-migrate bundle gains
  the from-zero baseline schema at /migrations/scripts/, the path both consumers resolve through MIGRATION_DIR,
  and a test that derives the required copy set by parsing the Dockerfile against the repository's own
  two apply authorities.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1515 CI checks green"
    command: "gh pr checks 1515 --repo OmniNode-ai/omninode_infra"
  - kind: "tests"
    description: |-
      Behavior proof for PR #1515 on OmniNode-ai/omninode_infra, derived from the PR's own diff: the test target it adds. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omninode_infra`.
    command: |-
      uv run pytest tests/db/test_migrate_image_copy_set_omn18475.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omninode_infra-pr-1515"
    description: "PR #1515 on OmniNode-ai/omninode_infra — Evidence-Source binding."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1515 --repo OmniNode-ai/omninode_infra --json number,state"
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/pulls/1515/files --paginate --jq '.[].filename' | grep -cFx 'docker/Dockerfile.migrate'
    binds_ac:
      - "AC1"
      - "AC2"
  - id: "dod-occ-diff-derived-behavior-proof"
    description: "PR #1515 on OmniNode-ai/omninode_infra — diff-derived behavior proof (OMN-16434)."
    source: "generated"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omninode_infra-pr-1515"
    checks:
      - check_type: "test_passes"
        check_value: |-
          uv run pytest tests/db/test_migrate_image_copy_set_omn18475.py -q
        cwd: "${OMNI_HOME}/omninode_infra"
  - id: "dod-rebuilt-image-carries-the-baseline"
    description: >-
      AC3. The rebuilt migrate image contains the file at the path the apply one-shot reads. Probed against
      the image the lab overlay builds from this repository's own dev head, with /migrations/MANIFEST
      in the same probe as the positive control — an image that answered "absent" to both would be an
      unreadable image rather than a missing layer. Unproven until an image built from the merged tree
      exists; the pre-change measurement is recorded on the ticket and shows absent against present.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          docker run --rm --entrypoint ls "$ONEX_CLOUD_MIGRATE_IMAGE" /migrations/scripts/00_baseline_schema.sql
          /migrations/MANIFEST
    binds_ac:
      - "AC3"
  - id: "dod-lane-apply-succeeds-from-empty"
    description: >-
      AC4. On the .201 compose dev lane, after the deploy path consumes an image built from the merged
      tree, the apply one-shot exits 0 and omninode_cloud carries a non-zero table count. The count is
      read against the image's own MANIFEST entry count as the positive control. A live-lane observation,
      not re-executable from a CI checkout; the readback and the deploy agent command id are recorded
      on the ticket.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          docker inspect -f '{{.State.ExitCode}}' omnibase-infra-cloud-migration
    binds_ac:
      - "AC4"
  - id: "dod-baseline-is-idempotent-on-a-non-empty-database"
    description: >-
      AC5. The baseline is applied unconditionally on every run, before the manifest loop and outside
      schema_migrations bookkeeping, so a second run against an already-migrated database re-executes
      it. It is written to be a no-op there — CREATE EXTENSION IF NOT EXISTS, CREATE TABLE IF NOT EXISTS
      — and the proof is the second run exiting 0 with its applied/already/skipped tail line showing the
      corpus already applied. Unproven until that second run exists.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          docker logs omnibase-infra-cloud-migration 2>&1 | grep -c 'omninode_cloud migration complete'
    binds_ac:
      - "AC5"
