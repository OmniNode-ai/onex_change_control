    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1959 --repo OmniNode-ai/omniclaude --json files --jq '[.files[].path] | sort
          | join(",")')" = ".github/actions/required-check-skip-guard/_workflow_model.py,.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py,.github/workflows/hostile-reviewer.yml,tests/ci/test_validate_no_required_check_skip_vectors.py"
  - id: "dod-omniclaude-per-upstream-tests"
    description: >-
      Confirms the follow-up tests at the product PR head cover per-upstream masking and continue-on-error
      triage-step hardening gaps.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omniclaude/contents/tests/ci/test_validate_no_required_check_skip_vectors.py
