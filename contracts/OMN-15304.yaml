---
schema_version: "1.0.0"
ticket_id: "OMN-15304"
title: "OCC evidence for result-triage fail-open detection"
summary: >-
  Evidence-Source companion for omniclaude#1958. The PR adds vector 6 to the shared required-check skip-vector
  guard so aggregators fail closed on non-success needs.<job>.result values, with validator wiring, manifest
  metadata, reusable workflow headers, pre-commit hook text, and CI tests.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "The product PR head and file scope must match the result-triage guard change."
    command: "gh pr view 1958 --repo OmniNode-ai/omniclaude --json headRefOid,files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omniclaude-pr-1958-head"
    description: >-
      Binds OMN-15304 to the exact omniclaude#1958 head that CI evaluated. This fails if the PR is force-pushed
      without rebinding the OCC receipt.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1958 --repo OmniNode-ai/omniclaude --json headRefOid --jq .headRefOid)" =
          "072e08d4e583d895b9908c784aac5341ee64db66"
  - id: "dod-omniclaude-pr-1958-file-scope"
    description: >-
      Verifies the PR scope is limited to required-check skip-vector guard implementation, wiring, manifest
      metadata, and tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1958 --repo OmniNode-ai/omniclaude --json files --jq '[.files[].path] | sort
          | join(",")')" = ".github/actions/required-check-skip-guard/_workflow_model.py,.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py,.github/required-checks.yaml,.github/workflows/required-check-skip-guard-reusable.yml,.pre-commit-config.yaml,.pre-commit-hooks/reject-required-check-skip-vector.sh,tests/ci/test_validate_no_required_check_skip_vectors.py"
  - id: "dod-omniclaude-vector6-tests"
    description: >-
      Confirms the committed tests at the product PR head include result-triage vector-6 red/green coverage,
      rather than only PR-body prose.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omniclaude/contents/tests/ci/test_validate_no_required_check_skip_vectors.py
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=072e08d4e583d895b9908c784aac5341ee64db66
          | grep -q 'result_triage'
  - id: "occ-self-bind-pr-5276-omn15304"
    description: "OCC companion PR #5276 — self-bind for OMN-15304."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5276 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
  - id: "dod-omniclaude-pr-1959-head"
    description: >-
      Binds OMN-15304 to the exact omniclaude#1959 follow-up head that CI evaluated. This fails if the
      PR is force-pushed without rebinding the OCC receipt.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1959 --repo OmniNode-ai/omniclaude --json headRefOid --jq .headRefOid)" =
          "39f94e16b01e1b94e76fffc630b39a89b48f0e86"
  - id: "dod-omniclaude-pr-1959-file-scope"
    description: >-
      Verifies the PR scope is limited to the required-check skip-vector model/validator, hostile-reviewer
