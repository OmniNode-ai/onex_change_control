  #     omnibase_infra#2562:  OCC#5574 merged 05:55:11Z < OCC#5575 created 05:59:01Z
  #
  # THE #1949 CORRECTION, STATED NOT SMOOTHED. OCC#5584's rejection cited
  # omnimarket#1949 as a live bullet-3 instance that the new checks passed.
  # The census confirms #1949 carries two companions, and ALSO shows it is the
  # sequential re-mint class, not the dual-producer race class — and that the
  # SAME class has recurred twice more SINCE the R30 text was written
  # (#2551 on 2026-07-30T00:47Z, #2562 on 05:59Z, both after the contract was
