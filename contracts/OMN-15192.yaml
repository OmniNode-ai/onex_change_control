  # supersession target lives in `evidence_requirements`, which that marker
  # cannot address (the runners' `_superseded_dod_ids` only scans
  # `dod_evidence`). They supersede nothing in `dod_evidence` and retire no
  # existing check; they ADD the live measurement the retired probes could not
  # take.
