  # ==========================================================================
  # R31 ACCEPTED-DEVIATION RECORD (fable-resume-0730, 2026-07-30) — APPEND-ONLY.
  #
  # WHAT THIS IS NOT. It does not supersede the two "BULLET 3 UNMET" entries
  # above, does not edit them, and does not make bullet 3 read met. Both still
  # read 2 (re-executed 2026-07-30T08:16Z, output 2 for each) and remain the
