      k \" \"; hit=0; for (i=1;i<=n[k];i++) for (j=i+1;j<=n[k];j++) if (st[k,i] < en[k,j] && st[k,j] <
      en[k,i]) hit=1; races+=hit; if (hit) rl = rl k \" \" } print \"tot=\" tot+0 \" dups=\" dups+0 \"
      races=\" races+0 \" duplist=[\" dl \"] racelist=[\" rl \"]\" }'"
