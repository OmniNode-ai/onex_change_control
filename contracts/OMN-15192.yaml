  # WHAT CHANGED, PRECISELY: the retired probes asked "how many companions were
  # ever opened against product PR X" — a cumulative count over terminal,
  # immutable objects. These ask "is any legacy producer live right now, and is
  # the current producer the single bot identity" — both readable only from
  # present state, both able to move in BOTH directions.
  #
  # FALSIFIABILITY, EXECUTED NOT ASSERTED (all controls run 2026-07-30 under
  # `bash -o pipefail -c`, the dod_verify runner's own shell):
  #   - re-enabling ANY legacy caller     -> `.state` reads `active`, the loop
  #     counts it live, item goes RED. Proven by running the identical loop
  #     shape against omnimarket's still-ACTIVE call-occ-companion-author.yml:
  #     live=1 ok=0, rc=1.
  #   - an unreachable repo / token loss  -> `gh api` 404s, `$s` is empty, the
  #     repo counts as live, item goes RED. Proven against
  #     OmniNode-ai/no_such_repo_xyz: live=1 ok=0, rc=1. Fail-CLOSED, not
  #     fail-open — this is the OMN-15391 Rule D failure mode, avoided by
  #     counting non-matches rather than piping a count into `grep -qx 0`.
  #   - a non-bot companion author        -> enters the negated-author search
  #     and makes `bad` non-zero, item goes RED. Proven by widening the window
  #     back over the hand-mint period (created:>2026-07-29T03:01:35Z), where
  #     the SAME query returns 2 (OCC#5486, OCC#5487).
  #
  # SHAPE NOTES: no check_value here pipes into `grep -q`. That is deliberate —
  # the OMN-15411 SIGPIPE class was measured on live shipped values at ~28%
  # spurious RED under `bash -o pipefail`, and it is a race, not a volume
  # threshold, so the buffered `printf | grep -qF` mitigation is bounded-safe
  # rather than unconditionally safe. Every value here ends in a `[ ... ]`
  # comparison over a shell variable, which has no pipe to break. Every
  # command substitution is DOUBLE-QUOTED (`VAR="$(...)"`) with no nested
  # double quotes inside it, so `shlex.split(..., posix=True)` keeps it as one
  # token and node_dod_verify's pre-execution shape guard
  # (`_invalid_check_value_reason`) returns None — verified by replaying that
  # exact function, and the OMN-15476 Rule F detector, against all three values.
