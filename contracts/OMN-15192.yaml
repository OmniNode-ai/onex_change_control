    description: >-
      BULLET 3, INTENT HALF 1 — no legacy producer is live. Replaces the state-blind "BULLET 3 UNMET (omnibase_infra#2536)"
      evidence_requirements probe with a present-state census. Check 1 walks the 9 PUBLIC repos that carry
      call-occ-autobind.yml and counts how many are NOT state=disabled_manually; the assertion is that
      count is 0 AND that all 9 were actually read (ok == 9), so a silent read failure cannot masquerade
      as a clean census. Executed 2026-07-30 twice, exit 0 both times. Check 2 handles omnibase_core explicitly:
      it is the one repo in the ticket's scope list that does NOT carry the workflow, so its endpoint
      404s. A bare 404 is ambiguous between "absent" and "unreadable", so the check first proves the token
      can read that repo's Actions API at all (`.total_count` of its workflow list is > 0) and only then
      asserts the specific workflow is absent. Executed 2026-07-30 twice, exit 0 both times; the identical
      shape against omnimarket, which DOES carry the workflow, exits 1. Evidence: OMN-15192 comments dfb9b65b-bd8e-4ae3-b621-bfd8c73a7e4b
