        statement: |-
          AC2: A malformed message (missing or empty signature, missing signature_hash, pattern_id that is not a UUID, a JSON body that is not an object, non-UTF-8 bytes) writes no row and publishes no pattern-stored event, and is not redelivered -- falsifier: tests/unit/runtime/test_pattern_storage_entrypoint.py run at the PR head
