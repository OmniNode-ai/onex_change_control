  - id: "dod-prod-promotion-grant-validation-omn16702"
    description: >-
      The repo's own grant-schema suite passes against the grant file carrying the four new OMN-16702
      entries alongside the two carried-forward OMN-16799 entries — including the OMN-13424 at-rest invariant
      test that refuses any expired entry, which is why the OMN-16799 pair (expires_at 2026-08-30T16:00:00Z)
      can be carried forward untouched today but must be pruned if this PR is still open after that timestamp.
      Executed hermetically from the repo checkout.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_prod_promotion_grants.py -q"
  - id: "dod-onex-public-tree-on-main-omn16702"
    description: >-
      The grant NAMES the exact manifest tree it authorizes an apply of, so a reviewer can bind the authorization
      to a tree rather than to a directory path that could mean anything. deploy-onex-prod.yml refuses
      any dispatch whose GITHUB_REF is not refs/heads/main, and `git rev-parse origin/main:k8s/onex-public`
      == `origin/dev:k8s/onex-public` == 04c2fe17e6a7478271e1358b78ee9afda6aa544b, so that one SHA pins
      what will actually be applied. This check is deliberately HERMETIC to the OCC checkout: it asserts
      the tree SHA is recorded in the grant file itself. STATED LIMIT — it does NOT re-prove cross-repo
      existence. The first version of this item did, via `gh api repos/OmniNode-ai/omninode_infra/contents/k8s/onex-public?ref=main`,
      and the hosted Contract Compliance runner returned `gh: Not Found (HTTP 404)` because its token
      carries no read scope on the private omninode_infra repo. That cross-repo probe WAS executed successfully
      from the staging lane (exit 0, listing recorded in this item's receipt); the hosted gate simply
      cannot re-run it, and weakening the assertion is more honest than leaving a check that fails for
      lack of scope rather than lack of truth. Same class of hosted-scope defect OCC#7418 hit with an
      ${OMNINODE_INFRA}-rooted command, resolved the other way.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -Fq '04c2fe17e6a7478271e1358b78ee9afda6aa544b' grants/prod_promotion_grants.yaml
  - id: "occ-self-bind-pr-7464"
    description: >-
      OCC PR #7464 — self-bind for the OMN-16702 / OMN-16685 prod-promotion grant PREP (batch-af8142c0).
      OPEN against onex_change_control@main and NOT to be merged by any agent per the PR's own operator-approval-act
      scope statement; the CODEOWNERS merge is the approval act (OMN-13418).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid
