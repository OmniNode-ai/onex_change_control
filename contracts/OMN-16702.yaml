title: Central OCC evidence for the OMN-16702 prod-promotion grant landing on main
summary: >-
  Central OCC evidence for the hotfix/* PR that lands four OMN-16702 / OMN-16685 prod-promotion grant
  entries on onex_change_control@main under promotion_batch_id batch-af8142c0-f2bf-4d79-887a-e65d964c9da8:
  grant-6219b88c (the runtime same-digest authorization sha256:13c96028…, the ONLY entry any gate reads),
  plus three DOCUMENTARY entries — grant-a24c94a4 (onex-dev/omnidash sha256:50601f9e…), grant-68783635
  (onex-dev/onex-api sha256:b4c32554…) and grant-6627c1d1 (the dev/dev-valkey requirepass roll, sha256:53ae5378…)
  — which no pipeline resolves and which the file's own header says so in as many words. PREP ONLY: this
  contract proves the PR is well-formed, locally validated against the producer-side schema suite, and
  that the manifest tree it authorizes exists on the branch the consumer dispatches from. It does NOT
  authorize prod mutation and it is NOT the approval act. The PR still requires a human CODEOWNERS operator's
  explicit merge per OMN-13418. This contract exists on the PR branch itself because occ-preflight pins
  OCC evidence at the PR head SHA for onex_change_control's own PRs (invariant I3, in-tree checkout) —
  the same shape OCC#7418 (OMN-16799), OCC#7213 (OMN-16626) and OCC#7084 (OMN-16205) used on this base.
