---
schema_version: "1.0.0"
ticket_id: "OMN-19136"
title: "Preserve incumbent decisions during shadow calibration"
summary: "Hand-authored OCC evidence companion for omnimarket#3540. The typed-decision effect node gains
  a shadow workflow handler that always returns the incumbent decision unchanged, logs the observed model
  outcome separately, and reports calibration only above a 300-observation floor."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-shadow-cannot-steer"
    statement: "The shadow workflow returns the incumbent decision unchanged and records the model outcome
      (decision, abstention, refusal or error) separately; invalid backend probabilities return a typed
      backend-error receipt."
    acceptance:
      - id: "AC1"
        statement: "AC1: the shadow workflow keeps the incumbent decision and separates the observed model
          outcome, and calibration reports require distinct adjudicated observations above the contract
          floor -- falsifier: uv run pytest tests/unit/nodes/test_golden_chain_typed_decision_effect.py
          -q fails at the merge base because the workflow handler is absent"
evidence_requirements:
  - kind: "tests"
    description: "Typed-decision shadow and calibration golden-chain tests."
    command: "uv run pytest tests/unit/nodes/test_golden_chain_typed_decision_effect.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19136-shadow-golden-chain"
    description: "The shadow workflow and calibration golden-chain tests pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_golden_chain_typed_decision_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-deploy-probe-omnimarket-pr-3540"
    description: "Deploy probe: the omnimarket#3540 head carries HandlerTypedDecisionWorkflow in the typed-decision
      handler module; at omnimarket dev the class is absent and the probe exits non-zero."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          deploy_probe=1; body=$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_typed_decision_effect/handlers/handler_typed_decision.py?ref=e6c5404712ee86a14c9511c564771cdcb83017e9' --jq '.content' | base64 -d) && printf '%s\n' "$body" | grep -cF 'class HandlerTypedDecisionWorkflow'
    binds_ac: ["AC1"]
