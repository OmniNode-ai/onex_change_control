---
schema_version: "1.0.0"
ticket_id: "OMN-15312"
title: "OCC evidence for migration 0009a transaction wrapper"
summary: >-
  Evidence-Source companion for the paired OMN-15312 PRs: omnimarket#1930 updates the canonical migration,
  and omnibase_infra#2524 updates the vendored copy. The receipts bind both PR heads and assert that both
  copies carry the explicit transaction wrapper.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "Both product PR heads and migration file scopes must match."
    command: "gh pr view 1930 --repo OmniNode-ai/omnimarket --json headRefOid,files && gh pr view 2524
      --repo OmniNode-ai/omnibase_infra --json headRefOid,files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15312-market-pr-1930-head"
    description: "Binds the canonical omnimarket migration PR to its current head."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1930 --repo OmniNode-ai/omnimarket --json headRefOid --jq .headRefOid)" =
          "7e415d1aed52a5477fd0454c2bbb3c3a3c4d50f9"
  - id: "dod-omn15312-infra-pr-2524-head"
    description: "Binds the vendored omnibase_infra migration PR to its current head."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2524 --repo OmniNode-ai/omnibase_infra --json headRefOid --jq .headRefOid)"
          = "3de9992955c763c229a3cf57cb5b2ec9b4cf87a9"
  - id: "dod-omn15312-market-file-scope"
    description: "Verifies the omnimarket PR changes only the canonical 0009a migration."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1930 --repo OmniNode-ai/omnimarket --json files --jq '[.files[].path] | sort
          | join(",")')" = "src/omnimarket/nodes/node_projection_delegation/migrations/0009a_delegation_events_legacy_schema_reconcile.sql"
  - id: "dod-omn15312-infra-file-scope"
    description: "Verifies the omnibase_infra PR changes only the vendored 0009a migration."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2524 --repo OmniNode-ai/omnibase_infra --json files --jq '[.files[].path]
          | sort | join(",")')" = "docker/migrations/forward/nodes/node_projection_delegation/0009a_delegation_events_legacy_schema_reconcile.sql"
  - id: "dod-omn15312-market-transaction-wrapper"
    description: "Confirms the canonical migration carries an explicit transaction wrapper."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_delegation/migrations/0009a_delegation_events_legacy_schema_reconcile.sql
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=7e415d1aed52a5477fd0454c2bbb3c3a3c4d50f9
          | grep -q '^BEGIN;' && gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_delegation/migrations/0009a_delegation_events_legacy_schema_reconcile.sql
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=7e415d1aed52a5477fd0454c2bbb3c3a3c4d50f9
          | grep -q '^COMMIT;'
  - id: "dod-omn15312-infra-transaction-wrapper"
    description: "Confirms the vendored migration carries the same explicit transaction wrapper."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_delegation/0009a_delegation_events_legacy_schema_reconcile.sql
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=3de9992955c763c229a3cf57cb5b2ec9b4cf87a9
          | grep -q '^BEGIN;' && gh api repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_delegation/0009a_delegation_events_legacy_schema_reconcile.sql
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=3de9992955c763c229a3cf57cb5b2ec9b4cf87a9
          | grep -q '^COMMIT;' #magic___^_^___line
  - id: "occ-self-bind-pr-5275-omn15312"
    description: "OCC companion PR #5275 — self-bind for OMN-15312."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5275 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
