title: "Hand-authored OCC evidence for OMN-18320"
summary: >
  Hand-authored OCC contract for OmniNode-ai/omnibase_infra PR #3489. The autobind emitter declined to
  mint a companion for this PR with skip:NO_RED_DERIVABLE_CHECK (OMN-15247) — no changed-file candidate
  was RED-derivable by its own heuristic, because the change removes a declaration rather than adding
  a symbol a grep can find. It explicitly directs that hand-authored evidence is required, which is what
  this contract is. The binding below IS RED-derivable, just not in the shape the emitter looks for: the
  retired lane is present at the merge base and absent at the PR head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #3489 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      Behavior proof for PR #3489 on OmniNode-ai/omnibase_infra. The lane-census test
      surface must stay green with the retired lane removed from the manifest. Bound as
      dod_evidence item `dod-omn18320-lane-census-suite-green`, executed at cwd
      `${OMNI_HOME}/omnibase_infra`.
    command: |-
      uv run pytest tests/unit/scripts/test_lane_census_plan.py tests/unit/scripts/test_lane_census_dry_run.py tests/unit/scripts/test_lane_census_manifest_parity.py tests/ci/test_lakshman_lane_governance_boundary.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
