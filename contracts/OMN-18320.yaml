    description: >
      PR #3489 on OmniNode-ai/omnibase_infra — the retired lane is declared in the census manifest at
      the merge base and absent at the PR head. This is the RED-controlled content binding: the same probe
      against the merge base exits 1.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/contents/deploy/lane-census/lane-manifest.yaml?ref=1595f9a017ff351426d5b8e099a04b8423dd31a0 --jq '.content' | base64 -d | python3 -c "import sys,yaml; d=yaml.safe_load(sys.stdin); assert 'prod' not in d['lanes']; print(sorted(d['lanes']))"
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/pulls/3489/files --paginate --jq '.[].filename' | grep -cFx 'deploy/lane-census/lane-manifest.yaml'
  - id: "dod-omn18320-lane-census-suite-green"
    description: >
      PR #3489 on OmniNode-ai/omnibase_infra — the lane-census test surface is green with the lane removed,
      including the frozen 2026-06-11 incident replay that now pins the retired lane spec in-module instead
      of reading it from the manifest.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: |-
          uv run pytest tests/unit/scripts/test_lane_census_plan.py tests/unit/scripts/test_lane_census_dry_run.py tests/unit/scripts/test_lane_census_manifest_parity.py tests/ci/test_lakshman_lane_governance_boundary.py -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "occ-self-bind-pr-9396"
