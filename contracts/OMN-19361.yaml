  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A pass at both refs is control_did_not_fail. -- falsifier: a unit test asserting an accepted_* status for that input passes.
      - id: "AC2"
        statement: |-
          AC2: A collection-only pre-fix failure with no call-phase mutation failure is accepted_collection, never accepted_call or accepted_mutation. -- falsifier: uv run pytest src/omnimarket/nodes/node_delegated_test_control_compute/tests -q has a case that maps it otherwise.
      - id: "AC3"
        statement: |-
          AC3: A collection-only pre-fix failure plus a call-phase failure on the mutated fixed commit is accepted_mutation. -- falsifier: a unit test in the control compute's tests.
      - id: "AC4"
        statement: "AC4: prefix_ref == fixed_ref never yields an accepted_* status. -- falsifier: test_prefix_equal_to_fixed_never_accepts."
      - id: "AC5"
        statement: "AC5: A bundle carrying a forbidden fragment is refused. -- falsifier: test_hidden_function_name_in_bundle_is_refused."
      - id: "AC6"
        statement: |-
          AC6: Neither handler imports an envelope type. -- falsifier: grep -n ModelEventEnvelope over both nodes finds a match.
  - id: "req-omn19361-ac7-ac8-prompt-helpers"
    statement: |-
      AC7 and AC8, added to the ticket on 2026-09-25 by lane dm-tests (delegation-matrix-83b) before the delegated test for them was written, transcribed verbatim from the ticket body.
    acceptance:
      - id: "AC7"
        statement: |-
          AC7: The WRITE prompt names the importable module of a src-layout target: `src/omnimarket/a/b.py` is imported as `omnimarket.a.b`, and a package `src/omnimarket/a/__init__.py` as `omnimarket.a`. -- falsifier: `uv run pytest tests/nodes/node_delegated_test_prompt_compute/test_prompt_module_and_caps_omn19361.py -q` exits non-zero at the PR head, or exits 0 with the planted mutation that removes the `.removesuffix(".__init__")` call from `_module_name`.
      - id: "AC8"
        statement: |-
          AC8: `_cap` leaves text of exactly the limit untouched (`truncated` false) and truncates one character over it with the marker (`truncated` true); the REPAIR prompt caps the previous test at `MAX_PREVIOUS_TEST_CHARS`. -- falsifier: the same pytest file exits non-zero at the PR head, or exits 0 with the planted mutation that changes `len(text) <= limit` to `len(text) < limit` in `_cap`.
