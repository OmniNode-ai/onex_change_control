---
schema_version: "1.0.0"
ticket_id: "OMN-15291"
title: "OCC evidence for OMN-15291 forward-migration advisory lock"
summary: >-
  Evidence-Source companion for omnibase_infra PR #2511, which serializes scripts/run-forward-migrations.sh
  behind a single-session Postgres advisory lock. The runner previously had NO lock of any kind: every
  migration was applied through an unsynchronized check-then-act, so two concurrent runners both read
  "not applied" and both executed the same file, and the tracking insert's ON CONFLICT DO NOTHING hid
  the resulting double-apply. OMN-15254 closed the sibling defect for the omninode_infra k8s Job runners
  only; OMN-15281 explicitly declared this runner out of scope. The load-bearing evidence is a RED/GREEN
  pair produced BY EXECUTION against a real scratch Postgres, plus a falsifiability proof that the committed
  static ratchet goes RED when the lock block is removed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: >-
      omnibase_infra PR #2511 exists and carries the runner change plus its committed concurrency proofs.
    command: >-
      gh pr view 2511 --repo OmniNode-ai/omnibase_infra --json files
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15291-pr-2511-scope"
    description: >-
      PR #2511 changes exactly three files: scripts/run-forward-migrations.sh (the runner under repair),
      tests/scripts/test_forward_migration_advisory_lock.py (the net-new RED-control/GREEN/fail-loud proofs),
      and tests/unit/migrations/test_node_migration_discovery.py (its psql stub updated to model the new
      lock contract). No vendored migration SQL, no omninode_infra file, and nothing from omninode_infra#713
      / #716 is touched -- the OMN-15281 seam decision is preserved.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2511 --repo OmniNode-ai/omnibase_infra --json files --jq '[.files[].path]
          | sort | join(",")')" = "scripts/run-forward-migrations.sh,tests/scripts/test_forward_migration_advisory_lock.py,tests/unit/migrations/test_node_migration_discovery.py"
  - id: "dod-omn15291-no-cross-session-unlock"
    description: >-
      The repaired runner contains no executable pg_advisory_unlock() call. That call is the original
      defect's signature: it releases only locks held by the CALLING session, so a runner that acquired
      its lock in a different session always got `false` back and never held anything. Release is now
      the holder session disconnecting.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test -z "$(gh api repos/OmniNode-ai/omnibase_infra/contents/scripts/run-forward-migrations.sh
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=jonah/omn-15291-forward-migration-advisory-lock
          | grep -v '^[[:space:]]*#' | grep 'pg_advisory_unlock')"
  - id: "dod-omn15291-red-green-by-execution"
    description: >-
      RED and GREEN were produced by EXECUTION, not inspection, against an ephemeral Postgres, running
      the shipped runner twice concurrently over one slow non-idempotent migration. RED (pre-fix tree,
      omnibase_infra dev 1823f604, before any edit): both runners entered the apply concurrently, the
      loser exited 3 on `ERROR: relation "t_race" already exists`, schema_migrations still showed a single
      clean row, and the migrations_complete sentinel was left TRUE despite a failed run. GREEN (same
      harness, post-fix): both exited 0, exactly one apply and one "already applied" skip, and the critical
      sections did not overlap. Both transcripts are quoted verbatim in the PR body.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/pulls/2511 --jq .body | grep -q 'OVERLAP: critical sections
          ran CONCURRENTLY' && gh api repos/OmniNode-ai/omnibase_infra/pulls/2511 --jq .body | grep -q
          'SERIALIZED: no overlap'
  - id: "dod-omn15291-red-control-is-committed"
    description: >-
      The RED control is committed, not a one-off transcript: the test suite derives the pre-fix runner
      by mechanically stripping the marked lock block out of the SHIPPED file and asserts the lock-free
      runner does not produce the safe outcome. Without that control the serialization assertion would
      also pass against a harness that never ran anything concurrently.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/contents/tests/scripts/test_forward_migration_advisory_lock.py
          -H 'Accept: application/vnd.github.raw' --method GET -f ref=jonah/omn-15291-forward-migration-advisory-lock
          | grep -q 'def test_lock_free_runner_does_not_serialize'
  - id: "dod-omn15291-static-ratchet-is-falsifiable"
    description: >-
      The static ratchet that gates every PR (no database required) was proven falsifiable BY EXECUTION:
      stripping the canonical lock block from the runner turns 5 of the 7 static tests RED (test_runner_carries_the_canonical_lock_block,
      test_runner_asserts_the_lock_survived_the_whole_run, test_held_ness_check_is_bound_to_our_own_session,
      test_acquisition_failure_is_fatal_not_advisory, test_runner_is_posix_sh). A gate that cannot go
      red is not a gate.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/pulls/2511 --jq .body | grep -q 'turns \*\*5 of the
          7 static tests RED\*\*'
  - id: "dod-omn15291-live-proofs-not-ci-wired"
    description: >-
      OPEN RESIDUAL, recorded as a caveat rather than a pass. The three live concurrency proofs are NOT
      wired into a CI job -- they need a psql client on the runner, and postgresql-client provisioning
      on the self-hosted omnibase-ci pool is unverified, so adding an unproven install step to the integration-guard
      job risks wedging the everyday PR path. What is wired today is the 7-test static ratchet, which
      runs with no database. This entry exists so the gap is re-checked rather than forgotten, and it
      is falsifiable against the PR body's own Residual section.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/pulls/2511 --jq .body | grep -q 'not yet wired into
          a CI job'
