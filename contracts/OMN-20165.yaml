    acceptance:
      - id: "AC1"
        statement: |-
          AC1: node_delegation_rubric_check_compute is a pure COMPUTE node,
          handle(ModelRubricCheckRequest) -> ModelRubricVerdict, that runs computable
          correctness criteria per task class (code_review, review, summarization,
          code_generation, test) over one delegated answer and returns pass, fail or
          undetermined per criterion with a typed reason code; undetermined never counts as
          a pass, every threshold lives in delegation_class_rubrics.v1.yaml, and the verdict
          decides nothing -- falsifier: uv run pytest
          tests/nodes/node_delegation_rubric_check_compute -q fails at the PR head
