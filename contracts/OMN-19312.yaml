    acceptance:
      - id: "AC1"
        statement: |-
          AC1: gate --require-lane is all-of: a sha with an onex-lab PASS and a compose-dev-chain FAIL receipt is refused naming the sha, while the unchanged any-of call on the same inputs passes (positive control) -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_gate_omn17530.py -k require_lane -q
      - id: "AC2"
        statement: |-
          AC2: a required lane with no receipt after --wait-seconds is refused as no receipt, never a pass, and a receipt that lands inside the wait is read -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_gate_omn17530.py -k wait -q
      - id: "AC3"
        statement: |-
          AC3: workflow-verdict refuses a newest completed run that is failure, cancelled, stale past --max-age-hours, or unreadable, and passes a fresh success -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_gate_omn17530.py -k workflow_verdict -q
      - id: "AC4"
        statement: |-
          AC4: --resolve-runtime-ancestor inherits a required-lane receipt only across non-runtime-affecting commits and refuses when a runtime-affecting commit sits between -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_gate_omn17530.py -k ancestor -q
      - id: "AC5"
        statement: |-
          AC5: no force, skip or if-override exists on any new flag or step -- falsifier: uv run pytest tests/ci/test_lab_pass_receipt_gate_omn17530.py -k no_force -q
      - id: "AC6"
        statement: |-
          AC6: the omninode_infra receiver is re-pinned to the new module bytes and refuses a module whose digest does not match the pin, and supports all-of required lanes and workflow verdicts -- falsifier: uv run pytest tests/ci/test_lab_pass_gate_omn18340.py -q
      - id: "AC7"
        statement: |-
          AC7: live readback: the gate CLI run against the real artifact surface refuses a real sha on a required lane that has no receipt, and workflow-verdict against the real D11 nightly names its newest run id and conclusion -- falsifier: uv run python scripts/ci/lab_pass_receipt.py workflow-verdict --repo OmniNode-ai/omnimarket --workflow delegation-regression-nightly.yml --branch dev --max-age-hours 26
