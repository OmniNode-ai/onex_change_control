    description: >
      PR #3364 on OmniNode-ai/omnibase_infra -- the deploy-agent env TRANSPORT itself, which is the half
      #3358 only guarded against. The dev unit loses EnvironmentFile= entirely and ExecStart runs deploy/deploy-agent-launch.sh,
      which bash-`source`s the same operator store the way scripts/deploy-runtime.sh always has, so the
      process environment is the bash-decoded one. DEPLOY_AGENT_ENV_PROTECTED restores systemd's file-order
      precedence, which a plain `set -a; source` would otherwise invert -- the store's KAFKA_ENVIRONMENT
      disagrees with the dev unit's, so an unprotected name is a silently relabelled lane. self_update
      re-execs the launcher rather than the interpreter, so a repaired value is picked up at the next
      job boundary; os.execv inherits the environment verbatim, so the pre-existing interpreter re-exec
      could only ever carry forward what the process started with. Bound by hand (union-resolve) because
      autobind still mints nothing -- this ticket's own outage is the reason it cannot.
    source: "generated"
    checks:
