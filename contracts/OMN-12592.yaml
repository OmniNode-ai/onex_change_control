      from pathlib import Path
      text = Path('.github/required-checks.yaml').read_text()
      required = {'verify / verify', 'occ-preflight / eligibility', 'required-check-skip-guard / check-skip-vectors'}
      missing = sorted(required - set(x for x in required if x in text))
