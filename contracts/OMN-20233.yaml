      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: tool_calls_wellformed fails, naming the call id, on a call to an undeclared tool, unparsable argument text, a missing required argument or a wrongly typed argument, and passes when every call validates against its declared tool -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k tool_use_wellformed -v in omnimarket
      - id: "AC2"
        statement: |-
          AC2: no_phantom_paths fails on a path argument absent from the workspace manifest and not created by an earlier successful creating call, and on an answer citation path:line past the file's line count, and is undetermined without a manifest -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k tool_use_phantom_paths -v in omnimarket
      - id: "AC3"
        statement: |-
          AC3: edits_apply fails on any edit call whose result is an error, and stated_check_passes is undetermined when a check the answer names has no supplied execution result -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k "tool_use_edits_apply or tool_use_stated_check" -v in omnimarket
      - id: "AC4"
        statement: |-
          AC4: task_answer_traceable fails on an identifier in the final answer that occurs in no tool output and not in the request, naming it -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k tool_use_answer_traceable -v in omnimarket
      - id: "AC5"
        statement: |-
          AC5: within_budget records turns, tool calls and wall time as facts, fails when one exceeds its contract threshold, and a request with no transcript yields undetermined on every tool_use criterion, never a pass -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k "tool_use_budget or tool_use_no_transcript_never_pass" -v in omnimarket
      - id: "AC6"
        statement: |-
          AC6: the tool_use criteria make no model call, do no I/O and read every threshold from the rubric contract -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute -k "no_model_call or no_literal_thresholds" -v in omnimarket
