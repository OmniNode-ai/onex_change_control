  - id: "ac1-seeding-twice-leaves-the-same-rows"
    description: >-
      AC1 -- a second seed leaves the same rows: fixture event ids are derived from the fixture-set version
      and key, and the projection upserts on correlation_id, so seeding twice writes no new row and every
      row stays labelled fixture.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19970_dev_seed.py::test_seeding_twice_leaves_the_same_rows_all_labelled_fixture
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC1"
    ac_bindings:
      - label: "AC1"
        criterion_hash: "d2379faeedd7b3232d1b084603af902a6edc14cd7a4b316e1a500889373e74a2"
        accepted_by: "df034ef3-16f7-40d8-a138-1bac1d254cbf"
        accepted_at: "2026-09-30T09:41:31Z"
    supersedes_ac_binding:
      - item: "dod-OmniNode-ai-omnimarket-pr-3082"
        label: "AC1"
        reason: >-
          Counts `def _publish` in cli_seed.py at one commit. That answers whether the file has a publish
          function, never whether a second seed leaves the same rows.
  - id: "ac2-measured-savings-exclude-fixtures"
    description: >-
      AC2 -- in a store holding both real and fixture rows, the measured savings total equals the real
      rows' total: `onex metering` over SQLite excludes fixtures unless asked, and on PostgreSQL the projection_delegation_summary
      view (migration 0050) keeps fixture savings out of totalSavingsUsd.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19970_dev_seed.py::test_metering_excludes_fixture_rows_unless_asked
          tests/test_omn19970_fixture_data_source_real_postgres.py::test_summary_view_keeps_fixture_savings_out_of_the_measured_total
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC2"
    ac_bindings:
      - label: "AC2"
        criterion_hash: "4663ee6ff462bf3b96309a0fcd196932078c7e0a4d6f490799c173e29bf5ef59"
        accepted_by: "df034ef3-16f7-40d8-a138-1bac1d254cbf"
        accepted_at: "2026-09-30T09:41:31Z"
    supersedes_ac_binding:
      - item: "dod-OmniNode-ai-omnimarket-pr-3082"
        label: "AC2"
        reason: >-
          Counts `def _publish` in cli_seed.py at one commit. That says nothing about which rows a savings
          total sums.
  - id: "ac3-fixture-label-reaches-the-rows"
    description: >-
      AC3 -- the fixture label travels from the seed's envelope tag through the standalone projection
      runner into delegation_events, and a row with no tag reads real. Two real-PostgreSQL tests prove
      it up to the projection row. The exposure half was read on the lakshman lab lane on 2026-09-30 (all
      20 Runs rows carried data_source fixture); that readback is recorded on omnimarket#3082 and in this
      item's receipt. It is not a check here, because the hosted sweep cannot reach the lab lane.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19970_fixture_data_source_real_postgres.py::test_seed_wire_messages_land_labelled_through_the_runner_seam
          tests/test_omn19970_fixture_data_source_real_postgres.py::test_runner_labels_from_the_envelope_tag_and_defaults_to_real
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC3"
    ac_bindings:
      - label: "AC3"
        criterion_hash: "c30220f3b945867fbb3ff6e543fff0eae03ac8e24d706a13ce24cdacfd83e38f"
        accepted_by: "df034ef3-16f7-40d8-a138-1bac1d254cbf"
        accepted_at: "2026-09-30T09:41:31Z"
    supersedes_ac_binding:
      - item: "dod-OmniNode-ai-omnimarket-pr-3082"
        label: "AC3"
        reason: >-
          Counts `def _publish` in cli_seed.py at one commit. That proves a publish function exists, never
          that a fixture row keeps its label on the way to the rows.
