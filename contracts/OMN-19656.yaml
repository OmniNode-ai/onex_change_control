    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a collection whose window went backwards relative to the previous collection refuses, and says which run it lost -- falsifier: a pytest case feeds two consecutive window payloads where the second omits a run id the first reported, and asserts the leg reports UNPROVEN naming that run id, failing today where the second collection grades normally
      - id: "AC2"
        statement: |-
          AC2: a quiet lane does not refuse -- falsifier: a pytest case feeds two consecutive identical window payloads whose newest run is 30 hours old and asserts both legs grade normally rather than UNPROVEN, failing on today's 12h bound which refuses the second
      - id: "AC3"
        statement: |-
          AC3: the four recorded 2026-09-23..25 stale reads are each rejected by the cross-collection rule, not by age -- falsifier: a pytest case replays each occurrence's window against its predecessor's deploy_window.run_ids with the age bound disabled, and asserts all four still refuse
      - id: "AC4"
        statement: |-
          AC4: a first collection with no predecessor falls back to the age bound instead of passing silently -- falsifier: a pytest case supplies an absent prior window and asserts the age bound still applies, failing if the leg grades a 30-hour-old window with no comparison available
      - id: "AC5"
        statement: |-
          AC5: the prior window is read from evidence, not from local state -- falsifier: a pytest case asserts the comparison input is sourced from the previous run's published staging-green-report artifact, so a collection on a fresh runner behaves identically to one on a warm one
