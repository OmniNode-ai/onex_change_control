schema_version: "1.0.0"
ticket_id: "OMN-18287"
title: "Branch Protection Guard audit false-FAILs onex_change_control main and dev for its own declared-compliant
  codeowner review model"
summary: >-
  audit_branch_protection.sh's review-gated carve-out (OMN-17491) only fired when branch == "main", so
  onex_change_control's dev -- which carries the identical deliberate codeowner-only review model as its
  main (required_approving_review_count=0, require_code_owner_reviews=true) -- fell through to the ordinary
  solo-dev invariant and false-FAILed on every omni_home Branch Protection Guard PR run since 2026-09-01.
  This OCC PR renames REVIEW_GATED_MAIN_REPOS to REVIEW_GATED_REPOS and drops the branch == "main" restriction
  so the carve-out follows the repo across every audited branch, not one branch of it.
