    acceptance:
      - id: "AC1"
        statement: |-
          AC1 — leg 2 no longer returns UNPROVEN merely because the scored deploy did not stamp. The evaluator refuses to compare a plane annotation against a bundle revision unless the scored run is one that stamps, and a readback over the 20 most recent settled bar runs shows zero UNPROVEN attributable to a skipped stamp. falsifier: a bar run on a push-triggered deploy, with omnibase_infra HEAD ahead of the plane annotation, still scores leg 2 UNPROVEN.
      - id: "AC2"
        statement: |-
          AC2 — a null applied_migration_revision is UNPROVEN, never a silent pass. A test asserts the evaluator returns UNPROVEN when the field is absent, red-first against today's code. falsifier: the suite passes before the change, proving it asserts nothing new.
      - id: "AC3"
        statement: |-
          AC3 — the verdict text names which revision came from where and why they are comparable, so a reader need not open the workflow to know whether the run could have stamped. falsifier: a rendered UNPROVEN or PASS message that cites two revisions without stating the scored run's trigger.
      - id: "AC4"
        statement: |-
          AC4 — a readback recorded on the ticket over at least 20 settled bar runs, reporting the count of leg-2 UNPROVEN and the count where applied_migration_revision was null, before and after. falsifier: the after-readback shows any run passing leg 2 with a null applied revision.
