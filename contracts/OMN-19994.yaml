---
schema_version: "1.0.0"
ticket_id: "OMN-19994"
title: "OCC evidence for OMN-19994, dashboard projection URL and tenant from the local overlay"
summary: >-
  Hand-authored OCC companion (OMN-15247) for OmniNode-ai/omnidash#343. The PR makes the generated local
  overlay the authority for the projection base URL and tenant in src/data-source/projection-base-url.ts
  and projection-tenant.ts, and a tenant-scoped read with no tenant ends in a typed unconfigured state.
  It adds src/data-source/local-overlay-resolution.test.ts. occ-autobind declined to derive a companion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria declared in the OMN-19994 ticket body, transcribed without inventing a third criterion. Each criterion id is the label used by binds_ac.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: On a fresh lab install with no env file, one delegation produces Runs rows without an HTTP error -- falsifier: the fresh-install Runs read has no rows or returns an HTTP error
      - id: "AC2"
        statement: |-
          AC2: With no tenant configured, every tenant-scoped widget shows the typed tenant-not-configured state without issuing a scoped request -- falsifier: a widget renders an HTTP error, lacks the typed state, or calls fetch
evidence_requirements:
  - kind: "ci"
    description: "PR #343 product diff scope present"
    command: "gh pr view 343 --repo OmniNode-ai/omnidash --json files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnidash-pr-343"
    description: >-
      PR #343 on OmniNode-ai/omnidash, hand-authored companion (OMN-15247). The check reads src/data-source/local-overlay-resolution.test.ts
      at the PR head through the contents API and counts its it()/test() cases: 4.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/omnidash/contents/src/data-source/local-overlay-resolution.test.ts?ref=dbb2b26e90321551279a32e925e7ba35c9cd44cb' --jq '.content' | base64 -d | grep -cE '^\s*(it|test)\('
  - id: "dod-OmniNode-ai-omnidash-pr-343-ci"
    description: "PR #343 on OmniNode-ai/omnidash — product diff scope check (OMN-14425)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 343 --repo OmniNode-ai/omnidash --json files"
  - id: "dod-omn19994-current-head-native-vitest"
    description: >-
      Current proof for the merged overlay and missing-tenant behavior. GitHub squash-merged reviewed
      PR head a3d351b68e43 into 12ec580ac50b, so one check pins the reviewed head and merge identity while
      another proves the squash merge is present. The native Vitest files prove overlay precedence and
      the typed tenant-not-configured state, which is the AC2 falsifier. It binds no criterion: AC1 is
      still open behind OMN-19976, and a contract binding AC2 alone is refused as partial coverage (OMN-18333).
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omnidash-pr-343"
    checks:
      - check_type: "command"
        check_value: "git merge-base --is-ancestor 12ec580ac50bb09049e4c618976a3d9dce534082 HEAD"
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "command"
        check_value: >-
          uv run --project ${OMNI_HOME}/onex_change_control python -c "import json,subprocess,sys; d=json.loads(subprocess.check_output(['gh','pr','view','343','--repo','OmniNode-ai/omnidash','--json','headRefOid,mergeCommit']));
          sys.exit(0 if d['headRefOid']=='a3d351b68e436ef9a7d7fc6bcbafc762f75f41a0' and d['mergeCommit']['oid']=='12ec580ac50bb09049e4c618976a3d9dce534082'
          else 1)"
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: >-
          npm test -- --run src/data-source/local-overlay-resolution.test.ts src/components/dashboard/projection-container/ProjectionContainer.test.tsx
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn19994-current-head-native-vitest-v2"
    description: >-
      Append-only successor for the current-head native proof. The first merged item depended on the product
      checkout containing GitHub's squash merge object and failed when that object was absent. This item
      reads the exact PR identity and remote dev ancestry from GitHub, then runs the same native Vitest
      behavior files. AC1 remains open behind OMN-19976.
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-omn19994-current-head-native-vitest"
    checks:
      - check_type: "command"
        check_value: >-
          uv run --project ${OMNI_HOME}/onex_change_control python -c "import json,subprocess,sys; p=json.loads(subprocess.check_output(['gh','pr','view','343','--repo','OmniNode-ai/omnidash','--json','state,headRefOid,mergeCommit']));
          c=json.loads(subprocess.check_output(['gh','api','repos/OmniNode-ai/omnidash/compare/12ec580ac50bb09049e4c618976a3d9dce534082...dev']));
          sys.exit(0 if p['state']=='MERGED' and p['headRefOid']=='a3d351b68e436ef9a7d7fc6bcbafc762f75f41a0'
          and p['mergeCommit']['oid']=='12ec580ac50bb09049e4c618976a3d9dce534082' and c['status'] in ('ahead','identical')
          else 1)"
        cwd: "${OMNI_HOME}/onex_change_control"
      - check_type: "test_passes"
        check_value: >-
          npm test -- --run src/data-source/local-overlay-resolution.test.ts src/components/dashboard/projection-container/ProjectionContainer.test.tsx
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn19994-current-head-ci-vitest-v3"
    description: >-
      Append-only successor for the native Vitest proof. The v2 item runs `npm test` in the omnidash checkout,
      and the evidence sweep cannot run it: omnidash is an npm project with no pnpm `packageManager` pin,
      so dod_verify stages no lock-exact Node tree for it, and the sweep host carries no Node toolchain
      (v2 fails `sh: vitest: command not found`, reproduced 2026-10-02 at omnimarket dev 750808959). This
      item reads the same proof from omnidash's own CI. omnidash#343 merged as 12ec580ac with head a3d351b68,
      and on that head the `Typecheck & Tests` job (110241604423, run 36822729708) concluded success with
      its `Run tests with coverage` step green. Its log shows src/data-source/local-overlay-resolution.test.ts
      (4 tests) and src/components/dashboard/projection-container/ProjectionContainer.test.tsx (7 tests)
      passing among 196 test files. AC1 remains open behind OMN-19976.
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-omn19994-current-head-native-vitest-v2"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnidash/actions/jobs/110241604423 --jq '[.name,.conclusion,.head_sha,(.steps[]|select(.name=="Run tests with coverage")|.conclusion)]|join("|")' | grep -qxF 'Typecheck & Tests|success|a3d351b68e436ef9a7d7fc6bcbafc762f75f41a0|success' && gh api repos/OmniNode-ai/omnidash/pulls/343 --jq '[.merged,.head.sha,.merge_commit_sha]|map(tostring)|join(" ")' | grep -qxF 'true a3d351b68e436ef9a7d7fc6bcbafc762f75f41a0 12ec580ac50bb09049e4c618976a3d9dce534082'
  - id: "dod-omn19994-current-pr353-tenant-state-v1"
    description: >-
      Hand-authored behavior proof for the current OmniDash PR #353 head 1a03d9931a99. The focused tenant-state
      suite exercises the overlay tenant resolution and every tenant-scoped dashboard widget, proving
      the typed tenant-not-configured state without issuing a scoped request. The suite passes 71 tests
      across nine files. AC1 remains open behind OMN-19976.
    source: "manual"
    evidence_artifact: "extends_dod_evidence:dod-omn19994-current-head-ci-vitest-v3"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(git rev-parse HEAD)" = 1a03d9931a99843209f3602991a8940616ed6c94
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "command"
        check_value: >-
          uv run --project ${OMNI_HOME}/onex_change_control python -c "import json,subprocess,sys; d=json.loads(subprocess.check_output(['gh','pr','view','353','--repo','OmniNode-ai/omnidash','--json','state,headRefOid']));
          sys.exit(0 if d['state']=='OPEN' and d['headRefOid']=='1a03d9931a99843209f3602991a8940616ed6c94'
          else 1)"
        cwd: "${OMNI_HOME}/onex_change_control"
      - check_type: "test_passes"
        check_value: >-
          npm test -- --run src/components/dashboard/ComponentWrapper.test.tsx src/components/dashboard/projection-container/ProjectionContainer.test.tsx
          src/components/dashboard/delegation/DelegationMetrics3D.test.tsx src/components/dashboard/delegation/DelegationCostComparisonWidget.test.tsx
          src/components/dashboard/delegation/DelegationMetrics2D.test.tsx src/components/dashboard/delegation/DelegationTokenUsageWidget.test.tsx
          src/components/dashboard/delegation/DelegationQualityGateWidget.test.tsx src/data-source/http-snapshot-source.test.ts
          src/data-source/projection-tenant.test.ts; gh api repos/OmniNode-ai/omnidash/commits/1a03d9931a99843209f3602991a8940616ed6c94
          --jq .sha | grep -Fx 1a03d9931a99843209f3602991a8940616ed6c94
        cwd: "${OMNI_HOME}/omnidash"
    binds_ac:
      - "AC2"
