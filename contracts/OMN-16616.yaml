      runner (receipt run_timestamp 2026-08-30T14:17:12Z, exit_code 0), but it
      returns HTTP 404 for every other repo's CI GITHUB_TOKEN, and because
      `gh api` IS an admissible probe command the 404 scores a hard BLOCK rather
      than an INERT warning. That blocked OmniNode-ai/omninode_infra#1090 and
      would block every subsequent PR in any repo citing OMN-16616.
      This item does not re-assert the original claim from a token that cannot
      see the repo. It reads back the durable receipt the minting runner wrote,
      asserting both that the recorded status is PASS and that the receipt pins
      the same commit sha the probe resolved. Falsifiable: flip the status line
      or the sha in the receipt and this fails.
    source: "manual"
