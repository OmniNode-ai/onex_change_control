        check_value: "grep -c '^status: PASS$' drift/dod_receipts/OMN-16616/dod-OmniNode-ai-onex-self-extending-agent-243-ci/command.yaml
          && grep -c '9f1e9a30f988994a736f4d5c7ade3c50fb67e99a' drift/dod_receipts/OMN-16616/dod-OmniNode-ai-onex-self-extending-agent-243-ci/command.yaml"
