ticket_id: "OMN-16784"
title: "Autobind OCC evidence for OMN-16784"
summary: "OCC Evidence-Source autobind companion (OMN-13317 F1) for PR #1031."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1031 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "manual"
    description: "AC4 — zero denied sts:AssumeRoleWithWebIdentity on subject repo:OmniNode-ai/omninode_infra:pull_request
      in a 24h window after the fix landed. NOT YET SATISFIABLE AS WRITTEN: #1031 merged 2026-08-27T18:38:54Z,
      so the 24h mark is 2026-08-28T18:38Z. Measured over the 8.1h elapsed at 2026-08-28T02:45Z the AC's
      condition already holds — 33 AssumeRoleWithWebIdentity events since the merge, 0 denials, 22 of
      them successful assumptions of omninode-github-actions-plan-role — against a pre-fix denial rate
      of 5,160/7d (~30.7/h), i.e. ~248 expected. Recorded here rather than in dod_evidence deliberately:
      the receipt gate requires a PASS receipt on disk for EVERY dod_evidence item, so a clock-blocked
      item there would wedge the OMN-16784 receipt gate for every future PR citing this ticket, and the
      check needs live AWS credentials that node_dod_verify does not carry. `date -u -v-24H` is BSD/macOS;
      use `date -u -d '24 hours ago'` on GNU."
    command: "aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=AssumeRoleWithWebIdentity
      --start-time \"$(date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)\" --max-results 1000 --query 'Events[].CloudTrailEvent'
      --output json | python3 -c 'import json,sys; e=[json.loads(x) for x in json.load(sys.stdin)]; d=[x
      for x in e if x.get(\"errorCode\") and \"omninode_infra:pull_request\" in x.get(\"userIdentity\",{}).get(\"principalId\",\"\")];
      sys.exit(1 if d else 0)'"
emergency_bypass:
