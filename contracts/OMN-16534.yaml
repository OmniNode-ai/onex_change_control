ticket_id: "OMN-16534"
title: "OCC companion for OmniNode-ai/omninode_infra#991 (OMN-16534)"
summary: >
  deploy-onex-staging.yml was failing every apply with "spec.template.spec.containers[0].env[11].valueFrom:
  Invalid value: \"\": may not be specified when value is not empty". Forensics: PR #947 (OMN-16205) migrated
  omniweb's AUTH_URL env var from a literal to a configMapKeyRef valueFrom; the prior SSA apply (field
  manager "kubectl") still owned a live literal .value on that entry, and --force-conflicts does not implicitly
  clear a field the new manifest never mentions — the merged object carried both value and valueFrom and
  the apiserver rejected it. This is the OMN-14938 failure class in the mirror direction the v2 guard
  (added in #931) does not check. omninode_infra#991 adds the mirror predicate to the same guard step.
  Live remediation (a targeted kubectl JSON patch removing the stale literal) was applied directly to
  the dev cluster ahead of this PR and proven with a real green deploy-onex-staging.yml dispatch (run
  32862749407, apply step confirmed).
