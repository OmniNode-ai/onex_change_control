      The ticket body is the source and this block is the copy.
    acceptance:
      - id: AC1
        statement: 'AC1: The published beta board carries a tab labelled "Historical work" immediately
          right of Sprint status, and its panel renders a dated completion series -- falsifier: a read
          of the published board whose nav carries no "Historical work" entry, or whose panel renders
          no series rows'
      - id: AC2
        statement: 'AC2: The walk burndown credits a walk''s criteria only when the ticket sits in a completed
          state AND every one of its criteria is ticked -- falsifier: `python3 -m pytest tests/scripts/test_sprint_board_data.py
          -k TestWalkBurndown` reporting any failure, or a part-ticked walk moving the line'
      - id: AC3
        statement: 'AC3: Every completion in the lookback classifies into exactly one of carrier, sub-ticket,
          non-carrier sprint and unplanned work, and the tab states why its carrier count differs from
          the Sprint status tab -- falsifier: `python3 -m pytest tests/scripts/test_historical_board.py
          -k TestClassify` reporting any failure, or a completion counted in two classes'
      - id: AC4
        statement: 'AC4: A Linear read failure inside the historical load leaves the rest of the board
          publishing, with the failure printed in the run log -- falsifier: a publish run in which the
          historical load raised and the board did not publish'
      - id: AC5
        statement: 'AC5: No prose on the tab is width-capped: the copy spans the same container width
          as every other tab -- falsifier: `python3 -m pytest tests/scripts/test_historical_board.py -k
          TestRender` reporting any failure, or a `max-width` in ch or px on a text element of the tab'
