  - id: "dod-omn16290-ac3-deployed-lane-order-by-readback"
    description: >
      AC3 — live readback on the deployed projection-api, taken 2026-09-10 against the lab dev lane (compose
      project omnibase-infra, container omnimarket-projection-api, host port 3002), which is the surface
      the ticket's `proof_class: deployed` names. Read-only HTTP GETs only; nothing was mutated on any
      lane. The deployed OpenAPI document for GET /projection/{topic} declares parameters [topic, correlation_id,
      since, limit, order, order_by] — the parameter exists on the running service, not merely in source.
      Against topic onex.snapshot.projection.live-events.v1 (declared columns include id, event_id, type,
      timestamp, source, topic, summary, payload, correlation_id, created_at; contract default `created_at
      DESC`), limit=5, THREE distinct orderings were served from the same data -- no order_by reported
      `created_at DESC` leading with event_id ec5264b1-04e2-4be6-9a87-30376cc57376; `order_by=event_id
      ASC` reported `event_id ASC` leading with 0072bba6-ea82-402a-bfdf-a07329bf9ed6, 00927793-0b30-417c-b533-6a4bb6e9f94c,
      00b4a0e8-63fc-4df5-a2f4-6140e687b401; and `order_by=event_id DESC` reported `event_id DESC` leading
      with ff8b0d6c-ab9f-4aaa-a213-557ce966627f, fe97c912-6db8-4288-b718-22987c2de980, fe0d2b5b-60f1-465d-a311-126de094861e.
      The row sequences are disjoint in both direction and key, which is what "two order_by values producing
      different orderings" asks for. Rejection was exercised too: `order_by=not_a_column ASC` returned
      HTTP 422 `{"error": "invalid_order_by", "detail": "order_by column 'not_a_column' is not a member
      of the declared columns"}` and `order_by=event_id SIDEWAYS` returned HTTP 422 with the grammar message
