    checks:
      - check_type: "command"
        check_value: >-
          head="$(gh api repos/OmniNode-ai/omnimarket/pulls/1988 --jq .head.sha)" && test "$head" = "1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7"
          && model="$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_generation_consumer/models/model_generation.py?ref=1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7'
          --jq .content | base64 -d)" && handler="$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_generation_consumer/handlers/handler_generation_consumer.py?ref=1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7'
          --jq .content | base64 -d)" && contract="$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_generation_consumer/contract.yaml?ref=1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7'
          --jq .content | base64 -d)" && tests="$(gh api 'repos/OmniNode-ai/omnimarket/contents/tests/unit/nodes/node_generation_consumer/test_single_terminal_authority_omn15469.py?ref=1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7'
          --jq .content | base64 -d)" && printf '%s' "$model" | grep -q 'semantic_failed = benchmark.semantic_checked
          and not benchmark.semantic_passed' && printf '%s' "$model" | grep -q 'corpus_failed = benchmark.corpus_checked
          and not benchmark.corpus_passed' && printf '%s' "$model" | grep -q 'completed generation requires
          contract_passed with no checked' && printf '%s' "$model" | grep -q 'failed generation requires
          contract_passed=false or a checked' && test "$(printf '%s' "$handler" | grep -c 'return generation_terminal_from_benchmark')"
          = "3" && printf '%s' "$contract" | grep -q 'event_type: GenerationCompleted' && printf '%s'
          "$contract" | grep -q 'event_type: GenerationFailed' && printf '%s' "$tests" | grep -q 'test_verdict_routes_to_matching_contract_topic'
          && printf '%s' "$tests" | grep -q 'test_terminal_variants_reject_contradictory_verdicts' &&
          printf '%s' "$tests" | grep -q 'test_terminal_factory_routes_contract_valid_gate_failure_to_failed'
          && printf '%s' "$tests" | grep -q 'test_terminal_factory_preserves_wire_payload_and_base_benchmark'
