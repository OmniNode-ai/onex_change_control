    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-deploy-assessment-ghapi-head-4d529cad"
    checks:
      - check_type: "command"
        check_value: >-
          head="$(gh api repos/OmniNode-ai/omnimarket/pulls/1988 --jq .head.sha)" && test "$head" = "1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7"
          && model="$(gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_generation_consumer/models/model_generation.py?ref=1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7'
