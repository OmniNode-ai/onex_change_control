  - id: "dod-market1988-composite-terminal-verdict"
    description: >-
      Append-only correction evidence for omnimarket PR #1988 at exact head 1cac0e8df91fd956158366ce9e1b17b4f6bdb1a7.
      The typed terminal factory requires contract success with no checked semantic or corpus failure
      for the completed class/topic, routes the inverse composite verdict to the failed class/topic, preserves
