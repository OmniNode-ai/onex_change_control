    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The stability-test runtime reads Docker healthy with projection_apply_divergence HEALTHY at least 60 minutes after a governed refresh that carries the fix -- falsifier: at refresh plus 60 minutes, docker inspect omninode-stability-test-runtime State.Health.Status is healthy and curl :18085/health runtime_health shows projection_apply_divergence HEALTHY, both quoted in the PR body
      - id: "AC2"
        statement: |-
          AC2: The lane-health projection is not wired on a runtime whose declared lane is outside its scope and is still wired on compose-dev -- falsifier: uv run pytest over a unit test that builds the auto-wiring manifest for lane stability-test and for lane compose-dev and asserts projection_lab_lane_health is absent from the first and present in the second
      - id: "AC3"
        statement: |-
          AC3: The projection_apply_divergence detector carries no exemption, floor change or name-based exclusion for this writer -- falsifier: git diff origin/dev over src/omnibase_infra/runtime/health/projection_apply_flow.py on the fix branch is empty
      - id: "AC4"
        statement: |-
          AC4: The dev lane row keeps advancing after the fix -- falsifier: SELECT health_observed_at FROM omninode_internal.lab_lane_health WHERE lane = 'compose-dev' on omnibase-infra-postgres advances across two reads ten minutes apart
