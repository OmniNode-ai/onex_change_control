  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A runtime profile without trajectory_evaluation_backend is refused by the profile model -- falsifier: a pytest case constructing ModelRuntimeProfilePolicy without the field expects ValidationError
      - id: "AC2"
        statement: |-
          AC2: The rendered env sets DEV_TRAJECTORY_EVALUATION_BACKEND=in_memory and every other profile's value to off -- falsifier: uv run python scripts/render_runtime_policy_env.py into a scratch file, then a pytest case over it; the committed docker/runtime-policy.env equals the render
      - id: "AC3"
        statement: |-
          AC3: The dev lane's rendered resolver config gains exactly two mappings, dharma.api_key and dharma.org_id, each source_type: env -- falsifier: a pytest case parsing DEV_RUNTIME_EFFECTS_SECRET_RESOLVER_CONFIG_JSON from the rendered env and diffing the mapping set against the parent commit's
      - id: "AC4"
        statement: |-
          AC4: On the .201 dev lane after the deploy agent's redeploy, the effects container's ONEX_TRAJECTORY_EVALUATION_BACKEND reads in_memory -- falsifier: docker exec omninode-runtime-effects printenv ONEX_TRAJECTORY_EVALUATION_BACKEND on .201, with the lab-pass receipt for the merge sha quoted
      - id: "AC5"
        statement: |-
          AC5: Rendering compose with the dev-202 overlay gives off on its runtime services -- falsifier: docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.dev-202.yml config piped to a grep for the variable, quoted in the PR
      - id: "AC6"
        statement: |-
          AC6: No k8s tree sets the variable or maps a dharma.* ref -- falsifier: git -C <omninode_infra clone> grep -n -E 'TRAJECTORY_EVALUATION_BACKEND|dharma\.' origin/main -- k8s prints nothing, quoted in the PR
      - id: "AC7"
        statement: |-
          AC7: The compose silent-fallback guard passes with the two new empty-permitting names allowlisted and fails without the allowlist entry -- falsifier: uv run pytest tests/unit/infra/test_compose_no_silent_fallbacks.py -q, run once with the allowlist lines removed to show it fails
