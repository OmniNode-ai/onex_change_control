  - id: "dod-omn18139-ac4-casting-pairing-gate"
    description: |-
      OMN-18139 AC4 -- "blast radius from the source, not from the two lines in the evidence."

      Met, as a gate rather than as prose. Enumerated live at the merged sha: 24 untenanted adapter
      calls remain in the package and NONE names a relation whose app.tenant_id policy casts to uuid.
      Exactly two relations in the repo carry a casting policy -- delegation_events and
      capability_scores -- and the casting set is derived from the migrations themselves rather than
      from a hand-kept list, because the defect IS a relation's policy changing under a call site
      that did not change with it, and a list in a test file would go stale the same way.

      The invariant is stated as a PAIRING (an untenanted call must not name a casting relation)
      rather than as "every call must pass a tenant", which is what makes it survivable and therefore
      enforceable, and it fails closed from both directions: a new untenanted call on a casting
      relation is red, and so is a migration that converts a relation an untenanted call already
      touches.

      THE BLIND SPOT IS DECLARED IN THE MODULE, not left to be discovered. The repo-wide gate matches
      the relation NAME in the call's source text, so it is blind to a relation interpolated from a
      variable -- and both sites this ticket fixes were exactly that. It would NOT have caught the
      live defect. The module-scoped gate covers the dynamic case by requiring a tenant on every call
      in the one module that writes casting relations. Neither gate subsumes the other, and this item
      does not claim the weaker one is sufficient.

      Bound to AC4 ONLY.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC4"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnimarket/contents/tests/test_omn18139_tenant_guc_call_site_ratchet.py?ref=02abec5ad75d40dad2b9255ee6473b27b96cbb6a" --jq '.content' | base64 -d | grep -c 'class TestNoUntenantedCallTouchesACastingRelation'
