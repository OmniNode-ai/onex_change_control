  - id: "dod-omn18139-ac3-aggregate-scope-ruling"
    description: |-
      OMN-18139 AC3 -- "the aggregate republish semantics are ruled on before the code, not after."

      Met, and the ruling is recorded in the artifact rather than only in a PR body. The failing read
      carried a comment claiming "No tenant GUC: these views aggregate ACROSS tenants by definition".
      That was factually wrong about its own code in two ways: AsyncpgAdapter sets app.tenant_id on
      EVERY statement, so the omission never chose "no tenant" but an unnamed one; and a NOBYPASSRLS
      writer under FORCE ROW LEVEL SECURITY cannot read across tenants at all, so "platform-wide" was
      never available at this call site and is not what is being given up.

      The ruling taken is option (a) of the acceptance criterion: the aggregate is scoped to the
      tenant of the write that changed it, and the exposure says so. The four contract exposure
      comment blocks that called these aggregates platform-wide are corrected in the same change, so
      the contract no longer asserts a property the writer cannot deliver. The negative control below
      shows the old wording really was there at the parent, so this is a measured correction rather
      than a claim.

      Bound to AC3 ONLY.
    source: "manual"
    status: "verified"
