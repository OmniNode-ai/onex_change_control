  - id: "dod-omn18139-ac2-tenant-uuid-never-slug"
    description: |-
      OMN-18139 AC2 -- "the handler passes the canonical tenant UUID resolved by the OMN-16804 path,
      never a slug."

      Met. Both call sites that reached AsyncpgAdapter with no tenant= now name their tenant. The
      aggregate republish does NOT resolve the tenant a second time: _dynamic_upsert records the
      tenant it already resolved, in the same branch that increments the counter the republish is
      gated on, so the two cannot disagree about which write they describe. A second resolver over
      the same event is the "two divergent resolvers" class OMN-15919 and OMN-17422 were each an
      instance of, and this change does not add a third.

      _publish_aggregate_snapshots takes a KEYWORD-ONLY, NO-DEFAULT tenant. A default would
      reintroduce the defect silently, so a caller that omits it is a TypeError rather than a
      house-slug bind. That property is pinned by a signature assertion, not only by review.

      Bound to AC2 ONLY.
