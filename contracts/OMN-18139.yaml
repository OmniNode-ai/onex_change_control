  - id: "dod-omn18139-ac1-red-green-real-postgres"
    description: |-
      OMN-18139 AC1 -- "a red test at the parent reproducing the live failure string against real
      Postgres with the ::uuid policy, green at head."

      Met. OmniNode-ai/omnimarket#2445 (MERGED 2026-09-10, squash
      02abec5ad75d40dad2b9255ee6473b27b96cbb6a, released v0.4.49) adds
      tests/test_omn18139_real_postgres_tenant_guc_representation.py, which applies the live
      node_projection_delegation migration set to a disposable schema and drives the real
      DelegationProjectionRunner.project_event() through the real AsyncpgAdapter.

      NO DRIFT IS APPLIED, unlike the OMN-17228 module this one follows. Applying migrations 0007
      through 0034 in order lands the deployed onex-dev shape exactly: tenant_id uuid NOT NULL
      DEFAULT '820272f9-4aaf-5add-a2df-0af942852ab2'::uuid, relrowsecurity=t relforcerowsecurity=t,
      and tenant_isolation USING and WITH CHECK both
      (tenant_id = (current_setting('app.tenant_id'::text, true))::uuid).

      The fixture's real requirement is OWNERSHIP, and this is recorded because getting it wrong
      produced a green that proved nothing. FORCE ROW LEVEL SECURITY subjects the table owner to its
      own policies, but a superuser bypasses regardless -- and so does a plain view whose owner is a
      superuser, since base-table policies for such a view are evaluated as its owner. A first cut
      built the schema as postgres and handed the runner a NOBYPASSRLS login role; it passed while
      no policy ever evaluated. The schema is now created AUTHORIZATION the writer role with every
      migration applied under SET ROLE, and TestTheFixtureIsFaithful asserts that ownership, the
      ::uuid cast, and the slug refusal before any behaviour is asserted on it.

      Measured on a real Postgres 2026-09-10. At the squash parent
      f36822c59b48d8a36114891223f1041391b6ef82 the behavioural test raises
      asyncpg.exceptions.InvalidTextRepresentationError -- 'invalid input syntax for type uuid:
      "omninode"' -- which is the live dead-letter record's failure string byte-for-byte, from
      onex.dlq.omnimarket.projection-delegation-malformed.v1 offset 266 at 2026-09-10T10:21:18.312Z.
      At head all thirteen pass, verified against both a populated database and a freshly created
      one.

      HONEST LIMIT, stated so a green count cannot imply more than it proved: the OCC receipt runner
      executed this module in CI as '7 passed, 5 skipped'. The five real-Postgres tests SKIP where no
      database is provisioned. That runner receipt is a genuine PASS of the declared command and it
      does NOT carry the behavioural half. The behavioural proof is the lab execution recorded in
      this item's own receipt, and the merge-gating Integration Silent-Skip Guard (OMN-14172) is what
      makes the module actually execute on the job that does provision Postgres.

      Bound to AC1 ONLY. AC5 (the live staging readback) is NOT claimed by this item and is NOT met
      at the time of writing -- it requires the writer to restart on this release on onex-dev.
