        statement: |-
          AC1: a red push-triggered dev run creates exactly one Linear issue naming the repository and the head sha. Falsifier: a hermetic test driving a fake client with one failure run asserts exactly one create call carrying the sha.
      - id: "AC2"
        statement: |-
          AC2: a second tick on the same sha creates nothing. Falsifier: the same test, run twice against a search client that returns the first issue, asserts zero creates on the second pass.
      - id: "AC3"
        statement: |-
          AC3: an unreadable API creates nothing, logs which read failed, and exits non-zero. Falsifier: a test whose client raises on the run list asserts zero creates, a non-zero exit, and the failing read named in the output.
      - id: "AC4"
        statement: |-
          AC4: a green run creates nothing and exits zero. Falsifier: a test with one success run asserts zero creates and exit 0.
      - id: "AC5"
        statement: |-
          AC5: a cancelled run is a non-verdict, neither red nor green. Falsifier: a test with one cancelled run asserts zero creates, zero comments and a distinct outcome token from the green case.
      - id: "AC6"
        statement: |-
          AC6: the merge pull request of a red sha receives one comment naming the failing jobs. Falsifier: a test asserts the comment body contains each failing job name and the sha, and that a repeated tick posts no second comment.
      - id: "AC7"
        statement: |-
          AC7: the watched-repository set is configuration, not a Python literal, so adding a repository after its own trigger lands is a data change. Falsifier: a test asserts no repository slug appears as a literal in the module's decision path.
