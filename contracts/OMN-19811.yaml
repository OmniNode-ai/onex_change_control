  - id: dod-omn19811-33a1-ac4-deploy-window-accepted
    description: AC4 independent acceptance by lane omn19811-33a1-2a21 of the deploy-window binding proposed
      by landing-L2149-h202. The lane re-ran the original bound job-log check and inspected the successful
      dev chain-canary.yml run 37193369383, job 111410052502, at 2ad2097757d61c1a9a4b6b70cb4d40494a3b01eb.
      The receipt-derived block names the dev-201 agent http://192.168.86.201:8098, the deploy window
      and pre-fire convergence. The pinned workflow resolves deploy_agent_url from the lane overlay (OMN-19894),
      replacing the host.docker.internal:8098 alias in the criterion. This acceptance treats the declared
      dev-201 address as the same deploy-agent surface required by AC4; it does not claim the obsolete
      alias was contacted. The probe asserts the run and job identity, agent, window and converged=True,
      and rejects missing-agent, non-convergence and missing-window controls. Existing proposals remain
      unchanged.
    source: generated
    execution_scope: local_done_gate
    evidence_artifact: supersedes_dod_evidence:dod-c15-19811-ac4-deploy-window-log-escapes
    checks:
      - check_type: command
        check_value: |-
          bash -eu <<'CHECK'
          set -o pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          gh api repos/OmniNode-ai/omnibase_infra/actions/runs/37193369383 > "$root/run.json"
          gh api repos/OmniNode-ai/omnibase_infra/actions/jobs/111410052502 > "$root/job.json"
          gh api repos/OmniNode-ai/omnibase_infra/actions/jobs/111410052502/logs --allow-escape-sequences > "$root/job.log"
          python3 - "$root" <<'PYPROBE'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          run = json.loads((root / "run.json").read_text())
          job = json.loads((root / "job.json").read_text())
          assert run["id"] == 37193369383
          assert run["path"] == ".github/workflows/chain-canary.yml"
          assert run["head_branch"] == "dev"
          assert run["head_sha"] == "2ad2097757d61c1a9a4b6b70cb4d40494a3b01eb"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert job["run_id"] == run["id"] and job["id"] == 111410052502
          assert job["name"] == "Chain Canary (dev lane)" and job["conclusion"] == "success"
          log = re.sub(r"^[0-9T:.Z-]+ ", "", (root / "job.log").read_text(), flags=re.M)
          assert "lane dev-201 deploy agent: http://192.168.86.201:8098" in log
          start = log.index("deploy window (OMN-19811):\n")
          block = "\n".join(log[start:].splitlines()[:5])
          def valid(value):
              return all((
                  value.startswith("deploy window (OMN-19811):\n"),
                  "  - status: `not_needed`" in value,
                  "  - deploy agent: http://192.168.86.201:8098" in value,
                  "  - deploy job(s) in the first attempt's window: none" in value,
                  re.search(r"  - pre-fire deploy: [0-9a-f-]{36}, queued 1 \(waited [1-9][0-9]*s, converged=True\)", value) is not None,
