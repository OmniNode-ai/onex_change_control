      be edited in place (append-only discipline); this entry and its OMN-15374 counterpart supersede
      the ATTRIBUTION of all six receipts without altering their check_value history, and bind fresh receipts
      under `drift/dod_receipts/OMN-15136/occ6077-receipt-attribution-fix/command.yaml` with a truthful
      runner (the agent that actually re-ran the pivotal probes below) and a verifier identity ("verify:evening-followups-opus")
      that had NOT yet run at the time this entry was authored -- that verifier's own independent re-execution
      and attestation is a separate follow-on event, not claimed here in advance.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:occ-self-bind-pr-5745-superseded,dod-infra769-no-live-mutation-claim-superseded,occ-self-bind-pr-6077"
