  # --- OMN-15374/OMN-15136 supersession-grammar repair (append-only correction of #6080) ---
  - id: "occ6080-grammar-repair-note"
    description: >-
      Append-only diagnostic note, not itself a supersession. The `occ6077-receipt-attribution-fix` entry
      immediately above (landed by PR #6080, merge commit 90b63455e171f01779b85bfaa861b65ce94498ef) declares
      `evidence_artifact: "supersedes_dod_evidence:occ-self-bind-pr-5745-superseded,dod-infra769-no-live-mutation-claim-superseded,occ-self-bind-pr-6077"`
      -- a single string naming THREE target ids joined by commas. `ModelContractDodItem.evidence_artifact`
      is `str | None`, and both `EvidenceCollector._supersedes_marker` (omnimarket) and `contract_compliance_check._supersedes_marker`
      (this repo) read the ENTIRE string after the `supersedes_dod_evidence:` prefix as ONE literal id
      -- there is no comma-splitting or list grammar in either parser. The three-id string therefore matches
      no `id` in this contract's `all_ids` set, so `_resolve_supersessions` classifies it DANGLING_SUPERSESSION
      and marks `occ6077-receipt-attribution-fix` malformed. Per `EvidenceCollector._collect_impl` (evidence_collector.py,
      phase 3): a malformed item's own FAILED verdict is emitted unconditionally, checked BEFORE whether
      the item is itself later targeted by a well-formed supersession marker -- so no subsequent append-only
      entry, however well-formed, can retire that FAILED result. This is intentional anti-laundering design
      (OMN-15382/OMN-15390), not a bug. Confirmed empirically against `EvidenceCollector._resolve_supersessions`
      and live against this exact contract (see the identical note in `contracts/OMN-15374.yaml` for the
      full derivation). The three entries below correct the ATTRIBUTION-HONESTY defect the broken entry
      was trying to express using the correct one-target-per-marker grammar; they do NOT and cannot retire
      `occ6077-receipt-attribution-fix`'s own FAILED verdict -- that is a permanent scar on this contract
      under the current parser. Separately and independently, `occ-self-bind-pr-5745-superseded`'s own
      auto-appended `::pr-live-state` check currently fails: PR #5745 (merged 2026-07-31T13:11:21Z, merge
      e0449955bf2427a01efa6df86ad6e6629091434b) shows two red required checks (`occ-preflight / eligibility`,
      `verify / verify`) when read live via `gh pr checks 5745 --repo OmniNode-ai/onex_change_control`,
      but those specific check-runs (job ids 91286676527 / run 30670388735, and job 91234426340 / run
      30654185783) are titled against PR #5749, not #5745 -- a cross-PR head-SHA rollup artifact (the
      two PRs share commit history, so GitHub associates #5749's check-runs with #5745's `gh pr checks`
      output too), the same `pr_ticket_mismatch`-class post-merge artifact documented for PR #784/#5855
      elsewhere in this contract family. `EvidenceCollector._fetch_pr_checks_green` (OMN-14390) reads
      LIVE current required-check state unconditionally and fails closed on any non-green required context,
      by design, with no override available to a contract entry's own check_value -- any dod_evidence
      item that binds to PR #5745 in ANY form (`gh pr view`, `gh api .../pulls/5745`, id-convention, or
      receipt `pr_number`) gets this same auto-appended check and inherits the same live failure. This
      is a genuine, currently-true, unresolved external fact (not a wording or grammar defect in this
      contract), so it is NOT fixed by `occ6080-attribution-fix-5745` below -- that entry corrects attribution
      honesty only and is expected to show its own `::pr-live-state` sub-check FAILED for the same live
      reason until PR #5745's check-runs are re-resolved on GitHub's side.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test -f contracts/OMN-15136.yaml && grep -q 'occ6077-receipt-attribution-fix' contracts/OMN-15136.yaml
          && printf 'diagnostic note anchor PASS\n'
