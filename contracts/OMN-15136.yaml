      and `drift/dod_receipts/` paths -- the exact condition being asserted -- `grep -v` filters every
      line and exits 1. `EvidenceCollector._run_command_check` executes checks as `subprocess.run(["bash",
      "-o", "pipefail", "-c", cmd_str], ...)` (OMN-15382 hardening), so `pipefail` propagates grep's exit-1-on-full-filter
      as the pipeline status even though `wc -l` itself succeeds and prints `0` -- the `&&` chain aborts
      before `test "$non_receipt_count" -eq 0` ever runs, so the check fails precisely BECAUSE the no-live-mutation
      claim it asserts is true. Proven both directions (see `occ6088-pipefail-safe-reprobe` immediately
      below for the isolated repro transcript, identical underlying grammar). The underlying facts were
      never in question and are re-asserted below using `awk '!/pattern/'` in place of `grep -v` -- unlike
      `grep`, `awk`'s exit status reflects only execution success, never the count of lines selected,
      so an all-filtered result no longer poisons the pipeline's exit status under `pipefail`, while a
      genuine non-empty match (a real live-mutation file) still fails the `test -eq 0` and correctly returns
      non-zero -- verified as a negative control before this entry was authored. A `{ grep -v ... || true;
      }` wrapper was tried first and rejected: `lint_contract_check_values.py`'s `trailing || true` anti-pattern
      (OMN-9350) matches `|| true` anywhere in the value, not only at the very end, so it flagged the
      wrapper even though it guards one sub-command, not the whole check -- the `awk` rewrite avoids a
      fail-open guard entirely rather than requesting a lint exemption. This entry supersedes ONLY `occ6087-no-live-mutation-portable-reprobe`
      by single id, mirroring the proven shape of merged OCC#6111 (`supersedes_dod_evidence:occ6077-receipt-attribution-fix`,
      no comma-join). Receipt bound at `drift/dod_receipts/OMN-15136/occ6087-pipefail-safe-reprobe/command.yaml`,
      `status: PENDING` (this lane is the runner only; a distinct identity must independently re-execute
      and flip to PASS before merge eligibility, matching merged #6111 precedent).
