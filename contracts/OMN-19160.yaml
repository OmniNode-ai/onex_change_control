    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The refusal text names the exact remedy command, with its --action close argument and the pull request it applies to, as the first actionable line. -- falsifier: trigger the guard on an unclaimed close in a fixture and assert the refusal contains the literal pr_claim_registry_cli.py and --action close and the pull-request number; today's text does not, so it is red first.
      - id: "AC2"
        statement: |-
          AC2: The refusal leads with the missing precondition rather than with the INDETERMINATE verdict. -- falsifier: the same fixture asserts the first non-blank line of the refusal states the claim is missing; a refusal whose headline is still the verdict class fails this.
      - id: "AC3"
        statement: |-
          AC3: The precondition is discoverable before the attempt, from a surface a lane reads on the path to closing a pull request. -- falsifier: name the surface in the pull request and show it carries the requirement — a dispatch-brief rules line, the guard's own --help, or the merge/close skill's documented steps — and show a lane following that surface end to end never meets the refusal.
      - id: "AC4"
        statement: |-
          AC4: The guard still refuses an unclaimed close. -- falsifier: a test asserts an unclaimed close is refused after the change. This is the negative control; a fix that improves the message by relaxing the refusal, or by auto-claiming on the lane's behalf, fails it — auto-claiming would destroy the attribution the OMN-16485 threshold exists to produce.
      - id: "AC5"
        statement: |-
          AC5: The message contract is pinned by a test wired into a live gate, not left to convention. -- falsifier: the pull request names the test file and the CI job or pre-commit hook that runs it, and reverting the message change leaves that test red (Operating Rule 5).
      - id: "AC6"
        statement: |-
          AC6: The adjacent self-lockout mode is explicitly dispositioned — fixed here, split to its own ticket, or named as out of scope with a reason. -- falsifier: this ticket carries a comment naming which of the three, citing fr-pr-close-guard-lane-identity-mismatch-self-lockout; silence fails it.
