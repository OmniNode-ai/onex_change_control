      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A clean worktree whose branch has a MERGED PR, matched by head branch name or by exact HEAD oid under a different local branch name, is removed together with its emptied ticket dir -- falsifier: python3 -m pytest tests/test_merged_worktree_reaper.py -k removes_merged in omni_home
      - id: "AC2"
        statement: |-
          AC2: A worktree whose branch carries commits beyond the merged PR head, whose content is not already in the base, has those commits pushed to a rescue ref before removal, and the rescue ref resolves to the old HEAD afterwards -- falsifier: python3 -m pytest tests/test_merged_worktree_reaper.py -k rescues_unmerged_commits in omni_home
      - id: "AC3"
        statement: |-
          AC3: A worktree whose branch has an OPEN PR is kept, and so is one with a live process cwd or a recently modified file -- falsifier: python3 -m pytest tests/test_merged_worktree_reaper.py -k keeps in omni_home
      - id: "AC4"
        statement: |-
          AC4: Untracked build junk (.venv, pycache, caches, node_modules) does not block removal, and tracked edits plus non-junk untracked files are copied to the preserve directory before removal -- falsifier: python3 -m pytest tests/test_merged_worktree_reaper.py -k junk_or_preserve in omni_home
      - id: "AC5"
        statement: |-
          AC5: The check mode exits non-zero and names each worktree whose PR merged longer ago than the threshold and that is still on disk -- falsifier: python3 -m pytest tests/test_merged_worktree_reaper.py -k check_mode in omni_home
      - id: "AC6"
        statement: |-
          AC6: An hourly launchd label runs the reaper through the tick driver and its fire receipt appears in fire-receipts.jsonl -- falsifier: launchctl print gui/501/ai.omninode.merged-worktree-reaper plus a receipt row for workflow merged-worktree-reaper in .onex_state/morning-workflows/fire-receipts.jsonl
      - id: "AC7"
        statement: |-
          AC7: One real execute pass over the current backlog is recorded with removed, rescued and kept counts in a ledger TERMINAL row -- falsifier: the TERMINAL row for this ticket states the three counts, and the reaper check mode run afterwards reports only rows the pass named as kept
