---
schema_version: "1.0.0"
ticket_id: "OMN-15243"
title: "Extend the no-raw-prod-bypass CI gate to stability-class raw-mutation recipes"
summary: >-
  OCC companion for OMN-15243. The OMN-15218 lane-deploy attribution record and fail-closed live-prod-grant
  interlock guard only the sanctioned deploy path. A raw `docker tag`/`docker commit` retag, or a direct
  force-recreate of the `omnibase-infra-stability-test` / `omnibase-infra-judge` compose projects, still
  mutates the lane with zero attribution and zero interlock. This widens the existing prod-only matcher
  in OmniNode-ai/omni_home:tests/test_no_raw_prod_bypass_policy.py to the stability-class governed lanes,
  keeps the single `# raw-prod-bypass-ok:` escape marker, and removes the workflow `paths:` filter that
  let a corpus-visible recipe skip the job. Net-surface: zero new gates, workflows, scripts, or markers
  — one existing matcher widened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: >-
      RED proven against exists-but-wrong: the pre-change matcher explicitly asserted stability lanes
      were out of scope, and passed a seeded stability recipe.
    command: "python3 -m pytest tests/test_no_raw_prod_bypass_policy.py -q"
  - kind: "ci"
    description: "Gate workflow green on the omni_home PR."
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json number,state"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
