    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The step distinguishes measured from not-measured — falsifier: a deploy-onex-staging run's step log names every Deployment it skipped for declaring zero replicas and prints the count it actually measured; a run in which a zero-replica Deployment is reported as successfully rolled out with no annotation fails this, and the run id must be cited
      - id: "AC2"
        statement: |-
          AC2: Declared-versus-live replica drift fails the deploy — falsifier: a unit test drives the step's logic with declared 1 / live 0 and asserts a non-zero exit naming the Deployment, and with declared == live asserts exit 0; a test that only exercises the equal case does not satisfy this, because that is the path which already passes
      - id: "AC3"
        statement: |-
          AC3: The roster cannot drift from the tree — falsifier: a test tree-derives every k8s/onex-dev/runtime/deployment-*.yaml name and fails if the workflow roster omits one; removing a single name from the roster must turn it red, demonstrated before the fix lands rather than asserted
      - id: "AC4"
        statement: |-
          AC4: C1's board wording states what it measures — falsifier: tools/beta_board/beta_board_data.py no longer claims "all runtime deployments Ready" for C1, the replacement names the zero-replica exclusion without hardcoding a count that will age, and the regenerated board renders the amended text
