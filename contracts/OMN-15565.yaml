title: "Bind e2e compose lane isolation evidence"
summary: >
  Manual OCC companion for OmniNode-ai/omnibase_infra PR #2591. The product change isolates the nightly
  e2e compose project from the live lab/dev compose lane by namespacing the project, containers, volumes,
  network, workflow invocations, and regression tests at the immutable product head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2591 CI checks green"
    command: "gh pr checks 2591 --repo OmniNode-ai/omnibase_infra"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-infra2591-e2e-compose-lane-isolation"
    description: >-
      Binds OMN-15565 to omnibase_infra PR #2591 at exact head d203ed0bb29035636674f5d051a109c2b055bff2.
      The probe reads immutable GitHub content for the workflow, compose file, and regression test, and
      fails closed if the PR head moves or the lane-isolation namespace/ratcher artifacts disappear.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          head="$(gh api repos/OmniNode-ai/omnibase_infra/pulls/2591 --jq .head.sha)" && test "$head"
          = "d203ed0bb29035636674f5d051a109c2b055bff2" && tree="$(gh api "repos/OmniNode-ai/omnibase_infra/git/trees/$head?recursive=1")"
          && printf '%s' "$tree" | jq -e '.tree[] | select(.path==".github/workflows/nightly-integration.yml"
          and .sha=="d4f154215eefad1c3372287bedecfe6bb856e9f6")' >/dev/null && printf '%s' "$tree" | jq
          -e '.tree[] | select(.path=="docker/docker-compose.e2e.yml" and .sha=="85f0a0d8ea0636d1304faa83769be7740925ef7b")'
          >/dev/null && printf '%s' "$tree" | jq -e '.tree[] | select(.path=="tests/unit/docker/test_e2e_compose_lane_isolation.py"
          and .sha=="4dd56e2e488e3bcbcbcfb1a8262bd19bf80c5caa")' >/dev/null && workflow="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/nightly-integration.yml?ref=$head"
          --jq .content | base64 -d)" && compose="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.e2e.yml?ref=$head"
          --jq .content | base64 -d)" && tests="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/docker/test_e2e_compose_lane_isolation.py?ref=$head"
          --jq .content | base64 -d)" && printf '%s' "$workflow" | grep -q 'Derive isolated e2e namespace'
          && printf '%s' "$workflow" | grep -q -- 'docker compose -p "${OMNIBASE_INFRA_COMPOSE_PROJECT}"'
          && printf '%s' "$workflow" | grep -q -- 'docker compose -p "$project" -f docker/docker-compose.e2e.yml
          down -v --remove-orphans' && printf '%s' "$workflow" | grep -q 'Assert e2e project is not a
          live lane' && printf '%s' "$compose" | grep -q 'OMNIBASE_INFRA_COMPOSE_PROJECT:-omnibase-infra-e2e'
          && printf '%s' "$compose" | grep -q 'OMNIBASE_INFRA_POSTGRES_CONTAINER:-omnibase-infra-e2e-postgres'
          && printf '%s' "$compose" | grep -q 'OMNIBASE_INFRA_NETWORK:-omnibase-infra-e2e-network' &&
          printf '%s' "$tests" | grep -q 'test_e2e_project_default_is_not_a_censused_lane' && printf '%s'
          "$tests" | grep -q 'test_every_workflow_e2e_compose_invocation_names_its_project' && printf
          'infra2591 e2e compose lane isolation PASS\n'
