          && test "$branch" = "jonah/omn-15565-teardown-protected-guard" && tree="$(gh api "repos/OmniNode-ai/omnibase_infra/git/trees/$head?recursive=1")"
          && printf '%s' "$tree" | jq -e '.tree[] | select(.path==".github/workflows/nightly-integration.yml"
          and .sha=="d7e5888df247b72f872cf20a3c91deab0531911c")' >/dev/null && printf '%s' "$tree" | jq
          -e '.tree[] | select(.path=="tests/unit/docker/test_e2e_compose_lane_isolation.py" and .sha=="184a033c4eee4d3002b04453af738f785fb97fec")'
          >/dev/null && workflow="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/nightly-integration.yml?ref=$head"
          --jq .content | base64 -d)" && tests="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/docker/test_e2e_compose_lane_isolation.py?ref=$head"
          --jq .content | base64 -d)" && printf '%s' "$workflow" | grep -Fq 'if: always()' && printf '%s'
          "$workflow" | grep -Fq 'if [[ "$project" != "$expected_project" ]]; then' && printf '%s' "$workflow"
          | grep -Fq 'open("deploy/lane-census/lane-manifest.yaml", encoding="utf-8")' && printf '%s'
          "$workflow" | grep -Fq 'if project in protected:' && printf '%s' "$workflow" | grep -Fq 'docker
          compose -p "$project" -f docker/docker-compose.e2e.yml down -v --remove-orphans' && printf '%s'
          "$tests" | grep -Fq 'def _run_teardown_with_stubs(' && printf '%s' "$tests" | grep -Fq 'subprocess.run('
          && printf '%s' "$tests" | grep -Fq 'def test_nightly_teardown_rejects_every_non_run_project_without_docker('
          && printf '%s' "$tests" | grep -Fq 'def test_nightly_teardown_downs_exact_run_project_once('
          && printf '%s' "$tests" | grep -Fq 'assert teardown["if"] == "always()"' && printf '%s' "$tests"
          | grep -Fq 'manifest_load = '\''open("deploy/lane-census/lane-manifest.yaml", encoding="utf-8")'\'''
          && printf 'head=%s\nbranch=%s\nworkflow_blob=%s\ntest_blob=%s\ninfra2599 teardown exact-head
          guard PASS\n' "$head" "$branch" d7e5888df247b72f872cf20a3c91deab0531911c 184a033c4eee4d3002b04453af738f785fb97fec
