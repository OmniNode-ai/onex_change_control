        statement: |-
          AC-1 — a CI gate (and ideally a pre-commit hook) computes, for any PR touching .github/workflows/*.yml, the set of check-run names each currently-live PR-triggered workflow file in .github/workflows/ is capable of producing (job name:s, workflow name where single-job), diffs base vs. head, and refuses when a name in that set that also appears as a REQUIRED row in .github/required-checks.yaml or in live branch-protection required_status_checks would no longer be producible after the merge (file deleted, or renamed without a corresponding required-checks.yaml repoint in the SAME PR, per the OMN-16281 pattern's own "byte-identical job name... zero branch-protection mutation" precedent). — falsifier: a test PR that deletes a workflow producing a context named mode: REQUIRED in required-checks.yaml with no repoint asserts the gate exits non-zero naming the context; a companion test that deletes a workflow producing only non-required contexts asserts the gate passes, proving it is not a blanket no-deletions rule.
      - id: "AC2"
        statement: |-
          AC-2 — extend the same check (or a sibling one) to also refuse a PR that modifies a workflow file such that a job's name: changes without a same-PR required-checks.yaml repoint, closing the rename half of the class alongside the delete half. — falsifier: a test PR renaming a required job with no repoint is refused; a test PR renaming the same job WITH a repoint passes.
