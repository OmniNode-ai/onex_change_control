  - id: "dod-omn19987-omnidash-pr-397-code"
    description: >-
      PR #397 on OmniNode-ai/omnidash: hosted code fact at the PR head 9680b96808ea. The Workflow page's
      contract declaration src/pages/local/workflow.contracts.yaml binds the run-trace.v1 exposure; the
      same grep finds 0 on dev f3ffde6096ef, so it can go red. The read and the decode each stop the check
