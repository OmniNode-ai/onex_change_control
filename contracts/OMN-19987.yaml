      as a fixed string. The behaviour proof is the local item dod-omn19987-omnidash-pr-397-page-tests.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          content="$(gh api 'repos/OmniNode-ai/omnidash/contents/src/pages/local/workflow.contracts.yaml?ref=9680b96808eaae6c889e42a3cbe8276a046e5ea7' --jq '.content')" || exit 1
          decoded="$(printf '%s' "$content" | base64 -d)" || exit 1
          printf '%s\n' "$decoded" | grep -c -F '"projection_topic": "onex.snapshot.projection.run-trace.v1"'
  - id: "dod-omn19987-omnidash-pr-397-page-tests"
    description: >-
      PR #397 on OmniNode-ai/omnidash, hand-authored companion (OMN-15247); occ-autobind skips draft PRs.
      The check runs the two Workflow page test files: the served steps of one run drawn in the order
      served with nothing re-ordered in the page, the run opened from the Runs list or by a pasted id,
      the newest run when no id is given, and a late answer to an overtaken read never replacing a newer
      run. 36 passed at the PR head 9680b96808ea; over a copy of dev f3ffde6096ef with only those two
      test files and their recorded fixture laid in, 35 of the 36 fail, so the check can go red. This
      item claims no criterion: the ticket's AC1 and AC2 are about the fold and its tenant scope, and
      they are bound to the node's own tests in omnimarket's contracts/OMN-19987.yaml (omnimarket#3839);
      the page proves neither. Two other tests at this head, in src/pages/local/pages.test.ts, fail until
      the captured lab catalogue holds run-trace.v1; they are not part of this check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          npm test -- --run src/pages/LocalDashboardPage.omn19987.workflow-page.test.tsx src/pages/LocalDashboardPage.omn19987.test.tsx
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn19987-merged-pr-3839-citation"
    description: >-
      The merged-PR citation for this ticket. The durable evidence gate takes it from a PASS receipt that
      carries pr_number, commit_sha and a repository named in the probe text; none of this ticket's earlier
      receipts names a merged pull request that way, so the gate found no citation. The check reads omnimarket#3839
      (the run-trace fold, its writer and run-trace.v1, which AC1 and AC2 are about) and passes only when
      it is MERGED as commit e6ef62fc4d49. It is red when the pull request is not merged, when its merge
      commit is another one, and when the read fails, even after printing a matching line. It binds no
      acceptance criterion: it says which merged change the ticket's proofs are about.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 3839 --repo OmniNode-ai/omnimarket --json number,state,url,mergeCommit --jq '"\(.number) \(.state) \(.mergeCommit.oid) \(.url)"' | grep -E '^3839 MERGED e6ef62fc4d497d2005fa6458148ab4a7b64a6970 https://github[.]com/OmniNode-ai/omnimarket/pull/3839$'
          test "${PIPESTATUS[0]}${PIPESTATUS[1]}" = "00"
