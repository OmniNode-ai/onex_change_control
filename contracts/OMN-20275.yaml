        statement: |-
          AC3: a RULING or OPERATOR-CONSENT row in a bus request is refused before the append command runs -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect -q -k consent_and_ruling_refused_over_bus
      - id: "AC4"
        statement: |-
          AC4: onex-ledger with ONEX_LEDGER_WRITE_VIA=bus writes nothing locally, publishes one request carrying req= and via=bus cells, and exits with the receipt exit code; with the publisher missing it refuses with exit 69 and names the variable -- falsifier: uv run pytest tests/ledger -q -k bus_write_mode
      - id: "AC5"
        statement: |-
          AC5: a remote-lane run on h202 writes its own CLAIM and TERMINAL through the ledger skills, and both rows are in the ledger of record and in omninode_internal.work_ledger_rows with the same row_id -- falsifier: grep -c of the run lane in the ledger file expecting 2, plus psql count(*) from omninode_internal.work_ledger_rows where raw_row like the run lane expecting 2
