schema_version: "1.0.0"
ticket_id: "OMN-18159"
title: "Port the delegation projection writer to the runtime kernel so delegation_events is written as
  tenant_projection_writer"
summary: >
  OCC companion for OmniNode-ai/omnimarket#2457 — the first landed slice of OMN-18159, which binds AC1
  only, and binds it PARTIALLY. What #2457 closes is the sub-gap AC1 names first: the shared SYNC projection
  write protocol could not express an attested write at all. Green-bar leg 4 requires the newest delegation_events
  row from a tenant outside the historical compiled map to carry writer_identity == "tenant_projection_writer",
  and that column can only be produced by a statement carrying a SQL expression Postgres evaluates per
  row on BOTH arms. delegation_events is written today by DelegationProjectionRunner, a standalone async
  process whose _dynamic_upsert can do that; the in-process def-B handler that must take the table over
  writes through ProtocolProjectionDatabaseSync.upsert(table, conflict_key, row) -> bool, which supports
  none of the four required capabilities — SQL-expression columns, insert-only columns withheld from the
  DO UPDATE arm, RETURNING, or an explicit tenant override. node_projection_delegation/contract.yaml lines
  322-331 already recorded this widening as its own change with the adapter implementations in scope.
  #2457 is that change. It adds omnimarket/projection/upsert_statement.py, which owns the decisions (which
  column goes on which arm, which expression is admissible, which identifier is safe) and renders them
  into each driver's placeholder style, and implements the capability on the three sync adapters. THE
  DESIGN DECISION WORTH THE REVIEW: the attested write is a SEPARATE runtime_checkable protocol, not two
  more methods on the existing one. A runtime_checkable protocol matches on method PRESENCE, so adding
  a method to ProtocolProjectionDatabaseSync silently reclassifies every structural implementation as
  a non-implementation; around twenty test doubles in that repo implement the three-argument upsert and
  nothing else, and every projection handler guarding its injected adapter with an isinstance check would
  have raised TypeError against all of them at once, with no compiler warning. That was hit during the
  build and backed out, and a standing test now asserts the base protocol did not grow a method. WHAT
  IS DELIBERATELY NOT DONE, stated rather than implied. DelegationProjectionRunner is UNCHANGED — it writes
  the live business-proof path, and converging it onto the shared builder is a separate change; what is
  asserted instead is a differential ratchet between two live implementations, which cannot go stale the
  way a copied constant can. No existing caller changes behaviour: upsert keeps its signature and its
  bool, and every adapter's default-argument path renders the statement it rendered before. AC1 is NOT
  fully discharged by this PR — the nine-commit handler port, the tenant-scoped read fix, the missing
  delegation_shadow_comparisons writer and the kernel adapter's own widening in omnibase_infra all remain.
  AC2 and AC3 are not started and are NOT bound here. RULE 24(d): the .201 compose dev lane runs no onex-api,
  has row-level security off and writes as a superuser, so the RLS-dependent halves — the insert-only
  column's WITH CHECK behaviour and the scoped writer principal the attestation records — are NOT exercised
  by the lab pass; what the lab proves is the expression semantics and the statement shape against a real
  Postgres, and the RLS proof is owed by AC3's staging readback and is not claimed here. No cluster object
  was mutated, no workflow was dispatched, no credential was minted, rotated, re-issued or revoked, and
  no secret value was read or printed (rule 22). ONE PROOF IS DELIBERATELY NOT A dod_evidence ITEM, and
  the reason is worth stating: the property that POSTGRES rather than the application evaluates the attestation
  expressions, and that the DO UPDATE arm restates them instead of leaving a re-written row wearing its
  FIRST writer's stamp, can only be shown against a real Postgres. It was shown, on the .201 lab dev lane,
  5 tests passing (rule 24, lab before staging), and it is recorded in the product PR body and the work
  ledger. It is NOT declared here because the product repo's CI runner has no reachable Postgres: the
  same command there selects the 5 integration tests, skips all 5, exits 0 and would be written up as
  a PASS. A check that reports success by running nothing is the vacuous-evidence shape this corpus exists
  to refuse, and it would be worse than no item at all.
