    description: >
      PR #2465 on OmniNode-ai/omnimarket — Phase 1b(i). All three delegation-table write paths now go
      through one site that stamps the write attestation and republishes the row the database stored onto
      the per-row decisions exposure, closing the gap this node's own contract had recorded in writing
      ("THE SYNC HANDLER DOES NOT PUBLISH ... widening the shared protocol to return the stored row is
      its own change with three adapter implementations in scope"). One site rather than three because
      a row durable from one path and invisible to a reader from another is worse than either state alone.
      A store that cannot perform an attested write is REFUSED by name rather than fallen back from: the
      fallback persists the row with writer_identity NULL on every update arm, which reads to leg 4 exactly
      like "nobody wrote this". A real defect was found and fixed while building and it is the reason
      the probe below greps for the ordering token rather than the publish call: SnapshotCache drops a
      delta whose source_offset is <= the cached one, and this exposure's key is MUTABLE, so the fixed
      0/0 coordinates the sibling sync republish uses would have served the first write per correlation_id
      and silently dropped every later one -- a page frozen on a real but stale row while every write
      reported success. The token is written_at, the one monotonic value the DATABASE produces rather
      than this process. Proven against real Postgres on the .201 lab lane (rule 24 lab-first): 19 tests
      green, of which 3 show the database stamping an identity this process never supplied, written_at
      returning as a datetime the token function can read, and a rewrite restamping the row and advancing
      both the stamp and the published offset. Broader regression 1055 passed / 2 skipped; mypy --strict
      clean across 3211 files; the projection write-path real-DB gate correctly FAILED first and now reports
      PASS. Invariant 6 holds -- the runner still publishes this exposure until Phase 2 drops its routing
      entry, and a test asserts both producers key it on correlation_id rather than assuming it.
    source: "generated"
    binds_ac:
