---
schema_version: "1.0.0"
ticket_id: "OMN-17450"
title: "Codex adapter runtime evidence v2 and generator-owned skill truth"
summary: >-
  This is a breaking adapter-response change: Codex runtime evidence is now runtime-evidence/v2, which
  requires a typed runtime_observation and an adapter_dispatch_binding. The binding records whether a
  terminal came from a node contract, the direct delegate-skill contract, or an explicit response override;
  it does not represent a deployed generic Pattern-B consumer. Local compile and local dispatch preserve
  typed errors for missing, unreadable, malformed, and non-mapping contracts and for terminal timeout.
  The canonical generator owns the matching runtime-truth block in all 14 source and packaged Codex skills.
  OMN-17452 is a related product ticket; OMN-17457 separately owns the missing generic Pattern-B subscriber.
  This evidence covers local source and test behavior only: no live deploy, restart, or runtime readback
  is claimed.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
  - "protocols"
evidence_requirements:
  - kind: "tests"
    description: >-
      Canonical Codex skill generation is idempotent and detects drift before any write; it emits the
      v2 runtime-truth block for the manifest-owned source and packaged skill paths.
    command: "uv run python scripts/generate_adapters.py --canonical-codex-skills --check"
  - kind: "tests"
    description: >-
      Focused adapter, skill-truth, and affected golden-chain tests cover the required v2 observation/binding
      fields, terminal-selection distinctions, and typed local error semantics.
    command: >-
      uv run pytest tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py tests/test_golden_chain_env_parity_compute.py
      tests/test_golden_chain_pr_watch_orchestrator.py tests/test_golden_chain_staging_readiness_compute.py
      -q
  - kind: "ci"
    description: >-
      Ruff format-check and lint are clean for the changed Python sources and tests; git diff --check
      reports no whitespace errors.
    command: >-
      uv run ruff format --check scripts/generate_adapters.py src/omnimarket/adapters/codex/local_runtime_dispatch.py
      src/omnimarket/adapters/codex/runtime_client.py tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py
      tests/test_golden_chain_env_parity_compute.py tests/test_golden_chain_pr_watch_orchestrator.py tests/test_golden_chain_staging_readiness_compute.py
      && uv run ruff check scripts/generate_adapters.py src/omnimarket/adapters/codex/local_runtime_dispatch.py
      src/omnimarket/adapters/codex/runtime_client.py tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py
      tests/test_golden_chain_env_parity_compute.py tests/test_golden_chain_pr_watch_orchestrator.py tests/test_golden_chain_staging_readiness_compute.py
      && git diff --check
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-generator-runtime-evidence"
    description: >-
      The canonical Codex skill generator check passes without modifying the manifest-owned outputs, proving
      the 14 source and packaged skill pairs are synchronized to the v2 runtime-truth generator.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run python scripts/generate_adapters.py --canonical-codex-skills --check"
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-17450/omnimarket"
  - id: "dod-focused-runtime-tests"
    description: >-
      Focused tests prove runtime-evidence/v2, typed runtime observation and dispatch binding, terminal-selection
      distinctions, generator truth, and local missing, unreadable, malformed, non-mapping, and timeout
      errors.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py tests/test_golden_chain_env_parity_compute.py
          tests/test_golden_chain_pr_watch_orchestrator.py tests/test_golden_chain_staging_readiness_compute.py
          -q
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-17450/omnimarket"
  - id: "dod-static-quality"
    description: >-
      Ruff format-check and lint pass on the changed adapter, generator, and focused-test Python files
      without auto-fixing the product worktree.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          uv run ruff format --check scripts/generate_adapters.py src/omnimarket/adapters/codex/local_runtime_dispatch.py
          src/omnimarket/adapters/codex/runtime_client.py tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py
          tests/test_golden_chain_env_parity_compute.py tests/test_golden_chain_pr_watch_orchestrator.py
          tests/test_golden_chain_staging_readiness_compute.py && uv run ruff check scripts/generate_adapters.py
          src/omnimarket/adapters/codex/local_runtime_dispatch.py src/omnimarket/adapters/codex/runtime_client.py
          tests/test_codex_runtime_client.py tests/test_onex_skill_runtime_truth.py tests/test_golden_chain_env_parity_compute.py
          tests/test_golden_chain_pr_watch_orchestrator.py tests/test_golden_chain_staging_readiness_compute.py
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-17450/omnimarket"
  - id: "dod-independent-review"
    description: >-
      An independent final review records FINAL SAFE for the breaking v2 response shape, generator/skill
      ownership, typed local error semantics, and the explicit no-live-deploy boundary; git diff --check
      is the reproducible integrity probe for the reviewed product diff.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "git diff --check"
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-17450/omnimarket"
  - id: "occ-self-bind-pr-7978"
    description: >-
      Binds OMN-17450 to OCC companion PR #7978 so the central eligibility gate can resolve a PASS receipt
      for this in-repository evidence change.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr view 7978 --repo OmniNode-ai/onex_change_control --json number,state,headRefName"
