ticket_id: OMN-16799
title: Central OCC evidence for the OMN-16799 prod-promotion grant landing on main
summary: >-
  Central OCC evidence for the hotfix/* PR that lands the two OMN-16799 prod-promotion grant entries on
  onex_change_control@main — grant-7ebd7674 (onex-prod runtime same-digest authorization, sha256:13c96028…)
  and grant-7013b49e (the onex-api promotion, sha256:bc95b9bc…) — both under promotion_batch_id batch-404af076-32a6-449c-b60a-1e8848e3fe3c.
  PREP ONLY: this contract proves the PR itself is well-formed, locally validated against BOTH the producer-side
  schema suite and the consumer-side k3s gate, and CI-clean; it does NOT authorize prod mutation and it
  is NOT the approval act. The PR still requires a human CODEOWNERS operator's explicit merge per OMN-13418.
  This contract exists on the PR branch itself because occ-preflight pins OCC evidence at the PR head
  SHA for onex_change_control's own PRs (invariant I3, in-tree checkout) — the same shape OCC#7084 (OMN-16205)
  and OCC#7213 (OMN-16626) used on this same base.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: manual
    description: >-
      Prod-promotion grant registry values, producer-side schema validation, and consumer-side gate resolution
      (both directions of the anti-self-approval check) for the OMN-16799 grant landing on main.
    command: >-
      grep -Fq 'grant-7013b49e-f714-4ead-8910-e6ffda84df56' grants/prod_promotion_grants.yaml
