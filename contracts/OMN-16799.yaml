dod_evidence:
  - id: "dod-prod-promotion-grant-values-omn16799"
    description: >-
      Prod-promotion grant registry (grants/prod_promotion_grants.yaml) carries both OMN-16799 grant entries
      under promotion_batch_id batch-404af076-32a6-449c-b60a-1e8848e3fe3c: grant-7ebd7674-9b25-466c-920d-a74a0f3efadb
      (omninode-runtime sha256:13c96028…, the digest the unconditional runtime grant gate resolves, a
      same-digest authorization) and grant-7013b49e-f714-4ead-8910-e6ffda84df56 (omnicloud/core sha256:bc95b9bc…,
      the onex-api digest the promotion actually changes). Falsifiable against the repo checkout: the
      grep chain fails on any base that lacks these entries, including onex_change_control@main.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -Fq 'grant-7ebd7674-9b25-466c-920d-a74a0f3efadb' grants/prod_promotion_grants.yaml && grep
          -Fq 'grant-7013b49e-f714-4ead-8910-e6ffda84df56' grants/prod_promotion_grants.yaml && grep -Fq
          'promotion_batch_id: batch-404af076-32a6-449c-b60a-1e8848e3fe3c' grants/prod_promotion_grants.yaml
  - id: "dod-prod-promotion-grant-validation-omn16799"
    description: >-
      The repo's own grant-schema suite passes against the grant file carrying the two new OMN-16799 entries
      and with the two expired-on-2026-08-28T20:00:00Z OMN-16626 entries pruned — including the OMN-13424
      at-rest invariant test that refuses any expired entry. Executed hermetically from the repo checkout.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_prod_promotion_grants.py -q"
  - id: "dod-prod-promotion-grant-consumer-gate-omn16799"
    description: >-
      The CONSUMER of this grant file — omninode_infra's scripts/validate_prod_promotion_grant.py (OMN-14209),
      the exact script deploy-onex-prod.yml runs — resolves both staged digests to PASS for dispatcher
      daniyalabbas96 and BLOCKS both as self_granted for dispatcher jonahgabriel. This is the falsifiable
      proof that the staged grant is usable by the intended dispatcher AND that the anti-self-approval
      interlock is live, not merely asserted in prose. Run against the staged file via the script's own
      --grants-file offline path, so it exercises the real resolver rather than a re-implementation. CROSS-REPO
      by construction: the script lives in omninode_infra, not here, so the command fetches the pinned
      omninode_infra validator from GitHub and executes it against this checkout's staged grant file.
      It needs no cluster and no credentials beyond the same GitHub content read the hosted OCC gate already
      performs for cross-repo proof surfaces.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          script="$(mktemp)" && body="$(gh api 'repos/OmniNode-ai/omninode_infra/contents/scripts/validate_prod_promotion_grant.py?ref=386858d6160a5f80e45c6d8b22553c7e75407c76'
          --jq .content)" && printf '%s' "$body" | base64 -d > "$script" && python3 "$script" --target-digest
          sha256:bc95b9bc5a1860dd666ecea4e82e278ff4ddb2d08da5d280ba8472b7041309ab --requested-by daniyalabbas96
          --health-status healthy --grants-file grants/prod_promotion_grants.yaml && ! python3 "$script"
          --target-digest sha256:bc95b9bc5a1860dd666ecea4e82e278ff4ddb2d08da5d280ba8472b7041309ab --requested-by
          jonahgabriel --health-status healthy --grants-file grants/prod_promotion_grants.yaml
  - id: "occ-self-bind-pr-7418"
    description: >-
      OCC PR #7418 — self-bind for the OMN-16799 prod-promotion grant PREP (onex-prod runtime same-digest
      authorization + onex-api promotion, batch-404af076). OPEN against onex_change_control@main and NOT
      to be merged by any agent per the PR's own operator-approval-act scope statement; the CODEOWNERS
      merge is the approval act.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid
