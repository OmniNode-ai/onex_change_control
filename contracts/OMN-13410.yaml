---
schema_version: "1.0.0"
ticket_id: "OMN-13410"
title: "occ main: give the prod-promotion grant file and CODEOWNERS itself to the grant approvers team
  only"
summary: >-
  onex_change_control main's .github/CODEOWNERS gives grants/prod_promotion_grants.yaml to @OmniNode-ai/platform-leads
  and has no rule for .github/CODEOWNERS itself. Code-owner review on main is therefore not required for
  a pull request that edits CODEOWNERS, so the grant rule can be deleted without review and a grant then
  merged with none. This change gives both paths to one team, @OmniNode-ai/prod-grant-approvers, as anchored
  rules, and replaces the CODEOWNERS test in tests/test_prod_promotion_grants.py with one that requires
  exactly one rule per path naming only that team, and that the last matching rule for each path names
  only that team. The grant file, branch protection and every workflow are unchanged. The team does not
  exist yet: creating it, setting its members and giving it write access are operator steps, and this
  change must not merge before them, because GitHub ignores a CODEOWNERS rule naming an unknown team.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: "The grant file and .github/CODEOWNERS each have one rule naming only the grant approvers
      team."
    command: "see dod_evidence check_values"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn13410-codeowners-approver-team-only"
    description: >-
