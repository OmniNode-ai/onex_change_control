      exactly one for /.github/CODEOWNERS, each naming only @OmniNode-ai/prod-grant-approvers, and the
      last rule matching each path names only that team. The same tests fail on the base tree (a89a6f30fa),
      where the grant rule names platform-leads and no rule matches .github/CODEOWNERS.
    source: "manual"
