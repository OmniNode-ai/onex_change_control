ticket_id: "OMN-16030"
title: "Stop failing the runner-fleet canary on reconnect-gap status flap"
summary: >-
  OCC companion for OmniNode-ai/omnibase_infra#2749. The runner-fleet canary treated the org REST status
  field as authoritative liveness and failed whenever offline+missing exceeded 5; on a 72-runner fleet
  that is a persistent false red. Measured over 7136 jobs, runners labelled offline were completing jobs
  at the moment of the label, the persistently-offline cohort served ~80% of nominal throughput, missing
  was 0 in every sample, RestartCount was 0 on all containers, and the offline count correlates positively
  with concurrent job load -- the opposite of a liveness signal. The mechanism is the listener's broker
  long-poll reconnect gap after each job completion. The gate now fails only on signals a reconnect gap
  cannot manufacture: a lost registration (missing > 0) or mass listener death (offline-and-not-busy at
  or above 50% of fleet); an offline-but-busy runner counts alive because it is provably executing a job.
  Replaying the 2026-07-03 incident the canary was built for (77% offline-idle) still FAILs, so detection
  power is preserved.
