    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the consume deadline for onex.cmd.omnimarket.delegate-skill.v1 is never shorter than the handler budget plus its terminal delivery margin on any bundle, including the laptop profile -- falsifier: a pytest that builds the Kafka config for each catalog bundle and asserts effective_dispatch_deadline_seconds >= 300 for a node declaring max_handler_duration_seconds 240
      - id: "AC2"
        statement: |-
          AC2: a record replayed by node_dlq_replay_effect carries the original message_id, so the delegate-skill claim sees a replay as the same delivery and serves the recorded terminal -- falsifier: a red-first pytest in omnibase_infra that replays a captured DLQ row and asserts the replayed record headers include the original message_id
      - id: "AC3"
        statement: |-
          AC3: a delegate-skill command whose terminal never arrives yields exactly one typed timeout terminal and no replayed re-dispatch -- falsifier: onex delegate against a lab stack with the model endpoint held open past the budget, then count delegate-skill-failed and delegation-request records for the correlation with rpk topic consume
