  - kind: "tests"
    description: |-
      OWED, not claimed. PR #329 on OmniNode-ai/omnidash changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (fixtures/onex.snapshot.projection.topic-activity.v1/active.json, fixtures/onex.snapshot.projection.topic-activity.v1/quiet.json, scripts/generate-registry.ts, shared/types/palette-visibility.ts) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
