requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The trace widget filters on correlation id, event type, topic and time range, with removable chips -- falsifier: a Playwright screenshot in the PR body showing all four filters applied and their chips rendered, plus a test asserting each filter narrows the row set.
      - id: "AC2"
        statement: |-
          AC2: Clicking a correlation id pivots the view to that id through the existing store seam -- falsifier: a test asserts setTraceFilter is called with the clicked id and that the widget consumes and clears it on mount.
      - id: "AC3"
        statement: |-
          AC3: Heartbeat events are excluded by default and the toggle re-includes them -- falsifier: a test feeds a row set that is 88% heartbeat and asserts the default render excludes them and the toggled render does not.
      - id: "AC4"
        statement: |-
          AC4: No refused topic constant is wired -- falsifier: a test asserts the widget's resolved topic set is a subset of the live bus_backed_topics list, so wiring traces.v1 fails the build rather than failing at runtime.
      - id: "AC5"
        statement: |-
          AC5: An error row hands its correlation id to the trace widget and the trace opens populated -- falsifier: a Playwright screenshot sequence in the PR body showing the error row clicked and the trace widget rendering rows for that id.
      - id: "AC6"
        statement: |-
          AC6: The fingerprint section renders a typed empty state naming its missing producer until C3 lands -- falsifier: no-untyped-empty-state.test.ts and no-projection-fallback.test.ts pass, and the Empty story's text names the producer.
      - id: "AC7"
        statement: |-
          AC7: Both widgets are registered, ship Empty and Populated stories, and pass the repo's compliance suite -- falsifier: npm run generate:registry adds both entries, and storybook-coverage-compliance.test.ts, dashboard-truth-compliance.test.ts, no-non-authoritative-read-source.test.ts, no-projection-websocket.test.ts and the typography rule all pass.
      - id: "AC8"
        statement: |-
          AC8: The trace widget answers a real lab correlation id against live data -- falsifier: a screenshot in the PR body with the bridge pointed at the lab projection API, the host named in the readback line, showing rows for a correlation id taken from live-events.v1.
