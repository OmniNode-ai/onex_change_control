title: "Delegation provider binding in steel's LlmProviderBinding union — receipt contract for already-merged
  work (false-Backlog reconciliation)"
summary: >-
  OMN-15157 is a false-Backlog ticket, not unbuilt work. The deliverable landed on jonahgabriel/steel_onslaught
  `main` (steel's canonical branch is `main`, NOT `dev`) in PR #217, merge commit 35868b660413d005cbf8d4e4b8c2c5ddff8e3c41,
  merged 2026-07-26T09:36:53Z — yet the Linear ticket carried a single Backlog stateHistory entry with
  startedAt=null and completedAt=null through the whole build. This contract is the receipt surface for
  the dod_verify path that reconciles that gap; it makes no status change itself. DELIBERATE RENAME, not
  a defect: the binding landed as `ModelSODelegationProviderBinding`, NOT the ticket text's placeholder
  name `ModelSOKafkaDelegationProviderBinding`, because the client never speaks Kafka directly — it subprocesses
  `onex node node_delegate_skill_orchestrator --output receipt`. The rename is recorded in the 2026-07-26T09:40Z
  and 11:10Z rolling-ledger entries; do not "repair" the name back to the ticket's placeholder. Every
  check below is pinned to the merge SHA (immutable content), was executed GREEN at authoring time, and
  was RED-proven against the merge commit's parent (965d574558de2164e2f573014eb8cad6bef6c8a0), where the
  same probes return count 0 and the `grep -qx 1` assertion fails.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
