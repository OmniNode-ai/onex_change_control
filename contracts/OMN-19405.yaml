  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the incident replay reads HELD for the six runtime PRs, citing only the 14:27:35Z-equivalent hold, and CLEAR for a non-runtime PR in the same repos -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_incident_2026_09_23.py -q
      - id: "AC2"
        statement: |-
          AC2: over the universe of 2 repos, 2 PRs, 1 surface and 1 lane, every hold scope times every sequence of up to 2 releases times every query PR, runtime_affecting value and action gives the same verdict from the production fold as from a separately written reference fold, over at least 100,000 printed cases, and a planted bug in the reference fold is caught -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold_exhaustive.py -q
      - id: "AC3"
        statement: |-
          AC3: replacing every free-text field with each vendored adversarial wording leaves every verdict unchanged -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold_properties.py -k free_text_is_inert -q
      - id: "AC4"
        statement: |-
          AC4: the fold result is unchanged under any permutation and duplication of the event lines -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold_properties.py -k permutation -q (Hypothesis)
      - id: "AC5"
        statement: |-
          AC5: a missing epoch, an unparseable line, an unknown kind and a conflicting duplicate event_id each give UNDECIDED and never CLEAR -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold.py -k undecided -q
      - id: "AC6"
        statement: |-
          AC6: the handler module imports no ModelEventEnvelope or ModelHandlerOutput -- falsifier: the core canon-shape ratchet in ci.yml plus uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold.py -k no_envelope -q
      - id: "AC7"
        statement: |-
          AC7: onex-work-ledger exits 0, 3 and 2 for CLEAR, HELD and UNDECIDED on held, pauses, claims, inbox and surface, and exits 2 naming ONEX_WORK_LEDGER_PATH when it is unset -- falsifier: uv run pytest tests/unit/cli/test_cli_work_ledger.py -q
      - id: "AC8"
        statement: |-
          AC8: every onex-work-ledger output starts with a ledger, sha256, lines and epoch header, and a missing or unknown runtime-affecting value is treated as yes -- falsifier: uv run pytest tests/unit/cli/test_cli_work_ledger.py -k header_or_runtime -q
