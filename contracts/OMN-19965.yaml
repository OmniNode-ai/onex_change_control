      checks them: both arms ran in default permission mode; in the arm with the documented
      Bash(onex delegate:*) rule two `onex delegate` calls ran and both returned, and the session
      result is success with permission_denials []; in the control arm without the rule the same
      harness denies `onex delegate`, so the empty list is a measured result. The rule string is read
      back from SKILL.md in the pinned omniclaude checkout. This is a readback of captured transcripts,
      not a live replay of the walk.
