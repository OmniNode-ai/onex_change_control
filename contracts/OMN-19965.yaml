                      proc = subprocess.run(['claude', '-p', '/onex:delegate --task-type document Reply with the single word ok. Permission probe ' + nonce, '--output-format', 'stream-json', '--verbose', '--permission-mode', 'default', '--setting-sources', 'user', '--strict-mcp-config', '--plugin-dir', str(plugin), '--session-id', session, '--max-turns', '8'], env=env, cwd=work, stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=900)
                      events = [json.loads(line) for line in proc.stdout.splitlines() if line.startswith('{')]
                      init = next((e for e in events if e.get('type') == 'system' and e.get('subtype') == 'init'), {})
                      result = next((e for e in reversed(events) if e.get('type') == 'result'), {})
                      uses = {}
                      skills = {}
                      for e in events:
                          message = e.get('message')
                          if not isinstance(message, dict) or not isinstance(message.get('content'), list):
                              continue
                          for b in message['content']:
                              if e.get('type') == 'assistant' and b.get('type') == 'tool_use':
                                  if b.get('name') == 'Bash' and b.get('input', {}).get('command') == command:
                                      uses[b['id']] = None
                                  if b.get('name') == 'Skill' and b.get('input', {}).get('skill') == 'onex:delegate':
                                      skills[b['id']] = False
                              if e.get('type') == 'user' and b.get('type') == 'tool_result' and b.get('tool_use_id') in skills:
                                  skills[b['tool_use_id']] = not b.get('is_error')
                              if e.get('type') == 'user' and b.get('type') == 'tool_result' and b.get('tool_use_id') in uses:
                                  content = str(b.get('content', ''))
                                  uses[b['tool_use_id']] = {'is_error': bool(b.get('is_error')), 'approval_denied': 'requires approval' in content.lower() or 'permission' in content.lower() and 'denied' in content.lower(), 'has_output': bool(content.strip()), 'onex_reported': 'delegate artifacts' in content.lower() or 'skill_name' in content, 'dispatch_refused': 'refused_before_dispatch' in content or 'venv is STALE' in content}
                      summary = {'process_exit': proc.returncode, 'permission_mode': init.get('permissionMode'), 'session_id': init.get('session_id'), 'skill_calls': len(skills), 'skills_loaded': all(skills.values()), 'delegate_calls': len(uses), 'tool_results': list(uses.values()), 'permission_denials': len(result.get('permission_denials', [])), 'result_subtype': result.get('subtype')}
                      summaries[arm] = summary
                      print(json.dumps({'arm': arm, **summary}, sort_keys=True), flush=True)
                  w, n = summaries['with_rule'], summaries['without_rule']
                  checks = {'default_mode': w['permission_mode'] == n['permission_mode'] == 'default', 'two_skill_invocations': w['skill_calls'] == 2 and w['skills_loaded'], 'two_delegate_calls_in_same_profile': w['delegate_calls'] == 2 and bool(w['session_id']), 'both_commands_executed_without_approval': all(r and r['has_output'] and r['onex_reported'] and not r['approval_denied'] for r in w['tool_results']), 'no_permission_denials': w['permission_denials'] == 0 and w['result_subtype'] == 'success' and w['process_exit'] == 0, 'negative_control_denied': n['delegate_calls'] == n['permission_denials'] == 2 and all(r and r['approval_denied'] for r in n['tool_results'])}
                  print(json.dumps({'checks': checks, 'delegation_successes': sum(r is not None and not r['is_error'] for r in w['tool_results'])}, sort_keys=True))
                  assert all(checks.values()), 'live permission probe failed'
          finally:
