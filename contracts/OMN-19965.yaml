                      payload = json.dumps({'input_tokens': 100}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                      return
                  results = [b for m in body.get('messages', []) for b in m.get('content', []) if isinstance(b, dict) and b.get('type') == 'tool_result']
                  turn = len(results)
                  if turn < 4:
                      block = {'type': 'tool_use', 'id': 'probe_' + str(turn), 'name': 'Skill' if turn % 2 == 0 else 'Bash', 'input': {'skill': 'onex:delegate', 'args': '--task-type document Reply with the single word ok. Permission probe ' + nonce} if turn % 2 == 0 else {'command': command, 'description': 'Execute the delegate skill command', 'timeout': 300000}}
                      stop = 'tool_use'
                  else:
                      block = {'type': 'text', 'text': 'Permission probe complete.'}
                      stop = 'end_turn'
                  message = {'id': 'msg_' + uuid.uuid4().hex, 'type': 'message', 'role': 'assistant', 'model': 'claude-sonnet-4-6', 'content': [block], 'stop_reason': stop, 'stop_sequence': None, 'usage': {'input_tokens': 100, 'output_tokens': 50}}
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/event-stream' if body.get('stream') else 'application/json')
                  self.end_headers()
                  if not body.get('stream'):
                      self.wfile.write(json.dumps(message).encode())
                      return
                  start = dict(message, content=[], stop_reason=None, usage={'input_tokens': 100, 'output_tokens': 0})
