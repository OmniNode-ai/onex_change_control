    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          d="$(mktemp -d)" || exit 2
          trap 'rm -rf "$d"' EXIT
          for f in ac2-with-rule-default.jsonl ac2-no-rule-default.jsonl profile-with-rule.settings.json profile-no-rule.settings.json; do
