---
schema_version: "1.0.0"
ticket_id: "OMN-18577"
title: >-
  An evidence item whose checks only read the repository tree may not bind a criterion that can only be
  settled on a live system
summary: >-
  The acceptance-criterion binding gate gains a proof-class rule: an item whose every check reads the
  repository tree cannot bind a criterion settled by measuring a running system. Adds the `supersedes_ac_binding`
  retirement shape so a wrong binding on a merged, immutable item can be withdrawn.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: >-
      The rule's own RED/GREEN units, run by the `ac-binding-acceptance` job that is already enforced
      through the required `CI Summary`. The fixture is OMN-17214's real acceptance-criteria text and
      asserts the four criterion hashes the merged contract recorded, so it cannot drift from the ticket.
    command: "uv run pytest tests/test_omn_18577_static_evidence_on_live_criterion.py -q"
  - kind: "tests"
    description: >-
      The two neighbouring binding-gate suites, to prove the new rules and the retirement plumbing regress
      neither OMN-18236 nor OMN-18333.
    command: >-
      uv run pytest tests/test_omn_18236_ac_binding_acceptance.py tests/test_omn_18333_binds_every_declared_criterion.py
      -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn18577-classifiers"
    description: >-
      AC1 and AC2 — the criterion classifier and the evidence classifier. The criterion side prefers the
      declared falsifier over the prose in both directions, and the vocabulary excludes by name the six
      nouns measured to fire on hermetic-test criteria. The evidence side fails OPEN on a command it cannot
      read, so an unknown vocabulary never refuses.
    source: "manual"
    binds_ac:
      - "AC1"
      - "AC2"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_omn_18577_static_evidence_on_live_criterion.py -k "fixture_matches
          or omn17214_live_criteria or falsifier_outranks or falsifier_naming_both or word_bounded or
          vocabulary_excludes or source_grep_classifies or test_passes_check or unreadable_command or
          live_probe_marker or file_exists_is_static or no_checks_is_not_static" -q
  - id: "dod-omn18577-gate-rule-and-severity"
    description: >-
      AC3 and AC4 — the gate reports a static->live binding naming the criterion, the item and the live
      term it read, and the severity is content-derived: a machine transcription is reported, a hand-authored
      accepted claim refuses. Carries the positive control (swap only the check type and the finding disappears)
      and an AST-level assertion that the discriminator reads no date, allowlist or environment variable.
    source: "manual"
    binds_ac:
      - "AC3"
      - "AC4"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_omn_18577_static_evidence_on_live_criterion.py -k "gate_reports or
          finding_names or non_static_item or transcribed or hand_authored or discriminator" -q
  - id: "dod-omn18577-retirement-shape"
    description: >-
      AC5 and AC6 — the `supersedes_ac_binding` retirement is read by the BINDING gate, a malformed one
      is refused and takes no effect, a retiring item that itself binds static->live is judged by the
      same rule, and a retired criterion reports as a hold rather than vanishing from OMN-18333's coverage
      rule while partial coverage with no retirement still refuses.
    source: "manual"
    binds_ac:
      - "AC5"
      - "AC6"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_omn_18577_static_evidence_on_live_criterion.py -k "retire or retirement
          or partial_coverage" -q
  - id: "dod-omn18577-wired-where-it-blocks"
    description: >-
      AC7 — the rule runs inside the job that already blocks through the required `CI Summary`, not a
      new one. The test reads `ci.yml` itself, so deleting the line unwires the rule and fails a test
      rather than passing silently.
    source: "manual"
    binds_ac:
      - "AC7"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_omn_18577_static_evidence_on_live_criterion.py -k "blocking_ci_job
          or precommit_hook or cli_refuses" -q
