schema_version: 1.0.0
ticket_id: OMN-16993
title: Autobind OCC evidence for OMN-16993
summary: |
  OCC contract authored by node_occ_companion_compute (OMN-14285), unioned across the two product PRs that close OMN-16993: OmniNode-ai/omnimarket PR #2214 (the topology-declared omninode_runtime grant on public.session_replay_snapshots) and OmniNode-ai/omnibase_infra PR #3010 (the warm-volume LOGIN credential re-assert). Both companions minted against the same ticket and therefore the same contract file; this is the union merge, not a replacement -- every evidence item from both sides is preserved.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: ci
    description: 'PR #2214 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
  - kind: tests
    description: 'OWED, not claimed. PR #2214 on OmniNode-ai/omnimarket changes no pytest target, so this
      producer cannot derive a behavior-class check from its diff and mints none - the changed surface
      (src/omnimarket/nodes/node_projection_session_replay/migrations/0002_grant_omninode_runtime_session_replay_snapshots.sql)
      is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence
      item before OMN-15911''s flip conjunct can be satisfied. Recorded here rather than papered over
      with a ticket-independent suite that would read as proof (OMN-16434).'
    command: uv run pytest <hand-authored target> -q
  - kind: ci
    description: 'PR #3010 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
  - kind: tests
    description: 'Behavior proof for PR #3010 on OmniNode-ai/omnibase_infra, derived from the PR''s own
      diff: the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`,
      executed at cwd `${OMNI_HOME}/omnibase_infra`.'
    command: uv run pytest tests/unit/infra/test_warm_volume_login_credential_omn16993.py -q
emergency_bypass:
