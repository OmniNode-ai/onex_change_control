    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the omniclaude PreToolUse guard (or the pre-push hook) surfaces every RULING row appended to the ledger after the lane's own CLAIM timestamp, before a gh pr merge / push, and refuses until acknowledged -- falsifier: seed a RULING row timestamped after a lane's CLAIM row, then attempt the merge/push; today it proceeds silently and this criterion requires it to refuse
      - id: "AC2"
        statement: |-
          AC2 (positive control): a lane whose CLAIM postdates every RULING row is never blocked -- falsifier: the same harness with the RULING predating the CLAIM proceeds unblocked; a fix that blocks unconditionally on the presence of any RULING row fails this criterion
      - id: "AC3"
        statement: |-
          AC3: acknowledging a surfaced RULING requires a ledger row citing it -- falsifier: the guard's unblock path requires an ACK-shaped row naming the RULING's line, and a merge attempted with no such row still refuses
      - id: "AC4"
        statement: |-
          AC4 (labelled criterion — must not be satisfiable by suppression): the guard carries no per-lane or per-ticket suppression surface, and editing or removing the RULING row itself does not count as acknowledgment -- falsifier: a test asserts no such suppression mechanism exists in the guard's source, and that editing the RULING row's own text does not clear the refusal
      - id: "AC5"
        statement: |-
          AC5: the lane brief template names the re-read step explicitly, mechanically checked -- falsifier: the shared lane-rules include or .claude/workflows/*.js templates name "re-read the ledger for RULING rows appended after CLAIM" as a required pre-merge step, and a test in the shape of tests/test_lane_briefs_lab_first.py asserts every brief carries it
      - id: "AC6"
        statement: |-
          AC6: gh pr checks green on the PR before merge, or any red context named and attributed -- falsifier: the squash sha and check summary cited on this ticket — source: ledger NOTE ~2026-09-17T23:22Z; RULING at 2026-09-17T19:54:09Z; omniintelligence#911, omnibase_infra#3721
