---
schema_version: "1.0.0"
ticket_id: "OMN-15792"
title: "OCC evidence for OMN-15792"
summary: >
  Manual OCC companion for OmniNode-ai/omnibase_infra PR #2701 (single runtime topic resolver — contract
  + envelope tenant context -> physical topic). Autobind did not fire (org-wide OMN-15650 gap), so this
  companion is hand-authored per the OMN-14285 local-fallback path. Binds the PR to its exact post-corrective-pass
  head and records deploy scope honestly: runtime code changed (tenant topic resolution on the live Kafka
  publish + subscribe paths), so live deployment / post-deploy readback remains a residual and is not
  claimed here — this PR is explicitly gated behind #2697 and the quarantine landing set and MUST NOT
  merge from this evidence alone.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2701 exact head and the corrective-pass file set are live."
    command: "gh pr view 2701 --repo OmniNode-ai/omnibase_infra --json number,state,headRefName,headRefOid,files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2701"
    description: "PR #2701 on OmniNode-ai/omnibase_infra — exact-head corrective-pass diff."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 2701 --repo OmniNode-ai/omnibase_infra --json number,state,headRefName,headRefOid
          --jq 'if (.number == 2701 and .state == "OPEN" and .headRefName == "jonahgabriel/omn-15792-runtime-topic-resolver"
          and .headRefOid == "5d1982668307a556f87e16db86c8c8771e1b2018") then "true" else error("unexpected
          #2701 state or head") end'
  - id: "dod-deploy-assessment"
    description: >
      Deploy-scope DoD for PR #2701. Runtime/services files are touched (the shared tenant-topic resolver
      consulted by both the Kafka publish and subscribe paths), so this item classifies deploy scope without
      claiming live deployment or post-deploy projection readback — this PR does not merge on its own;
      it is queued behind infra#2697 and the OMN-15778 quarantine return-leg landing set.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr diff 2701 --repo OmniNode-ai/omnibase_infra --name-only | grep -ciE 'nodes/|handlers/|runtime/|services/|docker|monitor_logs|deploy'"
  - id: "dod-occ-evidence-validator-pr-2701"
    description: "Hosted OCC evidence admissibility validator for OMN-15792 / PR #2701."
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omnibase_infra-pr-2701"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_evidence_admissibility.py -q"
  - id: "occ-self-bind-pr-6271"
    description: "Binds OMN-15792 to OCC companion PR #6271 (self-bind)."
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-occ-evidence-validator-pr-2701"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6271 --repo OmniNode-ai/onex_change_control --json number,state --jq 'if (.number
          == 6271 and .state == "OPEN") then "true" else error("unexpected OCC self-bind PR state") end'
  - id: "dod-deploy-live-probe-pr-2701"
    description: >
      Falsifiable deploy-scope probe for PR #2701 (OMN-14443 correction — the original dod-deploy-assessment
      check_value used `gh pr diff` file-name matching, which the deploy-gate falsifiability ratchet correctly
      rejects as vacuous: its exit status never depends on the state of a live/deployed surface). This
      probe instead reads the ACTUAL merged source content at the PR's exact head via the GitHub contents
      API and asserts the new resolver symbol is present -- it is genuinely falsifiable (would fail if
      the branch did not actually contain the change) and does not read back this repo's own receipts/contract.
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-deploy-assessment"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_bus_forwarder_effect/handlers/handler_forward_outbound.py?ref=6b20eac24"
          --jq '.content' | base64 -d | grep -q 'resolve_physical_topic'
  - id: "occ-self-bind-pr-6274"
    description: >
      Binds OMN-15792 to OCC follow-up companion PR #6274 (self-bind). Deliberately does NOT supersede
      dod-deploy-live-probe-pr-2701 -- a self-bind PR-existence attestation is weaker evidence than a
      falsifiable content probe and must never retire one from "live" (non-superseded) status; the falsifiable
      probe is the contract's one EXECUTED+FALSIFIABLE+OUTSIDE-OWN-DIFF admissible check (OMN-15309) and
      must remain the current tip.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6274 --repo OmniNode-ai/onex_change_control --json number,state --jq 'if (.number
          == 6274 and .state == "OPEN") then "true" else error("unexpected OCC self-bind PR state") end'
  - id: "occ-self-bind-pr-6271-rebind-merged"
    description: >
      Corrects occ-self-bind-pr-6271: that check asserted `.state == "OPEN"`, which became permanently
      false once #6271 (correctly) merged -- a live, ongoing Contract Compliance Check failure, not a
      flake. Rebinds against the merged state instead.
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:occ-self-bind-pr-6271"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6271 --repo OmniNode-ai/onex_change_control --json number,state,mergedAt --jq 'if
          (.number == 6271 and .state == "MERGED" and .mergedAt != null) then "true" else error("unexpected
          OCC companion PR #6271 state") end'
