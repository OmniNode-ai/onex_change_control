        statement: |-
          AC-1: The dev broker's seastar reservation is reduced and the reduction is the one actually running, not merely edited in a compose file. -- falsifier: read --memory from /proc/<pid>/cmdline of the running redpanda process in omnibase-infra-redpanda and confirm it reports the new value.
      - id: "AC2"
        statement: |-
          AC-2: Host swap pressure falls measurably after the change rather than moving elsewhere. -- falsifier: compare sar -W daily average pswpin/s for the following day against the 14633 baseline of 2026-09-21, and confirm summed VmSwap over /proc/*/status drops by at least 10 GB from the 65.1 GB baseline.
      - id: "AC3"
        statement: |-
          AC-3: The dev lane's bus still serves its consumers after each staged step. -- falsifier: run the projection-API cold replay of the 10.68M-record snapshot topic and confirm it completes, since that is the load most likely to expose a value set too low.
      - id: "AC4"
        statement: |-
          AC-4: No lane is degraded by the change. -- falsifier: enumerate container health and restart counts for every compose project on the host before and after, and confirm no project gained an unhealthy container or a restart.
      - id: "AC5"
        statement: |-
          AC-5: The staged sequence is followed rather than cut in one move. -- falsifier: the rolling ledger carries a row per step recording the value set and the soak observation before the next step is taken. ---
