requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The worktree guard refuses a mkdir, a git clone and a git -C worktree add whose resolved destination sits under any omni_worktrees directory other than the two sanctioned roots, including after a cd and after an inline OMNI_HOME redefinition -- falsifier: uv run pytest tests/hooks/test_worktree_add_guard.py -k StrayWorktreeRoot -q in omniclaude
      - id: "AC2"
        statement: |-
          AC2: The worktree guard admits a git worktree add into $OMNI_HOME/omni_worktrees and into $OMNI_HOME/../omnibase_internal/omni_worktrees -- falsifier: uv run pytest tests/hooks/test_worktree_add_guard.py -q in omniclaude, positive-control cases for both roots
      - id: "AC3"
        statement: |-
          AC3: Through the live hook (canonical omniclaude clone fast-forwarded to origin/dev), the historical RSD clone after cd, the OMN-19042 mkdir -p and the redefined-OMNI_HOME worktree add each exit 2, and worktree adds into both sanctioned roots exit 0 -- falsifier: bash replay of each command as a PreToolUse payload through plugins/onex/hooks/scripts/pre_tool_use_worktree_guard.sh, reading the exit code
      - id: "AC4"
        statement: |-
          AC4: Code that derives a worktree root raises when OMNI_HOME is unset and no explicit root is given, instead of falling back to a machine path -- falsifier: uv run pytest on the focused tests of omnimarket handler_ticket_work and omniintelligence dispatch_handler_code_quality with OMNI_HOME removed from the environment Scope note for AC4 (added 2026-09-24 by lane stray-worktree-root-land, criterion line unchanged): in omniintelligence the derivation is Path(os.environ["OMNI_HOME"]), which raises KeyError when OMNI_HOME is unset; _read_source_file is a best-effort read that converts that into None, so the dispatch handler scores without source instead of crashing, and no machine path is read. The omniintelligence test asserts exactly that. omnimarket handler_ticket_work raises ValueError to its caller.
      - id: "AC5"
        statement: |-
          AC5: No default branch of omniclaude, omnibase_infra, omnimarket, omniintelligence or omni_home contains a worktree-root default that names the old external-SSD root, the home-relative Code/omni_worktrees root or the parent-of-OMNI_HOME omni_worktrees root, outside test fixtures -- falsifier: git grep -nE for those three shapes on each repo default branch after fetch, zero hits outside tests
