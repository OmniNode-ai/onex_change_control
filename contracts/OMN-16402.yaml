title: "CI native-build-toolchain/PostgreSQL-client fallback hard-fails when sudo exists but is not passwordless"
summary: "Adds a non-interactive sudo probe (sudo -n true) to every occurrence of the 'command -v sudo'
  privileged-install fallback in omniclaude's ci.yml (6 sites) and onex-schema-compat.yml (1 site), so
  the step falls through to its own documented graceful-degrade warning instead of hard-failing under
  bash -e when the self-hosted runner user lacks passwordless sudo. Landed as a blocking dependency of
  the OMN-16373 dev->main promotion PR (omniclaude#2017), which the bug was hard-failing on multiple required
  checks (Exports Validation, Database Schema Validation, ONEX Change Control Schema Compatibility)."
