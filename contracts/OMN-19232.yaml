ticket_id: OMN-19232
title: "onex delegate resolves its state root from the flag, then ONEX_STATE_DIR, then ~/.onex_state,
  never the working directory"
summary: >-
  `onex delegate --state-root` defaulted to the cwd-relative string `.onex_state` and ignored `ONEX_STATE_DIR`,
  so a run started from a worktree wrote `runs/<run_id>/receipt.json` under that worktree. The default
  is now resolved by `resolve_state_root` in `src/omnibase_infra/cli/receipt_mode.py`: the explicit flag,
  then an absolute `ONEX_STATE_DIR`, then `~/.onex_state`. A relative `ONEX_STATE_DIR`, a root under `~/.claude`
  and an unresolvable home are refused. `run.json` records the absolute `state_root` and the `delegate
  artifacts` line ends with `state_root=<abs>`. The change is a CLI path default with no new deployed
  surface; the probe below reads the merged source over the GitHub API.
