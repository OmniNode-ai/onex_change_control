# OMN-19046 — the acceptance-criteria MODEL this ticket's binding points at.
#
# `dod_evidence[ac1-ac8-c6-key-lifecycle-dev-proof].binds_ac` has named AC1..AC8
# since PR #9240 (2026-09-12) and those eight labels have had NO referent
# anywhere: not in this ticket's Linear body, which carries no AC label at all,
# not in #9240's own body, and not in any comment. The 2026-09-12 closeout
# adjudication called them "eight names with no referents" and named the two
# corrections: enumerate AC1..AC8 to match what the bound check asserts, or
# re-declare the binding against labels that exist. This is the first.
#
# Each criterion below is a DISTINCT conjunct of that item's single check, which
# was executed end to end and returned PASS. Nothing here is derived from an
# outcome: the falsifiers restate assertions the check already makes, in the
# words of the ticket's own §4a.2 C6 specification and of the operator ruling of
# 2026-09-12 on this ticket (keep the scope, add the two refusal legs, state the
# rule-24(d) lab disposition rather than claiming a lab pass).
#
# The check asserts more than these eight: it also pins product PR #396 at its
# exact head, the one-file harness diff, and the run id. Those are provenance of
# the evidence, not criteria of the deliverable, so they are deliberately not
# enumerated — a criterion nothing binds is a refusal under
# `ac_binding_criterion_unbound`, and inventing a ninth to cover a pin would be
# the same fabrication this whole path exists to prevent.
#
# This block is the MODEL. The Linear body's acceptance-criteria section is a
# RENDERING of it, written by `onex-serialize-ac-section` (OMN-18270). Edit here;
# re-run the serializer; never hand-edit the body.
requirements:
  - id: "req-c6-key-lifecycle-chain-pair"
    statement: >-
      C6 is proven by a golden/error chain PAIR run as legs of one harness, each leg emitting a record
      the board reads, each leg carrying a control that ran in the same run.
    rationale: >-
      The M3 closure plan of 2026-09-10 §4a.2 defines C6 as a pair, and the ruling recorded at docs/tracking/ROLLING_WORK_LEDGER.md
      2026-09-10 :6247 closes it on mechanical proof only — a named probe or run green and read by the
      board. A golden leg with no control asserts nothing, and an error chain whose control did not run
      is a failure, not a pass.
    acceptance:
      - id: "AC1"
        statement: >-
          The C6 golden leg runs on the dev plane and emits a `key-lifecycle-golden` record declaring
          criterion C6 with result PASS. The onex-lab overlay deliberately omits omniweb and Keycloak,
          so under rule 24(d) the dev plane is the applicable plane here and no lab pass is claimed. --
          falsifier: `key-lifecycle-golden.json` from the named run satisfies `.chain == "key-lifecycle-golden"
          and .kind == "golden" and .criterion == "C6" and .target.plane == "dev" and .result == "PASS"`.
      - id: "AC2"
        statement: >-
          The golden leg's five lifecycle steps all pass inside one browser session: the key surface renders
          and the list read succeeds, a key is created in the browser and listed, the gateway confirms
          the created key, the key is revoked in the browser and marked Revoked, and the gateway confirms
          the revocation. -- falsifier: the golden record's checks are exactly G1-key-surface-rendered-and-list-read-succeeded,
          G2-created-in-browser-and-listed, G3-gateway-confirms-the-created-key, G4-revoked-in-browser-and-marked-revoked
          and G5-gateway-confirms-the-revocation, and every one of them is `ok`.
      - id: "AC3"
        statement: >-
          The golden leg carries a discrimination control that ran and passed in the same run, so a green
          golden leg cannot be a leg that asserted nothing. -- falsifier: the golden record satisfies
          `.control.name == "key-list-answers-the-session-and-refuses-no-credential" and .control.ran
          == true and .control.ok == true`.
      - id: "AC4"
        statement: >-
          The C6 error leg emits a `key-lifecycle-error` record declaring criterion C6 on the dev plane
          with result PASS, and its positive control — the same key authenticating successfully on the
          same endpoint before revocation — ran and passed in that same run. -- falsifier: the error record
          satisfies `.chain == "key-lifecycle-error" and .kind == "error" and .criterion == "C6" and .target.plane
          == "dev" and .result == "PASS" and .control.name == "a-live-key-is-accepted-on-the-same-endpoint"
          and .control.ran == true and .control.ok == true`.
      - id: "AC5"
        statement: >-
          Revocation refuses: the revocation is accepted, the revoked key stops authenticating, and the
          active list excludes it afterwards. -- falsifier: the error record's checks include E0-revocation-accepted,
          E1-revoked-key-is-rejected and E2-list-after-revoke-excludes-it, and every one of them is `ok`.
      - id: "AC6"
        statement: >-
          Key-scoped isolation refuses: the stored hash does not authenticate, and a key belonging to
          tenant A does not authenticate as tenant B. These two legs are the only mechanical proof of
          key-scoped tenant isolation anywhere in C6, which is why the operator ruling of 2026-09-12 on
          this ticket kept them in scope rather than folding them out. -- falsifier: the error record's
          checks include E3-stored-hash-is-rejected and E4-tenant-a-key-is-refused-as-tenant-b, and both
          are `ok`.
      - id: "AC7"
        statement: >-
          The emitted records identify a key by its id and never carry the key value. -- falsifier: no
          `onxk_`-prefixed value appears anywhere in the downloaded record artifact tree.
      - id: "AC8"
        statement: >-
          The board reads C6 from both legs' records, which is this ticket's stated closing condition
          — a named run green AND read by the board, not merely green somewhere. -- falsifier: omninode_infra#1319
          is MERGED at `6246806bc73d2223128cd8b25446ae1da0103d3a` and `tools/beta_board/beta_board_data.py`
          at that ref carries the row `("m3-key-lifecycle-chain","OmniNode-ai/omniweb","m3-key-lifecycle-chain.yml","C6")`.
evidence_requirements:
  - kind: "ci"
    description: "PR #372 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #372 on OmniNode-ai/omniweb changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (e2e/chains/key-lifecycle.spec.ts, packages/@omninode/ui/src/components/ApiKeyRow.tsx) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
