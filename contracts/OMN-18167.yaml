    description: >-
      AC1-AC8 binding, hand-authored under Jonah's 2026-09-12 ruling. Reads the successful governed dev-plane
      workflow_dispatch artifact at the exact product PR #396 head and asserts the golden control plus
      G1-G5 and the error control plus E3 stored-hash refusal, E4 cross-tenant refusal, E0 revocation,
      E1 revoked-key refusal and E2 active-list absence. It also pins the one-file Playwright harness
