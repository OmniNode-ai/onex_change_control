        check_value: |-
          bind="$(gh pr view 1536 --repo OmniNode-ai/omnibase_core --json headRefOid,baseRefName --jq '.headRefOid + " " + .baseRefName')" && test "$bind" = "1687670106e8e12b000168227b4241bc7148f1d5 dev"
