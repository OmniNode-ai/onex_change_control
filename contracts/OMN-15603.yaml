      base dev. Head OID and base branch are asserted together in one equality, so a re-pushed head, a
      retargeted base, or a different PR each yield a mismatch. This deliberately avoids the OMN-14443
      vacuous-probe class (`gh pr view <n> --json number,state`, which passes regardless of the outcome
      being claimed) — the shape the autobind template used, and the shape the already-merged OCC#5830
      receipts still carry against the superseded head 48f1a694. Net-new and append-only: no merged receipt
      is edited and no supersession record is minted.
    source: "manual"
    status: "verified"
    checks:
