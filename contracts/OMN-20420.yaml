        statement: |-
          AC4: the queue-status gh top-callers line prints a lane label for a session:<id> caller found in the lane identity registry, and still prints session:<first 8 of id> when none matches -- falsifier: uv run pytest plugins/omni/skills/merge-drain/tests/test_merge_pulse.py -k gh_top_lane -q in omniclaude-internal
