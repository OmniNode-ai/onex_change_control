      behavior tests. Both go green with the mechanism in place.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/scripts/test_deploy_runtime_lane_attribution.py?ref=a9fe9b6f9ff8fe29a929d103b6788a1c023ca403'
          --jq .content | base64 -d | grep -q 'test_guard_aborts_the_deploy_when_the_preflight_refuses'
  - id: "dod-omn15218-live-interlock-readback"
    description: >
      Live readback against REAL grant state, obtained read-only with zero lane contact: the preflight
      run with --check-only against onex_change_control@main (grants file at commit 7684288344d80421479440e97aa4de23128dba76,
      sha256 0e0ead9c24e3fe4c5667c9a29af7d6c879aac4197d6cff0a2fc1f4e93c872b36) resolved the three live
      batch-b551aa00-7268-42b7-a193-b9156e6d39dc grants — grant-68c191b0-98a8-4f10-aef9-8a5479fbf230 (digest
      sha256:bb3bab3742518b22d985e314b7bbcab1cf7b07e796b253047a78d4fa3bf2ce29), grant-6cea9b85-db18-409b-a994-c11f80744fc6
