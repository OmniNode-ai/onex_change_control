---
schema_version: "1.0.0"
ticket_id: "OMN-16413"
title: "validate-docs reusable workflow (ubuntu-latest, PR events) cannot reach internal PyPI mirror on
  lockfile cache-miss"
summary: >-
  omnibase_core/.github/workflows/validate-docs.yml routed every pull_request event to ubuntu-latest,
  which cannot reach the internal-only PyPI mirror omninode-pc.tail75df5e.ts.net:3141. On a uv.lock cache
  miss (e.g. onex_change_control#6850/#6823, both dependency-bump PRs) every package fetch failed with
  a DNS error, and the REQUIRED CI Summary check fail-closed on it even with every other gate green. Fixes
  the runner selector to the existing OMN-15699 fork-aware idiom already used by deploy-gate-reusable.yml
  / main-target-guard.yml: only an actual fork PR (head.repo != base repo) routes to ubuntu-latest; every
  same-repo pull_request (including bot-authored dependency-bump branches, which are always same-repo)
  routes to the tailnet-connected self-hosted omnibase-ci fleet. Does not widen the trust boundary --
  untrusted fork code still never reaches the self-hosted fleet.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_core-pr-1579"
    description: >-
      omnibase_core PR #1579 changes only .github/workflows/validate-docs.yml, replacing the `github.event_name
      != 'pull_request'` runner condition with the fork-aware `github.event.pull_request.head.repo.full_name
      != github.repository` condition (the OMNI_RUNNER_SELECTOR_V1 idiom). Content-bound probe: reads
      the omnibase_core blob at the PR head through the GitHub API, so it executes against a surface this
      OCC PR does not author, and it is falsifiable -- verified GREEN at head 62158685dd75497b0458fd2bdf54bf5aee14a6d8
      (contains `head.repo.full_name != github.repository`) and RED at merge-base a06ddd049d76af569f37170dcf69054073be40db
      (dev tip before the fix, still `github.event_name != 'pull_request'` with no fork check at all).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          body="$(gh api 'repos/OmniNode-ai/omnibase_core/contents/.github/workflows/validate-docs.yml?ref=62158685dd75497b0458fd2bdf54bf5aee14a6d8'
          --jq .content | base64 -d)" && printf '%s' "$body" | grep -qF 'head.repo.full_name != github.repository'
