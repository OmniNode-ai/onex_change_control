  - id: "dod-omn19995-ac1-lab-read-asserting-2026-10-04"
    description: |-
      AC1 dev-lane readback that can fail (claude-e72e9157 packaging the probe written by claude-b4a9c00f,
      OMN-19995). It replaces the readback the 2026-10-03T22:45Z closeout refused because its exit status did not
