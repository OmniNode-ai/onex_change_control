    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the reusable ban-hardcoded-runner-ip check in omniclaude also refuses a runs-on host label or machine name, a hostname assertion, a private IPv4 literal in a run script and a host-path prune in every calling repository -- falsifier: uv run pytest tests -k machine_pin in omniclaude, with planted-pin fixtures that must each fail
      - id: "AC2"
        statement: |-
          AC2: the check has no allowlist; a per-runner smoke workflow takes its runner set from a repository variable like any other -- falsifier: grep -n 'omnipc2|host-20' .github/workflows/*.yml across the registry clones returns nothing and uv run pytest tests -k machine_pin passes
      - id: "AC3"
        statement: |-
          AC3: a scheduled fleet probe fails when every online runner carrying a label that a required context or board probe uses sits on one host -- falsifier: uv run pytest tests -k runner_pool_spread with a fixture whose omnibase-ci runners share one host must fail, and one spread across two hosts must pass
      - id: "AC4"
        statement: |-
          AC4: runs-on expressions carry no literal fallback label set; an unset variable fails the job -- falsifier: grep -n "RUNS_ON_JSON ||" .github/workflows/*.yml in omninode_infra returns nothing and uv run pytest tests/scripts -q passes
