---
schema_version: 1.0.0
ticket_id: OMN-15271
title: 'omnimemory: make root-level and non-unit test families selectable in the governed test selector'
summary: 'OCC evidence companion for OMN-15271. omnimemory''s governed selector (scripts/ci/detect_test_paths.py)
  resolved exactly two prefixes -- src/omnimemory/ and tests/unit/ -- and contributed nothing for anything
  else, so the ~25 structural test modules at tests/ root and the tests/<area>/ packages had no path into
  a PR-into-dev selection: a PR that added or edited one of them went green without ever collecting it,
  and a src/omnimemory/nodes/** change never pulled in the root-level gates that read those nodes (recorded
  live on omnimemory#417 / CI run 30310898812, selection ["tests/unit/nodes/"], Tests (1/1) success).
  tests/conftest.py documents the root layout as deliberate, so the disposition is to teach the selector
  the layout rather than relocate ~25 files against the repo''s own stated convention. A new required
  test_families map declares every test location the src-module mapping cannot reach together with the
  source prefixes that select it; a changed tests/**/*.py always contributes itself (never zero); and
  a test location present on disk but undeclared escalates the whole PR to the full suite (undeclared_test_family),
  so a new root test cannot be silently unselectable.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
evidence_requirements:
