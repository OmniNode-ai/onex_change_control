    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The consumer-flow delta carries whether the subscription's handler declares any bus output, taken from its contract -- falsifier: pytest in omnibase_infra asserting a sink subscription (no publish topics) and a publishing subscription emit declares_output false and true
      - id: "AC2"
        statement: |-
          AC2: The projection derives a non-alarm verdict for a sink window with messages_in > 0, zero DLQ and zero handler errors, and still derives STALLED for a declared publisher with out == 0 -- falsifier: pytest over derive_flow_state with both cases plus the OMN-16755 15,750-in-0-out publisher case staying STALLED
      - id: "AC3"
        statement: |-
          AC3: A sink window with handler errors or DLQ messages is still an alarm -- falsifier: pytest asserting that window does not read healthy
      - id: "AC4"
        statement: |-
          AC4: The omnidash Errors panel counts STALLED only from the projection verdict and shows no STALLED for sink writers -- falsifier: vitest on ErrorsWidget with a sink row and a publisher row
      - id: "AC5"
        statement: |-
          AC5: On the lab dev lane after deploy, no STALLED row names a consumer whose contract declares no output -- falsifier: the Probe line read on the .201 dev lane, each STALLED consumer group checked against its contract
