  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A run of the onboarding script completes phase 3 on a machine whose clones were fetched at an arbitrary later dev head, or refuses before the delegation naming the skew -- falsifier: a run that reaches onex delegate with the workspace below the proven floor and fails with an error that names neither the floor nor the incompatible distribution
      - id: "AC2"
        statement: |-
          AC2: The workspace floor stamp is not rewritten to record a set that has not passed the floor check -- falsifier: a .onex-workspace-floor.json whose generated_at falls inside a run that reported the workspace below the proven floor, and whose recorded commit is the one that was refused
      - id: "AC3"
        statement: |-
          AC3: A below-floor workspace refuses a delegation rather than warning and proceeding; the refusal names the installed and proven commits and the command that fixes it (ruling, 2026-10-02) -- falsifier: a delegation that runs to a non-zero exit after the "Proceeding because this command does not mint evidence" line, or a refusal that names no remediation command
      - id: "AC4"
        statement: |-
          AC4: A test pins the compatibility the failure violated, driving the delegate bus wrapper with the argument shape the runtime adapter actually passes -- falsifier: uv run pytest -q -k delegate_phase_timed_bus collects no test
