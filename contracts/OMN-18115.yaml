---
schema_version: "1.0.0"
ticket_id: "OMN-18115"
title: "Autobind OCC evidence for OMN-18115"
summary: >-
  OCC Evidence-Source autobind companion (OMN-13317 F1) for PR #3391, with AC1-AC3 bound by hand to the
  checks that execute them. OMN-18115 was rescoped on 2026-09-10: its original AC1 asked for a forward
  migration issuing the chain_canary_reader link-2 grant, on the finding that no committed artifact produced
  it. That premise is falsified -- scripts/run-forward-migrations.sh has issued the grant on every compose
  up since OMN-18060 / omnibase_infra#3352 (squash 0e9106da8, merged 2026-09-09T08:46:10Z, ancestor of
  origin/dev), about 18 hours before the ticket was filed, and the .201 dev lane's own forward-migration
  one-shot logs it. The rescoped AC1-AC3 govern the defect that actually produced the ticket: four shipped
  provisioning comments credited a burned migration ordinal for that grant.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #3391 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
      Behavior proof for PR #3391 on OmniNode-ai/omnibase_infra, derived from the PR's own diff: the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omnibase_infra`.
    command: "uv run pytest tests/unit/infra/test_grant_authority_named_correctly_omn18115.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_infra-pr-3391"
    description: >-
      PR #3391 on OmniNode-ai/omnibase_infra — Evidence-Source autobind. Proves the pinning test AC2 requires
      is present in the PR's own tree at its head sha, and that it derives its subjects from the shipped
      runner (`_granted_roles`) rather than a hardcoded list, which is the half of AC2 a passing run alone
      cannot distinguish from a rule with a frozen subject set.
    source: "generated"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/contents/tests/unit/infra/test_grant_authority_named_correctly_omn18115.py?ref=ddeb4f9a6a6d6ee0743e51ca89c5f1cff42d368d --jq '.content' | base64 -d | grep -c 'def _granted_roles'
  - id: "dod-OmniNode-ai-omnibase_infra-pr-3391-ci"
    description: >-
      PR #3391 on OmniNode-ai/omnibase_infra — product diff scope check (OMN-14425). Declares no binds_ac
      deliberately: enumerating a pull request's changed files proves the diff exists, not that any acceptance
      criterion holds. Binding it to one would be a claim this check cannot support.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 3391 --repo OmniNode-ai/omnibase_infra --json files"
  - id: "dod-occ-diff-derived-behavior-proof"
    description: >-
      PR #3391 on OmniNode-ai/omnibase_infra — diff-derived behavior proof (OMN-16434). Runs the whole
      pinning module, which executes every rule AC1-AC3 name plus the positive control that keeps an empty
      scan from passing vacuously. The three per-criterion items below narrow the same proof to one test
      node id each, so a single criterion can be shown to fail on its own rather than only as part of
      a module-wide red.
    source: "generated"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: |-
          uv run pytest tests/unit/infra/test_grant_authority_named_correctly_omn18115.py -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-ac1-comments-name-the-grant-authority"
    description: >-
      AC1 — every shipped comment attributing a LOGIN_ONLY_ROLE_GRANT_MAP principal's grants names the
      real authority (scripts/run-forward-migrations.sh or its LOGIN_ONLY_ROLE_GRANT_MAP seam). Falsified
      by this test failing on a tree where any such comment names something else or names nothing. Ran
      RED against origin/dev before the fix, naming docker-compose.infra.yml:520 and :914, docker-compose.judge.yml:330
      and 000_create_multiple_databases.sh:50.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/commits/ddeb4f9a6a6d6ee0743e51ca89c5f1cff42d368d --jq .sha >/dev/null && uv run pytest "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_a_comment_that_describes_the_grant_names_its_authority" "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_the_rule_has_a_subject" -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-ac2-no-numbered-migration-attribution"
    description: >-
      AC2 — a test pins that no shipped provisioning comment attributes such a grant to a numbered migration,
      and that none asserts the grant is unissued or applied out of band. Both rules run here together
      with the positive control that asserts the scan found its four subjects, because either rule passes
      vacuously over an empty subject set and an empty result is not evidence of absence.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/commits/ddeb4f9a6a6d6ee0743e51ca89c5f1cff42d368d --jq .sha >/dev/null && uv run pytest "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_no_provisioning_comment_credits_a_numbered_migration" "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_no_provisioning_comment_claims_the_grant_is_unissued" "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_the_rule_has_a_subject" -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-ac3-two-lane-authority-is-stated"
    description: >-
      AC3 — the same comments state the k8s/RDS lane's authority for chain_canary_reader: minted by 000_create_multiple_databases.sh
      on a fresh volume and by the runner's credential seam on a warm one, both compose-only, so the managed
      lane has no row and needs no grant. Ran RED against origin/dev before the fix on all three compose
      blocks.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/commits/ddeb4f9a6a6d6ee0743e51ca89c5f1cff42d368d --jq .sha >/dev/null && uv run pytest "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_the_comment_states_which_lane_provisions_the_principal" "tests/unit/infra/test_grant_authority_named_correctly_omn18115.py::test_the_rule_has_a_subject" -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "occ-self-bind-pr-8895"
    description: >-
      OCC companion PR #8895 — self-bind for OMN-18115 (OMN-14650). Declares no binds_ac deliberately:
      a pull-request-visibility probe proves no acceptance criterion. It exists so eligibility can resolve
      a receipt for the evidence PR itself.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 8895 --repo OmniNode-ai/onex_change_control --json number,state"
