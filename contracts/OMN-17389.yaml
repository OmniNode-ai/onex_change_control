        check_value: |-
          uv run pytest tests/ci/test_dispatch_failure_sink_subscription_gate.py -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "ac2-quarantine-loop-broken-hwm-flat"
    description: >-
      AC2 binding. Proves the two rpk topic describe samples showing HWM flat are durable by verifying
      the subscriber that produced HWM growth is absent from the current contract. If onex.dlq.omnibase-infra.quarantine.v1
      appeared in subscribe_topics again, HWM would resume growing; its absence confirms the loop is broken
      and HWM stays flat.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/nodes/node_ledger_projection_compute/contract.yaml --jq '.content' | base64 -d | python3 -c "
          import sys, yaml
          c = yaml.safe_load(sys.stdin)
          subs = (c.get('event_bus') or {}).get('subscribe_topics') or []
          assert 'onex.dlq.omnibase-infra.quarantine.v1' not in subs, 'FAIL: quarantine topic still in subscribe_topics'
          print('AC2 pass: quarantine topic absent from contract -- loop broken, HWM flat')
          "
  - id: "ac3-chain-canary-not-quarantined"
