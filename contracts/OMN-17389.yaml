      AC3 binding. Asserts chain-canary.yml completed with a non-quarantined verdict on its latest scheduled
      run. Fetches the most recent scheduled workflow run and asserts conclusion is success. A quarantined
      verdict would produce a non-success conclusion because the chain-canary exits nonzero when the probe
      correlation id surfaces in the quarantine sink.
    source: "manual"
    status: "verified"
    binds_ac: ["AC3"]
    checks:
