  - id: "dod-omnibase_core-pr-1549-product-head-812eccde"
    description: >-
      Product-head verification for omnibase_core PR #1549 at 812eccde8811dc0e346ddf996e2575e8cd7759ba.
      The proof reads live PR metadata and changed files from GitHub, then checks the branch is based
      on dev, carries the OMN-15120 required-context-materialization title, and includes the required-check
      manifest, two required workflow callers, security scan workflow, and regression test.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          PRODUCT_PR_NUMBER=1549; PRODUCT_REPO=OmniNode-ai/omnibase_core; PRODUCT_HEAD=812eccde8811dc0e346ddf996e2575e8cd7759ba;
          d="$(mktemp -d)" && gh pr view "${PRODUCT_PR_NUMBER}" --repo "${PRODUCT_REPO}" --json headRefOid,baseRefName,title,files
          --jq '.headRefOid + "\n" + .baseRefName + "\n" + .title + "\n" + ((.files | map(.path)) | join("\n"))'
          > "${d}/pr.txt" && grep -Fq "${PRODUCT_HEAD}" "${d}/pr.txt" && grep -Fxq dev "${d}/pr.txt" &&
          grep -Fq 'fix(OMN-15120): materialize required-check contexts on Dependabot PRs (OMN-14864)'
          "${d}/pr.txt" && for p in .github/required-checks.yaml .github/workflows/call-occ-companion-effect.yml
          .github/workflows/cr-thread-gate-caller.yml .github/workflows/security-scan.yml tests/unit/validation/test_required_check_skip_guard.py;
          do grep -Fq "$p" "${d}/pr.txt"; done
  - id: "dod-omnibase_core-pr-1549-diff-scope-812eccde"
    description: >-
      Diff-scope verification for omnibase_core PR #1549 at 812eccde8811dc0e346ddf996e2575e8cd7759ba.
      The diff is limited to GitHub workflow/required-check configuration plus the required-check skip
      regression test; it does not touch package source, runtime deployment code, systemd, Docker compose,
      or .201 deployment surfaces.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          PRODUCT_PR_NUMBER=1549; PRODUCT_REPO=OmniNode-ai/omnibase_core; PRODUCT_HEAD=812eccde8811dc0e346ddf996e2575e8cd7759ba;
          gh pr view "${PRODUCT_PR_NUMBER}" --repo "${PRODUCT_REPO}" --json headRefOid,files --jq '.headRefOid
          == "'${PRODUCT_HEAD}'" and ((.files | map(.path)) | all((startswith(".github/") or (. == "tests/unit/validation/test_required_check_skip_guard.py"))
          and (. | test("(^|/)(src|systemd|deploy/scripts|docker/compose)(/|$)") | not)))' | grep -qx
          true
  - id: "dod-omnibase_core-pr-1549-body-proof-812eccde"
    description: >-
      Hosted-readable proof-summary verification for omnibase_core PR #1549 at 812eccde8811dc0e346ddf996e2575e8cd7759ba.
      Reads the live PR body and asserts it carries the concrete verification markers for the focused
      regression test, required-check skip-vector validator, changed-file pre-commit run, and full pre-push
      governed impacted-test-selector run reported by the author.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          PRODUCT_PR_NUMBER=1549; PRODUCT_REPO=OmniNode-ai/omnibase_core; PRODUCT_HEAD=812eccde8811dc0e346ddf996e2575e8cd7759ba;
          gh pr view "${PRODUCT_PR_NUMBER}" --repo "${PRODUCT_REPO}" --json headRefOid --jq '.headRefOid
          == "'${PRODUCT_HEAD}'"' | grep -qx true && BODY="$(gh pr view "${PRODUCT_PR_NUMBER}" --repo
          "${PRODUCT_REPO}" --json body --jq '.body')" && echo "$BODY" | grep -Fq 'uv run pytest tests/unit/validation/test_required_check_skip_guard.py
          -v' && echo "$BODY" | grep -Fq '4 passed' && echo "$BODY" | grep -Fq 'PASS: no required-check'
          && echo "$BODY" | grep -Fq 'vectors found.' && echo "$BODY" | grep -Fq 'pre-commit run --files
          <the 4 touched files>' && echo "$BODY" | grep -Fq '43865 passed, 53' && echo "$BODY" | grep
          -Fq '3 xpassed, 0 failed'
