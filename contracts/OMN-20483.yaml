  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: each turn's action record in the loop receipt carries the action arguments (old_string and new_string, or content, plus path, offset and file globs) and the sha256 of each written file after the action -- falsifier: a red-first pytest in tests/nodes/node_delegated_code_edit_orchestrator that runs a scripted two-turn loop and fails today because the turn actions in the written receipt have no arguments key
      - id: "AC2"
        statement: |-
          AC2: a replay function reconstructs the worktree at turn N from the receipt and the base tree, and the reconstructed files equal the files the live loop held after turn N for every N -- falsifier: a red-first pytest that runs a scripted multi-turn loop with an edit, a write and a refused action, replays turns 0 through the last, and asserts per-file sha256 equality with the live worktree after each turn
      - id: "AC3"
        statement: |-
          AC3: a replay of a receipt whose recorded sha256 does not match the rebuilt file raises a typed error and writes nothing past that turn -- falsifier: a pytest that corrupts one recorded new_string and asserts the replay refuses at that turn
      - id: "AC4"
        statement: |-
          AC4: a receipt written before this change (schema v1 without arguments) is refused by replay with a clear reason, and resume of an old receipt still works -- falsifier: a pytest that replays the existing v1 receipt fixture and asserts the refusal, plus the existing resume tests in test_handler_delegated_code_edit_orchestrator.py still pass under uv run pytest
      - id: "AC5"
        statement: |-
          AC5: arguments are stored whole, never truncated, so a 50000-character new_string round-trips byte for byte through the receipt -- falsifier: a pytest that runs a turn with a 50000-character write and asserts the receipt argument equals the input by sha256
