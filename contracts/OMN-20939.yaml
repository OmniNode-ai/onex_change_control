---
schema_version: "1.0.0"
ticket_id: OMN-20939
title: Lab values leave the shipped onex_change_control files
summary: The tailnet-only index check uses the .ts.net shape rule with an optional configured suffix,
  the golden-chain proof script takes its runtime addresses from the operator's environment, and the two
  evidence reports and the enum docstring use a documentation address.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20939-occ
    statement: onex_change_control's shipped scripts, evidence and docstrings must name no lab host, address
      or tailnet.
    acceptance:
      - id: AC1
        statement: 'AC1: check_runner_routing.py carries no tailnet identifier, flags any .ts.net index
          host by default and narrows to ONEX_TAILNET_SUFFIX when it is set -- falsifier: uv run pytest
          tests/test_check_runner_routing_tailnet_suffix.py -q'
      - id: AC2
        statement: 'AC2: the four files that carried a lab address (the two dod_report.json evidence files,
          run_proof.py and enum_compliance_violation.py) contain no RFC 1918 address and no tailnet name
          -- falsifier: git grep -nE "192[.]168[.]|[.]ts[.]net" -- evidence/OMN-12491/dod_report.json
          evidence/OMN-8336/dod_report.json evidence/OMN-11513/delegation-golden-chain-proof-2026-05-28/run_proof.py
          src/onex_change_control/enums/enum_compliance_violation.py exits 1'
evidence_requirements:
  - kind: tests
    description: The tailnet suffix tests assert the shape default, its positive control and the configured
      narrowing.
    command: uv run pytest tests/test_check_runner_routing_tailnet_suffix.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20939-ac1
    description: The tailnet suffix tests pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_check_runner_routing_tailnet_suffix.py -q
        cwd: ${OMNI_HOME}/onex_change_control
    binds_ac:
      - AC1
  - id: dod-omn-20939-ac2
    description: The four evidence and enum files hold no lab address or tailnet name.
    source: manual
    checks:
      - check_type: command
        check_value: "! git grep -nE '192[.]168[.]|[.]ts[.]net' -- evidence/OMN-12491/dod_report.json
          evidence/OMN-8336/dod_report.json evidence/OMN-11513/delegation-golden-chain-proof-2026-05-28/run_proof.py
          src/onex_change_control/enums/enum_compliance_violation.py"
        cwd: ${OMNI_HOME}/onex_change_control
    binds_ac:
      - AC2
  - id: dod-OmniNode-ai-omnibase_spi-pr-365
    description: 'SPI PR #365 at 61860967a15d406a435de54f703491242c93fcc7: the CI comment names an internal-only
      mirror without its lab host or tailnet.'
    source: manual
    checks:
      - check_type: command
        check_value: python3 -c 'import re, subprocess; text = subprocess.check_output(["git", "show",
          "61860967a15d406a435de54f703491242c93fcc7:.github/workflows/ci.yml"], text=True); lines = [line
          for line in text.splitlines() if "set from" in line]; print("\n".join(lines)); assert "# set
          from an internal-only Tailscale PyPI mirror." in text; assert re.search(r"[.]ts[.]net|192[.]168[.]",
          text) is None'
        cwd: ${OMNI_HOME}/omnibase_spi
