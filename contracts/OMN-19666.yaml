    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a commit that installs every hook environment from an empty PRE_COMMIT_HOME leaves the worktree index equal to HEAD plus the staged paths, in each of the ten repos -- falsifier: a pytest test that creates a scratch worktree, sets PRE_COMMIT_HOME to an empty temp dir, stages one file, runs git commit, then asserts git ls-files count equals the new HEAD tree count and git fsck --full exits 0
      - id: "AC2"
        statement: |-
          AC2: no .pre-commit-config.yaml in the ten repos carries a git+ additional dependency unless its install is proven isolated from the committing repo's git environment -- falsifier: grep -c 'git+' over each repo's .pre-commit-config.yaml on origin/dev returns non-zero with no isolating wrapper on the same hook
      - id: "AC3"
        statement: |-
          AC3: a new git+ pre-commit dependency is refused at commit time and in CI -- falsifier: staging a .pre-commit-config.yaml that adds a git+ additional dependency makes pre-commit run exit non-zero in that repo
