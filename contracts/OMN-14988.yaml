      fail on /bin/bash and pass on bash 5.3, which is the defect signature itself.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/unit/scripts/validation/test_check_no_infra_inmemory_import.py -q -p no:randomly
  - id: "dod-omn-14988-gate-not-neutered"
    description: >-
      The fix does not weaken the gate it repairs: a non-allowlisted import arriving with the same doubled-slash
