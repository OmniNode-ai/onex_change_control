    description: >-
      The reported symptom is gone: the gate exits 0 on a clean tree under bash 3.2, the interpreter `#!/usr/bin/env
      bash` resolves to on stock macOS and the one that produced 8/8 false positives. Verified on .200
      (stickybeatz-studio) and on the local macOS host at product commit c9ca7eb1.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          /bin/bash scripts/validation/check_no_infra_inmemory_import.sh
  - id: "dod-omn-14988-normalization-regression-red-green"
    description: >-
      Regression suite is RED against the pre-fix script and GREEN after: 13 failed / 6 passed on the
