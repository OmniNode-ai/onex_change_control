---
schema_version: "1.0.0"
ticket_id: "OMN-14988"
title: "check_no_infra_inmemory_import.sh slash-normalization bug false-positives on macOS"
summary: >-
  OCC companion for the OMN-14988 fix in omnibase_infra. The no-infra-inmemory-import gate (OMN-7077/OMN-13419)
  reported 8 violations on a clean dev tree on macOS, all 8 of them entries in the script's own ALLOWLIST
  — zero true positives. BSD grep reports the search root "src/" as "src//" in every hit, and the doubled-slash
  normalization used a bash-version-dependent substitution that retains a literal backslash under bash
  3.2 (stock macOS /usr/bin/env bash), so no normalized path could ever match the single-slash ALLOWLIST.
  Fix holds the pattern and replacement in variables and loops until no doubled slash remains; regression
  coverage asserts normalization per bash interpreter, drives the real script end to end against pinned
  BSD-style src// hits (allowlisted set must exit 0, non-allowlisted violation must still exit 1), and
  adds a static ratchet against reintroducing the fragile form.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "Product PR diff scope is the gate script plus its regression test"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: "Gate regression suite green under every bash present on the host"
    command: "uv run pytest tests/unit/scripts/validation/test_check_no_infra_inmemory_import.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
