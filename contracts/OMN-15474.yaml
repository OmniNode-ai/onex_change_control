---
schema_version: "1.0.0"
ticket_id: "OMN-15474"
title: "Contract-scoped dispatch: wiring-report totality over the manifest, and three dispatch doubles
  that claimed zero owners"
summary: >-
  Receipt contract for omnibase_infra PR #2608 (branch jonah/omn-15474-contract-scoped-dispatch-e2, head
  dc5a16e464173d87d34fd4184d3259e32e84d914). The PR makes the auto-wiring report TOTAL over the discovered
  manifest at the producer, and repairs three dispatch-engine test doubles that answered the contract-scope
  question with "this contract owns nothing" immediately after registering a dispatcher. AUTHORSHIP DISCLOSURE:
  this companion is net-new and hand-authored by the same lane that authored PR #2608 (fable-ws0-0731/laneE4).
  The bot autobind (node_occ_companion_compute) published its occ-companion-effect command successfully
  but produced no companion PR within ~30 minutes, so the autobind template was not available to repair
  append-only. Every check below is therefore written to be independently falsifiable against immutable
  GitHub content at a pinned SHA rather than to restate the lane's own claims: four of the five substantive
  checks are RED-proven by repointing the identical probe at the branch's pre-fix commit e7475e26f86e5c820e4a41702eef2d550710eaea,
  and the fifth is an invariant-preservation check whose RED vector is stated explicitly below. DIAGNOSIS
  CORRECTION carried by this contract: the lane was dispatched on the premise that the real bootstrap
  produced a wiring report missing ~120 manifest contracts. That premise is false. Measured live, the
  real wire_from_manifest emitted 131 rows for 131 discovered contracts; src/ holds exactly one report
  producer and one consumer and the kernel pairs them correctly. The empty report came from tests/unit/runtime/conftest.py::mock_wire_infrastructure,
  which stubbed the wiring engine to results=() while leaving discover_contracts real. MERGE ORDERING:
  PR #2608 lands only after omnibase-core 0.46.8 pin verification. Merge is external to the authoring
  lane and was not requested.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
contract_completeness: "ENRICHED"
evidence_requirements:
  - kind: "ci"
    description: >-
      omnibase_infra PR #2608 CI checks are green on head dc5a16e464173d87d34fd4184d3259e32e84d914.
    command: "gh pr checks 2608 --repo OmniNode-ai/omnibase_infra"
  - kind: "manual"
    description: >-
      Immutable GitHub content probes bind each acceptance item to omnibase_infra head SHA dc5a16e464173d87d34fd4184d3259e32e84d914,
      each RED-proven against e7475e26f86e5c820e4a41702eef2d550710eaea except where noted.
    command: "See drift/dod_receipts/OMN-15474/dod-omn15474-*/command.yaml"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15474-pr-2608-head-binding"
    description: >-
      Binding item. omnibase_infra PR #2608 exists and its head commit is exactly dc5a16e464173d87d34fd4184d3259e32e84d914.
      Head OID and base branch are asserted together in one equality so a re-pushed head, a retargeted
      base, or a different PR each yield a mismatch. This establishes binding, not correctness; the substantive
      proof is the items below.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          bind="$(gh pr view 2608 --repo OmniNode-ai/omnibase_infra --json headRefOid,baseRefName --jq '.headRefOid + " " + .baseRefName')" && test "$bind" = "dc5a16e464173d87d34fd4184d3259e32e84d914 dev"
  - id: "dod-omn15474-totality-constructor-shipped"
    description: >-
      The canonical totality constructor build_unwired_contract_results exists in the shipped auto_wiring
      module and is exported from the package, so any producer of a ModelAutoWiringReport can derive its
      "did not wire" rows FROM the manifest instead of hand-mirroring a name list. RED-proven: the identical
      probe at e7475e26f86e5c820e4a41702eef2d550710eaea exits non-zero.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'def build_unwired_contract_results(' "$t" && rm -f "$t"
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/__init__.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF '"build_unwired_contract_results",' "$t" && rm -f "$t"
  - id: "dod-omn15474-totality-postcondition"
    description: >-
      wire_from_manifest carries a fail-closed totality post-condition: any manifest contract with no
      result row is backfilled with an explicit SKIPPED row plus a structured reason. Totality stops being
      an emergent property of two loops and becomes a property of the function. RED-proven: the identical
      probe at e7475e26f86e5c820e4a41702eef2d550710eaea exits non-zero.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'reason=UNWIRED_BACKFILL_REASON,' "$t" && grep -qF 'UNWIRED_BACKFILL_REASON = (' "$t" && rm -f "$t"
  - id: "dod-omn15474-bijection-not-weakened"
    description: >-
      INVARIANT-PRESERVATION item — deliberately GREEN on both sides. Operator ruling 4 required the report
      be made total at the producer AND that the strict identity check stay, explicitly forbidding relaxation
      to a subset relation. This asserts _validate_initial_subscription_contract_identities still compares
      report and manifest name sets for equality and still raises on mismatch. Its RED vector is not the
      parent commit (the check was already present there); it is any future edit that softens the equality
      to a subset test or drops the raise. That is the failure this item exists to catch, and it is the
      reason this item is NOT presented as a RED-proven check.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'if report_names != manifest_names:' "$t" && grep -qF 'initial subscription requires an exact bijection ' "$t" && rm -f "$t"
  - id: "dod-omn15474-real-bootstrap-tests-exist"
    description: >-
      The branch previously had no test that ran the real discover -> wire -> freeze -> subscribe chain;
      every existing one stubbed the wiring engine. Two bootstrap tests now drive it, one with the engine
      stubbed and one with it unstubbed, over a manifest whose contracts each have a legitimate reason
      not to wire. RED-proven: the identical probe at e7475e26f86e5c820e4a41702eef2d550710eaea exits non-zero.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/unit/runtime/test_kernel.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'async def test_bootstrap_completes_when_auto_wiring_reports_no_wired_contracts(' "$t" && grep -qF 'async def test_bootstrap_completes_with_the_real_wiring_engine(' "$t" && rm -f "$t"
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/unit/runtime/auto_wiring/test_wiring_report_totality_omn15474.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'async def test_subscribe_still_rejects_a_partial_report() -> None:' "$t" && grep -qF 'async def test_subscribe_still_rejects_report_rows_with_no_manifest_contract() -> None:' "$t" && rm -f "$t"
  - id: "dod-omn15474-lying-fixture-repaired"
    description: >-
      The kernel-suite fixture no longer asserts the impossible. Its wiring-engine stand-in builds a total
      report from the manifest it is handed via the product constructor rather than returning results=().
      RED-proven: the identical probe at e7475e26f86e5c820e4a41702eef2d550710eaea exits non-zero.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          t="$(mktemp)" && gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/unit/runtime/conftest.py?ref=dc5a16e464173d87d34fd4184d3259e32e84d914' --jq .content | base64 -d > "$t" && grep -qF 'build_unwired_contract_results(' "$t" && rm -f "$t"
  - id: "dod-deploy-assessment"
    description: >-
      Deploy-scope DoD so PR #2608 clears the deploy-gate. The PR touches src/omnibase_infra/runtime/auto_wiring/,
      a deploy-scoped surface.
    source: "manual"
    status: "verified"
    checks:
