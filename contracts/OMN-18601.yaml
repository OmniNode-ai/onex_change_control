      it failed on 2026-09-18. CROSS-REPO by construction, as above: the suite lives in omninode_infra
      and cannot execute in the OCC checkout, so the hosted check reads this receipt.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-18601/dod-omn18601-psa-test-suite/command.yaml
