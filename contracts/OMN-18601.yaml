---
schema_version: "1.0.0"
ticket_id: OMN-18601
title: Central OCC evidence for the OMN-18601 prod-promotion MANIFEST grant staged on onex_change_control@main
summary: >-
  Central OCC evidence for the first `target_kind: manifest` entry ever written to grants/prod_promotion_grants.yaml
  — the authorization for the first governed production Keycloak reconcile. The entry authorizes exactly
  one deploy-onex-prod.yml dispatch at ref refs/heads/main, applying k8s/keycloak-seed/overlays/prod into
  namespace onex-prod on the public cluster, which renders to three objects and nothing else. This contract
  lives on the PR branch itself because occ-preflight pins OCC evidence at the PR head SHA for onex_change_control's
  own PRs — the same shape OCC#7418, OCC#7899 and OCC#8571 used on this base, and it is deliberately SEPARATE
  from and smaller than the OMN-18601 contract on this repo's dev lane, which covers the feature work
  in omninode_infra rather than this registry change. NOTHING ABOUT PRODUCTION IS MUTATED BY MERGING THIS.
  The merge adds an authorization, not a workload; no dispatch, deploy, rollback or restart happens, and
  onex-prod keeps running exactly what it runs now. One premise is deliberately unmet at staging time
  and is disclosed rather than hidden — promote-manifest resolves a staging-apply receipt recorded AT
  the promoted commit and accepts it for at most 24h, and no such receipt exists at 8279e2ca yet, so a
  dispatch today would still be refused. Every field in the entry was RECOMPUTED at manifest_ref 8279e2ca
  using that checkout's own scripts/manifest_promotion_render.py rather than carried forward from the
  earlier draft at e746a665; manifest_ref is the only field that moved.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: manual
    description: >-
      Prod-promotion grant registry state and producer-side schema validation for the single OMN-18601
      manifest entry: the registry carries the entry and is therefore no longer at rest.
    command: >-
      grep -Fq 'manifest_ref: 8279e2ca8b2681a630905bae3ce4470a6a289ebb' grants/prod_promotion_grants.yaml
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-prod-promotion-grant-values-omn18601"
    description: >-
      STAGED STATE. The prod-promotion grant registry carries the OMN-18601 manifest entry and every one
      of its six target fields verbatim — grant_id grant-90f8e729-c65c-4693-9bc0-b0df390f2d2e, target_kind
      manifest, manifest_path k8s/keycloak-seed/overlays/prod, manifest_subtree k8s/keycloak-seed, manifest_ref
      8279e2ca8b2681a630905bae3ce4470a6a289ebb and rendered_digest sha256:33b54afe55e78fc3943d4ef67182f14935c73d7f9df9bd4f619e3acf981c5227
      — and the file is no longer at `entries: []`. Falsifiable in the useful direction, which is the
      half that makes it a measurement: the identical six-grep chain FAILS on onex_change_control@main
      at 3311f0bb1, where the registry is still at rest and none of the six strings exists. A chain that
      was silently broken — a mistyped grant id, a grep that never matched — would have failed on BOTH
      trees; it did not.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -Fq 'grant-90f8e729-c65c-4693-9bc0-b0df390f2d2e' grants/prod_promotion_grants.yaml && grep
          -Fq 'target_kind: manifest' grants/prod_promotion_grants.yaml && grep -Fq 'manifest_path: k8s/keycloak-seed/overlays/prod'
          grants/prod_promotion_grants.yaml && grep -Fq 'manifest_subtree: k8s/keycloak-seed' grants/prod_promotion_grants.yaml
          && grep -Fq 'manifest_ref: 8279e2ca8b2681a630905bae3ce4470a6a289ebb' grants/prod_promotion_grants.yaml
          && grep -Fq 'rendered_digest: sha256:33b54afe55e78fc3943d4ef67182f14935c73d7f9df9bd4f619e3acf981c5227'
          grants/prod_promotion_grants.yaml && ! grep -Eq '^entries: \[\]$' grants/prod_promotion_grants.yaml
  - id: "dod-prod-promotion-grant-validation-omn18601"
    description: >-
      The repo's own grant-schema suite passes against the STAGED registry, including the OMN-18579 manifest-kind
      cases that this entry is the first real exercise of — that a manifest grant requires all four manifest
      fields and forbids image_digest, that manifest_path must lie inside manifest_subtree segment-wise,
      and the OMN-13424 at-rest invariant refusing any expired entry. 44 tests pass across tests/test_prod_promotion_grants.py
      and tests/test_prod_promotion_grants_manifest_kind.py. Stated plainly so the suite is not over-read
      this is a SCHEMA gate, not an authorization gate. It proves the staged entry is WELL-FORMED and
      of the kind it claims to be. It does not prove the promotion is warranted — the authority for that
      is the CODEOWNERS merge — and it does not prove the promotion would SUCCEED, which depends on the
      staging-apply receipt premise that is openly unmet at staging time. Executed hermetically from the
      repo checkout, no network.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/test_prod_promotion_grants.py tests/test_prod_promotion_grants_manifest_kind.py
          -q
  - id: "dod-grant-author-identity-omn18601"
    description: >-
      ANTI-SELF-APPROVAL, on the only surface this repo controls. The entry names approved_by jonahgabriel,
      a real GitHub login rather than a placeholder, because the consumer (omninode_infra's scripts/validate_prod_promotion_grant.py)
      enforces approved_by != requested_by against github.actor at dispatch time; a synthetic placeholder
      would compare unequal to EVERY dispatcher and would silently disable the only mechanical anti-self-approval
      check on this path. This PR is authored by jake-b-omni, who is also the intended dispatcher, so
      approved_by differs from both the author and the dispatcher and both refusals — the authoring-time
      one in this repo and the dispatch-time one in omninode_infra — are satisfied on their own terms
      rather than by assertion. Note what this item does NOT claim: no file anywhere proves a human said
      the words behind approved_by. The CODEOWNERS-gated merge is that act, and it is the reason this
      PR must be landed by a person.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -Fq 'approved_by: jonahgabriel' grants/prod_promotion_grants.yaml && ! grep -Fq 'approved_by:
          jake-b-omni' grants/prod_promotion_grants.yaml
  - id: "dod-grant-subtree-bound-omn18601"
    description: >-
      THE BLAST-RADIUS ITEM, recomputed at manifest_ref rather than trusted. Rendering k8s/keycloak-seed/overlays/prod
      from a checkout of omninode_infra at 8279e2ca with that repository's own scripts/manifest_promotion_render.py
      yields exactly three objects — the ConfigMap seed-keycloak-desired-clients-4888bkdm6h, the Job seed-keycloak-clients
      and the InfisicalSecret keycloak-reconcile-credentials — digesting to sha256:33b54afe55e78fc3943d4ef67182f14935c73d7f9df9bd4f619e3acf981c5227
      with derive_namespace() resolving to onex-prod. subtree_violations over the six-file kustomization
      tree returns [] against the declared bound k8s/keycloak-seed. THE POSITIVE CONTROL is the same call
      against the tighter bound k8s/keycloak-seed/overlays/prod, which returns 2 violations, both files
      under base/ — that is what makes the empty result a measurement rather than a silently broken probe,
      and it is also why manifest_subtree is DECLARED wider than manifest_path: the overlay names ../../base
      as a resource, so a bound of the overlay path alone would refuse the very tree it authorizes. A
      SECOND CONTROL pins that the promotion moved the ref and not the render: the identical render at
      the pre-promotion commit e746a665 digests to the same value, because omninode_infra#1556 changed
      no file under k8s/keycloak-seed. CROSS-REPO by construction, which is why the hosted check_value
      is the receipt-grep form — the renderer lives in the PRIVATE omninode_infra repo, which the OCC
      runner has no checkout of and no token for, so a direct check_value would fail for lack of read
      access rather than for lack of evidence. The receipt carries all four readings verbatim.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-18601/dod-grant-subtree-bound-omn18601/command.yaml
  - id: "occ-self-bind-pr-10246"
    description: >-
      Self-bind for onex_change_control#10246, the PR that stages this entry. Binds this receipt set to
      the pull request that introduces it, so the evidence and the registry change are one reviewable
      unit rather than two things that happen to agree.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-18601/occ-self-bind-pr-10246/command.yaml
  - id: dod-omn18601-grant-revoked
    description: 'REVOKED STATE, and the reason it is a removal rather than a consumed marker. grants/prod_promotion_grants.yaml
      is back to `entries: []` at rest: grant-90f8e729-c65c-4693-9bc0-b0df390f2d2e no longer authorizes
      anything. It was consumed in substance by deploy-onex-prod.yml run 35392020746, which passed every
      premise the gate enforces and applied all three objects into onex-prod with a live readback, after
      which the WORKLOAD failed: onex-prod enforces the restricted pod-security profile, the seed Job''s
      container declared neither allowPrivilegeEscalation: false nor capabilities.drop: [ALL], and the
      Job reached DeadlineExceeded with zero pods admitted. Two independent reasons make removal correct
      rather than a consumed marker, either sufficient alone. The entry pins rendered_digest sha256:33b54afe
      at manifest_ref 8279e2ca, a tree production cannot admit, and omninode_infra#1563 moves that render
      to sha256:976ef4de, so the entry could only ever re-authorize the broken manifest. And it expires
      2026-09-19T16:39:04Z, where the OMN-13424 at-rest invariant FAILS on any expired entry left in the
      file, turning every subsequent pull request to this repository red rather than merely the next promotion;
      a consumed marker neutralizes the authorization but does not clear that trap, while removal does
      both. FALSIFIABLE IN THE USEFUL DIRECTION: the check asserts `entries: []` and therefore FAILS on
      onex_change_control@main at 6c54c74f8, where the entry is still live. Note the check deliberately
      does NOT grep for the absence of the grant id, because the revocation header above names it on purpose
      and such a check would match the comment and report a false failure.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: 'grep -Eq ''^entries: \[\]$'' grants/prod_promotion_grants.yaml'
