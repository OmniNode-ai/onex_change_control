---
schema_version: "1.0.0"
ticket_id: "OMN-18011"
title: "Autobind OCC evidence for OMN-18011"
summary: >
  OCC evidence for OMN-18011, which lands in two repos: OmniNode-ai/omninode_infra PR #1193 (onex-api
  mints the tenant's first API key at tenant creation) and OmniNode-ai/omniweb PR #354 (the dashboard
  stops requiring a typed value and reveals the auto-minted key once). Two autobind companions were minted
  for the same ticket and collided add/add on this file; resolved by UNION so neither repo's evidence
  is dropped.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1193 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "ci"
    description: "PR #354 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      Behavior proof for PR #1193 on OmniNode-ai/omninode_infra, derived from the PR's own diff: the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omninode_infra`.
    command: "uv run pytest docker/onex-api/tests/test_omn_18011_signup_default_api_key.py -q"
  - kind: "tests"
    description: |-
      Behavior proof for PR #354 on OmniNode-ai/omniweb. The autobind producer minted none because the diff changes no pytest target; this repo's suite is tsx, not pytest. Hand-authored here rather than left OWED: tests/api-key-auto-mint.test.ts is the RED-then-GREEN proof for that PR (20 cases) and is wired into `pnpm test`.
    command: "pnpm test:api-key-auto-mint"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omninode_infra-pr-1193"
    description: "PR #1193 on OmniNode-ai/omninode_infra — Evidence-Source autobind."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1193 --repo OmniNode-ai/omninode_infra --json number,state"
  - id: "dod-OmniNode-ai-omninode_infra-pr-1193-ci"
    description: "PR #1193 on OmniNode-ai/omninode_infra — product diff scope check (OMN-14425)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 1193 --repo OmniNode-ai/omninode_infra --json files"
  - id: "dod-occ-diff-derived-behavior-proof"
    description: "PR #1193 on OmniNode-ai/omninode_infra — diff-derived behavior proof (OMN-16434)."
    source: "generated"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omninode_infra-pr-1193"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest docker/onex-api/tests/test_omn_18011_signup_default_api_key.py -q"
        cwd: "${OMNI_HOME}/omninode_infra"
  - id: "occ-self-bind-pr-8423"
    description: "OCC companion PR #8423 — self-bind for OMN-18011 (OMN-14650)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 8423 --repo OmniNode-ai/onex_change_control --json number,state"
  - id: "dod-OmniNode-ai-omniweb-pr-354"
    description: "PR #354 on OmniNode-ai/omniweb — Evidence-Source autobind."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 354 --repo OmniNode-ai/omniweb --json number,state"
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omniweb/pulls/354/files --paginate --jq '.[].filename' | grep -cFx 'app/(app)/app/api-keys/_components/ApiKeyManager.tsx'
  - id: "dod-occ-evidence-admissibility-validator"
    description: "Hosted OCC evidence admissibility validator (OMN-15247)."
    source: "generated"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omniweb-pr-354"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_evidence_admissibility.py -q"
  - id: "occ-self-bind-pr-8425"
    description: "Binds OMN-18011 to OCC companion PR #8425 (self-bind)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 8425 --repo OmniNode-ai/onex_change_control --json number,state"
