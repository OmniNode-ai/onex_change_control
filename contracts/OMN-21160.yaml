    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the management account has a logging multi-region trail -- falsifier: aws cloudtrail get-trail-status --profile omninode-mgmt --name omninode-mgmt-management-events returns IsLogging: false, or a non-null LatestDeliveryError or LatestCloudWatchLogsDeliveryError.
      - id: "AC2"
        statement: |-
          AC2: it records reads, not only writes -- falsifier: get-event-selectors returns ReadWriteType other than All, or IncludeManagementEvents: false.
      - id: "AC3"
        statement: |-
          AC3: objects actually land in the archive and the archive is private -- falsifier: aws s3 ls s3://omninode-mgmt-340148571796-us-east-1-security-telemetry/cloudtrail/AWSLogs/340148571796/CloudTrail/ is empty more than one hour after the trail started logging, or get-public-access-block returns BlockPublicPolicy: false.
      - id: "AC4"
        statement: |-
          AC4: the trail is declared in IaC and its root plans clean -- falsifier: terraform -chdir=aws/mgmt-audit plan proposes any create, change or destroy against the applied state, or aws/mgmt-audit/ is absent from origin/dev.
      - id: "AC5"
        statement: |-
          AC5: a non-read call by the outside-review role raises an alarm, and a sign-in does not -- falsifier: aws logs describe-metric-filters --log-group-name /aws/cloudtrail/omninode-mvp1/management-events is missing omninode-mvp1-external-review-write or omninode-mvp1-external-review-session, or the ExternalReviewWrite metric carries a datapoint produced by a ConsoleLogin, GetSigninToken or AssumeRoleWithSAML event.
      - id: "AC6"
        statement: |-
          AC6: the decision not to run an organization trail is recorded with its measurement -- falsifier: aws/mgmt-audit/providers.tf carries no event count and no per-event price behind the claim, so a later reader cannot re-derive the $64/month.
