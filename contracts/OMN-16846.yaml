  # receipt's contract_entry_sha256 stays valid — OMN-13888).
  #
  # The four entries above are the OMN-14285 autobind's own output and carry
  # behavior_proving_count = 0 under the OMN-15911 proof-class axis: a
  # `gh api .../contents/<file>?ref=<sha> | base64 -d | grep -c` probe (static
  # artifact inspection — SURROGATE), a bare `gh pr view --json files`
  # (PR_STATE_SURROGATE), OCC's own tests/test_evidence_admissibility.py
  # (FOREIGN_SUITE_DENYLIST — SURROGATE), and a self-bind `gh pr view`. All four
  # are true statements about which PR exists and which bytes landed; none of
  # them executes the product change, so none can go red if the sweep job is put
  # back on a single venv.
  #
  # That distinction is the entire subject of this ticket: run 33194402437
  # recorded three behaviour checks as `FAILED ... Canonical venv is IMPURE`
  # with behavior_proving_count = 0, and a companion carrying only surrogates
  # cannot tell that state apart from a proven one. The two entries below run
  # the real suites the fix shipped with, pinned via `cwd` to the repo that owns
  # the code, and each goes RED against the pre-fix tree.
  # ---------------------------------------------------------------------------
  - id: "dod-16846-dispatch-venv-separation"
    description: >-
      AC2 + AC6 behaviour proof. Runs omnibase_infra's tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_16846_dispatch_venv_separation.py,
      which asserts (a) the sweep dispatches the verifier from its own interpreter's `onex` rather than
      through `uv run`, proven through the real runner's exec path and not only the helper, (b) the workflow
      composes a dispatch venv separate from the project's `.venv`, (c) the omnimarket co-install targets
      that dispatch venv and never `.venv`, (d) every dod_verify/sweep dispatch runs through it, and (e)
      a fail-fast gate-venv purity assertion runs BEFORE any dispatch. Confirmed RED against the pre-fix
      tree: with the workflow and handler restored to dev HEAD e57ad1577 it exits 2 on `cannot import
      name '_dod_verify_argv'`, and with only the pre-fix workflow restored it reports 4 failed / 3 passed
      on exactly the four wiring assertions.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_16846_dispatch_venv_separation.py
          -q"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "dod-16846-sweep-node-suite-intact"
    description: >-
      AC6 regression proof for the co-changed workflow-lint matchers. Runs the whole node_evidence_autoclose_sweep_effect
      unit suite, which carries the OMN-16792 kill-switch wiring assertions and the OMN-16845 OMNI_HOME
      wiring assertions alongside the new OMN-16846 ones. Both of those modules located their subject
