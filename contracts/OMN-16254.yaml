schema_version: "1.0.0"
ticket_id: "OMN-16254"
title: "kubeconfig_ssm.sh fail-closed instance resolution (VPC-ambiguity near-miss)"
summary: >
  Fixes OmniNode-ai/omninode_infra PR #950: scripts/kubeconfig_ssm.sh resolved its SSM target as "first
  running instance in the VPC" (Reservations[0].Instances[0], filtered only on vpc-id + running-state).
  A second running k3s node in the VPC made this non-deterministic and connected a live fault-injection
  session to PROD instead of onex-dev (near-miss, read-only only, no mutation, caught before any write).
  The fix resolves by Name tag + VPC + running-state, refuses to guess on zero/multiple candidates, adds
  an explicit --instance-id override, asserts the resolved Name tag contains "dev" before writing any
  kubeconfig (even under an explicit override), and removes the hardcoded FALLBACK_INSTANCE (confirmed
  live to no longer exist). Sibling scripts and CI workflows using the same Reservations[0].Instances[0]
  indexing were swept; all others already filter on an explicit Name tag or take an explicit instance
  id, so no further fix was needed.
