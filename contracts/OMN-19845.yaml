      - id: "AC4"
        statement: |-
          AC4: on git 2.55.0 the push-then-clone race reproduces with default config and does not with auto maintenance off -- falsifier: the 1000-iteration container loop (push into a bare repo, then clone it) cited on this ticket, nonzero clone failures with default config and zero with maintenance.auto=false
