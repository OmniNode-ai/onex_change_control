---
schema_version: "1.0.0"
ticket_id: "OMN-15479"
title: "yamlfmt contamination ratchet over contracts/ + drift/dod_receipts/"
summary: >-
  yamlfmt v0.21.0 (pinned in .pre-commit-config.yaml, running on every commit) rewrites the PARSED VALUE
  of a folded block scalar that carries an internal newline -- each internal newline is replaced by a
  19-character yamlfmt-internal line marker and the newline itself is destroyed -- while the hook reports
  Passed. The output is still valid, parseable YAML, so it lands in a merged evidence receipt looking
  correct. contracts/ and drift/dod_receipts/ are the evidence control plane, so this produces receipts
  that assert something the verifier never observed. This PR ships a gate with two shrink-only set-equality
  ratchets: Rule S rejects the yamlfmt marker reaching a parsed value, and Rule F rejects the folded-scalar
  shape that produces it, pointing the author at literal block style. A fresh census re-derived by two
  independent code paths found 510 already-contaminated files (784 occurrences; 477 receipts and 33 contracts)
  plus 14 files still carrying the intact precondition, so both rules are frozen baselines rather than
  flat assertions -- a flat assertion would be permanently red and unmergeable. Enforcement ships in the
  same PR per root CLAUDE.md rule 5: an unconditional ci.yml job wired into the required CI Summary context
  with a strict success-only check, two pre-commit hooks with the scanning hook declared BEFORE yamlfmt
  so the precondition is rejected while the original text still exists, and a --check-wiring anti-removal
  anchor. The gate never mutates a file.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: >-
      The corpus ratchet runs unconditionally in ci.yml and gates the required CI Summary context with
      a strict success-only check.
    command: "uv run python scripts/validation/check_yamlfmt_contamination.py --check-wiring"
emergency_bypass:
