  - id: "dod-omn-15479-corpus-ratchet-green"
    description: >-
      The Rule S / Rule F shrink-only corpus ratchet runs over every tracked YAML file under contracts/
      and drift/dod_receipts/ and exits 0 against the real tree. This is a set-equality assertion in three
      directions, not a smoke test -- it fails on a NEW violating path, on a GROWN occurrence count inside
      an already-baselined path, and on a STALE baseline entry that a live scan no longer reproduces.
      It therefore also proves the 510 baselined files do NOT fail, which is what keeps the required context
      from going permanently red.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python scripts/validation/check_yamlfmt_contamination.py --corpus"
  - id: "dod-omn-15479-wiring-required-context"
    description: >-
      The anti-removal anchor asserts ci.yml declares the yamlfmt-contamination-ratchet job, that the
      job is unconditional (no needs, no if), that it executes the corpus ratchet and the RED/GREEN test
      module and re-runs this wiring check, and that ci-summary both lists the job in needs and applies
      a strict success-only check to it. The generic ci-summary rollup passes on a skipped need, so membership
      in needs alone is not enforcement.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python scripts/validation/check_yamlfmt_contamination.py --check-wiring"
  - id: "dod-omn-15479-red-green-controls"
    description: >-
      58 controls proving the gate FIRES rather than merely existing: the two defect shapes go red and
      the three proven-safe shapes (literal block, single-paragraph folded, quoted multi-line) stay green;
      the ratchet fails on a new path, a grown count and a stale entry; the wiring anchor fails on each
      of six removal vectors (job deleted, made conditional, given a needs chain, steps gutted, dropped
      from ci-summary needs, strict check removed); the pre-commit hook regex is compiled and matched
      against real corpus paths taken from the live baseline rather than invented ones; the scanning hook
      is asserted to be declared BEFORE yamlfmt; and the gate is asserted not to auto-fix.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/scripts/test_yamlfmt_contamination_gate.py -q -p no:randomly"
