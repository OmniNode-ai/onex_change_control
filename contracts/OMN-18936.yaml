        statement: |-
          AC-2: No shared-clone mutation becomes reachable that is refused today. -- falsifier: re-run the guard's existing refusal corpus unchanged and confirm every previously refused case is still refused; a case that flips from refused to admitted fails this criterion.
      - id: "AC3"
        statement: |-
          AC-3: A refusal names which segment defeated the tokeniser. -- falsifier: trigger a refusal on a genuinely unparseable git segment and confirm the message identifies that segment, so the next lane does not rewrite the wrong half of its command.
