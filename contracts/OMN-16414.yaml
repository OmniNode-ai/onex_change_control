---
schema_version: 1.0.0
ticket_id: OMN-16414
title: 'Fork-PR CI: guard onexbot-occ-writer app-token mint steps with continue-on-error'
summary: 'OCC companion for OmniNode-ai/omnibase_infra PR #2850. Fork-triggered pull_request runs receive
  no org secrets, so ONEXBOT_OCC_APP_ID/ONEXBOT_OCC_PRIVATE_KEY resolve empty and actions/create-github-app-token
  hard-fails ("Input required and not supplied: app-id") on any "Mint onexbot-occ-writer app token" step
  lacking continue-on-error. 4 of 9 such steps in this repo already carried the guard; 5 did not, each
  killing its job before ever reaching its own already-written `steps.app-token.outputs.token || github.token`
  fallback (exemplar: omnibase_infra#2772, a real fork PR). PR #2850 adds continue-on-error to the 5 unguarded
  sites (omni-standards-compliance.yml: type-safety, type-union-check, handler-contract-compliance; ci.yml:
  contract-compliance, migration-conflict-check -- plus its missing OMNI_REPO_CLONE_TOKEN fallback), diverges
  env-parity.yml to a job-level fork-skip `if:` (its sibling read target, omninode_infra, is PRIVATE --
  no token-less fallback is possible there), and updates one pinned test (test_migration_conflict_action_is_blocking)
  whose exact-match assertion this fix intentionally changes.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
