schema_version: "1.0.0"
ticket_id: "OMN-18165"
title: "Autobind OCC evidence for OMN-18165"
summary: >
  OCC contract for OMN-18165, carrying BOTH of the ticket's product PRs. OmniNode-ai/omniweb#367 builds
  the signon-walk and key-lifecycle golden/error chain pairs; OmniNode-ai/omninode_infra#1319 makes beta
  criteria C5 and C6 probe-backed by them. Two companions were generated for the same ticket (#9025 for
  omniweb, #9028 for omninode_infra) and collided on this file; this is the union resolution, keeping
  every evidence item from both sides.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #367 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "ci"
    description: "PR #1319 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      Behavior proof for PR #1319 on OmniNode-ai/omninode_infra, derived from the PR's own diff. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omninode_infra`.
    command: "uv run pytest tests/scripts/test_beta_board_c5_c6_chain_probes.py -q"
  - kind: "tests"
    description: |-
      Behavior proof for PR #367 on OmniNode-ai/omniweb. The generated contract recorded this as OWED because the producer derives behavior checks from pytest targets and omniweb has none — it is a TypeScript repo whose unit tests run under tsx. The proof is NOT absent: PR #367 adds tests/chain-record.test.ts and wires it into ci.yml as Gate 4n, which runs on every pull request. It is hand-authored below as `dod-omniweb-chain-record-behavior-proof` with source manual, rather than left owed or papered over with a ticket-independent suite (OMN-16434).
    command: "pnpm test:m3-chain-record"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
