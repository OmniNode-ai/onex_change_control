schema_version: "1.0.0"
ticket_id: "OMN-19643"
title: "omnimarket: add per-PR cancel-in-progress concurrency to PR-triggered workflows"
summary: |-
  Hand-authored OCC contract (OMN-15247) for OmniNode-ai/omnimarket PR #2922. occ-autobind declined the PR terminally with skip:NO_RED_DERIVABLE_CHECK at both heads it saw (bbd303bf9b and ed17364003), because the diff is 36 workflow YAML files with no test target to drive RED against the merge base. The PR is partial progress on this ticket: it adds the per-PR concurrency block to 36 of the ticket's PR-triggered workflows and deliberately skips the two aggregators (ci.yml, tracked by OMN-19618, and omni-standards-compliance.yml, deferred to the cancelled-supersession grace wave). No acceptance criterion is bound here, because neither is fully met by this PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the aggregating job's cancelled-supersession grace is confirmed (or extended) so a cancelled leaf job never turns it red on its own -- falsifier: read the job's own pass/fail logic against a synthetic cancelled leaf-job conclusion and confirm the aggregator does not fail on it alone
      - id: "AC2"
        statement: |-
          AC2: every pull_request-triggered workflow in omnimarket (outside ci.yml, tracked by OMN-19618) has a top-level concurrency: block with a per-PR group and cancel-in-progress: true, and push/merge_group/schedule/dispatch runs are unaffected -- falsifier: python3 cancel_sweep.py (or an equivalent parse) reports 0 remaining PR-triggered workflows without a per-PR cancel-in-progress group in omnimarket, and a PR with two pushes to the same branch shows the first run's jobs cancelled on GitHub's own run list
evidence_requirements:
