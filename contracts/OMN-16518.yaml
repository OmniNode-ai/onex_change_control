    description: "This PR's own CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo OmniNode-ai/onex_change_control"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
