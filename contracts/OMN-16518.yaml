title: "S1-3: onex_change_control — add explicit public-index pin ([tool.uv.index])"
summary: >
  docs/plans/2026-08-23-cloud-ci-offload-plan.md Stage 1 (S1-3). Adds [[tool.uv.index]] naming https://pypi.org/simple
  as the default index to this repo's own pyproject.toml — no [tool.uv] index configuration existed before
  this change. This is an in-tree change to onex_change_control itself (invariant I3): the contract and
  its evidence are carried in this same PR's diff rather than an external-repo companion.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
