---
schema_version: "1.0.0"
ticket_id: "OMN-20009"
title: "Overview shows the run-locally share and the average saving per call from served exposures"
summary: >-
  Hand-authored evidence companion for OMN-20009. The Overview's Run locally card shows local_call_share,
  which the delegation model-routing view now serves as local runs over all runs (omnimarket migration
  0055). The Avg saving / call card reads savings_per_measured_run_usd, a metering-summary.v1 column the
  fold now writes (omnimarket migration 0002). Neither figure is computed in the browser, and an unmeasured
  figure renders a typed reason, never 0. Compression and Cache hit rate, and their halves of AC1 and
  AC2, belong to OMN-20226 and are not claimed here; the Compression criterion was withdrawn from the
  ticket on 2026-10-04.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria declared on the OMN-20009 ticket body, as read on 2026-10-05. The ticket body is the source and this block is the copy. The body records that the compression and cache-hit halves of AC1 and AC2 are owned by OMN-20226 and that the Compression criterion was withdrawn on 2026-10-04; the remaining criteria keep their labels.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Each of the four figures reads from a served exposure -- falsifier: the page contract test finds one whose data is not a served exposure
      - id: "AC2"
        statement: |-
          AC2: A figure with no measurement behind it renders its typed reason, never `0` and never a blank -- falsifier: a fresh store shows `0` for any of the four
      - id: "AC4"
        statement: |-
          AC4: Run-locally share equals the local-tier call count over total calls for the window -- falsifier: the two disagree
evidence_requirements:
  - kind: "tests"
    description: >-
      OmniDash page-contract and render tests for the Run locally and Avg saving / call cards, run with
      omnidash's own runner at the omnidash checkout.
    command: >-
      npm test -- --run src/pages/local/omn20009.contracts.test.ts src/pages/LocalDashboardPage.omn20009.test.tsx
  - kind: "tests"
    description: >-
      OmniMarket fold tests for the served savings_per_measured_run_usd column of metering-summary.v1,
      run at the omnimarket checkout.
    command: >-
      uv run pytest tests/nodes/node_projection_metering_summary/test_omn20009_savings_per_measured_run.py
      -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20009-overview-cards"
    description: >-
      The Overview page contract binds Run locally to the served local_call_share of delegation.model-routing.v1
      and Avg saving / call to savings_per_measured_run_usd of metering-summary.v1 (waiting on it, typed,
      while the lab catalogue does not serve it). The render tests show the served values unchanged when
      they differ from what a browser would compute from the served counts, and typed reasons, never 0
      or $0, for an absent row, an absent field and a null value.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: >-
          npm test -- --run src/pages/local/omn20009.contracts.test.ts src/pages/LocalDashboardPage.omn20009.test.tsx
        cwd: "${OMNI_HOME}/omnidash"
    binds_ac:
      - "AC1"
      - "AC2"
      - "AC4"
  - id: "dod-omn20009-saving-per-measured-run"
    description: >-
      The metering-summary fold writes savings_per_measured_run_usd as savings_usd over runs_measured,
      to the millionth, null (never zero) without a measured run or a resolved baseline, and the served
      metering-summary.v1 read returns it unchanged.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/nodes/node_projection_metering_summary/test_omn20009_savings_per_measured_run.py
          -q -p no:randomly
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC1"
      - "AC2"
