  - id: "dod-retire-ac3-static-binding"
    description: |-
      Withdraws `dod-prod-consumer-inventory`'s claim on AC3, refused by the
      OMN-18577 proof-class rule as a hand-written static->live binding.

      The refusal is correct and is NOT worked around here. AC3 is settled by
      measuring a running system; the bound check only greps a receipt in this
      repository, and a grep proves a file was written, never that the cluster
      was read. Adding a `proposed_by` would downgrade the finding from REFUSED
      to REPORTED, but that field records machine transcription and this binding
      was hand-authored, so claiming it would be false provenance.

      Rewording AC3 to something a grep can settle was the other available exit
      and is refused on the same grounds: the criterion's whole content is the
      live measurement, and editing a criterion to fit the proof available is
      the laundering these gates exist to prevent.

      The measurement itself is NOT withdrawn. The receipt at
      `drift/dod_receipts/OMN-16504/dod-prod-consumer-inventory/command.yaml`
      stands, with its full inventory, both sweep dates and every fingerprint;
      it is a human-run measurement under operator credentials, and this
      retirement changes only what it is allowed to CLAIM automatically. AC3
      therefore reads as a reasoned, visible gap
      (`ac_binding_criterion_retired_unbound`, REPORTED) rather than as a
      manufactured pass -- which is the right outcome for a criterion only a
      human with cluster access can currently settle.

      The proof that WOULD bind AC3 is a check reading a scheduled probe
      workflow's own run history, since that contacts a live lane rather than
      the tree. No such workflow exists; it is OMN-18583's deliverable. When it
      lands, AC3 binds to it and this retirement is superseded in turn.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          bash -o pipefail -c 'python3 -c "import yaml,sys; c=yaml.safe_load(open(\"contracts/OMN-16504.yaml\")); i=[x for x in c[\"dod_evidence\"] if x[\"id\"]==\"dod-prod-consumer-inventory\"][0]; v=[k[\"check_value\"] for k in i[\"checks\"]]; sys.exit(0 if all(w.strip().startswith(\"grep \") for w in v) else 1)"'
    supersedes_ac_binding:
      - item: "dod-prod-consumer-inventory"
        label: "AC3"
        reason: >-
          AC3 is settled by measuring a running production cluster. The retired item only greps a receipt
          file in this repository, so it proves the receipt exists but does not itself contact the cluster
          or observe the live workload inventory.
