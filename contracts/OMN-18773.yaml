requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Before C1 lands, the widget renders a typed empty state naming the missing producer and nothing else -- falsifier: no-untyped-empty-state.test.ts and no-projection-fallback.test.ts pass, and the Empty story's text names onex.snapshot.projection.runner-fleet.v1 as the absent producer.
      - id: "AC2"
        statement: |-
          AC2: No GitHub API read and no container-runtime probe is introduced on any path -- falsifier: grep -rn "api.github.com\|actions/runners\|docker inspect\|execFile" omnidash/src omnidash/server returns nothing new on the branch.
      - id: "AC3"
        statement: |-
          AC3: Once the projection exists, the widget renders counts broken down by class and by host -- falsifier: a test feeds a fixture spanning three label classes and two hosts and asserts both breakdowns render with correct counts.
      - id: "AC4"
        statement: |-
          AC4: An offline runner is rendered as offline rather than dropped -- falsifier: a test feeds a fixture containing one offline runner and asserts it appears in the rendered list with status offline and is counted in the rollup.
      - id: "AC5"
        statement: |-
          AC5: A busy runner shows which job it is running -- falsifier: a test feeds a busy-runner fixture carrying a job identifier and asserts that identifier is rendered on the row.
      - id: "AC6"
        statement: |-
          AC6: The widget is registered, ships Empty and Populated stories, and passes the compliance suite -- falsifier: npm run generate:registry adds its entry, and storybook-coverage-compliance.test.ts, dashboard-truth-compliance.test.ts, no-non-authoritative-read-source.test.ts, no-projection-websocket.test.ts and the typography rule all pass.
      - id: "AC7"
        statement: |-
          AC7: The widget renders live fleet state from the lab -- falsifier: a screenshot in the PR body with the bridge pointed at the lab projection API, the host named in the readback line, showing a rollup count that matches the live registered-runner count at the same moment.
evidence_requirements:
  - kind: "ci"
    description: "PR #333 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #333 on OmniNode-ai/omnidash changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (fixtures/onex.snapshot.projection.runner-fleet.v1/omninode-air-runner-1.json, fixtures/onex.snapshot.projection.runner-fleet.v1/omninode-runner-1.json, fixtures/onex.snapshot.projection.runner-fleet.v1/omnipc2-verify-runner-1.json, scripts/generate-registry.ts) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
