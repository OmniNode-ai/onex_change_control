  - id: "dod-omn17304-ac6-wire-correlation-not-swallowed"
    description: >
      AC6 — RuntimeLocal no longer swallows the frozen-model ValidationError into a bare pass, and the
      "published initial command" log line prints the correlation actually on the wire. Closed on omnibase_core#1633,
      merged to dev 2026-09-01T04:49:49Z at fc20d08690f03593eb8c55fd2c02c5f0f75f2b68 (OCC companion onex_change_control#7925
      merged first). Re-derived independently by this lane on 2026-09-09 by reading both shas side by
      side rather than by adopting the ticket's account. At the parent the code minted a throwaway uuid4,
      assigned it to the payload, caught the refusal in a bare two-exception handler whose body was pass,
      and then logged THAT discarded id as the published correlation — so on the delegation path, whose
      request model is frozen with extra forbidden, the assignment always raised and every capture log
      named a correlation that appears nowhere on the broker. At the merge sha the mint is replaced by
      _resolve_wire_correlation_id, which returns the id together with its provenance: the payload's own
      id when it carries one, a runtime-minted id only to fill a genuine absence, and an explicit unstampable
      report — logged as a warning, never swallowed — when a frozen payload refuses the stamp. The same
      resolved pair then goes to the log line, so the printed id is by construction the one on the wire
      rather than a second value that happens to agree. A NAIVE CHECK WAS REJECTED HERE, and the reason
      is worth recording: greping for the old swallow comment is NOT discriminating, because the new method
