      and where it durably lives. The operator ruling was posted to the ticket on 2026-08-31T11:46:57Z
      (Linear comment id 74e30509-45ae-4dc1-b8a2-0a89122bf77e, opening "OPERATOR RULING (2026-08-31, in-session)
      — supersedes the decision brief's A/B/C fork"). It answers all three fork questions: per-runtime
      configuration resolved through one shared seam (surface); validate_production_safe gains a profile
      axis instead of a carve-out so the in-memory bus stays expressible for local-profile runtimes while
      lane runtimes still reject it (expressibility); and the bus-type environment variable is demoted
      to bootstrap and holds no authority tier (precedence). It was restated, not reopened, by the formal
      AC2 ruling comment 94634f52-0438-48e7-9407-fbaf2c810cc9 of 2026-09-08. Both comments were read live
      over the Linear GraphQL API by this lane on 2026-09-09 with a negative control: the same marker
      grep against the DECISION-BRIEF comment 7904759a-c799-4e03-9212-b8afd8edf5cd, which poses the fork
      rather than ruling it, returns 0. That read is receipt-backed rather than a check because Linear
      is not a gh-readable surface and a check that needs a Linear API token would go red on a runner
      that has none — a red check for an environmental reason is worse evidence than an honest receipt.
      CHECK 1 is the gh-readable half of the ruling: the tier-0 shipped runtime config that the wiring
      merge introduced records all three ruled answers verbatim in its own header, so the ruling is durable
      in git and not only in a ticket comment. Executed this session at the wiring merge sha 21aaec90c9d74a19d537abe701ccae77651d7f45
      -> 3, with a negative control at its parent 0cbda9bfe8f679fc6d2b6c34ba60b6408b2ae350 (the file does
      not exist there) -> 0. CHECK 2 is the ORDERING half — the clause that makes AC2 a sequencing bar
