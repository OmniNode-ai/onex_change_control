    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The Core contract evidence accepts an optional raw provider response carrier (exact text up to 64 KiB UTF-8, sha256, byte count) and refuses one whose text does not match its hash or length, or that drops text under the bound -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_delegation_raw_response.py -q in omnibase_core
      - id: "AC2"
        statement: |-
          AC2: The provider-boundary effect and the in-process dispatch port stamp the provider message content onto that carrier before extraction, so the terminal payload carries it -- falsifier: uv run pytest tests/unit/delegation/test_output_only_raw_response_carrier.py -q in omnimarket
      - id: "AC3"
        statement: |-
          AC3: The conformance runner judges the output-only bar from the retained raw bytes: a JSON trial whose raw response has prose after the value is refused, and a clean JSON trial passes -- falsifier: uv run pytest tests/unit/delegation/test_output_only_raw_response_carrier.py -q in omnimarket
      - id: "AC4"
        statement: |-
          AC4: The carrier holds only the provider message content, never a request header, credential, request payload or other provider body field -- falsifier: uv run pytest tests/unit/delegation/test_output_only_raw_response_carrier.py -k field_set -q in omnimarket
      - id: "AC5"
        statement: |-
          AC5: A bounded JSON scorecard delegation against the lab-served model returns a caller-visible document whose raw carrier hashes to its sha256 and is judged by the bar on the raw_provider_bytes basis -- falsifier: a captured workflow_result.json from the lab run whose response_contract_evidence has no raw_response
