  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnimarket-pr-2571"
    description: >-
      omnimarket PR #2571 adds timeout-minutes: 30 to the `test` job in .github/workflows/ci.yml. Content-bound
      probe: it reads the omnimarket blob at the PR head through the GitHub API and scopes the search
      to the `test:` job block only (stopping at the next top-level job key), so it executes against a
      surface this OCC PR does not author, and it is falsifiable — verified GREEN at head e23276235b778a6e4cd4d9d101b306418420c0d5
      and RED at merge-base 3038d1dabadea4973707f0228862b4aef4e09242, where the `test` job block carries
      no timeout-minutes key at all.
    source: "manual"
    status: "verified"
    checks:
