        check_value: >-
          body="$(gh api 'repos/OmniNode-ai/omnimarket/contents/.github/workflows/ci.yml?ref=e23276235b778a6e4cd4d9d101b306418420c0d5'
          --jq .content | base64 -d)" && printf '%s\n' "$body" | awk '/^  test:$/{f=1;next} f && /^  [a-zA-Z0-9_-]+:$/{exit}
          f' | grep -q 'timeout-minutes: 30'
