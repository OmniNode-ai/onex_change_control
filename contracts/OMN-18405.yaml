schema_version: "1.0.0"
ticket_id: "OMN-18405"
title: "omnimarket test job missing timeout-minutes hangs and starves successor runs"
summary: >-
  The omnimarket ci.yml `test` job (Tests split matrix) had no timeout-minutes, so a stuck shard fell
  back to GitHub's implicit 360-minute job default. A Tests (Split 2/2) shard hung 2h05m on run 34988591973
  (2026-09-15) and, through the workflow's non-cancelling per-ref concurrency group (OMN-14645, left unchanged),
  starved PR #2565's successor run for the same two hours. omnimarket#2571 sets timeout-minutes: 30 on
  the job, sized from measured p95 across 524 successful shards (7.8m, rounded up to 10m, +10m, floored
  at the 30m minimum).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
