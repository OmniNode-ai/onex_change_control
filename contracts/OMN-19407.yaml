    acceptance:
      - id: "AC1"
        statement: |-
          AC1: onex delegate --help lists the task classes read from the task-class authority at invocation time, and no onex CLI module holds a literal copy of that list -- falsifier: uv run pytest tests/unit/cli/test_cli_registry_vocabulary.py -q in omnibase_infra
      - id: "AC2"
        statement: |-
          AC2: When the registry entry for the task-class authority or the delegate node cannot be resolved, onex delegate exits non-zero naming the missing entry, with no fallback list -- falsifier: uv run pytest tests/unit/cli/test_cli_registry_vocabulary.py -k unresolvable -q in omnibase_infra
      - id: "AC3"
        statement: |-
          AC3: onex skill delegate resolves its task class through the same contract selection as onex delegate, so the keyword classifier in skill_mapping.yaml is gone -- falsifier: uv run pytest tests/unit/cli/test_cli_skill.py -k delegate -q in omnibase_infra
      - id: "AC4"
        statement: |-
          AC4: --source and --criteria-mode choices are read from the delegate node contract input model, and explicit internal classes are admitted while a class with routing_availability is refused in the contract words -- falsifier: uv run pytest tests/unit/cli/test_cli_registry_vocabulary.py -q in omnibase_infra
      - id: "AC5"
        statement: |-
          AC5: A guard refuses a CLI module that defines a literal vocabulary tuple, list, set, Literal or click.Choice of string values, with passing and failing controls -- falsifier: uv run pytest tests/unit/scripts/test_check_cli_registry_vocabulary.py -q in omnibase_infra plus the pre-commit hook id check-cli-registry-vocabulary
      - id: "AC6"
        statement: |-
          AC6: omnimarket onex cloud delegate --task-type and the onex-delegate adapter read task classes and sources from the authority and the wire model instead of literal copies -- falsifier: uv run pytest tests/unit/cli/test_cli_cloud_registry_vocabulary.py -q in omnimarket
      - id: "AC7"
        statement: |-
          AC7: A real dev-lane run of onex delegate with --task-type documentation --bus kafka --lane dev resolves the class through the registry and writes a receipt naming the class -- falsifier: onex delegate on the dev lane, then read .onex_state/runs/<run_id>/receipt.json
