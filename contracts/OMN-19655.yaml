requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Each repo that publishes to PyPI and depends on another of ours (omnibase_spi, omnibase_infra, omnimarket, omnimemory, omniintelligence, omniclaude) runs a pre-merge job, on pull requests that touch pyproject.toml or uv.lock and on a nightly schedule, that builds the wheel and runs the release workflow's own resolvability script against the published index, and fails with the conflicting pins named -- falsifier: uv run pytest tests/ci/test_pin_resolvability_gate_workflow.py in each repo, plus a read of each repo's workflow file for the pull_request paths and schedule triggers
      - id: "AC2"
        statement: |-
          AC2: The gate fails on omnimarket at the omnimarket#2896 merge commit when the index is held to its state before infra 0.38.58, and passes on a known-good commit before #2896 -- falsifier: UV_EXCLUDE_NEWER=<pre-0.38.58 timestamp> python3 scripts/ci/verify_pypi_pin_resolvability.py dist/ on both commits; exit 1 then exit 0
      - id: "AC3"
        statement: |-
          AC3: When omnibase_infra dev pins an exact sibling version newer than the one the latest published omnibase-infra pins, the release train is dispatched for omnibase_infra without a person deciding it, and the train's own premises still decide the cut -- falsifier: uv run pytest tests/scripts/test_release_dependency_advance.py with a stranded fixture (must dispatch) and an in-step fixture (must not)
      - id: "AC4"
        statement: |-
          AC4: omnimemory and omniintelligence release workflows run the resolvability step before publish -- falsifier: grep for verify_pypi_pin_resolvability in each repo's .github/workflows/release.yml before its uv publish line
      - id: "AC5"
        statement: |-
          AC5: The operator gets a written recommendation on whether omnibase_infra should publish a compatible omnibase-core range instead of an exact pin, with the reason the pin is exact today read from history -- falsifier: the ticket comment carrying the recommendation cites the commit that made the pin exact
