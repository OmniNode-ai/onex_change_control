---
schema_version: "1.0.0"
ticket_id: "OMN-16205"
title: "Public omniweb ingress swap onex-dev -> onex-prod + AUTH_URL contract overlay"
summary: >
  Prep-only fix for OmniNode-ai/omninode_infra PR #947 (draft, operator-gated): moves the public app.omninode.ai
  / omninode.ai / www.omninode.ai Ingress from the unmanaged onex-dev namespace to the pipeline-managed
  onex-prod namespace, and moves omniweb's AUTH_URL from a bare Deployment-manifest literal to the onex-runtime-config
  ConfigMap (contract-overlay sourced, per operator ruling 2026-08-18). No live cluster mutation performed
  by this PR or this contract; the live cutover is a separate operator-gated runbook documented in the
  PR body.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #947 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omninode_infra-pr-947"
    description: >
      Product commit d06e49f pins the public OmniWeb ingress in the onex-prod
      namespace.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          python -c "import base64,json,subprocess;
          p='repos/OmniNode-ai/omninode_infra/contents/k8s/onex-prod/omniweb/ingress.yaml?ref=d06e49f764a98c631453bd22696063026baaff03';
          d=json.loads(subprocess.check_output(['gh','api',p],text=True));
          s=base64.b64decode(d['content']).decode();
          assert 'namespace: onex-prod' in s"
  - id: "dod-OmniNode-ai-omninode_infra-pr-947-ci"
    description: >
      Product commit d06e49f wires OmniWeb AUTH_URL through the
      onex-runtime-config ConfigMap rather than a manifest literal.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          python -c "import base64,json,subprocess;
          p='repos/OmniNode-ai/omninode_infra/contents/k8s/onex-prod/omniweb/deployment.yaml?ref=d06e49f764a98c631453bd22696063026baaff03';
          d=json.loads(subprocess.check_output(['gh','api',p],text=True));
          s=base64.b64decode(d['content']).decode();
          assert '- name: AUTH_URL' in s and 'name: onex-runtime-config' in s and 'key: AUTH_URL' in s"
