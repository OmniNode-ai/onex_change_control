    command: >-
      uv run pytest tests/test_contract_compliance_check.py tests/test_dod_evidence_schema.py -q
  - kind: manual
    description: >-
      An independent local Done-gate run must execute a credential-limited positive control and keep a
      wrong evidence identifier RED.
