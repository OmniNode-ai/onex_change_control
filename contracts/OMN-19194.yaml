schema_version: "1.0.0"
ticket_id: "OMN-19194"
title: "product-readiness shadow coverage job times out before the suite finishes on onex_change_control"
summary: >-
  The tests+coverage (shadow) job in product-readiness-shadow.yml ran the same unscoped full-suite pytest
  command as ci.yml's required Tests job, under a stricter timeout-minutes: 45 while the required job
  carries no timeout at all. As the suite's wall-clock cost grew, the shadow job was guaranteed to be
  cancelled on every PR (measured: 45m20s cancelled vs 45m53s success on PR #10816, run 35770887545).
  Fix scopes tests-shadow to the dedicated tests/ci/test_product_reason_graph_omn14704.py slice, matching
  the omnibase_core / omnibase_infra sibling shadow workflows, and drops timeout-minutes to 10.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #10828 CI green, including a completed (not cancelled) tests+coverage (shadow) job"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: "The narrowed shadow slice passes locally at the fix commit"
    command: "uv run pytest tests/ci/test_product_reason_graph_omn14704.py -q --no-header"
emergency_bypass:
