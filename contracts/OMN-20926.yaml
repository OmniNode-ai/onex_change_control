        statement: |-
          AC2: tests show a store that is unreachable, refuses the login or refuses the write falls back to the contract marker, stamps secret_store with the fallback count and reason, and still journals the record -- falsifier: uv run pytest tests/hooks/test_captured_secret_refs.py -q -k fallback
