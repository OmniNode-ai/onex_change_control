        statement: |-
          AC3: tests show the fan-out scrub in omnimarket leaves a secret reference span unchanged and still scrubs a credential next to it -- falsifier: uv run pytest tests/unit/nodes/node_event_emit_effect -q -k secret_reference
      - id: "AC4"
        statement: |-
          AC4: tests show the consumer resolver returns the stored value for a valid reference, refuses a malformed one, and logs the reference and accessor without the value -- falsifier: uv run pytest tests/unit/test_captured_secret_reference.py -q
      - id: "AC5"
        statement: |-
          AC5: with the write identity granted, a planted fake secret in a fresh session on the lab dev lane arrives on the content topic as a reference that resolves through the store to the planted value, and the topic holds zero copies of it -- falsifier: rpk topic consume on the dev lane for the session, grep count of the planted value expecting 0, then the resolver run on the reference Implementation note (secret-refs-9f8a, 2026-10-11): the record field is named stored_refs (the name secret_store tripped secret-keyword scanners on the contract mirror). The tests that answer the criteria: omnimarket tests/unit/nodes/test_golden_chain_captured_secret_store_effect.py (AC1 store side), tests/unit/nodes/node_event_emit_effect/test_secret_reference_omn20926.py (AC3), tests/unit/nodes/test_golden_chain_captured_secret_resolve_effect.py (AC4); omniclaude tests/unit/hooks/test_hook_content_capture_secret_refs_omn20926.py (AC1 producer side, AC2). Writer is omnimarket node_captured_secret_store_effect, reader node_captured_secret_resolve_effect; configuration is the machine's ~/.onex/config.yaml block captured_secret_store. PRs: omnimarket#3747 (lands first), omniclaude#2672 (companion). AC5 waits on the identities requested in the comment below.
