---
schema_version: "1.0.0"
ticket_id: "OMN-15594"
title: "[steel_onslaught] Weapon/chassis compatibility is declared but enforced by nothing"
summary: >-
  DoD contract for OMN-15594, bound to the merged product PR jonahgabriel/steel_onslaught#255 (merge commit
  89539306e04c37d062c6a25118d23e3df73081fb, reviewed head b1d7da3d3b9dfee810da5ee1d91d5b3fc0f22799, base
  main). The ticket admitted two outcomes at AC1 — enforce the three declared compatibility fields, or
  record a decision that they are advisory and say so at the declaration site. The PR took the ENFORCE
  branch, so AC2–AC5 (each written as conditional on "if enforced") all become live obligations and are
  asserted below in their enforced form. Proof class is code-only. steel_onslaught has no deployed runtime
  surface and none of the five acceptance criteria names deployed or live behaviour, so no deploy, runtime-digest,
  or live-probe evidence is declared here — declaring one would be evidence theatre.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #255 CI checks green on jonahgabriel/steel_onslaught (evidence-schema, python-test,
      frontend-test, sanitize-text)"
    command: "gh pr checks 255 --repo jonahgabriel/steel_onslaught"
  - kind: "tests"
    description: "tests/contracts/test_loadout_compatibility.py covers all three declared compatibility
      directions with a rejection test each, a legal-pairing regression, the packaged contracts_data/
      corpus sweep, and the AC5 recurrence guard"
    command: "uv run pytest tests/contracts/test_loadout_compatibility.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-jonahgabriel-steel_onslaught-pr-255"
    description: >-
      Product PR #255 on jonahgabriel/steel_onslaught is MERGED at merge commit 89539306e04c37d062c6a25118d23e3df73081fb,
      bound at the exact reviewed head b1d7da3d3b9dfee810da5ee1d91d5b3fc0f22799, with its complete eight-file
      scope — the three declaration modules, the new single-consumer compatibility module, the two match-assembly
      sites, and the two test modules. Any retarget, force-push, or scope change falsifies this check.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 255 --repo jonahgabriel/steel_onslaught --json state,mergeCommit,headRefOid,files --jq 'if (.state == "MERGED" and .mergeCommit.oid == "89539306e04c37d062c6a25118d23e3df73081fb" and .headRefOid == "b1d7da3d3b9dfee810da5ee1d91d5b3fc0f22799" and ([.files[].path] | sort == ["src/steel_onslaught/contracts/boiler.py","src/steel_onslaught/contracts/chassis.py","src/steel_onslaught/contracts/compatibility.py","src/steel_onslaught/contracts/weapon.py","src/steel_onslaught/match/composition.py","src/steel_onslaught/match/runner.py","tests/contracts/test_loadout_compatibility.py","tests/match/test_composition_di.py"])) then "true" else error("unexpected #255 state, head, or file scope") end'
  - id: "dod-15594-pr-255-ci"
    description: >-
      PR #255 CI is green. steel_onslaught runs python-test as a required job, and that job is what actually
      executes the compatibility test module — the file-presence assertions below prove the tests were
      authored, this one proves they pass.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr checks 255 --repo jonahgabriel/steel_onslaught"
  - id: "dod-15594-ac1-enforcement-surface"
    description: >-
      AC1, enforce branch. src/steel_onslaught/contracts/compatibility.py at the merge commit declares
      all three compatibility-specific violation kinds (WEAPON_CHASSIS_CLASS, CHASSIS_WEAPON_CLASS, BOILER_CHASSIS_CLASS)
      as enum members — one per declared field, so a violation names which declaration rejected the pairing
      rather than raising a generic error — and match/runner.py carries the _require_legal_loadout fail-closed
      assembly gate that consumes them. Falsifiable: if enforcement were reverted to advisory, or the
      assembly gate removed, a leg fails.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/contracts/compatibility.py?ref=89539306e04c37d062c6a25118d23e3df73081fb" --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -cE '^    (WEAPON_CHASSIS_CLASS|CHASSIS_WEAPON_CLASS|BOILER_CHASSIS_CLASS) = ' | grep -qx 3 && runner="$(mktemp)" && gh api "repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/match/runner.py?ref=89539306e04c37d062c6a25118d23e3df73081fb" --jq '.content' | base64 -d > "$runner" && grep -qF '_require_legal_loadout' "$runner" && rm -f "$runner"
  - id: "dod-15594-ac2-ac3-three-directions"
    description: >-
      AC2 and AC3. Exactly three test_red_at_base_* functions exist at the merge commit, one per declared
      direction — weapon.compatible_chassis_classes, chassis.weapon_classes, boiler.compatible_chassis_classes
      — each asserting rejection with a compatibility-specific violation kind rather than a generic error.
      The count is pinned at 3 so dropping a direction falsifies the check.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/jonahgabriel/steel_onslaught/contents/tests/contracts/test_loadout_compatibility.py?ref=89539306e04c37d062c6a25118d23e3df73081fb" --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -cE '^def test_red_at_base_' | grep -qx 3
  - id: "dod-15594-ac2-ac3-red-at-base-d78094a"
    description: >-
      AC2/AC3 RED-at-base leg. The ticket requires the rejection tests to be proven RED at steel_onslaught@d78094a87046a45f3943a1afefd36fb4ad1d958d.
      PR #255 reports both the enforcement module and the test module with file status "added", which
      is the strongest available form of that proof: neither the validator nor the tests existed at the
      base, so an illegal pairing provably passed through unrejected there. Asserted from the PR's own
      file-status records rather than by negating a 404, so a failed API read cannot read as evidence
      of absence.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          statuses="$(gh api repos/jonahgabriel/steel_onslaught/pulls/255/files --paginate --jq '[.[] | select(.filename == "src/steel_onslaught/contracts/compatibility.py" or .filename == "tests/contracts/test_loadout_compatibility.py") | .status] | unique | join(",")')" && printf '%s' "$statuses" | grep -qx added
  - id: "dod-15594-ac4-no-false-positives"
    description: >-
      AC4. Both required guards are present at the merge commit: test_legal_pairing_produces_no_violations
      proves the check is not blanket-rejecting, and test_every_packaged_loadout_is_compatible sweeps
      every packaged loadout under contracts_data/ against the new rules. The PR records the pre-enforcement
      survey of all 53 packaged loadouts finding 0 violations, so AC4's "if any packaged default is currently
      illegal, file it separately" branch was not reached and correctly produced no follow-up ticket.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/jonahgabriel/steel_onslaught/contents/tests/contracts/test_loadout_compatibility.py?ref=89539306e04c37d062c6a25118d23e3df73081fb" --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -cE '^def (test_legal_pairing_produces_no_violations|test_every_packaged_loadout_is_compatible)' | grep -qx 2
  - id: "dod-15594-ac5-recurrence-guard"
    description: >-
      AC5. test_binding_compatibility_fields_have_a_named_consumer exists at the merge commit — the contract
      test asserting each declared binding compatibility field has a named consumer in src/, paired with
      test_non_binding_compatibility_fields_say_so_at_the_declaration_site for the advisory case. Honesty
      note rather than a claim of perfection: OMN-15608 subsequently found this guard weak as landed here
      — the consumer check was a source substring a docstring would satisfy, and model discovery was non-recursive
      so a contracts/ subpackage escaped it. That weakness is separately ticketed and separately fixed
      in #258. AC5 as written by this ticket is satisfied by the guard landed in #255; the second check
      binds the hardening so the residual gap is not left silently open.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          f="$(mktemp)" && gh api "repos/jonahgabriel/steel_onslaught/contents/tests/contracts/test_loadout_compatibility.py?ref=89539306e04c37d062c6a25118d23e3df73081fb" --jq '.content' | base64 -d > "$f" && grep -qF 'def test_binding_compatibility_fields_have_a_named_consumer' "$f" && rm -f "$f"
      - check_type: "command"
        check_value: |-
          gh pr view 258 --repo jonahgabriel/steel_onslaught --json state,mergeCommit,title,files --jq 'if (.state == "MERGED" and (.title | test("OMN-15608")) and ([.files[].path] | index("tests/contracts/test_loadout_compatibility.py") != null)) then "true" else error("unexpected #258 state or scope") end'
