---
schema_version: "1.0.0"
ticket_id: "OMN-15301"
title: "Autobind OCC evidence for OMN-15301"
summary: >-
  OCC Evidence-Source autobind companion (OMN-13317 F1) for PR #2512, plus an append-only digest-pin evidence
  extension for omninode_infra#727. PR #727 pins the onex-dev runtime kustomization to candidate-416b7b9,
  the first image carrying the projection-writer fix.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2512 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2512"
    description: "PR #2512 on OmniNode-ai/omnibase_infra — Evidence-Source autobind."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo ${REPO} --json number,state"
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2512-ci"
    description: "PR #2512 on OmniNode-ai/omnibase_infra — product diff scope check (OMN-14425)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - id: "occ-self-bind-pr-5261"
    description: "OCC companion PR #5261 — self-bind for OMN-15301 (OMN-14650)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo ${REPO} --json number,state"
  - id: "dod-omn15301-pr-727-head"
    description: "Binds OMN-15301 to the exact omninode_infra#727 head that CI evaluated."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 727 --repo OmniNode-ai/omninode_infra --json headRefOid --jq .headRefOid)"
          = "b9f759148a6327a51fd92586678640eda7030b05"
  - id: "dod-omn15301-pr-727-file-scope"
    description: "Verifies the digest pin PR changes only the onex-dev runtime kustomization."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 727 --repo OmniNode-ai/omninode_infra --json files --jq '[.files[].path]
          | sort | join(",")')" = "k8s/onex-dev/runtime/kustomization.yaml"
  - id: "dod-omn15301-runtime-candidate-pin"
    description: >-
      Confirms the candidate image tag/digest lineage is present in the kustomization at the bound PR
      head.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/runtime/kustomization.yaml -H
          'Accept: application/vnd.github.raw' --method GET -f ref=b9f759148a6327a51fd92586678640eda7030b05
          | grep -q 'candidate-416b7b9'
  - id: "occ-self-bind-pr-5275-omn15301"
    description: "OCC companion PR #5275 — self-bind for OMN-15301 digest-pin extension."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5275 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
