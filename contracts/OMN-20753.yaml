      - id: "AC1"
        statement: |-
          AC1: The decisions exposure serves each run's terminal status and cost, and Runs shows success and $0.00 for a run whose receipt records them -- falsifier: a pytest that writes one delegation_events row with terminal_ok 1 and cost_usd 0.0, reads the decisions exposure through create_dashboard_app, and fails when either field is absent from the served row
      - id: "AC2"
        statement: |-
          AC2: A run whose cost was never measured still shows Not recorded, never $0.00 -- falsifier: a vitest Runs page test serving one row with cost_usd null and one with 0.0, failing unless the first renders Not recorded and the second $0.00
