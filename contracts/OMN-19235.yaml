      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The private marketplace ships a second plugin carrying all seven overlays at overlays/<skill>/overlay.yaml, byte-equal in content apart from status comments, with the plugin version equal in both manifests -- falsifier: python3 scripts/validate_plugin.py in the private marketplace repo exits 0, and a diff of each overlay against knowledge-base-internal origin/main before removal shows only comment lines
      - id: "AC2"
        statement: |-
          AC2: The plugin validator refuses an overlay directory with no overlay.yaml, an overlay that does not parse as a YAML mapping, and an overlay whose catalogue_row differs from its directory, and admits the committed tree -- falsifier: python3 -m pytest tests -q in the private marketplace repo, with a positive control per refusal
      - id: "AC3"
        statement: |-
          AC3: knowledge-base-internal no longer carries marketplace-internal/ and its README carries a one-line pointer in place of the old entry -- falsifier: git ls-tree on knowledge-base-internal origin/main for marketplace-internal/ returns zero paths, with a positive control ls-tree on guides/ returning rows
      - id: "AC4"
        statement: |-
          AC4: No public repository names the private marketplace repository, and the one public reference to the old path is repointed -- falsifier: git -C $OMNI_HOME/omniclaude grep -c on origin/dev for the private repo name exits 1 and for marketplace-internal exits 1, with a positive control grep for session_preflight exiting 0
      - id: "AC5"
        statement: |-
          AC5: The overlay plugin is installed on the operator machine from the marketplace -- falsifier: claude plugin list names the overlay plugin at the new version, and a headless claude -p listing reads the installed overlay files
