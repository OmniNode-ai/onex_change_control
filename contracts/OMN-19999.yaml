  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: One typed event model carries repo, PR number, head sha, state, draft, base, labels, armed, queued, watcher class, red and pending check names, observed_at and a content digest, and its topic is registered duty_critical -- falsifier: uv run pytest tests/unit/nodes/node_pr_state_emit_effect -q fails if a field is missing or the registry tier is not duty_critical
      - id: "AC2"
        statement: |-
          AC2: The fold is pure and order-safe: replaying a recorded event log in two different orders yields identical rows, and an event with an older observed_at never overwrites a newer row -- falsifier: uv run pytest tests/unit/nodes/node_projection_pr_state -q -k order
      - id: "AC3"
        statement: |-
          AC3: The writer class declares in-process dispatch and persists the fold result, and a real Postgres write test shows a redelivered event is one row and a merged PR row is marked closed -- falsifier: uv run pytest tests/test_pr_state_real_postgres_write_path.py -q
      - id: "AC4"
        statement: |-
          AC4: The watcher emits one event per PR whose record changed since its last emit, none for an unchanged tick, and an emit failure never fails or slows the tick -- falsifier: uv run pytest tests/test_pr_watcher_bus_emit.py -q in omnibase_internal, including the hang and non-zero-exit cases
      - id: "AC5"
        statement: |-
          AC5: The parity check reports exact parity between the watcher state file and the lab projection for open PRs on the .201 dev lane, and a positive control (a PR removed from the projection) reports a mismatch -- falsifier: python -m omnimarket.nodes.node_projection_pr_state.parity exits 0 on the live pair and 1 on the control, both outputs in the PR body
