  - id: "dod-omn18381-ac5-page-states-its-own-age"
    description: |-
      AC5 -- the generator emits a staleness element with a baked
      `data-generated` timestamp whose age is recomputed in the reader's
      browser. This is the criterion that answers the incident: on 2026-09-11
      and again on 2026-09-14 the board froze while showing no sign of being
      frozen. A staleness signal needing a publish to update cannot fire in the
      one case it exists for. 3 tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/commits/eb81dc81e05a0b1f5d8a74991d5a30f6a3727f51 --jq .sha >/dev/null;
          uv run pytest tests/ci/test_board_fleet_placement_omn18381.py::TestAc5ThePageStatesItsOwnAge -q --no-cov -p no:cacheprovider
        cwd: "${OMNI_HOME}/omninode_infra"
    binds_ac:
      - "AC5"
  - id: "dod-omn18381-ac6-missing-aws-named-cause"
    description: |-
      AC6 -- the publish job probes for the aws CLI before using it and raises a
      GitHub error annotation naming both the CLI and the fleet, so a tooling
