        cwd: "${OMNI_HOME}/omninode_infra"
    binds_ac:
      - "AC3"
  - id: "dod-omn18381-ac4-adopted-resources-not-renamed"
    description: |-
      AC4 -- the S3 bucket and CloudFront distribution are still named in the
      workflow. #1462 has Terraform adopting both by name, so a rename orphans
      the adopted resource and publishes where nobody is reading. 2 tests.
    source: "manual"
    status: "verified"
    checks:
