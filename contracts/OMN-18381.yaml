  # ---------------------------------------------------------------------------
  # OMN-18381 acceptance binding, authored 2026-09-17.
  #
  # The sweep's hold on this ticket was a PROOF-CLASS gap, not a missing check:
  # "2/6 checks verified, 0 failed -- and not one of them executed the claimed
  # behavior. Every passing check binds merge state (a PR is merged) or is a
  # surrogate (a file exists, a generic suite ran)." The three items above are
  # exactly that: two `gh pr view` merge probes and a generic OCC suite.
  #
  # The six items below each run a test runner against a class written for one
  # criterion, at cwd `${OMNI_HOME}/omninode_infra`. Every class carries a
  # demonstrated negative control -- the artifact was mutated and the matching
  # test observed to fail, then reverted (omninode_infra#1539):
  #
  #   AC1/AC2  seam -> runs-on: ubuntu-latest   3 failed, 11 passed
  #   AC3      hourly -> 15-minute cadence      1 failed, 13 passed
  #   AC4      bucket renamed                   1 failed, 13 passed
  #   AC5      staleness bar id stripped        1 failed, 13 passed
  #   AC6      aws probe removed                2 failed, 12 passed
  #   restored                                 14 passed
  #
  # ORDERING. The test file lands in omninode_infra#1539, which is gated by
  # `OCC Companion Merged Gate (OMN-15214)` on this companion -- so this merges
  # first and #1539 second. The receipts below record local runs of each class
  # against that branch; the checks resolve against merged `dev` once #1539
  # lands, which is the same order OMN-16504 used (OCC#7214 before #1019).
  # ---------------------------------------------------------------------------
  - id: "dod-omn18381-ac1-placement-seam"
    description: |-
      AC1 -- both board jobs route through `vars.OMNI_TRUSTED_CI_RUNS_ON_JSON`,
      parsed with fromJSON, and no job pins a runner literal. Placement is read
      from the PARSED workflow rather than grepped: publish-beta-board.yml
      contains the string `self-hosted` inside an error message, so a grep-based
      assertion flags prose as a fleet literal. 4 tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/commits/eb81dc81e05a0b1f5d8a74991d5a30f6a3727f51 --jq .sha >/dev/null;
          uv run pytest tests/ci/test_board_fleet_placement_omn18381.py::TestAc1PlacementGoesThroughTheSeam -q --no-cov -p no:cacheprovider
        cwd: "${OMNI_HOME}/omninode_infra"
    binds_ac:
      - "AC1"
  - id: "dod-omn18381-ac2-independent-of-hosted-billing"
    description: |-
      AC2 -- the board publishes without depending on hosted-runner billing.
      Asserts INDEPENDENCE, which is a property of the tree, and deliberately
      not that the fleet is up or that the budget was raised: the org Actions
      budget was still $600 with prevent_further_usage true when this was
      written. 2 tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/commits/eb81dc81e05a0b1f5d8a74991d5a30f6a3727f51 --jq .sha >/dev/null;
          uv run pytest tests/ci/test_board_fleet_placement_omn18381.py::TestAc2IndependenceFromHostedBilling -q --no-cov -p no:cacheprovider
        cwd: "${OMNI_HOME}/omninode_infra"
    binds_ac:
      - "AC2"
  - id: "dod-omn18381-ac3-hourly-cadence"
    description: |-
      AC3 -- exactly one cron, with a single-fire minute field, so the cadence
      is hourly while on the fleet. The 15-minute cadence returning is a
      separate decision and this refuses it until then. 1 test.
    source: "manual"
    status: "verified"
    checks:
