    description: |-
      AC3 proposal, left DRAFT (bind-accept-b-2a21, OMN-17427, ruling 2026-10-03T00:40:00Z). evid-B14-2a21 authored the check of item dod-b14-19623-ac3-other-registered-hooks-swept and accepted its own binding. This lane re-ran it and does not accept it: the check bound by evid-B14-2a21 pins the fixed scripts and sweeps the registered hook scripts only in omniclaude: no test in omnibase_infra or omnimarket scans the registered hooks, so a `done <<<` feed in another registered script there would leave the check green while the criterion (every other registered hook script is identified and fixed) is false. this item executes the criterion's own sweep: every shell script named in .pre-commit-config.yaml of omnibase_infra, omnimarket and omniclaude is scanned for a `done <<<` here-string feed (the falsifier's own grep), with a positive control that the pattern matches a planted `done <<<` line, and the run must scan more than twenty scripts and find none. This lane proposes the item, so it cannot accept it either; the binding carries no accepted_by until a lane that authored neither accepts it.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          re='(^|[^[:alnum:]_])done[[:space:]]*<<<'
          ctl="$(printf '%s\n' 'done <<< "$x"' | grep -cE "$re")"; test "$ctl" = 1 || { echo "positive control failed"; exit 1; }
          n=0; hits=""
          for repo in omnibase_infra omnimarket omniclaude; do
            cd "${OMNI_HOME}/$repo" || exit 1
            for f in $(grep -oE '[A-Za-z0-9_./-]+\.sh' .pre-commit-config.yaml | sort -u); do
              [ -f "$f" ] || continue
              n=$((n+1))
              h="$(grep -nE "$re" "$f" | sed "s|^|$repo/$f:|")"
              if [ -n "$h" ]; then hits="$hits$h"$'\n'; fi
            done
          done
          echo "positive control matched; registered hook scripts scanned: $n; here-string feeds found: $(printf '%s' "$hits" | grep -c .)"
          printf '%s' "$hits"
          test -z "$hits" && test "$n" -gt 20
        cwd: "${OMNI_HOME}/omnibase_infra"
