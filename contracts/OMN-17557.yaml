        check_value: |-
          hits=0; files=0; for c in node_canary_score_reducer node_hook_event_capture node_projection_context_roi node_projection_cost_summary node_projection_delegation_inference_response node_projection_dep_health node_projection_pattern_learning node_projection_routing_decision; do body="$(gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/$c/contract.yaml?ref=0fedcab33c5ea34f98027c5c65cd2fcd0cc78e52" --jq '.content' | base64 -d)"; test -n "$body" || exit 1; files=$((files+1)); n=$(printf '%s\n' "$body" | grep -cE '^[[:space:]]{0,2}runtime_profiles: \[tenant-projection\]$'); hits=$((hits+n)); done; test "$files" = "8" && test "$hits" = "8"
