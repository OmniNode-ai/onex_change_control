  - id: "dod-omn17557-ac3-profile-move"
    description: |
      AC3 -- all eight tenant-domain contracts named in this ticket carry
      `runtime_profiles: [tenant-projection]` at the merged squash of OMN-17641
      (OmniNode-ai/omnimarket#2277, 0fedcab33c5ea34f98027c5c65cd2fcd0cc78e52), so
      `filter_manifest_for_runtime_profile` drops every one of them from the `main`
      and `effects` profiles. This is the half of the resolution that removes the
      eight from the two shared runtimes whose boot failure this ticket is named for.
      The first check is the positive reading at the merged sha: it fetches all eight
      contract files, aborts on any empty body so a fetch failure cannot read as
      compliance, and asserts eight files fetched and eight occurrences of the profile
      line. The line is matched with up to two leading spaces because the declaration
      sits at the document root in six of the eight contracts and under `descriptor:`
      in the other two (node_canary_score_reducer and node_hook_event_capture); both
      placements are live and the consolidated writer wires all eight, so the check
      accepts either rather than asserting a placement the tree does not have. The second check is the discriminating control at that commit's
      PARENT (115bc775f12b8fc20ca6547e5d1fd9a14c4b700b): the same eight files are
      fetched non-empty there and the line occurs ZERO times, so the positive result
      is the merge and not a property the tree always had.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC3"
    checks:
