  - id: "dod-omn17557-ac3-store-carried-binding"
    description: |
      AC3 -- the store-carried topology binding resolves at the binding boundary at the
      merged squash of OmniNode-ai/omnibase_infra#3304
      (188f37fc327b3fb5eb54e39fccd631b06bf0261b). Two named seams carry it:
      `build_lane_infisical_handler` in
      src/omnibase_infra/runtime/auto_wiring/handler_wiring.py, which builds the
      Infisical handler from the lane's own bootstrap identity and refuses by name when
      that identity is incomplete, and `config_declares_infisical_source` in
      src/omnibase_infra/runtime/secret_resolver.py, which decides when one is required.
      Before this, `SecretResolver.from_container` treated an absent handler as graceful
      degradation and nothing ever registered one, so every store-carried logical name
      resolved to `None` behind a single warning -- which is what left the onex-dev
      `tenant_projection` binding unresolvable. This is the half of the resolution that
      lets the one process which legitimately holds the credential open the projection
      database. The first check reads both files at the merged sha and asserts both
      definitions are present, aborting on an empty body. The second check is the
      discriminating control at that commit's PARENT
      (00a821b1886f8f61df7b8baf58ba5c0ff608b505): both files are fetched non-empty and
      NEITHER definition exists, so the positive result is the merge.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC3"
    checks:
      - check_type: "command"
        check_value: |-
          hw="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=188f37fc327b3fb5eb54e39fccd631b06bf0261b" --jq '.content' | base64 -d)"; test -n "$hw" || exit 1; sr="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/secret_resolver.py?ref=188f37fc327b3fb5eb54e39fccd631b06bf0261b" --jq '.content' | base64 -d)"; test -n "$sr" || exit 1; a=$(printf '%s\n' "$hw" | grep -c 'async def build_lane_infisical_handler'); b=$(printf '%s\n' "$sr" | grep -c 'def config_declares_infisical_source'); test "$a" -ge 1 && test "$b" -ge 1
      - check_type: "command"
        check_value: |-
          hw="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=00a821b1886f8f61df7b8baf58ba5c0ff608b505" --jq '.content' | base64 -d)"; test -n "$hw" || exit 1; sr="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/secret_resolver.py?ref=00a821b1886f8f61df7b8baf58ba5c0ff608b505" --jq '.content' | base64 -d)"; test -n "$sr" || exit 1; a=$(printf '%s\n' "$hw" | grep -c 'async def build_lane_infisical_handler'); b=$(printf '%s\n' "$sr" | grep -c 'def config_declares_infisical_source'); test "$a" -eq 0 && test "$b" -eq 0
  - id: "dod-omn17557-ac3-behavior-proof"
    description: |
      AC3 -- the executed behaviour proof for the store-carried binding, bound to the
      criterion. Supersedes `dod-occ-diff-derived-behavior-proof`, which runs this exact
      command but declares no `binds_ac` and therefore covers no criterion. The command
      is unchanged so the coverage the superseded entry carried is preserved and not
      narrowed; the only difference is the binding. The suite exercises
      `build_lane_infisical_handler` at its construction seam -- tests replace that
      single seam rather than reaching a real Infisical server -- together with the
      dotted-event-name topic extraction the same PR changed.

      The check BEGINS by fetching the lane-Infisical test file from
      OmniNode-ai/omnibase_infra at the merged squash
      188f37fc327b3fb5eb54e39fccd631b06bf0261b and asserting it names
      `build_lane_infisical_handler`, then runs the suite. That prefix is not
      decoration: a bare `uv run pytest` names no repository, so the receipt-hardening
      gate (OMN-13060) cannot resolve the receipt's `commit_sha` against anything and
      refuses the receipt -- correctly, because a local suite run proves nothing about
      which tree it ran against. The prefix also makes the check stronger than the entry
      it supersedes: it asserts the suite being run is the one the merged PR added, not
      merely that a file of that name exists in whatever tree the runner happens to hold.
    source: "manual"
    status: "verified"
