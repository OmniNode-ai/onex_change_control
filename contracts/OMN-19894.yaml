    acceptance:
      - id: "AC1"
        statement: |-
          AC1: each of the five canaries takes its runner set from a repository variable and its lane endpoints from an overlay-declared ordered lane list, and runs against the first lane that answers, cheapest first -- falsifier: grep -n 'host-201' .github/workflows/chain-canary*.yml in omnibase_infra returns nothing and uv run pytest tests/ci -k canary_lane_resolution passes
      - id: "AC2"
        statement: |-
          AC2: no declared lane answering makes each canary RED with every tried lane named, never a skip -- falsifier: uv run pytest tests/ci -k canary_no_responder_is_red with a stub lane list whose lanes all refuse
      - id: "AC3"
        statement: |-
          AC3: C15 grades the lane from its bus and projections over the network rather than from one host's docker daemon -- falsifier: grep -n 'docker logs|docker.sock|host.docker.internal' .github/workflows/chain-canary.yml returns nothing and uv run pytest tests/ci -k chain_canary passes
      - id: "AC4"
        statement: |-
          AC4: each canary is proven green on two different lab hosts' runners with a lab lane each -- falsifier: gh api repos/OmniNode-ai/omnibase_infra/actions/runs/<id>/jobs --jq '.jobs[].runner_name' for two workflow_dispatch runs names runners on two hosts, both concluded success, and uv run pytest tests/ci -k canary passes
      - id: "AC5"
        statement: |-
          AC5: the ten non-board workflows listed above and the nightly-integration address literal take their host from the overlay the same way -- falsifier: grep -rn 'host-201|192.168.' .github/workflows in omnibase_infra returns nothing and uv run pytest tests/ci -q -k workflow passes
