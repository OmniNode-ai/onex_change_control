  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: retention_bytes is set to a stated byte ceiling on the dogfood broker, chosen from the disk it shares rather than from a default, and the reasoning is recorded. Falsifier: the property still reads null, or a value is set with no written basis.
      - id: "AC2"
        statement: |-
          AC2: The partition count is reduced, or per-partition allocation is bounded, such that the near-empty long tail no longer holds the majority of the volume. Falsifier: partition directories at or under 40 MiB still hold more than half the broker's bytes.
      - id: "AC3"
        statement: |-
          AC3: The producer creating 523 onex.evt.omnimarket partitions on a dogfood broker is named, and whether that is correct behaviour is decided rather than assumed. Falsifier: the count is reduced by deletion with no statement of what created them, which guarantees recurrence.
      - id: "AC4"
        statement: |-
          AC4: The .105 Docker VM disk holds above the 5 GB CI admission floor with headroom for 7 consecutive days without a manual prune. Falsifier: any manual reclamation on that host inside the window.
      - id: "AC5"
        statement: |-
          AC5: The .201 measurements are reconciled with these, and the outcome is one statement covering both hosts rather than two that each describe one. Falsifier: two tickets closed separately with no cross-reference.
      - id: "AC6"
        statement: |-
          AC6: It is decided, and written down, whether a broker must materialise the entire declared topic catalogue, or whether a lane-scoped or lazily-created subset is correct for non-production brokers. Falsifier: partition counts are reduced by deleting topics with no statement of what the catalogue is for, which guarantees they return at the next bootstrap.
      - id: "AC7"
        statement: |-
          AC7: The .201 stability-test broker at 230 GB is either measured against this same shape or explicitly named out of scope with a reason. Falsifier: .105 and .201 dev are fixed while the largest broker on the estate is never looked at.
