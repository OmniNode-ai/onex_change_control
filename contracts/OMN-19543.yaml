    acceptance:
      - id: "AC1"
        statement: |-
          AC1: each instance in config/deploy_lane_routing.yaml declares its compose overlay, project, containers, health ports, disabled phases, receipt lane and the repositories it may prove, and the executor, the receipt lane set, the release-train premise, the staging sibling read and the lane-block generator all read that data, so a fixture table naming an unknown instance dev-999 needs no Python edit -- falsifier: uv run pytest over the deploy-agent unit tests and tests/ci with a dev-999 fixture table, red on the pre-change tree
      - id: "AC2"
        statement: |-
          AC2: a route may name a pool of instances, and the chosen instance is a pure function of the command and the table at the command ref; the OMN-19506 TLA+ model is extended with the pool before the first commit -- falsifier: TLC log attached here plus uv run pytest scripts/deploy-agent/tests/unit -k pool
      - id: "AC3"
        statement: |-
          AC3: the lane manifest declares dev-200 on lab-200 with its own Postgres, Redpanda and Valkey and a port block below 49152 (the proposed 42xxx block, outside the macOS ephemeral range that the 61xxx block of dev-202 falls in), and a census on .200 reports it clean -- falsifier: scripts/lane_census_plan.py run on .200 against the live docker inventory
      - id: "AC4"
        statement: |-
          AC4: deploy-agent-dev-200 runs as a launchd LaunchAgent on a brew python3.13 venv from its own omnibase_infra clone, never the omni_home canonical tree, in consumer group onex-deploy-agent-dev-200 -- falsifier: launchctl list for the label shows a non-zero PID and its stdout log has a line newer than the check, plus rpk group describe onex-deploy-agent-dev-200
      - id: "AC5"
        statement: |-
          AC5: a verify runner reaches dev-200 and emits lab-pass-receipt-compose-dev-200 for an omnimarket merge routed there, while .201 runs another job at the same time -- falsifier: gh api artifact read of lab-pass-receipt-compose-dev-200-SHA with verdict PASS, plus overlapping accepted_at to completed_at intervals in both job stores
      - id: "AC6"
        statement: |-
          AC6: the dogfood stack, the :8130 planner and the hook-emit-drainer are unchanged by bring-up -- falsifier: docker ps container ids and StartedAt snapshot before and after, curl :8130/health, launchctl list for the drainer
