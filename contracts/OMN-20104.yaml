requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A carrier is the conjunction of open, an M4 milestone and beta-critical, and each of the four alternatives that missed is refused -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails any case in TestCarrierPredicate, which asserts the milestone alone, the label alone, a closed ticket and an M4.5 ticket are each not carriers while a qualifying sub-issue is.
      - id: "AC2"
        statement: |-
          AC2: A sub-issue with no assignee reports its parent's owner, and a ticket with nobody anywhere reads Unowned rather than a guess -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails any case in TestInheritedOwnership.
      - id: "AC3"
        statement: |-
          AC3: Estimate coverage is measured on carriers and is programme-wide, so the KPI cannot read 0 of 16 beside a table saying 50 -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails test_estimate_coverage_is_measured_on_carriers_only or test_unestimated_carriers_are_named_across_the_whole_programme.
      - id: "AC4"
        statement: |-
          AC4: The four composition buckets are mutually exclusive and sum to the Linear project's own head count, with M4.5 as its own row -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails test_the_buckets_sum_to_the_project_head_count or test_m45_is_its_own_bucket_and_not_folded_into_other_m4.
      - id: "AC5"
        statement: |-
          AC5: The window and the day count come from the project's startDate and targetDate, never from its name, and a name that disagrees is reported as drift -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails any case in TestWindow.
      - id: "AC6"
        statement: |-
          AC6: A closure that predates the window is carried, not burned, so a recut sprint does not read as delivery -- falsifier: uv run pytest tests/scripts/test_sprint_board_data.py fails test_a_closure_from_before_the_window_is_carried_not_burned.
      - id: "AC7"
        statement: |-
          AC7: The generator renders the replaced tab with no trace of the M3 version, and renders without a Linear project read so the offline regression suite still drives it -- falsifier: uv run pytest tests/scripts -k "beta_board or sprint" reports any failure, or a full render still contains the old M3 carrier table inside the sprints panel.
      - id: "AC8"
        statement: |-
          AC8: The published page carries the new tab -- falsifier: after the next publish run, read_published_board.py shows the sprints panel without the "Owners - M4 carriers" table or with a tab badge that disagrees with the programme carrier count.
