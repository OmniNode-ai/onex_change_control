requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC-1: onex delegate "say ok" is accepted on the dev lane, and the committed OMN-18278, OMN-19199 and OMN-19224 fixture replays behave correctly -- falsifier: the committed fixture test run with pytest fails, or a dev-lane onex delegate "say ok" run ends failed
      - id: "AC2"
        statement: |-
          AC-2: every failed delegation names the event that decided it, no gate refusal reads provider_error, and every delegation_events row carries a tenant UUID and a trace id -- falsifier: the daily record audit reports a gate-decided failure with cause provider_error, a null trace id, or the tenant literal omninode
      - id: "AC3"
        statement: |-
          AC-3: a planted delegation red produces a refusal that every merge actor obeys -- falsifier: the planted-red drill in which a runtime-affecting PR merges while the planted red is in force
      - id: "AC4"
        statement: |-
          AC-4: a clean install with a declared local model answers a two-word prompt, and onex doctor names each injected customer fault -- falsifier: the install canary run or the committed doctor fault suite fails
      - id: "AC5"
        statement: |-
          AC-5: no fallback rung shares a quota domain with the rung it backs up, and runtime boot refuses a served-model mismatch -- falsifier: the committed mismatch test boots, or the lab ladder lists two adjacent rungs on one provider key
      - id: "AC6"
        statement: |-
          AC-6: the per-rung nightly eval writes rows for every configured rung each night -- falsifier: a night with no rows for a configured rung
      - id: "AC7"
        statement: |-
          AC-7: a lane can run the delegated test loop from merged dev through one supported command, and a local-only run that cannot be served locally ends in a typed refusal -- falsifier: the committed confinement test run with pytest fails, or a loop run needs an unmerged branch
      - id: "AC8"
        statement: |-
          AC-8: every child is closed on its own evidence or carries a recorded ruling retiring it -- falsifier: an open child with no owner when this epic is called done
evidence_requirements:
  - kind: "ci"
    description: "PR #4215 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
