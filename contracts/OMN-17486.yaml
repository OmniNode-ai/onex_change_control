---
schema_version: "1.0.0"
ticket_id: "OMN-17486"
title: "Cross-repository receipt subject governance"
summary: "Corrected H0 carrier contract for evidence-only cross-repository receipt subjects."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: "Cross-repository subject model and bounded resolver threat tests pass."
    command: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - kind: "ci"
    description: "The online cross-repository resolver is wired into the required CI summary."
    command: "grep -q 'Cross-Repository Receipt Subject (online)' scripts/ci/ci_summary_gate.py"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-cross-repo-threat-and-fail-closed-tests"
    description: "Strict subject and resolver tests reject spoofed, stale, malformed, and unavailable
      evidence."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - id: "dod-offline-unevaluated-online-gate"
    description: "Offline validation is explicit UNEVALUATED and cannot establish online eligibility."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q -k offline"
  - id: "dod-online-workflow-and-summary-wiring"
    description: "The bounded online resolver uses read-only metadata and is required by CI Summary."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "grep -q 'cross-repo-subject-online:' .github/workflows/ci.yml && grep -q 'Cross-Repository
          Receipt Subject (online)' scripts/ci/ci_summary_gate.py"
  - id: "dod-evidence-only-no-activation"
    description: "The subject remains evidence-only and cannot grant authorization or activation."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "! grep -Eq '(^|[[:space:]])(execute_enabled|activation_enabled|authorization_granted):[[:space:]]*true([[:space:]]|$)'
          contracts/OMN-17486.yaml"
  - id: "dod-product-run-pending-receipts"
    description: "Product-run checks remain pending until the H0 carrier sequence supplies real superseding
      receipts."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "test -n \"${PRODUCT_REPOSITORY:-}\" && test -n \"${PRODUCT_PR_NUMBER:-}\""
  - id: "dod-occ-self-bind-pending"
    description: "The OCC self-binding receipt is produced only after a real carrier PR exists."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "test -n \"${OCC_CARRIER_PR_NUMBER:-}\" && gh pr view \"${OCC_CARRIER_PR_NUMBER}\"
          --repo OmniNode-ai/onex_change_control --json number,state"

# H0 is contract admission only. Product-run PASS supersessions, cross-repo
# online resolution, deployment, execution enablement, and consumer invocation
# remain separate gates and require real evidence from their owning repositories.
