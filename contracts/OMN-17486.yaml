---
schema_version: "1.0.0"
ticket_id: "OMN-17486"
title: "Cross-repository receipt subject governance"
summary: "Phase 0 OCC evidence-governance prerequisite for immutable cross-repository receipt subjects."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: "OCC subject model and resolver threat fixtures pass in hosted CI."
    command: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - kind: "ci"
    description: "The online resolver is wired into CI Summary as a required context."
    command: "grep -q 'Cross-Repository Receipt Subject (online)' scripts/ci/ci_summary_gate.py"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-cross-repo-threat-and-fail-closed-tests"
    description: "Strict subject model and bounded resolver reject spoofed, stale, malformed, and unavailable
      evidence."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - id: "dod-offline-unevaluated-online-gate"
    description: "Offline shape and digest validation reports UNEVALUATED and cannot establish online
      eligibility."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q -k 'offline or
          deadline'"
  - id: "dod-online-workflow-and-summary-wiring"
    description: "The online resolver workflow runs with read-only metadata access and is strict in CI
      Summary."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "grep -q 'cross-repo-subject-online:' .github/workflows/ci.yml && grep -q 'check_cross_repo_subject
          --online --all-receipts' .github/workflows/ci.yml && grep -q 'Cross-Repository Receipt Subject
          (online)' scripts/ci/ci_summary_gate.py"
  - id: "dod-evidence-only-no-activation"
    description: "The subject schema is strict evidence-only data and cannot represent authorization or
      activation."
    source: "manual"
    status: "pending"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q -k 'activation
          or valid_subject' && grep -q 'purpose: evidence_only' schemas/occ_cross_repo_subject_v1.schema.yaml
          && grep -q 'extra=\"forbid\"' src/onex_change_control/validation/cross_repo_subject.py"

# Phase 0 is limited to OCC's cross-repository evidence-governance prerequisite.
# Atomic claim implementation, PostgreSQL tests, deployment, and activation are
# explicitly deferred until the corresponding infrastructure subjects exist.
