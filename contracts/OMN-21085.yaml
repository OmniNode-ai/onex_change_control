      - id: "AC4"
        statement: |-
          AC4: a sprint-pinned label joins the Walker title regex in the mandatory set, so any ticket can be held in its sprint -- falsifier: uv run pytest tests/nodes/node_sprint_roll_compute -k "mandatory or pinned" proves a labelled ticket at or over the owner cap is still placed, and that removing the label defers it.
      - id: "AC5"
        statement: |-
          AC5: tickets whose workflow state type is duplicate or canceled are excluded from the candidate set -- falsifier: uv run pytest tests/nodes/node_sprint_roll_compute -k "duplicate or canceled" shows a duplicate-state fixture absent from the plan's moves and named in its refusal list.
