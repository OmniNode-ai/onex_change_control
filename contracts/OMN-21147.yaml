          AC1: every repository in the registry runs the hardcoded-model guard as a required CI context and a check-only pre-commit hook, inherited from omnibase_core -- falsifier: a repository's required contexts or .pre-commit-config.yaml on its default branch does not reference the guard
      - id: "AC2"
        statement: |-
          AC2: the guard's policy has no class that permits a model id outside a contract overlay; tests use fixture ids the test declares -- falsifier: a PR adding a real model id to any non-overlay file in any repository passes the guard
      - id: "AC3"
        statement: |-
          AC3: the guard also refuses lab and private deployment facts (private addresses, lab host names, lab ports) outside overlays -- falsifier: a PR adding a 192.168.x.x address to a non-overlay file passes the guard
      - id: "AC4"
        statement: |-
          AC4: each repository's baseline of existing findings is shrink-only and reaches zero -- falsifier: a baseline file on a default branch holds an entry, or a PR grows one
