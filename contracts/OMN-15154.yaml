      to deliver: BOTH wave-1 integration arms coexist in steel's single composition surface. At jonahgabriel/steel_onslaught
      commit 9c3adf127cca92f119b6e41d326f3d196683655d (the last of the wave-1 cluster merges), `src/steel_onslaught/match/composition.py`
