      arm returns 1, so only the both-arms-landed state satisfies the exactly-2 assertion. It reads a
      repo this PR does not write, so it is genuinely OUTSIDE ITS OWN DIFF.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/jonahgabriel/steel_onslaught/contents/src/steel_onslaught/match/composition.py?ref=9c3adf127cca92f119b6e41d326f3d196683655d' --jq '.content' | base64 -d | grep -cE '^ +(elif isinstance\(provider, ModelSODelegationProviderBinding\):|dependencies\.kafka_forwarder\.publish,)$' | grep -qx 2
