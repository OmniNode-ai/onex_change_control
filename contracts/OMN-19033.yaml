---
schema_version: "1.0.0"
ticket_id: OMN-19033
title: "fix(OMN-19033): make Validate Prod Promotion Grants reachable on every PR to main so it can be
  required"
summary: >
  `.github/workflows/validate-prod-promotion-grants.yml` lives on `main` only and was path-filtered to
  `grants/prod_promotion_grants.yaml`. GitHub creates no check run at all for a pull request that misses
  a path filter, so requiring that context would have reported it as permanently `expected` and blocked
  every pull request to `main` that does not touch the grant anchor, with no job to rerun. The workflow
  header also advertised the required-context name `validate-grants / validate-prod-promotion-grants`
  on `dev`: there is no `validate-grants` caller job in that file, the workflow is not reusable, and `dev`
  retired the workflow entirely under OMN-14441. Run 35578429786 reports exactly one job, named `validate-prod-promotion-grants`.
  This change removes the path filter, scopes the trigger to `dev` and `main`, moves the decision the
  filter used to make into a `scope` step inside the job so it runs after the check run exists, and corrects
  the advertised context name. Enforcement is unchanged for every change that touches the anchor and is
  the default whenever scope cannot be determined.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "The trigger reaches every gated pull request, the advertised context name is the one
      the job reports, and the failing path is intact under enforcement."
    command: "uv run pytest tests/test_prod_promotion_grants_required_context.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
