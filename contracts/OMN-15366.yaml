  # The three items above are emitted by the autobind effect and are all
  # INADMISSIBLE under the OMN-15309 predicate (operator ruling 3): two read back
  # the receipt tree this PR itself authors, the third reads pull-request
  # metadata. Together they BLOCK — "every check is INADMISSIBLE". The items
  # below are hand-authored so the contract certifies something falsifiable.
  #
  # Each reads a file in a DIFFERENT repository (OmniNode-ai/omninode_infra) at a
  # FIXED, already-pushed commit, via the GitHub contents API — a surface this PR
  # does not write and cannot edit. If omninode_infra#749 did not actually carry
  # the digest named, the grep exits non-zero and the check goes RED. That is the
  # "compute-only / merged-code fact" form the checker's own guidance prescribes.
  - id: "omn-15366-composition-attests-runtime-digest"
    description: >-
      The staging composition at omninode_infra#749 head d84266d2 attests the runtime digest that build
      run 30417023203 actually pushed to ECR (sha256:48673cb7), not the stale candidate-f7fb7cd digest
      it carried before. This is the whole point of ruling 11 option 1.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/readiness/staging-composition.canonical-dev.v1.yaml?ref=d84266d2168a07f59da106c3b6907fdb4601f5c1
          --jq .content | base64 -d | grep -q 'digest: sha256:48673cb7af04bc010b04eece5c5f6c8c71bbd5e004e99936fcec3508d95287b7'"
  - id: "omn-15366-one-source-rev-across-both-images"
    description: >-
      Both the composition and the migration Job at that same commit name omnibase_infra 5abb60bc, so
      the SINGLE_SOURCE_REV_BUNDLE invariant is satisfied by a real paired rebuild rather than by equalising
      strings.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omninode_infra/contents/k8s/migrations/omnibase-infra-migrate.yaml?ref=d84266d2168a07f59da106c3b6907fdb4601f5c1
          --jq .content | base64 -d | grep -q 'omnibase-infra-migrate:5abb60bcc92dc510e0471933cb864c88f78e906f@sha256:f44f4cf08d0a99128937b9182c1304ca012e5281902525d19121ed5bd55f4680'"
  - id: "omn-15366-runtime-digest-is-bound-not-attested"
    description: >-
      The kustomization that decides what the cluster pulls carries the same digest the composition attests,
      and a test now binds the two. Before this change nothing did, which is how the document drifted
      two runtime rebuilds out of date with nothing red.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/runtime/kustomization.yaml?ref=d84266d2168a07f59da106c3b6907fdb4601f5c1
          --jq .content | base64 -d | grep -q 'digest: sha256:48673cb7af04bc010b04eece5c5f6c8c71bbd5e004e99936fcec3508d95287b7'"
  - id: "omn-15366-binding-test-exists-in-product-repo"
    description: >-
      The binding itself exists as a test in the product repo, so this repair cannot silently regress:
      a future digest bump that touches only one of the two files fails CI instead of drifting quietly
      the way sha256:a270c8fb did.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omninode_infra/contents/tests/k8s/test_staging_composition_contract.py?ref=d84266d2168a07f59da106c3b6907fdb4601f5c1
          --jq .content | base64 -d | grep -q 'def test_runtime_image_digest_matches_the_pinned_kustomization'"
