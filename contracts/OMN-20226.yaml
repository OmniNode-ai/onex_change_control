    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          deploy_probe=1; body=$(gh api 'repos/OmniNode-ai/omnidash/contents/src/pages/local/overview.contracts.yaml?ref=5003eb1bbc31c46cfa393f35c106614559266f44' --jq '.content' | base64 -d) && grep -qF '"compression_ratio"' <<< "$body" && grep -cF '"cache_hit_rate"' <<< "$body"
  - id: "dod-deploy-probe-omnibase-infra-pr-4657"
    description: "Deploy probe: the exact omnibase_infra#4657 head vendors migration 0003 with both columns;
      at dev d1797668b2 the file is absent and the probe exits non-zero."
    source: "manual"
    checks:
