---
schema_version: "1.0.0"
ticket_id: "OMN-20226"
title: "Overview shows compression and cache hit rate from measured exposures and a typed not-measured
  state until they exist"
summary: "Hand-authored OCC evidence companion (OMN-15247) for OMN-20226; occ-autobind found no RED-derivable
  candidate in omnidash#368."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Compression and cache hit rate each read from a served exposure and not from a browser computation -- falsifier: the page contract vitest finding either figure whose data is not a served exposure
      - id: "AC2"
        statement: |-
          AC2: A figure with no measurement behind it renders its typed not-measured state, never 0 and never a blank -- falsifier: a fresh store showing 0 or a blank for either figure
      - id: "AC3"
        statement: |-
          AC3: Compression equals raw input tokens over compressed input tokens for the same window as the headline -- falsifier: the two disagree in the lab readback for one window
      - id: "AC4"
        statement: |-
          AC4: Cache hit rate equals calls answered from the semantic cache over total calls for the window -- falsifier: the two disagree in the lab readback for one window
evidence_requirements:
  - kind: "tests"
    description: |-
      Behavior proof for PR #368 on OmniNode-ai/omnidash: the Overview page test and the page contract test it adds, executed at cwd `${OMNI_HOME}/omnidash`.
    command: "npm test -- --run src/pages/LocalDashboardPage.omn20226.test.tsx src/pages/local/omn20226.contracts.test.ts"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnidash-pr-368"
    description: >-
      PR #368 on OmniNode-ai/omnidash, hand-authored companion (OMN-15247); occ-autobind mints none for
      a TypeScript-only omnidash change. #368 adds the Compression and Cache hit rate cards to the Overview,
      each bound to a field of the served metering-summary.v1 exposure in the page contract, and each
      rendering a typed Not measured when the served field is null, never 0 or a blank. The check runs
      the page test and the page contract test that decide it: 16 passed at the PR head 5003eb1bbc; the
      same two files on dev a6ae9c07dcb6 failed 16 of 16, so the check can go red. It binds AC1 (each
      figure reads a served exposure, no browser computation) and AC2 (typed not-measured, never 0 or
      blank).
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "npm test -- --run src/pages/LocalDashboardPage.omn20226.test.tsx src/pages/local/omn20226.contracts.test.ts"
        cwd: "${OMNI_HOME}/omnidash"
    binds_ac:
      - "AC1"
      - "AC2"
    ac_bindings:
      - label: "AC1"
        criterion_hash: "02631234e9b97ca3626d3b1e63d652fad29a0d7ab3b811eb09753caddc937645"
      - label: "AC2"
        criterion_hash: "e60174bae4499c4a9a5b74a9381ce9c598e6f69f703697d0fd4ef47c7cd45118"
  - id: "dod-OmniNode-ai-omnibase_infra-pr-4657"
    description: >-
      PR #4657 on OmniNode-ai/omnibase_infra, hand-authored companion (OMN-15247). #4657 vendors omnimarket's
      node_projection_metering_summary migration 0003 (compression_ratio, cache_hit_rate, runs_cache_answered,
      all nullable with no default) byte-identical, with its ledger row and migration class, so the lane
      runners can apply it. The check runs the vendor test that decides it: 4 passed at the PR head dea192aafd28;
      at dev d1797668b2 the file it reads does not exist, so the check can go red. Supporting evidence
      for the served columns; it binds no criterion.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/migrations/test_omn20226_metering_compression_cache_hit_vendor.py
