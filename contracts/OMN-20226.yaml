title: "Overview shows compression and cache hit rate from measured exposures and a typed not-measured
  state until they exist"
summary: "Hand-authored OCC evidence companion (OMN-15247) for OMN-20226; occ-autobind found no RED-derivable
  candidate in omnidash#368."
is_seam_ticket: false
interface_change: false
