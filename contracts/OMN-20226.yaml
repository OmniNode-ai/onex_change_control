requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Compression and cache hit rate each read from a served exposure and not from a browser computation -- falsifier: the page contract vitest finding either figure whose data is not a served exposure
      - id: "AC2"
        statement: |-
          AC2: A figure with no measurement behind it renders its typed not-measured state, never 0 and never a blank -- falsifier: a fresh store showing 0 or a blank for either figure
      - id: "AC3"
        statement: |-
          AC3: Compression equals raw input tokens over compressed input tokens for the same window as the headline -- falsifier: the two disagree in the lab readback for one window
      - id: "AC4"
        statement: |-
          AC4: Cache hit rate equals calls answered from the semantic cache over total calls for the window -- falsifier: the two disagree in the lab readback for one window
evidence_requirements:
  - kind: "tests"
    description: |-
      Behavior proof for PR #368 on OmniNode-ai/omnidash: the Overview page test and the page contract test it adds, executed at cwd `${OMNI_HOME}/omnidash`.
    command: "npm test -- --run src/pages/LocalDashboardPage.omn20226.test.tsx src/pages/local/omn20226.contracts.test.ts"
  - kind: "tests"
    description: |-
      Behavior proof for PR #3508 on OmniNode-ai/omnimarket: the compression and cache-hit test it adds, the metering-summary node tests and the served-row render test, executed at cwd `${OMNI_HOME}/omnimarket`. None of them start a database.
    command: "uv run pytest tests/nodes/node_projection_metering_summary/test_omn20226_compression_and_cache_hit.py
      tests/nodes/node_projection_metering_summary/test_projection.py tests/nodes/node_projection_metering_summary/test_golden_chain_projection_metering_summary.py
      tests/nodes/node_projection_metering_summary/test_omn20007_day_rows_sum_to_all_window.py tests/test_omn19977_metering_renders_the_row.py
      -q -p no:randomly"
