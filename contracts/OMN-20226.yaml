          deploy_probe=1; body=$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_metering_summary/0003_metering_summary_compression_and_cache_hit.sql?ref=dea192aafd28deba04b17aede915839668d62ed7' --jq '.content' | base64 -d) && grep -qF 'compression_ratio' <<< "$body" && grep -cF 'cache_hit_rate' <<< "$body"
