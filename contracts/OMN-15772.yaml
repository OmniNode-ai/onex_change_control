ticket_id: "OMN-15772"
title: "migration-inventory clone failures fail closed instead of silently shrinking the checked repo
  set"
summary: >-
  onex_change_control PR #6635 repairs the Migration Inventory Sync workflow so peer repository clone
  failures cannot be silently swallowed. The migration-inventory clone helper now matches the already-proven
  migration-conflicts pattern: remove each target before cloning, retry, emit an explicit ::error:: after
  three failed attempts, return non-zero, and call the helper without `|| true`. The workflow also removes
  /tmp/repos before use so a persistent self-hosted runner cannot validate stale sibling checkouts from
  an earlier job.
