---
schema_version: 1.0.0
ticket_id: OMN-17426
title: Autobind OCC evidence for OMN-17426
summary: 'OCC Evidence-Source autobind companion for OMN-17426, carrying the union of the entries minted
  for OmniNode-ai/omnimarket PR #2495, PR #2496 and OmniNode-ai/omnibase_infra PR #3459. Three companions
  for the SAME ticket each write contracts/OMN-17426.yaml, so each collides with whichever landed first;
  unioning the dod_evidence sets preserves every check each producer minted.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: ci
    description: 'PR #2495 product diff scope present'
    command: gh pr view ${PR_NUMBER} --repo ${REPO} --json files
  - kind: tests
    description: 'Behavior proof for PR #2495 on OmniNode-ai/omnimarket, derived from the PR''s own diff:
      the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`,
      executed at cwd `${OMNI_HOME}/omnimarket`.'
    command: uv run pytest tests/test_delegation_savings_projection_view_omn15533.py tests/test_omn14533_cross_boundary_savings_seam.py
      tests/test_omn17426_savings_aggregate_views_per_tenant.py tests/test_omn17426_savings_aggregates_bus_backed.py
      -q
  - kind: ci
    description: 'PR #2496 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
  - kind: tests
    description: 'OWED, not claimed. PR #2496 on OmniNode-ai/omnimarket changes no pytest target, so this
      producer cannot derive a behavior-class check from its diff and mints none - the changed surface
      (scripts/application-relation-ownership.yaml) is unproven by this contract. A behavior proof must
      be hand-authored as a `source: manual` dod_evidence item before OMN-15911''s flip conjunct can be
      satisfied. Recorded here rather than papered over with a ticket-independent suite that would read
      as proof (OMN-16434).'
    command: uv run pytest <hand-authored target> -q
  - kind: ci
    description: 'PR #3459 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
  - kind: tests
    description: 'Behavior proof for PR #3459 on OmniNode-ai/omnibase_infra, derived from the PR''s own
      diff: the manifest validator target it changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof-infra-3459`,
      executed at cwd `${OMNI_HOME}/omnibase_infra`.'
    command: uv run pytest tests/unit/scripts/validation/test_application_migration_manifest.py -q
emergency_bypass:
