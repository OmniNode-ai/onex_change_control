    acceptance:
      - id: "AC1"
        statement: |-
          AC1: With the setting unset, a submit is refused backend_disabled and the injected transport records zero requests -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k disabled -q
      - id: "AC2"
        statement: |-
          AC2: An unknown setting value is refused backend_misconfigured with zero requests -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k misconfigured -q
      - id: "AC3"
        statement: |-
          AC3: A missing repository, ../x, x/.., a/b/c, a content_mode other than meta or full, and full without both texts are each refused input_invalid with zero requests -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k input_invalid -q (one case per input)
      - id: "AC4"
        statement: |-
          AC4: A GitHub 404 and a 200 with private: true are refused repository_not_public, a 403 with X-RateLimit-Remaining: 0 fails guard_rate_limited, and a timeout fails guard_unresolved, each with zero evaluator calls -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_public_repository_guard.py -q
      - id: "AC5"
        statement: |-
          AC5: The idempotency key is onex-eval-meta-<correlation_id> or onex-eval-full-<correlation_id>, and the same command twice yields one receipt id with duplicate false then true -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k idempotency -q
      - id: "AC6"
        statement: |-
          AC6: Under in_memory both modes are accepted; the mode permission table for dharma_metadata and dharma_full refuses full under dharma_metadata as content_mode_not_permitted -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k content_mode -q
      - id: "AC7"
        statement: |-
          AC7: 60 submits in one fake-clock minute reach the evaluator at most 30 times in that minute and all 60 end in an outcome, in-flight submissions never exceed 4, and status reads never exceed 20 in a minute -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_pacer.py -q
      - id: "AC8"
        statement: |-
          AC8: The 21st full-text command in one UTC day is refused credit_reservation_exhausted with zero requests while a metadata command in the same state is submitted -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_pacer.py -k reservation -q
      - id: "AC9"
        statement: |-
          AC9: An evaluator that turns terminal on the third read yields Accepted with verdict_state: completed, and one that never does yields Accepted with verdict_state: pending after at most 13 reads -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k bounded_poll -q
      - id: "AC10"
        statement: |-
          AC10: A poll command whose receipt id is ../x or a?b is refused input_invalid with zero requests, and two polls of one terminal receipt produce byte-identical Status outcomes -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k poll -q
      - id: "AC11"
        statement: |-
          AC11: The handler is definition-B: handle is an async def taking the command union and returning the outcome union, and the node's modules import no ModelEventEnvelope and return no ModelHandlerOutput -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_shape.py -q (inspect plus an AST scan)
      - id: "AC12"
        statement: |-
          AC12: Each outcome class lands only on its own topic through an in-memory bus -- falsifier: uv run pytest tests/test_golden_chain_trajectory_evaluation_effect.py -q
      - id: "AC13"
        statement: |-
          AC13: The node passes omnimarket's node-drift gate with its entry point -- falsifier: uv run python scripts/validate_node_drift.py --check-all --check-orphan-nodes --strict
      - id: "AC14"
        statement: |-
          AC14: The node names no vendor -- falsifier: grep -ri dharma src/omnimarket/nodes/node_trajectory_evaluation_effect prints nothing
      - id: "AC15"
        statement: |-
          AC15: Constructing the handler with no arguments and no environment raises nothing and makes no network call -- falsifier: uv run pytest tests/unit/nodes/node_trajectory_evaluation_effect/test_handler_trajectory_evaluation.py -k construct_bare -q
