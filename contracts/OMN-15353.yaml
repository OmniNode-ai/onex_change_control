    description: "PR #760 CI checks green on OmniNode-ai/omninode_infra"
    command: "gh pr checks 760 --repo OmniNode-ai/omninode_infra"
  - kind: "manual"
    description: >
      The dashboard probe passes against the live healthy dev shape and fails against every way that shape
      can break, proven by execution rather than by inspection.
    command: "uv run pytest tests/scripts/test_post_deploy_verify_dashboard_auth_probe.py -q"
