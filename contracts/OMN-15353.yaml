schema_version: "1.0.0"
ticket_id: "OMN-15353"
title: "Assert the dashboard auth shape in post-deploy verify instead of anonymous HTTP 200"
summary: >
  OCC evidence companion for OmniNode-ai/omninode_infra PR #760. The post-deploy verification gate probed
  https://dev.dash.omninode.ai with a headerless curl and asserted HTTP 200, but omnidash#277 ("document-only
  Keycloak protect") is live on onex-dev and answers a non-document request with 401 by design, so the
  gate reported FAIL on healthy state on every onex-dev deploy and skipped the terminal business-proof
  step behind it. PR #760 replaces the single status assertion with a per-environment DASH_AUTH_MODE contract:
  dev pins three legs (unauthenticated /api/runtime-config 200 with the expected JSON shape, a document-navigation
  302 whose Location is this environment's Keycloak with client_id=omnidash, and a non-document 401),
  prod keeps the public 200 + body-marker probe, and an unrecognised mode fails the gate closed. No status
  class is blanket-accepted and no leg can be skipped.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
