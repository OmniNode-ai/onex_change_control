      re-read it; the check below reads the lane TERMINAL row (ledger line 25003 of the 2026-10-02T11:10:39Z
      snapshot) that recorded the readback. AC5 AS AMENDED BY RULING 2026-09-30T23:01:09Z (lane glm-out-of-beta,
      operator, "OK well let's leave GLM out of the beta just stop working on GLM move it out of the sprint
      not a problem the dead delegation demon again that's not priority just moving out of the sprint"):
      customer GLM BYOK is out of the beta and out of sprint P-OMN-28, Gemini and OpenRouter BYOK stay
      in the beta. The GLM coding-plan delegation named in the AC5 line is therefore not claimed here;
      this item claims the Gemini half only. The AC5 line itself is not edited, because its criterion
      hash is pinned. The binding below is a draft: it carries no accepted_by.
