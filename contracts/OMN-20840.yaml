---
schema_version: "1.0.0"
ticket_id: "OMN-20840"
title: "The merge-throughput tick reads a parked floor, an unread lab host, a failed lane dispatch and
  a rising open count as quiet notes"
summary: "Hand-authored OCC companion for OmniNode-ai/omnimarket#3674 (AC1 to AC4, the throughput tick
  decision node) and OmniNode-ai/omniclaude-internal#512 (AC5, the detached remote-lane dispatch). Each
  of the ticket's five acceptance criteria is bound to its own falsifier: the pytest the ticket names,
  run at the merged commit and at that commit's parent."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-ac1-parked-floor"
    statement: |-
      AC1: a floor line whose repository has PRs waiting, zero merges in the window and a park ending more than N hours (default 2) from now is MISSING, naming the park end and the manual-unblock fix -- falsifier: pytest of the tick node and the tick suite with a parked-floor fixture
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a floor line whose repository has PRs waiting, zero merges in the window and a park ending more than N hours (default 2) from now is MISSING, naming the park end and the manual-unblock fix -- falsifier: pytest of the tick node and the tick suite with a parked-floor fixture
  - id: "req-ac2-unread-host"
    statement: |-
      AC2: a lab host with no recent placement reading is UNKNOWN with a fix naming the read that refreshes it, never a NOTE -- falsifier: pytest of the tick node and the tick suite with a host and no receipt reading
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: a lab host with no recent placement reading is UNKNOWN with a fix naming the read that refreshes it, never a NOTE -- falsifier: pytest of the tick node and the tick suite with a host and no receipt reading
  - id: "req-ac3-lane-receipt"
    statement: |-
      AC3: a remote-lane receipt dispatched in the last 3 hours with status no-host, host-limited, guard-memory-max, guard-runtime-max or failed is MISSING with the lane and the reason until a later receipt of the same brief is running or done -- falsifier: pytest of the tick suite with failed and superseded receipt fixtures
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: a remote-lane receipt dispatched in the last 3 hours with status no-host, host-limited, guard-memory-max, guard-runtime-max or failed is MISSING with the lane and the reason until a later receipt of the same brief is running or done -- falsifier: pytest of the tick suite with failed and superseded receipt fixtures
  - id: "req-ac4-open-trend"
    statement: |-
      AC4: an open count up by more than 10 percent across the last three tick runs is MISSING -- falsifier: pytest of the tick suite with a three-run open history fixture
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: an open count up by more than 10 percent across the last three tick runs is MISSING -- falsifier: pytest of the tick suite with a three-run open history fixture
  - id: "req-ac5-detached-dispatch"
    statement: |-
      AC5: a detached remote-lane dispatch waits up to 90 seconds for the receipt to leave placing and prints the placement as its last line, exiting non-zero on no-host -- falsifier: pytest of the remote-lane suite for a placed and a no-host receipt
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: a detached remote-lane dispatch waits up to 90 seconds for the receipt to leave placing and prints the placement as its last line, exiting non-zero on no-host -- falsifier: pytest of the remote-lane suite for a placed and a no-host receipt
evidence_requirements:
  - kind: "tests"
    description: "Blindspot tests for the throughput tick decision compute node."
    command: "uv run pytest tests/nodes/node_throughput_tick_decision_compute -q -p no:randomly"
emergency_bypass:
