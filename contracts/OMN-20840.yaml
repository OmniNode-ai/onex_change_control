    description: >-
      OmniNode-ai/omnimarket#3674, hand-authored (OMN-20840). AC1: the tick node's parked-floor tests:
      a long park over a repository with PRs waiting and zero merges is MISSING with the park end and
      the unblock fix, a short park, a landing repository or a live lease stays a NOTE. The check downloads
      omnimarket at the merged commit 26e076cf8dca897aedcbc6a904e76d9c7c7a7a29 and runs the pytest there:
      exit 0. The same check at the merged commit's parent b270b04bce8491b51fe9f0dfe7fb64dacd1fbf2a, before
      the change, exits non-zero because the tests are not in that tree.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: |-
          set -o pipefail; d="$(mktemp -d)"; trap 'rm -rf "$d"' EXIT
          gh api repos/OmniNode-ai/omnimarket/tarball/26e076cf8dca897aedcbc6a904e76d9c7c7a7a29 | tar -xz -C "$d" --strip-components=1
          cd "$d" && env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_throughput_tick_decision_compute/test_blindspots_throughput_tick_decision_compute.py -q -p no:randomly -k "park or lease"
    binds_ac: ["AC1"]
