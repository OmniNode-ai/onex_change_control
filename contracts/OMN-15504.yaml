  - id: "ac6-lane-recovered-live-omn15504"
    description: >-
      AC6 binding. The criterion is about a RUNNING system, so this check reads the live .201 dev lane
      read-only rather than asserting anything about code. It proves four conjuncts and carries its own
      positive controls, so a broken probe FAILS instead of returning a zero that reads as health: the
      live 1.2.0 consumer group is Stable with a member; its committed offset equals the log end with
      lag 0 on TWO reads 90s apart (the criterion's falsifier is a STATIC lag, so one snapshot is not
      enough); the retired 1.1.0 group's committed offset advanced past the frozen 317 in the finding;
      and UnknownMemberIdError is absent from the consumer log while a positive control on the SAME log
      stream matches, so the zero is an absence of the error rather than an absence of log. SASL credentials
      are taken from the runtime container's own environment and passed by name, never on argv. Version
      note, measured not assumed: the group id in the original finding carries the contract version 1.1.0,
      which the node has since left behind for 1.2.0; the 1.1.0 group is now an orphan whose lag is an
      artifact of the version bump, not a backlog, and reading it as the live group is how this recovery
      gets misreported as a regression.
    source: "manual"
    status: "verified"
    binds_ac: ["AC6"]
    ac_bindings:
      - label: "AC6"
        criterion_hash: "042e22a6fca9bfd0f8cecce80d50b55fd13fad99efb5f5e98ee92d85e7585b2d"
        accepted_by: "claude:opus5:subagent lane=omn15504-ingress-backpressure-build-0923"
        accepted_at: "2026-09-17T09:42:06Z"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 'bash -s' <<'PROBE'
          set -euo pipefail
          TOPIC='onex.cmd.omnimarket.delegate-skill.v1'
          LIVE="local.omnimarket.node_delegate_skill_orchestrator.consume.1.2.0.__i.runtime-effects.__t.${TOPIC}"
          RETIRED="local.omnimarket.node_delegate_skill_orchestrator.consume.1.1.0.__i.runtime-effects.__t.${TOPIC}"
          RPK_USER=$(docker exec omninode-runtime-effects printenv KAFKA_SASL_USERNAME </dev/null)
          RPK_PASS=$(docker exec omninode-runtime-effects printenv KAFKA_SASL_PASSWORD </dev/null)
          RPK_SASL_MECHANISM=$(docker exec omninode-runtime-effects printenv KAFKA_SASL_MECHANISM </dev/null)
          export RPK_USER RPK_PASS RPK_SASL_MECHANISM
          rpkx(){ docker exec -e RPK_USER -e RPK_PASS -e RPK_SASL_MECHANISM omnibase-infra-redpanda rpk "$@" </dev/null; }
          # Every grep here uses -c with stdout discarded, never -q: -q closes the pipe
          # early, rpk takes SIGPIPE, and under `pipefail` that is exit 141 -- a false
          # RED that looks exactly like a finding. Measured on this very check.
          has(){ grep -cE "$1" >/dev/null; }
          drained(){ awk -v t="$TOPIC" '$1==t{seen=1;ok=($3==$5 && $6==0)} END{exit !(seen&&ok)}'; }
          test "$(rpkx topic list | grep -c .)" -gt 100
          D=$(rpkx group describe "$LIVE")
          printf '%s\n' "$D" | has '^STATE +Stable'
          printf '%s\n' "$D" | has '^MEMBERS +[1-9]'
          printf '%s\n' "$D" | drained
          sleep 90
          D=$(rpkx group describe "$LIVE")
          printf '%s\n' "$D" | drained
          rpkx group describe "$RETIRED" | awk -v t="$TOPIC" '$1==t{seen=1;ok=($3>317)} END{exit !(seen&&ok)}'
          L=$(docker logs omninode-runtime-effects </dev/null 2>&1)
          printf '%s\n' "$L" | has 'Joined group|OffsetCommit|delegate-skill'
          if printf '%s\n' "$L" | grep -c 'UnknownMemberIdError' >/dev/null; then
            echo "AC6 FAIL: UnknownMemberIdError present after the rebuild" >&2; exit 1
          fi
          echo "AC6 PASS"
          PROBE
