  - id: "dod-omn15488-d1-genesis-knob-phase-caps"
    description: >-
      Deliverable 1 — the `--genesis` CLI knob exists on `scripts/run_lgate2_adaptation_battery.py` with
      the ticket's required default of 1.0 (preserving prior behavior), AND the evaluator caps it feeds
      are genuinely derived from it. Four legs at the executing SHA a3b0d8aa: the argparse flag `"--genesis",`
