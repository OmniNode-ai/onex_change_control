      the jq program .state + " " + (.mergeCommit.oid // "none") inside a double-quoted command substitution,
      so the jq program's inner double quotes closed the outer one and the guard landed on the fragment
      " + (.mergeCommit.oid // none)')" as the command name; that fragment contains a slash, so the guard
      took its relative-script-path branch, found no executable, and returned INVALID_CHECK_VALUE_NOT_A_COMMAND
      without ever running the command. That was a FALSE RED against a command that exits 0 in a real
      shell — the binding fact never changed — but it is a hard FAIL on the verdict, and it made dod_verify
      return status=failed (12 verified / 3 failed / 15 total) for this ticket. This replacement splits
      the single two-field query into two single-field queries so each --jq filter is a bare path expression
      carrying no quote characters, leaving `test` as the first shlex token. Semantics are preserved exactly:
      BOTH the state MERGED AND the exact merge SHA ff5df34fdb374ddcffb9d14576a16b49ebf1c87e are asserted,
      so closed-unmerged, still-open, and re-landed-elsewhere each still yield a mismatch. The PR number
      and --repo stay in the SAME shell clause so the collector's same-clause _hardcoded_pr_bindings_in_value
      extraction resolves (jonahgabriel/steel_onslaught, 235) instead of falling back to _DEFAULT_GITHUB_ORG
      (OmniNode-ai), which resolves nothing for this personal repo. Shape mirrors the merged dod-omn15490-pr-237-merged-at-e3dbd017-guardcompat
      / dod-omn15535-pr-239-merged-at-4bae73ea-guardcompat precedent (OCC #5760), which was executed by
      the runner and returned verified.
