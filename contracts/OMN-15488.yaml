      cap at 3.0, which made promotion impossible for any `genesis + step > 3.0` pair, so a knob that
      did not also generalize the promote cap would be a cosmetic flag. Honest scope note: no whole-file
      absence assertion for the literal `max_value=3.0` is made here, because that literal legitimately
      survives at two sites in prose documenting the very defect that was fixed (a docstring and the flag's
      own help text); the executed call site is asserted positively via `max_value=promote_cap,` instead,
      which is the real discriminator.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          f="$(mktemp)" && gh api 'repos/jonahgabriel/steel_onslaught/contents/scripts/run_lgate2_adaptation_battery.py?ref=a3b0d8aa7f7392942f6d78c47bf7f98247c63d09' --jq .content | base64 -d > "$f" && grep -qF '        "--genesis",' "$f" && grep -qF '        default=_GENESIS["aggression"],' "$f" && grep -qF '_GENESIS = {"aggression": 1.0}' "$f" && grep -qF '    baseline_cap = args.genesis' "$f" && grep -qF '    post_cap = args.genesis + args.step' "$f" && grep -qF '    promote_cap = post_cap' "$f" && grep -qF 'max_value=promote_cap,' "$f" && grep -qF 'max_value=baseline_cap,' "$f" && grep -qF 'max_value=post_cap,' "$f" && rm -f "$f"
