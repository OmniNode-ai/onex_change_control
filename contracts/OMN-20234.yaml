requirements:
  - id: "req-fleet-migration"
    statement: >-
      Migrate every supported consumer contract and adapter from legacy handler_routing.handlers[] keys
      (routing_key, handler_key, priority, output_events, callable, lazy_import) to the canonical typed
      ModelHandlerRoutingEntry shape; retire the expired Core extra='ignore' waiver only after compatibility
      tests prove the migration.
    acceptance:
      - id: "AC1"
        statement: >-
          Fleet search with positive control finds no active legacy-shape handler-routing entries in registered
          consumer repos; canonical parsing and dispatch tests cover each migrated consumer; the Core
          extra-forbid ratchet passes with no waiver for this model -- falsifier: a registered consumer
          still requires a legacy key or ignores an extra routing field, a migrated route changes, or
          Core still has an active waiver for ModelHandlerRoutingEntry.
      - id: "AC2"
        statement: >-
          The exact OmniMemory source slice in PR #555 uses canonical handler-routing entries without
          changing the resolved route map -- falsifier: the focused wiring/contract selectors miss any
          test or an existing route disappears or changes owner.
      - id: "AC3"
        statement: >-
          The exact Infra source slice removes the 36 ignored output_events values from its 15 active
          node contracts without changing the resolved route map -- falsifier: a migrated contract fails
          strict parsing or any of the 42 Infra routes changes.
