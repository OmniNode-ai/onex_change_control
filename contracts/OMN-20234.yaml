  to the canonical typed ModelHandlerRoutingEntry shape, preserve routing behavior, then retire the expired
  Core extra='ignore' waiver. Memory and Infra source slices have separate evidence below. A passing slice
  does not complete this fleet-wide ticket or assert that the Core waiver has been retired.
