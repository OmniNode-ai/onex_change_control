  - id: "occ6077-receipt-attribution-fix"
    description: >-
      Append-only correction of a receipt-honesty defect in PR #6077 (merged 2026-08-04T20:16:32Z, merge
      commit 6b6a55bd702ed1d8f5e04b630ef402ea7257243d), found by adversarial review after that PR had
      already merged. All six `drift/dod_receipts/` files landed by #6077 -- including `occ-self-bind-pr-5855-superseded`,
      `dod-15374-apply-role-unchanged-superseded`, and `occ-self-bind-pr-6077` in this ticket, plus `occ-self-bind-pr-5745-superseded`,
      `dod-infra769-no-live-mutation-claim-superseded`, and `occ-self-bind-pr-6077` in OMN-15136 -- carry
      `runner: "claude-code-agent:occ-stale-refresh-0804"` and `verifier: "claude-code-agent:opus-refresh-checker-0804"`
      with `run_timestamp` values of 2026-08-04T19:42:06Z and 2026-08-04T19:49:34Z. The named verifier
      identity did not independently execute until roughly 2026-08-04T20:16Z (the moment #6077 itself
      merged), which is AFTER every one of those claimed run_timestamps -- the attestation predates the
      verification it claims to record, and no artifact in the PR evidences the verifier's independent
      execution separately from the runner's. This is the same receipt-gaming class as OMN-15689: a PASS
      status minted before, not after, the verifying party actually ran. The underlying check_value commands
      and the live-GitHub facts they assert (PR #5855 and #5745 merged states, PR #6077's existence, the
      field-name fix, the infra#769 mutation record) are independently re-verified as still true by this
      entry and are NOT in question -- only the six receipts' runner/verifier attribution and timing were
      dishonest. Because #6077 had already merged into dev by the time this defect was confirmed, the
      original receipts cannot be edited in place (append-only discipline); this entry and its OMN-15136
      counterpart supersede the ATTRIBUTION of all six receipts without altering their check_value history,
      and bind fresh receipts under `drift/dod_receipts/OMN-15374/occ6077-receipt-attribution-fix/command.yaml`
      with a truthful runner (the agent that actually re-ran the pivotal probes below) and a verifier
      identity ("verify:evening-followups-opus") that had NOT yet run at the time this entry was authored
      -- that verifier's own independent re-execution and attestation is a separate follow-on event, not
      claimed here in advance.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:occ-self-bind-pr-5855-superseded,dod-15374-apply-role-unchanged-superseded,occ-self-bind-pr-6077"
