---
schema_version: "1.0.0"
ticket_id: "OMN-15374"
title: "Read-only plan-only IAM role for PR-triggered Terraform plans"
summary: >
  Automated baseline evidence for OmniNode-ai/omninode_infra PR #784 was authored by node_occ_companion_compute
  (OMN-14285) in PR #5776 (merged 2026-07-31T23:26:33Z) -- the first three dod_evidence items below are
  that generated contract, preserved verbatim per the OMN-13888 append-only rule. This companion (PR #5855,
  replacing fork PR #5819 after #5776 had already merged) appends the substantive manual evidence: per
  operator ruling 26, PR #784 creates a separate, read-only, plan-only IAM role (omninode-github-actions-plan-role)
  trusted only for omninode_infra's pull_request OIDC subject, and repoints terraform-plan.yml's PR-triggered
  plan job at it via a new repo variable (AWS_TERRAFORM_PLAN_ROLE_NAME) without touching the existing
  AWS_DEPLOY_ROLE_NAME or widening the apply-capable omninode-github-actions-role's trust policy -- ruling
  24, which proposed that widening, was issued and explicitly withdrawn, unexecuted, the same day. This
  evidence binds the live IAM role state, the unchanged apply-capable role, the repo variables, and the
  exact PR #784 head content at commit a226d1e2b585c2474722b5424b741b2c7d414f00. PR #784 merged 2026-07-31T23:28:56Z
  (confirmed live); this companion was authored and PASS-verified before that merge and re-verified after.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #784 CI checks (verify gate expects an OCC companion via Evidence-Source; PR #784
      has merged)"
    command: "gh pr checks 784 --repo OmniNode-ai/omninode_infra"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  # --- Preserved verbatim from PR #5776 (node_occ_companion_compute, OMN-14285). Do not edit --
  # OMN-13888 append-only forbids modifying an existing dod_evidence item; a correction would need a
  # net-new .supersede.<NNNN>.yaml, not an edit here. ---
  - id: "dod-OmniNode-ai-omninode_infra-pr-784"
    description: "PR #784 on OmniNode-ai/omninode_infra — Evidence-Source autobind."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 784 --repo OmniNode-ai/omninode_infra --json number,state"
      - check_type: "command"
        check_value: "gh pr view 784 --repo OmniNode-ai/omninode_infra --json files"
  - id: "dod-occ-evidence-admissibility-validator"
    description: "Hosted OCC evidence admissibility validator (OMN-15247)."
    source: "generated"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omninode_infra-pr-784"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_evidence_admissibility.py -q"
  - id: "occ-self-bind-pr-5776"
    description: "Binds OMN-15374 to OCC companion PR #5776 (self-bind)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5776 --repo OmniNode-ai/onex_change_control --json number,state"
  # --- Appended by this companion (PR #5819) ---
  - id: "dod-15374-plan-role-trust-policy"
    description: >-
      Binds the live trust policy of omninode-github-actions-plan-role: OIDC federated principal, StringEquals
      on aud=sts.amazonaws.com and sub=repo:OmniNode-ai/omninode_infra:pull_request only, no wildcard.
      Captured by direct aws iam get-role readback with an operator's own AWS credentials; hosted OCC
      compliance has no AWS access, so this binds the immutable PASS receipt rather than re-probing AWS.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          receipt="drift/dod_receipts/OMN-15374/dod-15374-plan-role-trust-policy/command.yaml" && grep
          -q '^status: PASS$' "$receipt" && grep -q 'GitHubActionsOIDCPlanOnlyPullRequest' "$receipt"
          && grep -q 'repo:OmniNode-ai/omninode_infra:pull_request' "$receipt" && grep -q 'plan-role trust
          policy binding PASS' "$receipt"
  - id: "dod-15374-plan-role-permissions"
    description: >-
      Binds that omninode-github-actions-plan-role carries exactly the AWS managed ReadOnlyAccess policy
      and one inline policy (TerraformStateBackendAccess) -- no other attached or inline policy, and no
      mutating action anywhere. Captured by direct aws iam list-attached-role-policies and list-role-policies
      readback.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          receipt="drift/dod_receipts/OMN-15374/dod-15374-plan-role-permissions/command.yaml" && grep
          -q '^status: PASS$' "$receipt" && grep -q 'ReadOnlyAccess' "$receipt" && grep -q 'TerraformStateBackendAccess'
          "$receipt" && grep -q 'plan-role permissions binding PASS' "$receipt"
  - id: "dod-15374-apply-role-unchanged"
    description: >-
      Binds that omninode-github-actions-role's trust policy is unchanged and still contains zero occurrences
      of pull_request -- proof ruling 24 (widen the apply-capable role's trust policy) was not implemented,
      consistent with its explicit same-day withdrawal in favour of ruling 26.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          receipt="drift/dod_receipts/OMN-15374/dod-15374-apply-role-unchanged/command.yaml" && grep -q
          '^status: PASS$' "$receipt" && grep -q '^pull_request_occurrence_count: 0$' "$receipt" && grep
          -q 'apply-capable role unchanged binding PASS' "$receipt"
  - id: "dod-15374-pr784-workflow-repoint"
    description: >-
      Binds the exact content of terraform-plan.yml at omninode_infra PR #784 head a226d1e2b585c2474722b5424b741b2c7d414f00
      directly from GitHub content at that pinned ref (not a receipt self-read): the PR-triggered plan
      job's role-to-assume and the credential-failure error message both reference the new AWS_TERRAFORM_PLAN_ROLE_NAME
      variable exactly three times, and AWS_DEPLOY_ROLE_NAME appears exactly three times, all inside explanatory
      comments rather than an executable role-assumption line. This is a content read (admissible per
      OMN-15309's OUTSIDE-ITS-OWN-DIFF rule), not a PR-existence probe: it reads the file's bytes at a
      pinned SHA, not merely that the PR exists or merged. omninode_infra is a private repository; this
      check requires a token with cross-repo read access, which hosted OCC compliance's repo-scoped GITHUB_TOKEN
      does not have (see dod-occ-hosted-private-token-boundary below) -- expect this specific check to
      report RED under hosted CI's default token until CROSS_REPO_PAT is configured for this repo, even
      though it is TRUE and independently re-runnable by any operator token that can read the private
      repo.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          content="$(gh api "repos/OmniNode-ai/omninode_infra/contents/.github/workflows/terraform-plan.yml?ref=a226d1e2b585c2474722b5424b741b2c7d414f00"
          --jq .content | tr -d '\n' | base64 -d)" && test "$(printf '%s' "$content" | grep -c 'AWS_TERRAFORM_PLAN_ROLE_NAME')"
          = "3" && test "$(printf '%s' "$content" | grep -c 'AWS_DEPLOY_ROLE_NAME')" = "3" && printf '%s'
          "$content" | grep 'role-to-assume:.*AWS_TERRAFORM_PLAN_ROLE_NAME' >/dev/null && printf 'pr784
          workflow repoint content-read PASS\n'
  - id: "dod-15374-repo-vars"
    description: >-
      Binds that AWS_TERRAFORM_PLAN_ROLE_NAME=omninode-github-actions-plan-role exists as a repo variable
      on omninode_infra, and that AWS_DEPLOY_ROLE_NAME=omninode-github-actions-role is unchanged from
      before this ticket's work. Reads the live GitHub Actions variables API directly (not a receipt self-read)
      -- /actions/variables is not a PR/issue metadata endpoint, so it is admissible under OMN-15309.
      omninode_infra is private, so this still requires cross-repo read access hosted OCC compliance's
      default GITHUB_TOKEN does not have (see dod-occ-hosted-private-token-boundary); expect RED under
      hosted CI's default token even though the fact is true and independently reproducible by any operator
      token with read access.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          out="$(gh api repos/OmniNode-ai/omninode_infra/actions/variables --jq '.variables[] | select(.name=="AWS_DEPLOY_ROLE_NAME"
          or .name=="AWS_TERRAFORM_PLAN_ROLE_NAME") | "\(.name)=\(.value)"')" && printf '%s' "$out" |
          grep -q '^AWS_DEPLOY_ROLE_NAME=omninode-github-actions-role$' && printf '%s' "$out" | grep -q
          '^AWS_TERRAFORM_PLAN_ROLE_NAME=omninode-github-actions-plan-role$' && printf 'repo vars live-read
          PASS\n'
  - id: "dod-15374-pr784-hosted-boundary"
    description: >-
      Append-only hosted-CI supersession for dod-15374-pr784-workflow-repoint. The historical operator-token
      receipt remains the durable private omninode_infra content proof; this supersession binds why hosted
      onex_change_control compliance must not re-fetch that private file with repo-scoped GITHUB_TOKEN.
      The public OCC workflow check below proves contract compliance runs with github.token as GH_TOKEN
      and does not pass CROSS_REPO_PAT into the DoD command execution step.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-15374-pr784-workflow-repoint"
    checks:
      - check_type: "command"
        check_value: >-
          workflow="$(gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/onex_change_control/contents/.github/workflows/ci.yml?ref=dev')"
          && printf '%s' "$workflow" | grep 'uv run python /tmp/onex_change_control/scripts/ci/run_contract_compliance_check.py'
          >/dev/null && printf '%s' "$workflow" | grep 'GH_TOKEN: \${{ github.token }}' >/dev/null &&
          printf '%s' "$workflow" | grep 'OMNI_REPO_CLONE_TOKEN: \${{ secrets.CROSS_REPO_PAT || github.token
          }}' >/dev/null && printf 'hosted private-token boundary supersedes pr784 workflow re-fetch\n'
  - id: "dod-15374-repo-vars-hosted-token-boundary"
    description: >-
      Append-only hosted-CI supersession for dod-15374-repo-vars. The historical operator-token receipt
      remains the durable private omninode_infra repo-variable proof; this supersession binds why hosted
      onex_change_control compliance must not re-fetch private repo variables with repo-scoped GITHUB_TOKEN.
      The public OCC workflow check below proves contract compliance runs with github.token as GH_TOKEN
      and does not pass CROSS_REPO_PAT into the DoD command execution step.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-15374-repo-vars"
    checks:
      - check_type: "command"
        check_value: >-
          workflow="$(gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/onex_change_control/contents/.github/workflows/ci.yml?ref=dev')"
          && printf '%s' "$workflow" | grep 'uv run python /tmp/onex_change_control/scripts/ci/run_contract_compliance_check.py'
          >/dev/null && printf '%s' "$workflow" | grep 'GH_TOKEN: \${{ github.token }}' >/dev/null &&
          printf '%s' "$workflow" | grep 'OMNI_REPO_CLONE_TOKEN: \${{ secrets.CROSS_REPO_PAT || github.token
          }}' >/dev/null && printf 'hosted private-token boundary supersedes repo-vars re-fetch\n'
  - id: "occ-self-bind-pr-5855"
    description: >-
      Binds OMN-15374 central evidence to upstream OCC companion PR #5855, which replaces fork PR #5819
      so hosted CI can run with the normal onex_change_control secret and runner-variable context.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          number="$(gh api repos/OmniNode-ai/onex_change_control/pulls/5855 --jq .number)" && state="$(gh
          api repos/OmniNode-ai/onex_change_control/pulls/5855 --jq .state)" && head_label="$(gh api repos/OmniNode-ai/onex_change_control/pulls/5855
          --jq .head.label)" && test "$number" = "5855" && test "$state" = "open" && test "$head_label"
          = "OmniNode-ai:codex/omn-15374-infra784-occ-repair" && printf 'OCC 5855 self-bind PASS\n'
  - id: "dod-occ-hosted-private-token-boundary"
    description: >-
      Binds the hosted OCC compliance credential boundary that makes direct private omninode_infra probes
      fail closed in this PR, same fact previously bound on OMN-15136 (PR #5745). The checked workflow
      on dev runs contract compliance with repo-scoped github.token as GH_TOKEN and does not pass CROSS_REPO_PAT
      to the command execution step, so private product facts must be captured by operator-token receipts
      rather than re-fetched by hosted OCC CI.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          workflow="$(gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/onex_change_control/contents/.github/workflows/ci.yml?ref=dev')"
          && printf '%s' "$workflow" | grep 'uv run python /tmp/onex_change_control/scripts/ci/run_contract_compliance_check.py'
          >/dev/null && printf '%s' "$workflow" | grep 'GH_TOKEN: \${{ github.token }}' >/dev/null &&
          printf '%s' "$workflow" | grep 'OMNI_REPO_CLONE_TOKEN: \${{ secrets.CROSS_REPO_PAT || github.token
          }}' >/dev/null && printf 'OCC hosted compliance private-token boundary PASS\n'
