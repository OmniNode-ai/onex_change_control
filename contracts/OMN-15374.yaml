  # --- OMN-15374/OMN-15136 supersession-grammar repair (append-only correction of #6080) ---
  - id: "occ6080-grammar-repair-note"
    description: >-
      Append-only diagnostic note, not itself a supersession. The `occ6077-receipt-attribution-fix` entry
      immediately above (landed by PR #6080, merge commit 90b63455e171f01779b85bfaa861b65ce94498ef) declares
      `evidence_artifact: "supersedes_dod_evidence:occ-self-bind-pr-5855-superseded,dod-15374-apply-role-unchanged-superseded,occ-self-bind-pr-6077"`
      -- a single string naming THREE target ids joined by commas. `ModelContractDodItem.evidence_artifact`
      is `str | None`, and both `EvidenceCollector._supersedes_marker` (omnimarket) and `contract_compliance_check._supersedes_marker`
      (this repo) read the ENTIRE string after the `supersedes_dod_evidence:` prefix as ONE literal id
      -- there is no comma-splitting or list grammar in either parser. The three-id string therefore matches
      no `id` in this contract's `all_ids` set, so `_resolve_supersessions` classifies it DANGLING_SUPERSESSION
      and marks `occ6077-receipt-attribution-fix` malformed. Per `EvidenceCollector._collect_impl` (evidence_collector.py,
      phase 3): a malformed item's own FAILED verdict is emitted unconditionally, checked BEFORE whether
      the item is itself later targeted by a well-formed supersession marker -- so no subsequent append-only
      entry, however well-formed, can retire that FAILED result. This is intentional anti-laundering design
      (OMN-15382/OMN-15390), not a bug: "a malformed marker ... hard-fails the ITEM CARRYING the marker
      -- it is neither executed nor treated as a clean supersession." Confirmed empirically: `EvidenceCollector._resolve_supersessions`
      called directly against a 3-item fixture (`a` / `a-malformed` supersedes `a,b` / `fixer` supersedes
      `a-malformed`) returns `superseded={'a-malformed': 2}` (the well-formed edge onto the malformed
      item DOES resolve) but the malformed item's own phase-3 branch still fires unconditionally and renders
      FAILED regardless. Live confirmation on this exact contract: `uv run python -m omnimarket.nodes.node_dod_verify
      --ticket-id OMN-15374 --contract-path contracts/OMN-15374.yaml` returns `"failed_count": 1` with
      the single failure being `occ6077-receipt-attribution-fix` / DANGLING_SUPERSESSION, both before
