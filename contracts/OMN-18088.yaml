        check_value: |-
          P=0b2749b9a5d3bda2b53b5b164112e533d9bd364f; M=abb59f0a8e913ae5e3c5e1407cf221a494a67f83; R=repos/OmniNode-ai/omnibase_infra/contents; F=src/omnibase_infra/nodes/node_dlq_depth_monitor_effect/models/model_dlq_depth_monitor_result.py; D=tests/unit/nodes/node_dlq_depth_monitor_effect; N=test_omn18088_alert_path_carries_the_offenders.py; lsp="$(gh api "${R}/${D}?ref=${P}" --jq '.[].name')"; lsm="$(gh api "${R}/${D}?ref=${M}" --jq '.[].name')"; test "$(gh api "${R}/${F}?ref=${P}" --jq '.content' | base64 -d | grep -c alert_exit_requested)" -eq 0 && test "$(gh api "${R}/${F}?ref=${M}" --jq '.content' | base64 -d | grep -c alert_exit_requested)" -ge 1 && test -n "${lsp}" && test "$(printf '%s\n' "${lsp}" | grep -cFx "${N}")" -eq 0 && test "$(printf '%s\n' "${lsm}" | grep -cFx "${N}")" -eq 1
