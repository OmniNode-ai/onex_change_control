  - id: dod-omn19984-pr1853-ac2b-draft
    description: 'PR #1853 companion repair for the AC2 split declared on OMN-19984 on 2026-10-08. DRAFT,
      not accepted; no scheduled-green readback or PASS receipt is claimed. The proposed live check requires
      C31 success on three distinct scheduled dev heads and C30 success on three consecutive scheduled
      dev runs, with successful matching jobs and check-runs at those heads. C32 remains excluded from
      this readback until OMN-19916 lands, exactly as the current criterion states. Its inclusion and
      a new readback are owed when that prerequisite lands.'
    source: manual
    execution_scope: local_done_gate
    status: pending
    checks:
      - check_type: command
        check_value: |
          python3 - <<'CHECK'
          import json
          import subprocess

          repo = "OmniNode-ai/omninode_infra"
          def api(path):
              pages = json.loads(subprocess.check_output(
                  ["gh", "api", "--paginate", "--slurp", f"repos/{repo}/{path}"], text=True))
              return pages

          for workflow, check, consecutive in (
              ("c31-local-dashboard-parity.yml", "C31 local dashboard parity (six pages, figures reconcile)", False),
              ("c30-claude-code-plugin-delegate.yml", "C30 Claude Code plugin delegation (first hour, clean profile)", True),
          ):
              runs = [run for page in api(f"actions/workflows/{workflow}/runs?event=schedule&branch=dev&per_page=100")
                      for run in page["workflow_runs"]
                      if run["event"] == "schedule" and run["head_branch"] == "dev"]
              runs.sort(key=lambda run: (run["created_at"], run["id"]), reverse=True)
              candidates = runs[:3] if consecutive else runs
              green_heads = set()
              green_runs = []
              for run in candidates:
                  if run["status"] != "completed" or run["conclusion"] != "success":
                      continue
                  jobs = [job for page in api(f"actions/runs/{run['id']}/jobs?per_page=100") for job in page["jobs"]]
                  matching = [job for job in jobs if job["name"] == check]
                  if len(matching) != 1 or matching[0]["status"] != "completed" or matching[0]["conclusion"] != "success":
                      continue
                  checks = [row for page in api(f"commits/{run['head_sha']}/check-runs?per_page=100") for row in page["check_runs"]]
                  if not any(row["name"] == check and row["head_sha"] == run["head_sha"]
                             and row["status"] == "completed" and row["conclusion"] == "success"
                             and row.get("details_url") == matching[0]["html_url"] for row in checks):
                      continue
                  green_heads.add(run["head_sha"])
                  green_runs.append(run["id"])
                  if not consecutive and len(green_heads) >= 3:
                      break
              assert len(green_runs) >= 3 if consecutive else len(green_heads) >= 3, (workflow, green_runs, sorted(green_heads))
              print(workflow, green_runs, sorted(green_heads))
          CHECK
        cwd: ${OMNI_HOME}/omninode_infra
