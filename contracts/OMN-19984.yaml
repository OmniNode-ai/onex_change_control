  - id: "dod-omn19984-ac3-scheduled-runs-recorded"
    description: |-
      AC3, recorded GitHub readback. The item this supersedes reads GitHub when it runs, and an accepting lane may not read GitHub (ticket note of 2026-10-13T08:26Z), so that binding was not accepted. This item reads a record instead: the metadata and the full log of the same six pinned omninode_infra runs, and the listing of scheduled C30 dev runs between the oldest and newest of its three, saved byte for byte on 2026-10-13 at 10:35Z and kept on the lab host in /data/omninode/lakshman/omn19984-readbacks/OMN-19984-ac3-scheduled-runs-claude89fe-20261013. Each of the thirteen files is named in the check with its sha256 and refused unless it matches. The check reads all of them whole before grading anything, locally when the host holds the folder and otherwise over ssh. It applies the superseded item's rules to the record: every run is a successful scheduled run of its workflow on dev; every log holds exactly one verdict line for its probe, reading PASS; the three C31 runs are on three distinct dev commits; and the listing holds exactly the three C30 runs, so they are consecutive. The last line keeps the probe's exit status as well as its verdict line. Limits: it reads a record and does not read GitHub again, so it proves what GitHub answered on 2026-10-13; the record was captured by the lane that authored this item; local_auth_boundary (C32) stays out of AC3 by the ticket's own text until OMN-19916. The binding is a draft: it carries no accepted_by.
    source: "manual"
    execution_scope: "local_done_gate"
    evidence_artifact: "supersedes_dod_evidence:dod-omn19984-ac3-scheduled-run-history-v2"
    checks:
      - check_type: "command"
        check_value: |-
          if test -d /data/omninode/lakshman/omn19984-readbacks/OMN-19984-ac3-scheduled-runs-claude89fe-20261013; then lab_py="/usr/bin/python3 -"; else lab_py="ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 /usr/bin/python3 -"; fi
          $lab_py <<'PROBE_19984_AC3' | grep -E '^AC3-OK c31_distinct_dev_commits=3 c30_consecutive_scheduled_runs=3$'
          """OMN-19984 AC3 check over the recorded GitHub readback of 2026-10-13. Read-only.

          It reads thirteen files, kept as a copy in the lakshman data area on the lab host, each saved byte for byte
          on 2026-10-13 at 10:35Z:
            run-<id>.json               GET repos/OmniNode-ai/omninode_infra/actions/runs/<id>, for six runs
            run-<id>.log                gh run view <id> -R OmniNode-ai/omninode_infra --log, for the same six
            c30-scheduled-listing.json  the scheduled dev runs of the C30 workflow between the oldest and newest of its three
          All are read whole before anything is graded. It prints one verdict line, AC3-OK or AC3-FAIL, and is red when a
          file is missing, unreadable, not the recorded one (sha256) or not JSON; when a run is on the wrong workflow, not
          scheduled, not on dev or not successful; when a run's log does not hold exactly one verdict line for that probe
          reading PASS (an echoed command, a second verdict line, another probe's verdict or a FAIL does not count); when
          two C31 runs share a commit; and when the listing does not hold exactly those three C30 runs. It reads a record:
          GitHub is not read again. local_auth_boundary (C32) stays out of AC3 by the ticket's own text.

          Run on the lab host: python3 - [folder] < this   (the folder defaults to the kept copy).
          """

          import hashlib
          import json
          import os
          import re
          import sys

          RECORDED = {
              "run-38101832991.json": "e0ddd0f5d8beee3dab43e79cc7f6b677ce5638c89c1541c36887986601eeb18b",
              "run-38077661532.json": "5c1f63db378b47159bd2cc55e8a38d1b57003169dd0a5c96abad7f6dc9e8d33b",
              "run-38053883247.json": "6f5d9113010a557deafcbf7393108efcce564bdda024b925eb05561f058f699e",
              "run-38101058830.json": "e4bea111148666f3637eeb156c2b99885d9547165e35c5ca8daec921fb302e7b",
              "run-38076213076.json": "05f3f7f78c996508024de1f151fe4a27850315bbdcba0e682b89fbb9b1cd6f90",
              "run-38052646845.json": "361f0be95f28c9ec29c9c5fcb7163ec264f48a011ff10c74a76315155375eba4",
              "run-38101832991.log": "56a3df5150cf1b445d60a3c8a6775482df327127ada88bb376c8cbf536467ae9",
              "run-38077661532.log": "15d0d988668f3b951c403d197b3b335e95401b8a73e2f424278dceb509672e80",
              "run-38053883247.log": "0eb5e0de5eda5ee15c66d90d420f1fe27c231d75c5458d6b9fda1add9f1e595a",
              "run-38101058830.log": "46d81c077ed26c526af9c94b2263b8eb2daecde86ecd792bd967ff4227cbac20",
              "run-38076213076.log": "b0f307ff981de758c405756faa7f2c2157bfe750c4b46ff26f05360f04d7d2b4",
              "run-38052646845.log": "16dbd039ccc67c6173db183a3108eb8e94e994d041e99fabd5cf537b680746de",
              "c30-scheduled-listing.json": "8326a58db3cc6a204bce431432106fcd4e0c590752a6edfc61688cb987e136e2",
          }
          RUNS = [
              ("C31", "c31-local-dashboard-parity.yml", 38101832991),
              ("C31", "c31-local-dashboard-parity.yml", 38077661532),
              ("C31", "c31-local-dashboard-parity.yml", 38053883247),
              ("C30", "c30-claude-code-plugin-delegate.yml", 38101058830),
              ("C30", "c30-claude-code-plugin-delegate.yml", 38076213076),
              ("C30", "c30-claude-code-plugin-delegate.yml", 38052646845),
          ]
          VERDICT = re.compile(r"^C3[0-9]_VERDICT=")


          class Fail(Exception):
              pass


          def recorded(root, name):
              raw = open(os.path.join(root, name), "rb").read()
              if hashlib.sha256(raw).hexdigest() != RECORDED[name]:
                  raise Fail(name + " is not the recorded file (sha256)")
              return raw.decode("utf-8")


          def verdict_lines(log):
              found = []
              for line in log.split("\n"):
                  parts = line.split("\t", 2)
                  if len(parts) < 3 or " " not in parts[2]:
                      continue
                  text = parts[2].split(" ", 1)[1].rstrip("\r")
                  if VERDICT.search(text):
                      found.append(text)
              return found


          def verdict(root):
              commits = []
              c30 = []
              for probe, workflow, run_id in RUNS:
                  run = json.loads(recorded(root, "run-%d.json" % run_id))
                  facts = (run.get("id"), run.get("path"), run.get("event"), run.get("head_branch"), run.get("conclusion"))
                  if facts != (run_id, ".github/workflows/" + workflow, "schedule", "dev", "success"):
                      raise Fail("run %d is not a successful scheduled dev run of %s: %r" % (run_id, workflow, facts))
                  lines = verdict_lines(recorded(root, "run-%d.log" % run_id))
                  if lines != [probe + "_VERDICT=PASS"]:
                      raise Fail("run %d verdict lines %r, need exactly one, %s_VERDICT=PASS" % (run_id, lines, probe))
                  if probe == "C31":
                      commits.append(run.get("head_sha"))
                  else:
                      c30.append(run_id)
              if len(set(commits)) != 3 or None in commits:
                  raise Fail("C31: %d distinct dev commits, need 3" % len(set(commits)))
              listing = json.loads(recorded(root, "c30-scheduled-listing.json"))
              listed = sorted(item.get("id") for item in listing.get("workflow_runs", []))
              if listing.get("total_count") != 3 or listed != sorted(c30):
                  raise Fail("C30: the listing holds %r, need exactly %r" % (listed, sorted(c30)))
              return "AC3-OK c31_distinct_dev_commits=%d c30_consecutive_scheduled_runs=%d" % (len(set(commits)), len(listed))


          if __name__ == "__main__":
              default = "/data/omninode/lakshman/omn19984-readbacks/OMN-19984-ac3-scheduled-runs-claude89fe-20261013"
              folder = sys.argv[1] if len(sys.argv) > 1 else default
              try:
                  print(verdict(folder))
              except Exception as error:
                  print("AC3-FAIL " + type(error).__name__ + ": " + str(error))
                  sys.exit(1)
          PROBE_19984_AC3
          test "${PIPESTATUS[0]}${PIPESTATUS[1]}" = "00"
        cwd: "${OMNI_HOME}"
    binds_ac:
      - "AC3"
    ac_bindings:
      - label: "AC3"
        criterion_hash: "3def127f3b6d2fea6ba1de20ab499fe73c91be8f3baa45cffe41db9e1e0c6a8e"
        proposed_by: "lane=claude-89fe852d"
