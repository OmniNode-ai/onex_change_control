schema_version: "1.0.0"
ticket_id: "OMN-15236"
title: "A3 (omnimarket): nested handler_routing for intent_storage/memory_retrieval + omninode-memory
  rev-pin bump"
summary: >
  OCC companion evidence for omnimarket branch jonah/omn-15236-a3-omnimarket-nested-handler-routing at
  commit 08e23837c9842c92c49be61229f8eb9c65402dcb. Slice A3 of OMN-15027, clearing 2 of the 4 flat-schema
  discovery_errors in omnimarket (Group A: node_intent_storage_effect, node_memory_retrieval_effect);
  the Group B pair stays carved out for the sequential B3 slice. Bumps the omninode-memory rev pin from
  1cd318d5 to 887dc679 -- the squash commit of omnimemory#416 on dev, not a feature-branch head -- picking
  up both #415 (OMN-15226, def-B handle() on HandlerIntentStorageAdapter) and #416 (OMN-15227, def-B handle()
  on HandlerMemoryRetrieval plus the repoint off the three *Mock sub-handlers); uv.lock regenerated, only
  omninode-memory moved. Both contracts move from the flat handler_key schema -- which parses to ZERO
  dispatchers and phantom-wires the subscribed topic (OMN-14141) -- to the nested handler {name, module}
  mapping. All three retrieval operations route to the production HandlerMemoryRetrieval rather than a
  transliteration of the Mock handler_key values, and each node stays at 3 dispatchable operations (upstream's
  health_check and the non-dispatchable index -> HandlerQdrant of OMN-15235 are deliberately not mirrored).
  The pin bump also surfaced a latent cross-repo break filed as OMN-15238: omnimemory#410 (OMN-14618)
  deleted ModelCrawlStateRecord and ProtocolCrawlStateRepository on an intra-repo-only orphan grep while
  the live consumer had already moved to omnimarket under OMN-8299, so both symbols are relocated verbatim
  into the owning node. Source-only lane, no runtime mutation; proof_class caps at receipt-bound.
is_seam_ticket: true
interface_change: true
