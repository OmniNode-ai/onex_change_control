title: Repair contracts/OMN-14968.yaml dod_verify 3/7 FAIL + ship the authoring-time lint mechanism
summary: 'contracts/OMN-14968.yaml failed dod_verify 3/7: four dod_evidence check_values opened with the
  human-readable prose "Recorded product receipt: ..." handed verbatim to `sh -c` (the literal word "Recorded"
  fails "command not found", exit 127 when actually run), one of which additionally piped into a bare
  `sha256sum` with no explicit hash assertion -- vacuously green on any input, including nothing, since
  `sh -c` has no `pipefail` and `sha256sum` always exits 0 regardless of what its stdin contained. A sixth
  item (dod-OmniNode-ai-omnibase_infra-pr-2536) used the OMN-14431 bare ${PR_NUMBER}/${REPO} runner placeholder,
  so it never actually pinned PR #2536 -- it silently re-checked whatever PR the compliance runner happened
  to be evaluating (the class-3 PR-number mis-binding defect). This PR repairs contracts/OMN-14968.yaml
  with five append-only, hosted-runnable, falsifiable replacement entries (mirroring the OMN-14875/PR#4528
  precedent''s supersedes_dod_evidence idiom) AND ships the authoring-time lint mechanism in the same
  PR: two new rules in scripts/lint_contract_check_values.py -- (Rule A) executable-command-shape, rejecting
  any check_value that does not open with a recognized command head or shell control keyword after stripping
  simple literal env-assignment prefixes; and (Rule B) per-item PR binding, rejecting a dod_evidence id
  that embeds a PR number (pr-(\d+)) when none of its gh pr view/checks/diff check_values literally references
  that number. A corpus-wide survey found the class-3 mis-binding defect alone is NOT unique to OMN-14968
  -- it recurs across roughly a thousand historical dod_evidence items corpus-wide; those pre-existing
  violations are frozen into a shrink-only baseline (.onex_ratchets/omn_15382_rule_a_baseline.yaml, .onex_ratchets/omn_15382_rule_b_baseline.yaml)
  asserted by set equality, so a NEW instance of either defect class hard-fails while historical debt
  is visible and cannot silently regrow. Append-only reconciliation note: dev''s independent autobind
  contract for this ticket (node_occ_companion_compute reacting to OmniNode-ai/omnimarket PR #1949) landed
  on dev after this branch diverged; its dod_evidence entries are preserved byte-intact, in dev''s original
  order, ahead of this branch''s items, and the one id collision (dod-OmniNode-ai-omnimarket-pr-1949)
  is resolved by keeping dev''s entry untouched and renaming this branch''s strictly-stronger duplicate
  (which additionally asserts the PR''s file list contains node_dod_verify) to dod-OmniNode-ai-omnimarket-pr-1949-strict.
  Rebasing onto dev also surfaced 3 NEW Rule B violations landing via the SAME dev autobind that raced
  in this ticket''s contract (occ-self-bind-pr-5459/5465/5466, each carrying a bare ${PR_NUMBER} placeholder
  while the id embeds a specific PR number); per the append-only gate the originals are kept byte-intact
  and each is superseded by an occ-self-bind-pr-<N>-strict entry that hardcodes the PR number, so contracts/OMN-15382.yaml
  stays clean under this PR''s own new lint (as the authoring-time-clean design in this ticket requires)
  without dropping or mutating dev''s entries.'
