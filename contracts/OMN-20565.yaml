        statement: |-
          AC3: each node's runtime writes the canonical report with --report-json and returns ERROR on a full-tree run that scanned zero files -- falsifier: a pytest case running the runtime over an empty root exits 0
      - id: "AC4"
        statement: |-
          AC4: each node is exported in .pre-commit-hooks.yaml under the hook id the consuming repos pin -- falsifier: uv run pre-commit try-repo . <hook-id> --all-files does not resolve the id
