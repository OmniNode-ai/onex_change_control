  - id: "dod-omn19971-ac1-dev-lane-readback"
    description: |-
      AC1 re-run (claude-e72e9157, OMN-19971). Re-runs AC1's dev-lane readback and exits non-zero when AC1 is false: GET /projections on the .201 dev lane (:3002) must answer 200 with at least one ok exposure and delegation.decisions among them; every exposure the catalogue marks ok must answer 200 for the pinned tenant 820272f9-4aaf-5add-a2df-0af942852ab2 (the tenant filter is sent only to exposures that declare a tenant_column, since the API refuses it with 422 on the rest); and delegation.decisions' newest served written_at must not be older than the newest written_at the writer table public.delegation_events holds for that tenant, read first so a row written during the check cannot fail it. Read-only: the writer read runs with default_transaction_read_only on, the script is piped to the host interpreter, nothing is written on the host. Not covered by this check: the key-set comparison against each writer (AC1's other leg), which needs a SELECT DISTINCT per writer and was recorded in the 2026-10-03 and 2026-10-05 readbacks, not re-run here. Authored binding, not accepted by its author.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          if docker inspect omnibase-infra-postgres >/dev/null 2>&1; then lab_py="python3 -"; else lab_py="ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 python3 -"; fi
          $lab_py <<'PY'
          import json, subprocess, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          BASE = "http://localhost:3002"
          TENANT = "820272f9-4aaf-5add-a2df-0af942852ab2"
          DEC = "onex.snapshot.projection.delegation.decisions.v1"
          t0 = time.time()
          def get(path):
              try:
                  r = urllib.request.urlopen(BASE + path, timeout=40)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, repr(e).encode()
          def ts(s):
              d = datetime.fromisoformat(s)
              return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
          bad = []
          q = "select to_char(max(written_at) at time zone 'utc','YYYY-MM-DD HH24:MI:SS.US'), count(*) from public.delegation_events where tenant_id='" + TENANT + "'"
          p = subprocess.run(["docker", "exec", "-e", "PGOPTIONS=-c default_transaction_read_only=on", "omnibase-infra-postgres", "psql", "-U", "postgres", "-d", "omnidash_analytics", "-At", "-F", "|", "-c", q], capture_output=True, text=True, timeout=60)
          wmax, wn = (p.stdout.strip().split("|") + ["", "0"])[:2]
          if p.returncode != 0 or not wmax or int(wn) == 0:
              bad.append("writer read failed or empty: rc=%s out=%r err=%r" % (p.returncode, p.stdout.strip(), p.stderr.strip()[:200]))
          st, body = get("/projections")
          topics = json.loads(body)["topics"] if st == 200 else []
          oks = [t["topic"] for t in topics if t.get("status") == "ok"]
          scoped = {t["topic"] for t in topics if t.get("tenant_scoped")}
          if st != 200 or not oks:
              bad.append("GET /projections -> %s, ok exposures %d" % (st, len(oks)))
          if DEC not in oks:
              bad.append("delegation.decisions is not catalogued ok")
          served = ""
          for topic in oks:
              if time.time() - t0 > 240:
                  bad.append("deadline exceeded before %s" % topic)
                  break
              s, b = get("/projection/" + topic + ("?tenant=" + TENANT if topic in scoped else ""))
              if s != 200:
                  bad.append("%s -> %s" % (topic, s))
              elif topic == DEC:
                  rows = json.loads(b)["rows"]
                  served = max((r["written_at"] for r in rows), default="")
          if not served:
              bad.append("delegation.decisions served no rows for the tenant")
          elif wmax and ts(served) < ts(wmax.replace(" ", "T")):
              bad.append("delegation.decisions newest served %s lags writer newest %s" % (served, wmax))
          print("catalogue ok=%d tenant=%s decisions served_newest=%s writer_newest=%s writer_rows=%s elapsed=%.0fs" % (len(oks), TENANT, served, wmax, wn, time.time() - t0))
          for m in bad:
              print("FAIL:", m)
          print("AC1 readback", "FAILED" if bad else "PASSED")
          sys.exit(1 if bad else 0)
          PY
    binds_ac:
      - "AC1"
    ac_bindings:
