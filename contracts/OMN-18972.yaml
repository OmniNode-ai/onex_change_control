---
schema_version: "1.0.0"
ticket_id: OMN-18972
title: Default-deny the CI Summary umbrella's external check-runs
summary: >-
  Layer 4 of the CI Summary umbrella is a whitelist lookup over EXPECTED_EXTERNAL_CONTEXTS and never walks
  the head's check-run list the other way, so a check-run outside that tuple is read by nothing and can
  conclude a refusal with the umbrella green. Measured over the 16 dev pull requests merged 2026-09-20T23:42:54Z
  to 2026-09-21T04:47:21Z at merge time, 12 to 13 unregistered names per head against a tuple of 21, with
  7 of 16 heads carrying a non-green one. This adds a fifth, default-deny layer under the same required
  context, held to the strict bar where only success passes, with four dated and expiring exclusion entries
  for the names that are non-green by design.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "CI passes on the pull request"
    command: "gh pr checks"
dod_evidence:
  # Every item below is a falsifiable statement about THIS change that is
  # provable on the head, before merge. They are deliberately not the usual
  # pull-request lifecycle probes: an item whose check is "required contexts
  # are green" cannot pass while the eligibility gate that reads these very
  # receipts is red, so a lifecycle-shaped contract is circular here and can
  # never be satisfied. The merge itself remains the fresh-event definition of
  # done and is not claimed by any receipt.
  - id: "dod-001"
    description: >-
      The gate module exposes the layer-5 default-deny sweep and holds it to the strict bar, where the
      only passing conclusion is success.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c "import ast,sys; src=open('scripts/ci/ci_summary_gate.py').read(); assert 'def
          evaluate_external_sweep' in src; assert 'SWEEP_GOOD_CONCLUSIONS: frozenset[str] = frozenset({\"success\"})'
          in src; print('OK')"
  - id: "dod-002"
    description: >-
      The poller wires the layer in: it fetches the head's workflow runs, passes both new flags and the
      event name, and clears the stale index between polls. Without this the module is inert.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c "import yaml; j=yaml.safe_load(open('.github/workflows/ci.yml'))['jobs']['ci-summary'];
          s=[x for x in j['steps'] if 'ci_summary_gate.py' in str(x.get('run') or '')][0]['run']; assert
          'actions/runs?head_sha=' in s; assert '--workflow-runs-file' in s; assert '--event-name' in
          s; assert 'rm -f /tmp/ci_summary_workflow_runs.json' in s; print('OK')"
  - id: "dod-003"
    description: >-
      The umbrella's own test suite passes on this head, including the layer-5 cases, the exclusion registry
      validation and the control that stripping the registry makes every real head fail.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/ci/test_ci_summary_gate.py -q"
  - id: "dod-004"
    description: >-
      The exclusion registry is non-empty, every entry carries a reason, an owning ticket, an added date
      and an absolute expiry, none has expired, and every ticket is a real reference. Non-emptiness is
      asserted because a shape check alone passes vacuously on an empty registry, which a negative control
      caught before this item was ever receipted. The exact name set is deliberately NOT asserted: an
      entry legitimately added after a measurement, which is what happened on this very pull request,
      must not break its own evidence.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c "import re; from datetime import UTC, datetime; from scripts.ci.ci_summary_gate
          import EXTERNAL_SWEEP_EXCLUSIONS as E, validate_sweep_exclusions as v, active_sweep_exclusions
          as a; assert E, 'registry is empty'; assert v(E) == [], v(E); assert a(E, now=datetime.now(UTC))[1]
          == (), a(E, now=datetime.now(UTC))[1]; assert all(re.fullmatch(r'OMN-\d+', x.ticket) for x in
          E.values()), sorted(E); print('OK', len(E), 'entries')"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
