    description: >-
      AC1. Lab Postgres survives a full re-apply AND a pod replacement, and the proof is an authenticated
      application read through the runtime path returning the expected rows afterwards, not a row count
      from a privileged session. Verified live on the .201 k3s lab through the sanctioned apply_lab_lane.sh
      path: baseline recorded 2026-09-12T19:53:35Z, full re-apply, pod onex-lab-postgres-668ffbbbbb-nw22z
      deleted and replaced by -trjnb, verification 19:56:52Z with 0 failures. GET /v1/tenants/me/plan,
      called over HTTP inside the API pod with the lane's own API key, returned the IDENTICAL tenant row
      on both sides -- tenant_id 6c48114b-cfa9-4125-a390-67a0047a8fcc, slug onex-lab-house, plan discovery,
      status active -- which is a comparison of row content and not of a status code. NEGATIVE CONTROL
      in the same run: a deliberately wrong key is refused with HTTP 401, so the read is a statement about
      authentication rather than only about the database. The analytics database is covered separately
      by its migration ledger read as role_omnidash, a NOSUPERUSER NOBYPASSRLS login, byte-identical across
      the rebuild -- row identity, not a count, because a wiped database that re-migrated carries the
      same count and different timestamps. Honest limit, carried rather than hidden: the delegation projection
      page is empty on this lane and its half is reported UNPROVEN, because a tenant with no registered
      provider key terminalizes every delegation before a projection row is written.
    source: "manual"
    status: "verified"
