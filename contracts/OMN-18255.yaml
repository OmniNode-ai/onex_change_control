      asserted PER CONNECTION STRING rather than for one representative client. Verified live at 2026-09-12T19:56:52Z
      by k8s/onex-lab/verify_lab_persistence.py: 13 of 13 declared connection strings opened a real connection,
      each reported with the login and database it resolved as -- the seven runtime values as postgres,
      the three migration-runner logins as themselves, the escalation value, the control-plane DSN as
      role_omninode_cloud, and the server's own superuser. Per connection string matters because the failure
      this prevents is total rather than partial: a single representative connection would pass while
      the lane was fine and would also pass in every case worth catching. The number attempted is itself
      checked against the number the contract declares, so a run that attempted none cannot report clean,
      and the list is read out of ci-only-secrets.contract.yaml rather than restated, so a credential
      added there is covered without editing the checker.
    source: "manual"
    status: "verified"
