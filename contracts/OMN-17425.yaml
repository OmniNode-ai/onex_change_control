      PRUNED STATE, measured with the real dispatch-time parser rather than a grep. Comments in this file
      name retired grant ids — grant-00ba7b7e is named in the header and grant-2840de81 is now named in
      the prune record itself — so a grep for an id proves nothing about whether an ENTRY exists. The
