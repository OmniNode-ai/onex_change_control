      or a probe pointed at the wrong path, would have returned 0 on BOTH trees. It did not.
      READ FROM THE RECEIPT, NOT THE LIVE FILE. Once this PR merges, `main` is the pruned tree, so the
      control inverts and a live re-run of the pair would report a false failure. What is asserted is
      narrower and stated plainly: the prune WAS measured against a main tree that still carried the
      entry, at 533f3487e.
