  omninode_infra's validate_prod_promotion_grant.py reads grants/prod_promotion_grants.yaml and only
  that path, and every entry here is pinned to runtime_lane staging-namespace while the prod resolver
  matches runtime_lane == "prod". The verdict OMN-17425 was opened to produce is recorded in the file
  rather than only in the ticket: NEITHER of the two contradicting records was wrong. The grant's own
  reason named the deploy-onex-prod.yml deploy_target=public-only convergence run, which is omninode_infra
