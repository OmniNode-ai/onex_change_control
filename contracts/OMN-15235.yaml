      RED is produced by the OMN-13551/OMN-13603 predicate itself (_required_non_injectable_params over
      the contract-declared target), not by a surrogate assertion. The gate lives at tests/unit/nodes/
      deliberately: omnimemory''s governed selector maps a src/omnimemory/nodes/** change to tests/unit/nodes/
      only and contributes nothing for a changed test outside tests/unit/, so at tests/ root CI selected
