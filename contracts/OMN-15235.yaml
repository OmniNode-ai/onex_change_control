schema_version: 1.0.0
ticket_id: OMN-15235
title: 'omnimemory: remove the non-dispatchable index -> HandlerQdrant route from node_memory_retrieval_effect
  and port the boot-resolvability gate'
summary: 'OCC evidence companion for OMN-15235. node_memory_retrieval_effect declared an `index` operation
  routed to HandlerQdrant, a target that fails both boot-gate predicates (no handle/handle_async entrypoint;
  a required default-less `config` ctor param outside the injectable set). The ticket offered three dispositions;
  the code rules out the OMN-15227 repoint precedent, because HandlerMemoryRetrieval.execute() has no
  `index` branch and closes with assert_never(request.operation), and because ModelMemoryRetrievalRequest.operation
  -- the node''s declared input_model -- is Literal[''search'', ''search_text'', ''search_graph''], so
  an `index` request is not constructible at all. Disposition taken is option 3: remove the route and
  the `index` literal from validation_rules.constraint_definitions.operation. HandlerQdrant itself is
  retained (it was never wired in production and is exercised directly by its own unit and golden-chain
  tests); only the false ROUTE is removed. The omnimarket boot-resolvability gate (OMN-13551 / OMN-13603)
  is ported into omnimemory, whose contracts the omnimarket scan root never covered -- the reason this
  defect was latent rather than red. _UNWIRED_DEPENDENCY_ALLOWLIST stays empty; padding it was the explicitly
  rejected fix.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
evidence_requirements:
  - kind: ci
    description: Product PR diff scope present on OmniNode-ai/omnimemory
    command: gh pr view ${PR_NUMBER} --repo ${REPO} --json files
