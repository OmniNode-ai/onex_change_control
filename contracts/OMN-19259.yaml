      - id: "AC3"
        statement: |-
          AC3: A refused command still commits past its own record and no further, so a refusal never stalls the commands behind it -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_consumer_batch_commit_loss_omn18613.py -q
      - id: "AC4"
        statement: |-
          AC4: A record the coalescing scan stops on is handled by the head path on the next poll -- falsifier: uv run pytest scripts/deploy-agent/tests/unit/test_consumer_batch_tail_delivery.py -q -k lookahead_break
      - id: "AC5"
        statement: |-
          AC5: The consumer and queue_depth docstrings describe the fetch position correctly and no longer call unprocessed records buffered -- falsifier: grep -n buffered scripts/deploy-agent/deploy_agent/consumer.py scripts/deploy-agent/deploy_agent/queue_depth.py
      - id: "AC6"
        statement: |-
          AC6: On the .201 dev lane two signed commands published in one producer batch, head refused and second valid, produce a job for the second -- falsifier: the job file for the second correlation id under the deploy agent jobs-dev state dir, read over SSH on the .201 host after the publish
