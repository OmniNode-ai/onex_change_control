title: "Bind the omnimarket omnibase-infra 0.38.7 -> 0.38.8 repin (OMN-12977 workspace preflight unblock)"
summary: >-
  OCC companion for OmniNode-ai/omnimarket#2121. Deletes the stale [tool.uv.sources] git-rev override
  for omnibase-infra (rev 6fdbba6d8b6bcd7cc98a3da7dc8eb510f67a0e6a, resolved version 0.38.7, the OMN-16089
  post-#2672 lineage) and lets omnibase-infra resolve from PyPI at 0.38.8 instead, via the existing range
  pin omnibase-infra>=0.38.3,<0.39.0. omnibase-infra 0.38.8 is published on PyPI and 6fdbba6d8b is a confirmed
  ancestor of the v0.38.8 tag commit (018c64a14c2f80c22819bc3bede45dad8ebb7ca6 on omnibase_infra dev),
  so the override's own documented removal criterion is met -- mirroring the OMN-15539 (omnibase-core)
  and OMN-16191 (omninode-memory) override-removal precedent, and retiring the OMN-16077/16086/16089 git-rev
  re-bump treadmill for infra. The stale 0.38.7 pin was failing the OMN-12977 workspace-mode pin-consistency
  preflight in omnibase_infra's build-workspace-candidate-runtime.yml at dev SHA 018c64a14c2f80c22819bc3bede45dad8ebb7ca6,
  blocking the omninode_infra repin and the downstream onex-dev deploy chain. `uv lock --upgrade-package
  omnibase-infra --upgrade-package click` was required (click floor raised to >=8.3.3 by 0.38.8, a CVE-driven
  bump per omnibase_infra OMN-16355); sqlparse 0.5.5 -> 0.6.0 moved as a mandatory floor-consequence identical
  for both 0.38.7 and 0.38.8 (previously masked by the git source, the same latent-drift class OMN-16191
  called out for omninode-memory). Also bumped omnimarket version 0.4.9 -> 0.4.10 (OMN-16344 check-release-identity
  gate) and fixed two tests that direct-constructed ProjectionTableTarget(schema=...) -- omnibase_infra
  OMN-16239 renamed the field to physical_schema (already an ancestor of the official v0.38.7 PyPI tag,
  never exercised until this repin moved off the stale pre-OMN-16239 git-rev pin).
