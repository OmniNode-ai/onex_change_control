      resolved lab lane, is scheduled, runs the probe node and uploads c28-consumer-flow with if:
      always(). (2) A live readback of the newest completed scheduled run of chain-
      canary-c28-consumer-flow.yml on dev: it must have concluded success no more than 12 hours ago,
      its C28 job must have succeeded on a runner labelled self-hosted, omnibase-verify and host-201,
      and an unexpired c28-consumer-flow artifact must exist.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: |-
          env -u PYTHONPATH uv run pytest "tests/ci/test_c28_consumer_flow_probe.py::test_the_workflow_runs_the_probe_beside_the_resolved_lane" -q
        cwd: "${OMNI_HOME}/omnibase_infra"
      - check_type: "command"
        check_value: |-
          r=OmniNode-ai/omnibase_infra
          row="$(gh run list --repo "$r" --workflow chain-canary-c28-consumer-flow.yml --branch dev --event schedule --status completed --limit 1 --json databaseId,conclusion,createdAt --jq '.[0] | [.databaseId, .conclusion, .createdAt, ((now - (.createdAt | fromdateiso8601)) / 3600 | floor)] | @tsv')" || exit 2
          set -- $row
          id="$1"; concl="$2"; created="$3"; age_h="$4"
          job="$(gh api "repos/$r/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "C28 consumer flow (dev lane)") | select(.conclusion == "success") | select((.labels | index("self-hosted")) != null and (.labels | index("omnibase-verify")) != null and (.labels | index("host-201")) != null)] | length')" || exit 2
          art="$(gh api "repos/$r/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "c28-consumer-flow" and (.expired | not))] | length')" || exit 2
          echo "run=$id conclusion=$concl created=$created age_h=$age_h c28_job_on_host201_success=$job c28_artifact=$art"
          test "$concl" = success && test "$age_h" -le 12 && test "$job" -eq 1 && test "$art" -eq 1
