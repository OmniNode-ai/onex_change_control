    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a red cluster of at least three PRs sharing one failing check and one failure annotation gets exactly one cause worker within one controller tick, on a tick whose receipt counts no interactive Claude process, and none of its members gets a per-PR worker -- falsifier: the tick's rows in ~/.local/state/omni/landing/decisions.jsonl hold no dispatch_worker row with a cause subject, or hold one whose subject is a member PR
      - id: "AC2"
        statement: |-
          AC2: an escalated PR (escalation_exhausted) is covered by a cause worker on the next tick instead of only being reported -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k escalated_singleton (omnimarket)
      - id: "AC3"
        statement: |-
          AC3: a cause is attempted at most its budget, then parked with one operator MSG per park episode, and a fixer HOLD row stops every dispatch and revokes the live leases in its scope -- falsifier: TLC on tla/landing_controller with P11, P12, P14 and their mutant configs (omnibase_internal), and uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k "budget or fixer_hold"
      - id: "AC4"
        statement: |-
          AC4: queue-status reads a shared red as OWNED only by a live CLAIM that names the cause or by the controller's cause lease, never by per-PR CLAIMs, and prints leases and worker-minutes per merge -- falsifier: python3 -m pytest tests/test_queue_status_shared_cause.py -q (omniclaude-internal)
      - id: "AC5"
        statement: |-
          AC5: the session merge-throughput tick no longer dispatches lanes for escalated PRs or floor breaches -- falsifier: python3 -m pytest tests/test_throughput_tick_cause.py -q (omniclaude-internal)
