title: Automatic ticket close-out when evidence is proven — companion-merge -> dod_verify -> governed
  Done flip
summary: 'OCC companion for OmniNode-ai/omnibase_infra PR #2763. First slice of the automatic-close-out
  ticket: a node-backed scheduled sweep (node_evidence_autoclose_sweep_effect) that enumerates onex_change_control
  PRs merged in a lookback window, extracts each merged companion''s Evidence-Ticket binding, re-runs
  the EXISTING ``uv run onex skill dod_verify <ticket>`` verifier exactly as the controller does for governed
  flips, and either flips the bound Linear ticket Done (all ACs verified, zero failed) or posts the honest
  gap as a comment -- never flips on any gap. Fail-closed on missing binding, ambiguous multi-ticket companions,
  dod_verify non-zero exit, and Linear API errors. DRY-RUN by default; the ONEX_AUTOCLOSE_DISABLED kill
  switch is checked first, unconditionally. Wired as `onex skill evidence_autoclose_sweep` and a scheduled
  GitHub Actions workflow running in DRY-RUN only.'
