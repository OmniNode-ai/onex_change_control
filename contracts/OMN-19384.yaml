---
schema_version: "1.0.0"
ticket_id: "OMN-19384"
title: "Supersede admissibility-validator dod_evidence items the pinned OCC runner cannot evaluate"
summary: |-
  Shared multi-repo OCC contract contracts/OMN-18595.yaml carries dod_evidence
  items the immutable pinned Contract Compliance runner (91f5b691) cannot
  evaluate from a product repo: each mints 'uv run pytest
  tests/test_evidence_admissibility.py -q' with no declared cwd, that test
  file exists only in onex_change_control, so the check passes when the
  evaluating workspace is the OCC tree and exits 5 (no tests ran) in every
  product repo. The first batch (OCC#11053, 13 items) landed a disclosed-skip
  supersession for the original set. This ticket's second batch (OCC#11415)
  supersedes 5 more such items that appeared after OCC#11053 landed --
  omnimemory#532, omnimemory#533, omniclaude#2331, omniclaude#2338,
  omniintelligence#950 -- matching the OCC#11053/OCC#11146/OCC#11192
  precedent exactly: append-only, no item deleted or edited, and each
  superseded item's own admissibility floor stays covered by OCC's own
  required CI on every OCC PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: >-
      The pinned Contract Compliance checker's own supersession-resolution logic (the exact code path
      OCC's required CI and every downstream product repo's Contract Compliance Check run) recognizes
      all 5 targeted admissibility items as superseded and all 5 new items as honest disclosed-skip supersessions,
      not omissions.
    command: >-
      uv run python -c "from pathlib import Path; from onex_change_control.scripts.contract_compliance_check
      import _load_yaml, _superseded_dod_ids, _disclosed_skip_supersession_ids; data = _load_yaml(Path('contracts/OMN-18595.yaml'));
      dod = data['dod_evidence']; superseded = _superseded_dod_ids(dod); skips = _disclosed_skip_supersession_ids(dod);
      targets = [ 'dod-occ-evidence-admissibility-validator-pr-533', 'dod-occ-evidence-admissibility-validator-pr-2338',
      'dod-occ-evidence-admissibility-validator-pr-2331', 'dod-occ-evidence-admissibility-validator-pr-532',
      'dod-occ-evidence-admissibility-validator-pr-950' ]; new_items = [ 'occ-admissibility-pr-533-rb19384',
      'occ-admissibility-pr-2338-rb19384', 'occ-admissibility-pr-2331-rb19384', 'occ-admissibility-pr-532-rb19384',
      'occ-admissibility-pr-950-rb19384' ]; assert all(t in superseded for t in targets), targets; assert
      all(n in skips for n in new_items), new_items; print('PASS')"
  - kind: "ci"
    description: >-
      The 5-item batch merge is append-only against dev tip d9612def0dec4c0a8d79f3c6c8c3343153233136:
      no existing dod_evidence line in contracts/OMN-18595.yaml is edited or removed by the merge.
    command: >-
      n=$(git diff d9612def0dec4c0a8d79f3c6c8c3343153233136 HEAD -- contracts/OMN-18595.yaml | grep -c
      '^-[^-]'); echo "removed_lines=$n"; test "$n" -eq 0
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
