        statement: |-
          AC1: A path-scoped checkout of HEAD over a path with uncommitted changes is refused in a worktree or canonical clone under the worktrees root -- falsifier: a test drives the guard with a dirty path and asserts refusal, and asserts the same command over a clean path passes, so the guard is not a blanket block on restores.
      - id: "AC2"
        statement: |-
          AC2: The refusal names both sanctioned alternatives -- falsifier: assert the refusal text contains the object-store read form and the commit-first instruction, since a refusal that does not say what to do instead is how a lane routes around it.
      - id: "AC3"
        statement: |-
          AC3: Replay the real sequence -- falsifier: a test runs the exact three-command Rule 17 sequence from a branch freshly cut from its base, with an uncommitted edit in place, and asserts the guard refuses the third command; the same sequence with the edit committed first is asserted to pass.
      - id: "AC4"
        statement: |-
          AC4: The guard does not fire outside the worktrees root -- falsifier: assert the same dirty-path command in a scratch repository elsewhere is not refused, matching the stash guard's scope.
      - id: "AC5"
        statement: |-
          AC5: A ledger TERMINAL row exists for the implementing lane and the OCC companion PR merged before the product PR -- falsifier: grep TERMINAL docs/tracking/ROLLING_WORK_LEDGER.md returns a row naming this ticket, and gh pr view on the companion reports MERGED with a mergedAt earlier than the product PR's.
