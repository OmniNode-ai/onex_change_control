        statement: |-
          AC1: a GREEN bar verdict whose scored deploy has been replaced by a FAILED newer settled deploy renders SUPERSEDED, not PASS -- falsifier: a pytest case supplies a GREEN report scoring deploy A plus a run list whose newest settled run B concluded failure after A, and asserts the criterion renders SUPERSEDED; it fails against today's code, which renders PASS
      - id: "AC2"
        statement: |-
          AC2: a non-GREEN bar verdict whose scored deploy has been replaced by a SUCCESSFUL newer settled deploy renders SUPERSEDED, not FAIL -- falsifier: a pytest case supplies an UNPROVEN report scoring deploy A plus a newer settled success run B and asserts SUPERSEDED rather than FAIL, reproducing publish 36020477646
      - id: "AC3"
        statement: |-
          AC3: agreement in direction renders the verdict untouched, so a deploy that merely happened does not churn the criterion -- falsifier: a pytest case asserts PASS is still rendered for GREEN with a newer success deploy, and FAIL is still rendered for BLOCKED with a newer failure deploy, covering the 13 measured occurrences that must not change
      - id: "AC4"
        statement: |-
          AC4: SUPERSEDED on this relation never counts toward GO, in either direction -- falsifier: a pytest case driven from the GREEN side asserts cleared is False and that milestone_met cannot see the criterion
      - id: "AC5"
        statement: |-
          AC5: the rendered criterion names the deploy the verdict described, the deploy that replaced it, and that deploy's conclusion -- falsifier: a pytest case asserts all three appear in the criterion's rendered evidence text, so a reader need not open Actions to see why a colour was withheld
      - id: "AC6"
        statement: |-
          AC6: the two measured harms are reproduced as regression cases and the agreeing majority is pinned alongside them -- falsifier: a pytest case replays publish 36094889595's inputs (bar 36080238338 GREEN on deploy 36074080279, newest settled 36093928703 failure) and publish 36020477646's (bar 36019133580 UNPROVEN on 36013615041, newest settled 36013739056 success) asserting SUPERSEDED for both, and replays publish 36106007431's (bar 36105882657 BLOCKED on 34970612616, newest settled 36104779280 failure) asserting FAIL is retained
