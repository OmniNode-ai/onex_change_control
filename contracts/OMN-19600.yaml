    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: An accepted response for two declared files yields two manifest entries whose sha256 and size equal those of the file bytes, and an undeclared, oversize or secret-bearing file becomes a typed refusal -- falsifier: uv run pytest tests/nodes/node_delegation_output_extract_compute -q
      - id: "AC2"
        statement: |-
          AC2: The effect writes each accepted file under the declared target and the ArtifactStore, and refuses an absolute path, a parent reference, a git-metadata path, a symlinked target root and a symlinked parent directory without writing outside the target -- falsifier: uv run pytest tests/nodes/node_delegation_output_materialize_effect -q
      - id: "AC3"
        statement: |-
          AC3: Replaying the same manifest into the same target and store is idempotent, and an existing file with different bytes is refused under the default overwrite policy -- falsifier: uv run pytest tests/nodes/node_delegation_output_materialize_effect -q -k idempotent
      - id: "AC4"
        statement: |-
          AC4: The delegate-skill request refuses a non-null declared_outputs key by name, and the response decodes and drops output_manifest and output_files, while the wire compatibility check still passes -- falsifier: uv run python scripts/ci/check_wire_compatibility.py on the branch reporting WIRE_COMPAT_REFUSED
      - id: "AC5"
        statement: |-
          AC5: On the lab, one onex delegate run with one declared file produces the file in the target, a blob in the artifact store and a manifest whose three sha256 values agree -- falsifier: onex delegate on the dev lane followed by the effect node, where any of the three sha256 values differ
