  - id: "dod-da-19600-ac5-three-sha256-agree"
    description: |-
      AC5 proof (mac-evid-b06b07, OMN-17427). Reads the stored reply of the 2026-09-25 .201 dev-lane onex delegate run for correlation 1b978011-a6ce-4081-933b-9596ba2639bc (one declared file, tests/test_slugify.py) from omnidash_analytics.public.delegation_events, runs the real extract compute and materialize effect over it into a fresh target and a fresh ArtifactStore, and requires the manifest sha256, the sha256 of the file in the target and the sha256 of the stored blob to agree. The inference was run once by the original lab run; this check re-runs the effect nodes over that real lab reply and does not issue a new inference.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          lab_ssh="$(docker inspect omnibase-infra-postgres >/dev/null 2>&1 && echo "sh -c" || echo "ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201")"
          work="$(mktemp -d -t omn19600.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          corr=1b978011-a6ce-4081-933b-9596ba2639bc
          $lab_ssh "docker exec omnibase-infra-postgres psql -U postgres -d omnidash_analytics -At -c \"select response_text from public.delegation_events where correlation_id='$corr'\"" > "$work/response.txt" || exit 1
          test -s "$work/response.txt" || { echo "no stored reply for $corr on the .201 dev lane"; exit 1; }
          cat > "$work/check.py" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from uuid import UUID

          work = Path(os.environ["WORK"])
          os.environ["ONEX_ARTIFACT_STORE_ROOT"] = str(work / "artifacts")
          from omnibase_core.artifacts.artifact_store import ArtifactStore
          from omnibase_core.models.artifacts.model_artifact_ref import ModelArtifactRef
          from omnimarket.models.delegation.wire.model_delegation_output_files import ModelDeclaredOutputFile, ModelDeclaredOutputs
          from omnimarket.nodes.node_delegation_output_extract_compute import HandlerDelegationOutputExtract, ModelDelegationOutputExtractRequest
          from omnimarket.nodes.node_delegation_output_materialize_effect import HandlerDelegationOutputMaterialize, ModelDelegationOutputMaterializeRequest

          corr = UUID(os.environ["CORR"])
          reply = (work / "response.txt").read_text()
          declared = ModelDeclaredOutputs(files=(ModelDeclaredOutputFile(path="tests/test_slugify.py", kind="test"),))
          ex = HandlerDelegationOutputExtract().handle(ModelDelegationOutputExtractRequest(response_text=reply, declared_outputs=declared))
          target = work / "target"
          target.mkdir()
          store = ArtifactStore()
          res = HandlerDelegationOutputMaterialize(artifact_store=store).handle(
              ModelDelegationOutputMaterializeRequest(correlation_id=corr, target_root=str(target), files=ex.files, manifest=ex.manifest)
          )
          entry = ex.manifest.entries[0]
          on_disk = hashlib.sha256((target / entry.path).read_bytes()).hexdigest()
          blob = hashlib.sha256(store.read_blob(ModelArtifactRef(ref=entry.artifact_ref))).hexdigest()
          print(f"correlation={corr} file={entry.path} manifest_sha256={entry.sha256} on_disk_sha256={on_disk} artifact_blob_sha256={blob} refusals={len(res.refusals)}")
          sys.exit(0 if entry.sha256 == on_disk == blob and not res.refusals and not ex.manifest.refusals else 1)
          PY
          WORK="$work" CORR="$corr" env -u PYTHONPATH uv run python "$work/check.py"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC5"
    ac_bindings:
      - label: "AC5"
        criterion_hash: "5650abb52c826a567a59ae0f383cecd87858a7dac87f89fc8dba8c41f40ab8aa"
