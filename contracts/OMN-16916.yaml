      PR number through the GitHub API; it does not assert transient open/closed state.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/onex_change_control/pulls/7510 --jq .number | grep -x 7510
  - id: "dod-omn16916-linter-guidance-here-string"
    description: >-
      Falsifiable static assertion over the changed source file (OCC invariant I3, this PR's own in-tree
      checkout). Written per the OMN-15391 Rule D sanctioned form -- and dogfooding the fix this PR itself
      ships -- the file is read once into a variable and every assertion runs against that captured body
      via here-string, not a pipe into grep -q. Asserts: the Rule E block comment's correction note is
      present ('CORRECTION (OMN-16916)'), the Rule D docstring's here-string guidance is present ('Use
      a HERE-STRING'), the sigpipe_fragile_violation() message's here-string guidance is present ('HERE-STRING,
      not a pipe'), the sigpipe_volume_dependent_violation() message's correction note is present ('SIGPIPE-fragile
      once the variable is large (OMN-16916):'), the literal here-string syntax `<<< "$body"` appears
      at least 4 times (Rule D docstring x2, both Rule E message functions x1 each), and 'OMN-16916' is
      cited at least 5 times across the docstring, block comment, and both message functions. Executed
      red/green proof at authoring time: every clause is GREEN against this PR's fixed file and RED against
      the pre-fix file fetched via `git show origin/dev:scripts/lint_contract_check_values.py` (the CORRECTION/HERE-STRING/OMN-16916
      text does not exist there at all). Confirmed safe under the compliance runner's actual shell: exit
