---
schema_version: "1.0.0"
ticket_id: "OMN-16916"
title: "Fix the OMN-15391 Rule D / OMN-15411 Rule E sanctioned check_value idiom -- printf | grep -q is
  itself SIGPIPE-fragile"
summary: >
  The check_value idiom that OMN-15391 Rule D and OMN-15411 Rule E both hand out as the sanctioned fail-closed
  / SIGPIPE-safe buffered-read replacement -- body="$(<producer>)" && printf '%s' "$body" | grep -qF 'MARKER'
  -- is itself a latent SIGPIPE 141 under the compliance runner's real execution shell (bash -o pipefail
  -c, per docs/CHECK_TYPES.md). `grep -qF` exits at the first match and closes its stdin; once $body is
  large enough that printf's write() blocks on the pipe, the closed read end kills printf with SIGPIPE,
  and pipefail surfaces that as exit 141 for a chain in which every assertion actually passed. OMN-15772
  measured this on its own merged item (contracts/OMN-15772.yaml::dod-omn-15772-derived-inventory-structural-fix,
  10/10 plain bash -c runs exit 0, 10/10 bash -o pipefail -c runs exit 141, deterministic) and repaired
  it append-only in commit 4c48f4b40 by switching to a here-string (`grep -qF 'MARKER' <<< "$body"`),
  which has no pipe stage and so cannot be SIGPIPE'd regardless of size or match position. This PR is
  the guidance-only fix scoped by OMN-16916: the Rule D docstring, the Rule E block comment, both Rule
  E message functions (sigpipe_fragile_violation, sigpipe_volume_dependent_violation), the two unit tests
  that exercised the old printf-pipe form as "the sanctioned repair", and docs/CHECK_TYPES.md's "The shell"
  section all now prescribe the here-string form. A corpus-wide static scan found 219 existing check_value
  entries across 119 contract files still using the old idiom; a 40-item representative sample actually
  EXECUTED under both plain bash -c and bash -o pipefail -c (real gh api calls against pinned refs) measured
  7/40 (17.5%) actually reproducing the 0-to-141 divergence, extrapolating to roughly 20-25 of the 219
  entries corpus-wide -- larger than the 10-item single-PR remediation bound, so the corpus repair itself
  is deliberately NOT in this PR and remains OMN-16916's open AC3. The Rule D/E detection regexes and
  producer tuples (_SIGPIPE_FRAGILE_PRODUCERS / _SIGPIPE_VOLUME_DEPENDENT_PRODUCERS) are also deliberately
  untouched here -- adding printf there is corpus-scan-affecting (219 entries would newly surface tier-2
  advisory warnings) and belongs with the remediation work, not bundled into a guidance-text fix.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: "scripts/lint_contract_check_values.py's Rule D docstring and both Rule E message functions
      recommend the here-string form instead of printf | grep -qF; docs/CHECK_TYPES.md documents the SIGPIPE
      hazard and the safe form; the two unit tests that exercised the old form as sanctioned now exercise
      the here-string form; the full unit + corpus-baseline test suites pass unchanged (Tier-1 Rule E
      baseline is untouched since detection was not changed)."
    command: "see dod_evidence check_values"
emergency_bypass:
