    acceptance:
      - id: "AC1"
        statement: |-
          AC1: prune_old_deployments unions the active_path from every registry.omnibase-infra-*.json under DEPLOY_ROOT before it deletes a deployed/<version> dir, not only the invoking lane's own -- falsifier: pytest test that stages two registry files with different active_path values pointing at two different version dirs, runs prune_old_deployments with MAX_DEPLOYMENTS=1, and asserts neither active_path directory is removed
      - id: "AC2"
        statement: |-
          AC2: prune_old_deployments skips deleting any deployed/<version> dir that any live container still bind-mounts, and logs a named warning instead of deleting it silently -- falsifier: pytest test that creates a container (or a stubbed docker inspect fixture) bind-mounted to a non-active old version dir, runs prune_old_deployments, and asserts the directory survives and a skip warning names it
      - id: "AC3"
        statement: |-
          AC3: a version dir this fix newly protects that also has no registry entry anywhere (the judge case) is still discoverable by the live-mount check alone -- falsifier: pytest test with zero registry files present, one container bind-mounted to an old version dir, MAX_DEPLOYMENTS=0, asserting the mounted dir is not removed
