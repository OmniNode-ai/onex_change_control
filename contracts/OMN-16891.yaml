schema_version: "1.0.0"
ticket_id: "OMN-16891"
title: "Promote the OpenRouter free coder to an ACTIVE code tier; ship GLM declared-but-disabled"
summary: >-
  OCC evidence companion for omnibase_infra#2993 and omnimarket#2198. The OpenRouter delegation rung was
  credential-dead on every deployed lane because the lane secret mappings named an env var the .201 host
  does not define; that name is converged, the free coder rung is promoted to carry the whole code-class
  family, and GLM returns as a declared rung that self-enables on its key.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2993 product diff scope present"
    command: "gh pr view 2993 --repo OmniNode-ai/omnibase_infra --json files"
  - kind: "ci"
    description: "PR #2198 product diff scope present"
    command: "gh pr view 2198 --repo OmniNode-ai/omnimarket --json files"
  - kind: "tests"
    description: >-
      Behavior proof derived from each PR's own diff: the invariant suites they add. omnibase_infra pins
      the lane secret name as a data invariant; omnimarket pins the active-tier placement, the quota classification,
      and the placement_reason telemetry field.
    command: |-
      uv run pytest tests/unit/test_openrouter_secret_name_convergence_omn16891.py -q
  - kind: "ci"
    description: >-
      Deploy-scoped surface touched (docker/docker-compose.judge.yml): the judge lane must forward the
      env var name the .201 host actually exports, or its OpenRouter-backed judge cannot authenticate.
      Falsifiable content probe at the merged ref - it fails if the judge compose stops naming the canonical
      variable.
    command: |-
      gh api repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.judge.yml?ref=26b25b36d7035974c6ec0c6eeb7689a78a773a54 --jq '.content' | base64 -d | grep -c 'OPENROUTER_API_KEY'
