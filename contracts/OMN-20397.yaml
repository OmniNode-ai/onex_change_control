      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the node is a canonical EFFECT package with its models under src/omnibase_core/models/nodes/sprint_roll/ -- falsifier: python3 -m pytest tests/ -k canonical_file_shape with the package moved outside nodes/
      - id: "AC2"
        statement: |-
          AC2: the sprint to drain is resolved from the project list, so a run on any day after a sprint ends still finds it -- falsifier: python3 -m pytest tests/nodes/sprint_roll_apply -k source_resolution against a recorded window that omits the finished sprint
      - id: "AC3"
        statement: |-
          AC3: a dry run issues no mutation -- falsifier: python3 -m pytest tests/nodes/sprint_roll_apply -k dry_run asserting the recorded transport saw only reads
      - id: "AC4"
        statement: |-
          AC4: every mutation is written to the journal before it is sent, and a run interrupted after the first write leaves a manifest that undoes it -- falsifier: python3 -m pytest tests/nodes/sprint_roll_apply -k journal with the transport raising on the second call
      - id: "AC5"
        statement: |-
          AC5: undo restores each prior value, newest write first, and a field with no prior value is reported rather than guessed -- falsifier: python3 -m pytest tests/nodes/sprint_roll_apply -k undo on a manifest whose first entry has a null before
      - id: "AC6"
        statement: |-
          AC6: a transient Linear 429 or 503 is retried and a persistent one surfaces rather than being swallowed -- falsifier: python3 -m pytest tests/nodes/sprint_roll_apply -k retry with the transport returning 503 seven times
