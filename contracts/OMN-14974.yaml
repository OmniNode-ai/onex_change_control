---
schema_version: "1.0.0"
ticket_id: "OMN-14974"
title: "Cut staging workflows over to the runtime-owned MSK edge"
summary: >
  Route OmniDash workflow commands through the generic runtime HTTP edge, declare truthful renderer projection
  completion, and add the staging Service and transport guardrails needed to retire direct Redpanda ownership
  after live validation.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - events
  - topics
  - protocols
  - public_api
evidence_requirements:
  - kind: "tests"
    description: "OmniDash runtime-edge typecheck and route tests pass."
    command: "npm run check && npm run test:run"
  - kind: "tests"
    description: "Staging manifests, verification scripts, and repository tests pass."
    command: "uv run pytest tests/ -q"
  - kind: "manual"
    description: >
      After merge, deploy exact image digests to staging, prove runtime /skill workflows over MSK, and
      only then scale Redpanda workloads to zero while preserving rollback state.
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-market1909-terminal-contract-dea20a4c"
    description: >
      omnimarket PR #1909 declares the renderer snapshot as the projection's terminal event at its exact
      reviewed head, so the runtime edge cannot acknowledge completion before durable materialization.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1909 --repo OmniNode-ai/omnimarket --json headRefOid,files --jq .headRefOid)"
          = "dea20a4ced608c9473f008594e60a18c0ea2222c" && gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_renderer_capability_projection/contract.yaml?ref=dea20a4ced608c9473f008594e60a18c0ea2222c'
          --jq .content | base64 -d | grep -Fq 'terminal_event: onex.evt.omnimarket.renderer-capability-projection-snapshot.v1'
  - id: "dod-dash271-runtime-edge-cb7eecdb"
    description: >
      OmniDash PR #271 uses the generic runtime HTTP edge and removes the in-process Kafka producer at
      its exact reviewed head.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 271 --repo OmniNode-ai/omnidash --json headRefOid,files --jq .headRefOid)"
          = "cb7eecdb5db1f9db4a5a9277cb200d82ed3c2801" && gh api 'repos/OmniNode-ai/omnidash/contents/server/runtime-skill-client.ts?ref=cb7eecdb5db1f9db4a5a9277cb200d82ed3c2801'
          --jq .content | base64 -d | grep -Fq '/skill' && ! gh api 'repos/OmniNode-ai/omnidash/contents/server/kafka-producer.ts?ref=cb7eecdb5db1f9db4a5a9277cb200d82ed3c2801'
  - id: "dod-infra680-runtime-service-3a586fd0"
    description: >
      omninode_infra PR #680 exposes the staging runtime Service and configures OmniDash for the runtime
      edge without direct broker variables at its exact reviewed head.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          if infra_head="$(gh pr view 680 --repo OmniNode-ai/omninode_infra --json headRefOid,files --jq
          .headRefOid)"; then test "$infra_head" = "3a586fd71c2ba20edaad603fc76143f2efc1d777" && gh api
          'repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/runtime/service-omninode-runtime.yaml?ref=3a586fd71c2ba20edaad603fc76143f2efc1d777'
          --jq .content | base64 -d | grep -Fq 'name: omninode-runtime' && dash_manifest="$(gh api 'repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/omnidash/deployment.yaml?ref=3a586fd71c2ba20edaad603fc76143f2efc1d777'
          --jq .content | base64 -d)" && printf '%s\n' "$dash_manifest" | grep -Fq -- '- name: OMNIDASH_RUNTIME_EDGE_URL'
          && ! printf '%s\n' "$dash_manifest" | grep -Eq -- '- name: (KAFKA_BROKERS|REDPANDA_ADMIN_URL|OMNIDASH_EVENT_BUS_BOOTSTRAP_SERVERS)$';
          else receipt='drift/dod_receipts/OMN-14974/dod-infra680-runtime-service-3a586fd0/command.yaml';
          grep -Fq 'status: "PASS"' "$receipt" && grep -Fq 'commit_sha: "3a586fd71c2ba20edaad603fc76143f2efc1d777"'
          "$receipt"; fi
  - id: "occ-self-bind-pr-5026"
    description: >
      OCC PR #5026 contains the OMN-14974 contract and durable receipts, bound to a commit preserved in
      the PR history.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/onex_change_control/pulls/5026/commits --paginate --jq 'any(.sha ==
          "ae6e923f3b1c2c78f620ff1fc0d298412f1b1eb7")' | grep -qx true
  - id: "dod-infra681-staging-candidate-b3ce91d3"
    description: >
      omninode_infra PR #681 supplies the missing staging-only OmniDash image factory at exact head b3ce91d3feddfef6b391957c36e22e8014710ac2.
      The workflow accepts only an exact OmniDash SHA, runs only from dev, validates the OIDC build arguments,
      scans before push, labels the image as a non-production staging candidate, and resolves an immutable
      ECR digest. It follows the runtime Service and broker-free dashboard boundary already merged through
      PR #680.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          if infra_head="$(gh pr view 681 --repo OmniNode-ai/omninode_infra --json headRefOid --jq .headRefOid)";
          then test "$infra_head" = "b3ce91d3feddfef6b391957c36e22e8014710ac2" && gh api 'repos/OmniNode-ai/omninode_infra/contents/.github/workflows/build-and-push-omnidash-staging.yml?ref=b3ce91d3feddfef6b391957c36e22e8014710ac2'
          --jq .content | base64 -d | grep -Fq 'name: Build and push omnidash staging-candidate' && workflow="$(gh
          api 'repos/OmniNode-ai/omninode_infra/contents/.github/workflows/build-and-push-omnidash-staging.yml?ref=b3ce91d3feddfef6b391957c36e22e8014710ac2'
          --jq .content | base64 -d)" && printf '%s\n' "$workflow" | grep -Fq 'refs/heads/dev' && printf
          '%s\n' "$workflow" | grep -Fq 'IMAGE_TAG="staging-${SOURCE_SHA}"' && printf '%s\n' "$workflow"
          | grep -Fq 'com.omninode.promotion_class=staging-candidate' && printf '%s\n' "$workflow" | grep
          -Fq 'validate-vite-oidc-build-args.sh' && printf '%s\n' "$workflow" | grep -Fq 'severity: CRITICAL,HIGH';
          else receipt='drift/dod_receipts/OMN-14974/dod-infra681-staging-candidate-b3ce91d3/command.yaml';
          grep -Fq 'status: "PASS"' "$receipt" && grep -Fq 'commit_sha: "b3ce91d3feddfef6b391957c36e22e8014710ac2"'
          "$receipt"; fi
