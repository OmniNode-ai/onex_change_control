title: "staging-green bar leg 3: an in-pod version instrument, and an expected version resolved from the
  delivered image rather than a workflow input"
summary: >
  OCC companion for OmniNode-ai/omninode_infra PR #1269. Bound by hand (union-resolve): autobind minted
  no companion for this ticket, exactly as it minted none for OMN-18068 (OCC #8760) — its three most recent
  mints in this window (#8767, #8764, #8763) are omnimarket and omnibase_core, and the last omninode_infra
  binding was itself hand-minted. Cause of the ticket: bar run 34317959749 (r9, head c672d654) scored
  leg 3 `clean_deploy` UNPROVEN — "no in-pod version readback was recorded" — on a fully green staging
  deploy 34316552256 whose legs 1, 2 and 4 all PASS, and it has scored UNPROVEN on every run since OMN-18064
  made a null expected version UNPROVEN rather than inert. Neither half of item 3's last assertion had
  an instrument. The OBSERVED half was `kubectl exec ... onex --version`, which OMN-18063 measured failing
  to return within 40 s and dying when the pod was replaced under it, so it recorded None and the key
  vanished from the document; it is now a bounded `kubectl port-forward` to the runtime pod plus one `GET
  /health`, answered by the runtime's own process, recorded as an executed/reason record so a probe that
  could not run and a probe nobody wired stop reading identically. The EXPECTED half was a workflow input;
  r8 named that input as the way to close the leg, which would have reinstated the inert check with a
  human in it, since a hand-typed string matching whatever the pod reports greens the exact assertion
  that catches a container wearing a fresh label over old content. The input is removed at the workflow,
  the shell wrapper, the CLI and the config model, and `expected_version_resolution` replaces the scalar:
  the version the DELIVERED image was built as, read from its org.opencontainers.image.version label through
  the registry and required to have been resolved from the delivered digest itself. Not the ECR tag —
  measured against this repository, every recent runtime image carries exactly one tag and it is candidate-<sha>-<timestamp>,
  so a tag-shaped resolver would have returned nothing on every real digest. Measured live and read-only
  on 2026-09-09 (dev-system i-06169517a92b45f86, namespace onex-dev, pod omninode-runtime-7b788b7779-jcspm):
  HTTP 200, status degraded, version 0.38.22 — and the delivered digest sha256:40ba2c16... resolves through
  config blob sha256:b6b1e8b0... to 0.38.22, so leg 3 PASSes on the landed sha. BAR_REVISION r9 -> r10.
  No cluster object was mutated, no credential was rotated, re-issued, revoked or minted, and no secret
  value was read, printed or decoded (rule 22); the pre-signed registry URL is never recorded and the
  retained /health fields are stripped by key with the unbounded details block dropped outright.
