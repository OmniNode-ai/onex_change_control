          --jq .content | base64 -d)" && printf '%s' "$body" | grep -qF 'omninode-cloud-migrate:9f8a0103db3b327fa7928611c715c7988e48ece6@sha256:8f6f811ea2abd1512999101d62790074c79a062a09b79622d2e7ddf076fa56a7'
