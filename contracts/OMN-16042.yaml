      to the digest of the image built from dev HEAD 9f8a010 — the first image that contains 20260813_gateway_sessions.sql.
      Falsified both directions before this receipt was minted: exit 0 at the PR head 8812cb2, exit 1
      at the base 9f8a010, so the check cannot pass on the unfixed tree. Content of the two images verified
      by digest, not tag: sha256:8f6f811 lists 36 .sql and contains gateway_sessions, the prior pin sha256:9cc0237
      lists 35 and does not.\n"
    source: generated
