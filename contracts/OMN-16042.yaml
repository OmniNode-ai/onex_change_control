schema_version: "1.0.0"
ticket_id: "OMN-16042"
title: "Persistent gateway session store + authoritative cross-replica readback"
summary: >
  OCC companion for OmniNode-ai/omninode_infra PR #899. Gateway sessions existed only in per-process heaps
  — an in-process dict in the attach node and a process-wide correlation registry in onex-api — with no
  schema in the cloud database at all, so the canary had no surface to read a session back from and a
  shared consumer group stranded correlation waiters on non-publishing replicas. This companion binds
  the evidence that the session projection tables exist with a paired rollback, that the migration is
  wired into the CI migration chain in the same change (the acl_state lesson), and that multi-replica
  convergence is enforced by a monotonic UPSERT rather than by session affinity.
