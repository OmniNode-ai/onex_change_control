  the contract topic and rejects an invalid command, and declares runtime_profiles at the top level of
  the node contract. The publisher tests are the hosted probe for AC1 and AC2. AC3 is a dev-202 bus readback;
  no criterion is bound here, so the closer holds the ticket on all three."
is_seam_ticket: false
interface_change: false
