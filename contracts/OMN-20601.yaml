      bound here, and AC3 in particular is not provable here: it reads the dev-202 redpanda, which this
      repository's hosted check cannot reach."
    acceptance:
      - id: "AC1"
        statement: "AC1: a publisher in the node package builds exactly one command on the topic read
          from the node contract and rejects an invalid command without publishing -- falsifier: uv run
          pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py -q"
      - id: "AC2"
        statement: "AC2: the node contract declares a top-level runtime_profiles of effects -- falsifier:
          uv run pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py
          -q -k runtime_profile"
