---
schema_version: "1.0.0"
ticket_id: "OMN-15326"
title: "OCC evidence for SocketException false-positive runner health correction"
summary: >-
  Evidence-Source companion for omnibase_infra#2525. The PR removes SocketException from the OMN-15311
  broken-session marker set, updates the runner liveness runbook, and adds a real healthy listener log
  fixture with regression tests so routine BrokerServer long-poll cancellation cannot classify all healthy
  runners as broken.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "The product PR head and file scope must match the SocketException correction."
    command: "gh pr view 2525 --repo OmniNode-ai/omnibase_infra --json headRefOid,files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15326-pr-2525-head"
    description: >-
      Binds OMN-15326 to the exact omnibase_infra#2525 head that CI evaluated. This fails if the PR is
      force-pushed without rebinding the OCC receipt.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2525 --repo OmniNode-ai/omnibase_infra --json headRefOid --jq .headRefOid)"
          = "efd8ac549ad84eee08b6a65217c9b6b7a38ec0e1"
  - id: "dod-omn15326-pr-2525-file-scope"
    description: >-
      Verifies the PR scope is limited to the runner healthcheck marker set, the liveness runbook, and
      the real-log regression fixture/tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2525 --repo OmniNode-ai/omnibase_infra --json files --jq '[.files[].path]
          | sort | join(",")')" = "docker/runners/healthcheck.sh,docs/runbooks/runner-fleet-listener-liveness.md,tests/ci/fixtures/runner_diag_real_tail.log.gz,tests/ci/test_runner_listener_liveness.py"
  - id: "dod-omn15326-real-log-regression"
    description: >-
      Confirms the product PR head carries the real healthy listener log fixture and tests that assert
      SocketException is not a broken-session marker.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/contents/tests/ci/test_runner_listener_liveness.py -H
          'Accept: application/vnd.github.raw' --method GET -f ref=efd8ac549ad84eee08b6a65217c9b6b7a38ec0e1
          | grep -q 'test_socketexception_is_not_a_broken_session_marker'
  - id: "occ-self-bind-pr-5281-omn15326"
    description: "OCC companion PR #5281 — self-bind for OMN-15326."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5281 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
