requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: canonical_clone_sync.py gains a refresh subcommand (refresh <owner/repo> [--branch B] [--wait]) that fetches the clone's tracking refs under the same per-clone lock the sync takes, and with --wait exits 0 only once each refreshed origin ref is at or past the remote head -- falsifier: uv run pytest tests/hooks/test_canonical_clone_sync_refresh.py against a fixture bare remote advanced by one commit
      - id: "AC2"
        statement: |-
          AC2: a PreToolUse Bash guard in the onex plugin refuses git fetch, git pull, git remote update and git ls-remote against a GitHub remote when the command runs in a lane context (cwd or -C target under an omni_worktrees root or a lab-run workdir, or ONEX_LANE set), with exit 2 and a one-line reason naming the refresh command, and logs each refusal with the lane name -- falsifier: uv run pytest tests/hooks/test_git_fetch_guard.py
      - id: "AC3"
        statement: |-
          AC3: the guard allows git push, fetches of non-GitHub remotes, the same commands outside a lane context, and the sync process itself -- falsifier: uv run pytest tests/hooks/test_git_fetch_guard.py allow cases
      - id: "AC4"
        statement: |-
          AC4: the omni and onex skill procedures that told a lane to fetch or pull rely on the shared origin refs or the refresh command instead -- falsifier: grep of the omni and onex skill markdown for a lane-typed git fetch, pull or ls-remote against origin; any remaining hit is named in the PR body
      - id: "AC5"
        statement: |-
          AC5: on the lab host h201 a lane git fetch from a worktree is refused with the guard message, and that worktree's origin/dev equals the remote head after a merge without the lane fetching -- falsifier: onex-remote-lane run on h201 whose transcript shows the refusal line and a rev-parse of origin/dev equal to the remote dev head
evidence_requirements:
  - kind: "ci"
    description: "PR #2533 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
