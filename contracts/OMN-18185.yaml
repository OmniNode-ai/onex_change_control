    description: The behavior proof the autobind recorded as OWED. omniweb carries no pytest target, so
      the diff-derived producer could mint none; this is the hand-authored replacement it asked for. It
      runs the fact-block builder's own suite, whose three POSITIVE CONTROLS feed a fully-observed walk
      through every clause the staging-green bar's legs 7 and 8 grade and assert the emitted pair satisfies
      each one field by field -- so the suite proves the producer CAN reach PASS, not merely that today's
      blocked record is shaped the way today's code shapes it. The remaining cases are one per refusal.
    source: manual
    checks:
      - check_type: test_passes
        check_value: pnpm test:customer-pass-facts
        cwd: ${OMNI_HOME}/omniweb
    binds_ac:
      - AC2
      - AC3
      - AC7
  - id: dod-omn18185-omniweb-both-pointers-published
    description: 'The producer workflow resolves its plane fail-closed from repository variables and publishes
      both fixed-name pointers unconditionally. Asserted by parsing the workflow, not by grepping it,
      and the reason is recorded because the grep this replaces was wrong twice in OPPOSITE directions.
      It first forbade any occurrence of the production domain, which the workflow''s own legitimate dev.app
      target contains as a substring. Re-anchored on the scheme separator it then broke the other way:
      the fail-closed resolver REFUSES production by naming those exact origins in a case pattern, so
      a file that refuses production reads identical to a file that targets it. A substring cannot tell
      ''uses X'' from ''refuses X''; structure can. The test carries a control proving its own lookups
      can return a negative, and both regressions it guards were reproduced on demand and caught.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: pnpm test:customer-pass-workflow
        cwd: ${OMNI_HOME}/omniweb
    binds_ac:
      - AC4
      - AC5
