          | grep -c '^    def _resolved_token('"
  - id: "dod-omn20871-ac1-lab-repro-restarts-gh-token"
    description: |-
      AC1, recorded lab readback. The check reads two files of the 2026-10-10 lab reproduction on .201 (isolated compose project omnibase-infra-omn20871, omnimarket release v0.4.309, no GitHub token bound), kept on the lab host in /data/omninode/lakshman/omn20871-readbacks/OMN-20871-lab-repro-confirm-claudeb548-20261010: repro.log (sha256 95833d9376c66467a8daebf83d28157be83fdfe761eab068c59dc8f39856889d) and effects-fatal-lines.txt (sha256 041097315460e23b11cf5f764bd03abadc7b4d5e3a8e47d6212e8b5efcd07e29). It reads them locally when the host holds the folder and otherwise over ssh (read-only cat). It is green only when repro.log has exactly one line for the step that rebuilds on v0.4.309 and recreates both kernels together, exactly one closing line giving the runtime-effects RestartCount, that count is above 0 (recorded: 6, with omninode-runtime at 0, inside the 900 s watch), and every 'ONEX runtime failed' line in the runtime-effects log excerpt (recorded: 5) has an 'Auto-wiring failed ... SecretResolutionError: Secret reference GH_TOKEN' line beside it. It is red when either file is missing or empty, when the count is 0, and when a failure does not name GH_TOKEN. What it does not prove: it does not re-run the lab step or read a live container, so it shows what the recorded run measured and not what dev does today; the two files were written by this lane's run script, not by the product; and the omnibase_infra revision of the run (dev fdd3daa03) is stated in ticket comment 3507f23b, not in the files the check reads. The recorded cause is the GH_TOKEN strict-wiring failure, not the topic-provisioning race in the ticket title; AC1 asks only for a RestartCount above 0 in the dev-lane class step. Draft binding proposed by the assignee's lane (lane=claude-d05a107a); it carries no accepted_by and is evidence only once a different lane re-runs the check and accepts it.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          d=/data/omninode/lakshman/omn20871-readbacks/OMN-20871-lab-repro-confirm-claudeb548-20261010; v="$( { cat "$d/repro.log" "$d/effects-fatal-lines.txt" 2>/dev/null || ssh -o BatchMode=yes -o ConnectTimeout=15 "${ONEX_RUNTIME_SSH_HOST:-jonah@192.168.86.201}" "cat $d/repro.log $d/effects-fatal-lines.txt"; } | awk '/ 5\. rebuild on the omnimarket release v0\.4\.309 and recreate both kernels together$/ { step++ } / done: effects RestartCount=[0-9]+ main RestartCount=[0-9]+$/ { fin++; r = $0; sub(/^.* effects RestartCount=/, "", r); sub(/ .*$/, "", r); restarts = r + 0 } /ONEX runtime failed with unexpected error/ { failed++ } /Auto-wiring failed for .*SecretResolutionError: Secret reference .GH_TOKEN. / { named++ } END { if (step == 1 && fin == 1 && restarts > 0 && failed > 0 && named == failed) printf "AC1-OK effects_restart_count=%d runtime_failures=%d naming_gh_token=%d\n", restarts, failed, named; else printf "AC1-FAIL step=%d done=%d effects_restart_count=%d runtime_failures=%d naming_gh_token=%d\n", step, fin, restarts, failed, named }' )"; printf '%s\n' "$v"; printf '%s\n' "$v" | grep -Eq '^AC1-OK effects_restart_count=[1-9][0-9]* runtime_failures=[1-9][0-9]* naming_gh_token=[1-9][0-9]*$'
    binds_ac:
      - "AC1"
    ac_bindings:
      - label: "AC1"
        criterion_hash: "9690412205835b520180a35e75de937fffdde9208be33d3007674f050c15c876"
        proposed_by: "lane=claude-d05a107a"
  - id: "dod-omn20871-ac2-lab-three-clean-runs-no-token"
    description: |-
      AC2, recorded lab readback. The check reads two files of the 2026-10-10 lab runs on .201 (15:09Z to 15:37Z, same isolated compose project), kept on the lab host in /data/omninode/lakshman/omn20871-readbacks/OMN-20871-ac2-omnimarket3707-claudeb548-20261010: verify3707.log (sha256 f0559a97a788e039acfa7e5cf95cfedf6544de46a729d773bc6811a4491ff738) and dev-lane-class.override.yml (sha256 27bcd1b836713141b96b7b13ad8467f741d8671733a52c75cffe7e2ae272a4d8). It reads them locally when the host holds the folder and otherwise over ssh (read-only cat). It is green only when the log has one build line naming omnimarket cbe1b90f8f16c41c18c955000b55917b434cfffe (the head commit of omnimarket#3707, merged to dev as 5d34272a41bf), exactly three runs started as 'recreate both kernels together, plain strict override', and exactly three results numbered 1, 2, 3 that each read pass within 900 s with main=running/healthy/r=0 and effects=running/healthy/r=0, omnimarket 0.4.310 inside runtime-effects and 0 fatal lines (recorded: 419 s, 412 s, 432 s); and when the override binds ONEX_WIRING_STRICT_MODE on both kernels and has no GH_TOKEN or GITHUB_TOKEN line, so the three runs did not rest on the token binding that omnibase_infra#4802 added to CI. It is red on two or four runs, a restart on either kernel, a fatal line, a run that is not pass or not healthy, a token line in the override, and a missing or empty file. What it does not prove: it does not re-run the lab step or read a live container; r=0 is the run script's rendering of docker inspect RestartCount, written by this lane and not by the product; and it says nothing about an omnimarket release that carries the fix. Draft binding proposed by the assignee's lane (lane=claude-d05a107a); it carries no accepted_by and is evidence only once a different lane re-runs the check and accepts it.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          d=/data/omninode/lakshman/omn20871-readbacks/OMN-20871-ac2-omnimarket3707-claudeb548-20261010; v="$( { cat "$d/verify3707.log" "$d/dev-lane-class.override.yml" 2>/dev/null || ssh -o BatchMode=yes -o ConnectTimeout=15 "${ONEX_RUNTIME_SSH_HOST:-jonah@192.168.86.201}" "cat $d/verify3707.log $d/dev-lane-class.override.yml"; } | awk '$2 == "build" && $4 == "omnimarket" && $5 == "cbe1b90f8f16c41c18c955000b55917b434cfffe" { build++ } $2 == "run" && $4 == "recreate" && /recreate both kernels together, plain strict override$/ { started++ } $2 == "run" && $4 != "recreate" { results++; secs = $5; gsub(/[^0-9]/, "", secs); if ($3 == (results ":") && $4 == "pass" && secs != "" && secs + 0 <= 900 && $6 == "main=running/healthy/r=0" && $7 == "effects=running/healthy/r=0);" && $0 ~ /; omnimarket in effects: 0\.4\.310; fatal lines: 0; /) clean++ } /ONEX_WIRING_STRICT_MODE: .1.$/ { strict++ } /GH_TOKEN|GITHUB_TOKEN/ { token++ } END { if (build == 1 && started == 3 && results == 3 && clean == 3 && strict == 2 && token == 0) printf "AC2-OK runs=%d clean_runs=%d strict_bindings=%d github_token_lines=%d\n", results, clean, strict, token; else printf "AC2-FAIL build=%d started=%d runs=%d clean_runs=%d strict_bindings=%d github_token_lines=%d\n", build, started, results, clean, strict, token }' )"; printf '%s\n' "$v"; printf '%s\n' "$v" | grep -Eq '^AC2-OK runs=3 clean_runs=3 strict_bindings=2 github_token_lines=0$'
    binds_ac:
      - "AC2"
    ac_bindings:
      - label: "AC2"
        criterion_hash: "b76e864b5e37d542cb3dd4ae805a0453e0d6dbe988b054e467ab6952eaa4d500"
        proposed_by: "lane=claude-d05a107a"
  - id: "dod-omn20871-ac3-crash-loop-gate-and-900s-budget"
    description: |-
      AC3, two legs at the omnibase_infra checkout. (1) Three tests of tests/ci/test_runtime_boot_dev_lane_class_omn17427.py, which run the workflow's own step text: the five dev-lane class steps exist in order with no `if` and no continue-on-error (not skipped, not advisory), the crash-loop gate passes two steady kernels, and it fails when either kernel reports a RestartCount above 0 (a stub docker reporting 3). (2) A scoped read of .github/workflows/reusable-runtime-boot.yml: there is exactly one step named 'Dev-lane class -- both kernels stay healthy and running with no restart (crash-loop gate)', it assigns its deadline exactly once, that assignment is the clock plus 900, and the loop still compares the clock against it. Unlike a line-count diff against fdd3daa03 this stays green when unrelated lines of the workflow change (omnibase_infra#4805 changed one). What it leaves unpinned: the 120 s hold after healthy (8 polls of 15 s) and the poll interval; the job's timeout-minutes; whether ci.yml still calls the catalog-local job and whether that check is required; and the deadline behaviour is pinned by text, not by execution (the tests stub sleep and never reach the deadline). It reads whichever revision is checked out; the receipt records which. Draft binding proposed by the assignee's lane (lane=claude-d05a107a); it carries no accepted_by and is evidence only once a different lane re-runs the check and accepts it.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          env -u PYTHONPATH uv run pytest "tests/ci/test_runtime_boot_dev_lane_class_omn17427.py::test_the_phase_runs_in_order_after_the_laptop_checks_and_before_the_log_tail" "tests/ci/test_runtime_boot_dev_lane_class_omn17427.py::test_the_gate_passes_two_steady_kernels" "tests/ci/test_runtime_boot_dev_lane_class_omn17427.py::test_the_gate_fails_a_restarting_kernel" -q -p no:randomly && awk 'index($0, "- name: Dev-lane class -- both kernels stay healthy and running with no restart (crash-loop gate)") { gate = 1; steps++; next } gate && /^      - name: / { gate = 0 } gate && /deadline=/ { assigned++; if (index($0, "deadline=$(( $(date +%s) + 900 ))")) budget++ } gate && index($0, "-ge \"$deadline\" ]; then") { enforced++ } END { if (steps == 1 && assigned == 1 && budget == 1 && enforced == 1) print "AC3-OK gate_steps=1 deadline_assignments=1 budget_900s=1 deadline_enforced=1"; else printf "AC3-FAIL gate_steps=%d deadline_assignments=%d budget_900s=%d deadline_enforced=%d\n", steps, assigned, budget, enforced }' .github/workflows/reusable-runtime-boot.yml | grep -E '^AC3-OK gate_steps=1 deadline_assignments=1 budget_900s=1 deadline_enforced=1$'
        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac:
      - "AC3"
    ac_bindings:
      - label: "AC3"
        criterion_hash: "541e20588965fc700750855302fa16658d663c598c3cd7a8e933150420d584b7"
        proposed_by: "lane=claude-d05a107a"
  - id: "dod-omn20871-ac4-catalog-local-merge-group-4798"
    description: |-
      AC4, check-runs API readback; the command is the one the unmerged onex_change_control#13590 proposed for this criterion. It lists the check runs named 'Runtime Boot Laptop Profile (catalog local) / runtime-boot (mode=catalog-local)' on cd6fc094ea5befc8e4aa521c40f924cf930e9860, the commit that landed omnibase_infra#4798 on dev, resolves each to its workflow run, and is green only when one of them reads success for a merge_group run on a gh-readonly-queue/dev/pr-4798- branch (read 2026-10-12T04:42Z: success, run 38067585409, merge_group, gh-readonly-queue/dev/pr-4798-8386b0dfb31e7e62abd42bc8ac382cc49f00fc29). An empty readback, another event or another pull request's queue branch is red. What it does not prove: it reads GitHub's record of that run, which a re-run of the job would rewrite; it says nothing about later merge_group runs. Draft binding proposed by the assignee's lane (lane=claude-d05a107a); it carries no accepted_by and is evidence only once a different lane re-runs the check and accepts it.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          out="$(gh api "repos/OmniNode-ai/omnibase_infra/commits/cd6fc094ea5befc8e4aa521c40f924cf930e9860/check-runs?per_page=100" --paginate --jq '.check_runs[] | select(.name=="Runtime Boot Laptop Profile (catalog local) / runtime-boot (mode=catalog-local)") | "\(.conclusion) \(.details_url)"' | while read -r c u; do run="${u#*/runs/}"; run="${run%%/*}"; echo "$c $(gh api "repos/OmniNode-ai/omnibase_infra/actions/runs/$run" --jq '"\(.id) \(.event) \(.head_branch)"')"; done)"; echo "$out"; echo "$out" | awk '$1=="success" && $3=="merge_group" && $4 ~ /pr-4798-/ {ok=1} END {exit !ok}'
        cwd: "${OMNI_HOME}"
    binds_ac:
      - "AC4"
    ac_bindings:
      - label: "AC4"
        criterion_hash: "0bb748c55ca04dbacc4d26902079ff0f2be6157f072ab85b78110f72562936b8"
        proposed_by: "lane=claude-d05a107a"
