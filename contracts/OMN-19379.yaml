        statement: |-
          AC1: CI Summary does not count a check-run written by a draft-era run once the pull request is ready and a ready-state run exists for the head, proven by a replay test that fails today -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q with a fixture built from omnibase_infra#4039 head 11cac752a (draft-era cancelled matrix row, skipped deploy-gate and zone-filter, every ready-state row green) asserting SUCCESS; the current gate returns FAILURE on it
      - id: "AC2"
        statement: |-
          AC2: A draft-era row whose name has no ready-state counterpart at all is still refused, under a distinct outcome token naming the row and its draft-era run id, never silently dropped -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q with a fixture holding a draft-era failure row and no ready-state counterpart, asserting a non-success verdict and the outcome token
      - id: "AC3"
        statement: |-
          AC3: A genuine failure in a ready-state run still fails immediately, as a positive control -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q with a fixture holding one ready-state failure row, asserting FAILURE on the first poll
      - id: "AC4"
        statement: |-
          AC4: On a live draft-first pull request, the CI Summary check-run reads success on the same head sha that was a draft, with no new head pushed after the flip -- falsifier: gh api repos/OmniNode-ai/omnibase_infra/commits/<head>/check-runs readback of the CI Summary row for that sha, recorded on this ticket with the pull request number
