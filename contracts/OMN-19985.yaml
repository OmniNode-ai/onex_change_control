      red. It binds no criterion: the others are proven in omnimarket#3510 and the lab, and binding one
      alone is refused as partial.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/migrations/test_omn19985_tenant_credentials_fingerprint_vendor.py
          -q"
        cwd: "${OMNI_HOME}/omnibase_infra"
