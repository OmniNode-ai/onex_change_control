  - id: "dod-omn19985-ac3-lab-page-read-2026-10-12"
    description: >-
      AC3, the criterion's own falsifier: the lab-step page read, taken on merged code on 2026-10-12 04:26-04:29Z
      (omnimarket dev f13713368f27 with omnimarket#3510, omnidash dev c1eadc47a255 with omnidash#369)
      on lab host .201 in a fresh install under lakshman's home. The check reads a copy of that step's
      record kept in the lakshman data area on the lab host, readable by other logins (locally when the
      host holds the folder, otherwise over ssh jonah@192.168.86.201) and greps for the probe's single
      verdict line. It passes only when the table headless Chrome rendered has exactly one row for llm.openrouter.api_key,
      that row's Provider and Fingerprint are the ones the tenant-credentials exposure served, its Set
      cell equals the served set_at, the page itself read that exposure with HTTP 200 and has no input
      element, and after the delete the same row's Revoked cell is a time later than Set. So it is red
      on a missing or empty file, an empty table, a row with no Set value, a Set value that differs from
      the served one, a page that never read the exposure, and a page result file that is not the recorded
      one (sha256 5af4f6f3 and 9d623e2b). This answers the refusal of the component test, which rendered
      a hand-built row and read no served rows. Limit, stated plainly: the check reads a record, so its
      exit status depends on what that page read recorded and not on the page as it is today; it cannot
      see a regression after 04:29Z. Read-only: nothing is written on the host. Draft binding by the assignee's
      lane: no accepted_by.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          if test -d /data/omninode/lakshman/omn19985-readbacks/OMN-19985-credentials-lab-merged-20261012T0413Z/page; then lab_py="/usr/bin/python3 -"; else lab_py="ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 /usr/bin/python3 -"; fi
          $lab_py <<'PROBE_19985_AC3' | grep -E '^AC3-OK provider=openrouter ref=llm[.]openrouter[.]api_key set=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z revoked=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+]00:00$'
          """OMN-19985 AC3 check over the recorded lab page read of 2026-10-12 04:26-04:29Z. Read-only.

          AC3: "The page lists the ref with its provider and set time -- falsifier: the lab-step page read".

          It reads three files of that lab step, kept as a copy in the lakshman data area on the lab host:
            page/after-set-result.json     the Credentials table headless Chrome rendered after `onex secret set`
            page/after-delete-result.json  the same page after `onex secret delete`
            work/cred-after-set.txt        the tenant-credentials exposure body the local API served after the set
          and prints one verdict line, AC3-OK or AC3-FAIL. It is red when a file is missing, empty or not the
          recorded one, when the table has no row for the ref, when the row's Provider is not the served one,
          when its Set cell is empty or differs from the set_at the exposure served, when the page made no
          HTTP 200 read of the exposure, when the page has an input element, or when the Revoked cell after
          the delete is not a time later than Set. It reads a record: it cannot see a page that broke later.

          Run on the lab host: python3 - [folder] < this   (the folder defaults to the kept copy).
          """

          import datetime
          import hashlib
          import json
          import os
          import sys

          REF = "llm.openrouter.api_key"
          TOPIC = "onex.snapshot.projection.tenant-credentials.v1"
          RECORDED = {
              "after-set-result.json": "5af4f6f3767847a7dafd8723a8e07dd5fc2adf99dc8163922f88f4ca6f103584",
              "after-delete-result.json": "9d623e2bdbcd80fb7b8d28d76daf5f6366a0bff705bf87d50771914fcf0705ef",
          }


          class Fail(Exception):
              pass


          def need(ok, why):
              if not ok:
                  raise Fail(why)


          def when(text):
              return datetime.datetime.fromisoformat(str(text).replace("Z", "+00:00"))


          def page(root, name):
              """(the table row listing the ref, whether the file is the recorded one)."""
              raw = open(os.path.join(root, "page", name), "rb").read()
              read = json.loads(raw)
              table = read["table"]
              need(len(table) >= 2, name + ": the table has no data row")
              rows = [dict(zip(table[0], cells)) for cells in table[1:]]
              listed = [row for row in rows if row.get("Key ref") == REF]
              need(len(listed) == 1, name + ": rows listing the ref = " + str(len(listed)))
              need(read["nav_status"] == 200 and read["heading"] == "Credentials", name + ": page status or heading")
              need(read["input_elements"] == 0, name + ": the page has an input element")
              need(not read["alerts"] and not read["page_errors"], name + ": the page showed an alert or an error")
              exposure = "/projection/" + TOPIC + "?tenant="
              reads = [r for r in read["projection_requests"] if r["status"] == 200 and exposure in r["url"]]
              need(len(reads) >= 1, name + ": the page made no HTTP 200 read of the exposure")
              return listed[0], hashlib.sha256(raw).hexdigest() == RECORDED[name]


          def verdict(root):
              text = open(os.path.join(root, "work", "cred-after-set.txt")).read()
              lines = [line for line in text.splitlines() if line.strip()]
              need(len(lines) == 2 and lines[1] == "HTTP 200", "served exposure: no body followed by HTTP 200")
              served = json.loads(lines[0])
              need(served["topic"] == TOPIC, "served exposure: wrong topic")
              live = [row for row in served["rows"] if row["name"] == REF]
              need(len(live) == 1, "served exposure: rows for the ref = " + str(len(live)))
              row = live[0]
              need(row["provider"] == "openrouter" and row["revoked_at"] is None, "served row: provider or revoked_at")
              need(bool(row["set_at"]) and bool(row["fingerprint"]), "served row: no set_at or no fingerprint")
              after_set, set_recorded = page(root, "after-set-result.json")
              after_delete, delete_recorded = page(root, "after-delete-result.json")
              need(after_set["Provider"] == row["provider"], "Provider cell is not the served provider")
              need(
                  after_set["Set"] == row["set_at"],
                  "Set cell " + repr(after_set["Set"]) + " is not the served set_at " + repr(row["set_at"]),
              )
              need(after_set["Fingerprint"] == row["fingerprint"], "Fingerprint cell is not the served fingerprint")
              need(after_set["Revoked"] == "Not revoked", "after the set the row does not read Not revoked")
              need(
                  after_delete["Provider"] == row["provider"] and after_delete["Set"] == row["set_at"],
                  "after the delete the Provider or Set cell changed",
              )
              need(
                  when(after_delete["Revoked"]) > when(after_delete["Set"]),
                  "after the delete Revoked is not later than Set",
              )
              need(set_recorded and delete_recorded, "a page result file is not the recorded one (sha256)")
              return (
                  "AC3-OK provider=" + after_set["Provider"] + " ref=" + after_set["Key ref"]
                  + " set=" + after_set["Set"] + " revoked=" + after_delete["Revoked"]
              )


          if __name__ == "__main__":
              default = "/data/omninode/lakshman/omn19985-readbacks/OMN-19985-credentials-lab-merged-20261012T0413Z"
              folder = sys.argv[1] if len(sys.argv) > 1 else default
              try:
                  print(verdict(folder))
              except Exception as error:
                  print("AC3-FAIL " + type(error).__name__ + ": " + str(error))
                  sys.exit(1)
          PROBE_19985_AC3
    binds_ac:
      - "AC3"
    ac_bindings:
      - label: "AC3"
        criterion_hash: "65cb770eb3ba8cd139813e02a37bb864092d58000bda70ca79a3099c0924dc28"
  - id: "dod-omn19985-ac4-real-postgres-parity-2026-10-12"
    description: >-
      AC4, the criterion's falsifier run against a real Postgres, never a skip. The command starts a throwaway
      Postgres 16 container bound to 127.0.0.1:55439 with a name of its own, waits until it answers over
      TCP, points the tests at it, stops it afterwards (it removes itself), and runs test_tenant_credentials_rows_equal_sqlite_and_the_real_postgres_runner
      for all 12 recorded credential event scenarios of tests/test_omn19968_writer_store_parity.py (the
      six carried from OMN-19968 and the six OMN-19985 ones carrying a fingerprint and set time): each
      folds the same events through the real SqliteDatabaseAdapter and through the deployed asyncpg runner
      on a schema built from the node's own migrations, and compares the normalized rows. It also runs
      the three TestRealPostgresFingerprintAndSetAt write-path cases, because parity alone passes when
      both stores lack the columns. These tests skip, with exit 0, when no Postgres answers, so the command
      also fails when the output names a skipped test or has no passed count: a skip is not proof. It
      is red when the container cannot start or never answers, on any row difference, and on any skip.
      It needs Docker on the host that runs it. Selection read from the test files at omnimarket dev f13713368f27:
      15 tests. Draft binding by the assignee's lane: no accepted_by.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          env -u POSTGRES_PASSWORD bash -c 'n="omn19985-ac4-pg-$$"; docker run -d --rm --name "$n" -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=omnibase_infra -p 127.0.0.1:55439:5432 postgres:16-alpine >/dev/null || { echo "AC4-FAIL no Postgres container started"; exit 1; }; i=0; until docker exec "$n" pg_isready -q -h 127.0.0.1 -p 5432 -U postgres -d omnibase_infra 2>/dev/null; do i=$((i+1)); if test "$i" -ge 60; then docker stop "$n" >/dev/null; echo "AC4-FAIL Postgres never became ready"; exit 1; fi; sleep 1; done; out=$(INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT=55439 INTEGRATION_POSTGRES_USER=postgres INTEGRATION_POSTGRES_PASSWORD=trust INTEGRATION_POSTGRES_DB=omnibase_infra uv run pytest tests/test_omn19968_writer_store_parity.py tests/test_omn16316_real_postgres_tenant_credentials_write_path.py -q -rs -p no:randomly -k "tenant_credentials_rows_equal_sqlite_and_the_real_postgres_runner or FingerprintAndSetAt" 2>&1); rc=$?; printf "%s\n" "$out"; docker stop "$n" >/dev/null; test "$rc" -eq 0 || exit "$rc"; case "$out" in *skipped*|*SKIPPED*) echo "AC4-FAIL a test was skipped: no real Postgres was reached"; exit 1;; esac; case "$out" in *[0-9]" passed"*) echo "AC4-OK real Postgres reached, no test skipped";; *) echo "AC4-FAIL the output has no passed count"; exit 1;; esac'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - "AC4"
    ac_bindings:
      - label: "AC4"
        criterion_hash: "d7b4e8547bf1bea5b6cf1d1e7a8e32118991079af5c9e5b8cc26ce31baafa306"
  - id: "dod-omn19985-ac3-lab-page-read-2026-10-12-v2"
    description: >-
      Supersedes dod-omn19985-ac3-lab-page-read-2026-10-12. That item's wrapper piped the probe into the
      match for its verdict line, so in a shell without pipefail a remote read that printed the valid
      line and then dropped was graded on the line alone. This item runs the same probe, unchanged, and
      also requires that the probe and the match each exited 0. What follows is that item's description,
      which still holds. AC3, the criterion's own falsifier: the lab-step page read, taken on merged code
      on 2026-10-12 04:26-04:29Z (omnimarket dev f13713368f27 with omnimarket#3510, omnidash dev c1eadc47a255
      with omnidash#369) on lab host .201 in a fresh install under lakshman's home. The check reads a
      copy of that step's record kept in the lakshman data area on the lab host, readable by other logins
      (locally when the host holds the folder, otherwise over ssh jonah@192.168.86.201) and greps for
      the probe's single verdict line. It passes only when the table headless Chrome rendered has exactly
      one row for llm.openrouter.api_key, that row's Provider and Fingerprint are the ones the tenant-credentials
      exposure served, its Set cell equals the served set_at, the page itself read that exposure with
      HTTP 200 and has no input element, and after the delete the same row's Revoked cell is a time later
      than Set. So it is red on a missing or empty file, an empty table, a row with no Set value, a Set
      value that differs from the served one, a page that never read the exposure, and a page result file
      that is not the recorded one (sha256 5af4f6f3 and 9d623e2b). This answers the refusal of the component
      test, which rendered a hand-built row and read no served rows. Limit, stated plainly: the check
      reads a record, so its exit status depends on what that page read recorded and not on the page as
      it is today; it cannot see a regression after 04:29Z. Read-only: nothing is written on the host.
      Draft binding by the assignee's lane: no accepted_by.
    source: "manual"
    execution_scope: "local_done_gate"
    evidence_artifact: "supersedes_dod_evidence:dod-omn19985-ac3-lab-page-read-2026-10-12"
    checks:
      - check_type: "command"
        check_value: |-
          if test -d /data/omninode/lakshman/omn19985-readbacks/OMN-19985-credentials-lab-merged-20261012T0413Z/page; then lab_py="/usr/bin/python3 -"; else lab_py="ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 /usr/bin/python3 -"; fi
          $lab_py <<'PROBE_19985_AC3' | grep -E '^AC3-OK provider=openrouter ref=llm[.]openrouter[.]api_key set=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z revoked=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+]00:00$'
          """OMN-19985 AC3 check over the recorded lab page read of 2026-10-12 04:26-04:29Z. Read-only.

          AC3: "The page lists the ref with its provider and set time -- falsifier: the lab-step page read".

          It reads three files of that lab step, kept as a copy in the lakshman data area on the lab host:
            page/after-set-result.json     the Credentials table headless Chrome rendered after `onex secret set`
            page/after-delete-result.json  the same page after `onex secret delete`
            work/cred-after-set.txt        the tenant-credentials exposure body the local API served after the set
          and prints one verdict line, AC3-OK or AC3-FAIL. It is red when a file is missing, empty or not the
          recorded one, when the table has no row for the ref, when the row's Provider is not the served one,
          when its Set cell is empty or differs from the set_at the exposure served, when the page made no
          HTTP 200 read of the exposure, when the page has an input element, or when the Revoked cell after
          the delete is not a time later than Set. It reads a record: it cannot see a page that broke later.

          Run on the lab host: python3 - [folder] < this   (the folder defaults to the kept copy).
          """

          import datetime
          import hashlib
          import json
          import os
          import sys

          REF = "llm.openrouter.api_key"
          TOPIC = "onex.snapshot.projection.tenant-credentials.v1"
          RECORDED = {
              "after-set-result.json": "5af4f6f3767847a7dafd8723a8e07dd5fc2adf99dc8163922f88f4ca6f103584",
              "after-delete-result.json": "9d623e2bdbcd80fb7b8d28d76daf5f6366a0bff705bf87d50771914fcf0705ef",
          }


          class Fail(Exception):
              pass


          def need(ok, why):
              if not ok:
                  raise Fail(why)


          def when(text):
              return datetime.datetime.fromisoformat(str(text).replace("Z", "+00:00"))


          def page(root, name):
              """(the table row listing the ref, whether the file is the recorded one)."""
              raw = open(os.path.join(root, "page", name), "rb").read()
              read = json.loads(raw)
              table = read["table"]
              need(len(table) >= 2, name + ": the table has no data row")
              rows = [dict(zip(table[0], cells)) for cells in table[1:]]
              listed = [row for row in rows if row.get("Key ref") == REF]
              need(len(listed) == 1, name + ": rows listing the ref = " + str(len(listed)))
              need(read["nav_status"] == 200 and read["heading"] == "Credentials", name + ": page status or heading")
              need(read["input_elements"] == 0, name + ": the page has an input element")
              need(not read["alerts"] and not read["page_errors"], name + ": the page showed an alert or an error")
              exposure = "/projection/" + TOPIC + "?tenant="
              reads = [r for r in read["projection_requests"] if r["status"] == 200 and exposure in r["url"]]
              need(len(reads) >= 1, name + ": the page made no HTTP 200 read of the exposure")
              return listed[0], hashlib.sha256(raw).hexdigest() == RECORDED[name]


          def verdict(root):
              text = open(os.path.join(root, "work", "cred-after-set.txt")).read()
              lines = [line for line in text.splitlines() if line.strip()]
              need(len(lines) == 2 and lines[1] == "HTTP 200", "served exposure: no body followed by HTTP 200")
              served = json.loads(lines[0])
              need(served["topic"] == TOPIC, "served exposure: wrong topic")
              live = [row for row in served["rows"] if row["name"] == REF]
              need(len(live) == 1, "served exposure: rows for the ref = " + str(len(live)))
              row = live[0]
              need(row["provider"] == "openrouter" and row["revoked_at"] is None, "served row: provider or revoked_at")
              need(bool(row["set_at"]) and bool(row["fingerprint"]), "served row: no set_at or no fingerprint")
              after_set, set_recorded = page(root, "after-set-result.json")
              after_delete, delete_recorded = page(root, "after-delete-result.json")
              need(after_set["Provider"] == row["provider"], "Provider cell is not the served provider")
              need(
                  after_set["Set"] == row["set_at"],
                  "Set cell " + repr(after_set["Set"]) + " is not the served set_at " + repr(row["set_at"]),
              )
              need(after_set["Fingerprint"] == row["fingerprint"], "Fingerprint cell is not the served fingerprint")
              need(after_set["Revoked"] == "Not revoked", "after the set the row does not read Not revoked")
              need(
                  after_delete["Provider"] == row["provider"] and after_delete["Set"] == row["set_at"],
                  "after the delete the Provider or Set cell changed",
              )
              need(
                  when(after_delete["Revoked"]) > when(after_delete["Set"]),
                  "after the delete Revoked is not later than Set",
              )
              need(set_recorded and delete_recorded, "a page result file is not the recorded one (sha256)")
              return (
                  "AC3-OK provider=" + after_set["Provider"] + " ref=" + after_set["Key ref"]
                  + " set=" + after_set["Set"] + " revoked=" + after_delete["Revoked"]
              )


          if __name__ == "__main__":
              default = "/data/omninode/lakshman/omn19985-readbacks/OMN-19985-credentials-lab-merged-20261012T0413Z"
              folder = sys.argv[1] if len(sys.argv) > 1 else default
              try:
                  print(verdict(folder))
              except Exception as error:
                  print("AC3-FAIL " + type(error).__name__ + ": " + str(error))
                  sys.exit(1)
          PROBE_19985_AC3
          test "${PIPESTATUS[0]}${PIPESTATUS[1]}" = "00"
    binds_ac:
      - "AC3"
    ac_bindings:
      - label: "AC3"
        criterion_hash: "65cb770eb3ba8cd139813e02a37bb864092d58000bda70ca79a3099c0924dc28"
