---
schema_version: "1.0.0"
ticket_id: "OMN-19985"
title: "Credentials page lists provider key refs from credential events, never a value"
summary: "Hand-authored OCC evidence companion (OMN-15247) for OMN-19985, covering omnidash#369 (occ-autobind
  found no RED-derivable candidate) and omnimarket#3510 (a draft, so occ-autobind declined with skip:PR_DRAFT)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The handler's credential-registered event bytes do not contain a planted value, its fingerprint is `sha256(value)[:8]`, and revoke returns the mirror event; both delivery orders, a duplicate delivery and a delete-then-set give the expected rows -- falsifier: uv run pytest tests/nodes/node_local_secret_store_effect -q fails
      - id: "AC2"
        statement: |-
          AC2: The planted value appears in no event, no projection row and no HTTP response -- falsifier: grep for the value across the event log, the store file and a page HAR returns a match
      - id: "AC3"
        statement: |-
          AC3: The page lists the ref with its provider and set time -- falsifier: the lab-step page read
      - id: "AC4"
        statement: |-
          AC4: `node_projection_tenant_credentials` gives equal normalized rows through the real SQLite adapter and the real Postgres adapter for the same recorded credential event fixtures (carried from OMN-19968 by the 2026-10-02T00:28:39Z ruling) -- falsifier: the omnimarket parity test `tests/test_omn19968_writer_store_parity.py` run with uv run pytest shows a row difference
evidence_requirements:
  - kind: "tests"
    description: |-
      Behavior proof for PR #369 on OmniNode-ai/omnidash: the Credentials page test it adds, executed at cwd `${OMNI_HOME}/omnidash`.
    command: "npm test -- --run src/pages/LocalDashboardPage.omn19985.test.tsx"
  - kind: "tests"
    description: |-
      Behavior proof for PR #3510 on OmniNode-ai/omnimarket: the node and golden-chain tests it adds, executed at cwd `${OMNI_HOME}/omnimarket`.
    command: "uv run pytest tests/nodes/node_local_secret_store_effect/test_omn19985_local_secret_store.py
      tests/nodes/node_local_secret_store_effect/test_golden_chain_local_secret_store_effect.py -q"
  - kind: "tests"
    description: |-
      Behavior proof for PR #4669 on OmniNode-ai/omnibase_infra: the vendor test for the tenant-credentials fingerprint and set-time migration it adds, executed at cwd `${OMNI_HOME}/omnibase_infra`.
    command: "uv run pytest tests/unit/migrations/test_omn19985_tenant_credentials_fingerprint_vendor.py
      -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnidash-pr-369-code"
    description: >-
      PR #369 on OmniNode-ai/omnidash: hosted code fact at the PR head 7dd990f071e4. The Credentials table
      in src/pages/LocalDashboardPage.tsx reads the served set_at field; the same grep finds 0 on dev
      a6ae9c07dcb6, so it can go red. The behaviour proof is the local item dod-OmniNode-ai-omnidash-pr-369.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnidash/contents/src/pages/LocalDashboardPage.tsx?ref=7dd990f071e48826a0675960273ff46afc2fb77a --jq '.content' | base64 -d | grep -c 'set_at'
  - id: "dod-OmniNode-ai-omnidash-pr-369"
    description: >-
      PR #369 on OmniNode-ai/omnidash, hand-authored companion (OMN-15247); occ-autobind minted none ("no
      changed-file candidate is RED-derivable": only TypeScript and PNG changed). #369 shows each provider
      key ref with its served fingerprint prefix and set time on the Credentials page, typed Not recorded
      when a row carries neither, never a value. The check runs the page test that decides it (K1-K4):
      4 passed at the PR head 5e2535339c2f; before the change the same file failed 4 of 4, so the check
      can go red. It binds no criterion: the others are proven in omnimarket#3510 and the lab, and binding
      one alone is refused as partial.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "npm test -- --run src/pages/LocalDashboardPage.omn19985.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-OmniNode-ai-omnimarket-pr-3510-code"
    description: >-
      PR #3510 on OmniNode-ai/omnimarket: hosted code fact at the PR head 74f22b2890af (the node directory
      is byte-identical at the later heads 44dca661b13c). The new node's handler defines fingerprint_prefix,
      the sha256(value)[:8] the credential events carry; on dev e565ba5ba00c the file does not exist,
      so the read fails and the check goes red. The behaviour proof is the local item dod-OmniNode-ai-omnimarket-pr-3510.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_local_secret_store_effect/handlers/handler_local_secret_store.py?ref=74f22b2890afcebc03d90cae934edfdb09b20789 --jq '.content' | base64 -d | grep -c 'def fingerprint_prefix'
  - id: "dod-OmniNode-ai-omnimarket-pr-3510"
    description: >-
      PR #3510 on OmniNode-ai/omnimarket, hand-authored companion (OMN-15247): the PR is a draft, so occ-autobind
      declined it (skip:PR_DRAFT). The check runs the node and golden-chain tests: 13 passed at the PR
      branch, and each of four mutations (fingerprint over the wrong bytes, the value in event metadata,
      a re-set that does not revoke, a delete with no event) turns 1 to 5 of them red. It binds no criterion
      here: omnimarket's own contracts/OMN-19985.yaml binds all four to tests, and the page halves of
      AC2 and AC3 are the .201 lab readback cited on the PR.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_local_secret_store_effect/test_omn19985_local_secret_store.py
          tests/nodes/node_local_secret_store_effect/test_golden_chain_local_secret_store_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-OmniNode-ai-omnibase_infra-pr-4669-code"
    description: >-
      PR #4669 on OmniNode-ai/omnibase_infra: hosted code fact at the PR head 8c8580568010. The vendored
      node_projection_tenant_credentials 0005 migration adds the nullable set_at TIMESTAMPTZ column; on
      dev ed01b6ddb3d0 the file does not exist, so the read fails and the check goes red. The behaviour
      proof is the local item dod-OmniNode-ai-omnibase_infra-pr-4669.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/contents/docker/migrations/forward/nodes/node_projection_tenant_credentials/0005_tenant_credentials_fingerprint_and_set_at.sql?ref=8c8580568010e5a39710e5089191aadccaf7f2f6 --jq '.content' | base64 -d | grep -c 'ADD COLUMN IF NOT EXISTS set_at TIMESTAMPTZ'
  - id: "dod-OmniNode-ai-omnibase_infra-pr-4669"
    description: >-
      PR #4669 on OmniNode-ai/omnibase_infra, hand-authored companion (OMN-15247): no OCC coverage existed
      for it. #4669 vendors omnimarket#3510's node_projection_tenant_credentials 0005 migration (nullable
      fingerprint TEXT and set_at TIMESTAMPTZ) byte for byte, sha256 1e1d52343ccd, with one exact ledger
      row and an expand-only class, so the lane runners apply it. The check runs the vendor test: 4 passed
      at the PR head 8c8580568010. Each of five mutations of a scratch export (one byte appended to the
      SQL, the ledger row removed, the class set to forward-only, a generation_id column added, the file
