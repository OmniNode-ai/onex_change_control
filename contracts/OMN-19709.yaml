      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: no reconcile script feeds command output to a loop or read through a here-string or here-document, so its writes can never block on its own pipe -- falsifier: a pytest that greps scripts/reconcile-host.sh and scripts/reconcile-workspace-venvs.sh for <<< fed by a variable that holds command output, plus a pytest that runs lane_hook_report with a stubbed status command printing 200 KiB and asserts it returns within 30 s
      - id: "AC2"
        statement: |-
          AC2: each step that reconcile-host delegates runs under a wall-clock budget. On expiry the holder kills its own child process group, reports TIMEOUT with the step name and budget, releases the lock and exits non-zero -- falsifier: a pytest that stubs the venv delegate with sleep 600, sets the budget to 2 s, and asserts exit within 20 s, a TIMEOUT line naming the step, and no lock directory left behind
      - id: "AC3"
        statement: |-
          AC3: a tick that finds a live holder older than the maximum age reports STALE-LIVE-HOLDER with the pid and its age, and exits with a code that is not the ordinary declined code, so the tick log cannot read it as routine -- falsifier: a pytest that seeds the holder record with a live sleeping child pid and a start time 3 h old, and asserts the distinct exit code and the pid and age in the output, paired with a 1-minute-old live holder that is still declined with the ordinary code
      - id: "AC4"
        statement: |-
          AC4: onex delegate --help below the floor prints usage with a warning instead of exiting 3, because help mints no evidence, while onex delegate <prompt> below the floor is still refused -- falsifier: uv run pytest tests/scripts/test_onex_wrapper_floor_omn17309.py -k help_on_an_evidence (fails on the dev wrapper, with a positive control on the refusal)
