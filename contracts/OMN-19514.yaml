title: "Autobind OCC evidence for OMN-19514"
summary: "OCC Evidence-Source autobind companion (OMN-13317 F1) for PR #4102."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: onex delegate --ticket OMN-n writes the ticket into the delegate request metadata, refuses a malformed ticket id before anything is published, derives the ticket from an omni_worktrees/OMN-n path when the flag is absent, and records none otherwise -- falsifier: uv run pytest tests/unit/cli/test_cli_delegate_ticket.py in omnibase_infra
      - id: "AC2"
        statement: |-
          AC2: the delegation projection handler writes ticket_id from a terminal that carries one, names no ticket column for a terminal that carries none so a re-emit leaves a stored ticket alone, and a malformed ticket never dead-letters the delegation row -- falsifier: uv run pytest tests/unit/delegation/test_delegation_ticket_id_projection.py plus the real-Postgres write-path test in omnimarket
      - id: "AC3"
        statement: |-
          AC3: a terminal carrying ticket_id is decoded by the released consumer before any producer emits it, and the producer omits the key when no ticket was supplied -- falsifier: uv run python scripts/ci/check_wire_compatibility.py in omnimarket plus a pytest old-consumer replay fixture
      - id: "AC4"
        statement: |-
          AC4: dod_verify takes a delegation correlation id on its start command and the verdict row stores it, while a verdict with none stores NULL and serialises no key -- falsifier: uv run pytest tests/test_omn18901_real_postgres_producer_payload_write_path.py and the dod verdict projection tests in omnimarket
      - id: "AC5"
        statement: |-
          AC5: the two migrations are vendored in omnibase_infra with their ledger rows and migration classes -- falsifier: uv run pytest tests/unit/scripts/validation/test_application_migration_manifest.py in omnibase_infra
      - id: "AC6"
        statement: |-
          AC6: on the .201 dev lane one delegation run started with a ticket writes a delegation_events row carrying that ticket, one DoD verify run given that delegation correlation id writes a dod_verify_runs row carrying it, and the SQL join of the two tables on correlation id returns that row -- falsifier: the psql join in the Probe line run on .201, with a positive control on a correlation id known to exist
evidence_requirements:
  - kind: "ci"
    description: "PR #4102 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
