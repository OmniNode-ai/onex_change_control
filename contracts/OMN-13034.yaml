title: "B-6: Lane-census ratchet — census timer emits machine-readable lane map; CLAUDE.md lane table
  becomes a generated block"
summary: >-
  Ships and maintains the lane-census ratchet (retro B-6): a CI staleness gate (lane-census-staleness.yml)
  that fails if the census snapshot is missing or older than 7 days; a pre-commit attestation gate (check_lane_attestation.py)
  that rejects lane-boundary attestation language without a same-session verified annotation; a CLAUDE.md
  lane table generator (generate_claude_lane_block.py) that derives from lane-manifest.yaml + census-snapshot.json;
  and an E-5 env-vs-manifest drift checker (check_lane_env_drift.py, OMN-13018). The current refresh PR
  updates the committed census snapshot from .201 and preserves live drift findings rather than masking
  them.
