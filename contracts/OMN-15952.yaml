ticket_id: OMN-15952
title: Unattended pairing/renewal contract for persistent runtimes across attach-token expiry
summary: 'OCC companion for OmniNode-ai/omnibase_infra PR #2746 and OmniNode-ai/omninode_infra PR #904.
  A persistent/headless runtime attaching to node_gateway_attach_effect was told how often to heartbeat
  and nothing else: the terms of surviving its own session ceiling were undeclared, and the most natural
  client assumption (a heartbeat keeps the session alive) is false -- expires_at is stamped once at attach
  and no path in the node moves it. This companion binds the evidence that the renewal cycle is now a
  declared contract term (mode RE_ATTACH, a jitter window strictly before an immutable ceiling), that
  the directive is REQUIRED on the node''s attach response rather than optional, that the ordering invariant
  is enforced in the model and not merely in the builder, and that the onex-api edge -- which validates
  the node''s response with extra=forbid and would 502 every attach otherwise -- carries a field-set-equal
  mirror.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
