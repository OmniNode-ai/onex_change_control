    acceptance:
      - id: "AC1"
        statement: |-
          AC1: when the deploy agent's own dev-only verify path force-recreates omninode-runtime within a single job's run and that job still ends success, the compose-dev lab-pass receipt's convergence-generation capture and its probe_generation_bound read agree on the SAME (post-recreate) container id. Falsifier: reproduce a job whose verify path force-recreates exactly once and completes success, and assert the receipt's convergence step and probe_generation_bound check read the same container id.
      - id: "AC2"
        statement: |-
          AC2: the evidence distinguishes this case (single job, in-job self-recovery) from OMN-18990's case (a different queued command displacing the lane while this job's receipt is pending) — a lane reading the FAIL should not have to re-derive by hand which one happened, as runtime-train and core-1745 both did. Falsifier: the evidence line for this case is byte-identical to the OMN-18990 backlog-displacement case, giving no way to tell them apart from the receipt alone.
      - id: "AC3"
        statement: |-
          AC3 (positive control): a job whose verify path does NOT force-recreate still produces a receipt where convergence and probe container ids match, and a recreate that genuinely leaves the wrong image/revision running still fails probe_generation_bound. Falsifier: the fix passes probe_generation_bound for every recreate regardless of what image/revision the post-recreate container is actually running.
