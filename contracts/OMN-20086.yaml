        statement: |-
          AC1: The model records an off-host intent bound to exact subject, contract revision, and allocated attempt sequence before dispatch; unconfirmed or lost evidence cannot admit; highest allocated attempt governs admission; replay confirmation remains one logical attempt; and foreign or stale bindings cannot dispatch -- falsifier: any TLC design state violates the named invariant, or any named M1–M8 mutant does not violate its required invariant.
      - id: "AC2"
        statement: |-
          AC2: The committed TLC summary binds its design and each M1–M8 configuration outcome to the current model and configuration digests, and the integrity guard fails if a covered model/config digest or expected named outcome is changed without refreshed proof -- falsifier: the integrity test accepts a changed covered digest or wrong design/mutant outcome.
      - id: "AC3"
        statement: |-
          AC3: An independent review verifies the model’s C6 loss semantics: losing a local unconfirmed PASS retains durable intent, changes the result to UNRESOLVED with no artifact, and cannot admit or confirm that result without durable recovery evidence -- falsifier: a model transition admits, confirms, or retains a local artifact after that loss. Validation: official TLA+ v1.8.0 tla2tools.jar, formal/durable_evidence_delivery/run_all.sh, and uv run --no-sync pytest tests/formal/test_durable_evidence_delivery_model.py -q. Dependency: the parent OR.3 remains Backlog and runtime implementation remains blocked on OMN-20070 / OR.2 release.
