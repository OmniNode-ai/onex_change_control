---
schema_version: "1.0.0"
ticket_id: "OMN-15228"
title: "B1 (omnimarket): container-driven DI for HandlerCodeEmbeddingEffect"
summary: >
  OCC companion evidence for omnimarket branch jonah/omn-15228-container-di at commit 1e174b126fc2fb1bb981805981ecb69e6bc4e37a.
  Slice B1 of OMN-15027: HandlerCodeEmbeddingEffect took a required, default-less repository ctor param
  outside the boot resolver KNOWN_INJECTABLE set (event_bus, container, ownership_query), so it would
  quarantine at boot and trip the OMN-13551 guard the moment the node contract moves to the nested handler
  schema. The ctor now takes only the injectable container; ProtocolCodeEntityRepository is resolved at
  the effect boundary inside handle() and fails loud when no provider is registered. The def-B handle
  signature is unchanged. Ctor-shape only — the contract.yaml nested conversion is the sequential B3 slice,
  and provisioning a production ProtocolCodeEntityRepository (zero implementations exist repo-wide) is
  tracked in OMN-15230; this companion claims no runtime functionality. Seam deliverable (changed): __init__(self,
  container: ModelONEXContainer, qdrant_client: Any | None = None). Seam deliverable (unchanged, definition-B):
  handle(payload: ModelCodeEmbeddingRequest) -> ModelCodeEmbeddingResult.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "ci"
    description: "Product PR CI green on omnimarket branch jonah/omn-15228-container-di."
    command: "gh pr checks ${PR_NUMBER} --repo OmniNode-ai/omnimarket"
