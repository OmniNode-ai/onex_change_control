          AC1 — A ruling is recorded on this ticket stating whether the customer journey is intended to use one Keycloak client end to end or two, and if two, that the second credential entry is deliberate. Falsified by: the ticket reaching a terminal state with no such statement, or with a statement that contradicts the shipped config read at the closing SHA.
      - id: "AC2"
        statement: |-
          AC2 — The guide's published sign-up URL, followed verbatim in one browser session with no second credential entry, ends on an authenticated dashboard page. Falsified by: the run ending on the public landing page, on /login, or on any screen that prompts for username or password after the email verification link is clicked.
      - id: "AC3"
        statement: |-
          AC3 — m3-signon-walk-chain.yml asserts the guide's documented entry point, not /login, and the assertion fails when the code is left unconsumed. Falsified by: the workflow file at the closing SHA containing no reference to the registrations endpoint or to client_id=onex-customer, or the chain passing against a build in which the callback handler is removed.
      - id: "AC4"
        statement: |-
          AC4 — The guide and the shipped client config agree at the closing SHA: the client_id in the documented URL is the client whose redirect URI accepts the landing the customer is sent to, and whose code the dashboard consumes. Falsified by: desired-clients.json and the guide naming different clients for the same hop, or a redirect URI in the guide that the named client does not register exactly.
