title: "K6 pre-dispatch source and route integrity acceptance"
summary: >-
  Parent K6 contract for OMN-18925. Final source, vendor, manifest, consumer, and route declarations must
  agree before dispatch. A mismatch must fail through the actual validator or route, never be inferred
  from a terminal after work has started.
is_seam_ticket: true
interface_change: true
interfaces_touched: [topics, events, envelopes]
contract_completeness: ENRICHED
proof_class: live-readback
evidence_requirements:
  - kind: tests
    description: >-
      Route coverage validators accept declared routes and refuse missing-row, broker, consumer, source,
      vendor, or manifest mismatches before dispatch.
    command: >-
      uv run --frozen pytest -q tests/ci/test_dispatcher_route_coverage_gate.py tests/ci/test_dispatcher_route_coverage_fixtures.py
  - kind: manual
    description: >-
      Final evidence binds source/vendor/manifest hashes and final lock plus a malformed response and
      bounded route or cohort negative control through the actual pre-dispatch surface. It retains command
      logs and exits. Its PASS receipt binds reconciled Core, Market, and Infra commits, the released
      Core artifact, and all source, vendor, manifest, and lock identities used for the pre-dispatch decision.
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: k6-pre-dispatch-integrity
    description: >-
      Planned K6 route validators cover declared-route acceptance and mismatch refusal. Final evidence
      must also bind source, vendor, manifest, consumer, and lock identity before any dispatch occurs.
    source: manual
    status: pending
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest -q tests/ci/test_dispatcher_route_coverage_gate.py
        cwd: "${OMNI_HOME}/omnibase_infra"
