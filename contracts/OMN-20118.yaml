        statement: |-
          AC3: hook_emit_bounded.py runs a writer in the hook lib directory in a forked child instead of a second interpreter, keeping the 30 s budget, the process-group kill, the loud failure and the operator alarm -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py tests/hooks_system/test_hook_broken_emit.py -q
      - id: "AC4"
        statement: |-
          AC4: interpreter starts and wall time per Bash, Skill and Read call before and after are measured on h202 and the budget ceilings ratchet down -- falsifier: uv run python -m tests.hooks_system.wall --runs 5
