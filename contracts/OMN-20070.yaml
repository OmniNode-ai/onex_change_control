---
schema_version: "1.0.0"
ticket_id: "OMN-20070"
title: "OR.2 Complete the shared verification contract for repository-owned evidence admission"
summary: >-
  Complete the OR.2 shared typed verification contract across omnibase_core and omnimarket: resolve protected
  contract sources, required-check coverage, immutable selected attempts, repository-bound subjects, ticket-free
  goal partitions, authenticated revision history, and trusted admission. This contract preserves the
  package-level acceptance criteria verbatim; it does not claim that the full OR.2 phase or its corpus
  replay has passed.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "protocols"
  - "public_api"
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: >-
      Complete the shared verification contract for repository-owned evidence admission under plan section
      6, task OR.2.
    acceptance:
      - id: "AC1"
        statement: >-
          An old head or revision, a missing criterion, a forged producer (a matching verifier string
          from an unauthenticated channel), a disposition-only claim, a forked revision, a redelivered
          older PASS and a contract without a final newline are each refused -- falsifier: each named
          case is a test id in the PR body, and the selector for any of them selects no test or reads
          admitted (uv run pytest with the named ids in the owning repository)
      - id: "AC2"
        statement: >-
          Existing valid contracts keep their meaning under the extended models -- falsifier: the corpus
          fixtures from OR.1 replayed through uv run pytest change a verdict that was admitted before
          the change without a reason-code row
evidence_requirements:
  - kind: "ci"
    description: "Core OR.2 PR product diff scope and required checks are present."
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: >-
      Run the public resolver falsifiers named by AC1. The PR body must list these exact test ids; every
      selector must select a test and refuse the adversarial input.
    command: >-
      uv run pytest tests/unit/validation/test_occ_merge_eligibility_identity.py::test_goal_resolution_refuses_subject_commit_that_is_not_the_pr_head
      tests/unit/validation/test_occ_merge_eligibility_trusted_goal_admission.py::test_matching_execution_identity_from_unauthenticated_channel_is_not_trusted
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_public_resolver_rejects_revision_outside_attempt_partition
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_signed_execution_result_missing_required_check_fails_coverage
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_signed_but_policy_disallowed_actor_cannot_resolve_fork
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_authenticated_but_disallowed_event_runtime_cannot_resolve_fork
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_missing_required_criterion_binding_is_not_replaced_by_disposition
      tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_public_resolver_refuses_unresolved_goal_revision_fork
      tests/unit/validation/test_occ_merge_eligibility_trusted_goal_admission.py::test_attestation_for_older_pass_cannot_authorize_newer_pass_attempt
      tests/unit/validation/test_occ_merge_eligibility_identity.py::test_contract_without_final_newline_fails_pinned_formatter_policy
      -q
  - kind: "manual"
    description: >-
      Run the archived current-public-validator adjudicator from the pinned KBI corpus worktree. It compares
      34 archived before/after calls and accepts only the documented C4 self-bind change; this bounded
      replay is evidence, not the complete fixed-15 OR.1 corpus replay. Historical B1-B6 captures and
      the fixed-15 replay remain separately tracked.
    command: >-
      uv run --no-project python reports/evidence-archive/knowledge-base-internal/docs/tracking/OMN-20070/current-public-validator-replay-20260930/adjudicate_replay.py
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-ac1-goal-admission-falsifiers"
    description: >-
      Pending: exact named AC1 adversarial selectors and their run evidence on the eventual Core PR head;
      no completion evidence is asserted by this draft contract.
    source: "manual"
    binds_ac:
      - "AC1"
    status: "pending"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/unit/validation/test_occ_merge_eligibility_identity.py::test_goal_resolution_refuses_subject_commit_that_is_not_the_pr_head
          tests/unit/validation/test_occ_merge_eligibility_trusted_goal_admission.py::test_matching_execution_identity_from_unauthenticated_channel_is_not_trusted
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_public_resolver_rejects_revision_outside_attempt_partition
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_signed_execution_result_missing_required_check_fails_coverage
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_signed_but_policy_disallowed_actor_cannot_resolve_fork
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_authenticated_but_disallowed_event_runtime_cannot_resolve_fork
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_missing_required_criterion_binding_is_not_replaced_by_disposition
          tests/unit/validation/test_occ_merge_eligibility_goal_coverage_revision.py::test_public_resolver_refuses_unresolved_goal_revision_fork
          tests/unit/validation/test_occ_merge_eligibility_trusted_goal_admission.py::test_attestation_for_older_pass_cannot_authorize_newer_pass_attempt
          tests/unit/validation/test_occ_merge_eligibility_identity.py::test_contract_without_final_newline_fails_pinned_formatter_policy
          -q
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-20070/omnibase_core"
  - id: "dod-ac2-or1-current-source-corpus-replay"
    description: >-
      Pending: the archived adjudicator verifies source fingerprints, input bundle hashes, and 34 before/after
      observations. It preserves 32 admitted calls and one baseline refusal, and accepts one specifically
      reason-coded C4 self-bind refusal (`missing_occ_self_bind`). The complete fixed-15 OR.1 corpus replay
      and goal-mode replay are still required; no PASS receipt is present.
    source: "manual"
    binds_ac:
      - "AC2"
    status: "pending"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run --no-project python reports/evidence-archive/knowledge-base-internal/docs/tracking/OMN-20070/current-public-validator-replay-20260930/adjudicate_replay.py
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-20070/knowledge-base-internal-or2-corpus"
