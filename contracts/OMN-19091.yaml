    acceptance:
      - id: "AC1"
        statement: |-
          AC1: consumer_group_lag reads committed vs. end offsets via aiokafka in-process, no subprocess/ssh/docker in this condition's path -- falsifier: tests/ci/test_lab_alarm_omn18867.py::test_the_runner_rewrites_docker_through_the_configured_transport-equivalent for lag asserting no docker_command/subprocess call is made by evaluate_consumer_group_lag
      - id: "AC2"
        statement: |-
          AC2: the identity is read from ~/.onex/config.yaml + credentials.json (0600 enforced on read), never from argv/plist/disk copy/log -- falsifier: a test asserting the resolved password never appears in any subprocess argv, any file this run writes, or the run's own evidence/log strings (same shape as test_the_token_never_reaches_the_run_record_or_the_rendering)
      - id: "AC3"
        statement: |-
          AC3: a GroupAuthorizationFailedError (or equivalent typed refusal) is classified INDETERMINATE with a distinct, named reason, never OK -- falsifier: a unit test injecting that error type asserts outcome is INDETERMINATE with a reason string naming the group and the refusal type
      - id: "AC4"
        statement: |-
          AC4: an empty committed-offset map (never-committed group) stays INDETERMINATE, not a false OK -- falsifier: a unit test feeding an empty offsets dict asserts outcome is INDETERMINATE, not OK (Rule 16, an empty result is not evidence of absence) CORRECTED 2026-09-21, live finding, team-lead ruling: AC4's literal claim above holds only for the FIRST-EVER sample (no previous sample yet), same as every other group on a baseline run. Once a previous sample exists, a never-committed group with no prior value is informational and does NOT block the condition-level OK -- three of the dev lane's six declared groups have never committed and never will, so the original AC4 made the condition permanently INDETERMINATE on this lane's own steady state, an alarm nobody can ever read OK from. A group that held a real committed offset previously and now reads never-committed is a regression and becomes its own ALARM. Genuinely unreadable groups (auth refusal, connection failure) are unaffected and still force INDETERMINATE overall. New falsifiers: test_a_never_committed_groups_first_sample_is_indeterminate_baseline (the baseline case AC4 originally described), test_a_never_committed_group_does_not_block_ok_once_a_baseline_exists, test_three_readable_and_three_never_committed_groups_reads_ok (the exact live shape: 3 readable flat, 3 never-committed, condition-level OK), test_a_group_that_vanishes_after_committing_is_an_alarm. Proven live 2026-09-21 against the real dev-lane broker: consumer_group_lag reads OK with the same 3-readable/3-never-committed shape.
      - id: "AC5"
        statement: |-
          AC5: growth-across-two-samples semantics are unchanged; a first sample after the switch is still INDETERMINATE by design -- falsifier: test_the_first_sample_is_indeterminate_not_ok continues to pass unmodified against the new evaluator
      - id: "AC6"
        statement: |-
          AC6: proven live via launchctl kickstart -k, the second sample leaving INDETERMINATE for real OK/ALARM rather than staying stuck on SASL-missing -- falsifier: two consecutive kickstart fires against the installed job, second run's .onex_state/lab-alarm/launchd.out.log line for consumer_group_lag names OK or ALARM, not "is SASL missing"
      - id: "AC7"
        statement: |-
          AC7: STALE_INDETERMINATE, a distinct edge-triggered per-subject signal (first-indeterminate timestamp in ModelAlarmState) posts once via the existing delivery path when a condition reads INDETERMINATE on every sample for >=24h, clears and can re-raise on recovery -- falsifier: a unit test driving synthetic timestamps across >=24h of all-INDETERMINATE samples asserts exactly one post, then asserts a recovery-then-stale-again cycle re-raises exactly once more Draft-first PR, red tests first, docker/docker-compose.dev-lane.yml/broker untouched. Not runtime-affecting under ruling 3707 (this Mac, not a lease-governed surface).
