title: "OCC per-entry receipt hashing + append-only + supersession + dual-accept"
summary: >-
  Redesign the OCC merge-eligibility binding (Option A) so appending a dod_evidence entry no longer invalidates
  prior receipts. omnibase_core PR #1382 adds compute_contract_entry_sha256 (canonical per-entry hash
  over one dod_evidence item + an immutable ticket_id/schema_version header), the ModelDodReceipt.contract_entry_sha256
  field, the dual-accept check_receipt_contract_binding wired into both OCC gates, ModelReceiptSupersession
  + resolve_supersession (append-only .supersede.<NNNN>.yaml chain, tombstone/rebind without editing merged
  files), and validator_occ_append_only. omnimarket PR #1592 adds the dod_verify origin/dev contract-resolution
  rider and DurableEvidenceGate tombstone honoring. CI/library change; no runtime mutation.
