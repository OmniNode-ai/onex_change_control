---
schema_version: "1.0.0"
ticket_id: "OMN-16373"
title: "Retire CROSS_REPO_PAT: migrate cross-repo CI reads to the onexbot-occ-writer App token"
summary: "Migrates OCC and its sibling repos' CI workflows off the org-wide CROSS_REPO_PAT secret onto
  a short-lived onexbot-occ-writer GitHub App installation token, minted per job/step via actions/create-github-app-token,
  mirroring the already-merged pattern from omnibase_infra#2831 / omnibase_spi#273. onex_change_control
  PR #6844 (this repo's own carrier, ci.yml / nightly-promote.yml / staleness-monitor.yml) is the substantive
  change; sibling PRs land the same migration in omnibase_core, omnibase_infra, and omnimemory#434 (autobound
  below). Two CROSS_REPO_PAT references stay in ci.yml deliberately: check-platform-leads-review-tripwire
  needs org-membership (read:org) scope the App's permission set (contents:write, metadata:read, pull_requests:write)
  does not grant; migration-inventory's peer-repo clone keeps CROSS_REPO_PAT as a fallback after the App
  token reproducibly dropped the 2 newest files of the private omninode_infra repo on two live CI runs
  (32522180870) -- an installation-token propagation gap for a repo the App was only granted access to
  hours earlier, not a real missing-file drift (the files are present on omninode_infra's own dev HEAD)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "OCC PR CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "ci"
    description: "PR #6844 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "ci"
    description: "PR #2835 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
