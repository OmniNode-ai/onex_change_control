  - id: "dod-omn16373-cross-repo-pat-removed-pr-6844"
    description: "PR #6844's HEAD content of ci.yml, nightly-promote.yml, and staleness-monitor.yml carries
      exactly 3 live '${{ ... secrets.CROSS_REPO_PAT ... }}' template expressions: 2 in check-platform-leads-review-tripwire
      (GH_TOKEN fallback + TOKEN_SOURCE diagnostic; needs read:org scope the onexbot-occ-writer App's
      permission set does not grant), and 1 in migration-inventory's peer-repo clone (kept as a fallback
      AFTER the App token, since the App token alone reproducibly dropped the 2 newest files of the private
      omninode_infra repo on two live CI runs). Every other job's secrets.CROSS_REPO_PAT usage was replaced
      with a minted App token. The live count (verified out-of-band via the GitHub contents API against
      the pushed branch, since a CI runner has no route to a non-loopback host per OMN-14051) is recorded
      in the paired receipt; the contract check greps that receipt's PASS status rather than re-fetching
      over the network."
    source: "manual"
    status: "verified"
