schema_version: 1.0.0
ticket_id: OMN-15272
title: Unmask the psql rejection reason in the migration readiness probe
summary: OCC companion for the OMN-15272 fix in OmniNode-ai/omninode_infra. The pre-lock readiness loop
  in all six k8s/migrations/*-migrate.yaml runners redirected psql stdout to /dev/null and then stderr
  to stdout, destroying the server's own rejection text. A deploy-blocking omninode-cloud-migrate failure
  on 2026-07-27 therefore reported only 'PostgreSQL not ready after 30 attempts'. The fix replaces the
  loop with one canonical block, byte-identical across all six runners, that prints the server's text
  on every failed attempt and repeats the last one on the FATAL path, with the password scrubbed and the
  text bounded.
