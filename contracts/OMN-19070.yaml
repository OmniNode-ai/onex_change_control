        statement: |-
          AC3: A runner that has paused itself does not leave its matrix leg permanently red — the leg either routes to a healthy host or reports in a form that does not fail the required context closed. Falsifier: a paused runner still blocks every merge that touches its leg. This is the half that turns a working admission gate into a fleet outage, and AC2 alone does not fix it.
      - id: "AC4"
        statement: |-
          AC4: Disk headroom on the verify hosts is observable before it becomes a merge blocker. Falsifier: the next occurrence is again discovered by a blocked pull request.
