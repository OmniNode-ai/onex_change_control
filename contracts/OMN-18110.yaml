ticket_id: "OMN-18110"
title: "A FAILED contract attach is never retried, so one transient consumer group-join timeout at boot
  strands contracts for the whole process lifetime"
summary: >
  OCC contract authored by node_occ_companion_compute (OMN-14285) for OmniNode-ai/omnibase_infra PR #3379,
  then extended by hand (append-only, OMN-13888) with the AC-bound evidence items the autobind shape does
  not carry: the autobind entries declare no binds_ac at all, so no acceptance criterion of this ticket
  resolved to a check. The appended items bind AC1 through AC5. AC6 is the post-merge lane readback and
  cannot be proven before this merges, so it is deliberately left unbound and recorded on the ticket instead.
  Every autobind entry above is untouched and keeps its own per-entry hash. What the product PR fixes:
  the boot interleave records two non-attached outcomes per contract - NOT_READY, where provisioning or
  the readiness confirm never converged so the consumer attach was not attempted, and FAILED, where readiness
  PASSED and the Kafka consumer group-join itself raised. OMN-15215 built the bounded reconciliation loop
  that makes "runtime stays live" recoverable but selected its input on NOT_READY alone, in the kernel
  that schedules the loop and again in the wiring seam that re-validates its identities, so a FAILED attach
  was recorded once, logged once, and never revisited. Measured on the .201 dev lane from the runtime's
  own boot aggregate: the main-profile boot at 2026-09-10T00:03:45.913617Z published state=degraded required_contracts=215
  attached_contracts=211 with four blocker rows, each status=failed detail=InfraTimeoutError over a readiness.status=ready
  with an empty failure set and nothing subscribed - node_occ_evidence_draft_orchestrator, node_occ_evidence_validator_compute,
  node_omnigate_projection and node_omnigate_receipt_generator. The twelve boots either side of it all
  published 215 of 215, so this is a transient fault made permanent by a missing retry rather than a wiring
  defect. The runtime held projection_attachment DEGRADED for the ~90 minutes until an unrelated refresh
  restarted it; the image that recovered differs from the image that failed by one commit whose entire
  diff is one file of 166 insertions under tests/, with no src byte changed, so the restart is what cleared
  it and a restart was the only path back. The fix introduces one shared predicate, ModelContractAttachResult.needs_reattach,
  read by both call sites so they cannot drift again, written as the negation of ATTACHED so a status
  added later is retried by default. The retry budget, the backoff and the never-crash-boot boundary are
  unchanged. No credential was rotated, re-issued, revoked or minted, no secret value was read or printed,
  and no cluster object was mutated - every lane probe was a read.
