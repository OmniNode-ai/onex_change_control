    description: >-
      PR #1658 on OmniNode-ai/omnibase_core — Evidence-Source bind at merge commit 90148c953dd1d02cdeb08d14df52a35178f5af6c.
      Each check below was chosen because its exit status FLIPS across the merge: it is green at the merge
