    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_core/commits/90148c953dd1d02cdeb08d14df52a35178f5af6c --jq '.parents[0].sha' | grep -qx '5b27eb5c33a3f61fa2a358341ffc38ba22071837'
      - check_type: "command"
        check_value: |-
          gh pr view 1658 --repo OmniNode-ai/omnibase_core --json state,mergeCommit --jq '.state + " " + .mergeCommit.oid' | grep -qx 'MERGED 90148c953dd1d02cdeb08d14df52a35178f5af6c'
