      - check_type: "command"
        check_value: |-
          test "$(gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/constants/constants_workflow.py?ref=90148c953dd1d02cdeb08d14df52a35178f5af6c" --jq '.content' | base64 -d | grep -c -E 'os\.environ|os\.getenv')" -eq 0
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_core/pulls/1658/files --paginate --jq '.[].filename' | grep -cFx 'tests/unit/validation/test_dynamic_env_read_migration.py'
  - id: "dod-occ-diff-derived-behavior-proof"
    description: "PR #1658 on OmniNode-ai/omnibase_core — diff-derived behavior proof (OMN-16434)."
