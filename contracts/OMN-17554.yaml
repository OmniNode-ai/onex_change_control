  - id: "occ-self-bind-pr-8442"
    description: "Binds OMN-17554 to OCC companion PR #8442 (self-bind)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 8442 --repo OmniNode-ai/onex_change_control --json number,state"
  - id: "dod-core-pr-1658-merge-provenance"
    description: >-
      Merge provenance for omnibase_core PR #1658. Binds the squash merge 90148c953dd1d02cdeb08d14df52a35178f5af6c
