      - id: "AC2"
        statement: |-
          AC2: a Bash call from a lane that reaches api.github.com by curl, wget or python with a token is refused -- falsifier: uv run pytest over a hook test whose Bash command is a curl to api.github.com/user with the GH_PAT header
      - id: "AC3"
        statement: |-
          AC3: a lane call to the real gh binary by absolute path is refused the same way the shim refuses a read -- falsifier: uv run pytest over a hook test whose Bash command runs the homebrew gh binary's pr list subcommand with a lane marker
      - id: "AC4"
        statement: |-
          AC4: the gh-shim install target runs on every lab host whenever scripts/user-bin/gh changes on omniclaude dev, with a drift readback -- falsifier: uv run pytest over the host drift check with a fixture where h201's ~/.local/bin/gh differs, asserting it reports drift
      - id: "AC5"
        statement: |-
          AC5: lab-host gh calls are logged where the Mac's quota measurements read them -- falsifier: uv run pytest over the call-log merge with a lab-host refused row, asserting it appears in the merged log
