    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a contract-declared omnimarket effect node archives every consumer_flow_windows row whose window_start UTC day is wholly older than the retention window to the archive sink, reads every object back (object checksum, decrypt, plaintext checksum, record count, exact projection_cursor set) and deletes only those cursors in committed batches, and the tests fail when a corrupted readback, a drifted source window or a short delete lets any further row be deleted -- falsifier: uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py -q
      - id: "AC2"
        statement: |-
          AC2: no row whose window_start falls on or after the cutoff day (as-of UTC day minus 30) is ever read for archive or deleted, and a dry run reads counts only and writes and deletes nothing, proven by tests that fail today because no such node exists -- falsifier: uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py -q -k "cutoff or dry_run"
      - id: "AC3"
        statement: |-
          AC3: a sink that leaves the host refuses a plaintext cipher and the S3 objects land under consumer-flow-archive/ next to dead-letter-archive/, proven by a test that refuses the plaintext case -- falsifier: uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py -q -k refuses
      - id: "AC4"
        statement: |-
          AC4: on the .201 dev lane, 30 days after the oldest row, the table holds 0 rows with window_start older than 31 days while rows newer than 30 days all remain, and every pruned day has a verified manifest under the S3 prefix consumer-flow-archive/201-dev-omnidash_analytics/ -- falsifier: psql count() where window_start < now() - interval '31 days' returns 0, count() where window_start >= now() - interval '30 days' is nonzero, and an independent boto3 plus KMS readback of every manifest under the prefix reports 0 mismatches
      - id: "AC5"
        statement: |-
          AC5: the node runs daily on the same schedule as node_dead_letter_prune_effect (OMN-19657), not by hand -- falsifier: the runtime tick subscription or schedule declared in the node contract, plus a dev-lane log line or completion event from a scheduled run within 26 hours of deploy
