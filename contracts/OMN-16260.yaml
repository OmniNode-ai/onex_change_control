---
schema_version: "1.0.0"
ticket_id: "OMN-16260"
title: "Consolidate onex_change_control's per-commit guard workflows into guards.yml"
summary: "Consolidates 9 single-job standalone guard workflow files into one guards.yml with parallel
  jobs -- an order-of-magnitude run-creation cut per commit, per the operator's 2026-08-19 ruling that
  CI cost from false/duplicative work must come down. File moves + job wrapping only, no guard-logic changes,
  every check-run name preserved exactly. Self-authored by the implementer for this ticket's OWN carrier
  PR #6734 -- a bounded, mechanical consolidation where the implementer and the falsifiable-check author
  are the same session, matching the OMN-15710/OMN-15461 self-contained-gate-PR convention."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "OCC PR CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn16260-guards-yml-shipped-pr-6734"
    description: "PR #6734 actually introduces .github/workflows/guards.yml and retires the 9 standalone
      files in the same PR (net-negative surface), not merely describes it. Asserted against the PR's
      own file list."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 6734 --repo OmniNode-ai/onex_change_control --json files --jq '[.files[].path]
          | (index(\".github/workflows/guards.yml\") != null) and (index(\".github/workflows/call-occ-autobind.yml\")
          != null) and (index(\".github/workflows/stale-todo-gate.yml\") != null)'"
  - id: "dod-omn16260-full-suite-passes"
    description: "The full local test suite (6175 tests) passes after the consolidation, including the
      3 test files with genuine hardcoded-path dependencies on the moved files (test_occ_autobind_self_exclusion_omn15334.py,
      test_stale_todo_gate_pr_base.py, test_ci_summary_gate.py). Falsifiable: reverting guards.yml while
      keeping the retired files deleted fails this exact command with FileNotFoundError."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/test_occ_autobind_self_exclusion_omn15334.py tests/ci/test_ci_summary_gate.py
          tests/ci/test_stale_todo_gate_pr_base.py -q"
  - id: "dod-omn16260-skip-vector-guard-clean"
    description: "The Required-Check Skip-Vector Guard (OMN-15241) -- the gate that caught the real fail-open
      near-miss during this build (job-level if: on 4 REQUIRED contexts) -- passes clean against the consolidated
      file. Falsifiable: reintroducing the original action-type-narrowed if: on any of the 4 affected
      jobs fails this exact command."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "bash .pre-commit-hooks/reject-required-check-skip-vector.sh"
  - id: "occ-self-bind-pr-6734"
    description: "OCC evaluates its own PRs from the in-tree checkout (invariant I3), so at least one
      PASS receipt must bind to this OCC PR rather than only to the product PR it carries evidence for."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 6734 --repo OmniNode-ai/onex_change_control --json number --jq '.number'
          | grep -c '^6734$'"
