      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The deploy effect publishes no rebuild command and opens no subscription for a deploy-publish record whose correlation it already published in this process, and returns without waiting -- falsifier: a pytest delivers one deploy-publish command twice to one HandlerDeployPublishMonitor on an in-memory bus and asserts exactly one rebuild-requested record and a second handle that returns in under one second; today it publishes twice and waits for a second answer
      - id: "AC2"
        statement: |-
          AC2: A backlog of repeats ahead of a new command no longer delays it by the backlog size times a broker round trip -- falsifier: a pytest feeds 1000 repeats of one correlation, then one new correlation, and asserts the new command is published within 5 seconds of wall time and that the repeats produced no rebuild-requested record
      - id: "AC3"
        statement: |-
          AC3: A skipped repeat is distinguishable from an agent rejection, a timeout and a rollback -- falsifier: a pytest asserts the skip output carries duplicate_skipped 1 with rebuild_rejected, timed_out and rolled_back all 0, and emits no event
      - id: "AC4"
        statement: |-
          AC4: A command whose publish raised is not remembered, so its redelivery is published -- falsifier: a pytest makes the first publish raise, redelivers the same command, and asserts the second delivery publishes one rebuild-requested record
      - id: "AC5"
        statement: |-
          AC5: On the .201 dev lane, no correlation gets more than one rebuild-requested record per deploy-effect process start once the fix is deployed -- falsifier: rpk topic consume onex.cmd.deploy.rebuild-requested.v1 over the 24 hours after the deploy, grouped by key and split at each runtime-effects container start, reads at most 1 per key per segment
