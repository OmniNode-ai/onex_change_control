---
schema_version: "1.0.0"
ticket_id: "OMN-15669"
title: "Canonical contract shape v1 — one schema, ticket identity, cases, mocks, dual binding"
summary: >
  DoD-evidence contract for OMN-15669. The CANONICAL v1 contract for this ticket lives at contracts/v1/OMN-15669.yaml
  under schemas/occ_contract_v1.schema.yaml; this file exists because OCC's receipt gate resolves contracts/<TICKET>.yaml
  against ModelTicketContract, which is extra="forbid" and cannot carry the v1 blocks.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "ci"
    description: "PR CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15669-cases-green"
    description: "Every declared case is collected and passes under the real runner."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_contract_shape_v1_cases.py -q"
  - id: "dod-omn15669-legs-green"
    description: "Every per-leg RED/GREEN discriminator passes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_contract_shape_v1_legs.py -q"
  - id: "dod-omn15669-gate-self-applies"
    description: "The gate applied to its own v1 contract returns zero findings."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run check-contract-shape-v1 --skip-identity --changed-files contracts/v1/OMN-15669.yaml"
  - id: "dod-omn15669-required-path-wiring"
    description: "The gate is in CI Summary's strict poller tier and has a matching ci.yml job."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q '\"Contract Shape v1 (OMN-15669)\"' scripts/ci/ci_summary_gate.py && grep
          -q '^  contract-shape-v1:' .github/workflows/ci.yml"
  - id: "occ-self-bind-pr-6688"
    description: "Binds OMN-15669 to OCC companion PR #6688 (self-bind, in-tree) -- #6688 is the code
      change itself; eligibility requires a PASS receipt whose pr_number binds to THIS PR."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/onex_change_control/pulls/6688 --jq '.number == 6688 and
          .state == \"open\" and (.head.sha | length) == 40' | grep -qx true"
