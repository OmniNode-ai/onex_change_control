        statement: |-
          AC3: after the fix is deployed to the .201 dev lane, work_events contains a session-started row whose emitted_at is later than the deploy -- falsifier: psql on omnidash_analytics, select count(*) from omninode_internal.work_events where source_topic = 'onex.evt.omniclaude.session-started.v1' and emitted_at > the deploy timestamp, expecting at least 1
      - id: "AC4"
        statement: |-
          AC4: the session-started records the topic still retains are replayed into work_events by resetting only the projection_work_events session-started consumer group to its log start under a 201-dev-runtime ledger HOLD, and the resulting row count is reported against the 208 reference events in session_replay_snapshots -- falsifier: psql count of distinct payload session_id for session-started rows with emitted_at after 2026-09-21 20:45:05+00, compared with the session_replay_snapshots session_start count over the same window
