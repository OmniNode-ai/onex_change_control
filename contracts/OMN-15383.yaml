    description: "omninode_infra#758 is bound to its exact reviewed PR head"
    command: "gh pr view 758 --repo OmniNode-ai/omninode_infra --json headRefOid,files"
  - kind: manual
    description: "The RED/GREEN privilege proof executes against a real PostgreSQL in CI"
    command: "uv run pytest tests/scripts/test_omniweb_migration_schema_privilege.py -q"
