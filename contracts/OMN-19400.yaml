  - id: dod-deleg1615-19400-ac3-local-answer-probe
    description: >-
      AC3 behavior probe, proposed by lane deleg-review-batch-1615 for acceptance by a different lane.
      It runs a complex_reasoning delegation on the dev lane with a prompt that asks for under 80 words,
      and asserts the same facts as the earlier proposed probe: status completed, quality gate passed,
      every attempt on the local tier, the last attempt passing the gate, and zero cost. The earlier proposal,
      with a long analysis prompt, measured 27.3 s under dod_verify, 30.9 s under capture and 33.1 s in
      its own receipt, against a 30 s per-check ceiling, so it would be skipped on a default run. This
      probe measured 18.8 s and 19.6 s. It also retires dod-fill-19400-ac3-local-readback, whose probe
      reads a receipt.json that exists only on the host that ran it. (OMN-19432.)
    source: generated
    execution_scope: local_done_gate
    evidence_artifact: supersedes_dod_evidence:dod-fill-19400-ac3-local-readback
    checks:
      - check_type: command
        check_value: |-
          python3 -c 'import json, os, pathlib, subprocess, sys
          env = dict(os.environ, ONEX_TENANT_ID='"'"'820272f9-4aaf-5add-a2df-0af942852ab2'"'"')
          argv = [str(pathlib.Path(env["OMNI_HOME"]) / "omnibase_infra/scripts/onex"), "delegate", '"'"'Compare strong and eventual consistency for a distributed inventory service in under 80 words: name one failure mode of each and recommend a design, with the reason.'"'"', "--task-type", '"'"'complex_reasoning'"'"', "--bus", "kafka", "--lane", "dev", "--ticket", '"'"'OMN-19400'"'"', "--source", "codex", "--json"]
          r = subprocess.run(argv, env=env, text=True, capture_output=True, timeout=360)
          sys.stderr.write(r.stderr)
          if r.returncode:
              sys.stdout.write(r.stdout)
              raise SystemExit(r.returncode)
          receipt = json.loads(r.stdout)
          result = receipt["result"]
          p = result["terminal_payload"]["payload"]
          attempts = p["attempts"]
          assert result["handler_locus"] == "dispatched", result
          assert p["tenant_id"] == '"'"'820272f9-4aaf-5add-a2df-0af942852ab2'"'"', p
          assert p["task_type"] == '"'"'complex_reasoning'"'"' and p["prompt_text"] == '"'"'Compare strong and eventual consistency for a distributed inventory service in under 80 words: name one failure mode of each and recommend a design, with the reason.'"'"', p
          assert p["status"] == "completed" and p["quality_gate_passed"] is True, p
          assert p["attempts_count"] == len(attempts) and len(attempts) >= 1, attempts
          assert all(a["tier"] == "local" for a in attempts), attempts
          assert attempts[-1]["quality_gate_passed"] is True, attempts
          if '"'"'complex_reasoning'"'"' == "reasoning":
              assert len(attempts) == 1 and p["quality_gates_failed"] == [] and p["escalation_count"] == 0, p
          assert sum(a["cost_usd"] for a in attempts) == 0, attempts
          print(json.dumps({"ticket": '"'"'OMN-19400'"'"', "run_id": receipt["run_id"], "correlation_id": receipt["correlation_id"], "terminal_timestamp": result["terminal_payload"]["envelope_timestamp"], "handler_locus": result["handler_locus"], "quality_gate_passed": p["quality_gate_passed"], "quality_score": p["quality_score"], "attempts_count": len(attempts), "accepted_tier": attempts[-1]["tier"], "answering_backend": attempts[-1]["backend_id"], "model": attempts[-1]["model_id"], "non_local_attempts": sum(a["tier"] != "local" for a in attempts), "cost_usd": sum(a["cost_usd"] for a in attempts), "escalation_count": p["escalation_count"], "quality_gates_failed": p["quality_gates_failed"]}, sort_keys=True))
          '
