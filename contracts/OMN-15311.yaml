---
schema_version: "1.0.0"
ticket_id: "OMN-15311"
title: "OCC evidence for runner broker-session health signal"
summary: >-
  Evidence-Source companion for omnibase_infra#2523. The PR adds a fourth runner health state for broken
  GitHub broker sessions, with the implementation in docker/runners/healthcheck.sh, operator runbook documentation,
  and tests that assert the persisted session-broken state.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "The product PR head and file scope must match the runner health change."
    command: "gh pr view 2523 --repo OmniNode-ai/omnibase_infra --json headRefOid,files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn15311-pr-2523-head"
    description: >-
      Binds OMN-15311 to the exact omnibase_infra#2523 head that CI evaluated. This fails if the PR is
      force-pushed without rebinding the OCC receipt.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2523 --repo OmniNode-ai/omnibase_infra --json headRefOid --jq .headRefOid)"
          = "e057bc4953ec248bcaf5eca22dce2fdffef2c32a"
  - id: "dod-omn15311-pr-2523-file-scope"
    description: >-
      Verifies the PR scope is limited to the runner healthcheck, its runbook, and its listener-liveness
      tests.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 2523 --repo OmniNode-ai/omnibase_infra --json files --jq '[.files[].path]
          | sort | join(",")')" = "docker/runners/healthcheck.sh,docs/runbooks/runner-fleet-listener-liveness.md,tests/ci/test_runner_listener_liveness.py"
  - id: "dod-omn15311-session-broken-ratchet"
    description: >-
      Confirms the committed tests include the persisted broken-session ratchet, so the new state is not
      only documented in the PR body.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh api repos/OmniNode-ai/omnibase_infra/contents/tests/ci/test_runner_listener_liveness.py -H
          'Accept: application/vnd.github.raw' --method GET -f ref=e057bc4953ec248bcaf5eca22dce2fdffef2c32a
          | grep -q 'session_broken_since' #magic___^_^___line
  - id: "occ-self-bind-pr-5275-omn15311"
    description: "OCC companion PR #5275 — self-bind for OMN-15311."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5275 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
