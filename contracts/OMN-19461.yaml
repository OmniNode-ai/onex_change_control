  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: onex-api can be configured with an expected issuer and a key source that differ -- falsifier: a unit test constructs the verifier with an issuer of https://auth.example/realms/r and a JWKS URL on a different host, and asserts a token carrying that iss verifies against keys fetched from the second host; if the verifier still derives JWKS from the issuer the test cannot be written and this is unmet.
      - id: "AC2"
        statement: |-
          AC2: All three verifier builders take the split, not just the gateway one -- falsifier: a test enumerates build_gateway_oidc_auth_from_env, build_exchange_input_oidc_auth_from_env and the ordinary onex-api builder and asserts each honours a separately configured key source; any builder still passing a bare issuer string fails it.
      - id: "AC3"
        statement: |-
          AC3: The default behaviour is unchanged when only one value is configured -- falsifier: with no separate key-source variable set, a pytest run of the existing onex-api auth suite shows any change in outcome versus today, which would mean the split broke the single-Keycloak deployments that work now.
      - id: "AC4"
        statement: |-
          AC4: A token carrying the externally-visible issuer is admitted end to end -- falsifier: POST /v1/gateway/attach with a token whose iss is the browser-visible Keycloak still returns 401, demonstrated against a running onex-api with a cited response, not asserted from the code.
      - id: "AC5"
        statement: |-
          AC5: Readback naming the lane: a gateway attach succeeds with an external-issuer token and the session id is recorded, with the configured issuer and key source both printed and shown to differ -- falsifier: the readback is taken on a lane where the two values are equal, which would make the run silent about the defect rather than clearing it.
