---
schema_version: 1.0.0
ticket_id: OMN-15481
title: Rule A/B frozen contract-lint baseline burn-down — batch 1 (4 contracts, 43 Rule-B + 1 Rule-A)
summary: 'OCC#5458 (OMN-15382) shipped two authoring-time contract-lint rules and froze the pre-existing
  corpus violations as shrink-only set-equality ratchets: Rule A (executable-command-shape) and Rule B
  (per-item PR binding). This is batch 1 of the burn-down. Measured live over all 7,564 contracts with
  the shipped detector at lane open, the frozen sets were A=244 and B=897 -- note BOTH published numbers
  are stale and must not be quoted: OCC#5458''s PR body says B=1190 (pre-reconciliation) and the Rule
  B baseline file''s own "# Frozen count:" header said 902. Batch 1 repairs 43 dod_evidence items across
  contracts/OMN-12245.yaml (29), contracts/OMN-9470.yaml (5), contracts/OMN-13902.yaml (5) and contracts/OMN-8904.yaml
  (4). All 43 carried the identical defect shape `gh pr view ${PR_NUMBER} --repo ${REPO} --json <fields>`,
  which is broken twice over: the compliance runner pre-substitutes ${PR_NUMBER}/${REPO} with ITS OWN
  pr/repo so the item never pinned the PR its id declares (Rule B mis-binding), and a bare --json print
  with no assertion exits 0 for any PR that exists (unfalsifiable). The four contracts were chosen as
  the largest Rule-B clusters containing ZERO occ-self-bind-pr-N items: that shape is entangled with open
  OMN-15386 (self-bind asserts .state == "OPEN", permanently false post-merge), OMN-15465 (::pr-live-state
  receipt-carrier fallback overrides the PR the id pins) and OMN-15477 (_supersede_file wrote 98 wrong-PR
  receipts), so rebinding it now would bake in a known-wrong binding; the 456 self-bind entries are deferred
  to a later batch. Repair is append-only supersession per the OMN-14875/OCC#4528 idiom -- every historical
  entry stays byte-intact (git diff vs base shows ZERO deletions on all four contracts) and each is superseded
  by a new entry pinning the literal PR number and repo. Each replacement asserts two facts the PR selector
  does not determine: the PR''s terminal state (merge-commit oid, or CLOSED-and-never-merged for the two
  that never landed) plus a per-item distinguishing binding (a path from the PR''s own file list, its
  baseRefName, its head oid, or its Lint check conclusion). No two of the 43 replacements share a byte-identical
  check pair, which is what closes the OMN-15459 wrong-item-rebind class where one machine producer superseded
  8 distinct items with a single identical grep. All 86 replacement check_values were executed GREEN under
  `bash -o pipefail -c` against live GitHub before landing, and 10 RED controls were executed across every
  check shape (wrong merge oid, wrong PR number, wrong repo, wrong file anchor, wrong contract anchor,
  CLOSED asserted as merged, Lint asserted FAILURE, base asserted dev not main, wrong head oid, nonexistent
  PR) -- all 10 exit non-zero. Two findings surfaced and are recorded rather than papered over: onex_change_control
  PR #2225 is CLOSED and was NEVER merged despite its item description claiming it "binds the June 6 promotion
  evidence cleanup to main" (the real merge was the sibling #2226), and omniintelligence PR #782 is CLOSED
  as its own siblings already documented. Both are now bound to what is actually true. Result: Rule A
  244 -> 243, Rule B 897 -> 854, with ZERO added baseline entries in any of the five ratchet files and
  Rules C/D/E unchanged at 0/11/312. Two knock-on shrinks were required and taken: contracts/OMN-8904.yaml
  now clears the OMN-14409 substance floor so it was removed from the shrink-only grandfather allowlist,
  and appending to contracts/OMN-12245.yaml invalidated two legacy WHOLE-FILE contract_sha256 receipts
  (the OMN-13888 class), which are rebound in net-new command.supersede.0001.yaml files carrying per-entry
  contract_entry_sha256 -- no merged receipt was edited, and the repo-wide receipt-hardening violation
  count is unchanged at 179 before and after.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: ci
    description: 'OCC PR CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn15481-rule-a-baseline-243
    description: 'The Rule A (executable-command-shape) frozen baseline holds exactly 243 entries after
      batch 1, down from 244. Falsifiable: any other count exits non-zero, and a missing/unreadable baseline
      file yields count 0 and also exits non-zero (fail-closed).'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: grep -c '^  - "' .onex_ratchets/omn_15382_rule_a_baseline.yaml | grep -qx 243
  - id: dod-omn15481-rule-b-baseline-854
    description: 'The Rule B (per-item PR binding) frozen baseline holds exactly 854 entries after batch
      1, down from 897. The 43 removed entries are exactly the batch-1 set. Falsifiable: any other count
      exits non-zero; a missing file yields 0 and also fails.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: grep -c '^  - "' .onex_ratchets/omn_15382_rule_b_baseline.yaml | grep -qx 854
  - id: dod-omn15481-supersessions-29-omn12245
    description: 'contracts/OMN-12245.yaml carries exactly 29 append-only supersession entries, one per
      batch-1 Rule B item repaired in that contract. This is the append-only proof: the historical entries
      are untouched and each is superseded rather than edited.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: grep -c 'supersedes_dod_evidence:' contracts/OMN-12245.yaml | grep -qx 29
  - id: dod-omn15481-supersessions-14-rest
    description: 'The other three batch-1 contracts carry 5 + 5 + 4 = 14 NEW append-only supersession
      entries. Asserted per contract so a shortfall in any one of them goes RED rather than being masked
      by a total. Note contracts/OMN-13902.yaml already carried 2 supersession entries before this batch,
      so its total is 7 (2 pre-existing + 5 new); OMN-9470, OMN-8904 and OMN-12245 each had 0 before.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: grep -c 'supersedes_dod_evidence:' contracts/OMN-9470.yaml | grep -qx 5
      - check_type: command
        check_value: grep -c 'supersedes_dod_evidence:' contracts/OMN-13902.yaml | grep -qx 7
      - check_type: command
        check_value: grep -c 'supersedes_dod_evidence:' contracts/OMN-8904.yaml | grep -qx 4
  - id: dod-omn15481-corpus-ratchet-green
    description: 'The shipped corpus ratchet (set equality in BOTH directions, over every contracts/*.yaml)
      passes for Rule A and Rule B against the shrunk baselines. This is the check that would go RED on
      a partial cleanup -- removing baseline entries without actually repairing the contracts fails the
      "healed" assertion just as loudly as adding a new violation fails the "new_violations" assertion.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py
          -q -k 'rule_a_corpus or rule_b_corpus' | grep -c '2 passed' | grep -qx 1
  - id: dod-omn15481-no-baseline-growth
    description: 'Rules C, D and E baselines are untouched by batch 1 -- 0, 11 and 312 entries respectively.
      Batch discipline forbids trading one baselined defect class for another, so a repair that introduced
      a tautological self-comparison, a fail-open zero-count pipe, or a SIGPIPE-fragile early-exit consumer
      would move one of these counts and go RED here. Note the Rule D baseline writes its entries UNQUOTED
      while Rules A/B/E quote theirs, so the D matcher is deliberately different -- using the quoted matcher
      there silently counts 0 and would have shipped a check that can never pass.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: grep -c '^  - ' .onex_ratchets/omn_15391_rule_d_baseline.yaml | grep -qx 11
      - check_type: command
        check_value: grep -c '^  - "' .onex_ratchets/omn_15411_rule_e_baseline.yaml | grep -qx 312
  - id: "occ-self-bind-pr-5593"
    description: "Self-bind: OCC PR 5593 is the carrier for this ticket's batch-1 repair, proven by its
      own file list containing contracts/OMN-15481.yaml. Deliberately does NOT assert .state == \"OPEN\"
      -- per OMN-15386 that predicate is permanently false after merge and produces a non-convergent rebind
      loop. The file-list binding stays true for the life of the PR and is falsifiable: pointed at a PR
      that does not carry this contract (RED control: PR 5586) it exits non-zero."
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh pr view 5593 --repo OmniNode-ai/onex_change_control --json files --jq '.files[].path'
          | grep -cxF 'contracts/OMN-15481.yaml' | grep -qx 1"
