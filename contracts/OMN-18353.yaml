          gh api repos/OmniNode-ai/omnibase_infra/contents/scripts/validation/check_topology_grant_delivery.py?ref=307d29167567fb6b4e7bcb317e78a60f9e8eea45 --jq '.content' | base64 -d | grep -c 'def _added_serial_columns'
  - id: "dod-OmniNode-ai-omnibase_infra-pr-3511-ci"
    description: "PR #3511 on OmniNode-ai/omnibase_infra — product diff scope check (OMN-14425)."
    source: "generated"
