---
schema_version: "1.0.0"
ticket_id: "OMN-18353"
title: "Autobind OCC evidence for OMN-18353"
summary: >
  OCC Evidence-Source autobind companion for the two product PRs that carry OMN-18353: OmniNode-ai/omnibase_infra
  #3511 (the grant migration and the gate extension) and OmniNode-ai/omnimarket #2531 (the catalog identity
  #3511's grant target resolves against). Structural union of companions #9442 and #9444 — neither companion's
  evidence is dropped.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #3511 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "ci"
    description: "PR #2531 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      Behavior proof for PR #3511 on OmniNode-ai/omnibase_infra, derived from the PR's own diff: the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`, executed at cwd `${OMNI_HOME}/omnibase_infra`.
    command: "uv run pytest tests/ci/test_topology_grant_delivery.py -q"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #2531 on OmniNode-ai/omnimarket changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (scripts/application-relation-ownership.yaml) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnibase_infra-pr-3511"
    description: "PR #3511 on OmniNode-ai/omnibase_infra — Evidence-Source autobind."
