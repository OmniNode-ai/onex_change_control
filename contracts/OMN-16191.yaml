    checks:
      - check_type: "command"
        check_value: >-
          base_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=f03ed4125d235069cb1e2472b3b5a71684d9b5ed"
          --jq .content | base64 -d)"; head_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=2e4de65d7112a70abaa65a00a3dea8833771c835"
