  - id: "dod-OmniNode-ai-omnibase_infra-pr-2788"
    description: >
      PR #2788 on OmniNode-ai/omnibase_infra -- re-points 3 source files (eval_event_emitter.py, eval_regression_check.py,
      service_eval_runner.py) plus their 3 test files from `onex_change_control.models.model_eval_report`
      / `onex_change_control.enums.enum_eval_*` imports to the `omnibase_core.models.governance.*` / `omnibase_core.enums.governance.*`
      equivalents. Content-pinned check: fetches the actual file content at the PR's head SHA via the
      GitHub contents API and confirms both that the new omnibase_core import is present AND that no onex_change_control
      import remains in the same file -- proving the re-point is complete, not partial.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/services/eval/eval_event_emitter.py?ref=7243d60c371261387243f2109a7ca7aecfb2324c"
          --jq .content | base64 -d)"; printf '%s' "$body" | grep -qF 'from omnibase_core.models.governance.model_eval_report
          import ModelEvalReport' && ! printf '%s' "$body" | grep -qF 'onex_change_control' && echo "OMN-16191-PR-2788-PROBE-PASS:
          eval_event_emitter.py imports from omnibase_core.models.governance and carries zero onex_change_control
          imports at the pinned head"
