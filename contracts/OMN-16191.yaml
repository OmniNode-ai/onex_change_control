  - id: "dod-OmniNode-ai-omnimarket-pr-2111"
    description: >
      PR #2111 on OmniNode-ai/omnimarket -- repins the omninode-memory dependency from the uninstallable
      ==0.17.0 (whose published requires_dist conflicts with omnimarket's own omnibase-infra/omnibase-spi
      ranges) to ==0.17.1, and cuts version 0.4.8 to carry the fix. occ-preflight/eligibility was red
      because the PR body carried no "Evidence-Source:" line and OCC Autobind Publisher did not produce
      one within ~10 minutes of PR open (GH Actions fleet congestion -- the call-occ-autobind.yml run
      for this PR sat "queued" the whole window, same class as the omnimemory#430 and infra#2788 silent-drop
      symptom already on this contract). Real RED-before/GREEN-after differential via the GitHub contents
      API: pyproject.toml's `version` field reads "0.4.7" at the PR's base (f03ed412) and "0.4.8" at head
      (2e4de65d), and the `omninode-memory` pin reads "==0.17.0" at base and "==0.17.1" at head, matching
      the PR's stated pin bump.
