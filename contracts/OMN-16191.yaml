title: "Re-point infra eval services at omnibase_core and drop the onex_change_control runtime dependency"
summary: >
  OCC evidence companion for OmniNode-ai/omnibase_infra PR #2788 -- re-points omnibase_infra's eval services
  (eval_event_emitter, eval_regression_check, service_eval_runner) from onex_change_control's models/enums
  to their omnibase_core.models.governance / omnibase_core.enums.governance equivalents, dropping the
  runtime import dependency on onex_change_control entirely. This is the OCC-decoupling prerequisite:
  this PR merging unblocks OmniNode-ai/onex_change_control#6681 (deletes the now-duplicate eval/overseer
  data shapes from OCC itself).
