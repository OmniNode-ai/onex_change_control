          'version = "0.4.8"' && printf '%s' "$head_body" | grep -qF 'omninode-memory==0.17.1' && ! printf
          '%s' "$head_body" | grep -qF 'omninode-memory==0.17.0' && echo "OMN-16191-OMNIMARKET-2111-DIFFERENTIAL-PROBE-PASS:
          pyproject.toml version is 0.4.7/omninode-memory==0.17.0 at base and 0.4.8/omninode-memory==0.17.1
          at head"
