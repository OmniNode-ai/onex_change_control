title: "The delegation reader binds each projection with its own tenant_id column type"
summary: >
  OCC contract for OmniNode-ai/omninode_infra PR #1262. Migration 0037 (OMN-15683) converted delegation_events.tenant_id
  from text to uuid while savings_estimates.tenant_id stayed text. The onex-api delegation reader bound
  one Python str for both projections; psycopg 3 sends str as text and PostgreSQL has no uuid = text operator,
  so both tenant-scoped delegation endpoints returned HTTP 503. Reproduced on the onex-lab k3s overlay
  with 0037 applied through the overlay's own migrate path, and fixed forward by parsing the tenant identity
  once at the API boundary into a uuid.UUID and binding it under one parameter name per column type.
