ticket_id: OMN-16043
title: Assert exact attach-audience set at the onex-api edge
summary: "OCC companion for OmniNode-ai/omninode_infra PR #896. The ingress-edge gateway validator compared
  the aud claim to a bare Python str, so a token carrying exactly the required audience serialized as
  a one-element JSON array — the form Keycloak emits once a client has more than one audience mapper —
  was rejected, while its apparent strictness against widening was an accident of Python typing rather
  than an asserted invariant. This companion binds the evidence that aud is now normalized to a set and
  asserted by exact set equality against the ratified expected set, matching the node-side validator so
  the two halves of one contract cannot drift.\n"
