    description: >-
      AC2 binding: "A probe whose orchestrator resolved locally CANNOT be reported as a lane probe --
      onex delegate states in its own output which orchestrator resolved it, so 'did this run on the lane'
      is answerable from the receipt alone, not by cross-checking docker logs by hand." The receipt summary
