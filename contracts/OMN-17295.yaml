        check_value: |-
          body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/reconcile-workspace-venvs.sh?ref=17047498145d8b020e348bcb32e9ea533ce80001" --jq '.content' | base64 -d)"; ! grep -q 'clone_branch_report' <<< "$body" && ! grep -q 'refs/remotes/origin/' <<< "$body"
  - id: "ac5-detection-is-read-only-never-fetches"
    description: >-
      AC5 binding, the property that keeps the detection safe to run where it runs. --check exempts itself
      from the OMN-17366 ownership plan on the grounds that a read-only probe writes nothing; a fetch
      writes objects, refs and reflogs, and on the .201 root cron that exemption is what keeps root-owned
      objects out of operator-owned clones. So the leg reads the tracking ref AS LAST FETCHED and never
      fetches. Asserted structurally over the executable region only -- everything from `set -uo pipefail`
      onward -- because the header prose necessarily discusses fetching in order to explain why it does
      not do it, and a whole-file grep would be satisfied by that prose rather than by the code.
    source: "manual"
    status: "verified"
    binds_ac: ["AC5"]
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/reconcile-workspace-venvs.sh?ref=5be2ccafb8ef1f0979a079ad47a6d58e70fa8314" --jq '.content' | base64 -d)"; ! sed -n '/^set -uo pipefail/,$p' <<< "$body" | grep -q 'git .*fetch'
  - id: "ac5-behaviour-proof-drift-and-composed-layer"
    description: |-
      AC5 binding, the executed half. The structural checks above prove the leg is present; they cannot
      prove it produces a DRIFT verdict, and a leg that observed the refs and then verdicted IN_SYNC anyway
      would satisfy every one of them. This suite builds real (local, file-path origin) git repositories,
      pushes the remote ahead of the clone, and asserts the verdict flips to DRIFT with the clone name,
      both shas and the behind-count in the output.

      It also pins the two properties that must NOT change, because both are ways this could be "fixed"
      into a regression:

        * the composed layer still installs. omnimarket plus its --no-deps companions living in
          omnibase_infra's venv is BY DESIGN, and a stale clone is not a reason to skip or strip it
          (test_repair_still_installs_the_composed_layer_when_the_clone_is_stale). The pin stays the LOCAL
          clone HEAD, never origin/dev, because that is what the OMN-14060 drift guard compares against
          (OMN-16366).
        * the venv reconciler never advances a clone (test_repair_never_advances_the_clone). There is one
          clone reconciler, scripts/runtime_build/reconcile_deploy_clones.sh (OMN-17291), and one venv
          reconciler, composed by reconcile-host.sh. AC5's own second sentence says to coordinate with
          OMN-17291 rather than duplicate it, so a fast-forward added here would fail the criterion it
          claimed to satisfy.
    source: "manual"
    status: "verified"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: |-
          uv run pytest tests/scripts/test_reconcile_clone_origin_drift_omn17295.py -q
        cwd: "${OMNI_HOME}/omnibase_infra"
