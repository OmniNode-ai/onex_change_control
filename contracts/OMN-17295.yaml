    status: "verified"
    binds_ac: ["AC5"]
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/scripts/reconcile-workspace-venvs.sh?ref=5be2ccafb8ef1f0979a079ad47a6d58e70fa8314" --jq '.content' | base64 -d)"; grep -q 'clone_branch_report' <<< "$body" && grep -q 'refs/remotes/origin/' <<< "$body"
  - id: "ac5-negative-control-at-the-parent-commit"
    description: >-
      AC5 binding, the negative control. The same remote read against the branch point 17047498145d8b020e348bcb32e9ea533ce80001
      must find NEITHER the observation function NOR any remote-tracking ref read in that script. Without
      this, the positive check cannot distinguish "this PR added the leg" from "the leg was already there
      and this PR did nothing" -- and a green result on the positive half alone is not evidence for the
      criterion. That distinction is the whole reason AC5 was falsified by source read in the first place:
      the script carried an explicit banner saying it pins to the local clone head, NOT origin/dev, and
      performed zero origin/dev comparisons.
    source: "manual"
    status: "verified"
    binds_ac: ["AC5"]
    checks:
