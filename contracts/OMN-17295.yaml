      the locus decision is threaded into it rather than being logged and lost. Read remotely at the merge
      commit. Live confirmation, 2026-09-17 against the .201 dev lane: the receipt for correlation 88405181-5ed1-429a-b99b-d152827350c2
      reported handler_locus=dispatched, its own wire_correlation_id, orchestrator_distribution "omnimarket
      0.4.111 (<local venv path>)" -- the distribution that supplied the wire description, named as local
      so it cannot be misread as the executor -- and a dispatch_target naming the command topic, the broker
      and the two live consumer groups bound to it.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/cli/model_receipt_runtime_summary.py?ref=549897b417f460093b7fc0cd820549139a676855" --jq '.content' | base64 -d)"; for f in handler_locus wire_correlation_id orchestrator_distribution dispatch_target; do grep -q "    $f: " <<< "$body" || exit 1; done
