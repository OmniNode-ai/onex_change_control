        [reconcile]   omnibase_core: HEAD e7241554fde5  origin/dev e7241554fde5  behind by 0 commit(s)
        [reconcile]   omnibase_spi: HEAD c6aa159f3dde  origin/dev c6aa159f3dde  behind by 0 commit(s)
        [reconcile]   omnibase_compat: HEAD 939afb25e7fb  origin/dev 939afb25e7fb  behind by 0 commit(s)
        [reconcile]   omnimarket: HEAD 87afb9c33215  origin/dev 87afb9c33215  behind by 0 commit(s)
        [reconcile] verdict: IN_SYNC (omnimarket 87afb9c33215)

      Stated plainly rather than implied: that readback is an observation of one operator's workstation.
      A GitHub-hosted runner has no route to it and this gate does not pretend otherwise -- which is why
      the re-executable checks above are structural and behavioural, and this entry carries the observation
