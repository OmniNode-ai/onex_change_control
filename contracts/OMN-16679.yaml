title: "onex new node scaffold is not runnable as generated"
summary: >
  OCC contract for OmniNode-ai/omnibase_core PR #1598. The `onex new node` scaffold emitted a contract
  key the runtime never reads (handler_routing.default instead of default_handler in module_ref:ClassName
  form), a module-level handle() function instead of a canonical definition-B handler class, and no terminal_event
  — so a freshly scaffolded node failed on first execution. The fix makes the scaffold emit what RuntimeLocal
  actually consumes.
