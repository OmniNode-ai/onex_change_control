    acceptance:
      - id: "AC1"
        statement: |-
          AC1: placement picks the advertised host with the lowest load per core under the bar, refuses stale advertisements before headroom, and distinguishes over_capacity from could_not_check -- falsifier: pytest tests/unit/lab_work -k placement
      - id: "AC2"
        statement: |-
          AC2: a serve process runs only work units addressed to its own host name and answers each with a receipt carrying exit code, log path and output tail on the completed terminal -- falsifier: pytest tests/unit/lab_work -k host
      - id: "AC3"
        statement: |-
          AC3: an unreadable load or memory reading publishes no advertisement and raises -- falsifier: pytest tests/unit/lab_work -k advertise
      - id: "AC4"
        statement: |-
          AC4: onex-lab-run places on the launching Mac through a local row only when its load per core is under the bar -- falsifier: pytest tests/test_lab_run.py -k local
      - id: "AC5"
        statement: |-
          AC5: the heavy-command hook refuses a directory-wide test run on a Mac over the bar with the dispatch command and allows it under the bar, each shown with a threshold override -- falsifier: pytest tests/test_heavy_work_guard.py
      - id: "AC6"
        statement: |-
          AC6: one broad test run dispatched over the bus lands on the least-loaded serving host and its receipt returns to the caller -- falsifier: onex lab-work run readback of the receipt line naming host, exit code and log path
