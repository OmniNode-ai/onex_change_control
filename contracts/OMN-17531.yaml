  - id: "ac1-overlays-bind-literal-one-at-merge-sha"
    description: >-
      AC1 binding, the positive half: "Each of the three lanes has ONEX_WIRING_STRICT_MODE: '1' bound
      in its overlay, in committed source." Re-derived by a remote read pinned to the merge commit 810c818a10b3b149a9fa2e5de112fe9909b29b7f
      (omnibase_infra#3137), not from a local checkout, so the check answers a question about landed source
      rather than about whatever tree the verifier happens to sit in. Matched with grep -qx against the
      exact literal two-space-indented line, so an interpolated ${ONEX_WIRING_STRICT_MODE:-1} form would
      NOT satisfy it — that distinction is the point of the criterion's second sentence, because an interpolated
      form lets an ambient shell export silently return a lane to the quarantining semantics. All three
      lanes are asserted, lakshman included: AC1 is a committed-source criterion and is satisfied for
      that lane, which is why the 2026-09-10 scope split moves only the lakshman DEPLOY criteria (AC2/AC3)
      and the AC5 residual out. Named as its own entry rather than added to any entry above it, because
      every entry above is merged and the Append-Only Gate holds merged entries immutable.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |-
          n=0; for f in dev-lane lakshman stability-test; do body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.$f.yml?ref=810c818a10b3b149a9fa2e5de112fe9909b29b7f" --jq '.content' | base64 -d)"; grep -qxF '  ONEX_WIRING_STRICT_MODE: "1"' <<< "$body" && n=$((n+1)); done; test "$n" = 3
  - id: "ac1-negative-control-absent-at-the-parent-commit"
    description: >-
      AC1 binding, the negative control. The same three remote reads against the merge commit's first
      parent 35088928699757f28c65974438e7d97c0238e76a must find NO ONEX_WIRING_STRICT_MODE line at all
      in any of the three overlays. Without this, the positive check above cannot distinguish "this PR
      bound the flag" from "the flag was already there and this PR did nothing" — a green result on the
      positive half alone is not evidence for the criterion. Run 2026-09-10: 0 of 3 overlays carry the
      key at the parent, 3 of 3 carry it at the merge.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |-
          n=0; for f in dev-lane lakshman stability-test; do body="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.$f.yml?ref=35088928699757f28c65974438e7d97c0238e76a" --jq '.content' | base64 -d)"; grep -qF 'ONEX_WIRING_STRICT_MODE' <<< "$body" && n=$((n+1)); done; test "$n" = 0
  - id: "ac1-strict-anchor-reaches-every-runtime-service"
    description: >-
      AC1 binding, the reachability half: "No :-0 default is left reachable for those three lanes." Binding
      the anchor is not the same as consuming it — an overlay could define the strict-wiring env block
      and merge it into nothing, leaving every runtime service still resolving the base docker-compose.infra.yml:216
      ${ONEX_WIRING_STRICT_MODE:-0}. This check counts the YAML merge-key references to each overlay's
      strict-wiring anchor and requires exactly 8 across the three files: dev 3 (omninode-runtime, runtime-effects,
      runtime-worker), lakshman 2 (omninode-runtime, runtime-effects — that lane declares no worker),
      stability-test 3. projection-api and omninode-contract-resolver are deliberately NOT counted: they
      are uvicorn servers that never reach wire_from_manifest, so binding strict mode on them would assert
      nothing.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |-
          n=0; for p in dev-lane:dev_lane_strict_wiring_env lakshman:lakshman-strict-wiring-env stability-test:stability_test_strict_wiring_env; do f=${p%%:*}; a=${p##*:}; c=$(gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/docker-compose.$f.yml?ref=810c818a10b3b149a9fa2e5de112fe9909b29b7f" --jq '.content' | base64 -d | grep -c "!!merge <<:.*\*$a"); n=$((n+c)); done; test "$n" = 8
  - id: "ac2-deploy-attribution-dev-and-stability"
    description: >-
      AC2 binding, scoped to the two lanes this ticket owns after the 2026-09-10 scope split: dev and
      stability-test. Both were redeployed through the sanctioned path on 2026-09-02 — dev via scripts/deploy-runtime.sh
      --execute --force --restart, stability-test via scripts/runtime_build/refresh_stability_lane.sh
      --execute, never a raw compose recreate — and each run wrote a lane-deploy attribution record through
      scripts/preflight_lane_deploy_attribution.py. This check reads the durable record directory on the
      lab host and requires exactly the two rollout records, matched by their own filenames. The lakshman
      lane is deliberately NOT asserted here: it has 0 attribution records of 189 on that host, the deploy
      model has no member that can name it, and that gap is OMN-17807.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          test "$(ssh -o BatchMode=yes -o ConnectTimeout=30 omni-201-ts 'ls $HOME/.omnibase/infra/deploy-attribution' | grep -cE '^20260902T14(4403|5842)\.[0-9]+Z-(dev|stability-test)-allow\.json$')" = "2"
  - id: "ac3-strict-live-not-quarantined-dev-stability"
    description: >-
      AC3 binding, scoped to dev and stability-test after the 2026-09-10 scope split. The criterion's
      FAIL condition is a quarantined-but-running lane. Under ONEX_WIRING_STRICT_MODE=1 that state is
      unreachable by construction: an unwireable handler kills boot instead of being quarantined, so a
      runtime service that is simultaneously (a) running, (b) carrying strict mode in its own container
      env and (c) at RestartCount 0 has necessarily completed auto-wiring with quarantined=0. This check
      asserts all three facts on all six dev + stability-test runtime services at once. The boot-log summary
      line is deliberately not used: the json-file driver is capped at max-size 10m / max-file 3 and the
      boot window on both main runtimes has rotated out (verified 2026-09-10 by a positive control — 309
      Auto-wiring lines survive on omninode-runtime but no summary line does), so a grep for it would
      return an empty result that reads like a clean bill of health. The recorded boot evidence is the
      2026-09-02T15:15Z readback on this ticket: wired=231 skipped=79 failed=0 quarantined=0 on both mains,
      failed=0 quarantined=0 on all six.
    source: "manual"
    status: "verified"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: |-
          test "$(ssh -o BatchMode=yes -o ConnectTimeout=30 omni-201-ts 'ok=0; for c in omninode-runtime omninode-runtime-effects omnibase-infra-runtime-worker-1 omninode-stability-test-runtime omninode-stability-test-runtime-effects omninode-stability-test-runtime-worker; do docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" $c 2>/dev/null | grep -q "^ONEX_WIRING_STRICT_MODE=1$" && [ "$(docker inspect -f "{{.RestartCount}}" $c)" = "0" ] && [ "$(docker inspect -f "{{.State.Status}}" $c)" = "running" ] && ok=$((ok+1)); done; echo $ok')" = "6"
  - id: "ac3-positive-control-flag-grep-discriminates"
    description: >-
      AC3 binding, positive control for the check above. A grep for ONEX_WIRING_STRICT_MODE=1 that matched
      everything, or that silently errored, would return 6 for reasons unrelated to strict mode. This
      runs the same docker inspect grep against the two lakshman runtime containers, where the key is
      genuinely absent, and requires exactly 2 UNSET results. A run in which both the six-strict assertion
      and this two-unset assertion hold is a measurement; either alone is not. This entry does NOT assert
      anything about the lakshman lane's own compliance — that lane is out of scope for AC2 and AC3 as
      of the 2026-09-10 scope split, and its state here is used only as a control surface.
    source: "manual"
    status: "verified"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: |-
          test "$(ssh -o BatchMode=yes -o ConnectTimeout=30 omni-201-ts 'n=0; for c in omninode-lakshman-runtime omninode-lakshman-runtime-effects; do docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" $c 2>/dev/null | grep -q "^ONEX_WIRING_STRICT_MODE=" || n=$((n+1)); done; echo $n')" = "2"
  - id: "ac4-exposures-filed-and-fixed-not-suppressed"
    description: >-
      AC4 binding, the positive half. Auto-wiring itself produced zero failures on the two redeployed
      lanes, so there was no "Auto-wiring failed for N contract(s)" block to file from them. Two other
      exposures surfaced during the same rollout and each was filed as its own ticket with its own root
