          n=0; for p in 3149 3156; do test "$(gh pr view $p --repo OmniNode-ai/omnibase_infra --json state --jq '.state')" = "MERGED" && n=$((n+1)); done; test "$n" = 2
  - id: "ac4-no-suppression-landed-in-the-strict-mode-pr"
    description: >-
      AC4 binding, the prohibition half: "Do NOT downgrade the flag, add an allowlist, add a per-contract
      skip, or widen a quarantine branch to make a lane green." The positive half above cannot see this
      — a lane can have findings filed AND a quietly added allowlist. This check reads the merged file
      list of omnibase_infra#3137 and requires zero files whose path names an allowlist, skiplist, waiver
      or exemption surface. It is paired with ac1-overlays-bind-literal-one-at-merge-sha, which independently
      proves the flag was not downgraded to an interpolated or 0-valued form. The PR's five files are
      the three lane overlays plus tests/ci/test_env_parity.py and tests/ci/test_lane_strict_wiring_omn17531.py.
    source: "manual"
    status: "verified"
    binds_ac: ["AC4"]
    checks:
      - check_type: "command"
        check_value: |-
          test "$(gh api repos/OmniNode-ai/omnibase_infra/pulls/3137/files --paginate --jq '.[].filename' | grep -ciE 'allowlist|allow_list|skiplist|waiver|exempt')" = "0"
  - id: "ac5-lab-wires-superset-of-staging-packages"
    description: >-
      AC5 binding, scoped to dev and stability-test after the 2026-09-10 scope split. The criterion anticipated
      a lab lane wiring a strictly SMALLER contract set than onex-dev and asked for that to be recorded.
      Measured, it is the other way round: both lab lanes activate four runtime packages (omnibase_infra,
      omnimarket, omniclaude, omniintelligence) while onex-dev activates two (omnibase_infra, omnimarket,
      from k8s/onex-dev/runtime/configmap.yaml:80 in omninode_infra). This check asserts both halves in
      one run — the live lab value on the dev and stability-test main runtimes, and the committed staging
      value — because the comparison is the criterion, not either number alone. The consequence worth
      recording, and the reason the criterion is not simply "passed": a lab lane covers staging's surface
      and then some, so a lab-only failure can originate in an omniclaude or omniintelligence contract
      staging never loads, and a green lab lane is not by itself evidence about a package staging does
      not run. Stated honestly rather than implied: the staging column is manifest-derived, not read from
      a running pod. The post-redeploy re-run of the per-lane 308-vs-310 contract count for the lakshman
      lane is the AC5 residual and lives on OMN-17807 AC5.
    source: "manual"
    status: "verified"
    binds_ac: ["AC5"]
    checks:
      - check_type: "command"
        check_value: |-
          lab="$(ssh -o BatchMode=yes -o ConnectTimeout=30 omni-201-ts 'for c in omninode-runtime omninode-stability-test-runtime; do docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" $c | grep "^ONEX_ACTIVE_RUNTIME_PACKAGES=omnibase_infra,omnimarket,omniclaude,omniintelligence$"; done' | wc -l | tr -d ' ')"; stg="$(gh api "repos/OmniNode-ai/omninode_infra/contents/k8s/onex-dev/runtime/configmap.yaml?ref=dev" --jq '.content' | base64 -d | grep -c '^  ONEX_ACTIVE_RUNTIME_PACKAGES: "omnibase_infra,omnimarket"$')"; test "$lab" = "2" -a "$stg" = "1"
