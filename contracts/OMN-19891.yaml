  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A heartbeat whose verdict is not GREEN for at least the configured number of consecutive bar runs raises a CRITICAL alarm naming the verdict and the streak length, and a heartbeat whose workflow run concluded success does not suppress it -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs passes while a heartbeat carrying verdict: "BLOCKED" and a streak at or above the threshold yields an empty alarm list.
      - id: "AC2"
        statement: |-
          AC2: A leg recorded UNPROVEN on at least the configured number of consecutive runs raises its own alarm, distinct in id from the verdict alarm and naming the leg -- falsifier: the same node --test suite passes while a heartbeat holding one leg UNPROVEN past its threshold produces either no alarm or an alarm that does not name that leg.
      - id: "AC3"
        statement: |-
          AC3: The heartbeat is written on every bar run including one whose evaluating job fails, and an absent, stale, or uncountable heartbeat raises rather than reading healthy -- falsifier: uv run pytest tests/ci/test_staging_green_bar_heartbeat.py -q passes while the producer job carries no if: always(), or while a None streak yields healthy: true.
      - id: "AC4"
        statement: |-
          AC4: Both thresholds and the second object key are set from terraform, and a threshold set to a non-numeric or negative value throws at start rather than degrading to a permissive one -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs passes while an env value of "none" is accepted as a threshold.
      - id: "AC5"
        statement: |-
          AC5: The alert is proven end to end on the live topic, not merely unit-tested: one alarm is delivered to the confirmed subscriber from a real lambda invocation reading a real heartbeat -- falsifier: no delivery is recorded in the SNS topic's own metrics for the invocation window, or the delivered body names no leg and no streak.
