          --jq .content | base64 -d | python3 -c 'import sys; text=sys.stdin.read(); raise SystemExit(0
          if "def dispatch_skipped_projections" in text else 1)'
  - id: dod-deploy-omn17448-writer-running
    description: Deploy-gate probe declaration, checked hermetically against the product PR head. The
      dev-lane compose overlay must declare the standalone tenant-registry writer and run the handler
