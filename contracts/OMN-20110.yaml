  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: journal append performs no directory scan, so its cost does not grow with the backlog, and the bound is enforced by the drainer -- falsifier: uv run pytest tests/hooks/test_hook_emit_journal.py -q -k append_does_not_scan
      - id: "AC2"
        statement: |-
          AC2: the drainer lists at most one batch of records per pass instead of parsing the whole journal -- falsifier: uv run pytest tests/hooks/test_hook_emit_journal.py -q -k list_pending_limit
      - id: "AC3"
        statement: |-
          AC3: with the journal lock held by another process, the bounded emit wrapper exits non-zero inside its budget with a blocking error that names the cause, and leaves no surviving child in its process group -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py -q -k lock_held
      - id: "AC4"
        statement: |-
          AC4: a failed emit raises the operator alarm through alert-channel.sh exactly once per failure episode, and a later successful emit closes the episode so the next failure alarms again -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py -q -k alarm_once_per_episode
      - id: "AC5"
        statement: |-
          AC5: the emitting hook scripts run the emit through the bounded wrapper in the foreground, with no disowned emit, no spool, no fail-open branch and no kill switch -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py -q -k no_disowned_emit
