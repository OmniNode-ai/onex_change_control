  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the collection records every deploy run that was in flight when it read the plane -- falsifier: a pytest case feeds a run list holding one settled run and one status: in_progress run created after it, and asserts the fact document names the in-flight run id; it fails against today's code, where the status=completed filter means the payload never contains such a run
      - id: "AC2"
        statement: |-
          AC2: a plane-reading leg is UNPROVEN, never FAIL, when a deploy was in flight at collection -- falsifier: a pytest case drives clean_deploy with a plane digest that disagrees with the scored run AND an in-flight deploy present and asserts UNPROVEN; a positive control with the same disagreement and no in-flight deploy asserts FAIL is still produced, so the change cannot be a blanket excuse
      - id: "AC3"
        statement: |-
          AC3: legs read only from the scored run's own job log keep their verdict, because an in-flight deploy cannot alter a log already written -- falsifier: a pytest case asserts migration_unblocked and role_switch_guard return identical outcomes for payloads that differ only by the presence of an in-flight run
      - id: "AC4"
        statement: |-
          AC4: the measured pair is reproduced as a regression test -- falsifier: a pytest case builds the digest disagreement bar 36042133748 recorded (scored run delivered sha256:e45feb91…, plane reads sha256:cdf4c7c4…) with deploy 36039002392 in flight and asserts clean_deploy and repin_chain read UNPROVEN naming that run id, and separately asserts bar 36024950157's uncontended GREEN shape is unchanged
      - id: "AC5"
        statement: |-
          AC5: a readback over at least 20 settled bar runs after the change, reporting how many collections were contended and how many contended collections reported FAIL on a plane-reading leg -- falsifier: the after-readback shows any contended collection reporting FAIL on clean_deploy, repin_chain or store_sourced_secrets
