requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A maximum age for a walk-created or probe-created account is declared as a value in a checked-in file, not left to whoever runs the sweep -- falsifier: no declared value anywhere in the repo for how old such an account may be before it is disabled
      - id: "AC2"
        statement: |-
          AC2: Something runs on a schedule and disables every account past that age, and its run records what it disabled and what it deliberately left enabled -- falsifier: a scheduled run whose output reports a count without naming the accounts it examined, or a readback taken after a run that still lists an enabled account older than the declared age
      - id: "AC3"
        statement: |-
          AC3: The reaper never issues a partial user replace -- falsifier: pytest over the reaper asserts the outgoing request body carries the user's full representation, and fails when the body is only {"enabled": false}
      - id: "AC4"
        statement: |-
          AC4: An account still in use is never disabled -- falsifier: pytest presents the reaper an account with an active session and one created inside the current run, and fails if the reaper disables either
      - id: "AC5"
        statement: |-
          AC5: The nine accounts listed in this ticket are disabled, verified by a live readback naming each one -- falsifier: a readback after the change that shows any of the nine still enabled: true, or a readback that reports success without listing them individually
evidence_requirements:
  - kind: "ci"
    description: "PR #1726 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - kind: "tests"
    description: |-
