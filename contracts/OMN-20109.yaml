requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a system test fires 40 parallel PreToolUse, PostToolUse and SkillStart hook invocations through the real entrypoints, and asserts each finishes inside its budget and the process count returns to baseline with zero ppid-1 orphans and no leftover children -- falsifier: uv run pytest tests/hooks_system/test_hook_concurrency.py -q
      - id: "AC2"
        statement: |-
          AC2: a system test breaks the emit path (bus unreachable, append-journal lock held by another process, full or slow journal) and asserts the hook exits non-zero with the cause inside its budget and leaves no child -- falsifier: uv run pytest tests/hooks_system/test_hook_broken_emit.py -q
      - id: "AC3"
        statement: |-
          AC3: a test counts processes spawned and wall time for one tool call and fails above the recorded budget (today's measured 18 processes, with a lower stated target) -- falsifier: uv run pytest tests/hooks_system/test_hook_call_budget.py -q
      - id: "AC4"
        statement: |-
          AC4: the suite is a required CI context feeding CI Summary in omniclaude and a pre-commit hook on hook-tree changes, and a workflow-shape test fails when either wiring is removed -- falsifier: uv run pytest tests/ci -k hook_system -q
      - id: "AC5"
        statement: |-
          AC5: a launchd canary every 60 seconds counts hook processes, ppid-1 hook orphans and user process count against kern.maxprocperuid, alarms once per episode with a ledger ALERT row above the thresholds, and alarms when it cannot run -- falsifier: uv run pytest tests/hooks_system/test_hook_canary.py -q
