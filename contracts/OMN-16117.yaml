---
schema_version: "1.0.0"
ticket_id: "OMN-16117"
title: "OCC evidence for OMN-16117"
summary: >
  Non-implementer OCC evidence companion for the two-vector fix closing the auto-merge.yml actor-gate
  hole: an agent session sharing the jonahgabriel GitHub identity could previously get a PR touching grants/prod_promotion_grants.yaml
  armed for unattended squash merge, since auto-merge.yml gated only on occ-preflight / eligibility, not
  on diff content, and onex_change_control@main has requiresApprovingReviews=false. Vector 1 (PR #6638)
  adds a governance-path exclusion step to auto-merge.yml itself, fail-closed on an undetermined changed-file
  set. Vector 2 (PR #6642) adds a standalone advisory CI check (governance-file-advisory-gate.yml) that
  hard-fails whenever a PR's diff touches a governance path, closing the same hole for an external driver
  that never goes through auto-merge.yml at all; it is deliberately NOT wired into any required status
  check (occ main enforce_admins:true would otherwise permanently wedge every future prod-promotion grant
  landing). Both PRs were left DRAFT with auto-merge NOT armed while unpatched, since the live unpatched
  auto-merge.yml is exactly the failure mode both PRs defend against.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-check-governance-paths-pr-6638"
    description: >
      Falsifiable diff-scope probe for OmniNode-ai/onex_change_control PR #6638 at its head fc1a18f9bcc366f87783f1ee7c49572e12c2ed42.
      Confirms via the live GitHub contents/files API (not PR-body prose) that the PR's changed-file set
      genuinely includes the new scripts/ci/check_governance_paths.py module, and pins the PR's head SHA
      so a later substantive push invalidates this receipt rather than silently staying bound to a stale
      diff.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          files="$(gh api repos/OmniNode-ai/onex_change_control/pulls/6638/files --paginate --jq '.[].filename'
          | jq -R -s -c 'split("\n")[:-1]')" && echo "$files" | jq -e 'index("scripts/ci/check_governance_paths.py")'
          >/dev/null && gh pr view 6638 --repo OmniNode-ai/onex_change_control --json headRefOid --jq
          'if (.headRefOid == "fc1a18f9bcc366f87783f1ee7c49572e12c2ed42") then "true" else error("PR #6638
          head moved off the pinned SHA") end'
  - id: "dod-check-governance-paths-tests-pr-6638"
    description: >
      L1+ behavioral check (OMN-14409 substance floor): tests/unit/scripts/test_check_governance_paths.py
      is a real, collected pytest suite (24 cases) covering the pure predicate (is_governance_path, touches_governance_path),
      the CLI check subcommand, and a real subprocess invocation -- not a mere existence/binding probe.
      Independently reproduced by this non-implementer evidence-authoring session against PR #6638's exact
      pinned head via a fresh clone (not the implementer's self-report): 24 passed in 0.16s. Manual smoke
      of the three documented CLI outcomes at that same head also verified live: a governance-path diff
      exits 1 (exclude), a non-governance diff exits 0 (safe_to_arm), and a null/undetermined changed-file
      set exits 1 (fail-closed).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          rm -rf /tmp/occ-eligibility-verify-6638 && git clone --quiet https://github.com/OmniNode-ai/onex_change_control.git
          /tmp/occ-eligibility-verify-6638 && cd /tmp/occ-eligibility-verify-6638 && git fetch --quiet
          origin pull/6638/head && git checkout --quiet FETCH_HEAD && uv run pytest tests/unit/scripts/test_check_governance_paths.py
          -q
  - id: "dod-check-governance-advisory-gate-pr-6642"
    description: >
      Falsifiable diff-scope probe for OmniNode-ai/onex_change_control PR #6642 at its head a01f20698146af854a8a9fc3c0b57a37eaf85eb4
      (branched from #6638's branch since it imports #6638's not-yet-on-dev scripts/ci/check_governance_paths.py).
      Confirms via the live GitHub files API that the PR's changed-file set genuinely includes the new
      standalone .github/workflows/governance-file-advisory-gate.yml and scripts/ci/governance_advisory_gate.py,
      and that the latter imports GOVERNANCE_PATHS and touches_governance_path from check_governance_paths.py
      by identity rather than defining a second governance-path list (confirmed by direct grep of the
      fetched file content, not PR-body prose).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          files="$(gh api repos/OmniNode-ai/onex_change_control/pulls/6642/files --paginate --jq '.[].filename'
          | jq -R -s -c 'split("\n")[:-1]')" && echo "$files" | jq -e 'index(".github/workflows/governance-file-advisory-gate.yml")
          and index("scripts/ci/governance_advisory_gate.py")' >/dev/null && body="$(gh api "repos/OmniNode-ai/onex_change_control/contents/scripts/ci/governance_advisory_gate.py?ref=a01f20698146af854a8a9fc3c0b57a37eaf85eb4"
          --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -q "from scripts.ci.check_governance_paths
          import GOVERNANCE_PATHS as GOVERNANCE_PATHS" && gh pr view 6642 --repo OmniNode-ai/onex_change_control
          --json headRefOid --jq 'if (.headRefOid == "a01f20698146af854a8a9fc3c0b57a37eaf85eb4") then
