schema_version: "1.0.0"
ticket_id: "OMN-16117"
title: "OCC evidence for OMN-16117"
summary: >
  Non-implementer OCC evidence companion for the two-vector fix closing the auto-merge.yml actor-gate
  hole: an agent session sharing the jonahgabriel GitHub identity could previously get a PR touching grants/prod_promotion_grants.yaml
  armed for unattended squash merge, since auto-merge.yml gated only on occ-preflight / eligibility, not
  on diff content, and onex_change_control@main has requiresApprovingReviews=false. Vector 1 (PR #6638)
  adds a governance-path exclusion step to auto-merge.yml itself, fail-closed on an undetermined changed-file
  set. Vector 2 (PR #6642) adds a standalone advisory CI check (governance-file-advisory-gate.yml) that
  hard-fails whenever a PR's diff touches a governance path, closing the same hole for an external driver
  that never goes through auto-merge.yml at all; it is deliberately NOT wired into any required status
  check (occ main enforce_admins:true would otherwise permanently wedge every future prod-promotion grant
  landing). Both PRs were left DRAFT with auto-merge NOT armed while unpatched, since the live unpatched
  auto-merge.yml is exactly the failure mode both PRs defend against.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-check-governance-paths-pr-6638"
    description: >
      Falsifiable diff-scope probe for OmniNode-ai/onex_change_control PR #6638 at its head fc1a18f9bcc366f87783f1ee7c49572e12c2ed42.
      Confirms via the live GitHub contents/files API (not PR-body prose) that the PR's changed-file set
      genuinely includes the new scripts/ci/check_governance_paths.py module, and pins the PR's head SHA
      so a later substantive push invalidates this receipt rather than silently staying bound to a stale
      diff.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          files="$(gh api repos/OmniNode-ai/onex_change_control/pulls/6638/files --paginate --jq '.[].filename'
          | jq -R -s -c 'split("\n")[:-1]')" && echo "$files" | jq -e 'index("scripts/ci/check_governance_paths.py")'
          >/dev/null && gh pr view 6638 --repo OmniNode-ai/onex_change_control --json headRefOid --jq
          'if (.headRefOid == "fc1a18f9bcc366f87783f1ee7c49572e12c2ed42") then "true" else error("PR #6638
          head moved off the pinned SHA") end'
