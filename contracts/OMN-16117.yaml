      is a real, collected pytest suite covering the pure predicate (is_governance_path, touches_governance_path),
      the CLI check subcommand, and a real subprocess invocation -- not a mere existence/binding probe.
      Independently reproduced by this non-implementer evidence-authoring session against PR #6638's exact
      pinned head via a fresh clone (not the implementer's self-report): 24 passed in 0.16s (17 def test_
      functions; 3 are @pytest.mark.parametrize-decorated and expand to the remaining cases at collection
      time -- confirmed by grep, not assumed). Manual smoke of the three documented CLI outcomes at that
      same head also verified live: a governance-path diff exits 1 (exclude), a non-governance diff exits
      0 (safe_to_arm), and a null/undetermined changed-file set exits 1 (fail-closed). The re-executable
      check below asserts the def-test_ function count via the contents API rather than re-cloning + installing
      + running pytest live, since the automated Contract Compliance Check re-executes check_value with
      a 60s budget that a fresh clone/uv-sync/pytest chain cannot reliably meet under runner-fleet load.
    source: "manual"
    checks:
