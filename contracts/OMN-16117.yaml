        check_value: >-
          count="$(gh api "repos/OmniNode-ai/onex_change_control/contents/tests/unit/scripts/test_check_governance_paths.py?ref=fc1a18f9bcc366f87783f1ee7c49572e12c2ed42"
          --jq '.content' | base64 -d | grep -c 'def test_')" && [ "$count" -eq 17 ] && gh api repos/OmniNode-ai/onex_change_control/pulls/6638
