        statement: |-
          AC1: A lane overlay places an added backend in a named tier as a fallback for named rungs, and an invalid placement (unknown tier, a rung not in that tier, context larger than the backend declares) fails the render with a typed error -- falsifier: unit tests feeding each invalid placement and asserting ProtocolConfigurationError naming the backend
      - id: "AC2"
        statement: |-
          AC2: With .201's rung unavailable for one test-scoped run, the placed sibling answers, and with .201 available it never does -- falsifier: a lab pair on the .201 dev lane, one run whose rendered contract binds local-coder to a closed port and one unmodified control, reading the receipts' backend_id and endpoint
      - id: "AC3"
        statement: |-
          AC3: A quality rejection on .201 never hops to a sibling serving the same model id, on either path -- falsifier: a unit test on the local dispatch port asserting no gate_sibling hop when the sibling's model_name equals the rejected backend's
      - id: "AC4"
        statement: |-
          AC4: Load-spreading across same-model rungs is designed and ticketed separately, or built -- falsifier: a linked ticket id or a merged PR on this issue
