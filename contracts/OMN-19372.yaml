        statement: |-
          AC1: when a product PR's cited companion has been superseded (a later companion merged that appended a supersession item to the same contract) but the product PR's Evidence-Source stamp still names the pre-supersession companion, occ-autobind rebinds the stamp to the current merged companion instead of declining already_bound. Falsifier: replay this PR's shape (a bound stamp naming a companion a later merged companion superseded) through node_pr_lifecycle_fix_effect / OccCompanionEmitter and assert the outcome is a rebind, not DECLINED already_bound.
      - id: "AC2"
        statement: |-
          AC2: when a push changes nothing because the tree already carries exactly the stamp autobind would write (e.g. a human already made that write), occ-autobind's git step treats "nothing to commit" as a no-op SUCCESS, not an ERROR check-run. Falsifier: reproduce a push where the working tree already matches autobind's intended stamp and assert the outcome is SUCCESS/no-op, not an App-posted ERROR.
      - id: "AC3"
        statement: |-
          AC3 (positive control): a genuine mismatch — the tree differs from what autobind would write — still produces a commit, and a real git failure still errors. Falsifier: a push whose tree does NOT already match autobind's intended write still results in a commit; only the byte-identical case in AC2 may no-op.
