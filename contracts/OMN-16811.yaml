  # ---------------------------------------------------------------------------
  # OMN-16811 behaviour-proving evidence (appended; nothing above is edited, so
  # every receipt already bound to the autobind entries keeps a valid
  # contract_entry_sha256 — OMN-13888).
  #
  # The four entries above are the OMN-14285 autobind's own output and carry
  # behavior_proving_count = 0: a `gh api .../contents/<file>?ref=<sha> |
  # base64 -d | grep -c` blob probe (static-artifact inspection), a
  # `gh pr view --json files` diff-scope probe, OCC's own
  # tests/test_evidence_admissibility.py, and a bare `gh pr view`. All four are
  # true statements about which PR exists and which bytes landed; none executes
  # the routing authority, so none can go red if escalation regressed to its
  # single cloud rung or if agent_delegation were quietly wired onto an HTTP
  # tier.
  #
  # The three entries below run the real suites the fix shipped with, pinned by
  # `cwd` to the repo that owns the code, and each probe first resolves the
  # omnimarket commit through the GitHub API so a local-only sha cannot satisfy
  # them. The first goes RED on the pre-fix tree (5 of 6 cases).
  - id: "dod-16811-tier-endpoint-completeness"
    description: >-
      AC1 + AC3 behaviour proof. Runs omnimarket's tests/unit/delegation/test_tier_endpoint_completeness_omn16811.py,
      which asserts that escalation still resolves a rung when every credentialed backend is unavailable,
      that its first routable rung is a zero-cost tier, that no routable task class depends on a single
      credentialed failure domain, and that every admitted task class is either routable or carries a
      routing_availability declaration naming a genuinely unserveable capability. Goes RED on the pre-fix
      tree: 5 of its 6 tests failed before the config change (escalation's whole ladder was claude ->
      cloud-gemini-pro and the agent_delegation gap was undeclared).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_tier_endpoint_completeness_omn16811.py
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-16811-capability-honesty-unchanged"
    description: >-
      Anti-regression proof for the decision this ticket deliberately did NOT revert. Runs omnimarket's
      tests/unit/delegation/test_cloud_routing_contract_integrity_omn15503.py, whose test_no_use_for_entry_claims_a_capability_its_tier_cannot_serve
      fails if any routing_tiers use_for entry claims a task class requiring agent_orchestration, and
      whose structural routability test now derives its unroutable-class exception from the task-class
      contract's own routing_availability declaration instead of a hardcoded dict — so the declaration
      and the test cannot drift apart.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_cloud_routing_contract_integrity_omn15503.py
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-16811-routing-suite-no-regression"
    description: >-
      Blast-radius proof for a routing-authority config change. Runs omnimarket's whole delegation + routing
      + routing-reducer suite (834 passed, 2 skipped on the fix tree). A tier_order or use_for edit that
      broke another task class's ladder, escalation ordering, ROI suppression, paid-tier gating, or the
      same-tier backend fallback fails here.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation tests/unit/routing tests/nodes/node_delegation_routing_reducer
          -q"
        cwd: "${OMNI_HOME}/omnimarket"
