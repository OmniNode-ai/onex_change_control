    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (refuse before destroying): --rolling exits non-zero before recreating any container when no registration token is available, and its message names the variable -- falsifier: invoke it with DEPLOY_RUNNER_TOKEN unset and assert no container is recreated and the exit status is non-zero; today it recreates the first runner and then halts, which converts a missing input into a lost runner.
      - id: "AC2"
        statement: |-
          AC2 (the dry run reports the same precondition): the dry-run path reports the missing token as a blocking precondition rather than reporting a plan it cannot execute -- falsifier: run the dry run with the variable unset and assert it names the same refusal; a dry run that reports a clean plan for a run that cannot start is worse than no dry run.
      - id: "AC3"
        statement: |-
          AC3 (a recreated runner actually re-registers, proven on a positive control): with a token supplied, a recreated runner re-registers and reads online within the 240-second window -- falsifier: recreate one runner with a valid token and assert it reaches online inside the window; the control is required because AC1 and AC2 can both pass while the recreate path is still broken, and a refusal that is never followed by a successful run proves only that nothing happens.
      - id: "AC4"
        statement: |-
          AC4 (labelled criterion — the fix does not persist a secret to disk): nothing here writes a registration token into a volume, an image layer or a committed file -- falsifier: grep the diff for a write of the token value to any path; the correct shape is to pass it at recreate time, never to make the destroyed credential restorable by storing it.
