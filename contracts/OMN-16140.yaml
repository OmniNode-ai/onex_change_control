---
schema_version: "1.0.0"
ticket_id: "OMN-16140"
title: "Axis-2 identity binding accepts a commit-message reference"
summary: >
  Receipt-gate identity binding axis 2 required the PR branch name to reference the Evidence-Ticket. A
  branch name is fixed at creation time, so a ticket filed after the branch already existed could never
  satisfy it, and the only remedy was a replacement PR plus an evidence relink. Axis 2 now also accepts
  a ticket reference from any commit message on the PR, which is addable to an open PR and therefore satisfiable
  retroactively. The anti-forgery property is unchanged: branch name, PR title, and commit messages are
  all author-controlled strings in the same trust class, so axis 2 was never the load-bearing control.
  That is the evidence-eligibility self-bind and the receipt honesty gate's unconditional contract hash
  check, neither of which is touched.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: "RED-before/GREEN-after proof for the new axis-2 satisfaction path"
    command: "uv run pytest tests/unit/validation/test_receipt_gate_identity_binding.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-axis2-accepts-commit-message-reference"
    description: >
      The widened axis-2 path exists in omnibase_core: a commit message referencing the Evidence-Ticket
      satisfies identity binding when the branch name cannot.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -c 'test_commit_message_satisfies_axis_2_when_branch_predates_ticket' tests/unit/validation/test_receipt_gate_identity_binding.py"
  - id: "dod-axis2-anti-forgery-preserved"
    description: >
      The widening does not dissolve the axis: an unrelated ticket in a commit message, and a numeric
      superstring of the cited ticket, both still fail identity binding.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -c 'test_unrelated_commit_messages_do_not_satisfy_axis_2' tests/unit/validation/test_receipt_gate_identity_binding.py"
  - id: "dod-axis2-cli-seam-driven-end-to-end"
    description: >
      The workflow-arg to CLI seam is covered by a test that drives the real argv path with repeated --pr-commit-text
      flags, plus a negative control proving the flags are load-bearing rather than incidentally passing.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -c 'test_seam_commit_text_flags_reach_identity_binding' tests/unit/validation/test_receipt_gate_cli.py"
  - id: "occ-self-bind-pr-6637"
    description: >
      Binds this ticket's evidence to the evidence PR carrying it (self-bind), so the eligibility check
      resolves a PASS receipt naming this PR.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh pr view 6637 --repo OmniNode-ai/onex_change_control --json number,state"
