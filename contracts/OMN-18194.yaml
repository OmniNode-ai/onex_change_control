          test "$merge_sha" = "f340b4835f59b60adcbd0c2ccade668b813a0c7d" &&
          checks_green="$(gh pr checks 81 --repo OmniNode-ai/knowledge-base --json bucket --jq 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")')" &&
          test "$checks_green" = "true" &&
          files="$(gh api repos/OmniNode-ai/knowledge-base/pulls/81/files --jq '.[].filename')" &&
          contains "$files" 'runbooks/bulk-pr-operations.md' &&
          runbook_b64="$(gh api 'repos/OmniNode-ai/knowledge-base/contents/runbooks/bulk-pr-operations.md?ref=f340b4835f59b60adcbd0c2ccade668b813a0c7d' --jq '.content')" &&
