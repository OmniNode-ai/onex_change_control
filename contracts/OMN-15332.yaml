title: "k8s node-migration ledger collision + wrong Postgres target"
summary: >-
  Hand-authored OCC companion for OmniNode-ai/omninode_infra#735. The node-owned migration loop tracked
  in schema_migrations inside omnidash_analytics, where omnidash's own (filename, applied_at) ledger already
  owns that name, so the DDL no-opped, the probe error was swallowed by a `|| echo "0"` fallback and promoted
  to APPLY, the SQL applied for real, and the tracking UPSERT then killed the job. The loop now tracks
  in node_schema_migrations, the swallow is gone from every runner, and deploy-onex-dev.yml sets POSTGRES_TARGET=rds
  so migrations land in the instance the runtime reads.
