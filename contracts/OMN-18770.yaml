schema_version: "1.0.0"
ticket_id: "OMN-18770"
title: "C3 data: error-fingerprint exposure — a ranked, bus-backed runtime-error surface"
summary: >
  OCC contract for OmniNode-ai/omnimarket PR #2664 (C3 of epic OMN-18767, the lab observability tab).
  Adds node_projection_runtime_error_fingerprints, a contract-first reducer over onex.evt.omnibase-infra.runtime-error.v1
  that DERIVES the error category from the event's own evidence instead of copying the producer's stamp,
  re-derives the fingerprint over the derived category, accumulates occurrence_count atomically in SQL,
  and publishes fingerprint-keyed snapshot deltas to onex.snapshot.projection.runtime-error-fingerprints.v1
  with correlation_id as a first-class column. The surface it replaces held 69 rows on the .201 dev lane
  with 100% error_category unknown, because the only classifier in the pipeline was an eight-entry logger-NAME
  prefix map evaluated by the producer and no emitting logger name matched a prefix in it.
