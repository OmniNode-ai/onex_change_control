    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/ -q"
  - id: "dod-omn16285-mypy"
    description: "mypy --strict clean on both changed CI-layer modules."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run mypy scripts/ci/evidence_only_predicate.py scripts/ci/ci_summary_gate.py
          --strict"
  - id: "dod-omn16285-precommit-clean"
    description: "pre-commit run on the changed-file set is clean, including the scripts-canonical-form
