  - id: "ac1-live-probe-reverification-2026-09-15"
    description: >
      AC1, in its rescoped fallback-(c) form. AC1 as written asks for a sentinel LOCATED in a service
      log before any fix. No such sentinel was ever found: the 2026-09-15 probe drove a real two-hop mint
      (tenant broker -> client_credentials against the IN-CLUSTER Keycloak -> POST /v1/auth/gateway-token
      -> attach, heartbeat, detach, all three HTTP 200 against dev.api.omninode.ai) and found ZERO credential
      fingerprints on every traversed surface. The rescope to fallback (c) was pre-authorised by the 2026-09-10
      operator ruling (comment c8b0b52a) and the traversal was accepted as closing AC1 in comment 1eb86efa
      ("Treat AC1 as closed on that evidence"). This item records THAT, and deliberately does not claim
      the RED capture the criterion literally asks for. The traversal proof is non-vacuous on the highest-risk
      surface: three introspect-plus-publish pairs on omninode-runtime-effects matching the three lifecycle
      calls, with a working positive control (query-string marker found 3x in the onex-api access log).
      The prior 2026-09-14 run of the same probe was adversarially reviewed and marked NOT VERIFIED (comment
      091fa6e9); this is the re-run after the OMN-16504 client-secret restore fixed the Keycloak 401 that
      aborted it.
    source: "manual"
    binds_ac:
      - "AC1"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          curl -sS --fail https://api.linear.app/graphql -H 'Content-Type: application/json'
          -H "Authorization: ${LINEAR_API_KEY}"
          --data '{"query":"query{comment(id:\"3b2172d9-3bc0-4e5f-ae65-a8d3d77a61c1\"){body}}"}'
          | grep -F 'attach_status 200'
      - check_type: "command"
        check_value: |-
