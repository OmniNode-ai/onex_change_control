schema_version: 1.0.0
ticket_id: OMN-16075
title: onex-api heartbeat edge mirror for the termination_reason contract change (tolerant window)
summary: 'OCC companion for OmniNode-ai/omninode_infra PR #907. omnibase_infra#2736 replaces ModelGatewayHeartbeatResponse.revoked
  with a nullable termination_reason enum and adds EXPIRED/QUARANTINED session states and event types.
  The onex-api edge validates that bus payload with extra=forbid (routers/gateway.py -> ModelGatewayHeartbeatHTTPResponse.model_validate,
  502 on failure), so with no mirror every heartbeat -- healthy ones included -- becomes an HTTP 502 the
  moment the new runtime deploys, and the durable gateway_sessions projection silently drops every enforced
  teardown. This companion binds the evidence that the edge now accepts BOTH payload generations (tolerant
  window: edge deploys first, runtime second, tighten-to-single-field is a follow-up), that all three
  terminal triples are driven through both the HTTP model and the projection extractor by a cross-boundary
  seam test, and that the three gateway-session CHECK constraints were extended with a fail-closed rollback.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
evidence_requirements:
  - kind: ci
    description: 'PR #907 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
dod_evidence:
