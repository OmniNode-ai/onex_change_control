requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A condition that persists across many invocations mails once when it opens, not once per invocation -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs fails the case that replays 48 consecutive invocations of one alarm and asserts exactly one notification.
      - id: "AC2"
        statement: |-
          AC2: A condition that clears mails exactly one recovery notice and then goes quiet -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs fails the case asserting a cleared id is reported once and is absent on the following invocation.
      - id: "AC3"
        statement: |-
          AC3: The absence alarms board_dark, board_heartbeat_absent, bar_stale and bar_heartbeat_absent still re-notify on every invocation, because silence about a stopped instrument is the wrong direction -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs fails the case asserting each of those four re-notifies from a previous state that already lists it.
      - id: "AC4"
        statement: |-
          AC4: Unreadable or missing watchdog state fails OPEN rather than silent -- falsifier: node --test aws/beta-board/watchdog/handler.test.mjs fails the case passing null, undefined, an empty object and a malformed open list, each of which must still notify.
      - id: "AC5"
        statement: |-
          AC5: The deployed role can write the state object the suppression depends on -- falsifier: uv run pytest tests/ci/test_beta_board_watchdog_omn18610.py fails the case asserting the ReadAndWriteItsOwnAlertState statement grants both s3:GetObject and s3:PutObject scoped to watchdog_alert_state_key while the heartbeat statement stays read-only.
      - id: "AC6"
        statement: |-
          AC6: An operator readback after the apply shows a quiet channel over a persisting condition -- falsifier: the watchdog log group over the six hours following the apply shows more than one notified entry for a single alarm id whose declared policy is transition.
