  # OMN-20103 / 2026-09-29 -- ADD-ONLY CORRECTION OF THE AUTOBIND'S AC BINDINGS.
  #
  # OCC#11812 bound all six criteria to `dod-OmniNode-ai-omninode_infra-pr-1749`, whose whole check is
  # `gh pr view 1749 --json number,state`. That succeeds for as long as the PR exists, so as bound this
  # contract discharged every criterion without measuring any of them (OMN-18849). The merged item is
  # immutable, so its six bindings are RETIRED below with their reason each, and four are re-made
  # against the checks each criterion's own falsifier names.
  - id: "ac1-ac2-ac4-watchdog-handler-suite"
    description: >-
      AC1, AC2 and AC4 -- the falsifier each criterion names is this exact command. The suite holds the
      case that replays 48 consecutive invocations of one alarm and asserts exactly one notification (AC1),
      the case asserting a cleared id is reported once and absent on the following invocation (AC2), and
      the case passing null, undefined, an empty object and a malformed open list, each of which must
      still notify (AC4). The whole file is run, not a --test-name-pattern selection: node exits 0 when
      a pattern matches no test, so a renamed case would turn a pattern check into a silent pass.
    source: "generated"
    checks:
      - check_type: "test_passes"
        check_value: "node --test aws/beta-board/watchdog/handler.test.mjs"
        cwd: "${OMNI_HOME}/omninode_infra"
    binds_ac:
      - "AC1"
      - "AC2"
      - "AC4"
    ac_bindings:
      - label: "AC1"
        criterion_hash: "6b6d78b1f9c864ca8db5f6f70ee07cc4b967a96702199184f44e7c7a0dc78c27"
        proposed_by: "occ-autobind"
        accepted_by: "fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3"
        accepted_at: "2026-09-29T16:23:58Z"
      - label: "AC2"
        criterion_hash: "b94a9bc6b4424b7b6781718dbf02fc1b675fd0b98e990a11b42f43dc4e131309"
        proposed_by: "occ-autobind"
        accepted_by: "fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3"
        accepted_at: "2026-09-29T16:23:58Z"
      - label: "AC4"
        criterion_hash: "1dcd246aa2c9f3c730a40e421ca3efb03222c7c8fa3d29699ae8165daf05ff4c"
        proposed_by: "occ-autobind"
        accepted_by: "fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3"
        accepted_at: "2026-09-29T16:23:58Z"
    supersedes_ac_binding:
      - item: "dod-OmniNode-ai-omninode_infra-pr-1749"
        label: "AC1"
        reason: >-
          The retired item reads the PR's number and state. That answers whether a pull request exists,
          never whether 48 invocations of one condition send one mail.
      - item: "dod-OmniNode-ai-omninode_infra-pr-1749"
        label: "AC2"
        reason: >-
          The retired item reads a pull request, not whether a cleared alarm is reported exactly once.
      - item: "dod-OmniNode-ai-omninode_infra-pr-1749"
        label: "AC4"
        reason: >-
          The retired item reads a pull request, not whether unreadable watchdog state fails open.
      - item: "dod-OmniNode-ai-omninode_infra-pr-1749"
        label: "AC3"
        reason: >-
          AC3's falsifier asks for each absence alarm to re-notify from a previous state that ALREADY
          LISTS it. The only case on dev starts from an empty state, which cannot tell re-notifying from
          notifying the first time, so no check on dev can discharge AC3 yet. omninode_infra#1755 adds
          the case (with a negative control the empty-state case misses). Retired with no replacement
          until it merges: a visible gap rather than a silent pass on a PR read.
      - item: "dod-OmniNode-ai-omninode_infra-pr-1749"
        label: "AC6"
        reason: >-
          AC6 is settled by the watchdog log group over the six hours after the Terraform apply. The retired
          item contacts no AWS account and no log group. Retired with no replacement until an operator
          with AWS access applies the stack and records the readback (tools/verify_board_watchdog.sh).
  - id: "ac5-watchdog-iam-state-object"
    description: >-
      AC5 -- the deployed role can write the state object the suppression depends on. The falsifier AC5
      names is this exact command: its ReadAndWriteItsOwnAlertState case asserts s3:GetObject and s3:PutObject
      scoped to watchdog_alert_state_key, and its heartbeat case asserts the heartbeat statement stays
      read-only.
