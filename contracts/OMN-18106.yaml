title: "Closer prior-revert fence records its first baseline after post-revert evidence lands, so a reverted
  ticket with changed evidence never releases"
summary: >
  OCC contract authored by node_occ_companion_compute (OMN-14285) for OmniNode-ai/omnibase_infra PR #3376,
  then extended by hand (append-only, OMN-13888) with the four AC-bound evidence items the autobind shape
  does not carry: the autobind entries declare no binds_ac at all, so no acceptance criterion of this
  ticket resolved to a check. The four appended items bind AC1, AC2, AC3 and AC5; AC4 is the post-merge
  readback on the first scheduled sweep tick and cannot be proven before this merges, so it is deliberately
  left unbound and recorded on the ticket instead. Every autobind entry above is untouched and keeps its
  own per-entry hash. What the product PR fixes: the positive prior-revert fence held a reverted ticket
  until a later tick's verdict fingerprint differed from every fingerprint recorded as a post-revert baseline,
  and that baseline was recorded from the FIRST verdict the sweep observed after the reversal rather than
  the verdict as it stood AT the reversal. Where remediation landed in the gap between the two - the common
  case, since work continues after a revert and the sweep ticks every thirty minutes - the already-repaired
  verdict became the thing change had to be measured against, and dod_verify being deterministic, no later
  tick could ever differ from it. Measured on OMN-15542: reverted 2026-09-02T07:46:30Z, repaired over
  the following week, first post-revert look at 2026-09-09T23:16:09Z on run 34415223971, which minted
  ca128f676aa74a44 as a permanent hold. The fix asks the ordering first, from timestamps rather than from
  what the sweep remembers seeing: the reversal's own createdAt against the landing times of the evidence
  the verdict is resolved from (the merged evidence companion, each cited product PR). Evidence at or
  after the reversal releases to the ordinary flip predicate and the outcome carries post_revert_evidence_release
  naming what beat what; evidence entirely before it still holds; an ordering that cannot be read holds,
  naming the timestamp. No credential was rotated, re-issued, revoked or minted, no secret value was read
  or printed, and no cluster object was mutated. Rule 24 stated rather than implied: the sweep runs as
  a scheduled GitHub Actions job and not on the .201 dev lane or the k3s lab overlay, so there is no lab
  surface for it, no lab pass is claimed, and the first scheduled sweep run after the merge is the live
  readback.
