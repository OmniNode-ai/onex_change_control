    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a withdrawal whose actor is a human identity (session handle operator or jake), with no evidence ref, or with reason duplicate and no event or ledger-row ref is refused with ValidationError -- falsifier: uv run pytest tests/unit/models/events/work/test_model_work_question.py -q, RED on origin/dev at import
      - id: "AC2"
        statement: |-
          AC2: the withdrawal model has no field named answers, operator_words, approved_by, approved_scope or out_of_scope, so it cannot be read as an answer or as consent -- falsifier: uv run pytest tests/unit/models/events/work/test_model_work_question.py -q -k no_answer_fields
      - id: "AC3"
        statement: |-
          AC3: the fold gives OPEN for an unanswered question, ANSWERED when a ruling or consent names it in answers, WITHDRAWN when only a valid withdrawal names it, and ANSWERED when both do; a withdrawal or answer naming an unknown id or a non-question answers or withdraws nothing and is listed -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold_questions.py -q
      - id: "AC4"
        statement: |-
          AC4: question status is invariant under permutation and duplication of the ledger lines and under any rewording of the free-text fields -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_state_compute/test_fold_questions.py -q -k 'permutation or free_text'
      - id: "AC5"
        statement: |-
          AC5: onex-work-ledger questions exits 3 with one line per matching question, 0 when none match and 2 on a ledger with no epoch -- falsifier: uv run pytest tests/unit/cli/test_cli_work_ledger.py -q -k questions
      - id: "AC6"
        statement: |-
          AC6: each new kind renders one md row whose type cell is MSG (question, to=operator, question= cell) or STATUS (withdrawal, withdraws= and withdrawal= cells) and a ruling with answers renders an answers= cell -- falsifier: uv run pytest tests/unit/models/events/work/test_work_ledger_render.py -q -k question
