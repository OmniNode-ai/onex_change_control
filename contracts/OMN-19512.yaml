  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: in every registry repo carrying receipt-honesty.yml, its pull_request trigger lists opened, synchronize, reopened and ready_for_review -- falsifier: for each repo, git show origin/<default>:.github/workflows/receipt-honesty.yml parsed with yaml.safe_load, on.pull_request.types contains all four
      - id: "AC2"
        statement: |-
          AC2: in every registry repo carrying call-receipt-gate.yml, its pull_request trigger additionally lists ready_for_review, with opened, synchronize, reopened and edited kept -- falsifier: same yaml read of call-receipt-gate.yml per repo shows all five types
      - id: "AC3"
        statement: |-
          AC3: every repo whose workflow-lint tests pin these trigger sets still passes them, and the omnibase_infra and omnimarket edited-scope tests are unchanged -- falsifier: uv run pytest tests/ci/test_edited_trigger_scope_omn16171.py -q in omnibase_infra and the matching tests/unit/workflows file in omnimarket exit 0 on each PR head
      - id: "AC4"
        statement: |-
          AC4: a draft PR flipped ready gets a fresh Receipt Honesty run on the same head without a push -- falsifier: gh api repos/OmniNode-ai/<repo>/actions/runs?event=pull_request&head_sha=<sha> lists a receipt-honesty run whose display event is ready_for_review, on the first draft flipped after the merge
evidence_requirements:
  - kind: "ci"
    description: "PR #1762 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      OWED, not claimed. PR #1762 on OmniNode-ai/omnibase_core changes no pytest target, so this producer cannot derive a behavior-class check from its diff and mints none - the changed surface (.github/workflows/call-receipt-gate.yml, .github/workflows/receipt-honesty.yml) is unproven by this contract. A behavior proof must be hand-authored as a `source: manual` dod_evidence item before OMN-15911's flip conjunct can be satisfied. Recorded here rather than papered over with a ticket-independent suite that would read as proof (OMN-16434).
    command: "uv run pytest <hand-authored target> -q"
