---
schema_version: "1.0.0"
ticket_id: "OMN-16924"
title: "Session phase reducer state moves from .onex_state to the database"
summary: >
  OCC evidence companion for OMN-16924 across two PRs: OmniNode-ai/omnibase_infra PR #3002 (the runtime
  state_io seam -- contract-declared row key, overlay-resolved database/table binding, migration 102_create_session_phase_state.sql)
  and OmniNode-ai/omnimarket PR #2204 (node_session_phase_reducer's contract declares the binding and
  its handler stops doing filesystem I/O). The reducer's state of record was a cwd-relative .onex_state/session/phase_state.yaml
  that no runtime container could write (/app is root:root 0755, the process runs as omniinfra), producing
  a 100% PermissionError dispatch-failure rate on all three subscribed topics on every lane. Operator
  ruling 2026-08-29, verbatim -- "onex_state should be configurable via contract overlay right? for our
  purposes, state should only be kept in the database. if you disagree, let's have a conversation."
is_seam_ticket: true
interface_change: true
# The `state_io` contract block gains a meaningful `key` and overlay-expanded
# `database`/`table`, and StateStoreAdapter gains a `key_column` parameter --
# both public_api surfaces other node contracts declare against. No event, topic,
# or envelope shape changes.
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "ci"
    description: "PR #3002 CI checks green on OmniNode-ai/omnibase_infra"
    command: "gh pr checks 3002 --repo OmniNode-ai/omnibase_infra"
  - kind: "ci"
    description: "PR #2204 CI checks green on OmniNode-ai/omnimarket"
    command: "gh pr checks 2204 --repo OmniNode-ai/omnimarket"
  - kind: "tests"
    description: >-
      RED-first behavior proof for the runtime half. The contract-declared domain key, the outbox-guard
      gating, and both contract-overlay cases all fail against pre-fix handler_wiring -- the overlay cases
      with the literal, un-expanded ${env.ONEX_SESSION_PHASE_STATE_DATABASE:omnibase_infra} in the error
      text, which is the defect stated exactly. Executed at cwd ${OMNI_HOME}/omnibase_infra.
    command: "uv run pytest tests/integration/test_state_io_domain_key_omn16924.py -q"
  - kind: "tests"
    description: >-
      RED-first behavior proof for the node half. The live 750/750 permission shape is posed hermetically
      -- a cwd stripped of its write bit -- and raises the exact PermissionError against the pre-fix handler.
      Executed at cwd ${OMNI_HOME}/omnimarket.
    command: "uv run pytest tests/integration/node_session_phase_reducer/test_omn16924_state_in_database.py
      -q"
emergency_bypass:
