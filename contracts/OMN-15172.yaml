  - id: "dod-omn15170-live-driver-sigpipe-safe"
    description: >-
      Append-only replacement for dod-omn15170-steel220-live-driver-content (OMN-15411). The historical
      entry piped `gh api ... | base64 -d | grep -q '<marker>'` -- `grep -q` closes stdin at the first
      match, so the upstream `base64 -d` (and, transitively, `gh api`'s curl) is killed by SIGPIPE once
      the pipe drains; under `pipefail` (the dod_verify runner's shell mode) that SIGPIPE exit (128+13=141)
      propagates as the pipeline's exit code even though the substantive grep matched, producing a reproducible
      false RED inside the runner while the same command exits 0 when run directly (no pipefail, or an
      interactive shell that doesn't propagate the killed writer's status). This entry binds the same
      falsifiable content probe for leg (b) -- same gh api target, same marker -- but replaces the short-circuiting
      `grep -q` pipeline with a fail-closed buffered read: the decoded file body is assigned first, proving
      the producer completed, and `grep -qF` then checks the marker from that buffered body. Verified:
      repeated runs under `bash -o pipefail -c` exit 0 against the real marker; the same form against
      a mutated, absent marker string exits 1 (RED), proving the check stays falsifiable. This receipt
      binds the merged code fact only; it does NOT flip OMN-15170 to Done and does NOT adjudicate whether
      leg (b) satisfies OMN-15172's Done bar.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-omn15170-steel220-live-driver-content"
    checks:
      - check_type: "command"
        check_value: "gh pr view 220 --repo jonahgabriel/steel_onslaught --json state --jq .state | grep
