      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a probe run that reached no verdict does not set a report-backed criterion's colour -- falsifier: a test builds a run list whose newest settled run's report carries an UNPROVEN verdict and an older one carries GREEN, and asserts the criterion renders from the GREEN run, failing if it renders UNPROVEN
      - id: "AC2"
        statement: |-
          AC2: the criterion names which run it took its colour from, and says when that is not the newest settled run -- falsifier: a test asserts the rendered row carries the scoring run id and a reason string whenever the newest settled run was passed over
      - id: "AC3"
        statement: |-
          AC3: a genuine red is never damped by this -- falsifier: a test whose newest settled run reports a FAIL verdict asserts the criterion renders red, so that "could not measure" and "measured and failed" are distinguishable and only the first is skipped
      - id: "AC4"
        statement: |-
          AC4: holds measures something for a probe whose workflow conclusion is constant -- falsifier: a test over a run list of all-success conclusions whose reports alternate GREEN and UNPROVEN asserts holds is False, failing on today's behaviour where it is unconditionally True
      - id: "AC5"
        statement: |-
          AC5: the stability column's prose matches what it computes for report-backed criteria -- falsifier: the rendered column text is read back and names the verdict streak it measures, not a run-conclusion streak
