        check_value: >-
          grep -q '^status: PASS$' "$CONTRACT_REPO_DIR/drift/dod_receipts/OMN-18543/dod-omn18543-ac3-reconciler-notes-unreachable/command.yaml"
  - id: dod-omn18543-ac4-fail-closed-direction
    description: 'THE FAIL-CLOSED DIRECTION, which is the half that matters. Nothing added here can turn
      a stamp disagreement among RUNNING workloads into a pass, and no stamp is cleared or overwritten
      on a workload whose replicas are non-zero. The falsifier asserts the changed code contains no write
      to PROVENANCE_STAMP_ANNOTATION outside the existing STAMP_BEHIND branch, and that a replicas=1 Deployment
      with no running pod still produces the existing no_running_pod finding. Stated plainly so AC1 is
      not over-read: it narrows WHOSE claim counts, it does not soften the refusal for anything that is
      running.'
    source: manual
    status: verified
    binds_ac:
