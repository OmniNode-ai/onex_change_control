  - id: dod-omn18543-ac1-dormant-member-excused
    description: 'AC1 IS MET IN CODE AND PROVEN BY ITS OWN FALSIFIER. The plane-wide ambiguity verdict
      counts only workloads the gate makes a freshness claim about: _plane_stamp_findings takes an excused
      set and removes those names before computing distinct stamp values, so a workload holding the EARNED
      scaled-to-zero carve-out cannot contribute a distinct value to ambiguous_provenance_stamp. The falsifier
      is the criterion''s own: a plane of one replicas=1 member stamped A and one contract-declared replicas=0
      member stamped B asserts NO finding, and THE POSITIVE CONTROL asserts two replicas=1 members stamped
      A and B still refuse. Both directions run in the same file, so a carve-out that had swallowed every
      refusal would fail the control rather than pass silently.'
    source: manual
    status: verified
    binds_ac:
      - AC1
    ac_bindings:
      - label: AC1
        criterion_hash: 5dba59b23f04ddd835c4bec516849cf2f6f7094ba67447e1cf4438a3b5e380b4
        proposed_by: omn18543-ac-binding
    checks:
      - check_type: command
        check_value: >-
          grep -q '^status: PASS$' "$CONTRACT_REPO_DIR/drift/dod_receipts/OMN-18543/dod-omn18543-ac1-dormant-member-excused/command.yaml"
  - id: dod-omn18543-ac2-carve-out-is-earned
    description: 'THE CARVE-OUT IS EARNED, NEVER ASSUMED. earned_zero_replica_names grants it only when
      the LIVE reading is 0 AND the composition contract declares 0 for that same workload. A live 0 the
      contract says is non-zero, and a live 0 no contract knows, are excused from nothing: each still
      contributes its stamp and still produces its existing replicas_drift or unresolved_contract_replicas
      finding. The falsifier drives both disagreement shapes and asserts the ambiguity finding survives
      alongside the replicas finding, which is what stops the carve-out becoming a blanket amnesty for
      anything reading zero.'
    source: manual
    status: verified
    binds_ac:
      - AC2
    ac_bindings:
      - label: AC2
        criterion_hash: 64a69b832ed1743bc1ddfe4842f16ce2741200a3b7c6fea4846cc7b2bea3b431
        proposed_by: omn18543-ac-binding
    checks:
      - check_type: command
        check_value: >-
          grep -q '^status: PASS$' "$CONTRACT_REPO_DIR/drift/dod_receipts/OMN-18543/dod-omn18543-ac2-carve-out-is-earned/command.yaml"
  - id: dod-omn18543-ac3-reconciler-notes-unreachable
    description: CHECKED AND DECLINED IS DISTINGUISHABLE FROM NEVER LOOKED, as the reconciler's own docstring
      requires. plan_reconciliation emits a NOTE naming a runtime Deployment that carries a stamp and
      has no running pod target, rather than passing over it in silence. The falsifier passes a stamped
      Deployment with zero matching pods and asserts no write plus a note naming it; THE POSITIVE CONTROL
      passes one with a running pod and asserts the write still happens, so a reconciler that had stopped
      writing altogether would fail the control.
    source: manual
    status: verified
    binds_ac:
      - AC3
    ac_bindings:
      - label: AC3
        criterion_hash: 5e72da8d62c1f0b7f96149e2ee581e486578af70ee46566b59ee7d15086e53cc
        proposed_by: omn18543-ac-binding
