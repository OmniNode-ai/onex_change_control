schema_version: "1.0.0"
ticket_id: "OMN-16047"
title: "Unblock omnibase_infra releases: pin-resolvability gate budget is unreachable on the CI fleet"
summary: >-
  OCC companion for OmniNode-ai/omnibase_infra#2748. The release pipeline's PyPI pin-resolvability gate
  has never fit inside its 300s budget on this fleet -- its first real execution (tag v0.38.4) killed
  the release twice with a bare subprocess.TimeoutExpired that read exactly like the unresolvable-pin
  failure the gate exists to detect, and PyPI is still at 0.36.1. The pins are fine: the full resolve
  is 1.3s and the complete --no-cache install 5.3s locally; what does not fit in 300s is the download
  on a fleet where even a fully-cached uv sync measured 110-402s under load. The fix raises the install
  budget to 1800s (env-overridable), gives uv venv its own 120s budget, converts the timeout into a typed
  error carrying partial uv output with a distinct THROUGHPUT-failure report, and raises the release job
  ceiling so the script's diagnostic -- not an opaque job kill -- is what surfaces.
is_seam_ticket: false
interface_change: false
