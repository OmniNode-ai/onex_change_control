schema_version: "1.0.0"
ticket_id: "OMN-16427"
title: "omninode_infra ci.yml Contract Compliance Check (ubuntu-latest) cannot reach internal PyPI mirror"
summary: >-
  omninode_infra/.github/workflows/ci.yml's contract-compliance job (Contract Compliance Check, a STRICT_GATE_JOBS
  member that CI Summary fails-closed on) was hardcoded runs-on: ubuntu-latest unconditionally. Its uv
  run executes against a fresh clone of onex_change_control, whose dependency set resolves from the internal-only
  .201 Tailscale PyPI mirror (omninode-pc.tail75df5e.ts.net:3141), which ubuntu-latest cannot reach --
  confirmed on omninode_infra#967/#968 (13 consecutive reruns over ~45 minutes, each a fresh DNS error
  on a different newly-resolved package). Same defect class as OMN-16413 (omnibase_core#1579, merged d61fdc938a)
  and OMN-16428 (omnimarket#2130, same pattern). Fixes the runner selector to the existing OMN-15699 fork-aware
  OMNI_RUNNER_SELECTOR_V1 idiom already used by this repo's own deploy-gate.yml / main-target-guard.yml:
  only an actual fork PR (head.repo != base repo) routes to ubuntu-latest; every same-repo pull_request,
  push, and merge_group routes to the tailnet-connected self-hosted omnibase-ci fleet. Does not widen
  the trust boundary -- untrusted fork code still never reaches the self-hosted fleet. Unblocks omninode_infra#967
  (OMN-10878) and #968 (OMN-16097), both code-complete and auto-merge-armed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
