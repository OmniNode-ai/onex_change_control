      `head.repo.full_name != github.repository`, exit 0) and RED at merge-base 3ee932a75b2d220d611e5b37a7a962f4dffedc3d
      (dev tip before the fix -- zero occurrences of that string anywhere in the file, still bare `runs-on:
      ubuntu-latest` in the contract-compliance job block).
