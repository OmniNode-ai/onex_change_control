        statement: |-
          AC4: The ticket-creation gate records its acceptance-criterion rewrite refusal under its own reason token, distinct from the create-admission token -- falsifier: uv run pytest tests/hooks -k ticket_gate_update_refusal_reason_token -q feeding an update that rewrites a criterion line and asserting the recorded reason is not issue-create-not-bound-to-a-commitment
      - id: "AC5"
        statement: |-
          AC5: After the fix, the share of hook rows naming a lane is measured on the live ledger over one day and recorded on this ticket, with the count of rows still unresolved and why -- falsifier: a grep of docs/tracking/ROLLING_WORK_LEDGER.md for rows carrying actor=hook written after the fix, counting lane=unresolved against the total
