  - id: "dod-deploy-arm64-runner-asset-resolves"
    description: |-
      DEPLOY SCOPE. The change makes the runner image multi-arch: every external
      binary download now resolves its architecture from Docker's TARGETARCH
      instead of a hardcoded amd64 literal. The deployed consequence being
      checked is that the arm64 asset the image actually fetches, at the exact
      version the Dockerfile pins, EXISTS upstream. If it does not, the image
      cannot be built on an arm64 host at all -- it dies at the first curl,
      which is precisely the defect this change removes.

      Falsifiable, and the falsifier was run: the same probe against a version
      with no such asset returns exit 1. It queries the live upstream release
      API, never this contract or a receipt authored beside it, so it cannot
      pass by grepping text written in the same change.

      LIMIT, STATED. This proves the arm64 build input resolves. It does NOT
      prove a runner is registered on the arm64 host -- the probe for that
      reads the org runner registry, which requires org-admin scope that CI's
      token does not hold, so asserting it here would produce a check that
      fails for a permissions reason and says nothing about the fleet. That
      readback was taken out of band and is recorded in the product PR by
      runner name, label set, and per-credential sha256-12 and byte length.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/actions/runner/releases/tags/v2.336.0 --jq '.assets[].name' | grep
          -qx actions-runner-linux-arm64-2.336.0.tar.gz"
