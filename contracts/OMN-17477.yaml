  - id: "dod-deploy-arm64-verify-runner-online"
    description: |-
      DEPLOY SCOPE. The change makes the runner image multi-arch and the fleet
      multi-host, and its deployed consequence is a second host actually
      carrying a registered runner on a different CPU. This probe asks the live
      GitHub org runner registry whether that runner is registered AND carries
      the arch label the change introduces.

      Falsifiable by construction, in both directions that matter: it goes RED
      if the arm64 host is not registered at all, and it goes RED if the runner
      is registered without the arch label -- which is the failure that would
      let an architecture-assuming job be placed on the wrong CPU. It reads the
      live registry, never this contract or a receipt this PR authors, so it
      cannot pass by grepping text written alongside it.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api orgs/OmniNode-ai/actions/runners --paginate --jq '.runners[] | select(.name
          == \"omninode-mini-runner-1\") | .labels[].name' | grep -qx arch-arm64"
