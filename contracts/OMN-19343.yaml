  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a comparison of a model against itself reports no significant difference at the stated confidence (the valid half) -- falsifier: a self-comparison run asserts the reported difference is not significant at the declared confidence level
      - id: "AC2"
        statement: |-
          AC2: a comparison against a deliberately degraded rung reports the difference (the known-bad half) -- falsifier: a run against a degraded rung asserts the harness reports a significant difference
      - id: "AC3"
        statement: |-
          AC3: a comparison run with fewer prompts than its power analysis requires is refused -- falsifier: a test running the harness with an undersized sample asserts refusal naming the required n
