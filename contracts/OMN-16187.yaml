schema_version: "1.0.0"
ticket_id: "OMN-16187"
title: "Local core bring-up must not require credentials only a private vault can supply"
summary: >-
  A clean-room self-install proof found that `onex up core` refused to start until eight env vars were
  set, three of which a self-hosting operator cannot possess before the first bring-up. The Infisical
  in the core bundle is a container on the operator's own host, so its secrets are theirs to mint; the
  machine identity (INFISICAL_CLIENT_ID / _CLIENT_SECRET / _PROJECT_ID) is minted by setup-infisical-identity.sh
  at step 4 of bootstrap-infisical.sh, against the container `onex up core` is what starts. It was an
  output of bootstrap demanded as an input to it, and nothing in the core stack consumed it. The gate
  moves to the runtime bundle, where its only consumer (runtime_host_process config prefetch) lives; `.env.example`
  is completed to match what bring-up enforces; the repo-local `.env` that install.sh creates is now actually
  read; and scripts/generate-local-env.sh generates the complete working local secret set in one command.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #2785 product diff scope present"
    command: "gh pr view 2785 --repo OmniNode-ai/omnibase_infra --json files"
emergency_bypass:
