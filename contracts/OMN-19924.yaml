---
schema_version: "1.0.0"
ticket_id: "OMN-19924"
title: "The public quickstart shows a developer their delegation record and the real first-start time"
summary: >-
  OmniNode-ai/knowledge_base#97 (merge 3b9850cdc15d) added the onex metering subsection to guides/onex-plugin-quickstart.md,
  replaced the 10 to 20 second first-start claim with up to a minute (36 seconds measured), and dropped
  the fixed executable count. The public repository carries no ticket ids, so its evidence lives here.
  Each item runs the ticket's own falsifier with git show at the merge commit, in a knowledge_base checkout;
  the same command at the merge base 1a4dca513fa5 fails.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19924-quickstart"
    statement: "The public plugin quickstart shows onex metering, states the measured first-start time,
      and names no fixed executable count."
    acceptance:
      - id: "AC1"
        statement: "AC1: guides/onex-plugin-quickstart.md on knowledge-base main has a step that runs
          onex metering and says what it prints -- falsifier: git show origin/main:guides/onex-plugin-quickstart.md
          piped to grep -c 'onex metering' printing 0"
      - id: "AC2"
        statement: "AC2: the guide's first-run timing statement covers the measured 36 s first start --
          falsifier: git show origin/main:guides/onex-plugin-quickstart.md piped to grep -c '10 to 20'
          printing a non-zero count"
      - id: "AC3"
        statement: "AC3: the guide names no fixed executable count -- falsifier: git show origin/main:guides/onex-plugin-quickstart.md
          piped to grep -c 'Installed 20 executables' printing a non-zero count"
evidence_requirements:
  - kind: "ci"
    description: "The quickstart at the knowledge_base#97 merge commit passes the three falsifiers."
    command: "git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19924-ac1-metering-step"
    description: >-
      The guide at the knowledge_base#97 merge has a subsection that runs onex metering and says what
      it prints (runs, tokens sent and received, spend, what the calls would have cost). The merge base
      has no onex metering line.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          git cat-file -e 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md && git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md | grep -c 'onex metering' && git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md | grep -c 'prints, for the last 7 days'
          # Repository: https://api.github.com/repos/OmniNode-ai/knowledge_base/commits/3b9850cdc15df13f1d5ea16400ac91f300f76fb8
        cwd: "${OMNI_HOME}/knowledge_base"
    binds_ac:
      - "AC1"
  - id: "dod-omn19924-ac2-first-start-time"
    description: >-
      The guide at the knowledge_base#97 merge says the first run can take up to a minute (36 seconds
      on a fresh install) and no longer says 10 to 20. The merge base says 10 to 20 and has no 36 seconds.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          git cat-file -e 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md && git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md | grep -c '36 seconds' && ! git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md | grep -n '10 to 20'
          # Repository: https://api.github.com/repos/OmniNode-ai/knowledge_base/commits/3b9850cdc15df13f1d5ea16400ac91f300f76fb8
        cwd: "${OMNI_HOME}/knowledge_base"
    binds_ac:
      - "AC2"
  - id: "dod-omn19924-ac3-no-executable-count"
    description: >-
      The guide at the knowledge_base#97 merge says the install ends with a count of executables and names
      no fixed count. The merge base says Installed 20 executables.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          git cat-file -e 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md && ! git show 3b9850cdc15df13f1d5ea16400ac91f300f76fb8:guides/onex-plugin-quickstart.md | grep -n 'Installed 20 executables'
          # Repository: https://api.github.com/repos/OmniNode-ai/knowledge_base/commits/3b9850cdc15df13f1d5ea16400ac91f300f76fb8
        cwd: "${OMNI_HOME}/knowledge_base"
    binds_ac:
      - "AC3"
