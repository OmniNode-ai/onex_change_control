      - check_type: "command"
        check_value: |-
          gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_dod_verify/services/evidence_collector.py?ref=eddc191fef1e4f14e6cf5c11dd57b1c0cb64d623" | grep -c 'def _pinned_product_clone_resolution'
  - id: "dod-omn18117-ac2-omn16846-ac5-not-weakened"
    description: >
      AC2 - a clone that is missing the merge under adjudication is still refused, in both halves of the
      fix. In omnimarket the fixture proves the refusing direction three ways at the same commit as AC1's
      passing direction: a clone behind its own recorded pin is SKIPPED with cause PRODUCT_CLONE_STALE
      and a behind_count of 1; that refused command still never executes, proven by a side-effect canary
      file that must not appear; and a pinned commit absent from the clone's object database is STALE
      rather than UNKNOWN, because a --depth 1 tree copied at an older SHA never receives the newer tip's
      object and HEAD cannot contain a commit the repository has never seen. In omnibase_infra the property
      that makes those refusals reachable at all is asserted at PR time: what the materialise loop records
      is the UPSTREAM TIP, never the clone's own HEAD. A HEAD-derived pin is vacuous, since HEAD always
      equals itself, and would read FRESH for every tree including one that was already behind when the
      run picked it up - which is exactly the OMN-16846 AC5 refusal this ticket is forbidden to weaken.
      Bound by hand (append-only union, OMN-13888).
    source: "generated"
    binds_ac:
