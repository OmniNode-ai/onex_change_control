schema_version: "1.0.0"
ticket_id: "OMN-18117"
title: "Product-clone freshness check compares against the moving upstream tip, not the SHA materialised
  for the run"
summary: >
  Autobind companion authored for OmniNode-ai/omnimarket PR #2439, then extended (append-only, OMN-13888)
  by an OCC union with the second autobind companion for OmniNode-ai/omnibase_infra PR #3384, plus the
  two AC-bound evidence items neither autobind shape carries. One ticket produced PRs in two repositories,
  so each PR's autobind authored the same contracts/OMN-18117.yaml and the second went add/add DIRTY the
  moment the first merged; this is the union resolution. Every entry from the first companion is byte-unchanged
  and keeps its own entry hash, and the entries from the second are spliced verbatim except for the shared
  dod-occ-diff-derived-behavior-proof id, which is kept as the first companion authored it (the omnimarket
  suite, which is the half that decides the verdict) while the second repository's behaviour proof is
  carried under its own id so no id appears twice. The two appended items bind AC1 and AC2. AC3 is the
  post-merge readback on the first scheduled sweep tick and cannot be proven before this merges; AC4 is
  the ledger row and the ticket comment naming the chosen fix. Both are deliberately left unbound and
  recorded on the ticket instead. What the product PRs fix: the evidence-autoclose sweep materialises
  every product clone once near the start of its job and then runs dod_verify behaviour checks against
  those trees for the next twenty-odd minutes, while EvidenceCollector decided freshness at check time
  by fetching origin/<branch> again and comparing the clone's HEAD against that fresh fetch's tip - so
  any ordinary merge landing inside the window made a clone that genuinely contains the work under adjudication
  read behind N, and the behaviour check pinned there was refused unexecuted as PRODUCT_CLONE_STALE. Run
  34428131180 at 2026-09-10T02:06:28Z carried eight tickets that way, each with zero failed checks and
  nothing proven either direction. The fix freezes the comparison target: omnibase_infra records, per
  tree, the upstream tip it materialised against and renders a pin file both check-bearing steps export;
  omnimarket measures HEAD against that recorded commit and performs no fetch. The recorded commit is
  the upstream TIP, never the clone's own HEAD, because a HEAD-derived pin is vacuous and would launder
  a tree that was already behind when the run picked it up - the OMN-16846 AC5 refusal, which is out of
  scope to weaken. No credential was rotated, re-issued, revoked or minted, no secret value was read or
  printed, and no cluster object was mutated. Rule 24 stated rather than implied: the closer is a scheduled
  GitHub Actions job with no .201 dev-lane or k3s lab overlay surface, so no lab pass is claimed for it
  and the first scheduled sweep run after these merge is the live readback.
