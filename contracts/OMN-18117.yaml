  - id: "dod-omn18117-ac1-red-first-pinned-verdict"
    description: >
      AC1 - a RED-first fixture where a clone is materialised at sha_A (containing the merge under adjudication),
      dev then advances to sha_B before the freshness check runs, and the check executes instead of being
      refused. Built against real git repositories rather than stubbed git calls: a bare origin on dev,
      a commit adding proof.txt, a clone taken at that commit, then a second unrelated commit pushed to
      origin. At the parent commit the pinned case failed with SKIPPED is not VERIFIED and the collector
      logged 'clone freshness is stale ... behind=1' on a tree that demonstrably contains proof.txt. The
      same file also carries the defect premise stated without the fix (a mid-run merge alone refuses
      a clone that contains the work), which passes at the parent and after, and an assertion on the git
      argv that a pinned run spawns no fetch at all - a run that still fetched would be one upstream advance
      away from the defect returning. The first probe requires the AC1 case to be present in the suite
      at the omnimarket PR head; the second requires GitHub's own file-status for that path in PR #2439
      to be 'added', which is what makes the first a statement about a change rather than about a file
      that was always there. Bound by hand (append-only union, OMN-13888) because the autobind entries
      declare no binds_ac at all.
    source: "generated"
    binds_ac:
      - "AC1"
    checks:
      - check_type: "command"
        check_value: |-
          gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omnimarket/contents/tests/unit/nodes/node_dod_verify/test_omn_18117_pinned_product_clone_verdict.py?ref=eddc191fef1e4f14e6cf5c11dd57b1c0cb64d623" | grep -c 'def test_a_mid_run_merge_does_not_change_a_pinned_verdict'
      - check_type: "command"
