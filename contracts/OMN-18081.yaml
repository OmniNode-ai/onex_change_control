---
schema_version: "1.0.0"
ticket_id: "OMN-18081"
title: "API-key creation UI: make the user-entered label visible, and say a key can carry one"
summary: >
  OCC companion for OmniNode-ai/omniweb PR #364, binding AC1, AC2 and AC3. Bound by hand (union-resolve),
  the same way OCC#8760 was bound for omninode_infra#1266 and OCC#8787 for omninode_infra#1274: OMN-18073
  records that autobind is not minting companions in this window, and on this PR the occ-companion-effect
  job failed outright with "the lane declares security_protocol=SASL_PLAINTEXT / sasl_mechanism=SCRAM-SHA-256,
  but KAFKA_SASL_USERNAME and/or KAFKA_SASL_PASSWORD are not set in this job's environment" (run 34355977342),
  so no companion could be published and #364 has no receipt to cite. Cause of the ticket: the operator
  reported from the dev dashboard that "users cannot actually add in a label for the key anymore". The
  important finding is that NOTHING HAD BEEN REMOVED — read-only at origin/dev acec8de the label input
  still rendered, resolveKeyLabel still returned a typed label verbatim, action-logic forwarded it, api-client
  POSTed it as {name}, and the gateway's ApiKeyCreateBody requires and STORES that name (1-128, ^[\w\s\-\.]+$),
  so no omninode_infra change was needed and none was made. The operator-visible outcome was produced
  by three compounding things, none of them a removal - both mints write a name with NO PROMPT AT ALL
  (the gateway's at sign-up via DEFAULT_SIGNUP_API_KEY_NAME, and the panel's own first-visit backfill),
  the input sat behind a "New API key" toggle with nothing hinting it existed, and the page header read
  "you never type one in", which is true of the SECRET but reads as a statement about the whole panel.
  #364 opens the create form permanently so the label is reachable without first guessing that a button
  conceals it, scopes the header's claim to the credential and states the label is the customer's to give
  or leave blank, and captions an auto-named key as auto-named. The caption is the ticket's stated alternative
  to a rename - the gateway exposes NO PATCH /v1/api-keys/{id} (routers/api_keys.py carries post, get
  and delete only), so a rename is not buildable and is out of scope on the ticket. Both protections OMN-18011
  bought are preserved and now pinned rather than left to inspection: the submit control is still never
  gated on the label being non-empty (AC1 of that ticket, operator ruling 2026-09-06), and validateKeyLabel
  still refuses an onxk_-prefixed label, which is the mistake that put a 17-character key fragment in
  key d0554098's stored name. The PR closes the gap AC3 names - no test pinned that a label input renders
  AT ALL, so a regression deleting it outright would have gone green - with a new suite wired as CI Gate
  4l, RED at acec8de (10 of 17 fail) and GREEN at the pushed head. AC4 (the staging readback on dev.app
  after delivery) is deliberately NOT bound here: it cannot be proven before this merges and reaches onex-dev.
  Rule 24 is stated rather than implied - the .201 compose dev lane runs no dashboard, so there is no
  lab surface for this change, no lab pass is claimed, and the staging readback is the proof. A second
  commit on the same PR bumps the pnpm sharp override off the vulnerable exact pin 0.35.0 to '>=0.35.4
  <0.36'; that is unrelated to the label fix but was blocking it and every other open PR in the repo,
  and it is evidenced separately below. No credential was rotated, re-issued, revoked or minted, no secret
  value was read, printed or decoded, and no cluster object was mutated (rule 22).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
