      Behavior proof for PR #364 on OmniNode-ai/omniweb, derived from the PR's own diff: the suite the
      PR adds, which renders the real ApiKeyManager through renderToStaticMarkup and asserts that a
      label input is present on FIRST PAINT with no interaction, that the panel and page copy state a
      label is possible, and that both OMN-18011 protections still hold (the submit control is never
      gated on an empty label; an onxk_-prefixed label is still refused). Every source-scanning
      assertion carries a positive control. Executed at cwd `${OMNI_HOME}/omniweb`.
    command: |-
      pnpm test:api-key-label-affordance
