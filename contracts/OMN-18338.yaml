  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 — a pull request with no description line but a merged companion verifies. The receipt gate and the verifier both resolve the binding from the companion and pass. RED first: the same pull request fails today with no evidence found. — falsifier: a fixture pull request whose description carries no evidence line, paired with a merged companion naming it, asserts a passing verdict from both surfaces — red before the change, green after.
      - id: "AC2"
        statement: |-
          AC2 — a pull request with neither line nor companion still fails. Absence of evidence is still a refusal; this is not a widening of what counts as proven. — falsifier: a fixture with no companion asserts the same failure as today, with the same reason string.
      - id: "AC3"
        statement: |-
          AC3 — the resolution is from the companion side, not a second description parse. The lookup goes companion → product pull request, not the reverse. — falsifier: a fixture whose description carries a line pointing at a different companion asserts the verdict follows the companion that actually names the pull request, not the description's claim.
      - id: "AC4"
        statement: |-
          AC4 — the description line still works where present, with no behaviour change. Existing passing pull requests keep passing by the same path. — falsifier: a regression fixture of a currently-passing pull request asserts an identical verdict and reason before and after.
      - id: "AC5"
        statement: |-
          AC5 — both gates agree. The receipt gate and the verifier return the same verdict for every fixture in this ticket. — falsifier: a parametrised test running each fixture through both surfaces and asserting verdict equality.
