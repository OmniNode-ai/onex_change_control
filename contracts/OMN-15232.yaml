schema_version: "1.0.0"
ticket_id: "OMN-15232"
title: "Fail-close the deserialization-path DLQ publish in event_bus_kafka"
summary: >-
  OCC companion for omnibase_infra branch jonah/omn-15232-deser-dlq-fail-closed (commit ceb33d341). EventBusKafka._consume_loop
  awaited _publish_raw_to_dlq() on the deserialization failure path and DISCARDED the returned bool, then
  continued; consumers built by that class run with enable_auto_commit defaulting to True, so the client
  committed the fetch position whether or not the DLQ write landed. A failed DLQ publish on a poison message
  was therefore a silent, committed, unrecoverable drop -- the OMN-14936 failure mode at a call site the
  OMN-14936 fix (5x "if not dlq_persisted: return" in runtime/event_bus_subcontract_wiring.py) did not
  cover. The required module audit found a second ungated site: _dispatch_to_subscriber discarded the
  DLQ result on the retries-exhausted branch, and MixinKafkaDlq._publish_to_dlq returned None unconditionally,
  so no caller could have gated on it. The fix returns the persistence bool from _publish_to_dlq, gates
  both call sites, and -- because this loop never commits (the client does), making "withhold the commit"
  a no-op here -- rewinds the fetch position with consumer.seek(tp, msg.offset), the same non-advancing
  idiom KafkaTransport.nack already uses.
