dod_evidence:
  - id: "dod-omn18041-ac1-overlay-entry-added"
    description: >-
      AC1 — omninode_infra#1235 adds FEATURE_WAITLIST_MODE to the dev overlay patch. Read from the PR's
      own diff via the GitHub API, so the check survives branch deletion and needs no credential beyond
      the CI token. This row is also the POSITIVE CONTROL for the two zero-count rows below: it finds
      the string this PR really does add, so a zero there is a real absence rather than a broken query.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr diff 1235 --repo OmniNode-ai/omninode_infra | grep -c '^+.*name: FEATURE_WAITLIST_MODE')"
          = "1"
  - id: "dod-omn18041-ac2-shared-base-untouched"
    description: >-
      AC2, blast radius (the half that matters) — the PR touches no file under k8s/onex-dev/. That directory
      is the base applied to the PRODUCTION-FACING cluster as well, because the onex-dev NAMESPACE owns
      the public app/api/dash hostnames. Leaving it untouched is what keeps public self-registration closed
      and does not pre-empt OMN-17355.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: >-
          test "$(gh pr view 1235 --repo OmniNode-ai/omninode_infra --json files --jq '[.files[].path
          | select(startswith("k8s/onex-dev/"))] | length')" = "0"
  - id: "dod-omn18041-ac2-prod-overlay-untouched"
    description: >-
      AC2, prod half — the PR touches no file under k8s/onex-prod/. deploy-onex-prod.yml applies k8s/onex-prod
      and never k8s/onex-dev-overlay-dev, so the change has no path to the public cluster.
    source: "generated"
    checks:
