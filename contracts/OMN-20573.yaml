      are transcribed from the ticket body. None is bound via binds_ac here: AC3 reads the dev-202 redpanda,
      which cannot be measured before omnimarket#3414 is deployed, and binding only AC1 and AC2 is refused
      as partial coverage (OMN-18333)."
    acceptance:
      - id: "AC1"
        statement: "AC1: a trigger effect on onex.evt.platform.node-heartbeat.v1 publishes the probe command
          at most once per 900 seconds and nothing on a throttled heartbeat -- falsifier: uv run pytest
          tests/test_hook_chain_probe_wiring.py -q in omnimarket"
      - id: "AC2"
        statement: "AC2: a verdict effect consuming the probe completed and failed events logs an error
          for a broken chain and publishes onex.evt.omnimarket.hook-chain-health-recorded.v1 -- falsifier:
          uv run pytest tests/test_golden_chain_hook_chain_probe_verdict_effect.py -q in omnimarket"
