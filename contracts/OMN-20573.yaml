title: "Hook-chain health is probed on a schedule and the verdict is recorded"
summary: "Adds a trigger effect that publishes the hook-chain probe command at most once per 900 seconds
  from the node heartbeat, and a verdict effect that records the probe result. AC1 and AC2 have passing
  test receipts. No criterion is bound via binds_ac yet: AC3 is a dev-202 bus readback that cannot run
  before omnimarket#3414 is deployed, and a partial binding is refused (OMN-18333)."
