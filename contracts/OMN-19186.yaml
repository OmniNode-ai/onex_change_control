        statement: |-
          AC-1: A house-tenant overlay row is resolved at routing time exactly as a customer row is — falsifier: a row written for tenant_id = "omninode" that a routing-intent request attributed to the house tenant does not resolve.
      - id: "AC2"
        statement: |-
          AC-2: OMN-15631 AC4 (a customer overlay never applies to the house tenant, and a house row never applies to a customer) is re-proven by test after the short-circuit is lifted, by tenant_id scoping rather than by the fast path — falsifier: a test that proves AC4 only by asserting the short-circuit still exists.
      - id: "AC3"
        statement: |-
          AC-3: A writer exists for house rows that is not the BYOK credential bridge, takes a typed declaration (backend_id, endpoint_url, model_name, secret_ref optional, tier membership) and refuses a partial one — falsifier: a declaration missing a required field that writes a row.
      - id: "AC4"
        statement: |-
          AC-4: A declared-but-unreachable backend is a health fact, not a load-time refusal — falsifier: a write or a resolution that probes the endpoint and refuses the row because nothing answers.
      - id: "AC5"
        statement: |-
          AC-5: Lab readback on the .201 dev lane: one dummy house row declaring an unreachable endpoint is written through the new writer, the deployed routing-intent path resolves it for the house tenant, every existing rung still resolves, a customer-attributed request does not see it, and the row is deleted afterwards with its absence read back — falsifier: any of those five observations absent from the evidence.
