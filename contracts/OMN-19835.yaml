        statement: |-
          AC4: a repository config that declares the added-lines scope with no diff source refuses with exit 2, and a config without the scope keeps whole-tree enforcement -- falsifier: uv run pytest tests/scripts/test_public_repo_hygiene_gate.py -k scope -q fails
