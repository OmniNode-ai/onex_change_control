      probe: reads the omniclaude uv.lock blob at the PR's own head commit through the GitHub API, so
      it executes against a surface this OCC PR does not author, and it is falsifiable — verified GREEN
      at head 7ddd4f26f9628a29f332d4ffff752239f53e47e3 (uv.lock's omnibase-core sdist entry is omnibase_core-0.46.11.tar.gz)
      and RED at merge-base c0be3ff5dc04b80d3f65878c76126df9d22ddd6b (dev tip immediately before this
      PR's bump, uv.lock still pins the omnibase_core-0.46.8.tar.gz sdist).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          body="$(gh api 'repos/OmniNode-ai/omniclaude/contents/uv.lock?ref=7ddd4f26f9628a29f332d4ffff752239f53e47e3'
          --jq .content | base64 -d)" && printf '%s' "$body" | grep -qF 'omnibase_core-0.46.11.tar.gz'
