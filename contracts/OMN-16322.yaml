---
schema_version: "1.0.0"
ticket_id: "OMN-16322"
title: "occ-preflight cold-runner timeout lands passing jobs as CANCELLED"
summary: >-
  Raises the occ-preflight / eligibility job timeout from 10m to 15m. On a cold trusted-CI runner the
  job spends ~2m38s in Set up job (image pull) and ~4m05s checking out omnibase_compat before the eligibility
  check starts, so it reaches ~10m wall and the timeout fires during results upload, after every step
  including Complete job has already succeeded. GitHub stamps a timed-out job cancelled, and both CI Summary
  and GitHub's required-check semantics fail closed on cancelled, so a job that logged "OCC eligibility:
  PASS" still blocks the PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-onex-change-control-pr-6805-timeout"
    description: >-
      onex_change_control PR #6805 changes only .github/workflows/call-occ-preflight.yml, raising the
      occ-preflight / eligibility job timeout from 10 to 15 minutes. Observed against the live PR file
      list rather than a pinned head commit so a branch refresh from dev cannot stale the evidence, while
      still failing if the workflow file is absent from the PR.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6805 --repo OmniNode-ai/onex_change_control --json files --jq '.files[].path' | grep
          -Fx '.github/workflows/call-occ-preflight.yml'
  - id: "occ-self-bind-pr-6805"
    description: >-
      OCC self-binding receipt for PR #6805, the in-repo evidence PR carrying this contract and the workflow
      repair. Binds OMN-16322 to the OCC PR by pr_number so the OCC receipt-gate eligibility check can
      resolve a PASS receipt for the evidence PR itself.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6805 --repo OmniNode-ai/onex_change_control --json number,state
