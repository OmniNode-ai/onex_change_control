      the OMN-15731/OCC#6686 draft-state admission pattern. Content-pinned RED-before/GREEN-after differential:
      fetches .github/workflows/ci.yml at both the PR's base and head SHAs via the GitHub contents API
      and confirms the coverage-sweep-gate job's `if:` is unconditional (`if: always()`) at base but carries
      the draft-state clause at head.
    source: "manual"
