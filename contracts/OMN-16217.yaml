        check_value: >-
          base_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/.github/workflows/ci.yml?ref=f03ed4125d235069cb1e2472b3b5a71684d9b5ed"
          --jq .content | base64 -d)"; head_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/.github/workflows/ci.yml?ref=d41a190f6c86df12ea4c013368ef65e89e52aabf"
          --jq .content | base64 -d)"; base_if="$(printf '%s' "$base_body" | awk '/^  coverage-sweep-gate:/,/steps:/'
          | grep 'if:')"; head_if="$(printf '%s' "$head_body" | awk '/^  coverage-sweep-gate:/,/steps:/'
          | grep 'if:')"; printf '%s' "$base_if" | grep -qF 'if: always()' && ! printf '%s' "$base_if"
          | grep -qF 'draft' && printf '%s' "$head_if" | grep -qF 'github.event.pull_request.draft' &&
          echo "OMN-16217-MKT-2107-DIFFERENTIAL-PROBE-PASS: coverage-sweep-gate if: is unconditional at
