requirements:
  - id: "req-current-acceptance-criteria"
    statement: "Acceptance criteria transcribed from the live ticket for local binding validation."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Candidate rows and lines that carry no declared decision class are enumerated deterministically, from the ledger corpus and from the checkpoint files, before any delegation happens -- falsifier: a test supplies a corpus with a known count of untagged candidates and asserts the enumerator returns exactly those, with declared-class rows excluded.
      - id: "AC2"
        statement: |-
          AC2: Each candidate is classified through `onex delegate` against a typed request and response contract, and a response that does not validate against that contract is discarded rather than coerced -- falsifier: feed the classifier a malformed response and assert the candidate resolves to `none` with the reason recorded, not to a partially parsed entry.
      - id: "AC3"
        statement: |-
          AC3: A result below the declared confidence floor resolves to `none` -- falsifier: a test supplies a response naming a class with a confidence under the floor and asserts no entry is proposed; a second supplies the same class above the floor and asserts one is.
      - id: "AC4"
        statement: |-
          AC4: A proposed entry is written carrying `source=delegated` and `confirmed=false`, and the tab renders it visibly distinct from a deterministic entry -- falsifier: assert the rendered HTML for a delegated entry carries the distinguishing marker and a deterministic one does not.
      - id: "AC5"
        statement: |-
          AC5: Every delegation records its receipt fields — model, tier, endpoint and correlation identifier — and a run that cannot record them is a refusal rather than an unattributed classification -- falsifier: run the classifier with the receipt fields absent from the response and assert the run refuses naming what was missing.
      - id: "AC6"
        statement: |-
          AC6 (labelled criterion — a delegated entry never becomes deterministic by itself): No path promotes a `confirmed=false` entry to a deterministic one; confirmation comes only from a declared decision-class ledger row being appended and the deterministic parser then seeing it -- falsifier: run the generator twice over an unchanged corpus carrying a delegated entry and assert the entry is still `confirmed=false` on the second run, and that appending a real declared row for the same decision produces a deterministic entry that supersedes it.
