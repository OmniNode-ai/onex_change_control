  # two of AC4's four regressions did not exist yet at that commit.

  - id: "ac1-correlation-join-refuses-a-foreign-receipt"
    description: >-
      AC1: "The stdout receipt of a shared-bus delegation renders THIS run's payload, never another run's."
      The mechanism is the correlation join in receipt_mode.py: _declared_correlation_ids collects every
      correlation the stored content claims at BOTH levels (the envelope's own and its nested payload's),
      and _verify_workflow_data_correlation requires SET EQUALITY with this run's id, so a mixed envelope
      carrying this run's id alongside a foreign one refuses too rather than passing on a membership test.
      Read remotely at the pinned merge commit, not from a local checkout, so the check answers a question
      about the landed source. The regression that pins it reproduces this ticket's own 2026-08-31 recurrence
      shape: a retained prior-run envelope carrying the prompt "reply with the single word: ok" and the
      previous night's envelope_timestamp, served under this run's id.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |-
          src="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/cli/receipt_mode.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; tst="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/cli/test_cli_node_receipt.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; grep -q 'def _declared_correlation_ids' <<< "$src" && grep -q 'def _verify_workflow_data_correlation' <<< "$src" && grep -q 'if declared == {expected}:' <<< "$src" && grep -q 'def test_real_dispatch_path_refuses_a_stale_terminal_envelope' <<< "$tst"

  - id: "ac2-run-scoped-state-root-present"
    description: >-
      AC2, the positive half: "Two invocations sharing one --state-root each keep and render their own
      result." resolve_run_state_root keys the runtime's state root by run_id, so two peers sharing a
      --state-root have no shared address to collide on and there is no write/read window to serialise.
      Pinned together with the two regressions that prove the behaviour rather than the name: one at unit
      level over a shared root, and one driving two REAL processes over a shared root and asserting on
      CONTENT, which is the cross-boundary regression this ticket has asked for since 2026-08-02.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          src="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/cli/receipt_mode.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; u="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/cli/test_omn16533_run_scoped_workflow_result.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; i="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/integration/test_omn16533_cross_process_run_scoped_state.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; grep -q 'def resolve_run_state_root' <<< "$src" && grep -q 'def test_a_second_invocation_cannot_clobber_the_first_runs_result' <<< "$u" && grep -q 'def test_each_process_reports_its_own_result_not_the_others' <<< "$i"

  - id: "ac2-negative-control-absent-at-the-earlier-merge"
    description: >-
      AC2, the negative control. The same remote read against omnibase_infra#3540's own merge commit 7a832ddbc1784c050e2fb5bea662ec1b825a006e,
      which is THIS ticket's product PR and lands three weeks of receipt-mode work, must NOT find resolve_run_state_root
