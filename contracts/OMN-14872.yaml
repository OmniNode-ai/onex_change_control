  # --- AC bindings added 2026-09-17 by lane omn14872-receipt-content-build-1138 ---
  # This ticket carried no acceptance criteria from 2026-07-20 until 2026-09-17, so
  # every entry above it is unbound and stays that way: the Append-Only Gate holds a
