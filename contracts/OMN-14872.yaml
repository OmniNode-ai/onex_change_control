  - id: "ac3-shared-socket-concurrency-regression-present"
    description: >-
      AC3: "Concurrent invocations sharing one emit socket cannot corrupt each other's process-global
      receipt state." The regression holds the first caller inside the receipt critical section and asserts
      the second cannot reach its runtime until the first is explicitly released -- a causal assertion,
      not a timing-based race probe that would pass by luck on a fast machine. It then asserts each caller's
      stdout receipt names its own correlation and its own result marker, that neither's capture log or
      artifact carries the other's content, and that the host process's root logging handlers, level,
      disabled flag and two env vars are all restored.
    source: "manual"
    status: "verified"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: |-
          tst="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/cli/test_cli_node_receipt.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; grep -q 'def test_shared_socket_concurrent_runs_are_serialized_and_isolated' <<< "$tst" && grep -q 'class TestReceiptModeInProcessIsolation' <<< "$tst"

  - id: "ac4-fail-closed-refusals-present"
    description: >-
      AC4: "Fail-closed is the default, and a refusal says what to grep." Three distinct shapes each refuse
      rather than render -- a stored receipt naming a foreign correlation, one naming no correlation at
      all, and a run that reports COMPLETED yet stored no terminal envelope and no handler result. The
      third matters because a content-free file is the one shape that could otherwise pass a join by having
      nothing to disagree with. The refusal names the wire correlation so the operator can grep the lane
      for the command that was actually published.
    source: "manual"
    status: "verified"
    binds_ac: ["AC4"]
    checks:
