          tst="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/unit/cli/test_cli_node_receipt.py?ref=3586e65dc9621dc4a555a47405d31ae1a0628fba" --jq '.content' | base64 -d)"; grep -q 'def test_two_stored_receipts_the_wrong_one_is_refused' <<< "$tst" && grep -q 'def test_absent_correlation_fails_closed' <<< "$tst" && grep -q 'def test_completed_with_no_receipt_still_fails_closed' <<< "$tst" && grep -q 'def test_explanation_names_the_wire_correlation_to_grep' <<< "$tst"

