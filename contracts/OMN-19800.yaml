    acceptance:
      - id: "AC1"
        statement: |-
          AC1: An onex-api-only push cannot produce a skew. The onex-api image the deploy applies is built from the same runtime digest that deploy applies to the runtime plane, on the push path as well as the dispatch path. -- falsifier: python3 -m pytest tests/ -k onex_api_omnimarket_skew includes a test that drives the push path with a runtime plane frozen behind ECR and asserts the two resolve to one digest; reverting the coupling turns it red.
      - id: "AC2"
        statement: |-
          AC2: The gate, when it does fire, says which clock moved. Its message names the trigger and the runtime digest each side resolved, not only the two version strings. -- falsifier: python3 -m pytest tests/ -k onex_api_omnimarket_skew asserts both digests appear in the FATAL line; emitting only the versions turns it red.
      - id: "AC3"
        statement: |-
          AC3: proof_class: live-readback. A real onex-api-only push to dev reaches a settled staging deploy whose skew step passes. -- falsifier: the first such push after the change failing the OMN-18281 step leaves this unmet, whatever the tests say.
