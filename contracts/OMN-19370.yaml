    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a timed-out in-pod exec (subprocess.TimeoutExpired at the 120s default) produces a parseable receipt that the board classifies C19 as FAILED, never UNREADABLE -- falsifier: a pytest that makes Kubectl.run raise subprocess.TimeoutExpired for the consume_since call, runs the probe's main(), and asserts the emitted receipt JSON parses and its leg records failed, not missing or unreadable; it fails against today's code
      - id: "AC2"
        statement: |-
          AC2: Kubectl.run catches subprocess.TimeoutExpired and raises it as KubectlError so main's existing except path handles it -- falsifier: a unit test driving Kubectl.run with a subprocess.run mock that raises subprocess.TimeoutExpired asserts KubectlError is raised instead of TimeoutExpired propagating
      - id: "AC3"
        statement: |-
          AC3: a timed-out run still executes teardown of its synthetic omn18171- tenants and API keys -- falsifier: a test simulating a TimeoutExpired mid-run asserts the teardown/housekeeping call still fires, via a finally block or a mock call-count assertion
