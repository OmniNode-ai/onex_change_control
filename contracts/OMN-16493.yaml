  - id: "dod-omn16493-ac3-uuid-key-reachability"
    description: >
      AC3 — the UUID key now resolves the beta tenant's rows, and no row was orphaned by the conversion.
      Same read-only session as AC2. set_config('app.tenant_id', '91c74442-1233-4c97-b191-911a10346fdf')
      then count(*) returns 198, against 0 before the apply. Splitting on the apply instant 2026-09-09T01:09:18.051491Z:
      179 of those rows were written BEFORE the cutover -- they are converted rows, the population the
      slug key used to answer for -- and 19 after, by the live writer. The criterion's literal form (count-equal
      against the slug count taken immediately before the apply) is not re-derivable after the fact because
      the apply is eight hours past and the beta program kept writing; the 179/19 split is the honest
      form of the same claim, and the count-equal half is discharged exactly on AC4's tenant, where the
      house count is frozen. On primary-key equality: a literally RLS-bypassing ground-truth query is
      available to NO identity this lane may use -- pg_roles reports exactly one role on the instance
      with rolbypassrls, rdsadmin, which is RDS-internal. The substitute is total reachability, and it
      is stronger than a spot check: enumerating all 18 tenant_registry_mirror rows and counting under
      each canonical UUID key yields 250 rows across 8 non-empty tenants (beta-business-proof 198, omninode
      43, omn18011-proof-20260906205608 4, and 1 each for beta-refusal-probe-b, c19-synth-b-20260909,
      d5-e2e-0b5ae67c, delegation-spotcheck-1786977419, t-1lostguy1), those 250 rows carry 250 DISTINCT
      primary keys, and pg_stat_user_tables.n_live_tup for delegation_events is 250. Sum, distinct-PK
      count and the table's own live-tuple total agree, so every row in the table is reachable under some
      canonical UUID key and none is stranded. t-1lostguy1 is the externally-owned customer whose row
      0034's ELSE-less CASE would have NULLed; it resolves. THREE NEGATIVE CONTROLS, same session: the
      slug keys that used to work now RAISE InvalidTextRepresentation "invalid input syntax for type uuid:
      \"beta-business-proof\"" and the same for "omninode" -- the cast rejects them, which is the conversion
      being real rather than a widened predicate; an unmapped all-zero UUID returns 0; and no app.tenant_id
      set at all returns 0. The re-executable check below is the code half: 0037 resolves identity on
      BOTH representations (m.tenant_slug = d.tenant_id OR m.tenant_uuid::text = d.tenant_id), which is
      what lets a mixed-representation column convert without stranding rows, and the second check is
      the negative control at 0034's own merge sha 53ff3bbb9, where that second predicate is absent entirely
      -- so the 250/250 reachability could not have come from 0034.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC3"
    checks:
