    description: >
      AC1 — the operative delegation_events conversion applied on onex-dev through the governed k8s migrate
      Job, evidenced by the Job's own log rather than ad-hoc CLI stdout. The operative id is 0037, not
      the 0031 the criterion text names and not the 0034 the title names: the 2026-09-01 override in the
      ticket body already re-points "0031" at whichever migration is operative, and the chain moved 0031
      -> 0032 -> 0033 -> 0034 -> 0036 -> 0037 as each predecessor was retired. 0034 was retired on the
      DATA axis (it resolves identity on m.tenant_slug alone and cannot convert a column that already
      holds canonical UUIDs from write-time stamping); 0036 was retired on the PRIVILEGE axis (it reads
      tenant_registry_mirror after set_config('role', <delegation_events' owner>), and that owner holds
      no SELECT on the mirror). All of 0031, 0032, 0033, 0034 and 0036 remain in the omnibase_infra fence
      baseline as retired; the k8s Job's K8S_OMN15683_RELEASED_NODE_MIGRATION_IDS array names exactly
      one id, 0037, at the deployed head. The apply: OmniNode-ai/omninode_infra#1258 merged 2026-09-09T01:06:54Z
      squash 6cb6a4e9d1ee8e13f78ec127f35d37b920cca3ab; deploy-onex-staging run 34408930764's predecessor
      run 34297859000 on that exact head created Job omnibase-infra-migrate at 01:08:28.9Z from image
      omnibase-infra-migrate:3dfe23e5e5e41f6b0c8a7501e0a6883e2dbd0a42 and logged "Migration omnibase-infra-migrate
      completed successfully." at 01:09:46.9Z with "== Migration complete: applied=0 skipped=83 undeliverable=5
      node_applied=1 node_skipped=173 ==". Live readback, 2026-09-10, read-only through the serving pod:
      node_schema_migrations holds exactly one row for this migration, node:node_projection_delegation:0037_delegation_events_uuid_mixed_representation_guard_before_set_role.sql
      applied_at 2026-09-09T01:09:18.051491Z -- strictly inside that Job window -- and holds no row for
      0031, 0032, 0033, 0034 or 0036 on any lane. node_applied=1 and that single row are the same event.
      The first three checks are the positive half against the deployed head and the Job's own log; the
      fourth is the NEGATIVE CONTROL at the immediately preceding parent f50ecec36, where the released
      array names no 0037 at all, so the pattern discriminates the release rather than matching the file.
    source: "manual"
    status: "verified"
    binds_ac:
