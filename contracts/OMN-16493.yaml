  - id: "dod-omn16493-ac2-uuid-col-cast-readback"
    description: >
      AC2 — post-apply live readback from omnidash_analytics as role_omnidash showing the column is uuid
      and the policy predicate carries the ::uuid cast. Taken 2026-09-10, read-only, on the DEV-SYSTEM
      cluster instance i-06169517a92b45f86 via SSM with --comment omn16493-ac6-readback-close, through
      the pod that actually serves (onex-api-65566495dd-kp4fg, container onex-api) on its own OMNIDASH_ANALYTICS_DB_URL.
      The DSN was resolved and printed host-only before connecting, because a pod-local masquerade would
      invalidate the reading: host omninode-dev-postgres.cqjkkokeaqd2.us-east-1.rds.amazonaws.com port
      5432 db omnidash_analytics, and the session reported current_user role_omnidash, current_database
      omnidash_analytics, inet_server_addr 10.40.160.37, PostgreSQL 16.13 -- the managed RDS instance,
      not a sidecar. Verbatim: "delegation_events.tenant_id  uuid  NO" (data_type uuid, is_nullable NO)
      from information_schema.columns; "tenant_isolation | (tenant_id = (current_setting('app.tenant_id'::text,
      true))::uuid)" from pg_policy joined to pg_class; relrowsecurity t, relforcerowsecurity t. Reading
      identity: pg_roles reports role_omnidash rolsuper f, rolbypassrls f, so the read is taken under
      FORCE RLS exactly as a tenant-scoped caller experiences it. The pre-apply state recorded in this
      ticket's own body was data_type text with the uncast predicate "tenant_isolation (tenant_id = current_setting('app.tenant_id'::text,
      true))", so the type and the cast both changed. Execution scope, stated rather than implied: the
      readback targets a private VPC instance reachable only over SSM and is therefore not re-executable
      from a CI runner; the transcript above is the receipt, and the checks below are the re-executable
      half -- the merged 0037 SQL declares both halves of what was read back (the ALTER ... TYPE UUID
      and the restated policy carrying ::uuid on USING and WITH CHECK), and its merge sha is an ancestor
      of omnibase_infra dev so the bundle the Job pulled carries it.
    source: "manual"
    status: "verified"
    binds_ac:
