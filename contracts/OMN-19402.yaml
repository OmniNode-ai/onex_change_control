    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A checker script scans every YAML manifest under k8s/ and exits non-zero naming file and document when any document sets serviceAccountName (or the deprecated serviceAccount) to onex-dev-app or onex-prod-app, at any nesting depth, including CronJob and Deployment pod templates -- falsifier: uv run pytest tests/k8s/test_no_broad_secret_reader_service_account_omn18076.py -q
      - id: "AC2"
        statement: |-
          AC2: Positive control: a fixture manifest that sets serviceAccountName to onex-dev-app is refused by the checker, and one for onex-prod-app is refused too -- falsifier: uv run pytest tests/k8s/test_no_broad_secret_reader_service_account_omn18076.py -q -k positive
      - id: "AC3"
        statement: |-
          AC3: Negative control: a fixture using a different service account, and the real k8s/ tree at the PR head, both pass the checker -- falsifier: uv run pytest tests/k8s/test_no_broad_secret_reader_service_account_omn18076.py -q -k negative
      - id: "AC4"
        statement: |-
          AC4: The test file runs inside the CI job repo_scripts_tests (uv run pytest tests/ --ignore=tests/scripts in .github/workflows/ci.yml) and a pre-commit hook runs the checker on k8s manifest changes -- falsifier: uv run pytest tests/k8s/test_no_broad_secret_reader_service_account_omn18076.py -q -k wiring
      - id: "AC5"
        statement: |-
          AC5: The header comments in k8s/onex-dev-rbac/rbac.yaml and k8s/onex-prod/rbac.yaml no longer recommend setting serviceAccountName to those accounts, and the rendered objects are unchanged -- falsifier: uv run pytest tests/k8s/test_no_broad_secret_reader_service_account_omn18076.py -q -k header
