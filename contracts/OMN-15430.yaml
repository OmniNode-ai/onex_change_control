  - id: "dod-deploy-assessment-pr-1958-literal-pin"
    description: >-
      Append-only replacement for dod-deploy-assessment. The superseded entry was emitted by the autobind
      producer carrying bare runner-substituted PR_NUMBER / REPO placeholder tokens, under an id that
      embeds no pr-<N> segment. Both properties are load-bearing failures. (1) Because the id does not
      follow the dod-<owner>-<repo>-pr-<N> autobind convention, node_dod_verify's _repo_and_pr_from_evidence_id
      returns no binding, so _lookup_pr_for_ticket has no repo to scope a PR search to and fails closed
      with PR_LOOKUP_FAILED ("cannot resolve target repo for PR search"); the unresolved-placeholder branch
      of _resolve_command_placeholders then hard-REDs the item before the command is ever shelled out.
      Reproduced on three independent dod_verify runs; it is the single red keeping OMN-15430 off a clean
      table. (2) Because the id embeds no pr-<N>, the OCC authoring lint's OMN-15382 Rule B (per-item
      PR binding) never governed the entry either, so the bare placeholder form was never rejected at
      authoring time — the entry was unpinned in the runner AND ungoverned in the lint. This replacement
      asserts the SAME deploy-scope fact the superseded entry claimed (the product PR touches a deploy-relevant
      path, F-05), preserving that entry's path regex verbatim, but is pinned literally to OmniNode-ai/omnimarket
      PR #1958 with no runner-substituted token anywhere in the value, so it executes exactly as written
      with zero PR/repo lookup. Shape properties, each deliberate: literal cross-PR pin plus a literal
      --repo argument (the OMN-14431 sanctioned cross-PR form; Rule B now governs this id and is satisfied
      by the literal 1958); SIGPIPE-safe — the producer is drained into a shell variable before any grep
      reads, so no streaming upstream is killed by a short-circuiting grep -q under the runner's bash
      -o pipefail -c (the OMN-15411 / OCC#5496 failure mode); shlex-parseable with balanced quotes, since
      the OMN-15430 shape guard tokenizes with shlex.split and treats a ValueError as fail-closed INVALID;
      fail-closed on producer failure, because a 404 or auth failure leaves the variable empty and the
      anchor leg goes RED instead of printing a zero count that passes (the OMN-15391 Rule D class). Falsifiability
      proven by execution at authoring time, not asserted: GREEN 3/3 under bash -o pipefail -c and 1/1
      under sh -c against the real file list; RED (exit 1) under three independent mutations — an absent
      anchor path, the same command repointed at a PR that does not touch those paths (OCC#5516), and
      a nonexistent repo.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-deploy-assessment"
    checks:
