  - id: "dod-deploy-assessment-live-probe"
    description: >-
      Falsifiability fix (OMN-14443) for dod-deploy-assessment: the superseded item's check was `gh pr
      diff ... | grep -ciE ...`, a PR-metadata grep with no live-surface probe in command position. OMN-10318's
      actual deploy target is the digest-pinned onex-dev `seed-keycloak-clients` Job (omninode_infra k8s/onex-dev/jobs/)
      and the `keycloak-smtp-infisical-secret` InfisicalSecret it depends on — this item reads them back
      live via kubectl. PR #2661's body (2026-08-05 adversarial-verify note) documented the required order
      — merge #2661, CI rebuilds+pushes a fresh omninode-runtime digest, omninode_infra bumps the pinned
      digest, only then is the Job applied. That chain has now completed: omnibase_infra#2739 (merged
      2026-08-15) added the Dockerfile COPY, omninode_infra#912 (2026-08-16) repinned onex-dev to digest
      sha256:a1d222a3..., and the Job ran successfully against that exact digest. Check #2's original
      check_value carried two live-verified defects, found by running it verbatim against the cluster:
      (1) wrong resource name — `keycloak-smtp-credentials` is the K8s Secret the Job's secretKeyRefs
      pull from, not the InfisicalSecret custom resource that manages it (the CR is `keycloak-smtp-infisical-secret`);
      (2) wrong condition type — this InfisicalSecret operator version never emits a bare `Ready` condition;
      its real conditions carry the full API-group-qualified type string `secrets.infisical.com/{LoadedInfisicalToken,ReadyToSyncSecrets,AutoRedeployReady}`,
      not a bare `ReadyToSyncSecrets`. Both corrected and live-verified to return `True` this session
      via AWS SSM port-forward to the onex-dev cluster. Per OMN-14051, a bare `kubectl` invocation is
      a NON-HERMETIC check_value — CI runners have no route to the cluster, so it can never pass in CI
      even when the live state is genuinely healthy. The live probes ran out of band and are recorded
      in the committed receipt (drift/dod_receipts/OMN-10318/dod-deploy-assessment-live-probe/command.yaml,
      status: PASS, with both checks' literal commands and captured output in probe_command/probe_stdout);
      the contract check below greps that receipt rather than re-invoking kubectl in CI.
    source: "generated"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-deploy-assessment"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' "$CONTRACT_REPO_DIR/drift/dod_receipts/OMN-10318/dod-deploy-assessment-live-probe/command.yaml"
