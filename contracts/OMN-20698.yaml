    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A Linear Issue delivery that moves status, assignee, estimate, priority or the description dispatches a board publish, and one that moves none of them dispatches nothing -- falsifier: python3 -m pytest tests/scripts/test_linear_relay.py -k TestEventFilter reporting any failure, or a replay of a captured label-only delivery that still dispatches
      - id: "AC2"
        statement: |-
          AC2: The relay refuses a delivery whose Linear-Signature does not verify against the signing secret, and refuses one carrying no signature at all -- falsifier: python3 -m pytest tests/scripts/test_linear_relay.py -k TestSignature reporting any failure, or an unsigned POST to the function URL that reaches repository_dispatch
      - id: "AC3"
        statement: |-
          AC3: No more than one publish is dispatched in any five-minute window however many deliveries arrive -- falsifier: python3 -m pytest tests/scripts/test_linear_relay.py -k TestFloor reporting any failure, or a replay of the 299-event hour measured on 2026-10-07 producing more than twelve dispatches
      - id: "AC4"
        statement: |-
          AC4: The scheduled publish remains declared in publish-beta-board.yml and runs on its own, so a dropped or refused delivery leaves the board on its previous cadence rather than dark -- falsifier: a publish-beta-board.yml on dev whose on: block declares no schedule, or a 24-hour window containing no scheduled run
      - id: "AC5"
        statement: |-
          AC5: The secret the relay verifies against is never printed to a log, a workflow input or a dispatch payload -- falsifier: gh run view output on any publish run in which the signing secret appears, or a repository_dispatch payload carrying it Probe: python3 -m pytest tests/scripts/test_linear_relay.py -q => passed
