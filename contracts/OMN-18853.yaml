      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (idempotent commit): When the mint path runs against a contract whose entries for this run are already present, the emitter completes and step 5 restamps the product PR body -- falsifier: a unit test that drives the mint path twice against the same contract state and asserts the second run returns an authored ... action and issues the body PATCH; today the second run raises from git commit and never reaches _patch_evidence_source.
      - id: "AC2"
        statement: |-
          AC2 (RED first): A test reproducing "entries already present" fails before the fix and passes after, and names the commit step -- falsifier: the test passes at the parent commit, which would mean it does not reproduce the defect.
      - id: "AC3"
        statement: |-
          AC3 (no silent skip): A run with nothing to commit is distinguishable in its returned action and logs from a run that authored new entries -- falsifier: the two produce byte-identical action strings, which would make a no-op indistinguishable from a mint.
      - id: "AC4"
        statement: |-
          AC4 (the four stuck PRs recover without hand edits): After the fix lands, a natural synchronize on each of the four cascade PRs restamps its body to its own companion and its occ-preflight goes green -- falsifier: any of the four still resolving b72ba9940a after a synchronize. omniintelligence#922 and any PR carrying a collaborator assignee or reviewer is fixed but not merged by this ticket.
      - id: "AC5"
        statement: |-
          AC5 (labelled criterion — the guard is never disabled): The fix introduces no path that edits a product PR body by removing an existing stamp outside the emitter's own restamp, and no lane instruction to disable BRANCH_PROTECTION_GUARD -- falsifier: a grep of the diff for a guard-disable invocation, or a second stamp-removal site, returns a hit.
