      CORRECTED BY HAND, 2026-09-13. The autobind derived this target from the PR's diff by file name and selected `benchmarks/delegation_ladder/fixtures/r5_*_test.py`. Those four files are benchmark FIXTURES, not a suite: each one only resolves beside a generated `subject.py` that the trace generator writes the defective copy of a function to, so run standalone they raise ModuleNotFoundError and the declared check could never pass. The first executed receipt recorded exactly that. They have since been renamed to `_proof.py` so the name cannot invite the mistake again, and this command now names the PR's real test directory, which is the suite that exercises them -- `test_every_diagnosis_trace_regenerates_from_its_committed_fixtures` runs each fixture against its committed mutant and asserts the committed trace still comes back.
