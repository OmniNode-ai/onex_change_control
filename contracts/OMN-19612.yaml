requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omnibase_core ci.yml cancels superseded PR runs keyed on PR number, and Detect Secrets and AI Slop Patterns scan only changed files on pull requests with full-tree fallbacks -- falsifier: a core PR with two pushes shows the first run cancelled, and the Detect Secrets job log lists only changed files on a PR run and the full tree on a push run
      - id: "AC2"
        statement: |-
          AC2: omnibase_infra ci.yml Lint runs its 14 omnibase_infra validator modules in one process with per-validator failure reporting, and scopes the no-plugin-daemon-classes pre-commit step to the PR diff with full-tree fallbacks -- falsifier: the Lint job on an infra PR shows one validator-runner step reporting 14 results, and its duration against the 381 s baseline
      - id: "AC3"
        statement: |-
          AC3: onex_change_control runs the yamlfmt detector self-tests only when detector code changes, with the wiring anchor updated and push to dev added -- falsifier: the yamlfmt ratchet job duration on an evidence-only OCC PR against the 436 s baseline
      - id: "AC4"
        statement: |-
          AC4: omnimarket ci.yml cancels in-progress same-branch PR runs after re-measuring the coverage-sweep reason -- falsifier: an omnimarket PR with two pushes shows the first run cancelled
      - id: "AC5"
        statement: |-
          AC5: omninode_infra pre-commit.yml is diff-scoped on pull requests with a concurrency block, and whether it is made required or deleted is put to the operator -- falsifier: the workflow file carries a concurrency group with cancel-in-progress and a from-ref invocation on pull_request
      - id: "AC6"
        statement: |-
          AC6: omnibase_core local pre-commit hooks (ruff-format, ruff-fix, no-plugin-daemon-classes, no-unguarded-git-subprocess, operation-match-requires-operation, dispatched-contract-operation, command-category-requires-event-model, validate-file-locations, validate-archived-imports, validate-no-backward-compatibility, validate-contracts) accept staged filenames and every fixed hook id is absent from .github/precommit-suite-skip.yaml -- falsifier: pre-commit run no-plugin-daemon-classes --files <staged .py> catches a planted Plugin*Daemon class and passes on a clean file, in a worktree at PR #1779's head
      - id: "AC7"
        statement: |-
          AC7: omnibase_infra local pre-commit hooks (check-no-credential-in-log, handler-any-signature, envelope-tenant-dimension, kafka-no-hardcoded-fallback, no-infra-inmemory-import) accept staged filenames and each keeps a dedicated whole-tree CI step in ci.yml -- falsifier: pre-commit run check-no-credential-in-log --files <staged .py> catches a planted credential-field log call and passes clean, in a worktree at PR #4140's head, and ci.yml names each fixed script in its own step
      - id: "AC8"
        statement: |-
          AC8: omnibase_spi local pre-commit hooks (validate-spi-typing-patterns, validate-spi-naming-conventions, validate-naming-patterns, validate-namespace-isolation-new) accept staged filenames AND every one of the four is reachable from a whole-tree CI backstop -- falsifier: grep -n 'validate_spi_typing_patterns\|validate_spi_naming' .github/workflows/*.yml scripts/validation/run_all_validations.py returns a match for both (currently returns none: PR #317 fixed staged-mode behavior for all four but added no backstop for two)
      - id: "AC9"
        statement: |-
          AC9: omnimarket local pre-commit hooks (handler-event-type-source, aiokafka-construction-auth, projection-dlq-path, github-token-env-gate, delegation-env-read-gate, watchdog-topic-authority-gate, ruff-format, ruff, validate-no-env-fallbacks) accept staged filenames and each keeps a dedicated whole-tree CI step -- falsifier: pre-commit run delegation-env-read-gate --files <staged .py under src/omnimarket/delegation/> runs against a planted os.getenv read and every fixed script name appears in .github/workflows/*.yml
      - id: "AC10"
        statement: |-
          AC10: omniclaude local pre-commit hooks accept staged filenames and every one of them is reachable from a whole-tree CI backstop -- falsifier: grep -rn 'validate_no_hardcoded_kafka_broker' .github/workflows/ returns a match (currently returns none: PR #2354 scoped the hook to staged files but the OMN-19612 whole-tree backstop step it added omits this one script)
      - id: "AC11"
        statement: |-
          AC11: onex_change_control local pre-commit hooks (check-runner-routing, no-localhost-fallbacks) accept staged filenames with existing whole-tree CI coverage -- falsifier: pre-commit run no-localhost-fallbacks --files <staged src/*.py> catches a planted os.getenv(...,"localhost") default and passes clean, in a worktree at PR OmniNode-ai/onex_change_control#11335's head
      - id: "AC12"
        statement: |-
          AC12: omninode_infra local pre-commit hooks (k8s-status-fact-reads, no-silent-fallbacks, keycloak-user-put-merge-safe, no-credential-in-log, no-cloud-bus) accept staged filenames with existing whole-tree CI coverage -- falsifier: pre-commit run no-credential-in-log --files <staged docker/onex-api/*.py> catches a planted access_token log call and passes clean, in a worktree at PR #1680's head
      - id: "AC13"
        statement: |-
          AC13: omniintelligence local pre-commit hooks (ruff-format, ruff-check, onex-validate-naming, kafka-no-hardcoded-fallback, no-cloud-bus) accept staged filenames, backstopped by the repo's unconditional pre-commit run --all-files CI job -- falsifier: grep -n 'pre-commit run --all-files' .github/workflows/ci.yml matches with no if: guard, in a worktree at PR #946's head
      - id: "AC14"
        statement: |-
          AC14: omnimemory local pre-commit hooks accept staged filenames AND every fixed hook is reachable from a whole-tree CI backstop -- falsifier: grep -rln 'check_no_hardcoded_bolt\|check_kafka_no_hardcoded_fallback\|check_no_internal_ips' .github/workflows/*.yml returns a match for all three (currently returns none for any: PR #536 fixed staged-mode behavior but added no backstop for these three, and the repo has no generic all-files job)
      - id: "AC15"
        statement: |-
          AC15: omnidash local pre-commit hooks (env-contamination-grep, delegation-refs-check) accept staged filenames with existing dedicated whole-tree CI steps -- falsifier: pre-commit run env-contamination-grep --files <staged src/*.ts> catches a planted hardcoded-IP literal and passes clean, in a worktree at PR #327's head
