          workflow="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/ci.yml?ref=5d845c16c348e5c1e337dfd56f7f452f5547235a' --jq '.content' | base64 -d)" && validator="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/validation/application_database_domain_enforcement.py?ref=5d845c16c348e5c1e337dfd56f7f452f5547235a' --jq '.content' | base64 -d)" && tests="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/tests/ci/test_application_database_domain_enforcement_contract.py?ref=5d845c16c348e5c1e337dfd56f7f452f5547235a' --jq '.content' | base64 -d)" && printf '%s\n' "$workflow" | grep -q 'Application Database Domain Enforcement (OMN-15361)' && printf '%s\n' "$validator" | grep -q 'def application_database_sql_target_requirements' && printf '%s\n' "$validator" | grep -q 'def validate_application_database_pool_identities' && printf '%s\n' "$tests" | grep -q 'test_acl_live_snapshot_classifies_postgres_type_subkinds_exactly'
  - id: "dod-OmniNode-ai-omnibase_infra-pr-2590-sigpipe"
    description: >-
      OMN-15817 shape 4 repair: pipefail-safe, SHA-agnostic re-probe of the immutable product-head proof
      for omnibase_infra PR #2590. The superseded item's check_value chains four ``printf '%s\n' "$var"
      | grep -q '...'`` stages under the dod_verify runner's ``bash -o pipefail``; each stage's ``grep
      -q`` closes its read end on the first match while the ``printf`` builtin may still be writing the
      buffered multi-line variable, which kills ``printf`` with SIGPIPE (exit 141) -- under pipefail that
      141 becomes the whole pipeline's exit status even though ``grep`` itself matched. Live-reproduced
      5/5 against the superseded item's exact bytes. This item replaces every ``printf ... | grep -q``
      stage with a pipe-free herestring form (``grep -qF -- 'MARKER' <<<"$var"``), which cannot SIGPIPE
      because no live process holds the other end of a pipe -- a herestring is fed from a temp file/fd,
      not a process-to-process pipe -- proven safe 5/5 against the same content. It is also SHA-agnostic:
      the superseded item pins the literal pre-merge commit ``5d845c16c348e5c1e337dfd56f7f452f5547235a``
      (a stale, hand-copied ref, not the PR's own merged head); this item resolves the ref live via ``gh
      pr view 2590 --json mergeCommit`` at check-run time.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omnibase_infra-pr-2590"
    checks:
      - check_type: "command"
        check_value: |-
          pr_ref="$(gh pr view 2590 --repo OmniNode-ai/omnibase_infra --json mergeCommit --jq '.mergeCommit.oid')" && workflow="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/ci.yml?ref=$pr_ref" --jq '.content' | base64 -d)" && validator="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/validation/application_database_domain_enforcement.py?ref=$pr_ref" --jq '.content' | base64 -d)" && tests="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/ci/test_application_database_domain_enforcement_contract.py?ref=$pr_ref" --jq '.content' | base64 -d)" && grep -qF -- 'Application Database Domain Enforcement (OMN-15361)' <<<"$workflow" && grep -qF -- 'def application_database_sql_target_requirements' <<<"$validator" && grep -qF -- 'def validate_application_database_pool_identities' <<<"$validator" && grep -qF -- 'test_acl_live_snapshot_classifies_postgres_type_subkinds_exactly' <<<"$tests"
  - id: "occ-self-bind-pr-5726"
