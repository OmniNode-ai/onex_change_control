  - id: "dod-OmniNode-ai-omnibase_infra-pr-2590-sigpipe"
    description: >-
      OMN-15817 shape 4 repair: pipefail-safe, SHA-agnostic, POSIX-sh-portable re-probe of the immutable
      product-head proof for omnibase_infra PR #2590. The superseded item's check_value chains four ``printf
      '%s\n' "$var" | grep -q '...'`` stages under the dod_verify runner's ``bash -o pipefail``; each
      stage's ``grep -q`` closes its read end on the first match while the ``printf`` builtin may still
      be writing the buffered multi-line variable, which kills ``printf`` with SIGPIPE (exit 141) -- under
      pipefail that 141 becomes the whole pipeline's exit status even though ``grep`` itself matched.
      Live-reproduced 5/5 against the superseded item's exact bytes. A first repair used a herestring
      form (``grep -qF -- 'MARKER' <<<"$var"``), which fixed the SIGPIPE risk but broke this repo's OWN
      ``contract_compliance_check.py`` runner, which executes check_value via plain ``sh -c`` (no bash,
      no pipefail) -- ``<<<`` is a bashism and is a syntax error under POSIX sh/dash ("Syntax error: redirection
      unexpected"). This item instead uses a POSIX ``case`` pattern match (``case "$var" in *'MARKER'*)
      : ;; *) exit 1 ;; esac``), which is pure shell syntax with no external process and no pipe at all
      -- proven correct (5/5 match, 1/1 negative-control mismatch) under BOTH ``bash -o pipefail -c``
      (the dod_verify runner) and ``sh -c``/dash (this repo's contract-compliance runner). It is also
      SHA-agnostic: the superseded item pins the literal pre-merge commit ``5d845c16c348e5c1e337dfd56f7f452f5547235a``
      (a stale, hand-copied ref, not the PR's own merged head); this item resolves the ref live via ``gh
      pr view 2590 --json mergeCommit`` at check-run time.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-OmniNode-ai-omnibase_infra-pr-2590"
    checks:
      - check_type: "command"
        check_value: |-
          pr_ref="$(gh pr view 2590 --repo OmniNode-ai/omnibase_infra --json mergeCommit --jq '.mergeCommit.oid')" && workflow="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/.github/workflows/ci.yml?ref=$pr_ref" --jq '.content' | base64 -d)" && validator="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/validation/application_database_domain_enforcement.py?ref=$pr_ref" --jq '.content' | base64 -d)" && tests="$(gh api "repos/OmniNode-ai/omnibase_infra/contents/tests/ci/test_application_database_domain_enforcement_contract.py?ref=$pr_ref" --jq '.content' | base64 -d)" && case "$workflow" in *'Application Database Domain Enforcement (OMN-15361)'*) : ;; *) exit 1 ;; esac && case "$validator" in *'def application_database_sql_target_requirements'*) : ;; *) exit 1 ;; esac && case "$validator" in *'def validate_application_database_pool_identities'*) : ;; *) exit 1 ;; esac && case "$tests" in *'test_acl_live_snapshot_classifies_postgres_type_subkinds_exactly'*) : ;; *) exit 1 ;; esac
