  - id: "dod-accept-0445z-12717-dod1-empty-reasoning-only"
    description: |-
      DoD1 binding proposed by lane dod-closeout-bind-2026-10-10T0445Z-c0 and accepted by a different lane, dod-closeout-accept-2026-10-10T0445Z-c0, after an independent re-run at omnimarket origin/dev 4c91a561d (2 passed; content='' error='API returned empty message content'; REASONING_ONLY_REFUSED; exit 0). The committed quality-gate test refuses empty final content for the test and code_generation routes, and the inline handler probe shows HandlerInferenceIntent refuses a response whose content is empty and whose reasoning_content carries code, without promoting the reasoning. Residual: the reasoning-only half is proven by this check's inline probe, not by a committed test. The behavior predates OMN-12717 #2918 (the quality-gate test passes at its parent a97e81e4c); the call-effect refusal came from #1055.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          env -u PYTHONPATH uv run pytest "tests/unit/delegation/test_quality_gate_code_artifact_omn12717.py::test_empty_final_content_is_refused_for_artifact_routes" -q -p no:cacheprovider && env -u PYTHONPATH uv run python -c '
          from unittest.mock import MagicMock, patch
          from uuid import uuid4
          from omnibase_core.models.delegation.wire import ModelInferenceIntent
          from omnimarket.inference import provider_quota_state as q
          q.resolve_provider_quota_reader = lambda **_: q.StaticProviderQuotaReader(())
          from omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_inference_intent import HandlerInferenceIntent
          intent = ModelInferenceIntent(base_url="http://localhost:8000/v1/chat/completions", model="m", system_prompt="s", prompt="Write pytest unit tests for normalize_unit_state.", max_tokens=512, temperature=0.3, timeout_seconds=30.0, correlation_id=uuid4())
          resp = MagicMock(); resp.raise_for_status.return_value = None
          resp.json.return_value = {"id": "x", "choices": [{"finish_reason": "stop", "message": {"content": "", "reasoning_content": "Okay, I need to write tests. def test_x(): assert True"}}], "usage": {"prompt_tokens": 10, "completion_tokens": 900, "total_tokens": 910}}
          with patch("httpx.Client") as cls:
              c = MagicMock(); c.__enter__ = MagicMock(return_value=c); c.__exit__ = MagicMock(return_value=False); c.post.return_value = resp; cls.return_value = c
              r = HandlerInferenceIntent().handle(intent)
          print("content=%r error=%r" % (r.content, r.error_message))
          assert r.content == "" and "empty message content" in (r.error_message or "")
          print("REASONING_ONLY_REFUSED")
          '
        cwd: "${OMNI_HOME}/omnimarket"
