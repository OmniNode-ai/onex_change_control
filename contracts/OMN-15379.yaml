title: "Lane-scoped node-migration fence release for the lab lane (operator ruling 15)"
summary: >
  OCC companion for OmniNode-ai/omnibase_infra PR #2540. Operator ruling 15 (2026-07-29) extends node_service_registry
  FORCE ROW LEVEL SECURITY to the LAB LANE ONLY: the compose dev lane applies node_projection_registration
  0000/0001/0002 in full as the FORCE proving ground, while every other consumer of the compose migration
  runner (stability-test, prod, judge, CI, fresh volumes) keeps the FULL operator fence by default. The
  omninode_infra k8s staging fence is unchanged. The PR also adds registration 0002 to the compose fence,
  restoring exact cross-repo parity at seven ids and fixing the cold bring-up failure (0000 fenced, 0002
  unfenced -> ERROR relation "node_service_registry" does not exist -> forward-migration exit 3) that
  is the blocker OMN-15379 records. HAND-AUTHORED, and why: the machine producer (occ-companion-effect
  / node_occ_companion_compute) PUBLISHED successfully on this PR, but the command is stranded. Live readback
  on the .201 dev broker 2026-07-29 shows onex.cmd.omnimarket.occ-companion-effect-requested.v1 at HIGH-WATERMARK
  25 with ZERO consumer groups — the consuming runtime is down, and it is down because of the very cold-bring-up
  failure this PR fixes. That circularity is the reason this companion is hand-authored rather than minted;
  it is an instance of the OMN-15247 orphaned-mint class, not a bypass.
