  - id: "dod-deploy-force-rls-live-on-lab-lane"
    description: >
      THE operator-ruling-15 acceptance, against the live .201 lab lane and nothing else: node_service_registry
      must exist with relrowsecurity=true AND relforcerowsecurity=TRUE. Executes psql inside the running
      dev-lane postgres container, so its exit status depends on the state of the deployed system; it
      cannot pass on an un-deployed lane and it cannot be satisfied by any text this PR writes. NOT YET
      SATISFIED at authoring time - the lane is cold and node_service_registry is absent (live readback
      2026-07-29). Recorded as the DECLARED acceptance, not as a claim that it has passed. ADMISSIBILITY
      PROVEN BY EXECUTION 2026-07-29, both directions, so its current RED is a real state fact and not
      a broken command - the identical probe pointed at omnibase-infra-stability-test-postgres, where
      node_service_registry IS forced, exits 0, while against the cold dev lane it exits 1. Exact-match
      grep, so RLS-enabled-but-not-FORCED also reads RED (exists-but-wrong, not merely absent).
    source: "generated"
    checks:
      - check_type: "command"
        check_value: ssh omni-201-ts 'docker exec omnibase-infra-postgres psql -U postgres -d omnidash_analytics
          -tAc "SELECT c.relname || chr(124) || c.relrowsecurity || chr(124) || c.relforcerowsecurity
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname = current_schema()
          AND c.relkind = chr(114) ORDER BY 1"' | grep -qx "node_service_registry|true|true"
