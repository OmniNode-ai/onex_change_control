  # OMN-16106 gap closure: the four ACs that are NOT met and NOT declared as
  # dod_evidence, recorded here with their exact falsifiable probes so the bar
  # still owed is legible rather than quietly dropped. All four are post-refresh
  # observations of the .201 stability-test lane and are blocked on OMN-16803
  # (the lane runs 6 of the 13 containers lane-manifest.yaml declares, so both
  # sanctioned refresh paths refuse and --cold is dev-lane-only). They are
  # deliberately NOT dod_evidence items: validator_receipt_gate demands a PASS
  # receipt for EVERY dod_evidence item, so an honestly-red item here would
  # wedge the OMN-16790 receipt gate for every future PR citing this ticket,
  # including the PR that eventually repairs the lane.
  - kind: "manual"
    description: >-
      AC1 (UNMET, blocked on OMN-16803) — the stability-test runtime container reports `healthy` with
      a FailingStreak of 0. Currently `unhealthy` with a FailingStreak in the hundreds because the 0.38.4
      image predates /usr/local/bin/onex-container-healthcheck; the healthcheck has never once succeeded,
      so the `unhealthy` verdict carries no information about the service. A sanctioned lane refresh to
      an image at or above 0.38.11 is the fix.
    command: >-
      ssh jonah@192.168.86.201 "docker inspect omninode-stability-test-runtime --format '{{.State.Health.Status}}/{{.State.Health.FailingStreak}}'"
      | grep -qx 'healthy/0'
  - kind: "manual"
    description: >-
      AC2 (UNMET, blocked on OMN-16803) — zero `KeyError: 'event'` dispatch failures on onex.evt.omniclaude.session-started.v1
      over a 15-minute window with real traffic. omnimarket#2174 is merged to dev but the lane still runs
      the pre-fix 0.38.4 image, so the loop continues; last measured at ~218/s. Falsified by any boundary_swallow_prevented
      line for that topic in the window.
    command: >-
      ssh jonah@192.168.86.201 "docker logs --since 15m omninode-stability-test-runtime 2>&1 | grep -c
      \"KeyError: 'event'\"" | grep -qx 0
  - kind: "manual"
    description: >-
      AC4 (UNMET as a certification, blocked on OMN-16803) — six consecutive :18085/health probes at 3s
      spacing all return 200 within 2s. This probe currently PASSES, but it measures the pre-fix image
      and therefore cannot certify the fix; it is only creditable after the refresh that carries omnimarket#2174
      into the lane.
    command: >-
      for i in 1 2 3 4 5 6; do curl -o /dev/null -s -w '%{http_code} %{time_total}\n' --max-time 2 http://192.168.86.201:18085/health;
      sleep 3; done | grep -cv '^200 ' | grep -qx 0
  - kind: "manual"
    description: >-
      AC5 (UNMET, blocked on OMN-16803) — RestartCount stays flat over a 1-hour window after the fix is
      deployed. Last read at 16 on the un-refreshed container.
    command: >-
      ssh jonah@192.168.86.201 "docker inspect omninode-stability-test-runtime --format '{{.RestartCount}}'"
