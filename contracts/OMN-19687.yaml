      - id: "AC2"
        statement: |-
          AC2: the anti-guessing guard survives, keyed on distinct MANIFESTS rather than on entry count -- falsifier: a pytest case feeds two entries under one digest whose imageManifest bodies DIFFER and asserts the refusal still fires, naming the manifest count; a case with a single entry asserts the normal path is untouched
      - id: "AC3"
        statement: |-
          AC3: the refusal text, where it still fires, says manifests and not images -- falsifier: a rendered refusal that reports a count of "images" when what it counted was distinct manifests
      - id: "AC4"
        statement: |-
          AC4: the measured occurrence is reproduced from the real payload -- falsifier: a pytest case built from the two entries batch-get-image actually returned for sha256:a1f2a277... on 2026-09-25 asserts leg 3 reads the label rather than UNPROVEN
      - id: "AC5"
        statement: |-
          AC5: one settled staging-green-bar run scores leg 3 against a multi-tagged digest and does not read UNPROVEN, cited by run id -- falsifier: read the run's own staging-green-report.json artifact and the digest's imageTags in the same readback, and show the tag count was greater than one at that moment; a run scoring a single-tagged digest does not satisfy this
