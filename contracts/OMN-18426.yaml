  - id: "dod-omnimemory-pr-510-hook-install"
    description: >-
      Hand-authored behavior proof for OmniNode-ai/omnimemory#510: the PR head config installs the commit-msg
      hook type by default while the strip-ai-coauthor-trailer hook remains scoped to commit-msg.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnimemory/commits/21c7a051fb2867766cbdb9d56bea5a4ce11f826f --jq .sha
          uv run python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('.pre-commit-config.yaml').read_text())
          install_types = cfg.get('default_install_hook_types')
          default_stages = cfg.get('default_stages')
          strip_hooks = [
              hook
              for repo in cfg.get('repos', [])
              for hook in repo.get('hooks', [])
              if hook.get('id') == 'strip-ai-coauthor-trailer'
          ]
          assert install_types == ['pre-commit', 'pre-push', 'commit-msg'], install_types
          assert default_stages == ['pre-commit'], default_stages
          assert len(strip_hooks) == 1, strip_hooks
          assert strip_hooks[0].get('stages') == ['commit-msg'], strip_hooks[0]
          print('PASS default_install_hook_types installs commit-msg and strip hook remains commit-msg-only')
          PY
