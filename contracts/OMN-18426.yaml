  - id: "dod-knowledge-base-internal-pr-516-hook-install"
    description: >-
      Hand-authored behavior proof for OmniNode-ai/knowledge-base-internal#516: the PR head config, read
      at its pinned commit, installs the commit-msg hook type by default, pins stageless hooks to pre-commit,
      and keeps the strip-ai-coauthor-trailer hook scoped to commit-msg.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run python - <<'PY'
          import base64
          import subprocess
          import yaml
          sha = '1231cce6616ad47cff997943acc879e2a1708214'
          raw = subprocess.run(
              ['gh', 'api', 'repos/OmniNode-ai/knowledge-base-internal/contents/.pre-commit-config.yaml?ref=' + sha, '--jq', '.content'],
              check=True, capture_output=True, text=True,
          ).stdout
          cfg = yaml.safe_load(base64.b64decode(raw))
          hooks = [h for r in cfg.get('repos', []) for h in r.get('hooks', [])]
          strip_hooks = [h for h in hooks if h.get('id') == 'strip-ai-coauthor-trailer']
          assert len(strip_hooks) == 1, strip_hooks
          assert strip_hooks[0].get('stages') == ['commit-msg'], strip_hooks[0]
          assert cfg.get('default_install_hook_types') == ['pre-commit', 'commit-msg'], cfg.get('default_install_hook_types')
          assert cfg.get('default_stages') == ['pre-commit'], cfg.get('default_stages')
          print('PASS OmniNode-ai/knowledge-base-internal@' + sha[:12] + ' installs commit-msg by default, default_stages is [pre-commit], strip hook is commit-msg-only')
          PY
