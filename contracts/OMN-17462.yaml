---
schema_version: "1.0.0"
ticket_id: "OMN-17462"
title: "Central immutable pre-execution authorization policy"
summary: >
  OCC-only Phase A: define and validate an immutable, execute-disabled pre-execution authorization registry.
  This change does not install, migrate, deploy, connect to, or activate any downstream service or database.

is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"

evidence_requirements:
  - kind: "tests"
    description: >
      The OCC validator must fail closed for malformed or non-canonical authorization records and expose
      only immutable validated projections.
  - kind: "manual"
    description: |-
      The committed canonical registry must remain empty until a separately governed authorization is
      introduced; validation alone never consumes a nonce or authorizes an action.
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""

dod_evidence:
  - id: "dod-immutable-authorization-validator"
    description: >
      OCC-local tests prove immutable snapshot capture, exact contract binding, execute-disabled enforcement,
      nonce lifecycle validation, and fail-closed handling of hostile Git and path inputs.
    source: "manual"
    status: "pending"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_pre_execution_action_authorizations.py -q"
  - id: "dod-empty-authorization-registry"
    description: >
      The OCC validator accepts the committed canonical registry with zero authorizations. This check
      validates policy only and has no action, installation, migration, or deployment effect.
    source: "manual"
    status: "pending"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run validate-pre-execution-action-authorizations --file grants/pre_execution_action_authorizations.yaml"
