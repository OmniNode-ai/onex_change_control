        statement: |-
          AC2: The test fails red when the discovery call in ServiceRuntimeHealthMonitor.run_once is awaited inline instead of through asyncio.to_thread -- falsifier: temporarily replace the to_thread call with a direct call and run uv run pytest tests/integration/test_runtime_health_discovery_off_loop_omn19373.py -q, which must report 1 failed
      - id: "AC3"
        statement: |-
          AC3: The loop-gap timing assertion still runs whenever the measured scan is at least MEANINGFUL_SCAN_SECONDS, and config/skip_count_baseline.yaml is unchanged -- falsifier: git diff origin/dev -- config/skip_count_baseline.yaml is empty and uv run pytest tests/integration/test_runtime_health_discovery_off_loop_omn19373.py -q passes with ONEX_AUTOWIRING_DISCOVERY_CACHE=0
