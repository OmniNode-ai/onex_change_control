          AC-3: A bus that genuinely cannot bound in-flight records is still refused. -- falsifier: the positive control — the existing refusal test against a stand-in implementing neither the protocol nor the recording still raises, so the fix cannot be read as removing the refusal.
      - id: "AC4"
        statement: |-
          AC-4: The refusal message names the remedy. -- falsifier: a test asserting the raised message contains the protocol name a bus must implement; a message naming only the bus class and the number fails it.
