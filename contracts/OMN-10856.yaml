      the same GitHub contents API. What was wrong was the SHELL FORM: the compliance runner executes
      check_values under bash -o pipefail -c, and each leg's printf '%s' "$bodyN" | grep -qF is the same
      latent-141 idiom -- grep -q's first-match early exit closes the pipe and kills printf with SIGPIPE,
      and pipefail surfaces that as 141 even though every assertion actually passed. Measured directly
      this session: 10/10 bash -o pipefail -c runs on the original item's exact bytes exit 141, deterministic
      for this instance. The merged item and its merged receipt are left byte-untouched per this repo's
      append-only evidence discipline; this item re-states the identical three-leg assertion with here-string
      redirection on each leg (grep -qF '...' <<< "$bodyN"), which has no pipe stage and so cannot be
      SIGPIPE'd regardless of size or match position. Confirmed deterministically safe: 5/5 runs exit
      0 under bash -o pipefail -c.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: |-
          body1="$(gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/models/model_runtime_build_sha.py?ref=85942c44131e6699a6d0a57d287867f46c8e6168' --jq .content | base64 -d)" && grep -qF 'class ModelRuntimeBuildSha' <<< "$body1" &&
