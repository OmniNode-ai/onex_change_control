schema_version: 1.0.0
ticket_id: OMN-20843
title: Lab lane admission judges live memory measures, not swap occupancy
summary: Hand-authored evidence for OmniNode-ai/omniclaude-internal#511 (squash 6216e7022ca1). Each acceptance
  criterion is bound to its own test selection, run at the merge commit and, as a must-fail control, at
  the merge parent with the merged tests overlaid.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The acceptance criteria this ticket's author declared, transcribed verbatim from the ticket
      body. The ticket body is the source and this block is the copy; each criterion's id is the label
      the sibling binds_ac entry claims.
    acceptance:
      - id: AC1
        statement: 'AC1: a Linux host with high swap in use, memory PSI under the bar and swap traffic
          under the bar is admitted -- falsifier: uv run pytest tests/test_landing_placement.py -k live_memory_admits_stale_swap'
      - id: AC2
        statement: 'AC2: a host with memory PSI over the bar, or with swap traffic over the bar in both
          samples, is refused with that reason whatever its swap occupancy -- falsifier: uv run pytest
          tests/test_landing_placement.py -k live_memory_refuses'
      - id: AC3
        statement: 'AC3: the refusal text names the live measure (memory PSI or swap traffic in KB/s)
          and never swap occupancy -- falsifier: uv run pytest tests/test_landing_placement.py -k live_memory_refusal_text'
      - id: AC4
        statement: 'AC4: the Linux and macOS probes print the swap traffic line and parse_probe reads
          it -- falsifier: uv run pytest tests/test_landing_placement.py -k swapio'
evidence_requirements:
  - kind: tests
    description: The live-memory admission tests of tests/test_landing_placement.py pass at the merge
      commit.
    command: uv run --no-project --python 3.13 --with-requirements tests/skill_suites_requirements.txt
      python -m pytest -q tests/test_landing_placement.py -k 'live_memory or swapio'
