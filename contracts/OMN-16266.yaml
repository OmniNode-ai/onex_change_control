summary: >
  Manual OCC companion for OmniNode-ai/omnibase_core PR #1565 (cap ModelTicketContract.requirements and
  five sibling list fields to _MAX_LIST_ITEMS=1000, closing a DoS gap where an unbounded requirements
  list could produce a Kafka-broker-rejecting payload once node_test_generator_compute's ~4x amplification
  is applied). Records a RED-before/GREEN-after differential as two independently falsifiable single-command
  source probes over the requirements field specifically, each pinned to an immutable git blob: the pre-fix
  form (no max_length on the requirements Field) present at the merge-base and absent at head, and the
  fixed form (max_length=_MAX_LIST_ITEMS on requirements) absent at the merge-base and present at head.
  Hand-authored rather than waiting on the live occ_companion_emitter / node_occ_companion_effect: the
  born-path dispatcher (author_occ_companion_9c043f28) failed identically twice for this exact PR (17:38:35Z
  and 18:02:06Z, both TimeoutExpired -> HandlerDispatchFailureError, both DLQ'd to onex.dlq.omnibase-infra.commands.v1)
  while the same handler minted a companion for a different PR (omninode_infra#955) successfully in the
  same window -- a reproducible, PR-specific failure, not a systemic outage, so a third automated attempt
  was not made (tracked as new evidence on OMN-15447).
