requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Before changing anything, the script reports this machine against the minimum requirements for each mode, and on a machine below the Mode 1 floor it exits having installed nothing and prints the failed requirement and the recommended VM spec -- falsifier: a run on a machine that fails preflight leaves any new file under $HOME, /opt/homebrew, /usr/local or /Applications
      - id: "AC2"
        statement: |-
          AC2: The mode is chosen from measured facts. Containers are set up only on a physical Mac at or above the Mode 2 floor that was not told to skip them; otherwise the run completes Mode 1 and the lab bus and says why containers were skipped -- falsifier: Docker Desktop is installed or started on a run whose preflight selected Mode 1 only
      - id: "AC3"
        statement: |-
          AC3: Every tool the selected modes need is installed and configured without a hand step, and a tool already present at an adequate version is left untouched. The only prompts are the ones that must come from the developer: the macOS administrator password, the Tailscale and GitHub sign-ins, and optionally a provider key. None of them asks another person for anything -- falsifier: a completed run on a clean Mac on which any step of the #850 guide still has to be typed by hand, or a re-run on a set-up machine that changes an installed tool's version
      - id: "AC4"
        statement: |-
          AC4: A developer who runs no containers gets a working model path. Their own OpenRouter key goes in through a hidden prompt into the onex secret store. A provider the BYOK catalogue does not route today (Gemini, OMN-17932) is named as not routed, rather than stored and reported as working. With no key, the run falls back to the lab model server over the tailnet. One onex delegate succeeds, and its receipt names the backend that was chosen -- falsifier: the run reports success while the receipt's endpoint is not the chosen backend, or the key appears in shell history, ps, the log file or the transcript
      - id: "AC5"
        statement: |-
          AC5: The machine's lab bus identity is obtained automatically, with no operator action per developer. It is stored through onex auth lane-login --sasl-password-stdin, and omnibase_infra/scripts/onex delegate --bus kafka --lane dev succeeds from the workspace -- falsifier: onboarding any machine requires someone to run rpk security user create or hand over a credential, or the password appears in argv, a log or the transcript
      - id: "AC6"
        statement: |-
          AC6: The issuer admits only members of the OmniNode tailnet, identified by the connecting peer's tailnet identity, never by anything the client sends. It names each principal from the tailnet login and device, applies only the grants in its declared file (the minimum for a lane delegation: produce the delegate command, read its terminal events, and a consumer-group prefix no lab runtime uses), and records every issuance -- falsifier: an issued principal can produce to a topic outside the declared set or join a lab runtime's consumer group, or a request from a tagged device or a non-tailnet address is issued a principal
      - id: "AC7"
        statement: |-
          AC7: The developer learns each phase's result when it finishes, not at the end. Each phase prints its start, then PASS or FAIL with elapsed time, and a failure names the step, the attempt count, the last error and the next thing to do. A macOS notification fires per phase, and the log file's path is printed first -- falsifier: a failing phase whose failure is visible only in the final summary
      - id: "AC8"
        statement: |-
          AC8: Every step that touches the network is attempted at least 3 times, waiting 5 to 10 seconds between attempts, before its phase fails -- falsifier: one transient network error (a dropped download, a refused connect) fails a phase
      - id: "AC9"
        statement: |-
          AC9: The run is careful with memory and time. Heavy steps run one at a time, the container stack boots only when available memory (4 GB) and free disk (30 GB) meet the boot thresholds at that moment, Docker Desktop is sized to the floor (10 GB, 4 CPUs) and never leaves the host less than 6 GB, and on Intel nothing is compiled from source where a prebuilt install exists -- falsifier: make up-local starts while available memory is below the boot threshold, or uv is installed through Homebrew on Intel
      - id: "AC10"
        statement: |-
          AC10: A re-run resumes. Completed phases are verified and skipped, and a failed phase restarts from its own start -- falsifier: a re-run after a phase-5 failure re-downloads or re-installs anything from phases 1 to 4
      - id: "AC11"
        statement: |-
          AC11: The same script runs on a physical Mac and in a macOS VM. In a VM it detects that, completes Mode 1 and the lab bus, and declines Mode 2 with the reason -- falsifier: a run fails on a macOS VM that meets the Mode 1 floor
      - id: "AC12"
        statement: |-
          AC12: It runs both as /onex:lab_onboarding in Claude Code and as a plain script under macOS's stock /bin/bash 3.2 -- falsifier: the script errors under /bin/bash 3.2 (the D4 failure class)
      - id: "AC13"
        statement: |-
          AC13: The known walkthrough gaps do not recur on an onboarded machine. The workspace floor passes, with the PyPI onex no longer shadowing scripts/onex (D5). The model URL is the tailnet name when off the office LAN (D3). The clones are HTTPS. No ambient BIFROST_* or DELEGATION_* export redirects onex delegate -- falsifier: reconcile-host.sh reports the floor as failed after a completed run, or a receipt's endpoint differs from the one the run configured
