title: Retire evidence items whose description narrates a proof their command cannot produce
summary: '14 dod_evidence items across 11 OCC contracts carried a description narrating a product proof
  while their only check_value was ''uv run pytest tests/test_evidence_admissibility.py -q'' -- OCC''s
  own OMN-15309 predicate suite, which node_dod_verify resolves into the OCC checkout and which passes
  whether or not the fact it is filed under is true. This PR retires all 14 by the append-only supersession
  idiom (#4528), binding each claim to a real product fact at a pinned merge commit with an absence control
  at that commit''s first parent where one applies. Contract repair only: no ticket is flipped, because
  node_dod_verify has no contract-entry supersedes_dod_evidence handling until OMN-15390 lands. Also repairs,
  by the same idiom, the 9 pre-existing OMN-15382 Rule B violations inside the touched contracts and shrinks
  the frozen Rule B baseline by exactly those 9 entries.'
