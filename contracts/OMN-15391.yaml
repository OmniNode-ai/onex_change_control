      emits nothing, `grep -c` prints 0, and `grep -qx 0` exits 0 -- GREEN, having read nothing. Executed
      proof of the defect at authoring time: the superseded shape returns rc=0 against OmniNode-ai/no_such_repo_xyz,
      a repository that does not exist. This file did not exist AT ALL at the parent 5703f123fe272a1214cca50d0fdd66e34180ed14,
      so the superseded leg passed on a 404 -- it never read anything, and would have passed identically
      had the repo been deleted. The replacement pairs a REACHABILITY CONTROL with the absence assertion:
      it first proves the token can resolve 5703f123fe27 in this repo (`gh api .../commits/5703f123fe27
      --jq .sha` must echo the sha back), and only then requires the contents fetch for the path to FAIL.
      A 404 is therefore admissible as evidence of absence only after the same token has demonstrably
      read the same ref -- an auth or network failure fails the control leg first and the check goes RED.
      Claim bound, unchanged: the reusable verifier-stamp workflow exists at omniclaude#1961''s merge
