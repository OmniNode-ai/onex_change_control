  - id: dod-15391-infra2537-baselines-rb2
    description: 'Append-only replacement for dod-15391-infra2537-baselines-bound (OMN-15391 round 2,
      Rule D). The superseded item''s GREEN leg is correct and is carried forward here unchanged; its
      ABSENCE leg was ''... | grep -c ''ALTER TABLE baselines_snapshots ADD COLUMN IF NOT EXISTS snapshot_id''
      | grep -qx 0'', which FAILS OPEN. check_values are handed to `sh -c` without pipefail, so a producer
      that 404s, is denied, or hits a network error emits nothing, `grep -c` prints 0, and `grep -qx 0`
      exits 0 -- GREEN, having read nothing. Executed proof of the defect at authoring time: the superseded
      shape returns rc=0 against OmniNode-ai/no_such_repo_xyz, a repository that does not exist. The replacement
      absence leg reads the parent revision ONCE into a variable, PROVES the read landed by requiring
      the structural anchor ''OMN-11887: node-owned projection migration'' (present in this file at both
      11b460db23d4 and 78b8731103a0, so it tracks the read rather than the fix), and only then asserts
      the marker is absent. A failed fetch now yields an empty body, the anchor leg fails, and the check
      goes RED. Claim bound, unchanged: the baselines_snapshots reconciling ALTER exists at omnibase_infra#2537''s
      merge commit 78b8731103a019ea90eee3164b53e882a064fe34, and was absent at its first parent 11b460db23d40dd2ca7704d0c3e9fd89851af60c.
      Executed at authoring time: green leg rc=0, absence leg rc=0; and the absence leg goes RED under
      all four mutations -- invalid token, nonexistent repo, pointed at the merge commit instead of the
      parent, and anchor mutated.'
