          applies, then runs one delegation pinned to that provider (`--backend-id byok-<provider>`) and
          prints pass, or fail with the provider''s error.'
      - id: AC2
        statement: 'AC2: A key whose prefix belongs to a different provider is refused before storing,
          naming the provider it looks like.'
      - id: AC3
        statement: 'AC3: `onex models add ollama` says Ollama is set up by onboarding (`--provider ollama`)
          and changes nothing, unless Ollama routes are already configured, in which case it runs the
          pinned test delegation on them.'
      - id: AC4
        statement: 'AC4: `onex models list` shows each provider: set up or not, and the last test result
          with its time.'
      - id: AC5
        statement: 'AC5: `onex models remove <provider>` deletes that provider''s stored key.'
      - id: AC6
        statement: 'AC6: `onex models test [<provider>]` re-runs the pinned test delegation for one or
          every set-up provider.'
      - id: AC7
        statement: 'AC7: `--json` output on add, list and test, for the onboarding script to read.'
