        statement: |-
          AC1: Under ONEX_DB_SLOT the forward-migration runner rewrites every managed role name in an applied file to its slot principal, and datname and has_database_privilege database literals to the slot database, and applies files unchanged outside a slot -- falsifier: uv run pytest tests/unit/infra/test_forward_migration_slot_role_confinement.py, red against the pre-fix runner
      - id: "AC2"
        statement: |-
          AC2: Under ONEX_DB_SLOT the intelligence migration runner targets omniintelligence_<slot>, refuses to create it, and the slot overlay runs it as a prepr-migrate one-shot that the entrypoint invokes after the forward migration -- falsifier: uv run pytest tests/unit/scripts/test_prepr_slot_gaps_intelligence_migration.py, red against the pre-fix scripts
      - id: "AC3"
        statement: |-
          AC3: With KAFKA_TOPIC_NAMESPACE set, the topic provisioner creates, finds and confirms the namespaced physical names, and with it unset the names it sends to the broker are byte-identical to today -- falsifier: uv run pytest tests/unit/event_bus/test_topic_provisioner_namespace_omn18893.py, red against the pre-fix provisioner
      - id: "AC4"
        statement: |-
          AC4: A prepr-1 slot brought up on the lab host by prepr_verify_lane.sh from this branch reaches a ready runtime and is torn down to zero slot databases, roles, containers and images -- falsifier: curl -sf http://localhost:28085/health on the lab host during the run, then the prepr catalog and docker counts after teardown, each with a positive control
