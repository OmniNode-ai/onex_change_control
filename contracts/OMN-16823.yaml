      by execution inside the same run — cases L through R each inject a non-concession and assert the
      gate stays red, so a widened match cannot degrade into "any CodeRabbit reply clears the thread".
      AC4 is asserted mechanically too: the suite greps the gate script for resolveReviewThread / unresolveReviewThread
      / --resolve and fails if any appears, keeping `pr_review_bot` the sole resolver.
    source: "manual"
    linear_dod_text: >-
      The concession phrasing class is recognized; a test pins the new behavior with the #1604 reply text
      as a positive case; negative controls (unanswered finding, non-conceding reply) permanently stay
      blocking, proven by execution; no auto-resolution is introduced.
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/scripts/test_check_unresolved_threads_filters.py -q --color=no"
      - check_type: "test_passes"
