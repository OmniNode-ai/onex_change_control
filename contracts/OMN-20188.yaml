  - id: "dod-da-20188-ac2-kept-models-name-their-caller"
    description: |-
      AC2 readback (done-audit-0c2f, OMN-17427). Reads the extra-forbid baseline at the
      omnibase_core#1823 merge commit a3ee0cdd6ced, takes every delegation model still on it, and for
      each requires a file:line reference in the #1823 body whose line in the omnimarket clone calls
      model_validate for that model on a raw payload. At authoring: two kept
      (ModelAgentTaskLifecycleEvent, ModelInvocationCommand), callers
      dispatcher_agent_task_lifecycle.py:193 and dispatcher_invocation_command.py:113. Both were later
      flipped by OMN-20201 (#1828); the criterion is about #1823 and its body.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          r=OmniNode-ai/omnibase_core
          body="$(gh pr view 1823 --repo "$r" --json body --jq .body)" || exit 2
          kept="$(gh api "repos/$r/contents/src/omnibase_core/validators/extra_forbid_baseline.yaml?ref=a3ee0cdd6ced443d1234f071d4cd48fad79df778" --jq .content | base64 -d | grep -oE 'models\.(delegation\.[a-z0-9_]+|governance\.model_delegation_health):Model[A-Za-z0-9]+' | sed 's/.*://')" || exit 2
          refs="$(printf '%s\n' "$body" | grep -oE '[a-z0-9_/]+\.py:[0-9]+')"
          n=0; fail=0
          for m in $kept; do
            n=$((n + 1)); ok=0
            for ref in $refs; do
              f="${ref%%:*}"; l="${ref##*:}"
              p="$(git -C "${OMNI_HOME}/omnimarket" ls-files "*${f}" | head -1)"
              if [ -n "$p" ] && [ "$(sed -n "${l}p" "${OMNI_HOME}/omnimarket/$p" | grep -c "${m}\.model_validate")" -ge 1 ]; then ok=1; echo "kept=$m caller=$p:$l"; fi
            done
            [ "$ok" -eq 1 ] || { echo "kept=$m caller=NONE"; fail=1; }
          done
          echo "kept_models=$n"
          test "$n" -ge 1 && test "$fail" -eq 0
    binds_ac:
      - "AC2"
    ac_bindings:
      - label: "AC2"
        criterion_hash: "03e11f013ab02c79441d94382cac966e2b20a5aef9df0c26ce05245ce92c27ff"
