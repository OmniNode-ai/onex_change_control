---
schema_version: "1.0.0"
ticket_id: "OMN-17771"
title: "Point the customer guides' registration URL and token grant at onex-customer"
summary: |
  Evidence for OMN-17771. The customer guides' registration URL and token grant both name the
  dedicated onex-customer Keycloak client, and the documented sign-on walk was executed live
  against dev.auth.omninode.ai and dev.app.omninode.ai rather than asserted by inspection. The
  walk found one false statement in Step 1 — it claimed the reader lands on the dashboard
  signed in, when the authorization code actually returns to the public landing page, which
  never consumes it — corrected by OmniNode-ai/knowledge-base-internal#331.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: |
      knowledge-base-internal PR #331 CI checks green
    command: |
      gh pr checks 331 --repo OmniNode-ai/knowledge-base-internal
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn17771-ac1-no-internal-client-ids"
    description: |
      AC1 — zero client_id=omnidash-spa and zero client_id=omniweb occurrences in any customer-
      facing guide. Counted at the merged tip of OmniNode-ai/knowledge-base-internal, across all
      four customer-*.md guides. The first check sums those occurrences over every customer guide
      and asserts the total is 0. The second check is the positive control that makes the zero
      meaningful: the same grep pattern, run against the same files, counts a NON-zero number of
      onex-customer occurrences — so the pattern and the file set are both live and an always-
      empty result would fail. A single omnidash-spa mention survives in guides/customer-api-key-
      security.md, in prose instructing readers to move OFF that client; it is not a client_id=
      instruction and the AC counts client_id= occurrences.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC1"
    checks:
      - check_type: "command"
        check_value: |-
          tot=0; for f in customer-getting-started customer-api-key-security customer-beta-gateway-and-delegation customer-usage-and-plans; do body="$(gh api "repos/OmniNode-ai/knowledge-base-internal/contents/guides/$f.md?ref=main" --jq '.content' | base64 -d)"; test -n "$body" || exit 1; n=$(printf '%s' "$body" | grep -cE 'client_id=(omnidash-spa|omniweb)'); tot=$((tot+n)); done; test "$tot" = "0"
      - check_type: "command"
        check_value: |-
          tot=0; for f in customer-getting-started customer-api-key-security; do body="$(gh api "repos/OmniNode-ai/knowledge-base-internal/contents/guides/$f.md?ref=main" --jq '.content' | base64 -d)"; test -n "$body" || exit 1; n=$(printf '%s' "$body" | grep -c 'client_id=onex-customer'); tot=$((tot+n)); done; test "$tot" -gt "0"
  - id: "dod-omn17771-ac2-registration-url-form"
    description: |
      AC2 — the Step 1 registration URL, pasted verbatim, returns HTTP 200 with a registration
      form, probed with no source checkout and no org credential. Executed live 2026-09-10T00:5xZ:
      the URL read out of guides/customer-getting-started.md at origin/main
      348bbe1b859f5da35d3baebbfab28215fff4ea75, with client_id=onex-customer, response_type=code,
      scope=openid, redirect_uri=https://dev.app.omninode.ai and a freshly generated S256
      challenge, returned HTTP 200, 13417 bytes, carrying id="kc-register-form" and the six inputs
      username, email, firstName, lastName, password, password-confirm. The first check re-runs
      that probe unauthenticated and asserts both HTTP 200 and the presence of the registration
      form id. The second check is the positive control: the same endpoint with a client_id that
      does not exist on the realm returns a page WITHOUT kc-register-form, so a 200 alone cannot
      pass this criterion.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC2"
    checks:
      - check_type: "command"
        check_value: |-
          guide="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=055da140d8b2e772464ee7a50802aee851d29b4b' --jq '.content' | base64 -d)" && test -n "$guide" && printf '%s' "$guide" | grep -qF 'openid-connect/registrations?client_id=onex-customer' && CH=$(printf '%s' "occ-ac2-verifier-fixed-string" | openssl dgst -binary -sha256 | openssl base64 | tr '+/' '-_' | tr -d '=\n') && page="$(curl -sS "https://dev.auth.omninode.ai/realms/omninode/protocol/openid-connect/registrations?client_id=onex-customer&response_type=code&scope=openid&redirect_uri=https://dev.app.omninode.ai&code_challenge=${CH}&code_challenge_method=S256")" && test -n "$page" && printf '%s' "$page" | grep -qF 'id="kc-register-form"'
      - check_type: "command"
        check_value: |-
          guide="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=055da140d8b2e772464ee7a50802aee851d29b4b' --jq '.content' | base64 -d)" && test -n "$guide" && printf '%s' "$guide" | grep -qF 'openid-connect/registrations?client_id=onex-customer' && CH=$(printf '%s' "occ-ac2-verifier-fixed-string" | openssl dgst -binary -sha256 | openssl base64 | tr '+/' '-_' | tr -d '=\n') && page="$(curl -sS "https://dev.auth.omninode.ai/realms/omninode/protocol/openid-connect/registrations?client_id=onex-customer-does-not-exist&response_type=code&scope=openid&redirect_uri=https://dev.app.omninode.ai&code_challenge=${CH}&code_challenge_method=S256")" && test -n "$page" && ! printf '%s' "$page" | grep -qF 'id="kc-register-form"'
  - id: "dod-omn17771-ac3-client-ok-code-rejected"
    description: |
      AC3 — the token command names a client that exists on the plane the guide names, proven by
      an invalid_grant (code/user rejected) rather than unauthorized_client or Client not found
      (client rejected). Probed live 2026-09-10T01:0xZ against the token endpoint with the guide's
      own authorization_code command shape: client_id=onex-customer with a deliberately invalid
      code returns HTTP 400 {"error":"invalid_grant","error_description":"Code not valid"} — the
      client was accepted and the code was rejected. The positive control is the same request with
      a client_id that does not exist, which returns HTTP 401 {"error":"invalid_client"}, so the
      two outcomes discriminate. STATED PLAINLY, NOT SOFTENED: the ticket's scope-correction note
      restates AC3 more strictly as "the documented command produces a usable token at all". That
      stricter form was NOT exercised and is NOT claimed here. Reaching a real authorization code
      needs a verified account, and the realm sets verifyEmail: true — a correct-password sign-in
      returns HTTP 302 back to execution=VERIFY_EMAIL until the emailed link is clicked. The
      disposable account this lane registered through the public path
      (omn17771-walk-20260910@example.invalid) is on a reserved invalid domain with no readable
      inbox, so the link was unreachable. That is a limitation of this lane, not a defect in the
      guide or the client: nothing on the path waits on an operator.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC3"
    checks:
      - check_type: "command"
        check_value: |-
          guide="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=055da140d8b2e772464ee7a50802aee851d29b4b' --jq '.content' | base64 -d)" && test -n "$guide" && printf '%s' "$guide" | grep -qF 'grant_type=authorization_code' && body="$(curl -sS -X POST "https://dev.auth.omninode.ai/realms/omninode/protocol/openid-connect/token" -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=authorization_code" -d "code=deliberately-invalid-code" -d "redirect_uri=https://dev.app.omninode.ai" -d "code_verifier=occ-ac3-deterministic-verifier-0001" -d "client_id=onex-customer")" && printf '%s' "$body" | grep -qF '"error":"invalid_grant"'
      - check_type: "command"
        check_value: |-
          guide="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=055da140d8b2e772464ee7a50802aee851d29b4b' --jq '.content' | base64 -d)" && test -n "$guide" && printf '%s' "$guide" | grep -qF 'grant_type=authorization_code' && body="$(curl -sS -X POST "https://dev.auth.omninode.ai/realms/omninode/protocol/openid-connect/token" -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=authorization_code" -d "code=deliberately-invalid-code" -d "redirect_uri=https://dev.app.omninode.ai" -d "code_verifier=occ-ac3-deterministic-verifier-0001" -d "client_id=onex-customer-does-not-exist")" && printf '%s' "$body" | grep -qF '"error":"invalid_client"'
  - id: "dod-omn17771-ac4-repo-checkers-green"
    description: |
      AC4 - the no-private-repo-links and beta-layout checkers are green. HOW THIS IS EVIDENCED,
      and what each half does and does not prove. The OBSERVED conclusion is recorded in this
      item's receipt: every check-run on the merged squash commit
      055da140d8b2e772464ee7a50802aee851d29b4b concluded success, seven runs, zero with a
      conclusion other than success, skipped or neutral, read from the check-runs API during the
      lane. That reading is NOT re-run as a check here, for a stated reason rather than a
      convenient one: this repository's CI token cannot read check-runs on the product repository,
      so a check-runs assertion fails in CI on permissions and would be indistinguishable from a
      real red. A check-run conclusion is also mutable - a re-run rewrites it - which the
      OMN-15540 Rule F guidance says to bind through a recorded receipt rather than a live
      predicate. The two checks below assert what CI can verify and what actually carries the
      criterion: the first that BOTH named checker workflows exist and are non-empty at the merged
      commit, so both were wired and ran on it; the second that the PROPERTY the private-repo-
      links checker enforces holds at main - zero github.com links across all four customer guides
      - re-derived rather than taken on the checker's word. Both loops abort on an empty body, so
      a fetch failure cannot sum to zero and read as compliance. Locally on the branch head
      48b91f8adc649977eea124e28649eb3bd1a63067, python3 -m scripts.check_no_private_repo_links and
      python3 -m scripts.check_beta_layout each exited 0 and a full pre-commit run --all-files was
      clean.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC4"
    checks:
      - check_type: "command"
        check_value: |-
          for w in no-private-repo-links beta-layout; do body="$(gh api "repos/OmniNode-ai/knowledge-base-internal/contents/.github/workflows/$w.yml?ref=055da140d8b2e772464ee7a50802aee851d29b4b" --jq '.content' | base64 -d)"; test -n "$body" || exit 1; printf '%s' "$body" | grep -qF 'jobs:' || exit 1; done; echo wired
      - check_type: "command"
        check_value: |-
          tot=0; for f in customer-getting-started customer-api-key-security customer-beta-gateway-and-delegation customer-usage-and-plans; do body="$(gh api "repos/OmniNode-ai/knowledge-base-internal/contents/guides/$f.md?ref=main" --jq '.content' | base64 -d)"; test -n "$body" || exit 1; n=$(printf '%s' "$body" | grep -c 'https://github.com/'); tot=$((tot+n)); done; test "$tot" = "0"
  - id: "dod-omn17771-ac5-merged-read-back-main"
    description: |
      AC5 — merged to main and read back from origin/main, not from the merge API alone. The first
      check reads the corrected Step 1 prose out of guides/customer-getting-started.md at ref=main
      through the contents API and asserts the new landing-page sentence is present. The second
      check is the negative control against the pre-change parent
      348bbe1b859f5da35d3baebbfab28215fff4ea75, where that sentence counts 0 and the FALSE
      sentence this PR removed ("browser lands back on `https://dev.app.omninode.ai`, signed in")
      is still present — so the pair proves a state change at main rather than a pattern that
      matches everywhere.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC5"
    checks:
      - check_type: "command"
        check_value: |-
          body="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=main' --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -qF 'you are not signed in to the dashboard yet'
      - check_type: "command"
        check_value: |-
          body="$(gh api 'repos/OmniNode-ai/knowledge-base-internal/contents/guides/customer-getting-started.md?ref=348bbe1b859f5da35d3baebbfab28215fff4ea75' --jq '.content' | base64 -d)" && printf '%s' "$body" | grep -qF 'browser lands back on' && ! printf '%s' "$body" | grep -qF 'you are not signed in to the dashboard yet'
  - id: "occ-self-bind-pr-omn17771"
    description: |
      Binds OMN-17771 to its OCC companion PR on OmniNode-ai/onex_change_control (self-bind).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          test "$(gh api 'repos/OmniNode-ai/onex_change_control/pulls?state=all&per_page=100' --jq '[.[] | select(.title | contains("OMN-17771"))] | length')" -gt "0"
