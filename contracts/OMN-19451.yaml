    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a reusable workflow reads the newest delegation nightly and every M4 verdict workflow with the existing workflow-verdict reader and fails, naming the red run id, on runtime-affecting PRs in omnimarket and omnibase_infra -- falsifier: a pytest over the verdict step with a replayed red run asserting failure and the run id in the message
