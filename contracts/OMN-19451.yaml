        statement: |-
          AC2: a typed fix-forward label naming the red's ticket admits a PR and is recorded, and a label with no ticket id is refused -- falsifier: a pytest over both label cases
      - id: "AC3"
        statement: |-
          AC3: the check reports in shadow on both repos for 7 days before it is made required -- falsifier: the check marked required with fewer than 7 days of shadow runs
