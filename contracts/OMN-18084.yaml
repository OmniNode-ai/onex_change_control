schema_version: "1.0.0"
ticket_id: "OMN-18084"
title: "The DLQ replay handler no longer re-dead-letters its own failures into the topics it reads"
summary: >
  OCC companion for OmniNode-ai/omnibase_infra PR #3365. Bound by hand (union-resolve) because the autobind
  producer mints nothing today, the same reason OCC#8798 and OCC#8802 were hand-minted in this window.
  MEASURED on the .201 dev lane over a 480 s double-read window ending 2026-09-09T16:27:34Z: onex.dlq.omnibase-infra.events.v1
  took 93,027 records = 193.8 records/s = 16.74M/day = about 151 GB/day at 9,656 bytes/record on disk.
  All 2,000 records of a sample carried original_topic equal to the topic they were consumed from, failure_type
  handler_exception, and RuntimeError Consumer not started. The topic held 108 GB of a 213 GB Redpanda
  data directory; /data on that host is 84 percent used with 590 GB free and carries the prod, stability-test,
  judge and collaborator lane volumes; retention is 7 days with no byte cap, so steady state for that
  one topic is about 1.05 TB. The zero-composition control is not vacuous - the authenticated rpk topic
  list returned 1,659 topics where the unauthenticated read returned a SASL error, so an empty result
  would have been an error rather than an absence. Three defects compose into the loop and all three are
  closed here. (1) The loop-breaker _is_dead_letter_source_topic guarded the no-dispatcher leg and the
  no-result-applier leg but NOT the handler-error leg; the per-topic routing split that landed earlier
  in the week did not create the amplifier, it moved DLQ traffic off the guarded leg onto the unguarded
  one by making the replay handler dispatch successfully and then fail. (2) get_dlq_topic_for_original
  reads a message category out of a topic's own segments, so it is a FIXED POINT on onex.dlq.* names -
  it answers a dead-letter topic with itself. (3) service_kernel keys runtime dependencies by handler
  NAME, so the three per-topic dispatchers share one DLQConsumer, and _ensure_runtime_dependencies_started
  skips a dependency already flagged started without taking responsibility for stopping it, so a peer's
  finally tore down a consumer another dispatcher was draining - which is the exception the unguarded
  leg was answering. NO lane, container, topic, consumer group, service, retention setting, cluster, credential
  or routing variable was mutated by this change or by the lane that authored it. Reclaiming the 108 GB
  backlog is deliberately out of scope: it is a lane mutation needing its own authorization, and it must
  not happen before this fix is deployed or the topic simply refills.
