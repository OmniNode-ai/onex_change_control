  - id: "ac1-handler-error-leg-is-guarded"
    description: >-
      AC1 binding. Runs the class whose own docstring states the criterion - "AC1 - the HANDLER_ERROR
      leg gets the loop-breaker the others have" - so the mapping is transcribed from the test module
      rather than inferred from a name. The class asserts zero new records on onex.dlq.omnibase-infra.events.v1
      by name, asserts no written record names its own source topic, extends the same assertion to the
      commands sink so the guard keys on the DLQ shape rather than one topic name, and carries a positive
      control asserting an ordinary topic still produces exactly one DLQ write to a DIFFERENT topic -
      without which a guard that returned early for every topic would pass the other three while deleting
      the boundary's reason to exist.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
