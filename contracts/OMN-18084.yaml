        check_value: |-
          uv run pytest tests/unit/runtime/auto_wiring/test_omn18084_handler_error_leg_dlq_loop.py::TestHandlerErrorOnADeadLetterTopicIsNotRepublished -q
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "ac2-dlq-topic-fixed-point-is-refused"
    description: >-
      AC2 binding. Runs both classes of the resolver module: the one whose docstring states the criterion
