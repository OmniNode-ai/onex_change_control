      sinks the lane carries, plus its positive control that an ordinary topic still resolves to the documented
      answer; and the companion class asserting the two never-raising boundary helpers PRE-GUARD rather
      than catch, which is what keeps a typed refusal from converting a logged loss into a crash on a
      path documented as never raising.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
