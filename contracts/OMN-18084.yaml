      a publish, plus a mutex that serialises an existing lifecycle. The one behaviour change visible
      to an operator is that a failure on a dead-letter source topic is now recorded as a structured log
      line instead of a new dead-letter record. Deployment reaches the .201 dev lane only when the deploy
      agent is restarted; this lane neither performed nor requested that.
    source: "generated"
