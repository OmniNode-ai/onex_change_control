  - id: "dod-deploy-assessment-falsifiable"
    description: >-
      Falsifiable replacement for dod-deploy-assessment, APPENDED under OCC append-only doctrine rather
      than edited in place: a merged dod_evidence entry is immutable and its receipt pins the entry hash,
      so an in-place rewrite is rejected by validator_occ_append_only and would invalidate the receipt
      binding. The superseded item ran gh pr diff 1990 --repo OmniNode-ai/omnimarket --name-only piped
      into grep -ciE over PR #1990's OWN file list. PR #1990 is MERGED, so that file list is immutable
      and permanently contains the two changed paths; the check therefore exits 0 unconditionally and
      cannot be driven RED by any change to the product source, the deploy surface, or the runtime. It
      is unfalsifiable by construction — the OMN-14443 class — and a check that can never fail proves
      nothing about deploy scope. OCC #5762 neutralised it additively by ADDING dod-deploy-source-probe,
      but did not retire the vacuous item, which stayed live and readable as passing evidence. This item
      retires it under the append-only supersession idiom shipped in OMN-15382/OMN-15390 (EvidenceCollector._resolve_supersessions),
      following the lane-B3 precedent OCC #5760 on contracts/OMN-15535.yaml; the superseded entry stays
      verbatim for audit and is resolved to status=superseded at dod_verify runtime. Replacement semantics
      — an immutable-ref CONTENT probe of the deploy-relevant source at PR #1990's squash merge commit
      46e5364db360da5dbb72f382ddfea93488fc01fa, asserting the OMN-15472 fix symbol _preserve_service_url
      is present BOTH as a definition and at the registration create-path call site the fix exists to
      protect. Falsifiability was demonstrated rather than asserted: the identical probe repointed at
      that merge commit's first parent 8e27c27ab810d06386511cfada0c5b167ef445ca exits 1, because the symbol
      does not exist there. Executor shape — the first shlex token is gh, a resolvable executable on PATH,
      and the command contains no command substitution at all, so node_dod_verify's pre-execution shlex.split
      shape guard cannot mis-branch on it (the OMN-15597 caution and the OMN-15535 INVALID_CHECK_VALUE_NOT_A_COMMAND
      false-RED class). Each leg terminates in a grep -F redirected to /dev/null whose input is fully
      drained, which avoids both the SIGPIPE exit-141 hazard of grep -q and the grep -c counting idiom
      that fails in both polarities under pipefail. Authorship — written by session fable-ws0-0731/laneC3,
      which did not implement the OMN-15472 code legs, so implementer and evidence-author remain separate
      for this item.
    source: "manual"
    status: "verified"
    evidence_artifact: "supersedes_dod_evidence:dod-deploy-assessment"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_registration/handlers/handler_projection_registration.py?ref=46e5364db360da5dbb72f382ddfea93488fc01fa' --jq .content | base64 -d | grep -F 'def _preserve_service_url(existing: object) -> str:' > /dev/null && gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_registration/handlers/handler_projection_registration.py?ref=46e5364db360da5dbb72f382ddfea93488fc01fa' --jq .content | base64 -d | grep -F '"service_url": _preserve_service_url(base.get("service_url")),' > /dev/null
