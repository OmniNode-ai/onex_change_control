schema_version: "1.0.0"
ticket_id: "OMN-15411"
title: "SIGPIPE-safe OMN-15170 content check in contracts/OMN-15170.yaml"
summary: >-
  contracts/OMN-15170.yaml's dod-steel220-omn15170-live-driver-content check piped `gh api ... | base64
  -d | grep -q '<marker>'`. `grep -q` exits at the first match and closes its stdin, so the upstream `base64
  -d` (and transitively `gh api`'s curl) is killed by SIGPIPE once the pipe closes; under `pipefail` (the
  dod_verify runner's shell mode) that SIGPIPE exit propagates as the pipeline's exit code (128+13=141)
  even though the substantive grep matched -- a reproducible false RED inside the runner, while the same
  command exits 0 when run directly outside pipefail. This PR supersedes that entry (append-only, per
  the OMN-14875/OMN-15382 supersedes_dod_evidence idiom) in contracts/OMN-15170.yaml with a SIGPIPE-safe,
  still-falsifiable form: the short-circuiting `grep -q` is replaced with a fully-draining `grep -c '<marker>'
  | grep -qxv 0` -- `grep -c` reads its entire stdin before reporting a match count, so it never SIGPIPEs
  its writer. Verified 10/10 consecutive runs under `bash -o pipefail -c` exit 0 against the real marker;
  the same form against a mutated, absent marker exits 1 (RED), proving falsifiability is preserved. No
  code paths change outside contracts/OMN-15170.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
