title: Plugin parity admission ignores Claude Code's top-level .in_use runtime marker
summary: Hand-authored evidence for OmniNode-ai/omniclaude-internal#506 (squash 656dc8d6e41b). AC1 to
  AC3 are bound to test selections of tests/test_lab_host_parity.py run at the merge commit and, as a
  must-fail control, at the merge parent with the merged tests overlaid. AC4 is a regression guard over
  two suites. AC5 is bound to a readback of the h101 plugin parity record.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The acceptance criteria this ticket's author declared, transcribed verbatim from the ticket
      body. The ticket body is the source and this block is the copy; each criterion's id is the label
      the sibling binds_ac entry claims.
    acceptance:
      - id: AC1
        statement: 'AC1: an installed plugin tree equal to its shipped revision except for a top-level
          .in_use/<pid> directory probes as state ok with no ParityNeeds items -- falsifier: uv run pytest
          tests/test_lab_host_parity.py -k claude_code_in_use_marker_passes'
      - id: AC2
        statement: 'AC2: a real added, changed or removed file next to the .in_use marker still probes
          as modified and names that file as the first difference -- falsifier: uv run pytest tests/test_lab_host_parity.py
          -k in_use_marker_does_not_mask_a_real_difference'
      - id: AC3
        statement: 'AC3: a .in_use entry at any depth below the top of the install path, and a top-level
          .in_use that is a file or a symlink, still counts as a difference -- falsifier: uv run pytest
          tests/test_lab_host_parity.py -k in_use'
      - id: AC4
        statement: 'AC4: the existing parity suites still pass with the change -- falsifier: uv run pytest
          tests/test_lab_host_parity.py tests/test_validate_plugin.py'
      - id: AC5
        statement: 'AC5: with the fix installed on the Mac, the h101 placement read no longer reports
          a PARITY-FAILED refusal whose first difference is .in_use/<pid> -- falsifier: the remote-lane
          host table read for h101 after install, shows no first=.in_use/ refusal while a Claude session
          is open on h101'
evidence_requirements:
  - kind: tests
    description: The .in_use marker tests of tests/test_lab_host_parity.py pass at the merge commit.
    command: uv run --no-project --python 3.13 --with-requirements tests/skill_suites_requirements.txt
      python -m pytest -q tests/test_lab_host_parity.py -k in_use
