  - id: dod-omn20835-ac5-h101-parity-readback
    description: 'AC5: a readback of the plugin parity record of host h101 through the shared lab host
      table. It passes when h101 is read without error, every installed plugin probes ok, and no difference
      names a first path under .in_use/. The output also lists the top-level .in_use entries under h101''s
      installed plugins, which shows whether a Claude session is open there; the command does not require
      one. The receipt was captured through a nested ssh from h202, because the capturing host holds no
      key for h101; the contract command reads h101 directly from the launching host.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          M=656dc8d6e41b6cf94839221c1f34f8ea80874bf6
          gh api repos/OmniNode-ai/omniclaude-internal/commits/$M --jq .sha || exit 2
          git merge-base --is-ancestor $M HEAD || exit 2
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "plugins/omni/skills/merge-drain/scripts")
          import landing_placement as lp
          pool = lp.load_pool()
          host = next(h for h in pool if h.name == "h101")
          MARK = "for d in ~/.claude/plugins/cache/omninode-internal/*/*/.in_use; do ls -A $d; done 2>/dev/null"
          SSH = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=10"]
          r = lp.read_pool([host])[0]
          marks = subprocess.run(SSH + [host.target, MARK], capture_output=True, text=True, timeout=60).stdout
          print("h101 read error:", r.error if r else "unreadable")
          if r is None or r.error is not None or r.parity is None:
              sys.exit(2)
          bad = False
          for p in r.parity.plugins:
              print("plugin", p.name, p.state, p.detail)
              if p.state != "ok" or "first=.in_use/" in p.detail:
                  bad = True
          print("parity refusal:", r.parity_refusal)
          print("top-level .in_use entries under the installed omninode-internal plugins:", marks.split() or "none")
          sys.exit(1 if bad or "first=.in_use/" in (r.parity_refusal or "") else 0)
          PY
        cwd: ${OMNI_HOME}/omniclaude-internal
    binds_ac:
      - AC5
    ac_bindings:
      - label: AC5
        criterion_hash: 27a274a3da2ae2424689a688b1e4437fc4106d23b816cf3108220d9f9367a26a
        proposed_by: lane=contracts-merged-5d21
