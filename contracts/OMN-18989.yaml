dod_evidence:
  - id: "dod-deploy-module-importable-omn18989"
    description: >-
      LIVE DEPLOY PROBE. The runtime the dev lane is actually running can import the new module and its
      entry point. This is falsifiable in the useful direction and that is what makes it a measurement
      rather than a restatement: the identical command FAILS against any runtime built before this change,
      because omnimarket.delegation.structured_output does not exist there. It reads the DEPLOYED interpreter
      rather than any receipt, contract or file this pull request authors, so it cannot be satisfied by
      text written here.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'from omnimarket.delegation.structured_output
          import provider_response_format_for_contract'"
  - id: "dod-deploy-capability-declared-omn18989"
    description: >-
      LIVE DEPLOY PROBE, and the one that matters for behaviour. The binding contract the deployed runtime
      reads declares structured-output support on local-heavy-reasoning. Without this the module above
      is inert: the directive is only sent where a backend declares support, so a runtime carrying the
      code but not the declaration would change nothing. Fails against any runtime deployed before this
      change, where the key is absent from the binding.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'import pathlib,sys,yaml,omnimarket;
          c=yaml.safe_load((pathlib.Path(omnimarket.__file__).parent/\"configs\"/\"bifrost_delegation.yaml\").read_text());
          sys.exit(0 if any(b.get(\"backend_id\")==\"local-heavy-reasoning\" and b.get(\"supports_response_format_json_schema\")
          is True for b in c[\"backends\"]) else 1)'"
  - id: "dod-merge-commit-carries-the-change-omn18989"
    description: >-
      HERMETIC CONTENT CHECK at the merge sha, the form this gate sanctions for the portion of the change
      that is compute-only. It reads the merged tree through the API rather than any local working copy,
      and names the symbol the fix introduces rather than a phrase this contract chose, so it cannot pass
      on a merge that dropped the change.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/delegation/structured_output.py?ref=${MERGE_SHA}
          --jq .content | base64 -d | grep -q 'def provider_response_format_for_contract'"
  - id: "dod-ci-green-omn18989"
    description: Product pull request reached a green terminal state in CI.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - id: "dod-merged-omn18989"
    description: Product pull request merged.
    source: "generated"
