schema_version: "1.0.0"
ticket_id: OMN-18989
title: A declared closed label set reaches the provider as a constraint, not only the prompt
summary: >-
  A classification answer whose label was NOT in the requested set passed the delegation quality gate
  at 1.0. Asked in prose for one of HEALTH_SIGNAL or INSTRUMENTATION_DEFECT, the served Qwen3.8-27B returned
  the corrupted token INSTRUMENTEMENT_DEFECT and the run terminalised completed against a 0.8 bar with
  no failed gates, three times out of three. Correlations a75a211c-0828-4714-ad7e-610f226529fe and 582e957c-d2bf-49c8-83e7-5e545d0e7765,
  plus a direct endpoint probe. HALF THE REMEDY WAS ALREADY SHIPPED and is pinned rather than rebuilt:
  the gate validates a declared response_contract with a real JSON-Schema validator, so an enum is already
  enforced inbound and the violation already names the offending token. The failing run simply declared
  no contract. What was missing is the OUTBOUND half, which the codebase itself had already named as blocked
  on "a capability field on the binding contract". This adds that field, defaulting OFF, carries it onto
  the RESOLVED backend so an escalation to another rung cannot reuse the previous rung's capability, forwards
  the caller's schema verbatim so the shape the provider enforces cannot drift from the shape the gate
  grades, and declares support on exactly one backend on the strength of a live probe. A backend that
  does not declare support, or a caller that declared no contract, sends nothing and behaves byte-identically
  to before. THE LIMIT IS STATED RATHER THAN IMPLIED: this closes the vocabulary defect and not the wrong-in-vocabulary
  defect. A label outside the declared set becomes mechanically impossible; a wrong label that IS in the
  set stays invisible to every check here and always will.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
