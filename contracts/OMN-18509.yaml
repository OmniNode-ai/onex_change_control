  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the check is implemented once and consumed by every registry repository, not copied per repo -- falsifier: more than one implementation of the rule exists across the fleet, or a repository carries a local variant; the shared artifact is cited by path and each consumer by the line that calls it
      - id: "AC2"
        statement: |-
          AC2: the rule refuses a uses: naming a reusable in a DIFFERENT repository at any branch ref, and permits @main and a full 40-character sha -- falsifier: a fixture planting @dev, @feature/x and a short sha each produces a refusal naming the file, line and ref, while @main and a full sha pass in the same run
      - id: "AC3"
        statement: |-
          AC3: same-repository self-references are out of scope and are not refused -- falsifier: a fixture carrying OmniNode-ai/<self>/...@dev passes, because changing self-reference resolution has a different blast radius and is deliberately not this rule's subject
      - id: "AC4"
        statement: |-
          AC4: the check fails closed -- falsifier: an unreadable workflows directory, an unparseable uses: value, and a scan that matches zero files each exit non-zero with a reason naming the condition; a green run on an empty scan fails this criterion
      - id: "AC5"
        statement: |-
          AC5: it is a gate, not a report -- falsifier: the check is a required context (or asserted under a required umbrella) on dev in every consuming repository, each cited by a live readback of that repository's protection or its summary gate's asserted tuple
      - id: "AC6"
        statement: |-
          AC6: the fleet is at zero branch pins when this lands, measured rather than assumed -- falsifier: the probe above returns a non-zero line count for any registry repository, with the @main count non-zero in the same sweep as the positive control
      - id: "AC7"
        statement: |-
          AC7: gh pr checks green on every pull request before merge, or any red context named and attributed -- falsifier: each squash sha and check summary cited on this ticket
