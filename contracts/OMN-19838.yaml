      - id: "AC4"
        statement: |-
          AC4: the onex-delegation-dispatch-consumer-kwarg-parity pre-commit hook and its test module are removed from omnibase_infra -- falsifier: grep -n "onex-delegation-dispatch-consumer-kwarg-parity" omnibase_infra/.pre-commit-config.yaml returns 0 hits
      - id: "AC6"
        statement: |-
          AC6: all three implementations (omnimarket LocalDelegationDispatchPort, omnimarket RuntimeDelegationDispatchPort, omnibase_infra RuntimeDelegationDispatchPort) take dispatch(request) and return the shared result model, with the handler's _response_from_result reading the typed result -- falsifier: omnimarket tests/unit/nodes/node_delegate_skill_orchestrator/test_dispatch_request_three_paths.py (local, market-bus, and injected-infra from the locked infra release) fails, or reverting any one implementation to its keyword-only signature does not fail its path with TypeError
      - id: "AC7"
        statement: |-
          AC7: on the lab dev lane, one delegation each through the local, market-bus and runtime-injected infra paths, plus new infra with the previous omnimarket release, reaches a typed terminal -- falsifier: any of the four terminalizes on TypeError
      - id: "AC8"
        statement: |-
          AC8: the provider's transitional legacy keyword path is deleted once the runtime image lock resolves omnimarket at or above R-market-1 -- falsifier: a legacy keyword call to omnibase_infra RuntimeDelegationDispatchPort.dispatch does not raise TypeError
      - id: "AC9"
        statement: |-
          AC9: omnibase_infra adds tests/unit/runtime/test_delegation_dispatch_port_conforms_to_shared_protocol.py in its ordinary CI split plus pre-commit hook onex-delegation-dispatch-provider-conformance with files: scoped to service_delegation_dispatch_port.py, auto_wiring/handler_wiring.py, the test module, pyproject.toml and uv.lock (no always_run, no sibling read), and deletes delegation-consumer-kwarg-parity.yml with its consumer-kwarg-parity entries in ci_summary_gate.py and runner_routing_policy.yaml, merged before the omnimarket protocol deletion merges -- falsifier: a scratch-branch probe adding a required keyword-only parameter to the provider's dispatch passes that module locally or in CI
      - id: "AC10"
        statement: |-
          AC10: omnimarket tests/integration/delegation/test_injected_provider_dispatch_port_conformance.py drives HandlerDelegateSkill with the locked infra port against core's shared protocol -- falsifier: run against a lock pinned to the pre-migration infra release, it exits 0
      - id: "AC12"
        statement: |-
          AC12: the other always-run sibling-reading hooks carry files: scopes and their cross-repo reads move to introducing-repo checks on locked deps -- falsifier: any listed hook still has always_run or references a sibling-clone path or env var
      - id: "AC13"
        statement: |-
          AC13: omnibase_core release R-core-1 defines ModelDelegationDispatchRequest and ModelDelegationDispatchResult in omnibase_core.models.delegation.wire and ProtocolDelegationDispatchPort in omnibase_core.protocols.runtime (async dispatch(request) -> result), with unit tests for both models and a typed protocol test -- falsifier: in a fresh venv holding only R-core-1 from the package index, from omnibase_core.models.delegation.wire import ModelDelegationDispatchRequest, ModelDelegationDispatchResult or from omnibase_core.protocols.runtime import ProtocolDelegationDispatchPort raises ImportError, or the keyword-only negative stub in tests/unit/protocols/runtime/test_protocol_delegation_dispatch_port.py passes mypy --strict
      - id: "AC14"
        statement: |-
          AC14: omnibase_core declares no omnibase-compat dependency and no omnibase_compat module defines either dispatch model -- falsifier: uv pip show omnibase-core at R-core-1 lists omnibase-compat, or grep -rn "class ModelDelegationDispatch" omnibase_compat/src returns a hit
