schema_version: "1.0.0"
ticket_id: "OMN-18691"
title: "The fleet's CI bus moves to a dedicated broker on its own compose project"
summary: >
  The fleet's CI bus was the DEV LANE's own Redpanda: omnimarket config/ci_bus_lanes.yaml declared the
  CI bus as lane `dev`, whose broker is the Redpanda of compose project `omnibase-infra`. That lane is
  a fully mutable test platform the deploy agent rebuilds on nearly every runtime-affecting merge, so
  every rebuild was a window in which the fleet could not publish evidence. On 2026-09-18 the agent's
  compose-up watchdog (a hardcoded 300s per-phase ceiling) fired under host load1 ~28/32 and killed the
  lane's recreate partway through; redpanda was left REMOVED and every Receipt Gate in the org was red
  for ~35 minutes, on pull requests that had nothing to do with the dev lane. Operator ruling, in-session
  2026-09-18T14:21:54Z, verbatim "dedicated broker is fine" (omni_home docs/tracking/ROLLING_WORK_LEDGER.md:4277).
  NOT adopted in the same ruling: the stability-test lane's Redpanda, which is where the stability-proven
  promotion premise is resolved from on the compose path. This is PHASE 1, repository work only. omnibase_infra
  adds the compose project `omninode-ci-bus` (one Redpanda on 21092/21644, its own network and volume,
  and three one-shots for topic creation, the SCRAM principal and the SASL flip), a lane-census entry,
  and an isolation ratchet over the four Docker namespaces plus host ports. omnimarket declares the `ci-bus`
  lane with its transport and adds a ratchet refusing a runtime lane's broker for the CI bus. It covers
  the PUBLISH leg only, stated in both PRs rather than implied: every consumer of every CI-bus topic declares
  runtime_profiles [effects] and is hosted by omninode-runtime-effects, a dev-lane service wired to one
  hardcoded bootstrap, and the runtime kernel cannot consume from two buses. A publish stops failing and
  a command waits durably through a rebuild; handling still waits for the consumer. The cutover therefore
  attaches a consumer BEFORE repointing any publisher, and an interlock test fails the moment a workflow
  selects the new lane. Host bring-up is phase 2 and needs its own OPERATOR-CONSENT row naming the `ci-bus-publisher`
  credential (Operating Rule 22), which no agent can issue; nothing on the lab host was mutated by this
  change, and all host contact was read-only.
is_seam_ticket: false
