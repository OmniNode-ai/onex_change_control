---
schema_version: "1.0.0"
ticket_id: "OMN-15300"
title: "OCC observation-append producer emits a gate-bindable, yamlfmt-clean PR"
summary: >-
  node_occ_observation_effect opened one OCC PR per observation append with no extractable ticket reference,
  so validate_occ_merge_eligibility returned missing_ticket and none of them could merge. The observation
  store's write path was dead for ~24h. Fixes the emitted PR shape (closing-keyword and Evidence-Ticket
  lines in the body, token in title and commit subject), makes the rendered YAML yamlfmt-stable against
  this repo's .yamlfmt, and stops duplicate emission at its workflow-level driver.
# The matched seams are the merge-eligibility validator's input format
# (_extract_ticket_ids body-vs-title precedence, _ticket_bound_to_pr binding axes) and this
# repo's .yamlfmt settings. interfaces_touched has a fixed vocabulary of
# events/topics/protocols/envelopes/public_api and none of those describe a validator input
# format, so it is left empty rather than filled with a value that does not apply.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "omnimarket PR #1928 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnimarket-pr-1928"
    description: "PR #1928 on OmniNode-ai/omnimarket — producer PR-shape and renderer fix."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo ${REPO} --json number,state"
  - id: "dod-OmniNode-ai-omnimarket-pr-1928-ci"
    description: "PR #1928 on OmniNode-ai/omnimarket — product diff scope check."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
  - id: "dod-OmniNode-ai-omnimarket-pr-1928-deploy"
    description: >-
      Deploy-scope probe: reads this repo's dev branch through the GitHub API and requires the drift/occ_observations
      store subtree to be present and non-empty. It is falsifiable in the sense the ratchet asks for —
      its exit status depends on live repo state at a ref, not on text the author wrote — and it goes
      RED if the store surface this change protects is missing. WHAT IT DOES NOT PROVE, stated plainly:
      it does not prove the write path is alive again. The stronger probe for that is a record committed
      under drift/occ_observations after the freeze point (newest landed record before the fix: 2026-07-27T03:58:48Z),
      which reads 0 as of 2026-07-28T05:20Z and by construction cannot go GREEN until the fixed producer
      has merged AND actually run. A pre-merge gate can never assert a post-merge outcome, so that readback
      is carried as the ticket's live-readback acceptance criterion instead of being embedded here as
      a check that would block its own contract PR forever.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/onex_change_control/contents/drift/occ_observations?ref=dev" --jq 'length' | grep -qv '^0$'
