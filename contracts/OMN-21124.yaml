  and accepted by a second lane, dod-closeout-accept-2026-10-16T1445Z-c2, after re-running each check
  at merged dev. The core half merged as omnibase_core#1988 (16cc1ee63) and the spi half as omnibase_spi#382
  (04ae464)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the models are frozen with `extra="forbid"`, and an entry whose `text` does not hash to its `text_sha256` fails validation -- falsifier: a fixture entry with a mismatched hash that validates.
      - id: "AC2"
        statement: |-
          AC2: an entry marked `verbatim_verified: true` without a `source_ref` or a `span` fails validation -- falsifier: such an entry validates.
      - id: "AC3"
        statement: |-
          AC3: the protocol module imports its types from omnibase_core only and the layering check passes -- falsifier: an import from omnimarket, or a layering failure.
      - id: "AC4"
        statement: |-
          AC4: the existing `EnumSelectionReason` members keep their values and order -- falsifier: enum test.
      - id: "AC5"
        statement: |-
          AC5: `ModelContextSourceRequest` refuses construction without `access`, and an `access` without `tenant_id` -- falsifier: either validates.
      - id: "AC6"
        statement: |-
          AC6: `ModelContextSourceResult` carries `has_more`, per-source entry counts and per-leg timings as typed fields, and a response that fails validation yields a typed error status, never an empty `resolved` -- falsifier: a result without those fields validates, or an invalid response becomes an empty result.
evidence_requirements:
  - kind: "tests"
    description: "Focused omnibase_core context-source contract tests and the omnibase_spi layering suite,
      re-run at merged dev."
    command: "uv run pytest -q -p no:randomly tests/unit/models/context/test_model_context_source_contract.py"
