schema_version: "1.0.0"
ticket_id: "OMN-16824"
title: "One semantic for check_type: test_passes"
summary: >-
  The hosted Contract Compliance Check ignored check_value for check_type test_passes and reported whether
  the PR's own CI was green, while node_dod_verify executed check_value and honoured the check's cwd.
  AC1 option (a): the hosted runner now executes the check the same way, honours cwd, and declines loudly
  when a declared cwd cannot be resolved instead of rerouting the command to its own workspace.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Shared cross-runner semantics case table executed against the hosted runner"
    command: "uv run pytest tests/test_omn16824_test_passes_semantics.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-16824-one-semantic-executed"
    description: >-
      AC1/AC3/AC4. Runs the OMN-16824 suite in this repo. It executes the shared cross-runner case table
      (tests/fixtures/check_type_runner_semantics.yaml, checked into omnimarket byte-for-byte and run
      there against node_dod_verify) through the hosted runner, and pins the AC4 regression by execution
      through run_compliance_check itself: with every gh call mocked to report a fully green PR, a contract
      carrying a test_passes entry whose check_value fails returns exit 1, and the discriminating control
      with a passing check_value returns exit 0. It also asserts the runner makes no gh pr checks call
      at all, so the PR-status reading cannot come back by another route.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn16824_test_passes_semantics.py -q"
  - id: "dod-16824-runner-regression-suite"
    description: >-
      AC2. Runs the compliance runner's own suite, which now pins the executed reading of test_passes
      (replacing four tests that pinned the opposite), the bash -o pipefail invocation, and that command
      and test_passes are one runner. Together with the suite above this is the cwd proof: a declared
      cwd is honoured, an unresolvable one is NOT_EVALUATED, and the command demonstrably does not run
      in the workspace instead (the case asserts no file the command would have created exists anywhere).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_contract_compliance_check.py -q"
  - id: "occ-self-bind-pr-7393"
    description: >-
      OCC self-binding for PR #7393, the in-repo PR carrying the fix, the shared case table, and the two
      behaviour-proving legs above. Binds OMN-16824 to that OCC PR by pr_number so eligibility can resolve
      a PASS receipt for the PR itself (OMN-14650).
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 7393 --repo OmniNode-ai/onex_change_control --json number,state,headRefName
