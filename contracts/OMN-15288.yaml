---
schema_version: "1.0.0"
ticket_id: "OMN-15288"
title: "Browser-driven Beta dashboard end-to-end proof harness (five named legs, fail-closed)"
summary: >
  Add the browser-side sibling of the OMN-15256 post-deploy business proof: a Playwright driver plus a
  pure decision engine that assert credentialed login, tenant landing, workflow submission, status progression
  and rendered final text as five independent legs, so a red run names the broken leg. No skip path exists
  anywhere in the harness; a missing credential is exit 2, not a skip.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "The omninode_infra repo-root suite passes with the new decision-engine tests included."
    command: "uv run pytest tests/ -q"
  - kind: "tests"
    description: "ruff lint, ruff format and mypy are clean on the three new files."
    command: "uv run ruff check scripts/beta_dashboard_e2e_proof.py scripts/evaluate_beta_dashboard_proof.py
      tests/scripts/test_evaluate_beta_dashboard_proof.py && uv run mypy scripts/beta_dashboard_e2e_proof.py
      scripts/evaluate_beta_dashboard_proof.py"
  - kind: "manual"
    description: >
      The harness was proven RED against the live staging dashboard before OMN-14938 landed: exit 1 with
      auth_session named as the earliest broken leg. A GREEN run additionally requires OMN-14938 (Infisical
      seeding), OMN-15294 (AUTH_URL/NEXTAUTH_URL repair) and a seeded staging account.
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
