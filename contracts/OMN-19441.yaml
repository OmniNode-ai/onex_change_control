  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a TLA+ model of the handler, the consumer cancel and the reaper emitting for one correlation is committed with a recorded review verdict -- falsifier: TLC on the committed model finds a trace with two terminals for one correlation
      - id: "AC2"
        statement: |-
          AC2: a claimed run with no terminal at its budget plus 60 seconds gets exactly one terminal with cause timeout -- falsifier: a pytest over the reaper with a stalled handler asserting one timeout terminal
      - id: "AC3"
        statement: |-
          AC3: a real terminal arriving after the reaper's is recorded as attempt evidence and no second terminal is published -- falsifier: a pytest racing a late terminal against the reaper asserting one published terminal
      - id: "AC4"
        statement: |-
          AC4: the model and the reaper key on the command (the delivering message id the OMN-18887 claim uses), not the correlation, and the model includes a DLQ replay that keeps the command id and a new command that reuses a correlation -- falsifier: TLC on the committed model finds a trace with two different terminals for one command id, or one where a second command on a shared correlation gets no terminal of its own
      - id: "AC5"
        statement: |-
          AC5: the reaper emits cause no_terminal, never timeout, and never reaps a command that already has a terminal, including a handler timeout terminal from OMN-19619 -- falsifier: a pytest over the reaper with a command already holding a timeout terminal asserting nothing is published Amendment 2026-09-25 (plan review findings F1 and F3, and the fault-injection exercise): wherever AC1 and AC3 say "one correlation", read "one command" (AC4). A command-keyed reaper is what lets a retry on a reused correlation run, as the OMN-18887 regression test requires. AC2's "cause timeout" becomes cause no_terminal (AC5). The core enum documents timeout as the handler cancel's member and no_terminal as the reaper's, and OMN-19619 now emits timeout from the handler, so a reaped run is by definition one that got no terminal at all. The model attached on 2026-09-25 must be re-checked against AC4. Additional prerequisites for the build: OMN-19558 AC1 and AC2 (the deadline is not shorter than the budget, and a replay keeps its message id), OMN-19619, and OMN-19561 AC3 (a no-op write must not defer the bound).
