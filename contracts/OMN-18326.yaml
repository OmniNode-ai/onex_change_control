    description: >-
      AC1: read-only readback on the onex-lab lane (k3s namespace onex-dev on 192.168.86.201). The committed
      converge Job (omnibase_infra k8s/onex-lab/converge-topology-logins-job.yaml, run by apply_lab_lane.sh)
      logs a converged, attributes-unchanged verdict for omninode_runtime and tenant_projection_writer,
