      control is the tenant_registry_mirror count.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 bash -s <<'LAB'
          sudo -n k3s kubectl -n onex-dev exec deploy/onex-lab-postgres -- psql -U postgres -d omnidash_analytics -At -F'|' -c "SELECT e.correlation_id::text, e.\"timestamp\"::text, e.tenant_id::text, e.writer_identity, to_timestamp(s.\"latestEventAt\")::text, s.\"totalDelegations\" FROM delegation_events e JOIN projection_delegation_summary s ON s.tenant_id = e.tenant_id WHERE e.tenant_id = 'cacacbb1-0e64-4521-9712-ed02ee799907' AND e.\"timestamp\" > '2026-09-14' ORDER BY e.\"timestamp\" DESC LIMIT 1" -c "SELECT 'positive-control tenant_registry_mirror', count(*) FROM tenant_registry_mirror"
