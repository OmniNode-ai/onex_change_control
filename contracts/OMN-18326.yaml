    description: >-
      PR #4623 on OmniNode-ai/omnibase_infra, hand-authored companion (OMN-15247); occ-autobind declined
      it (NO_RED_DERIVABLE_CHECK). #4623 removes a payload _envelope_timestamp copied from the payload
      before validated envelope time is injected, so a payload timestamp cannot bypass the authoritative
      event-time refusal. The check runs the handler-wiring DB-injection test file, whose callback tests
      cover valid envelope time winning and absent, naive and wrong-type envelope times leaving no injected
      key. It is a unit-level proof at the PR head and does not claim the lab image exercise or fresh
      submission row readback.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/runtime/auto_wiring/test_handler_wiring_db_injection.py
