      - id: "AC3"
        statement: |-
          AC3: capacity is measured in tickets by default and an unestimated ticket never costs zero in points mode -- falsifier: python3 -m pytest plugins/omni/skills/sprint-roll/tests/test_sprint_roll.py -k velocity_or_unestimated with the median imputation removed
      - id: "AC4"
        statement: |-
          AC4: an unmapped ticket takes its criterion from its own Gate line, and a weak text overlap assigns nothing and names the near miss instead -- falsifier: python3 -m pytest plugins/omni/skills/sprint-roll/tests/test_sprint_roll.py -k overlap_or_declared with STRONG lowered to 4
      - id: "AC5"
        statement: |-
          AC5: --apply writes a manifest entry before each mutation and --undo restores every prior value -- falsifier: interrupt an --apply after the first write and run --undo on the partial manifest; the moved ticket returns to its original sprint
      - id: "AC6"
        statement: |-
          AC6: the suite runs in the plugin repo CI -- falsifier: python3 -m pytest tests/test_skill_dir_suites.py with the sprint-roll entry removed from SUITES
