---
schema_version: 1.0.0
ticket_id: OMN-20224
title: Bound evidence for OMN-20224 -- automated onboarding verification on a bare Mac
summary: 'Seven acceptance criteria, each bound to one readback taken on a vanilla macOS Tart clone on
  2026-10-02 against lab-onboarding.sh at omniclaude 859dd721bf14 (the merge of #2488). This ticket has
  no product PR of its own: it is the verification OMN-20150 leaves as decided later, so every criterion
  rests on an observation receipt rather than a merged diff.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: The acceptance criteria this ticket's author declared, transcribed from the ticket body.
      The ticket body is the source and this block is the copy; each criterion's id is the label the sibling
      binds_ac entry claims.
    acceptance:
      - id: AC1
        statement: 'AC1: A scripted run of the onboarding script on a bare Mac or a macOS VM completes
          through to one delegation answered by the developer''s own provider (OpenRouter or Gemini),
          with the transcript attached -- falsifier: a run that stops before the delegation, a receipt
          whose endpoint is not one of that provider''s catalogue URLs, or no transcript attached'
      - id: AC2
        statement: 'AC2: The script runs under the stock macOS /bin/bash 3.2 and the transcript of that
          run is attached -- falsifier: a bash 3.2 run that errors, run with /bin/bash --version showing
          3.2'
      - id: AC3
        statement: 'AC3: The preflight negative control on a machine below the Mode 1 floor exits having
          installed nothing and leaves no new file under HOME, /opt/homebrew, /usr/local or /Applications
          -- falsifier: a file-tree diff before and after the control run that lists any new file'
      - id: AC4
        statement: 'AC4: A second run of the script on the set-up machine skips completed phases and changes
          no installed tool version -- falsifier: a version diff of brew, uv and python before and after
          the second run that differs'
      - id: AC5
        statement: 'AC5: A network-failure injection on one phase makes the script attempt it at least
          3 times, 5 to 10 seconds apart, before that phase fails -- falsifier: a log of the injected
          phase showing fewer than 3 attempts'
      - id: AC6
        statement: 'AC6: The verified run leaves nothing that connects to the lab: no Tailscale installed
          by the run, no lane identity in `~/.onex`, and no lab host name in any file the run wrote --
          falsifier: a post-run check that finds any of the three'
      - id: AC7
        statement: 'AC7: The verification fails when the developer''s key is bad: a control run with an
          invalid provider key reports the key or delegation phase as failed, with onex''s own refusal
          -- falsifier: the control run with an invalid key still reporting all phases passed'
evidence_requirements:
  - kind: manual
    description: 'Seven readbacks on a vanilla macOS clone: the full run to a provider-answered delegation,
      the stock-bash banner, the below-floor control plus a file-tree diff, the second-run version diff,
      the injected-failure retry log, the no-lab isolation check and the invalid-key control.'
    command: ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "bash <(curl -fsSL https://raw.githubusercontent.com/OmniNode-ai/omniclaude/dev/plugins/onex/skills/_bin/lab-onboarding.sh)"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: ac1-bare-mac-run-to-a-provider-answered-delegation
    description: AC1 -- the scripted run on a vanilla macOS clone completes six phases and reaches one
      delegation answered by the developer's own Gemini key. The falsifier wanted a run that stopped before
      the delegation, a receipt whose endpoint is not the provider's own catalogue URL, or no transcript;
      the transcript is held and the receipt names the Google endpoint.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "bash <(curl
          -fsSL https://raw.githubusercontent.com/OmniNode-ai/omniclaude/dev/plugins/onex/skills/_bin/lab-onboarding.sh)"
    binds_ac:
      - AC1
    ac_bindings:
      - label: AC1
        criterion_hash: f9ff69996ffd765a13808f79fe47d4e61113b913796f3ac2c62a6c2aa44a2490
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac2-run-executes-under-stock-bash-3-2
    description: AC2 -- the same run executed under the stock macOS /bin/bash 3.2 and errored nowhere,
      with the interpreter banner captured at the head of the transcript. This criterion was FALSIFIED
      on the first attempt and is what omniclaude#2488 fixes.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "/bin/bash --version
          | head -1; bash <(curl -fsSL https://raw.githubusercontent.com/OmniNode-ai/omniclaude/dev/plugins/onex/skills/_bin/lab-onboarding.sh)"
    binds_ac:
      - AC2
    ac_bindings:
      - label: AC2
        criterion_hash: ebb3f5b7165f7a9dd725298b004299144cea4d09bae7a9ac9230f71ee4028dd5
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac3-below-floor-control-installs-nothing
    description: AC3 -- the preflight negative control on a clone genuinely below the Mode 1 RAM floor
      refuses, exits 3 and leaves no new file under HOME, /opt/homebrew, /usr/local or /Applications.
      Below the floor by the VM's real RAM, not through the ONBOARD_TEST_RAM_GB seam.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.9 "bash <(curl
          -fsSL https://raw.githubusercontent.com/OmniNode-ai/omniclaude/dev/plugins/onex/skills/_bin/lab-onboarding.sh)"   #
          4 GB clone; file-tree snapshot over the four trees before and after'
    binds_ac:
      - AC3
    ac_bindings:
      - label: AC3
        criterion_hash: 99948c7c6e9d36d1cb1617e343767000e497f7e23108d12e69dd26395d9162d1
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac4-second-run-moves-no-tool-version
    description: AC4 -- a second run on the machine AC1 set up skips completed phases and changes no installed
      tool version. The falsifier is a version diff that differs; brew, uv, gh, jq and python are byte-identical
      across the run.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "for t in brew
          uv gh jq python; do $t --version; done"   # before and after the second run'
    binds_ac:
      - AC4
    ac_bindings:
      - label: AC4
        criterion_hash: b368e4d0ccd65978675e28baa62bc78e10694bb4df15d6c566c7f50f5dab94c5
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac5-network-failure-retries-three-times-in-window
    description: AC5 -- a real network-failure injection makes the script attempt the failing step three
      times, 5 to 10 seconds apart, before the phase fails. Injected by blackholing raw.githubusercontent.com
      in the guest's /etc/hosts, which is a connect failure rather than a seam.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "printf '0.0.0.0
          raw.githubusercontent.com' | sudo tee -a /etc/hosts && bash ./lab-onboarding.sh"
    binds_ac:
      - AC5
    ac_bindings:
      - label: AC5
        criterion_hash: ab563a13aca5c5a94460544099ec4c7b9cf97985c7ed06087dcf802d45d5551a
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac6-verified-run-leaves-nothing-reaching-the-lab
    description: 'AC6 -- the verified run leaves nothing that connects to the lab: no Tailscale the run
      installed, no lane identity in ~/.onex, and no lab host name in any file the run wrote. All three
      are the falsifier and none of the three is present.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.8 "command -v
          tailscale; ls ~/.onex; grep -rIE 'ts[.]net|100[.][0-9]+[.]|lab' ~/.zshrc ~/.zprofile ~/.omninode
          ~/.onex_state ~/.config"
    binds_ac:
      - AC6
    ac_bindings:
      - label: AC6
        criterion_hash: 77441c450f37ccd3b1b382cbfa770c3830df90560a1626c190bd4c03f7df5b00
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: ac7-invalid-key-control-fails-on-onex-refusal
    description: 'AC7 -- the verification fails when the developer''s key is bad: a control run with a
      syntactically plausible but invalid Gemini key reports the key phase as failed, carrying onex''s
      own refusal. The falsifier is the control still reporting all phases passed.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'ssh -tt -i vmkey -o StrictHostKeyChecking=no jakebrower@192.168.64.10 "bash <(curl
          -fsSL https://raw.githubusercontent.com/OmniNode-ai/omniclaude/dev/plugins/onex/skills/_bin/lab-onboarding.sh)"   #
          answering the provider menu with an invalid Gemini key'
    binds_ac:
      - AC7
    ac_bindings:
      - label: AC7
        criterion_hash: c82a50c6d895c73f0c7dbfe5ccba6075d28b558049805b2e5ca7f47f17f81615
        proposed_by: omn20224-bare-mac-walk
        accepted_by: fc04d95f-0fcf-4a47-8ac2-26ee573a7cc3
        accepted_at: '2026-10-02T13:12:38Z'
  - id: script-version-the-walk-was-taken-against
    description: 'The artefact every readback above was taken against, observed on a hosted runner rather
      than asserted. Reads lab-onboarding.sh out of omniclaude at 859dd721bf14 -- the merge of #2488 --
      and passes only when the braced expansion is present and the unbraced one is gone. It does NOT prove
      any criterion: it pins the script version, and binds_ac is deliberately empty because a file read
      cannot stand in for a walk. FALSIFIABLE: at that commit''s parent the unbraced form is what is there,
      so this check goes red, which is exactly how AC2 was falsified on the first attempt.'
    source: generated
    checks:
      - check_type: command
        check_value: s="$(mktemp)" && gh api "repos/OmniNode-ai/omniclaude/contents/plugins/onex/skills/_bin/lab-onboarding.sh?ref=859dd721bf143f6452e019194704fee4faea5ac2"
          --jq .content | base64 -d > "$s" && grep -Fq 'Installing ${f}' "$s" && ! grep -Fq 'Installing
          $f' "$s"
