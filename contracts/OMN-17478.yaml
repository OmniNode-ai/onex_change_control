  - id: "dod-omn17478-ac5-concurrency-collision-closed"
    description: >
      AC5 — a candidate delivery and an onex-api build on `dev` can no longer cancel each other. `deploy-onex-staging.yml`
      now declares `cancel-in-progress: false`, so a run that has started always finishes and can never
      be killed part-way through a `kubectl apply` / `kubectl set image` sequence, which is how the plane
      was left half-converged with nothing red saying so. One group per ref is kept deliberately: onex-dev
      is a single mutable resource, and two concurrent deploys would be worse than either cancellation.
      The criterion is disjunctive and its second half is also present — an `Announce a superseded deploy`
      step, so a supersession stops reading as an ordinary failure. Check 2 asserts the old value is GONE
      rather than merely that the new one appears, so a file carrying both cannot pass. Negative control
      (check 3): the pre-fix tree d77f82da91621dbec09263023a01ef2251d27b18 carries `cancel-in-progress:
      true`, which is the exact configuration this ticket names as the defect. The final check greps a
      committed receipt carrying both concurrency blocks read verbatim at their two pinned trees.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC5"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'cancel-in-progress: false'
      - check_type: "command"
