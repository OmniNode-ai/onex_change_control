  - id: "dod-omn17478-ac5-concurrency-collision-closed"
    description: >
      AC5 — a candidate delivery and an onex-api build on `dev` can no longer cancel each other. `deploy-onex-staging.yml`
      now declares `cancel-in-progress: false`, so a run that has started always finishes and can never
      be killed part-way through a `kubectl apply` / `kubectl set image` sequence, which is how the plane
      was left half-converged with nothing red saying so. One group per ref is kept deliberately: onex-dev
      is a single mutable resource, and two concurrent deploys would be worse than either cancellation.
      The criterion's second, disjunctive half is also present — an `Announce a superseded deploy` step
      so a supersession stops reading as an ordinary failure. Check 2 asserts the old value is GONE rather
      than merely that the new one appears, so a file carrying both cannot pass. Negative control (check
      3): the pre-fix tree d77f82da91621dbec09263023a01ef2251d27b18 carries `cancel-in-progress: true`,
      which is the configuration this ticket names as the defect.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC5"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'cancel-in-progress: false'
      - check_type: "command"
        check_value: |-
          test "$(gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'cancel-in-progress: true')" = "0"
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=d77f82da91621dbec09263023a01ef2251d27b18 --jq '.content' | base64 -d | grep -c 'cancel-in-progress: true'
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'Announce a superseded deploy'
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'group: deploy-onex-staging-'
  - id: "dod-omn17478-ac6-fail-closed-enforcement-gate"
    description: >
      AC6 — enforcement, not detection. The freshness assertion is a terminal post-deploy step inside
      the deploy job of `deploy-onex-staging.yml`, not an advisory sweep: it carries no `continue-on-error`
      and no `|| true` on any executable line, and it fails CLOSED — an unreadable Deployment list and
      an unreadable pod list are each an `exit 2` refusal rather than a pass, so a gate that cannot see
      the plane has not passed, it has not run. Its refusal wording is "refusing to report a green deploy".
      Non-vacuity is proven in both directions, which is the whole point of binding it twice: the step
      concluded `failure` on job 102167526719 against the real plane (check 5), and `success` on the green
      job 102658770595 (check 6). A gate that only ever passes and a gate that only ever fails are each
      unusable, and one reading alone cannot tell them apart.
    source: "manual"
    status: "verified"
    binds_ac:
      - "AC6"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omninode_infra/contents/.github/workflows/deploy-onex-staging.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0 --jq '.content' | base64 -d | grep -c 'Post-deploy runtime image freshness gate'
