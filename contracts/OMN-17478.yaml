      the Deployment spec, because in the incident the spec, the resolved digest and the running digest
      all agreed perfectly — on an image built 2026-08-22 — while the writer's `command:` started a package
      that first appeared in the source tree on 2026-08-31. Its finding kind is `image_older_than_code`.
      RED-first is proven live rather than asserted: the same step concluded `failure` against the real
      onex-dev plane on job 102190703245. Negative control (check 5): at the pre-fix tree d77f82da91621dbec09263023a01ef2251d27b18
      the workflow contains ZERO occurrences of the step, so the four positive readings above are the
      change and not a pre-existing surface. Reads are pinned to c5904e7634346e99281ada31492aa55e2059cfa0,
      which is both `origin/dev` and the head of the two green runs bound under AC3. Supersedes nothing
      — the earlier autobind items on this contract carry no `binds_ac` and are left byte-unchanged.
