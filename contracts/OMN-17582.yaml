---
schema_version: "1.0.0"
ticket_id: "OMN-17582"
title: "onex_change_control: bounded online resolver + offline UNEVALUATED mode + preflight integration"
summary: >-
  In onex_change_control, adds the CI-facing bounded cross-repository receipt-subject resolver and OCC
  preflight integration. The protocol/public API boundary validates immutable contract and receipt-subject
  digests, exact same-repository PR and revision identity, merged ancestry, and allowlisted GitHub calls.
  Offline pre-commit remains network-free and returns UNEVALUATED only; online failures are fail-closed.
  This contract makes no receipt PASS, product-SHA reachability, deployment, or live GitHub smoke claim.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "protocols"
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: >-
      Mock-only resolver fixtures exercise offline UNEVALUATED/no-network behavior; strict subject and
      digest validation; same-repository identity; fork, foreign, malformed, transport, retry, budget,
      and deadline failures; and open versus merged revision handling without a live GitHub API call.
    command: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - kind: "tests"
    description: >-
      Receipt-hardening and CI-summary tests cover receipt-v2 subject digest binding and fail-closed preflight
      integration without treating unavailable omnibase_core schema support as a PASS.
    command: >-
      uv run pytest tests/test_check_receipt_hardening.py tests/ci/test_ci_summary_gate.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-bounded-resolver-threat-matrix"
    description: >-
      Mock-only resolver tests prove canonical allowlist/identity/digest checks, a network-free offline
      UNEVALUATED result, and fail-closed bounded online resolution. They do not attest a live GitHub
      result or a product receipt PASS.
    source: "linear"
    linear_dod_text: >-
      Offline mode is zero-network UNEVALUATED only; online resolution uses fixed repository-qualified
      calls, exact repository/ref/SHA identity, bounded calls/retry/deadline, and never turns unavailable
      evidence into PASS.
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/validation/test_cross_repo_subject.py -q"
  - id: "dod-receipt-v2-preflight-binding"
    description: >-
      Receipt-hardening and CI-summary tests prove receipt-v2 nested subject digest binding and fail-closed
      preflight integration. The evidence is local test behavior, not a self-authored PASS receipt.
    source: "linear"
    linear_dod_text: >-
      OCC preflight validates each PASS receipt and cross-repo subject against the immutable snapshot;
      a contract or artifact digest mismatch is rejected.
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/test_check_receipt_hardening.py tests/ci/test_ci_summary_gate.py -q
