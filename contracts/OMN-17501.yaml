---
schema_version: "1.0.0"
ticket_id: "OMN-17501"
title: "Bounded, fail-closed receipt commit SHA resolution"
summary: >-
  Establishes bounded commit-SHA resolution for receipt hardening. This is a default-deny governance contract:
  it makes no receipt-repair, pull-request, deployment, or runtime-verification claim. The pre-commit
  hook checks only the NUL-delimited staged change surface in one serial resolver session; it intentionally
  does not redefine ``pre-commit --all-files`` as a corpus proof. Whole-corpus reconciliation is a distinct,
  operator-invoked bounded inventory command that writes a resumable report below the system temporary
  directory and stops truthfully on its REST budget, timeout, or rate limit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: >-
      Mock-only focused controls cover typed reachable/missing/invalid/unavailable outcomes, one local
      index, remote cache and budget/rate/timeout stop, 10,000 repeated claims, and NUL-delimited path
      handling without live GitHub API access.
    command: >-
      uv run pytest tests/unit/validation/test_commit_sha_resolver.py tests/test_check_receipt_hardening.py
      -q
  - kind: "tests"
    description: >-
      The static wiring probe proves pre-commit uses staged NUL-safe serial mode and CI supplies one NUL-delimited
      changed-file input. A bounded corpus reconciliation remains explicit: uv run python scripts/validation/check_receipt_hardening.py
      --commit-sha-inventory "${TMPDIR:-/tmp}/OMN-17501-commit-sha-inventory.json" --commit-sha-rest-budget
      64.
    command: >-
      uv run python scripts/validation/check_receipt_hardening.py --check-commit-sha-wiring
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-bounded-resolver-mock-controls"
    description: >-
      Hosted-and-local mock-only controls prove typed resolver outcomes, one local index, cache/budget/timeout/rate-limit
      stopping, 10,000 repeated claims, NUL paths, and the explicit bounded inventory's one resolver session.
      No live GitHub API result, receipt repair, deployment, or PR state is claimed.
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/unit/validation/test_commit_sha_resolver.py tests/test_check_receipt_hardening.py
          -q
  - id: "dod-staged-and-inventory-wiring"
    description: >-
      Static wiring proves fast pre-commit validation remains staged and serial while CI passes one NUL-delimited
      changed surface. The separate --commit-sha-inventory command is the only bounded corpus workflow;
      it records incomplete state instead of treating an unavailable resolver as a receipt defect.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python scripts/validation/check_receipt_hardening.py --check-commit-sha-wiring
        cwd: "${OMNI_HOME}/omni_worktrees/OMN-17501/onex_change_control"
