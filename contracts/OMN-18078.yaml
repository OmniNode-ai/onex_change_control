---
schema_version: "1.0.0"
ticket_id: "OMN-18078"
title: "Record immutable CI check-execution history in PR lifecycle inventory"
summary: >-
  Add opt-in, immutable GitHub check-execution history to the existing PR lifecycle inventory compute
  node. The change preserves the current latest-result gating path and adds no topic, runtime activation,
  hook, transport, or deployment action.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Focused golden-chain and real bus coverage validate opt-in immutable history collection,
      requested-state provenance, and failure behavior."
    command: "See dod-check-execution-history-behavior receipt."
  - kind: "ci"
    description: "The immutable product diff is limited to the lifecycle inventory contract, metadata,
      model, handler, focused golden-chain test, real bus-coverage integration test, and the required
      0.4.44 release identity files."
    command: "See dod-product-head-and-scope receipt."
  - kind: "manual"
    description: "Compute-only source evidence verifies the new collector at the immutable product head;
      no runtime activation or deployment is claimed."
    command: "See dod-compute-only-deploy-source receipt."
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-check-execution-history-behavior"
    description: >-
      Focused golden-chain and real bus-coverage tests at the exact product commit prove the opt-in immutable
      check-execution history behavior and requested-state provenance. This is local Done-gate evidence
      and does not claim hosted execution, runtime activation, or internal validator-firing counts.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: |-
          bash -euo pipefail <<'PROOF'
          expected_sha="b13eea2ff64c243ad3c9ee799ed35c780fb70ffc"
          actual_sha="$(gh api "repos/OmniNode-ai/omnimarket/commits/$expected_sha" --jq .sha)"
          test "$actual_sha" = "$expected_sha"
          target_root="$(mktemp -d "${TMPDIR:-/tmp}/omn-18078-proof.XXXXXX")"
          target="$target_root/product"
          cleanup() {
            if test -e "$target/.git"; then
              git worktree remove --force "$target"
            fi
            rmdir "$target_root"
          }
          trap cleanup EXIT HUP INT TERM
          git worktree add --detach "$target" "$actual_sha"
          (
            cd "$target"
            test "$(git rev-parse HEAD)" = "$actual_sha"
            env -u PYTHONPATH -u VIRTUAL_ENV UV_CACHE_DIR=/tmp/omn-18078-occ-uv-cache uv run --locked pytest tests/test_golden_chain_pr_lifecycle_inventory_compute.py tests/integration/node_pr_lifecycle_inventory_compute/test_pr_lifecycle_inventory_bus_coverage.py -q
          )
          PROOF
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-product-head-and-scope"
    description: >-
      The remote product head has exactly the lifecycle inventory contract, metadata, model, handler,
      focused golden-chain test, real bus-coverage integration test, and 0.4.44 release identity files
      relative to its immutable PR base. The check also verifies whitespace and does not claim deployment
      or runtime activation.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          bash -euo pipefail <<'PROOF'
          expected_sha="b13eea2ff64c243ad3c9ee799ed35c780fb70ffc"
          base_sha="86513e25dec2e890bd733b4e519f6b1b0c9daba5"
          actual_sha="$(gh api "repos/OmniNode-ai/omnimarket/commits/$expected_sha" --jq .sha)"
          test "$actual_sha" = "$expected_sha"
          test "$(git merge-base "$base_sha" "$actual_sha")" = "$base_sha"
          expected_paths="$(printf '%s\n' \
            pyproject.toml \
            src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/contract.yaml \
            src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/handlers/handler_pr_lifecycle_inventory.py \
            src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/metadata.yaml \
            src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/models/model_pr_lifecycle_inventory.py \
            tests/integration/node_pr_lifecycle_inventory_compute/test_pr_lifecycle_inventory_bus_coverage.py \
            tests/test_golden_chain_pr_lifecycle_inventory_compute.py \
            uv.lock)"
          test "$(git diff --name-only "$base_sha"..."$actual_sha")" = "$expected_paths"
          git diff --check "$base_sha"..."$actual_sha"
          printf 'PASS: remote product SHA, immutable base, eight declared paths, and whitespace check matched\n'
          PROOF
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-compute-only-deploy-source"
    description: >-
      Hosted, compute-only source-presence evidence binds the immutable product head to the opt-in all-history
      check-execution collector, requested-state provenance, and strict total-count validation. It does
      not claim behavior correctness, runtime activation, deployment, or authoritative internal validator-firing
      counts; local behavior is proven separately.
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: |-
          bash -euo pipefail <<'PROOF'
          expected_sha="b13eea2ff64c243ad3c9ee799ed35c780fb70ffc"
          actual_sha="$(gh api "repos/OmniNode-ai/omnimarket/commits/$expected_sha" --jq .sha)"
          test "$actual_sha" = "$expected_sha"
          handler_file="$(mktemp "${TMPDIR:-/tmp}/omn-18078-handler.XXXXXX")"
          model_file="$(mktemp "${TMPDIR:-/tmp}/omn-18078-model.XXXXXX")"
          cleanup() {
            rm -f "$handler_file"
            rm -f "$model_file"
          }
          trap cleanup EXIT
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/handlers/handler_pr_lifecycle_inventory.py?ref=$actual_sha" --jq .content | base64 -d > "$handler_file"
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_lifecycle_inventory_compute/models/model_pr_lifecycle_inventory.py?ref=$actual_sha" --jq .content | base64 -d > "$model_file"
          grep -Fq 'if include_check_execution_history:' "$handler_file"
          grep -Fq 'check_execution_history_requested=include_check_execution_history' "$handler_file"
          grep -Fq 'check-runs?filter=all' "$handler_file"
          grep -Fq 'isinstance(total, bool)' "$handler_file"
          grep -Fq 'check_execution_history_requested: bool = Field(' "$model_file"
          grep -Fq 'default=False' "$model_file"
          printf 'PASS: immutable product source retains opt-in all-history collection and records requested history state\n'
          PROOF
  - id: "occ-self-bind-pr-8796"
    description: >-
      Observed initial identity for OCC companion PR #8796. This records the PR number, branch, base,
      and initial published evidence commit; it does not assert that the follow-on self-bind commit remains
      the PR head.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          bash -euo pipefail <<'CHECK'
          gh pr view 8796 --repo OmniNode-ai/onex_change_control --json number,state,headRefName,headRefOid,baseRefName --jq 'if (.number == 8796 and .state == "OPEN" and .headRefName == "jonah/omn-18078-check-execution-history-occ" and .headRefOid == "d822e027e627b963ee7200fdfc458609650e7ca6" and .baseRefName == "dev") then ([.number, .state, .headRefName, .headRefOid, .baseRefName] | @tsv) else error("OMN-18078 OCC self-binding metadata mismatch") end'
          CHECK
        cwd: "${OMNI_HOME}/onex_change_control"
