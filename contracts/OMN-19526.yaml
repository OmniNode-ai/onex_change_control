          mrows=[r for r in mat if len(r)>=7 and (r[1].startswith('`') or r[0]=='**all**')]
          if len(mrows)<3: fails.append('AC1: matrix table not found')
          for r in mrows:
              k='*' if r[0]=='**all**' else key(r[1]); c=cnt[k]
              want=(int(r[3]),int(r[4]),int(r[5]),int(r[6]))
