          print('AC2 failure rows checked:',len(ftab))
          W={'zero':0,'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'thirty':30,'forty':40,'fifty':50,'sixty':60,'seventy':70}
          TENS=r'\b(twenty|thirty|forty|fifty|sixty|seventy)[- ](one|two|three|four|five|six|seven|eight|nine)\b'
          def nums(t):
              s=set(int(x) for x in re.findall(r'(?<![\w.-])\d+(?![\w])',t.replace(',','')))
              for m in re.finditer(TENS,t.lower()): s.add(W[m.group(1)]+W[m.group(2)])
