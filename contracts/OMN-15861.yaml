title: "Projection-confirmed durable outbox: EventBus.publish returns a durability coordinate"
summary: >-
  Infra half of OMN-15861. EventBusKafka.publish returned None and discarded the
  broker's record_metadata partition/offset to a debug log, so no caller could
  obtain a durability coordinate -- while the omnimarket durable outbox acked on
  the publish call not raising. This companion binds evidence for
  omnibase_infra#2738, which returns a typed ModelPublishReceipt from publish,
  adds the ProtocolReadbackSource / ProtocolConfirmationStrategy confirmation
  seam (UNKNOWN fails closed), and adds a real cross-boundary regression test
  driving producer -> receipt -> independent readback -> ack decision.
