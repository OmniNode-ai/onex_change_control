  - id: "ac1-live-probe-tenant-attrs-admin-only"
    description: >-
      AC1 binding. Durable live evidence: SSM command ecce41da-686e-45cf-b79e-2bf762f6e50c
      queried the live omninode realm user-profile via Keycloak Admin REST API (cluster IP
      10.43.236.1:80) on 2026-09-10 ~21:40Z. Result: tenant_id, tenant_slug, principal_id
      all returned permissions.view=["admin"] permissions.edit=["admin"]. No user-role edit
      permission exists. Raw response saved at claude-planning-docs/OMN-17812/ac1-raw-response.json.
      Corroborating check reads desired-user-profile.json at the PR #3420 merge commit
      (a382a46a) and asserts the same constraint is durable in the repository desired-state.
    source: "manual"
    status: "verified"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omnibase_infra/contents/docker/keycloak/desired-user-profile.json?ref=a382a46a54d9a96c4bcc248be787adf81788980f" --jq '.content' | base64 -d | python3 -c "
          import sys, json
          profile = json.load(sys.stdin)
          attrs = {a['name']: a for a in profile.get('attributes', [])}
          for name in ['tenant_id', 'tenant_slug', 'principal_id']:
              assert name in attrs, f'FAIL: {name} not declared as managed attribute'
              edit = attrs[name].get('permissions', {}).get('edit', [])
              assert 'user' not in edit, f'FAIL: {name} has user edit permission: {edit}'
          print('AC1 corroboration pass: all three attributes managed, no user-edit permission at merge commit a382a46a')
          "
  - id: "ac2-write-paths-provision-and-invite"
    description: >-
      AC2 binding. Two sanctioned paths write tenant_id, tenant_slug, and principal_id.
      Path A: routers/provision.py::_patch_keycloak_user() via Keycloak Admin REST API (async).
      Path B: alpha_invite.py::_ensure_login_capable() via update_keycloak_user_merge_safe (sync,
      used because _patch_keycloak_user is async and this join is synchronous). Both paths carry
      the OMN-16184 identity echo and the same fail-closed read-back. Both pinned in the
      check_keycloak_user_put_merge_safe allowlist. No other writers assign these three attributes.
      Checks inspect both code paths at the PR #1315 merge commit (8e803ccb).
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omninode_infra/contents/docker/onex-api/routers/provision.py?ref=8e803ccbc5a7ddf2d2de4e8f542ac8cb21d2d07f" --jq '.content' | base64 -d | python3 -c "
          import sys
          lines = sys.stdin.read().splitlines()
          fn = next((i+1 for i, l in enumerate(lines) if 'async def _patch_keycloak_user' in l), None)
          assert fn, 'FAIL: _patch_keycloak_user not found in provision.py'
          body = '\n'.join(lines[fn-1:fn+80])
          for attr in ['tenant_id', 'tenant_slug', 'principal_id']:
              assert attr in body, f'FAIL: {attr} not in _patch_keycloak_user body'
          print(f'AC2 path A pass: _patch_keycloak_user at line {fn} writes all three tenant attributes')
          "
      - check_type: "command"
        check_value: |-
          gh api "repos/OmniNode-ai/omninode_infra/contents/docker/onex-api/alpha_invite.py?ref=8e803ccbc5a7ddf2d2de4e8f542ac8cb21d2d07f" --jq '.content' | base64 -d | python3 -c "
          import sys
          lines = sys.stdin.read().splitlines()
          fn = next((i+1 for i, l in enumerate(lines) if 'def _ensure_login_capable' in l), None)
          assert fn, 'FAIL: _ensure_login_capable not found in alpha_invite.py'
          body = '\n'.join(lines[fn-1:fn+100])
          for attr in ['tenant_id', 'tenant_slug', 'principal_id']:
              assert attr in body, f'FAIL: {attr} not in _ensure_login_capable body'
          assert 'update_keycloak_user_merge_safe' in body, 'FAIL: update_keycloak_user_merge_safe not called in _ensure_login_capable'
          print(f'AC2 path B pass: _ensure_login_capable at line {fn} writes all three via update_keycloak_user_merge_safe')
          "
