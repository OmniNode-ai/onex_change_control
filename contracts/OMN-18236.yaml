---
schema_version: 1.0.0
ticket_id: OMN-18236
title: 'Acceptance semantics for binds_ac: reviewer acceptance and a criterion-revision hash'
summary: |-
  A binds_ac claim now has to name a criterion the ticket actually has, and a
  binding record is pinned to the revision it was accepted against.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
evidence_requirements:
  - kind: tests
    description: |-
      A claim naming a criterion the ticket does not have, and a binding pinned
      to a criterion that has since been rewritten, each fail the gate; the
      rewritten case is green again once the binding is re-accepted against the
      current text.
    command: uv run pytest tests/test_omn_18236_ac_binding_acceptance.py -q
  - kind: ci
    description: |-
      The gate is wired both ways in the same change: a pre-commit hook for the
      rules provable without a ticket body, and an unconditional CI job for the
      rules that need one.
    command: uv run pre-commit run check-ac-binding-acceptance --all-files
  - kind: ci
    description: 'PR #2505 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
  - kind: tests
    description: 'Behavior proof for PR #2505 on OmniNode-ai/omnimarket, derived from the PR''s own diff:
      the test target(s) it adds or changes. Bound as dod_evidence item `dod-occ-diff-derived-behavior-proof`,
      executed at cwd `${OMNI_HOME}/omnimarket`.'
    command: uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18236_ac_bindings_field_accepted.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: ac1-unknown-criterion-and-stale-hash-both-fail
    description: |-
      AC1. An item declaring a criterion the ticket does not have fails the
      gate, and a binding pinned to a criterion that has since been rewritten
      fails it too and is green again once re-accepted. Proven by the RED/GREEN
      units, which include a byte-identical contract passing against the
      original ticket text and failing against the rewritten one -- only the
      ticket moves between the two cases.
    source: manual
    status: verified
    binds_ac:
      - AC1
    ac_bindings:
      - label: AC1
        criterion_hash: 9d006777c2e97aabd867d0c48c23fac73e0608770843ba66a24fcd093b73080f
        accepted_by: jonahgabriel
        accepted_at: '2026-09-12T21:00:00Z'
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_18236_ac_binding_acceptance.py::TestUnknownCriterion
          tests/test_omn_18236_ac_binding_acceptance.py::TestStaleHash -q
  - id: precommit-gate-is-wired-in-this-change
    description: |-
      The rules provable without a ticket body run as the
      check-ac-binding-acceptance pre-commit hook over every ticket contract.
      Detection without enforcement was the failure mode this whole phase
      exists to remove.
    source: manual
    status: verified
    checks:
      - check_type: grep
        check_value: 'grep -q ''id: check-ac-binding-acceptance'' .pre-commit-config.yaml'
  - id: ci-gate-is-wired-in-this-change
    description: |-
      The rules that need a ticket body run as the unconditional
      Acceptance-Criterion Binding Gate CI job, which also executes the
      pre-commit counterpart against the same entrypoint. Detection without
      enforcement was the failure mode this whole phase exists to remove.
    source: manual
    status: verified
    checks:
      - check_type: grep
        check_value: grep -q 'ac-binding-acceptance:' .github/workflows/ci.yml
  - id: unreachable-ticket-is-red-not-a-skip
    description: |-
      A ticket body that cannot be read is RED. A gate that answered "I could
      not check" with silence would report green on exactly the contracts
      nobody can check, which is the shape of every fail-open defect this fleet
      has had.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: uv run pytest tests/test_omn_18236_ac_binding_acceptance.py::TestFailClosed -q
  - id: dod-OmniNode-ai-omnimarket-pr-2505
    description: 'PR #2505 on OmniNode-ai/omnimarket — Evidence-Source autobind.'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnimarket/contents/tests/unit/nodes/node_dod_verify/test_omn_18236_ac_bindings_field_accepted.py?ref=6b46203c0d38e0fdc5f70cee44b9b37e8fee1e75
          --jq '.content' | base64 -d | grep -c 'def _contract'
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnimarket/pulls/2505/files --paginate --jq '.[].filename'
          | grep -cFx 'pyproject.toml'
  - id: dod-deploy-assessment
    description: 'Deploy-scope DoD so PR #2505 clears the deploy-gate (F-05).'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnimarket/pulls/2505/files --paginate --jq '.[].filename'
          | grep -ciE 'nodes/|handlers/|runtime/|services/|docker|monitor_logs|deploy'
  - id: dod-occ-diff-derived-behavior-proof
    description: 'PR #2505 on OmniNode-ai/omnimarket — diff-derived behavior proof (OMN-16434).'
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18236_ac_bindings_field_accepted.py
          -q
        cwd: ${OMNI_HOME}/omnimarket
  - id: occ-self-bind-pr-9288
    description: 'Binds OMN-18236 to OCC companion PR #9288 (self-bind).'
    source: generated
    checks:
