      The acceptance criteria declared in the OMN-20167 ticket body, transcribed by hand. The ticket body is the source and this block is the copy.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the compute measures tokens over prompt, context pack and attached sources, units and steps from the text, and assigns the band from the class contract's thresholds with no literal in code -- falsifier: uv run pytest tests/nodes/node_delegation_size_band_compute -v in omnimarket
