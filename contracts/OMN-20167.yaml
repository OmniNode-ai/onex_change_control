        statement: |-
          AC2: identical text with different caller metadata gets the same band -- falsifier: uv run pytest tests/nodes/node_delegation_size_band_compute -k caller_metadata_ignored -v in omnimarket
      - id: "AC3"
        statement: |-
          AC3: a request carrying a size band or a feature value is refused with a typed refusal naming the field -- falsifier: uv run pytest tests/nodes/node_delegation_size_band_compute -k caller_band_refused -v in omnimarket
      - id: "AC4"
        statement: |-
          AC4: the routing decision carries the band and each feature with its source -- falsifier: uv run pytest tests/unit/delegation -k band_on_routing_decision -v in omnimarket
