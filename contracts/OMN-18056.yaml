      is precisely the failure OMN-18056 exists to remove, so AC2 stays unbound and is reported as such.
      WHAT WAS MEASURED. tests/unit/nodes/node_evidence_autoclose_sweep_effect/test_omn_18056_nine_ticket_fixture.py
      at the merged squash 64203bd6e5bc150b5579dd0a59525060f81132a7 drives all nine adjudicated tickets
      through the real handler against their real captured dod_verify verdicts and their real acceptance-criteria
      sections, offline, with apply=True so that "no Done was written" is an assertion about a mode that
      WOULD have written one. It was executed on 2026-09-09 in a clean worktree at that sha: 11 passed
      in 1.15s. Its aggregate assertions are "assert len(decisions) == 9" and "assert EnumEvidenceAutocloseDecision.FLIPPED
      not in decisions", and the two checks below pin exactly those two lines at that sha. WHY THE CRITERION
      IS STALE RATHER THAN UNMET. The "1 flip" was expected to be OMN-17298. Two corrections, both recorded
      on the ticket before this item: OMN-16833 returns behavior_proving 0 and OMN-16558 returns status
      skipped with 0 verified, so neither ever satisfied the full predicate; and OMN-17298 itself holds
      with gap_ac_unbound naming AC6b, because live state showed the projection node running with topic
      traffic — the flip it received on 2026-09-08 at 21:21:29Z was reverted at 22:03:49Z by the audit.
      Three distinct hold classes are pinned per ticket (gap_ac_unbound on seven, gap_no_behavior_proof
      on OMN-16833, skipped_live_check_not_executed on OMN-16558), each naming the criterion the human
      sweep named, which is the "held AC named per ticket" half of AC2 and the half that IS satisfied.
      This item is evidence about the measurement. It is not a proof of AC2 as written, and it does not
      pretend to be one.
