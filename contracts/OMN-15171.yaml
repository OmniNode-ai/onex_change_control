  — receipt contract for already-merged, live-proven work (false-Backlog reconciliation)"
summary: >-
  OMN-15171 is a false-Backlog ticket, and it is stronger than code-only — it is live-proven at full acceptance
  scale. The driver landed on jonahgabriel/steel_onslaught `main` in PR #224, merge commit 491c52a76d90324e557f7638b7fb7312ca54057a,
  merged 2026-07-27T01:11:16Z, while the Linear ticket held a single Backlog stateHistory entry throughout
  (startedAt null, completedAt null, zero comments). This is the EIGHTH member of the epic OMN-15154 false-Backlog
  cluster, beyond the seven reconciled 2026-07-30T03:22Z (OMN-15157, OMN-15159, OMN-15160, OMN-15162,
  OMN-15166, OMN-15167, OMN-15240) — the cluster's true denominator is 8, not 7. This contract is the
  receipt surface for the dod_verify path; it makes no status change. What landed: `scripts/run_display_salience_battery.py`,
  an n-seed battery runner that dispatches every seed through the platform path (`assemble_match_live`
  passed `kafka_transport=kafka_transport`, so composition builds the real OMN-15167 `KafkaTerminalEventForwarder`
  and the topic is referenced by the imported `STEEL_MATCH_TERMINAL_TOPIC` symbol rather than a free string),
  with a fresh `LiveMatchStack` per seed closed in a `finally:`, a loud skip plus a force-failing exit
  code when a seed dies, and per-row `correlation_id` + `kafka_forwarded_event_types` as the machine-checkable
  proof that THAT seed's terminal events crossed the bus. Arm-1-only containment is structural, not documentary:
  `_CORNER_OVERLAYS` is a two-entry dict hard-pinned to the arm's own #223 overlays and `--corner` takes
  `choices=sorted(_CORNER_OVERLAYS)`, so the driver cannot be aimed at another arm. Other arms are provably
  untouched (the merge commit's file list is exactly three files and `scripts/run_ogate_objectives_battery.py`
  is not among them) and `OpenAICompatibleClient` is retained at the merge SHA for the non-migrated arms.
  Live proof is already banked by the ACCEPTED OMN-15172 acceptance battery, which ran THROUGH THIS DRIVER
  at n=30 per corner — steel#231 (verdict ACCEPT, both corners 30/30) and steel#232 (verdict SALIENCE-EMERGENT).
  That runtime evidence is NOT re-probed here: it requires .201 lane access, and every check in this contract
  is deliberately hosted-runnable, so the runtime facts are bound through the merged evidence documents
  rather than restated as checks a hosted runner could not execute. SCOPE HONESTY — one named residual,
  disclosed rather than papered over: the ticket TITLE says "retire nohup battery-driver invocation",
  and OS-level `nohup ... &` backgrounding was NOT eliminated. The accepted OMN-15172 run launched this
  very driver with `nohup env -u PYTHONPATH OMNI_HOME="$SNAP" uv run python scripts/run_display_salience_battery.py
  ... &` from `chain_prominent.sh`, an UNCOMMITTED corner-chaining wrapper. What the ticket BODY scopes,
  and what #224 actually retired, is narrower and is fully met: the `run_ogate_objectives_battery.py`-style
  sequential-in-process lifecycle and the uncommitted PER-SEED shell wrapper, replaced by one typed Python
  entrypoint whose per-seed loop force-fails on seed death. The residual is process backgrounding plus
  an uncommitted per-CORNER chain wrapper, which is durably documented (not hidden) in the committed OMN-15265
  runbook and is bound as a check below; OMN-15265's org-side mechanism half remains open. Binding is
  MIXED by design and the split is deliberate: every check about steel#224's own landed contribution is
  pinned to an immutable merge SHA, but the residual-disclosure item also carries one UNPINNED leg that
  reads the runbook at live `main`, because content frozen at a commit SHA can never observe a later deletion
  — a pinned-only disclosure check would report GREEN forever after someone removed the section it claims
  to guard (adversarial review F1). Every check was executed GREEN under `bash -o pipefail` from the repo
  root on the gate host and is receipted under drift/dod_receipts/OMN-15171/.
