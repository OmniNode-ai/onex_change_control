schema_version: "1.0.0"
ticket_id: "OMN-15487"
title: "OCC CI Summary — make the required-checks.yaml rationale true and pin the schema-purity skip-laundering
  cascade"
summary: "OMN-15487 was filed against the needs:-gated ci-summary aggregator, which OMN-16007 has since
  replaced on dev with the no-needs poller in scripts/ci/ci_summary_gate.py. That landing satisfied the
  ticket's AC1 (parsing-derived completeness test), AC2 (all named jobs classified — 6 in the gate, the
  7th, smart-test-select, deleted from ci.yml per OMN-15755), AC5 (drift guard for job 34) and AC6 (no
  enforcement weakened; live dev required contexts are now 4, not the 2 in the ticket body). This ticket
  closes the two ACs that landing did not cover. AC4: .github/required-checks.yaml carried three claims
  that are now false — the CI Summary row's rationale ('Fail-closed if: always() aggregator over ci.yml
  sub-jobs', false in BOTH directions: it overstated coverage when written, since 7 of 33 ci.yml jobs
  were absent from needs: entirely, and it understates coverage now that there is no needs: at all and
  L4 reaches contexts in other workflow files), the header block justifying the verify/verify and occ-preflight/eligibility
  dev promotions with 'OCC has no scripts/ci/ci_summary_gate.py poller' (that file exists on dev and names
  both contexts in EXPECTED_EXTERNAL_CONTEXTS; the promoted rows stay, the overlap is deliberate belt-and-braces,
  only the stated reason was stale), and the Pre-commit note describing coverage via ci-summary's needs:
  list rather than the poller's STRICT_GATE_JOBS. The corrected rationale is pinned by test so it cannot
  drift back to needs:/aggregator vocabulary or stop naming the poller script. AC3: the schema-purity
  skip-laundering cascade is closed at the source but was not pinned for its real shape — the pre-existing
  red-replay test holds every other job green, including Schema Purity & Naming Check, whereas a failing
  contract-compliance actually cascades schema-purity to skipped. Two new tests pin the real pair plus
  a falsification control proving the FAILURE verdict comes from contract-compliance being read directly
  and not from the skip, so a future edit moving 'Contract Compliance Check' into SOFT_ALLOWLIST/CLASSIFICATION_ONLY
  cannot silently reopen the vector while the green-fixture test keeps passing. Self-authored by the implementer
  for this ticket's OWN carrier PR (not a companion pattern) — a self-contained, gate-mechanical change,
  per the OMN-16007/OMN-15710 precedent in this same corpus."
