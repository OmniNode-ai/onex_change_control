    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5974 --repo OmniNode-ai/onex_change_control --json number,state,headRefName"
  - id: "dod-omn15413-ac6-disclosed-skip-restored"
    description: >-
      ACCEPTANCE BULLET 6 — "no live migration is applied by this ticket" — RESTORED TO ITS HONEST FORM
      AS A DISCLOSED SKIP, add-only. This entry supersedes "dod-omn15413-ac6-no-live-migration-skip" above
      at the contract level; that entry is immutable under validator_occ_append_only and is deliberately
      left byte-for-byte intact for audit. THE STANDING CLAIM: no executable check reachable from the
      dod_verify executor can prove this bullet. It is a universally-quantified negative over the state
      of every live database. Grading the implementation diff proves a property of the diff, not a property
      of the databases; proving the databases would need credentialed reads of the prod and stability
      lanes that this executor does not have and must not be given for an evidence read. This entry therefore
      carries status `skipped` and an explicit empty `checks: []` on purpose, and any Done adjudication
      on OMN-15413 must treat bullet 6 as accepted on operator judgement rather than as verified. SHAPE
      NOTE (OMN-15664/OMN-15413, 2026-08-04): `checks` is spelled as an explicit `[]` here rather than
      omitted. `omnibase_core.validation.validator_receipt_gate._honestly_superseded_dod_ids`, which both
      `occ-preflight / eligibility` (`validate_occ_merge_eligibility`) and the Receipt Gate consult to
      excuse the superseded entry's own receipt requirement, evaluates `is_disclosed_skip` as `item.get("status")
      == "skipped" and checks == []` as of core PR #1544 commit `a681b2bf` (a CodeRabbit-driven fail-closed
      hardening on that same PR — `checks = item.get("checks")` with no default, so an omitted key resolves
      to `None`, and `None == []` is `False`). An earlier revision of this entry omitted the `checks`
      key entirely, matching an intermediate pre-hardening build of that predicate (`item.get("checks",
      [])`, commit `038367b7`) but not the one CI actually installs from `dev` — that mismatch is exactly
      what produced `occ-preflight / eligibility` reason `missing_receipt` on `OMN-15413:dod-omn15413-ac6-no-live-migration-skip:command`
      even after core#1544 merged. `onex_change_control`'s own `contract_compliance_check._disclosed_skip_supersession_ids`
      defaults omitted `checks` to `[]` (`dod_item.get("checks", [])`) and was never affected. This entry's
      intent — an honest, disclosed, unprovable skip with zero checks — is unchanged; only the YAML spelling
      of "zero checks" changed, from omitted to explicit, to match the stricter of the two gates. WHAT
      WAS DELETED. The contract as authored (third-party, under R-0802-5) carried exactly this disclosure
      at commit acc18c627f8450693f8a169cab26d2d9e87f7898 — status `skipped`, no `checks` key, with prose
      stating that "Asserting any always-true stand-in — a grep that matches unconditionally, a `gh` call
      whose exit status does not depend on the claim — would be the vacuous always-true check that this
      contract exists to avoid, and would convert an honest unknown into a false GREEN". That disclosure
      was removed inside the open PR by commit f6197f0b3560533e46db0ce540feb3a3120c235a ("fix(OMN-15413):
      repair executable OCC evidence", 2026-08-02T14:19:20Z) and replaced with a `status: verified` entry
      plus a command check — the precise substitution the deleted text warned against. THE SUBSTITUTE'S
      THREE DEFECTS, each verified live 2026-08-02 rather than asserted. (1) ALWAYS-TRUE. The probe greps
      the changed-file list of omnibase_infra#2557, which merged 2026-07-30T16:05:58Z and is closed; a
      merged PR's file list is frozen, so the predicate can never change value and the check is frozen-green
      by construction. (2) FAILS OPEN. The probe is `gh api ... | python3 -c ...` with no `pipefail`;
      when the `gh` leg errors the Python leg reads empty stdin, collects no matches and exits 0. Demonstrated:
      substituting a non-existent PR number yields `gh: Not Found (HTTP 404)` on stderr and pipeline exit
      code 0 — a GitHub outage, a permissions change, or a deleted PR all render this check GREEN. (3)
      FALSE FALSIFIABILITY CLAIM. Its description states "This check is intentionally not a vacuous always-true
      stand-in: adding any matching live deployment path to #2557's changed-file set makes it exit 1."
      No one can add a path to a merged, closed PR's changed-file set; the stated falsification route
      does not exist, so the description asserts a discrimination property the probe does not have. THE
      RECEIPT IS PROVENANCE-INCOHERENT. The receipt landed by the same commit (drift/dod_receipts/OMN-15413/dod-omn15413-ac6-no-live-migration-skip/command.yaml)
      records contract_entry_sha256 sha256:18aa9110e64fa16a4570fac1b3c553a987e1936f8f5de8792294ccabf75863c5
      with run_timestamp 2026-08-02T14:17:52Z and commit_sha acc18c627f8450693f8a169cab26d2d9e87f7898.
      Recomputing the per-entry hash with omnibase_core.validation.validator_receipt_gate.compute_contract_entry_sha256
      shows the entry at acc18c627 hashes to sha256:4c2db9e764d4b2cbcf80052b235c5edf0673c9ade3b786f38b2867b327c70035
