      only at f6197f0b3. The receipt therefore binds a contract entry that did not exist at the commit
      it names, and its run_timestamp precedes that commit by 88 seconds — it records a PASS for a check
      that did not yet exist. That receipt key is separately invalidated add-only by drift/dod_receipts/OMN-15413/dod-omn15413-ac6-no-live-migration-skip/command.supersede.5975.yaml
      (tombstone) in this PR — the `.<NNNN>.` ordinal is the OCC PR number that appends the record, per
      docs/standards/receipt_hashing_and_supersession.md section 4 ("the highest NNNN record is authoritative"),
      matching the live `.5458.` / `.5793.` / `.1969.` precedents in this repo. HOW THIS PASSED EVERY
      GATE. Two blind spots, not a bypass: validator_occ_append_only treats a net-new contract as trivially
      passing, so an in-PR rewrite of an entry that never existed on dev is invisible to it; and no lint
      rule classifies a merged-PR file-list probe as always-true. Both are ticketed.
