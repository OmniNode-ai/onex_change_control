  - id: "occ-self-bind-pr-5975"
    description: >-
      Binding stamp, NOT substantive proof. It binds OMN-15413 to OCC evidence PR #5975 — the append-only
      integrity supersession that adds the three entries above — so `occ-preflight / eligibility` can
      resolve a PASS receipt for this ticket against THIS PR, per the OCC in-repo invariant (I3) that
      an OCC PR validates contracts and receipts from its own checkout. Mirrors the `occ-self-bind-pr-5945`
      and `occ-self-bind-pr-5974` precedents. SCOPE, stated so this stamp is not mistaken for evidence:
      it adjudicates nothing about the OMN-15413 work, proves nothing about the deliverable, and flips
      no Linear status. Like `occ-self-bind-pr-5974` it is deliberately NOT written in the merged-assertion
      form, because #5975 is open at authoring time and asserting a merge commit it does not yet have
      would be unsatisfiable-by-construction. This is an existential predicate (the PR resolves) rather
      than a property of the OMN-15413 deliverable, and is labelled as such rather than counted toward
      the acceptance bullets.
