  - id: "dod-omn15413-ac2-idempotent-and-history-preserving"
    description: >-
      ACCEPTANCE BULLET 2, RESTORED IN FULL — add-only. The bullet as written on OMN-15413 reads "Historical
      imports are deterministic, checksummed, idempotent, and preserve applied history." The entry "dod-omn15413-ledger-declarations-on-dev"
      above restates it as "(historical imports are deterministic and checksummed)" and evidences only
      those two properties via the declaration manifest's 6-column/SHA-256 shape. The conjuncts "idempotent"
      and "preserve applied history" were dropped without disclosure, so half of bullet 2 was silently
      unevidenced while the entry read as fully verified. This entry adds executable evidence for the
      two dropped conjuncts. It supersedes nothing and removes nothing; the superseded-scope entry stays
      intact and its own two conjuncts remain valid. FOUR CONJUNCTS, all live mainline readbacks at ?ref=dev.
      IDEMPOTENCY, from scripts/run-forward-migrations.sh — (1) the ledger insert terminates in "ON CONFLICT
      (migration_id) DO NOTHING;", so re-running an already-applied migration inserts nothing; (2) the
      runner carries the "(already applied)" short-circuit that skips a migration whose migration_id is
      already present rather than re-executing it. HISTORY PRESERVATION: conjunct (1) is also the history-preservation
      mechanism — the conflict action is DO NOTHING, not DO UPDATE, so an import can never overwrite an
      applied row's recorded checksum, source_set or identity. This is the "do not hand-insert applied
      rows / do not rewrite applied history" property in executable form. From tests/integration/migrations/test_application_migration_ledger_omn15413.py
      — (3) "def test_real_runner_imports_sanitized_legacy_history_twice_on_postgresql_16(" and (4) "def
      test_real_runner_fresh_install_twice_on_postgresql_16(" are the twice-apply suites that exercise
      both properties against a real PostgreSQL 16. SCOPE, stated so this is not read as more than it
      is: conjuncts 3 and 4 prove those test functions are PRESENT on the mainline, not that they PASS
      today. dod_verify executes check_values with cwd set to the onex_change_control checkout (run_contract_compliance_check.py
      `_run(["sh","-c",cmd_str], cwd=workspace)`, OMN-14436), so no omnibase_infra-relative pytest invocation
      can resolve from this executor and any such check would be a false RED rather than proof. The executing
      evidence for that suite is the hosted rebuilt-Docker attestation above. Conjuncts 1 and 2 are stronger:
      they pin the shipped idempotency/no-overwrite mechanism itself, not a test of it. FALSIFIABILITY
      DEMONSTRATED, not asserted, all re-run live 2026-08-02. GREEN: the committed check_value executed
      verbatim exits 0 today. RED CONTROLS, two of them: pinning "ON CONFLICT (migration_id) DO UPDATE;"
      — the history-overwriting shape this bullet forbids — exits 1, and renaming the twice-import test
      to a "_ONCE_" variant exits 1. FAIL-CLOSED: repointing any leg at a non-existent ref exits 1 rather
