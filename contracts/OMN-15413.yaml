      judgement outside this DoD executor: the implementation report (ticket comment 19344393, 2026-07-30T04:17:45Z)
      states "No live database, deploy/restart, grant/RLS, cutover, history rewrite, manual ledger insertion,
      merge, or .201 mutation occurred", and comment f7543290 records that the lane's dispatch authorization
      prohibited live migration, database operation, merge, deploy, grant, RLS, and destructive action.
      This check is intentionally not a vacuous always-true stand-in: adding any matching live deployment
      path to #2557's changed-file set makes it exit 1.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: |-
          gh api repos/OmniNode-ai/omnibase_infra/pulls/2557/files --paginate --jq '.[].filename' | python3 -c 'import re, sys; pattern = re.compile(r"^(\.github/workflows/(deploy|release)|deploy|deployment|helm|k8s|terraform|scripts/(deploy|restart|apply-live|prod|run-live))"); bad = [line.strip() for line in sys.stdin if pattern.search(line.strip())]; print("\n".join(bad)); sys.exit(1 if bad else 0)'
  - id: "occ-self-bind-pr-5974"
    description: >-
      Binding stamp, NOT substantive proof. It binds OMN-15413 to OCC evidence PR #5974 — the PR that
      creates this contract — so `occ-preflight / eligibility` can resolve a PASS receipt for this ticket
