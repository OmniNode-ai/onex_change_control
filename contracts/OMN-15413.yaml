  - id: "dod-omn15413-ac6-no-live-migration-skip"
    description: >-
      ACCEPTANCE BULLET 6 — "no live migration is applied by this ticket" — reduced to the falsifiable
      surface available to this executor. The probe reads the changed-file list for the implementation
      PR omnibase_infra#2557 through GitHub's PR-files API and fails if the PR touched live deployment,
