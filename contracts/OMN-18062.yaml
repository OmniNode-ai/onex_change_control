  - id: "ac2-ledger-terminal-row-remote"
    description: >-
      AC2 of OMN-18062 — its third conjunct, "ledger TERMINAL row", re-expressed as a check that executes
      to the same answer from ANY environment. NET-NEW item; the merged ac2-ledger-terminal-row above
      is untouched, keeps its receipt, and stays in the record. WHY IT EXISTS. That item declares cwd
      ${OMNI_HOME} and greps a working-tree file, so it reaches no verdict about the fact it names from
      anywhere but one particular machine. Measured both ways on 2026-09-09. In the scheduled closer's
      checkout ${OMNI_HOME} is the product repository, which carries no docs/tracking/ROLLING_WORK_LEDGER.md,
      so the grep exits 2 and is recorded FAILED — it was the single remaining failed check on this ticket
      at sweep run 34343571748. On a local dod_verify draw the omni_home root instead resolves as a product
      clone whose freshness cannot be asserted, and the item is recorded SKIPPED with cause PRODUCT_CLONE_NOT_FRESH,
      so the command never runs at all. The same declared check is FAILED in one place and SKIPPED in
      the other, and neither outcome is a statement about the row. THE REPAIR MOVES THE SURFACE, IT DOES
      NOT WEAKEN THE BAR. The two TERMINAL rows now sit on a ref GitHub serves — omni_home#263, squash
      1b2e8037a75e857fe3d91c4fdd83d2c9eb1e299d, a pure 1514-line append whose base file is an exact prefix
      of the landed one — so the check below reads them over the API with no cwd, no clone and no ${OMNI_HOME}
      token. The two rows are the 05:35:35Z land row (OMN-18062 DONE, four squash shas) and the 05:46:47Z
      adversarial-verify row. POSITIVE CONTROL 2, exit 0. NEGATIVE CONTROLS, both run: the identical read
      asserting a count of 3 exits 1, and the same grep for a lane name that does not exist returns 0
      and exits 1. It declares evidence_artifact supersedes_dod_evidence:ac2-ledger-terminal-row so the
      earlier item is retired rather than re-executed against an environment it cannot describe. Per the
      resolver's own anti-laundering rule that retirement fires ONLY while this item is itself VERIFIED,
      so an evidence-free marker cannot launder the older FAILED away. HONEST LIMITS, stated. The ref
      is an immutable squash sha, so this proves the rows as they stood at that commit and asserts nothing
      about later ledger state. And a token without read access to the private omni_home repository would
      fail this check closed — it cannot pass it by accident.
    source: "manual"
    status: "verified"
    binds_ac: ["AC2"]
    evidence_artifact: "supersedes_dod_evidence:ac2-ledger-terminal-row"
    checks:
      - check_type: "command"
        check_value: |-
          gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omni_home/contents/docs/tracking/ROLLING_WORK_LEDGER.md?ref=1b2e8037a75e857fe3d91c4fdd83d2c9eb1e299d" | grep -c 'TERMINAL | lane=omn18062-ci-summary-skipped' | grep -qx 2
