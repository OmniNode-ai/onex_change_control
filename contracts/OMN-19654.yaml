    description: |-
      AC3 proof (mac-evid-b06b07, OMN-17427), two checks. (1) GREEN: uv run pytest -k omninode_readonly_rootfs over the regression file passes at the current tree. (2) RED: the same file, taken from the fix commit 42f502dc02ba, run against an archive of the fix's parent fails (exit non-zero, every case failed), so the test tells the fix from its absence.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: |-
          env -u PYTHONPATH uv run pytest "tests/unit/nodes/node_delegate_skill_orchestrator/test_claim_store_state_root_omn19654.py" -k omninode_readonly_rootfs -q
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |-
          fix=42f502dc02ba
          tf=tests/unit/nodes/node_delegate_skill_orchestrator/test_claim_store_state_root_omn19654.py
          work="$(mktemp -d -t omn19654red.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          git archive "$fix^" | tar -x -C "$work" || exit 2
          git show "$fix:$tf" > "$work/$tf" || exit 2
          cd "$work" || exit 2
          if env -u PYTHONPATH uv run pytest "$tf" -k omninode_readonly_rootfs -q -p no:cacheprovider > "$work/red.txt" 2>&1; then
            echo "RED leg passed at the pre-fix parent $fix^: the test does not tell the fix from its absence"; tail -3 "$work/red.txt"; exit 1
          fi
          echo "pre-fix parent of $fix: the omninode_readonly_rootfs cases fail"
          tail -n 2 "$work/red.txt"
          grep -cE "^(FAILED|ERROR)" "$work/red.txt"
        cwd: "${OMNI_HOME}/omnimarket"
