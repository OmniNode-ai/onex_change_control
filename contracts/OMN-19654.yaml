    description: |-
      AC1 proof (mac-evid-b06b07, OMN-17427). A live delegation on the onex-lab k3s lane (host .201, namespace onex-dev; this is not the public cluster that also carries a namespace called onex-dev), through the deployed runtime pod's own onex delegate over the lab Redpanda with --locus deployed-lane, from inside the namespace. It must exit 0 with terminal_payload.payload.status completed and no OSError. Deviation from the criterion's literal command, recorded because it matters: run from the pod's default working directory the CLI exits 1 on a different read-only error, OSError Errno 30 on the relative path '.onex_state' in the CLI's own payload writer (cli_delegate.py _write_payload), observed 2026-10-02T23:25Z in omninode-runtime, omninode-runtime-effects and omninode-runtime-worker. This check therefore runs the same command after cd /app/data (the writable emptyDir). The orchestrator no longer raises on /.omninode; the CLI cwd defect is separate and unfixed.
    source: "generated"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          lab_ssh="$(docker inspect omnibase-infra-postgres >/dev/null 2>&1 && echo "sh -c" || echo "ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201")"
          out="$($lab_ssh 'timeout 150 sudo -n k3s kubectl exec -n onex-dev deploy/omninode-runtime -- sh -c "cd /app/data && onex delegate test --task-type summarization --bus kafka --kafka-bootstrap onex-lab-redpanda.onex-dev.svc.cluster.local:9092 --locus deployed-lane"')" || { echo "onex delegate in the onex-lab runtime pod exited non-zero"; exit 1; }
          line="$(printf '%s\n' "$out" | grep -m1 '^{"skill_name"')"
          test -n "$line" || { echo "no receipt line in the delegate output"; exit 1; }
          status="$(printf '%s' "$line" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); print(d["exit_code"], d["result"]["terminal_payload"]["payload"]["status"], d["result"]["terminal_payload"]["payload"].get("error_message",""))')"
          echo "onex-lab k3s on .201, namespace onex-dev, pod deploy/omninode-runtime: exit_code status error_message = $status"
          test "$status" = "0 completed "
