schema_version: "1.0.0"
ticket_id: "OMN-15749"
title: "deploy-agent digest-verification fixture errors on real docker timeouts under runner contention"
summary: >-
  The OMN-15181 real_container fixture in scripts/deploy-agent/tests/unit/test_executor_digest_verification_image_id_omn15181.py
  builds a real busybox container to pin actual docker inspect semantics. All four of its docker calls
  already passed check=False, so a non-zero exit was the fixture's business to interpret -- but subprocess.run
  raises TimeoutExpired regardless of check=, so the one failure mode the fixture could not absorb is
  the one that actually fires on the shared self-hosted fleet: docker daemon and registry contention.
  Observed on three unrelated PRs (infra#2790 docker pull busybox:latest timed out after 90 seconds; infra#2684
  docker rm -f after 30s at teardown; infra#2685 docker create after 30s at setup). Deploy Agent Tests
  is a required merge gate, so each occurrence blocks a PR on a condition that says nothing about the
  code under test. The fix routes all four calls through a helper that collapses a timeout to None, making
  the timeout a handled outcome rather than an unhandled exception, while any OTHER non-zero exit still
  raises so a genuine docker semantic is not swallowed.
