---
schema_version: 1.0.0
ticket_id: OMN-17851
title: Immutable pre-push snapshot validation
summary: Narrow OCC evidence for OmniNode-ai/omnimarket#2344 (https://github.com/OmniNode-ai/omnimarket/pull/2344),
  bound to product base 2fac3c4b429274f21f95eb6179169898c24d3874 and committed head 58410c28e44402d2ea0b187326445b36abc474dd.
  This developer-side validation change does not activate an installed hook, deploy a service, or mutate
  runtime infrastructure.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: Focused committed CPython 3.12 offline behavior tests for snapshot selection, provenance,
      lifecycle, adapter identity, staged release identity, and the OMN-17863 hermetic no-tool fixture.
    command: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 UV_PROJECT_ENVIRONMENT=/private/tmp/omn17851-58410c28-py312.EyzmZ5/.venv
      uv run --offline pytest --noconftest -o addopts='' tests/scripts/test_install_prepush_hook.py tests/scripts/test_prepush_snapshot_adapter.py
      tests/scripts/test_prepush_snapshot_lifecycle.py tests/scripts/test_prepush_snapshot_provenance.py
      tests/scripts/test_check_release_identity.py tests/unit/nodes/node_dod_verify/test_omn_17863_hermetic_node_behaviour_check_env.py
      -q
  - kind: manual
    description: Release identity is clean against immutable product base 2fac3c4b429274f21f95eb6179169898c24d3874;
      no packaged source files changed.
    command: uv run python scripts/check_release_identity.py --base 2fac3c4b429274f21f95eb6179169898c24d3874
  - kind: manual
    description: 'The product checkout resolves to the exact product PR #2344 implementation commit 58410c28e44402d2ea0b187326445b36abc474dd.'
    command: test "$(git rev-parse HEAD)" = 58410c28e44402d2ea0b187326445b36abc474dd
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-focused-prepush-tests
    description: Committed CPython 3.12 offline focused tests pass for snapshot installer behavior, adapter
      identity and cleanup, staged/unstaged isolation, signal interruption, noneditable provenance, staged
      release identity, and the OMN-17863 hermetic no-tool fixture.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 UV_PROJECT_ENVIRONMENT=/private/tmp/omn17851-58410c28-py312.EyzmZ5/.venv
          uv run --offline pytest --noconftest -o addopts='' tests/scripts/test_install_prepush_hook.py
          tests/scripts/test_prepush_snapshot_adapter.py tests/scripts/test_prepush_snapshot_lifecycle.py
          tests/scripts/test_prepush_snapshot_provenance.py tests/scripts/test_check_release_identity.py
          tests/unit/nodes/node_dod_verify/test_omn_17863_hermetic_node_behaviour_check_env.py -q
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-release-identity
    description: 'The committed product PR #2344 change passes release identity against immutable base
      2fac3c4b429274f21f95eb6179169898c24d3874 without packaged source drift.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run python scripts/check_release_identity.py --base 2fac3c4b429274f21f95eb6179169898c24d3874
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-source-commit
    description: 'The local product checkout is bound to the exact product PR #2344 implementation commit
      58410c28e44402d2ea0b187326445b36abc474dd.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: test "$(git rev-parse HEAD)" = 58410c28e44402d2ea0b187326445b36abc474dd
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-static-diff
    description: 'The complete immutable product PR #2344 diff from base 2fac3c4b429274f21f95eb6179169898c24d3874
      to head 58410c28e44402d2ea0b187326445b36abc474dd contains exactly twelve declared files and no whitespace
      errors.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: expected="$(printf '%s\n' '.pre-commit-config.yaml' 'pyproject.toml' 'scripts/check_release_identity.py'
          'scripts/hooks/install_prepush_hook.py' 'scripts/hooks/prepush_snapshot_adapter.py' 'tests/scripts/test_check_release_identity.py'
          'tests/scripts/test_install_prepush_hook.py' 'tests/scripts/test_prepush_snapshot_adapter.py'
          'tests/scripts/test_prepush_snapshot_lifecycle.py' 'tests/scripts/test_prepush_snapshot_provenance.py'
          'tests/unit/nodes/node_dod_verify/test_omn_17863_hermetic_node_behaviour_check_env.py' 'uv.lock')";
          actual="$(git diff --name-only 2fac3c4b429274f21f95eb6179169898c24d3874 58410c28e44402d2ea0b187326445b36abc474dd
          | LC_ALL=C sort)"; test "$actual" = "$expected" && git diff --check 2fac3c4b429274f21f95eb6179169898c24d3874
          58410c28e44402d2ea0b187326445b36abc474dd && printf '%s\n' 'static_diff_assertion=PASS; paths=12'
        cwd: ${OMNI_HOME}/omnimarket
