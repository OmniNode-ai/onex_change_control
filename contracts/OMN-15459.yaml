dod_evidence:
  - id: dod-omn-15459-wrong-item-rebind-real-at-occ5534
    description: 'The defect this ticket exists for is real in MERGED dev bytes, not inferred. Read at
      the immutable merge commit 34c8dacc4cab7bf0e48a616fdb9820aefb09434d (OCC#5534, a squash on dev —
      a durable ref, deliberately NOT the deleted feature-branch head 05e105cf that the mis-paired records
      themselves pin and that reference_never_pin_a_feature_branch_head forbids), the supersession for
      dod-occ-evidence-admissibility-validator rebinds that item to a grep of scripts/create_kafka_topics.py.
      That item''s own declared bar is uv run pytest tests/test_evidence_admissibility.py -q, so the replacement
      names a file from an entirely different artifact family. Falsifiable: asserting the repaired family
      anchor (test_evidence_admissibility.py) against these same merged bytes exits 1 — executed as a
      RED control — which is precisely the discrimination S2 adds.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh api 'repos/OmniNode-ai/onex_change_control/contents/drift/dod_receipts/OMN-15395/dod-occ-evidence-admissibility-validator/command.supersede.2552.yaml?ref=34c8dacc4cab7bf0e48a616fdb9820aefb09434d'
          --jq '.content' | base64 -d | grep -cF 'create_kafka_topics.py' | grep -qx 1"
  - id: dod-omn-15459-s1-s2-rules-shipped-pr-5621
    description: 'onex_change_control#5621 actually introduces both rules into the gate, rather than only
      describing them. Asserted against the PR''s own diff hunks for scripts/validation/check_receipt_hardening.py:
      exactly two ADDED lines declare the rule constants DISTINCTNESS = "S1" and FAMILY_BINDING = "S2".
      Reading the ADDED lines (the ^+ anchor) is what makes this a proof of introduction rather than of
      mere presence — the same two constants sitting unchanged in the file would not match. Falsifiable:
      asserting any count other than 2 exits non-zero, executed as a RED control at 3. Bound to the PR
      diff API rather than to a commit SHA on the feature branch, so the check stays executable after
      the branch is updated or deleted.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh api repos/OmniNode-ai/onex_change_control/pulls/5621/files --paginate --jq '[.[]
          | select(.filename == \"scripts/validation/check_receipt_hardening.py\") | .patch] | join(\"\")'
          | grep -cE '^\\+.*(DISTINCTNESS = \"S1\"|FAMILY_BINDING = \"S2\")' | grep -qx 2"
  - id: dod-omn-15459-repair-is-append-only-pr-5621
    description: 'The repair of the 8 mis-pairings is append-only in the strong sense the OCC store requires:
      exactly 8 files named command.supersede.15459.yaml appear in #5621''s diff, every one with GitHub
      status "added" and deletions == 0. An in-place edit of a merged immutable receipt — the OMN-15485
      failure class — would surface as status "modified" and drop the count below 8, so this check discriminates
      a genuine append from a rewrite. Falsifiable: asserting 9 exits non-zero, executed as a RED control.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh api repos/OmniNode-ai/onex_change_control/pulls/5621/files --paginate --jq '[.[]
          | select(.filename | endswith(\"/command.supersede.15459.yaml\")) | select(.status == \"added\")
          | select(.deletions == 0)] | length' | grep -cxF '8' | grep -qx 1"
  - id: "occ-self-bind-pr-5621"
    description: 'Self-bind: OCC PR 5621 is the carrier for this ticket''s gate and repair, proven by
      its own file list containing scripts/validation/check_receipt_hardening.py — the single file this
      ticket names as the owner of the supersession leg. Deliberately does NOT assert .state == "OPEN":
      per OMN-15386 that predicate is permanently false after merge and produces a non-convergent rebind
      loop. It also does not assert the presence of contracts/OMN-15459.yaml, because #5621 does not carry
      that file — this companion does, which is the whole point of the implementer not authoring its own
      evidence.'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh pr view 5621 --repo OmniNode-ai/onex_change_control --json files --jq '.files[].path'
          | grep -cxF 'scripts/validation/check_receipt_hardening.py' | grep -qx 1"
  - id: "occ-self-bind-pr-5633"
    description: 'Self-bind: OCC PR 5633 is this companion itself — the contract-and-receipt carrier that
      #5621 cannot author for itself without authoring its own evidence. `occ-preflight / eligibility`
      requires a PASS receipt binding every cited ticket to the PR under evaluation, and #5633 is a second
      PR citing OMN-15459, so it needs its own binding item; without it eligibility returns reason=pr_ticket_mismatch,
      which was observed live on this PR before this entry was added. Bound to the file this companion
      exists to deliver. Deliberately does NOT assert .state == "OPEN" (OMN-15386: permanently false after
      merge, non-convergent rebind loop).'
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "gh pr view 5633 --repo OmniNode-ai/onex_change_control --json files --jq '.files[].path'
          | grep -cxF 'contracts/OMN-15459.yaml' | grep -qx 1"
  - id: "occ-self-bind-pr-5650"
    description: "Binds OMN-15459 to OCC companion PR #5650 (self-bind)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 5650 --repo OmniNode-ai/onex_change_control --json number,state"
