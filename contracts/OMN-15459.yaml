schema_version: 1.0.0
ticket_id: OMN-15459
title: OCC supersession wrong-item rebind — fail-closed S1 distinctness + S2 family binding gate, and
  append-only repair of the 8 OCC#5534 mis-pairings
summary: 'Supersession is the repair primitive of the append-only OCC receipt store, and until this ticket
  it was also a laundering channel: scripts/validation/check_receipt_hardening.py validated a replacement''s
  schema, hashes and identity and never asked whether the replacement executes the check the superseded
  item declares — the string check_value did not occur once in that file''s 417 lines on dev. The live
  instance is onex_change_control#5534 (merged 2026-07-30T01:53:03Z, merge commit 34c8dacc4cab7bf0e48a616fdb9820aefb09434d),
  which added 8 command.supersede.2552.yaml files against 8 DISTINCT dod_evidence items, every one carrying
  a byte-identical replacement.check_value — one grep of scripts/create_kafka_topics.py for def _build_specs.
  So dod-occ-evidence-admissibility-validator, whose declared bar is uv run pytest tests/test_evidence_admissibility.py
  -q, now authoritatively attests that a Kafka-topic script defines a function while the admissibility
  suite it names goes unrun; dod-deploy-assessment, whose declared bar is a two-probe deploy read, attests
  the same grep. OCC#5528 did the same with 6 files one PR earlier. This is machine-producer behaviour,
  not a hand-authoring slip, which is what separates it from the rest of the OMN-15247 laundering family:
  the grep IS RED-derivable (1 at the fix ref, 0 at the parent), so the falsifiability shelf reads it
  as a well-formed probe. It is falsifiable — it just falsifies a different item. Every prior gate (the
  OMN-14505 predicate, lint_contract_check_values, contract_compliance_check) reasons about a check in
  isolation; nothing reasoned about the item-to-replacement pairing. The fix lands in onex_change_control#5621
  as two fail-closed rules inside the gate that already owns the supersession leg (single owner; scripts/
  is DEFAULT-DENY for new scripts per OMN-14475): S1 distinctness — two supersessions in one cohort (same
  ticket directory, same .supersede.<TOKEN>. suffix) against DIFFERENT evidence items may not carry a
  byte-identical replacement.check_value; S2 family binding — a replacement must reference an anchor the
  superseded item''s OWN contract entry declares (a path, symbol, test target or PR number), a pr-<N>
  fragment of the item id, or the item id itself. Both were proven RED against the real merged bytes before
  the repair, not against a fixture: the 8 files at 34c8dacc produce exactly 16 violations (S1 and S2
  on each) and OCC#5528''s 6 produce 11 (S1 on all six, S2 on five — dod-deploy-assessment names its own
  artifact in that cohort, so the claim is stated per rule rather than blanket). The 8 mis-pairings are
  repaired append-only: 8 net-new command.supersede.15459.yaml records, zero merged bytes edited, zero
  deletions. A cure is deliberately hard to fake — it must chain supersedes: to the mis-paired RECORD
  (ModelReceiptSupersession is extra=forbid, so a bespoke corrects: key would invalidate the record),
  carry a HIGHER .supersede.<NNNN>. token than its target (omnibase_core.validation.validator_receipt_supersession
  resolves the active receipt as the max token, so a lower-numbered repair is cosmetic), and be itself
  clean under S1 and S2. Enforcement ships in the same PR per CLAUDE.md rule 5: the existing required-path
  check-receipt-hardening pre-commit hook now evaluates supersessions, plus a new UNCONDITIONAL supersession-binding-ratchet
  CI job carrying a frozen shrink-only corpus baseline (.onex_ratchets/omn_15459_supersession_binding_baseline.yaml,
  1,515 entries — 84% of the merged supersession corpus fails at least one rule, which is itself the finding),
  a 20-test RED/GREEN module, a --check-supersession-wiring anti-removal anchor that is also a pre-commit
  hook scoped to ci.yml, and a strict success-only check in ci-summary so skipped/cancelled/failure all
  block. This contract is authored by the independent adversarial verifier for the lane, NOT by the implementer
  (feedback_no_self_authored_evidence); every check below was executed with a RED control before landing.
  Two residuals are recorded rather than papered over: acceptance criterion (d), producer-side refusal
  in handler_occ_companion_compute.py, is NOT closed by #5621 — that file was concurrently owned by the
  OMN-15485 lane — and OCC#5528''s 6 files plus the OMN-15395 .supersede.2546/.2550/.2554 cohorts (20
  entries) are detected but not repaired, carried as shrink-only baseline debt.'
is_seam_ticket: false
