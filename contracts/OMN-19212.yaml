        cwd: "${OMNI_HOME}/omnibase_infra"
    binds_ac: ["AC2"]
  - id: "dod-omn19212-ac3-provenance-sha-stale"
    description: "AC3: provenance names the source sha and a stale copy is labelled stale. The first test
