---
schema_version: 1.0.0
ticket_id: OMN-19212
title: A bound workspace resolves its transport through a copy materialised from origin/main
summary: 'Evidence companion for OmniNode-ai/omnibase_infra PR #4462: the workspace runtime config is
  materialised from origin/main instead of read from the shared working tree.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria of OMN-19212, transcribed verbatim from the ticket body. The ticket body is the source and this block is the copy; each criterion's id is the label a binding item claims through binds_ac.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: with the shared omni_home tree missing the file but origin/main carrying it, a default `onex delegate` resolves the workspace config and dispatches to the declared lane. -- falsifier: a pytest with a workspace whose working tree lacks the file and whose materialised copy has it asserts the kafka/lane-dev backend overrides.
      - id: "AC2"
        statement: |-
          AC2: materialising the copy never writes the shared index or working tree. -- falsifier: a test that runs the materialiser against a repo with staged changes asserts `git status --porcelain` and `git diff --cached` are byte-identical before and after.
      - id: "AC3"
        statement: |-
          AC3: provenance names the source sha, and a stale copy is labelled stale. -- falsifier: a pytest asserting the provenance string carries the sidecar sha and the stale marker past the bound.
      - id: "AC4"
        statement: |-
          AC4: with neither copy present, the run is still refused, naming both paths and `--bus inmemory`. -- falsifier: a pytest asserting the refusal text.
evidence_requirements:
  - kind: ci
    description: 'PR #4462 product diff scope present'
    command: gh pr view ${PR_NUMBER} --repo ${REPO} --json files
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
