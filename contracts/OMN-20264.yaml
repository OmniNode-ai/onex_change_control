          AC3: the pins in omnibase_core and omnimarket ci.yml name the new omniclaude sha -- falsifier: grep -n route-runner-reusable.yml@ .github/workflows/ci.yml in each caller shows the new sha
      - id: "AC4"
        statement: |-
          AC4: Runner Route passes on a PR CI run of a caller at the new pin -- falsifier: gh pr checks on that PR shows the Runner Route route job success on the exact head
