    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/omnimarket/contents/tests/test_omn16249_projection_injected_key_seam.py?ref=8b66eaa336a7a0d81323f7bbbb899d15ad8d1d86' --jq '.content' | base64 -d | grep -c 'def test_producer_key_assignments_are_statically_discoverable' | grep -x 1
