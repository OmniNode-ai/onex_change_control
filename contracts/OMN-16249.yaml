      with its complete two-file scope: the shim fix (src/omnimarket/projection/handler_shim.py) and the
      new cross-boundary regression suite (tests/test_omn16249_projection_injected_key_seam.py) — no unrelated
      files.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh pr view 2109 --repo OmniNode-ai/omnimarket --json headRefOid,files --jq '(.headRefOid == "8b66eaa336a7a0d81323f7bbbb899d15ad8d1d86") and ([.files[].path] | sort == ["src/omnimarket/projection/handler_shim.py", "tests/test_omn16249_projection_injected_key_seam.py"])' | grep -x true
  - id: "dod-omn16249-producer-injected-keys"
    description: |-
      Producer-side fact the fix rests on: OmniNode-ai/omnibase_infra's handler_wiring.py, at the exact
      rev omnimarket pins in [tool.uv.sources] at the PR head (6fdbba6d8b6bcd7cc98a3da7dc8eb510f67a0e6a
      — the omnibase_infra#2672 merge commit), injects exactly four bookkeeping keys into the projection
      dispatch dict: input_data["_db"], input_data["_event_type"], input_data["_topic"] (all unconditional),
      and input_data["_envelope_id"] (conditional on a resolved envelope identity). Verified live via
      the GitHub contents API against the immutable ref, not restated from memory.

      The probe fetches with `Accept: application/vnd.github.raw` rather than the default JSON+base64
      representation. That is load-bearing, not style: handler_wiring.py is 371,665 bytes, which the
      default path inflates to ~495KB of base64 wrapped in a JSON string, and the first run of this
      check died mid-transfer with `stream error: stream ID 1; CANCEL; received from peer` after ~15s.
      The raw representation streams the file directly and completes in well under a second. The match
      pattern also anchors on the assignment operator so it counts injection SITES, not incidental
      mentions of the same keys elsewhere in the module.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=6fdbba6d8b6bcd7cc98a3da7dc8eb510f67a0e6a' | grep -cE 'input_data\["_(db|event_type|topic|envelope_id)"\] =' | grep -x 4
