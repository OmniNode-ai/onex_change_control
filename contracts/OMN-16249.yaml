      API against the PR's immutable head ref.
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          gh api 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/projection/handler_shim.py?ref=8b66eaa336a7a0d81323f7bbbb899d15ad8d1d86' --jq '.content' | base64 -d | grep -A8 'RUNTIME_INJECTED_KEYS: Final\[frozenset\[str\]\] = frozenset(' | grep -c '_INJECTED_DB_KEY\|INJECTED_EVENT_TYPE_KEY\|INJECTED_TOPIC_KEY\|INJECTED_ENVELOPE_ID_KEY' | grep -x 4
