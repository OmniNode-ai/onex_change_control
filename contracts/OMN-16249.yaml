ticket_id: "OMN-16249"
title: "OCC evidence for OMN-16249 — match the projection injected-key seam across the infra/market boundary"
summary: >
  OCC companion for OmniNode-ai/omnimarket PR #2109. omnibase_infra's projection dispatch arm (handler_wiring._make_projection_dispatch_callback)
  injects four bookkeeping keys into the dict it hands handle(): _db (unconditional), _event_type (unconditional),
  _topic (unconditional), and _envelope_id (conditional — only when an envelope identity is present).
  omnimarket's canonical stripper (src/omnimarket/projection/handler_shim.py, RUNTIME_INJECTED_KEYS) enumerated
  only three of those keys; _envelope_id survived into the strict model_payload and failed extra_forbidden
  against ModelHookEventCaptureRequest — the live onex-dev canary got HTTP 202, the message DLQ'd, zero
  rows landed. The PR widens RUNTIME_INJECTED_KEYS to the full four-key set, surfaces _envelope_id in
  injected_meta for idempotency use, and adds a fail-closed drift guard (test_producer_key_assignments_are_statically_discoverable)
  that harvests the injected-key set by executing inspect.getsource() against the installed omnibase_infra
  handler_wiring module rather than restating it, so the next upstream key lands as a red test instead
  of a silent seam drift.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
