ticket_id: "OMN-16460"
title: "deploy-gateway.sh never builds the gateway-dns-bastion sidecar image (SERVICE_NAME hardcoded to
  gateway-forwarder)"
summary: >
  Central OCC evidence for OmniNode-ai/omnibase_infra PR #2865, which extends scripts/deploy-gateway.sh
  (the sanctioned .201 omninode-gateway deploy path) to build the gateway-dns-bastion sidecar's image
  (introduced by OMN-16449 / omnibase_infra#2862) alongside gateway-forwarder's. gateway-forwarder depends_on
  the sidecar (condition: service_healthy) and the systemd unit reloads with --no-build, so a host that
  had never built the sidecar's image failed the reload outright -- hit live during the OMN-16449/OMN-16457/OMN-16459
  wave2-defect-fix closeout redeploy and worked around with a one-time manual build. This PR closes the
  gap in the script itself: a new SIDECAR_SERVICE_NAME build path mirrors the existing gateway-forwarder
  build idiom, wired into --execute, --print-compose-cmd, dry-run output, and validate_repo_structure.
