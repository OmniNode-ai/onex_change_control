    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The guard judges the expanded destination. $VAR, ${VAR} and $OMNI_HOME/... are resolved from the hook's environment, and relative paths against the command's cwd, before the root check. -- falsifier: uv run pytest tests/hooks/ -k worktree_guard_expands in omniclaude feeds git worktree add "$WT" -b x with WT set to a path under the worktrees root and asserts admission. RED today.
      - id: "AC2"
        statement: |-
          AC2: Fail-closed is preserved. A variable that is unset, or expands outside the root, is still refused, and the refusal names the expanded value it judged. -- falsifier: the same test module feeds WT unset and WT=/tmp/x, and asserts refusal for both with the judged value printed.
      - id: "AC3"
        statement: |-
          AC3: Command substitution is never executed to resolve a destination. $(...) and backticks stay refused as unresolvable. -- falsifier: a test feeds git worktree add "$(mktemp -d)" and asserts refusal, and that no subprocess was spawned by the guard.
      - id: "AC4"
        statement: |-
          AC4: Shared rather than bespoke. The expansion is one helper, used by this guard and available to the pr-body-stamp and shared-tree git guards, so the class is retired in one place. -- falsifier: uv run pytest tests/hooks/ -k expand_helper_shared imports the helper from each guard module and asserts the same function object.
