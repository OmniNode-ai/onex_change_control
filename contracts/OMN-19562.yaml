  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the run the collector scores is always one the same collection's fetch returned -- falsifier: a test drives the collector against a recorded runs payload and asserts the emitted deploy_run_id is a member of that payload, failing if it names any other run
      - id: "AC2"
        statement: |-
          AC2: a collection that cannot establish its candidate list refuses instead of scoring -- falsifier: a test supplies an empty or unreadable runs payload and asserts the leg reports UNPROVEN with a named reason, rather than emitting a deploy_run_id and a PASS/FAIL verdict
      - id: "AC3"
        statement: |-
          AC3: deploy_runs_not_scored accounts for every run the fetch returned and the ranker did not pick -- falsifier: a test feeds a payload of five settled runs and asserts the emitted list names the four unscored ids, failing on the empty list every observation above recorded
      - id: "AC4"
        statement: |-
          AC4: the five occurrences above re-grade correctly once the fix is in -- falsifier: replaying each recorded bar payload through the fixed collector selects the newest settled run in that payload, asserted per occurrence by run id
