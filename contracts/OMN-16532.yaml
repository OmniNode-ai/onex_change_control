summary: >
  Rehomes the generic per-ledger mutex/append/dedup/exit-75-retry contract from omni_home/scripts/ledger_lock.py
  into omnibase_infra/scripts/ledger_lock.py as shared tooling, so any team can point it at their own
  ledger file for claim-before-mutation serialization across multiple agents/processes. Sanitized for
  a public repo: no /Users/ paths, no internal hostnames, no reference to omni_home's private ledger data.
  Deliberately does NOT port omni_home's claim-row cost-sentence/quantitative-claim/defer-language enforcement
  (OMN-15649/15897/15901) -- that logic is bound to that team's own internal ledger row conventions and
  ticket doctrine, not generic shared tooling. Adds tests/unit/scripts/test_ledger_lock.py (32 cases,
  direct-module and end-to-end subprocess-driven against the real CLI) and docs/tooling/ledger-lock.md
  (what it is, the claim/progress/terminal row convention, the exit-75 retry contract, and an employee-facing
  note that any team can point it at their own ledger file). omni_home's own copy is left untouched (dozens
  of live lane prompts cite its absolute path mid-flight); the doc notes it as the origin.
