---
schema_version: "1.0.0"
ticket_id: "OMN-17555"
title: "Replace seven ambient bootstrap reads with typed configuration authorities"
summary: >-
  Rebinds seven omnibase_core bootstrap seams to explicit owners: ArtifactStore(root: Path), the CLI's
  explicit env-file Path, ModelLifecycleChain.heartbeat_required_seconds, ModelRuntimeAlivenessProbeCommand.timeout_seconds,
  the Kubernetes service-account mount for ModelSecretBackend, ModelNodeServiceConfig.network: ModelNetworkConfig,
  and validate_context_size(..., enforce: bool). Historical ambient/default assertions in OMN-9885, OMN-9887,
  OMN-13093, OMN-13537, and OMN-13095 remain intact for audit and are superseded by later append-only
  pending entries in those contracts. OMN-17570 and OMN-17571 must integrate before this ticket for ModelNodeServiceConfig
  version and node-name correctness. OMN-17565 and OMN-17566 own the downstream omnibase_infra and omniclaude
  ArtifactStore caller migrations. OMN-17554 owns the final ModelSecretBackend extra-forbid baseline removal;
  this ticket owns only service-account-mount Kubernetes authority. This contract records static and local
  test obligations only; it makes no runtime, deployment, or activation claim.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: >-
      Static OCC tests prove every stale item is retained and followed by the exact pending supersession,
      and prove the companion names all typed authorities and integration dependencies.
    command: "uv run pytest tests/unit/test_omn_17555_contract_supersession.py -q"
  - kind: "tests"
    description: >-
      From the OMN-17555 omnibase_core checkout, the seven focused migration suites and staged Pydantic
      ratchet must pass before integration, subject to the declared OMN-17554/17570/17571 dependencies.
    command: >-
      uv run pytest tests/unit/artifacts/test_artifact_store.py tests/unit/cli/test_cli_hooks.py tests/unit/models/dispatch/test_model_dispatch_lifecycle_event.py
      tests/unit/models/runtime/test_model_runtime_aliveness_probe.py tests/unit/models/security/test_model_secret_backend.py
      tests/unit/models/services/test_model_node_service_config.py tests/unit/models/workflow/test_model_workflow_state_snapshot_validation.py
      -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-static-contract-supersession"
    description: >-
      Hosted-and-local static validation proves the five historical contracts retain their original evidence
      and append exact pending supersession entries, while this companion declares the seven typed authorities
      and OMN-17554/17565/17566/17570/17571 sequencing without runtime claims.
    source: "manual"
    execution_scope: "hosted_and_local"
    status: "pending"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_omn_17555_contract_supersession.py -q"
  - id: "dod-core-seven-migration-suites"
    description: >-
      Local pending evidence from the OMN-17555 omnibase_core checkout covers all seven explicit configuration
      migrations, their ambient-environment negative controls, and serialized contract behavior. It does
      not claim the dependent integration tickets have landed.
    source: "manual"
    execution_scope: "local_done_gate"
    status: "pending"
    checks:
      - check_type: "test_passes"
        check_value: >-
          uv run pytest tests/unit/artifacts/test_artifact_store.py tests/unit/cli/test_cli_hooks.py tests/unit/models/dispatch/test_model_dispatch_lifecycle_event.py
          tests/unit/models/runtime/test_model_runtime_aliveness_probe.py tests/unit/models/security/test_model_secret_backend.py
          tests/unit/models/services/test_model_node_service_config.py tests/unit/models/workflow/test_model_workflow_state_snapshot_validation.py
          -q
  - id: "dod-core-lifecycle-contract-ratchets"
    description: >-
      Local pending evidence proves ModelLifecycleChain rejects unknown fields, no longer appears in the
      Pydantic extra-forbid baseline, and has no ambient heartbeat-key read. OMN-17554 and OMN-17570 own
      the remaining staged ModelSecretBackend and ModelNodeServiceConfig ratchet work.
    source: "manual"
    execution_scope: "local_done_gate"
    status: "pending"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pre-commit run pydantic-extra-forbid --files src/omnibase_core/models/dispatch/model_lifecycle_chain.py
          src/omnibase_core/validators/extra_forbid_baseline.yaml tests/unit/models/dispatch/test_model_dispatch_lifecycle_event.py
          && uv run pre-commit run no-new-env-vars --files src/omnibase_core/models/dispatch/model_lifecycle_chain.py
