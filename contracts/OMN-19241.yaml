      - id: "AC2"
        statement: |-
          AC2: A failed quarantine does not cause records already replayed in the same run to be replayed again on the next run -- falsifier: a pytest drives one run where record N fails quarantine and records N+1 to N+3 are replayed, then a second run, and asserts the replay producer received N+1 to N+3 exactly once in total
      - id: "AC3"
        statement: |-
          AC3: On the live dev lane one dead letter is replayed at most the configured maximum and then quarantined -- falsifier: rpk topic consume on onex.dlq.omnibase-infra.quarantine.v1 on the .201 dev lane shows the record, and the x-replay-count headers for its correlation on the source topic stop at the maximum
