    acceptance:
      - id: "AC1"
        statement: |-
          AC1: At most one writer holds the ledger lock when two waiters race to break a dead holder's lock -- falsifier: uv run pytest tests/unit/scripts/test_ledger_lock_single_holder.py -q driving the real LedgerLock with one waiter paused after its liveness probe; fails against 6fe05c356 with both waiters acquired
      - id: "AC2"
        statement: |-
          AC2: A writer whose lock was taken over cannot free the current holder when it releases -- falsifier: uv run pytest tests/unit/scripts/test_ledger_lock_single_holder.py -q -k release_foreign, asserting a third acquire with a zero timeout raises TimeoutError
      - id: "AC3"
        statement: |-
          AC3: The roll and a lane append on the same ledger exclude each other with the roll's exported LEDGER_LOCK_ROOT set -- falsifier: uv run pytest tests/unit/scripts/test_ledger_lock_single_holder.py -q -k roll_and_append
      - id: "AC4"
        statement: |-
          AC4: A holder killed with SIGKILL mid-append leaves no lock that blocks the next writer -- falsifier: uv run pytest tests/unit/scripts/test_ledger_lock_single_holder.py -q -k killed_holder
      - id: "AC5"
        statement: |-
          AC5: The omni_home copy lanes run is byte-identical to omnibase_infra dev after the change lands -- falsifier: cmp $OMNI_HOME/scripts/ledger_lock.py $OMNI_HOME/omnibase_infra/scripts/ledger_lock.py
