requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A visitor uploads a usage export and the page renders a saving computed from the rows in that file -- falsifier: two uploads with different model mixes produce the same headline figure, or the figure changes when no row changed.
      - id: "AC2"
        statement: |-
          AC2: The parser reads only category and model columns, and refuses a file carrying prompt text, naming the column it refused -- falsifier: a CSV with a prompt or content column is accepted, or an uploaded cell appears in a server log or a stored row.
      - id: "AC3"
        statement: |-
          AC3: The saving is computed through one named pricing authority, not a marketing constant and not a second copy -- falsifier: pytest finds a waste, recovery, keep or fee style literal in the explorer's math, or the same input priced through the explorer and through pricing_manifest disagrees.
      - id: "AC4"
        statement: |-
          AC4: The figure names on screen that it is a modelled counterfactual and which baseline model it was modelled against -- falsifier: the page states a saving with no baseline model named, or names a baseline the pricing authority does not carry.
      - id: "AC5"
        statement: |-
          AC5: The first estimate runs with no account, and the second attempt and every download or print is gated on an email -- falsifier: a third estimate completes anonymously, or a download succeeds without an email.
      - id: "AC6"
        statement: |-
          AC6: Email capture, the share link and the login-versus-no-login arm each emit one event, and the arm is recorded on the estimate -- falsifier: a submitted email produces no PostHog event, or an estimate carries no arm.
      - id: "AC7"
        statement: |-
          AC7: The leaderboard publishes nothing identifying -- falsifier: a leaderboard row resolves to an email address, an email domain, or an uploaded filename.
