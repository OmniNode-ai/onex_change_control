---
schema_version: "1.0.0"
ticket_id: OMN-16753
title: Central OCC evidence for the OMN-16753 prod-promotion grant — staged by the onexbot-occ-writer
  App, then REVOKED through the same App-authored path
summary: >-
  Central OCC evidence for the full lifecycle of the two OMN-16753 prod-promotion grant entries on onex_change_control@main
  — a same-digest runtime authorization (sha256:13c96028…) and the onex-api promotion (sha256:bc95b9bc…).
  STAGED by the onexbot-occ-writer GitHub App and merged by the CODEOWNER in OCC#8571 (5df6a9d6bb, 2026-09-07T15:31Z);
  NEVER CONSUMED — no deploy-onex-prod.yml dispatch ever ran against either digest; REVOKED on 2026-09-08
  on the operator's ruling, through the same App-authored workflow that staged them. Three reasons for
  the revocation, none of them a defect in the grant itself. First, the ruling: the operator's word is
  the authority on this file, and it is recorded verbatim in the durable OPERATOR-CONSENT row the revocation
  PR cites by file and line. Second, the grant's own stability-proven premise had eroded — the .201 stability-test
  lane, the surface a stability-proven claim resolves from, was OOM-looping, so the premise the entries
  were approved against no longer described the lane. Third, the sanctioned stability refresh path refuses
  to run while live prod grants sit in the registry, so the entries were actively blocking the repair
  of the very lane their premise depends on. The revocation is a pure REMOVAL back to `entries: []` at
  rest — the diff shape OCC#5382 and OCC#7554 established: remove the entries, leave every header comment
  line byte-untouched. It is App-authored for the same reason the staging was: operator ruling 2026-09-08,
  firm — revocation is the same file, the same gate and the same lifecycle, so it goes through the same
  process, and a hand-opened PR recreates the self-approval deadlock the 2026-09-06 ruling exists to end.
  NOTHING ABOUT PROD IS MUTATED: the revocation removes an authorization, not a workload. Nothing is dispatched,
  deployed, rolled back or restarted, and onex-prod keeps running exactly the images it is running now.
  This contract lives on the PR branch itself because occ-preflight pins OCC evidence at the PR head SHA
  for onex_change_control's own PRs (invariant I3, in-tree checkout) — the same shape OCC#7418, OCC#7731,
  OCC#7899 and OCC#8571 used on this base.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: manual
    description: >-
      Prod-promotion grant registry state, producer-side schema validation, and consumer-side gate resolution
      for the OMN-16753 grant lifecycle at its revoked terminus: the registry is back at `entries: []`
      at rest and the consumer refuses BOTH OMN-16753 digests for EVERY dispatcher.
    command: >-
      grep -Eq '^entries: \[\]$' grants/prod_promotion_grants.yaml
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-prod-promotion-grant-values-omn16753-app"
    description: >-
      REVOKED STATE. The prod-promotion grant registry (grants/prod_promotion_grants.yaml) no longer carries
      either OMN-16753 entry, nor their shared promotion_batch_id: grant-80201a19-7077-4d1d-a58f-3f7760117e68
      (omninode-runtime sha256:13c96028…, the same-digest authorization the unconditional runtime gate
      resolved from k8s/onex-prod/runtime/kustomization.yaml) and grant-3c187f1e-b4b8-4fbe-a4cb-6bca31c1b2a1
      (omnicloud/core sha256:bc95b9bc…, the onex-api promotion) are both gone, batch-3c59f394-5a40-4b44-b8e7-ed869d24c2cb
      with them, and the file is back to `entries: []` at rest. This item previously asserted the OPPOSITE
      — that both entries were PRESENT — and it is inverted here rather than deleted, precisely so the
      reversal stays legible in this file's own history instead of vanishing from it. Falsifiable in the
      useful direction: it FAILS on onex_change_control@main at 5df6a9d6bb, where both entries are live,
      and passes only on a tree where the revocation has been applied.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          ! grep -Fq 'grant-80201a19-7077-4d1d-a58f-3f7760117e68' grants/prod_promotion_grants.yaml &&
          ! grep -Fq 'grant-3c187f1e-b4b8-4fbe-a4cb-6bca31c1b2a1' grants/prod_promotion_grants.yaml &&
          ! grep -Fq 'batch-3c59f394-5a40-4b44-b8e7-ed869d24c2cb' grants/prod_promotion_grants.yaml &&
          grep -Eq '^entries: \[\]$' grants/prod_promotion_grants.yaml
  - id: "dod-prod-promotion-grant-validation-omn16753-app"
    description: >-
      The repo's own grant-schema suite passes against the REVOKED grant file — including the OMN-13424
      at-rest invariant that refuses any expired entry, which an empty registry satisfies vacuously and
      permanently. The same suite now also carries the revoke-mode cases for the removal itself: that
      every named entry must be present, that a result leaving an expired entry is refused, and that the
      header bytes above `entries:` survive the rewrite unchanged. Stated plainly so the suite is not
      over-read: this is a SCHEMA and removal-logic gate, not an authorization gate. It proves the revoked
      file is WELL-FORMED and that the removal that produced it is the one that was asked for. It does
      not prove the revocation was required — the authority for that is the operator ruling — and it does
      not prove the revocation took EFFECT, which is the separate consumer-gate item below. Executed hermetically
      from the repo checkout, no network.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_prod_promotion_grants.py -q"
  - id: "dod-grant-consumer-gate-omn16753-app"
    description: >-
      THE ITEM THAT PROVES THE REVOCATION TOOK EFFECT, as opposed to merely being written down. The CONSUMER
      of this grant file — omninode_infra's scripts/validate_prod_promotion_grant.py (OMN-14209, extended
      by OMN-17357), the exact script deploy-onex-prod.yml runs — was resolved against the revoked file
      via its own --grants-file offline path, in two legs, WITH A POSITIVE CONTROL. Leg A is how a dispatch
      would actually run today, with no staging-green report: all four dispatcher/digest combinations
      exit 1 on the OMN-17357 staging-green premise BEFORE the grant anchor is read, so leg A on its own
      says nothing about the grant and is reported rather than leaned on. Leg B supplies a synthetic GREEN
      report SOLELY to get past that premise and isolate the grant anchor; it is a fixture and is emphatically
      not evidence that staging is green — it is not, which is part of why these grants were revoked.
      On leg B against the revoked file all four combinations exit 1 on `[prod-grant] BLOCKED (absent):
      no grant entry found`: the authorization is gone for both digests and for every dispatcher, not
      merely expired or marked consumed. THE POSITIVE CONTROL is the same leg-B probe run against a checkout
      of onex_change_control@main at 5df6a9d6bb, where daniyalabbas96 gets exit 0 PASS on both digests
      and jonahgabriel gets exit 1 BLOCKED (self_granted) on both. That control is what makes the four
      BLOCKED (absent) readings a measurement rather than a silently broken probe — a no-op probe would
      have returned the same four blocks against BOTH trees, and it did not. CROSS-REPO by construction,
      which is why the hosted check_value is the receipt-grep form: the consumer lives in the PRIVATE
      omninode_infra repo, which the OCC runner has no checkout of and no token for, so a gh-api check_value
      would fail for lack of read access rather than for lack of evidence. The receipt carries all three
      blocks verbatim.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-16753/dod-grant-consumer-gate-omn16753-app/command.yaml
  - id: "dod-grant-author-identity-omn16753-app"
    description: >-
      The PR staging this grant is authored by the onexbot-occ-writer GitHub App (app id 4361937), not
      by the CODEOWNER who will review and merge it. This is the structural fix the operator ruled for
      on 2026-09-06: the two prior stagings were opened by the CODEOWNER, and GitHub will not record an
      approval by a PR's own author, so the review half of the OMN-13418 gate could not be exercised at
      all. Falsifiable directly against the GitHub API — a PR authored by any human login fails this check.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json author,baseRefName,headRefName
  - id: "occ-self-bind-pr-omn16753-app"
    description: >-
      The OCC PR carrying this re-stage — self-bind for the OMN-16753 prod-promotion grant (onex-prod
      runtime same-digest authorization + the onex-api promotion). OPEN against onex_change_control@main
      and NOT to be merged by any agent: the CODEOWNERS merge is the approval act (OMN-13418), and merging
      it does not lift the prod-dispatch hold.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid"
  - id: "dod-grant-author-identity-omn16753-revoke"
    description: >-
      The PR REVOKING this grant is authored by the onexbot-occ-writer GitHub App (app id 4361937), not
      by the CODEOWNER who reviews and merges it — the same structural property the staging PR carries,
      and for the same reason. Operator ruling 2026-09-08, firm: revocation is the same file, the same
      gate and the same lifecycle as staging, so it goes through the same App-authored process. The first
      revocation attempt was opened by hand under the CODEOWNER's identity, because the App path was add-only
      by construction and had no revocation mode; that PR recreated exactly the self-approval deadlock
      the 2026-09-06 ruling exists to end, and it is superseded by this one. The gap is now closed in
      the workflow itself (mode: revoke), not by remembering to do it correctly. Falsifiable directly
      against the GitHub API — a PR authored by any human login fails this check, and the workflow fails
      its own run rather than opening one.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json author,baseRefName,headRefName
  - id: "occ-self-bind-pr-omn16753-revoke"
    description: >-
      Self-bind for the OMN-16753 grant REVOCATION PR — the hotfix/* PR against onex_change_control@main
      that removes both prod-promotion grant entries and returns grants/prod_promotion_grants.yaml to
      `entries: []` at rest, leaving every header comment line byte-untouched. Authorised by the operator
      ruling of 2026-09-08, recorded verbatim in the durable OPERATOR-CONSENT row this PR's body cites
      by file and line. Unlike the staging PR it reverses, MERGED is the correct terminal state for this
      one: an open revocation revokes nothing, and both entries stay live on main until it lands. No agent
      merges it — the CODEOWNERS review is still the act. NO PROD MUTATION of any kind: this PR dispatches
      nothing, deploys nothing, rolls back nothing and restarts nothing. onex-prod keeps running exactly
      the images it is running now; what is removed is permission, not workload.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid"
