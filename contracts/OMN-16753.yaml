---
schema_version: "1.0.0"
ticket_id: OMN-16753
title: Central OCC evidence for the OMN-16753 prod-promotion grant — staged by the onexbot-occ-writer
  App, then REVOKED on operator ruling
summary: >-
  Central OCC evidence for the hotfix/* PR that re-stages the two prod-promotion grant entries the OMN-16753
  api.omninode.ai cutover needs on onex_change_control@main — a same-digest runtime authorization (sha256:13c96028…)
  and the onex-api promotion (sha256:bc95b9bc…). This staging differs from its two predecessors in ONE
  structural respect that is the whole point of it: the PR is authored by the onexbot-occ-writer GitHub
  App, not by the CODEOWNER, so the CODEOWNER's review and merge is a genuine second party rather than
  a self-approval GitHub would refuse to record. OCC#7418 (merged, never consumed, lapsed 2026-08-30)
  and OCC#7899 (opened 2026-08-31, never merged, lapsed 2026-09-02) were both authored by the CODEOWNER;
  this PR supersedes OCC#7899. The image digests are byte-identical across all three — only the grant_ids,
  batch id, created_at and expires_at are new. PREP ONLY: this contract proves the PR is well-formed,
  locally validated against BOTH the producer-side schema suite and the consumer-side k3s gate, and CI-clean.
  It does NOT authorize prod mutation and it is NOT the approval act. The prod-dispatch hold is independent
  of it and unchanged. This contract lives on the PR branch itself because occ-preflight pins OCC evidence
  at the PR head SHA for onex_change_control's own PRs (invariant I3, in-tree checkout) — the same shape
  OCC#7418, OCC#7731 and OCC#7899 used on this base. REVOCATION, 2026-09-08 — this contract now records
  the END of that authorization's life, not only its staging. The two entries landed on main in OCC#8571
  (merge 5df6a9d6bb, 2026-09-07T15:31Z) and were never consumed: no deploy-onex-prod.yml dispatch ever
  ran against either digest. On 2026-09-08 the operator ruled that they be revoked. Three independent
  reasons, none of which is a defect in the grant itself. First, the ruling: the operator's word is the
  authority on this file, and it is recorded verbatim in the durable consent row this PR cites by file
  and line. Second, the grant's own stability-proven premise had already eroded — the .201 stability-test
  lane, which is the surface a stability-proven claim is resolved from, was OOM-looping, so the premise
  the entries were approved against no longer described the lane. Third, the sanctioned stability refresh
  path refuses to run while live prod grants sit in the registry, so the entries were actively blocking
  the repair of the very lane their own premise depends on. Revoking them is therefore not merely permitted
  by the ruling, it is the precondition for restoring the evidence base any FUTURE grant would rest on.
  The revocation is a pure REMOVAL back to `entries: []` at rest — the diff shape OCC#5382 and OCC#7554
  established: remove entries, leave every header comment byte-untouched. That is also the shape the add-only
  staging path requires, since stage-prod-promotion-grant.yml refuses to render a new request unless main
  already ends with `entries: []`. NOTHING ABOUT PROD IS MUTATED BY THE REVOCATION: it removes an authorization,
  it does not deploy, roll back or restart anything, and onex-prod keeps running exactly the images it
  is running now.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: manual
    description: >-
      Prod-promotion grant registry state, producer-side schema validation, and consumer-side gate resolution
      for the OMN-16753 grant lifecycle, now at its revoked terminus: the registry is back at `entries:
      []` at rest and the consumer refuses BOTH OMN-16753 digests for EVERY dispatcher.
    command: >-
      grep -Eq '^entries: \[\]$' grants/prod_promotion_grants.yaml
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-prod-promotion-grant-values-omn16753-app"
    description: >-
      REVOKED STATE. The prod-promotion grant registry (grants/prod_promotion_grants.yaml) no longer carries
      either OMN-16753 entry, nor their shared promotion_batch_id: grant-80201a19-7077-4d1d-a58f-3f7760117e68
      (omninode-runtime sha256:13c96028…, the same-digest authorization the unconditional runtime gate
      resolved from k8s/onex-prod/runtime/kustomization.yaml) and grant-3c187f1e-b4b8-4fbe-a4cb-6bca31c1b2a1
      (omnicloud/core sha256:bc95b9bc…, the onex-api promotion) are both gone, batch-3c59f394-5a40-4b44-b8e7-ed869d24c2cb
      with them, and the file is back to `entries: []` at rest. This item previously asserted the OPPOSITE
      — that both entries were PRESENT — and it is inverted here rather than deleted, precisely so the
      reversal stays legible in this file's own history instead of vanishing from it. Falsifiable in the
      useful direction: it FAILS on onex_change_control@main at 5df6a9d6bb, where both entries are live,
      and passes only on a tree where the revocation has been applied.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          ! grep -Fq 'grant-80201a19-7077-4d1d-a58f-3f7760117e68' grants/prod_promotion_grants.yaml &&
          ! grep -Fq 'grant-3c187f1e-b4b8-4fbe-a4cb-6bca31c1b2a1' grants/prod_promotion_grants.yaml &&
          ! grep -Fq 'batch-3c59f394-5a40-4b44-b8e7-ed869d24c2cb' grants/prod_promotion_grants.yaml &&
          grep -Eq '^entries: \[\]$' grants/prod_promotion_grants.yaml
  - id: "dod-prod-promotion-grant-validation-omn16753-app"
    description: >-
      The repo's own grant-schema suite passes against the REVOKED grant file — including the OMN-13424
      at-rest invariant that refuses any expired entry, which an empty registry satisfies vacuously and
      permanently. Stated plainly so the suite is not over-read: this is a SCHEMA gate, not an authorization
      gate. It passed on the staged file too (23 passed, two live entries) and it passes on the revoked
      one (18 passed; the five fewer cases are the per-entry parametrisations that no longer have entries
      to bind to, not five checks that were lost). So this item proves the revoked file is WELL-FORMED.
      It does not prove the revocation was required — the authority for that is the operator ruling —
      and it does not prove the revocation took EFFECT, which is the separate consumer-gate item below.
      Executed hermetically from the repo checkout, no network.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_prod_promotion_grants.py -q"
  - id: "dod-grant-consumer-gate-omn16753-app"
    description: >-
      THE ITEM THAT PROVES THE REVOCATION TOOK EFFECT, as opposed to merely being written down. The CONSUMER
      of this grant file — omninode_infra's scripts/validate_prod_promotion_grant.py (OMN-14209, extended
      by OMN-17357), the exact script deploy-onex-prod.yml runs — was resolved against this branch's revoked
      file via its own --grants-file offline path, in two legs, WITH A POSITIVE CONTROL. Leg A is how
      a dispatch would actually run today, with no staging-green report: all four dispatcher/digest combinations
      exit 1 on the OMN-17357 staging-green premise BEFORE the grant anchor is read, so leg A on its own
      says nothing about the grant and is reported rather than leaned on. Leg B supplies a synthetic GREEN
      report SOLELY to get past that premise and isolate the grant anchor; it is a fixture and is emphatically
      not evidence that staging is green — it is not, which is part of why these grants were revoked.
      On leg B against this branch all four combinations exit 1 on `[prod-grant] BLOCKED (absent): no
      grant entry found`: the authorization is gone for both digests and for every dispatcher, not merely
      expired or marked consumed. THE POSITIVE CONTROL is the same leg-B probe run against a checkout
      of onex_change_control@main at 5df6a9d6bb, where daniyalabbas96 gets exit 0 PASS on both digests
      and jonahgabriel gets exit 1 BLOCKED (self_granted) on both. That control is what makes the four
      BLOCKED (absent) readings a measurement rather than a silently broken probe — a no-op probe would
      have returned the same four blocks against BOTH trees, and it did not. CROSS-REPO by construction,
      which is why the hosted check_value is the receipt-grep form: the consumer lives in the PRIVATE
      omninode_infra repo, which the OCC runner has no checkout of and no token for, so a gh-api check_value
      would fail for lack of read access rather than for lack of evidence. The receipt carries all three
      blocks verbatim.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-16753/dod-grant-consumer-gate-omn16753-app/command.yaml
  - id: "dod-grant-author-identity-omn16753-app"
    description: >-
      HISTORICAL, and re-pinned so it stays true after the revocation. The PR that STAGED this grant —
      OCC#8571, merged 5df6a9d6bb — was authored by the onexbot-occ-writer GitHub App (app id 4361937),
      not by the CODEOWNER who reviewed and merged it. That was the structural fix the operator ruled
      for on 2026-09-06, and it is unchanged by the revocation. The check_value moves from a live `gh
      pr view ${PR_NUMBER}` to the receipt-grep form for two stacked reasons: ${PR_NUMBER} now resolves
      to the REVOCATION PR, which IS authored by the CODEOWNER and would make this item read false about
      a fact that has not changed; and pinning the literal PR number in a check_value is refused by the
      OMN-9350 check_value lint. The pinned API readback therefore lives verbatim in the receipt — the
      same shape this contract already uses for the cross-repo consumer-gate item. The asymmetry is deliberate
      rather than a concession: the App-authorship requirement exists so that GRANTING has a genuine second
      party, and it has no revocation analogue, because removing an authorization strictly reduces what
      is permitted and a self-authored revocation cannot escalate anything. The revocation PR is CODEOWNERS-reviewed
      regardless, like any other change to this file.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q '^status: PASS$' drift/dod_receipts/OMN-16753/dod-grant-author-identity-omn16753-app/command.yaml
  - id: "occ-self-bind-pr-omn16753-app"
    description: >-
      The OCC PR carrying this re-stage — self-bind for the OMN-16753 prod-promotion grant (onex-prod
      runtime same-digest authorization + the onex-api promotion). OPEN against onex_change_control@main
      and NOT to be merged by any agent: the CODEOWNERS merge is the approval act (OMN-13418), and merging
      it does not lift the prod-dispatch hold.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid"
  - id: "occ-self-bind-pr-omn16753-revoke"
    description: >-
      Self-bind for the OMN-16753 grant REVOCATION PR — the hotfix/* PR against onex_change_control@main
      that removes both prod-promotion grant entries and returns grants/prod_promotion_grants.yaml to
      `entries: []` at rest. Authorised by the operator ruling of 2026-09-08, recorded verbatim in the
      durable OPERATOR-CONSENT row this PR's body cites by file and line. Unlike the staging PR it reverses,
      MERGED is the correct terminal state for this one: an open revocation authorises nothing away, and
      both entries stay live on main until it lands. It is authored by the CODEOWNER because the App-authored
      staging path is add-only by construction — stage-prod-promotion-grant.yml renders a request bundle
      onto a registry it requires to already read `entries: []`, so it has no revocation mode to invoke
      — which means the approving review must come from the OTHER @OmniNode-ai/platform-leads member,
      since GitHub does not record an approval by a PR's own author. NO PROD MUTATION of any kind: this
      PR dispatches nothing, deploys nothing, rolls back nothing and restarts nothing. onex-prod keeps
      running exactly the images it is running now; what is removed is permission, not workload.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "gh pr view ${PR_NUMBER} --repo OmniNode-ai/onex_change_control --json number,state,baseRefName,headRefName,headRefOid"
