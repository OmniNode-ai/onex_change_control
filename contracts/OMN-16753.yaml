title: Central OCC evidence for the OMN-16753 prod-promotion grant re-stage landing on main
summary: >-
  Central OCC evidence for the hotfix/* PR that re-stages the two prod-promotion grant entries the OMN-16753
  api.omninode.ai cutover needs on onex_change_control@main — a same-digest runtime authorization (sha256:13c96028…)
  and the onex-api promotion (sha256:bc95b9bc…) — under promotion_batch_id batch-c465ba57-1510-4c7d-957b-e266dfe0dc8a.
  This is a RE-STAGE of the never-consumed OCC#7418 grant (grant-7ebd7674 / grant-7013b49e, batch-404af076),
  which lapsed at its own 2026-08-30T16:00:00Z expiry and was pruned on 2026-08-30; the image digests
  are byte-identical and only the ids, batch and expires_at are new. PREP ONLY: this contract proves the
  PR itself is well-formed, locally validated against BOTH the producer-side schema suite and the consumer-side
  k3s gate, and CI-clean; it does NOT authorize prod mutation and it is NOT the approval act. The PR still
  requires a human CODEOWNERS operator's explicit merge per OMN-13418, and the prod-dispatch hold is independent
  of it. This contract exists on the PR branch itself because occ-preflight pins OCC evidence at the PR
  head SHA for onex_change_control's own PRs (invariant I3, in-tree checkout) — the same shape OCC#7418
  (OMN-16799) and OCC#7731 (OMN-16702) used on this same base.
