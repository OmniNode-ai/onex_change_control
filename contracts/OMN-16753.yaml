title: Central OCC evidence for the OMN-16753 prod-promotion grant re-stage, authored by the onexbot-occ-writer
  App
summary: >-
  Central OCC evidence for the hotfix/* PR that re-stages the two prod-promotion grant entries the OMN-16753
  api.omninode.ai cutover needs on onex_change_control@main — a same-digest runtime authorization (sha256:13c96028…)
  and the onex-api promotion (sha256:bc95b9bc…) — under promotion_batch_id batch-69f9b499-38b0-4e9c-9838-44bdfbd00982.
  This PR is authored by the GitHub App onexbot-occ-writer, deliberately: GitHub does not let a user approve
  their own pull request, so the operator-authored predecessor OCC#7899 was structurally unapprovable
  by the very CODEOWNERS operator whose merge OMN-13418 defines as the approval act. #7899 also lapsed
  at its own 2026-09-02T16:00:00Z expiry and cannot land as written. The image digests are byte-identical
  across #7418, #7899 and this PR; only the grant ids, the batch id, the timestamps and the authoring
  identity are new. PREP ONLY: this contract proves the PR is well-formed, locally validated against BOTH
  the producer-side schema suite and the consumer-side gate, and CI-clean. It does NOT authorize prod
  mutation and it is NOT the approval act. The prod-dispatch hold is independent of it and stays in force.
  This contract lives on the PR branch because occ-preflight pins OCC evidence at the PR head SHA for
  onex_change_control's own PRs (invariant I3) — the same shape OCC#7418 and OCC#7899 used on this base.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
