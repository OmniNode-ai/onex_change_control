  - id: "dod-omn16095-retry-transient-failure"
    description: "Direct proof of the retry fix (defect 2): a transient `gh api` failure (\"unexpected
      EOF\") that resolves within 3 attempts still succeeds, consuming exactly 2 retries + 1 success —
      never killing the job on a single blip. Falsifiable: reverting `fetch_paginated`'s retry loop back
