---
schema_version: "1.0.0"
ticket_id: "OMN-16095"
title: "OCC CI Summary poller — fully paginate check-runs/jobs reads, bounded retry on transient API failures"
summary: "Fixes two proven poller defects. (1) The check-runs/jobs reads feeding the CI Summary poll loop
  used `gh api ... --paginate` piped straight to a file; for these OBJECT-rooted endpoints (`{\"total_count\":N,\"check_runs\":[...]}`),
  `--paginate` alone prints each page as a SEPARATE JSON document instead of merging them (`gh help api`).
  On a head crossing the 100-per-page boundary (105 observed on OCC PR #6552) the file held two concatenated
  JSON objects; `json.loads()` raised, and `_load_check_runs()` silently returned `None`, which `evaluate_external_contexts()`
  reads as \"no context observed\" — the poll never resolves and hangs to its 90-minute deadline. Fixed
  by combining `--slurp` with a `jq` merge (`map(.check_runs) | add` / `map(.jobs) | add`) that collapses
  every page into one valid document before ci_summary_gate.py ever sees it; `latest_check_run_by_name()`'s
  existing per-name \"latest wins\" collapse is untouched — fetch-only fix. (2) A bare `gh api ...` under
  `set -e` treated one transient failure (observed: \"unexpected EOF\") as fatal, killing the job with
  every real gate green or still legitimately running. Both fetch call sites now go through a bounded
  retry (3 attempts, exponential backoff); only once retries are exhausted does the poll fall back to
  an empty-but-validly-shaped payload, which the gate evaluates as PENDING — a persistent outage still
  fails closed at the poll loop's deadline, it just never crashes the script on a single blip. Self-authored
  by the implementer for this ticket's OWN carrier PR (self-bind pattern, per the OMN-16007 precedent
  this contract follows) — a self-contained, gate-mechanical change confined to .github/workflows/ci.yml's
  CI Summary poll step and its regression suite."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
