      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The public quickstart and the org profile README carry a supported-platforms statement naming Apple Silicon macOS and Linux x86_64 and arm64, and naming Intel macOS either as unsupported or with its from-source prerequisites (Rust toolchain, brew install openssl@3, OPENSSL_DIR) -- falsifier: git show origin/main:guides/onex-plugin-quickstart.md in the public knowledge-base piped to grep -ci 'supported platforms' printing 0
      - id: "AC2"
        statement: |-
          AC2: omnibase/install.sh and the plugin install hint detect Darwin on x86_64 before any package install and stop with a message naming the supported platforms and the documented alternative (container or from-source), instead of reaching the source build -- falsifier: a run of install.sh on Darwin with uname -m reporting x86_64 that reaches a uv sync or uv tool install step
      - id: "AC3"
        statement: |-
          AC3: The install canary's workflow states which platforms it covers, and Intel macOS is either in its matrix or named as uncovered in the AC1 statement -- falsifier: a canary matrix with only arm64 macOS legs alongside a supported-platforms statement that lists Intel macOS as supported
      - id: "AC4"
        statement: |-
          AC4: The decision on the cryptography floor is recorded beside the pin: keep the CVE floor and document the Intel path, or lower it with the CVE consequence stated -- falsifier: pyproject.toml in omnibase_core carrying the cryptography>=50 pin with no comment naming the platform consequence
