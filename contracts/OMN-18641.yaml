          import pathlib, sys
          text = pathlib.Path('allowlists/scripts_exceptions.yaml').read_text()
          path_registered = 'scripts/validation/check_expiring_dod_checks.py' in text
          implementation_absent = not pathlib.Path('scripts/validation/check_expiring_dod_checks.py').exists()
          sys.exit(0 if path_registered and implementation_absent else 1)
          PY
