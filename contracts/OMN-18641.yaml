schema_version: "1.0.0"
ticket_id: "OMN-18641"
title: "Register the expiring DoD check before it lands"
summary: >
  The human-authored half of the OMN-18641 gate split registers the future expiring-DoD-check validator
  path in the script exception allowlist. The implementation PR must land separately under the App identity
  because the same PR cannot touch both authorization registry data and CI validation code without tripping
  the repository author guards.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: "The allowlist entry exists and this PR does not add the validator implementation."
    command: |-
      uv run python - <<'PY'
      import pathlib, sys, yaml
      data = yaml.safe_load(pathlib.Path('allowlists/scripts_exceptions.yaml').read_text())
      entries = data.get('exceptions') or data.get('scripts') or data
      text = pathlib.Path('allowlists/scripts_exceptions.yaml').read_text()
      ok = 'scripts/validation/check_expiring_dod_checks.py' in text and not pathlib.Path('scripts/validation/check_expiring_dod_checks.py').exists()
      sys.exit(0 if ok else 1)
      PY
