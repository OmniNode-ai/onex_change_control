---
schema_version: 1.0.0
ticket_id: OMN-20862
title: Dispatch-venv drift is a typed VENV_DRIFT placement result, never a run of no-host refusals (AC-M4)
summary: Evidence companion for OmniNode-ai/omnimarket#3703 at 529e859d6f28016d0e3dbe722693458053492a39.
  Placement and RuntimeLocal contract tests ran on lab h101; source readback distinguishes the drift handler
  from its absence. No production deployment is claimed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-drift-is-a-typed-placement-result
    statement: Dispatch-venv drift is a typed placement result with one reconcile intent, and equal hashes
      admit.
    acceptance:
      - id: AC4
        statement: 'AC4 (AC-M4): given a launching host whose dispatch venv lock hash differs from the
          lab host''s declared hash, the placement admission returns a typed VENV_DRIFT result naming
          both hashes and runs the reconcile (or emits a reconcile command) once, rather than rejecting
          each lane as no-host; given equal hashes it admits. A lane that finds no host because of drift
          fails the test unless a VENV_DRIFT event was emitted -- falsifier: test_venv_drift_placement.py
          failing when a fixture whose every host is refused for drift returns anything but VENV_DRIFT
          with both hashes and exactly one reconcile intent, or when equal hashes do not admit'
  - id: req-plugin-parity-accepts-adopted-files
    statement: After adopt-merged copies a merged PR's files into the installed cache, the host's plugin
      parity check passes without a version bump, an unmerged hot-patch still fails, and the launching
      host's probe no longer reports the plugin as parity-failed.
    acceptance:
      - id: AC1
        statement: 'AC1: after adopt-merged copies a merged PR''s files into the installed cache, the
          plugin parity check passes on that host with no version bump installed'
      - id: AC2
        statement: 'AC2: a cache file that matches no merged revision (an unmerged hot-patch) still fails
          parity as modified'
      - id: AC3
        statement: 'AC3: on the lab run after the next adoption, the launching host''s probe reading carries
          no PARITY-FAILED: plugin:omni'
evidence_requirements:
  - kind: tests
    description: 'AC-M4: drift returns VENV_DRIFT with both hashes and one reconcile intent, equal hashes
      admit, and the decision completes over the node''s contract.'
    command: uv run pytest tests/nodes/node_remote_lane_compute/test_venv_drift_placement.py tests/nodes/node_remote_lane_compute/test_runtime_local_remote_lane.py
      -q -p no:randomly
emergency_bypass:
