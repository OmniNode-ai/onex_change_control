      - id: "AC2"
        statement: |-
          AC2: An unattributed delegation terminal never falls back to the writer's own configured tenant, the house tenant, or a database tenant default, including when the writer has a nonempty configured tenant and ENFORCE_TENANT_ISOLATION is disabled -- falsifier: uv run pytest parametrizes sync and async terminal writers with absent and blank tenant fields, distinct nonempty writer settings, and both enforcement settings; any write or configured/default tenant stamp fails the check.
      - id: "AC3"
        statement: |-
          AC3: A declared and resolvable tenant remains the stored row's tenant even when the writer's configured tenant differs, on both terminal writer paths -- falsifier: uv run pytest uses a registry tenant A and writer tenant B, drives each terminal handler, and asserts exactly 1 row attributed to A and no row attributed to B.
      - id: "AC4"
        statement: |-
          AC4: The OMN-19972 local-compose AC8 negative control is rerun after the fix on an authorized isolated lane and records 0 rows for a fresh unattributed delegation, a refusal naming the missing tenant, and a declared-tenant positive control with exactly 1 row -- falsifier: correlation-scoped Postgres readback and writer refusal readback for the negative and positive controls; any negative-control row or an absent positive-control row fails the check.
