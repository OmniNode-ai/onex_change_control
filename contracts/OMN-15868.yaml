---
schema_version: "1.0.0"
ticket_id: "OMN-15868"
title: "BaseProjectionRunner.run() retry-loop guard never enters -- every projection writer exits clean
  after fake \"0 retries\""
summary: >
  DoD contract for OMN-15868: omnimarket/src/omnimarket/projection/runner.py's __init__ sets self._running
  = False, and run()'s while-guard read `self._running is not False` -- always False on a freshly constructed
  runner (Python singleton identity), so the retry-loop body (the only site that constructs AIOKafkaConsumer,
  awaits start(), and sets self._running = True) never executed, for any BaseProjectionRunner subclass,
  on any invocation. The process logged "Consumer failed after 10 retries" with zero real attempts and
  exited 0, which Kubernetes reports as CrashLoopBackOff (OMN-15800, deploy run 31493137810). Fixed in
  OmniNode-ai/omnimarket#2050 by tracking shutdown intent with a dedicated self._shutdown_requested sentinel,
  separate from the self._running readiness signal.
