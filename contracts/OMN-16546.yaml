---
schema_version: "1.0.0"
ticket_id: "OMN-16546"
title: "Wave 3: onex_change_control correctness fixes (VERSIONING_POLICY, CLI count + residual)"
summary: >
  Fixed three verified defects in this repo's own docs: docs/VERSIONING_POLICY.md's stale "0.1.0 (pre-release)"
  package-version claim (live pyproject.toml is 0.5.1), its [tool.poetry.dependencies] SemVer-range downstream-consumption
  example (this repo is not published to PyPI; real consumption is a uv git-SHA pin, verified live in
  omnibase_core/pyproject.toml and omnibase_infra/pyproject.toml), and its "1:1 package/schema version
  mapping" framing (observed history shows the package moved 0.1.0 -> 0.5.1 while the schema stayed 1.0.0
  -- reframed as a rule for when a bump is required, not a lockstep claim). Also fixed README.md's stale
  "22 CLI entry points"/"20+ registered scripts" claims (live pyproject.toml [project.scripts] has 27,
  confirmed via tomllib) and removed a dead `examples/` path from both README.md's and CONTRIBUTING.md's
  SPDX-stamp commands (the directory does not exist; this repo's own CLAUDE.md already says so). Wave
  3 (correctness in new home) of the org-wide docs consolidation, epic OMN-16304, per docs/plans/2026-08-17-public-docs-kb-consolidation-plan.md
  §8b.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "docs"
    description: "Live pyproject.toml version and CLI script count match the corrected doc claims."
    command: >-
      python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); assert d['project']['version']=='0.5.1';
      assert len(d['project']['scripts'])==27"
  - kind: "docs"
    description: "examples/ does not exist in this repo."
    command: "test ! -d examples"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-occ-versioning-policy-version-fix"
    description: "docs/VERSIONING_POLICY.md's Current Versions section states the live package version
      (0.5.1) rather than the stale 0.1.0 pre-release figure."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "grep -q 'Package version.*0.5.1' docs/VERSIONING_POLICY.md"
  - id: "dod-occ-readme-cli-count-fix"
    description: "README.md states the live CLI entry-point count (27), matching pyproject.toml [project.scripts]."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); n=len(d['project']['scripts']);
          print(n)" | grep -qx 27
  - id: "dod-occ-examples-dir-removed"
    description: "README.md and CONTRIBUTING.md no longer instruct stamping SPDX headers into a nonexistent
      examples/ directory."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "! grep -q 'onex spdx fix.*examples' README.md CONTRIBUTING.md"
  - id: "dod-occ-evidence-admissibility-validator"
    description: "Hosted OCC evidence admissibility validator."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_evidence_admissibility.py -q"
  - id: "occ-self-bind-pr-7118"
    description: >-
      OCC self-binding receipt for PR #7118, the in-repo evidence PR carrying this contract and the doc
      fixes it describes. Binds OMN-16546 to the OCC PR by pr_number so eligibility can resolve a PASS
      receipt for the evidence PR itself.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 7118 --repo OmniNode-ai/onex_change_control --json number,state,headRefName
