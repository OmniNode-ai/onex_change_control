---
schema_version: "1.0.0"
ticket_id: "OMN-17437"
title: "occ main: make the prod-promotion grant merge mechanically gated — require code-owner review on
  main and port the OMN-16117 auto-merge governance exclusion off dev"
summary: >
  OMN-13418, `omni_home/CLAUDE.md` rules 2a and 12, and the header of `grants/prod_promotion_grants.yaml`
  all rest on one premise: "an agent structurally cannot complete a CODEOWNERS-gated merge to main". That
  gate did not exist. Read live 2026-09-01 via `gh api graphql` on `repository.branchProtectionRules`,
  `onex_change_control` `main` returned `requiresApprovingReviews: false`, `requiresCodeOwnerReviews:
  false`, `requiredApprovingReviewCount: null`; the repo's only ruleset ("Merge Queue", `enforcement:
  DISABLED`, scoped `~DEFAULT_BRANCH`) carries a single `MERGE_QUEUE` rule and no `PULL_REQUEST` rule.
  `.github/CODEOWNERS` on main does carry `grants/prod_promotion_grants.yaml @OmniNode-ai/platform-leads`,
  but without `require_code_owner_reviews` CODEOWNERS only auto-REQUESTS a reviewer — it blocks nothing.
  Leg 1 installs the requirement on the `main` branch-protection rule. Leg 2 closes the second, independent
  hole: OMN-16117 added a governance-path exclusion to `.github/workflows/auto-merge.yml` so the workflow
  never arms auto-merge on a PR touching `grants/prod_promotion_grants.yaml`, but installed it on `dev`
  only. Grant PRs never target `dev` — #7084, #7213, #7418, #7464, #7554, #7561, #7662 and #7731 all targeted
  `main` — and for `pull_request` events GitHub resolves the workflow from the PR's merge ref, so main-based
  grant PRs ran main's unprotected 165-line copy, which arms `gh pr merge --auto --squash` for any PR
  authored by `jonahgabriel` (the identity agent sessions act under). Ported the exclusion step, `scripts/ci/check_governance_paths.py`
  and its unit tests to main, and added `tests/ci/test_auto_merge_governance_exclusion.py`, which asserts
  the invariant on EVERY branch that serves grant-PR traffic so the same "fix landed on the branch that
  does not serve the traffic" failure cannot recur. Nothing is weakened: this change only makes a grant
  PR harder to merge, never easier. No prod, stability or judge mutation; no grant is issued, approved
  or consumed here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: "main's auto-merge.yml carries the governance-path exclusion and gates arming on it,
      and main's branch protection requires code-owner approving review."
    command: "see dod_evidence check_values"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-governance-exclusion-present-on-main"
    description: >-
      Falsifiable static + test assertion over the branch's own tree, written fail-closed per the OMN-15391
      Rule D sanctioned form: the workflow is read once into a variable and every grep runs against that
      captured body, so a failed read cannot pass as a false positive. Asserts (1) the `Check governance-path
      exclusion` step exists in `.github/workflows/auto-merge.yml`, (2) the arming step is gated on `steps.governance_gate.outputs.exclude
      != 'true'`, (3) `scripts/ci/check_governance_paths.py` resolves on this branch (the workflow shells
      out to it, so a branch missing it fails open exactly the way OMN-17437 describes), and (4) the ported
      unit tests plus the new cross-branch invariant test pass. Red->green proof captured locally: against
      the pre-fix worktree (origin/main's auto-merge.yml, no checker) all four tests in tests/ci/test_auto_merge_governance_exclusion.py
      fail; with only the workflow reverted and the checker left in place the cross-branch test still
      fails ("worktree (destined for main): no 'Check governance-path exclusion' step"); restoring the
      workflow turns it green.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          wf_body="$(cat .github/workflows/auto-merge.yml)" && printf '%s' "$wf_body" | grep -qF 'name:
          Check governance-path exclusion' && printf '%s' "$wf_body" | grep -qF 'id: governance_gate'
          && printf '%s' "$wf_body" | grep -qF "steps.governance_gate.outputs.exclude != 'true'" && printf
          '%s' "$wf_body" | grep -qF 'scripts/ci/check_governance_paths.py' && test -f scripts/ci/check_governance_paths.py
          && uv run pytest tests/ci/test_auto_merge_governance_exclusion.py tests/unit/scripts/test_check_governance_paths.py
          -q --no-cov -p no:cacheprovider
  - id: "dod-occ-main-requires-codeowner-review"
    description: >-
      Assertion over the operator-scope branch-protection readbacks captured at the moment of the change
      and committed verbatim under `evidence/OMN-17437/`. Proves three separate claims: (1) the BEFORE
      state carried no `required_pull_request_reviews` object at all — the finding this ticket rests on;
      (2) the AFTER state enables `require_code_owner_reviews`, `dismiss_stale_reviews` and `require_last_push_approval`,
      so the CODEOWNERS entry `grants/prod_promotion_grants.yaml @OmniNode-ai/platform-leads` is now an
      enforced merge requirement rather than an auto-request; and (3) the change was strictly ADDITIVE
      — all 23 required status-check contexts, `strict`, `enforce_admins`, `required_linear_history`,
      `required_conversation_resolution`, `allow_force_pushes`, `allow_deletions`, `block_creations`,
      `lock_branch` and `allow_fork_syncing` all round-tripped unchanged. Claim (3) is the one that most
      needs a test: `PUT /repos/:owner/:repo/branches/:branch/protection` replaces the WHOLE protection
      resource, so a hand-written body silently drops every control it omits. Red->green proof captured
      locally against both legs: substituting the BEFORE readback as the AFTER file fails with "AFTER
      readback has no required_pull_request_reviews", and deleting a single status-check context from
      the AFTER readback fails with "required status-check contexts changed; the PUT was not additive.
      before=23 after=22". SCOPE LIMIT, STATED RATHER THAN GLOSSED: this check reads the RECORDED readback,
      not the live setting. It cannot read the live setting, and neither can any CI check in this repo
      — `repository.branchProtectionRules` and `repos/:owner/:repo/branches/main/protection` both require
      admin scope, and the workflow `GITHUB_TOKEN` does not have it; a live query from CI returns `FORBIDDEN`,
      which is how the first revision of this entry failed the Contract Compliance Check. The live proof
      is the operator-scope readback in this entry's receipt `probe_stdout`. DIVERGENCE FROM AC-1, STATED
      DELIBERATELY: `requiredApprovingReviewCount` is 0, not >= 1. A count of 1 is branch-wide and would
      additionally freeze routine non-governance traffic on main (migration inventory repairs, workflow
      backports such as #6614) that no code owner owns, on a branch whose only writer is a one-member
      team. Count 0 with `require_code_owner_reviews: true` gates exactly the CODEOWNERS-covered paths
      — `grants/prod_promotion_grants.yaml` and `allowlists/skip_token_approvals.yaml` — which is the
      surface this ticket is about. The behavioural proof (a PR touching the grant file reporting `reviewDecision:
      REVIEW_REQUIRED`) is deliberately sequenced after this PR lands, because running it earlier would
      mean opening a grant-registry PR while the leg-2 auto-merge hole is still open. If that probe shows
      count 0 is not enforced, the count escalates to 1.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test -f evidence/OMN-17437/occ-main-protection-before.json && test -f evidence/OMN-17437/occ-main-protection-after.json
          && uv run pytest tests/ci/test_occ_main_protection_evidence.py -q --no-cov -p no:cacheprovider
