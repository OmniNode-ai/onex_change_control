          AC1: The probe request for an endpoint with a resolvable api_key_env carries an Authorization header -- falsifier: a unit test asserting the outgoing probe headers that passes while no header is set.
      - id: "AC2"
        statement: |-
          AC2: A genuine 401 on the probed path still classifies AUTH_FAILED (positive control) -- falsifier: a test injecting a rejected credential that yields HEALTHY or UNAVAILABLE.
      - id: "AC3"
        statement: |-
          AC3: The probe path for every backend is one the configured surface serves, read from the backend declaration and not synthesized -- falsifier: a backend whose probed path is absent from its declaration.
      - id: "AC4"
        statement: |-
          AC4: On the dev lane the glm endpoint leaves AUTH_FAILED without the credential being changed -- falsifier: the classification persisting on a lane whose completion call returns 200.
      - id: "AC5"
        statement: |-
          AC5: The credential never reaches a log line, an exception message or an event payload -- falsifier: a test that probes with a known sentinel secret and greps captured log output for it.
      - id: "AC6"
        statement: |-
          AC6: RED taken first against the captured reproduction -- falsifier: a pull request whose evidence shows no failing run before the fix.
