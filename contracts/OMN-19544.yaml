    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the dev-105 lane and the prove-105 stack never run at the same time on .105: the deploy agent refuses to accept a job while a prover HOLD on the host surface is open, and a prover refuses to start while a dev-105 job runs -- falsifier: uv run pytest scripts/deploy-agent/tests/unit -k host_mutex, plus the ledger HOLD rows and job store intervals of one day showing no overlap
      - id: "AC2"
        statement: |-
          AC2: the lane manifest declares dev-105 on lab-105 with its own Postgres, Redpanda under the partition-cap and broker disk profile, and Valkey, on the proposed 43xxx port block, and a census on .105 reports it clean -- falsifier: scripts/lane_census_plan.py run on .105 against the live docker inventory
      - id: "AC3"
        statement: |-
          AC3: the dev-105 broker and images leave at least 30 GiB free on the root volume after a warm build -- falsifier: df -h / on .105 after the first completed job
      - id: "AC4"
        statement: |-
          AC4: deploy-agent-dev-105 runs as a launchd LaunchAgent on a brew python3.13 venv from its own public https clone, in consumer group onex-deploy-agent-dev-105, and the host sleep policy keeps it awake on AC power -- falsifier: launchctl list for the label with a non-zero PID and a fresh stdout log line, pmset -g, rpk group describe onex-deploy-agent-dev-105
      - id: "AC5"
        statement: |-
          AC5: an omnimarket merge routed to dev-105 ends in lab-pass-receipt-compose-dev-105 PASS, verified on the existing host-105 runner once an operator ruling allows verify jobs on it -- falsifier: gh api artifact read of lab-pass-receipt-compose-dev-105-SHA with verdict PASS
      - id: "AC6"
        statement: |-
          AC6: the dogfood stack and omninode-air-runner-1 are unchanged by bring-up -- falsifier: docker ps container ids and StartedAt snapshot before and after
