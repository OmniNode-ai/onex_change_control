---
schema_version: "1.0.0"
ticket_id: "OMN-15320"
title: "deploy-onex-staging: correct the rollout-timeout rationale that still claims a 180s budget the
  workflow has not used since OMN-14974"
summary: >
  OCC companion for OmniNode-ai/omninode_infra PR #1271, satisfying OMN-15320 AC2. Bound by hand (union-resolve)
  because autobind mints no companion at present (OMN-18073), so #1271 would otherwise have no receipt
  to cite and both the Receipt Gate and occ-preflight would fail on the missing citation. Cause of the
  ticket: deploy-onex-dev run 30348504044, whose only change was moving the runtime image digest pin,
  went red at the rollout wait on omninode-runtime-effects while both pods reached Ready on their own
  at 6m52s. The image is 783,619,615 bytes, so a digest bump forces a cold pull the then-180s wait could
  not cover, making the step red-by-construction on exactly the deploys that move the digest. AC2 asks
  that, if a fixed number is kept, its comment cite the cold-pull measurement rather than the falsified
  "~30-60s for cold pull" estimate. The governed value was already raised to 1500 by OMN-14974; only the
  prose stayed stale. Read live on origin/dev at 1cac4743 on 2026-09-09, the workflow's rationale block
  at lines 2465-2470 still read "~30-60s for cold pull" and "Total: 180s provides adequate margin", while
  line 127 read DEPLOY_TIMEOUT_SECONDS "1500" and k8s/onex-dev/runtime/deployment-omninode-runtime.yaml
  line 19 read progressDeadlineSeconds 1800. #1271 replaces that comment with the OMN-15320 live readback
  and tightens tests/k8s/test_runtime_readiness_gate.py so the correction cannot silently regress. No
  timeout value, no manifest field and no deploy step is changed; the diff is a YAML comment block plus
  pytest assertions. 1500 and 1800 are deliberately NOT reconciled here: they are different knobs, the
  client-side rollout wait and the server-side Deployment progress deadline, and their ordering is already
  governed by the pre-existing test_main_runtime_progress_deadline_exceeds_rollout_wait. AC1, which needs
  one green push-triggered deploy on a real runtime-digest bump, is not claimed by this PR and no deploy
  was triggered by this lane. No credential was rotated, re-issued, revoked or minted, no secret value
  was read or printed, no cluster object was mutated, and no runtime lane was touched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "ci"
    description: "PR #1271 CI checks green"
    command: "gh pr checks ${PR_NUMBER} --repo ${REPO}"
  - kind: "tests"
    description: |-
      Behavior proof for PR #1271 on OmniNode-ai/omninode_infra, derived from the PR's own diff: the readiness-gate
      suite the PR changes, which asserts the rationale block cites OMN-15320, the 783,619,615-byte cold pull and the
      six-minute readback, that the governed DEPLOY_TIMEOUT_SECONDS is exactly 1500, and that no stale 30-60s or 180s
      timeout claim survives anywhere in the workflow file. Executed at cwd `${OMNI_HOME}/omninode_infra`.
    command: |-
      uv run pytest tests/k8s/test_runtime_readiness_gate.py -q
  - kind: "manual"
    description: >-
      AC1 — SATISFIED ON LIVE EVIDENCE, BUT NOT BINDABLE AS A dod_evidence CHECK, for the same private-repo
      token reason recorded against OMN-15376 AC3/AC4. A deploy whose ONLY change is a runtime image digest
      bump went green in ONE run, with no redispatch, on a real digest change rather than a warm-image
      rerun: omninode_infra run 34408930764 (Deploy onex-staging (SSM port-forward), event repository_dispatch,
      display title omnibase-infra-dev-candidate, run_attempt 1, conclusion success, 2026-09-09T21:48:37Z
      to 22:10:13Z). The digest-bump-only premise is proven by construction rather than argued: this run
      and its immediate predecessor 34405754290 (event push, run_attempt 1, conclusion success, 21:14:01Z
      to 21:38:42Z) carry the SAME head_sha c5904e7634346e99281ada31492aa55e2059cfa0, so the source tree
      the two runs deployed is byte-identical and the git delta between them is empty. The one thing that
      differs is the runtime image the dispatch payload delivered: the predecessor recorded delivered_image_ref
      omninode-runtime@sha256:a8cad8729f5823fe629a1bb4b49dd5275bba60aca54a2531ff3250aa526aebdb and this
      run recorded omninode-runtime@sha256:264eff1d7292b959d809eab289bbc368c29f37d8fa866a5f7bc1a89157d8f8d5.
      A repository_dispatch delivery is a strictly stronger control than the commit-pinned digest bump
      the ticket founding run used, because a commit-pinned bump still carries a one-line source diff
      while this one carries none at all. The pull was genuinely cold, which is what the criterion turns
      on. Inside step 44 "Wait for remaining runtime deployment rollouts", omninode-runtime alone waited
      21:53:49 to 22:03:58 = 609 seconds, 3.4x the 180-second budget the ticket falsified; omnimarket-projection-api
      then took a further 277 seconds; the whole step ran 21:53:48 to 22:08:42 = 894 seconds; all seventeen
      runtime-plane Deployments reported "successfully rolled out" with zero timeouts. The run then reached
      its terminal gate, step 59 "Post-deploy BUSINESS PROOF gate (OMN-15256) [TERMINAL]", success at
      22:10:06Z — the step the ticket records as being skipped whenever the wait goes red. Probes executed
      2026-09-10, rc=0 each, every conclusion read through the attempt-anchored path so a later re-run
      cannot rewrite it (OMN-15540 Rule F): `gh api repos/OmniNode-ai/omninode_infra/actions/runs/34408930764/attempts/1
      --jq '[.event,.conclusion,(.run_attempt|tostring),.head_sha]|join(" ")'` returned `repository_dispatch
      success 1 c5904e7634346e99281ada31492aa55e2059cfa0`; `gh api repos/OmniNode-ai/omninode_infra/actions/runs/34408930764/attempts/1/jobs
      --jq '.jobs[]|select(.name=="deploy-staging")|.steps[]|select(.name=="Wait for remaining runtime
      deployment rollouts")|[(.number|tostring),.conclusion]|join(" ")'` returned `44 success`. Why this
      is recorded here instead of in dod_evidence: OmniNode-ai/omninode_infra is a PRIVATE repository
      and hosted contract compliance runs as the onexbot-occ-writer GitHub App, whose installation carries
      contents and pull_requests read on that repo but NOT `actions: read`. Proven live in this PR own
      first CI run — OCC PR #8863, Contract Compliance Check job 102709538516: every `repos/OmniNode-ai/omninode_infra/actions/...`
      probe returned `gh: Resource not accessible by integration (HTTP 403)` and reported 10 BLOCK, while
      every `contents`, `commits` and `pulls` probe against the SAME repo in the SAME run succeeded. A
      check that 403s in CI is a hard merge block with no hosted-skip mechanism, so binding AC1 as an
      executable check would make this contract unlandable. The remedy is an org-level change this lane
      is not authorized to make: grant the onexbot-occ-writer App `actions: read` on omninode_infra. Until
      that lands, AC1 is closable only on this recorded readback, not by the AC-binding gate.
  - kind: "manual"
    description: >-
      AC1 negative control — SATISFIED ON LIVE EVIDENCE, same non-bindability reason as the AC1 entry
      above. The same class of deploy, before the fix, returning the opposite result: omninode_infra run
      30348504044 (deploy-onex-dev.yml, event workflow_dispatch, run_attempt 1, 2026-07-28) on commit
      b9f759148a6327a51fd92586678640eda7030b05, whose diff touches EXACTLY ONE file, k8s/onex-dev/runtime/kustomization.yaml
      — a digest-pin move and nothing else. It failed, at precisely "Wait for remaining runtime deployment
      rollouts", under DEPLOY_TIMEOUT_SECONDS "180" as read at that commit. The second half of the control
      is the two-run ritual the ticket describes: run 30349179289, a redispatch against the SAME head_sha
      ten minutes later with the image now warm, went green. Identical inputs, opposite outcomes, differing
      only in image warmth, which is what makes the 894-second cold-pull green above evidence of the fix
      rather than evidence of a warm image. Probes executed 2026-09-10, rc=0 each: `gh api repos/OmniNode-ai/omninode_infra/actions/runs/30348504044/attempts/1/jobs
      --jq '.jobs[]|select(.name=="deploy-dev")|[.conclusion,([.steps[]|select(.conclusion=="failure")
      |.name]|join(","))]|join(" ")'` returned `failure Wait for remaining runtime deployment rollouts`;
      `gh api repos/OmniNode-ai/omninode_infra/actions/runs/30349179289/attempts/1 --jq '[.head_sha,.conclusion,(.run_attempt|tostring)]|join("
      ")'` returned `b9f759148a6327a51fd92586678640eda7030b05 success 1`. The commit-shape half of this
      control IS readable by the App and was verified green in the same CI run: `gh api repos/OmniNode-ai/omninode_infra/commits/b9f759148a6327a51fd92586678640eda7030b05
      --jq '[.files[].filename]|join(",")' | grep -Fxc 'k8s/onex-dev/runtime/kustomization.yaml'`.
  - kind: "manual"
    description: >-
      AC3 — SATISFIED ON LIVE EVIDENCE, same non-bindability reason as the AC1 entries above. A rollout
      that genuinely fails still fails the job; the wait was neither removed nor made advisory. omninode_infra
      run 34056793755 (Deploy onex-staging, event push, run_attempt 1, 2026-09-06T20:03:33Z, head 13c10bf4)
      went red at "Wait for remaining runtime deployment rollouts" and carried that failure to the run
      conclusion. The step discriminates rather than blanket-passing: in that same run omninode-runtime
      waited 20:10:58 to 20:20:33 and reported "successfully rolled out", and then omnimarket-projection-api
      waited 20:20:34 to 20:29:46 and returned `error: deployment "omnimarket-projection-api" exceeded
      its progress deadline`, raising `::error::Rollout failed or timed out: omnimarket-projection-api`.
      The failure took 552 seconds to declare, well inside the 1500-second budget, so the raised budget
      did not convert a real failure into a pass — it waited, the rollout genuinely did not converge,
      and the job went red. Probes executed 2026-09-10, rc=0 each: `gh api repos/OmniNode-ai/omninode_infra/actions/runs/34056793755/attempts/1
      --jq '[.event,.conclusion,(.run_attempt|tostring)]|join(" ")'` returned `push failure 1`; `gh api
      repos/OmniNode-ai/omninode_infra/actions/runs/34056793755/attempts/1/jobs --jq '.jobs[]|select(.name=="deploy-staging")|[.conclusion,([.steps[]|select(.conclusion=="failure")
      |.name]|join(";"))]|join(" ")'` returned `failure Wait for remaining runtime deployment rollouts;Post-deploy
      verification gate (OMN-11969)`.
