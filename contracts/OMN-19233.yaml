  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A sha carrying an onex-lab PASS and no compose-dev receipt is refused, naming the missing lane in the refusal -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_receipt.py -k missing_lane -q constructs that exact fixture and asserts the refusal token names compose-dev.
      - id: "AC2"
        statement: |-
          AC2: A compose-dev FAIL receipt beside another lane's PASS for the same sha is refused -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_receipt.py -k compose_dev_fail_beside_other_pass -q asserts refusal, not a pass-through.
      - id: "AC5"
        statement: |-
          AC5: No force or skip input exists on the gate step -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_gate_no_force_skip.py -q reads the workflow step's and the script's own parser option strings and asserts neither declares one, per rule 24(b).
      - id: "AC6"
        statement: |-
          AC6: A compose-dev receipt not yet written when the gate first reads is refused PENDING (rebuild in flight) or ABSENT, and the delivery is accepted on the re-run after the compose-dev PASS uploads -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_receipt.py -k late_arriving_receipt_rerun -q reproduces the measured 4aca83d9 ordering (the gate read at 19:44:29Z refuses PENDING; the PASS is written at 19:47:04Z; the re-run read passes) and the 3e4aaded R1 case (attempt 1 wrote no receipt, the gate reads ABSENT, and the re-run after the attempt-2 PASS passes).
      - id: "AC7"
        statement: |-
          AC7: A read more than 14,400 s after the delivery run's first gate read refuses under a TIMED_OUT token, even when a PASS has since arrived, and is never a pass -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_receipt.py -k timed_out_at_overall_bound -q asserts TIMED_OUT is distinct from PENDING, ABSENT and FAIL, and that a read at 14,399 s with a PASS present passes.
      - id: "AC8"
        statement: |-
          AC8: The compose-dev emitter re-runs a refused delivery once it uploads a PASS for the same subject, within the bound, and never after a FAIL check -- falsifier: uv run pytest tests/scripts/ci/test_lab_pass_rerun_selector.py -q asserts the selector picks exactly the delivery runs refused PENDING, ABSENT or INDETERMINATE-only for that subject inside 14,400 s and none refused on a FAIL check; plus one live readback of a delivery run re-run by the emitter after its PASS, its gate log naming compose-dev as the required lane. Assignee: the operator. This ticket does not authorize starting implementation.
