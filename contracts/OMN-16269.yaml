schema_version: "1.0.0"
ticket_id: "OMN-16269"
title: "omniweb dev: wire DELEGATION_API_BASE_URL into the dev omniweb overlay"
summary: >
  Fixes OmniNode-ai/omninode_infra PR #951: the `api` arm of omniweb's dashboard data source (lib/dashboard/source/api-source.ts,
  via lib/delegation-client.ts) reads process.env.DELEGATION_API_BASE_URL at request time; without it,
  getStateful() short-circuits to a "wiring_pending" placeholder before ever calling onex-api, indistinguishable
  in the UI from a genuinely empty live result. This env var was completely absent from the dev omniweb
  deployment. The fix adds it to the dev-only Kustomize overlay (k8s/onex-dev-overlay-dev/patches/omniweb-deployment.yaml),
  pointed at the dev gateway (https://dev.api.omninode.ai), matching the ONEX_API_BASE_URL pattern already
  set there. Live-verified before merge: with the env var set on the running dev pod, GET /v1/tenants/me/savings
  and GET /v1/tenants/me/delegations both return HTTP 200 with a real OIDC-issued (aud: onex-api) bearer
  token.
