      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A PR authored by the OCC writer app whose occ-autobind outcome for the current head is DECLINED with the pin-only token passes occ-preflight, the Receipt Gate and the Companion Merged Gate with no companion -- falsifier: uv run pytest over the new bot_exempt script tests in omnibase_core tests/ci and the omnibase_infra and omnimarket check_occ_companion_merged tests, each asserting exempt for writer plus pin-only
      - id: "AC2"
        statement: |-
          AC2: A PR authored by the OCC writer app whose outcome is anything other than the pin-only decline (minted, another decline reason, absent, unreadable, recorded for another head sha) is NOT exempt and blocks exactly as today -- falsifier: uv run pytest of the same modules asserting not exempt for each of those outcomes
      - id: "AC3"
        statement: |-
          AC3: A human-authored pin-only PR and a near-miss login such as onexbot-occ-writer-fork behave exactly as before -- falsifier: uv run pytest asserting the unchanged verdict for a human author and for near-miss logins, and that the probe is never invoked for a human author
      - id: "AC4"
        statement: |-
          AC4: The unconditional allowlist DEPENDENCY_BOT_AUTHORS is unchanged and the writer identities live in a separate pin-only-conditional set kept in parity across the validator, both workflows and the three check_occ_companion_merged copies -- falsifier: uv run pytest parity test comparing the sets
