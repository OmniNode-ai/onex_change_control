schema_version: "1.0.0"
ticket_id: "OMN-20867"
title: "Lab-fill, hourly and throughput decisions run from the runtime tick"
summary: "Three decision nodes route platform.runtime-tick to interval gates using their contract schedules
  and publish scheduled fires on their terminal topics. Existing command handlers and launchd triggers
  remain available; fire consumers are outside this change."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["events", "topics"]
requirements:
  - id: "req-runtime-tick-schedules"
    statement: "The runtime tick opens the configured lab-fill, hourly and throughput windows through
      the real node contracts."
    acceptance:
      - id: "AC1"
        statement: "AC1: each contract routes platform.runtime-tick to its interval handler; lab-fill
          uses interval 1200 offset 600, hourly uses interval 3600 offset 900, and throughput uses interval
          600 offset 0."
      - id: "AC2"
        statement: "AC2: a tick opening a window returns a stable scheduled fire; subsequent ticks inside
          the interval return no output."
      - id: "AC3"
        statement: "AC3: wire_from_manifest loads all three real contracts and publishing runtime tick
          envelopes produces the expected fires on their terminal topics; ticks outside opening windows
          publish nothing."
evidence_requirements:
  - kind: "tests"
    description: "Scheduling and runtime boot tests exercise interval decisions and terminal publication."
    command: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
