---
schema_version: "1.0.0"
ticket_id: "OMN-16289"
title: "Release-synced main: on every release, main fast-forwards to the tag SHA"
summary: >
  OCC evidence for the release-synced-main policy (operator confirmed 2026-08-20): on every release tag
  vX.Y.Z, the repo's main is automatically fast-forwarded to the tag SHA via a new "Sync main to release
  tag" step appended to release.yml. Promotion PRs to main are retired. This contract accumulates one
  dod_evidence entry per wave-1 repo's release.yml PR (omnimarket first as live proof, then omnibase_core,
  omnibase_infra, omnibase_spi, omnibase_compat, omnimemory), each a content-pinned differential probe
  proving the sync step is absent at the PR's base SHA and present at its head SHA. It also records the
  onex_change_control Lane B cleanup that removes the obsolete nightly-promote cron while retaining workflow_dispatch
  for manual/internal reconciliation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-OmniNode-ai-omnimarket-pr-2112"
    description: >
      PR #2112 on OmniNode-ai/omnimarket -- adds a "Sync main to release tag" step to .github/workflows/release.yml,
      run after "Create GitHub Release" succeeds (skipped on rc prereleases): resolves the published tag
      to its commit SHA via `git rev-list -n1 <tag>` and non-force-pushes that SHA to refs/heads/main,
      using the same GITHUB_TOKEN identity actions/checkout already persisted for the job. Content-pinned
      check: fetches release.yml at the PR's base and head SHAs via the GitHub contents API and confirms
      the step name is absent at base and present at head.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          base_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/.github/workflows/release.yml?ref=cbc7ffeeb333e171ad4ff0e2f78ad66c4b4fc4e4"
          --jq .content | base64 -d)"; head_body="$(gh api "repos/OmniNode-ai/omnimarket/contents/.github/workflows/release.yml?ref=a611ff25874164a08d8632d310533620f0d4a0de"
          --jq .content | base64 -d)"; ! printf '%s' "$base_body" | grep -qF 'Sync main to release tag'
          && printf '%s' "$head_body" | grep -qF 'Sync main to release tag' && printf '%s' "$head_body"
          | grep -qF 'git push origin "${TAG_SHA}:refs/heads/main"' && echo "OMN-16289-OMNIMARKET-2112-DIFFERENTIAL-PROBE-PASS:
          release.yml gains the Sync-main-to-release-tag step between base cbc7ffee and head a611ff25"
  - id: "occ-self-bind-pr-6775"
    description: "Binds OMN-16289 to OCC companion PR #6775 (self-bind)."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: "gh pr view 6775 --repo OmniNode-ai/onex_change_control --json number,state,headRefOid"
