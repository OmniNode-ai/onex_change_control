  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC-1: Every line written by the guard's shared _log() helper is prefixed with a UTC ISO-8601 timestamp. Falsifier: a new refusal line in the live log with no leading timestamp, or a second write site that bypasses the helper.
      - id: "AC2"
        statement: |-
          AC-2: A test in tests/scripts/test_canonical_clone_guard.py drives one DENY, one ALLOW and one UNRESOLVED decision and asserts each emitted line parses as <ISO-8601 UTC> <verdict> …. Falsifier: the test passes against the pre-change guard — it must be RED first.
      - id: "AC3"
        statement: |-
          AC-3: A test asserts the guard has exactly one log write site, so a later branch cannot reintroduce an untimestamped line. Falsifier: a second append to the log path that the test does not see.
      - id: "AC4"
        statement: |-
          AC-4: The change is carried by the tracked source of truth and its installer — omniclaude/scripts/user-hooks/canonical-clone-guard.py plus scripts/install-canonical-clone-guard.sh — so the installed copy and the committed copy do not diverge (the OMN-16496 tracked-source rule). Falsifier: the installer's drift report reads DRIFT after the change lands.
      - id: "AC5"
        statement: |-
          AC-5 (mechanical wiring, Operating Rule 5): AC-2 and AC-3 run in omniclaude's existing tests/scripts/ selection on every pull request. This is a test-only addition to a suite CI already collects, so no new gate is created; the criterion is that the two tests appear in a CI job's own collected-test output. Falsifier: the tests exist but appear in no CI job's collected set. Out of scope, deliberately: rotating or enlarging the ring buffer, and any change to which commands the guard refuses. This ticket makes the existing decisions readable; it does not change them.
