        statement: |-
          AC1: every lane dispatched through the remote-lane runner has its brief recorded durably at dispatch, so any lane can be restarted. -- falsifier: a test dispatching a lane and deleting the launching host's scratch copy, then asserting the supervisor can still read the brief, fails
      - id: "AC2"
        statement: |-
          AC2: a job whose lane dies or hits the runtime guard is restarted from its recorded brief up to its retry cap, then alerted. -- falsifier: an integration test that kills a running job's process and asserts one restart, then an alert after the cap, fails
      - id: "AC3"
        statement: |-
          AC3: the supervisor runs on every runtime and each job is taken by exactly one runtime with free capacity. -- falsifier: a test with two runtimes and one job asserting exactly one dispatch fails
      - id: "AC4"
        statement: |-
          AC4: a scheduled canary job proves the system end to end. -- falsifier: the canary job's newest run is missing or failed for more than one interval
