  - id: "ac1-option-a-writer-binds-recorded-tenant"
    description: >-
      AC1 binding. The ruling was recorded before code on this ticket by Jonah Gray, 2026-09-01, comment
      2e544ded: option (a), the writer sets `SET LOCAL app.tenant_id` from the attribution it is about
      to write, on every tenant-relation write including the unbound-authority path. What it still buys,
      as the ruling states it: the write is confined to the one tenant it declares, the read-before-write
      probe is scoped to that tenant, and a tenant-less row leaves the GUC unset so the relation's own
      policy denies it. No tenant is invented or defaulted. Options (b) and (c) were rejected in the same
      comment. This item runs the writer's own behaviour tests from omnibase_infra#3088 (`test_projection_domain_adapters.py`,
      selected by `unbound or recorded_write_scope`), which assert exactly that: the unbound write is
      scoped to the recorded tenant on every tenant-GUC relation, a tenant-less or blank row opens no
      scope, no tenant is ever invented, and the scope rolls back and never leaks on failure. Run at omnibase_infra
      origin/dev 26ed39800f1a2028ba0026ba386453246767b716 on 2026-09-24: 26 passed (the two files are
      unchanged at origin/dev 370adc5e5273c37e7472818978bfc66eab131904). RED control 2026-09-24: with
      `_statement_tenant_scope`'s unbound branch reverted to the pre-fix `return None`, 18 of the 26 fail.
      execution_scope is local_done_gate (OMN-15392) because the suite lives in omnibase_infra, which
      the hosted gate does not check out.
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/runtime/auto_wiring/test_projection_domain_adapters.py
          -q -k 'unbound or recorded_write_scope'"
        cwd: "${OMNI_HOME}/omnibase_infra"
  - id: "ac4-guc-parity-covers-every-tenant-relation"
