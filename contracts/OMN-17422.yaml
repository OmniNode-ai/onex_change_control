  - id: "ac1-option-a-writer-binds-recorded-tenant"
    description: >-
      AC1 binding. The ruling was recorded before code on this ticket by Jonah Gray, 2026-09-01, comment
      2e544ded: option (a), the writer sets `SET LOCAL app.tenant_id` from the attribution it is about
      to write, on every tenant-relation write including the unbound-authority path. What it still buys,
      as the ruling states it: the write is confined to the one tenant it declares, the read-before-write
      probe is scoped to that tenant, and a tenant-less row leaves the GUC unset so the relation's own
      policy denies it. No tenant is invented or defaulted. Options (b) and (c) were rejected in the same
      comment. The implementation is `_recorded_tenant_scope` and `_statement_tenant_scope` in omnibase_infra
      `handler_wiring.py` (omnibase_infra#3088). This check reads the file from omnibase_infra `dev`,
      not a pinned sha, so it goes red if either function is removed. Negative control 2026-09-24: a function
      name that does not exist exits 1.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=dev'
          --jq .content | base64 -d | grep -Fq 'def _recorded_tenant_scope(' && gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/runtime/auto_wiring/handler_wiring.py?ref=dev'
          --jq .content | base64 -d | grep -Fq 'def _statement_tenant_scope(' && printf 'PASS: AC1 option
          (a) is implemented on omnibase_infra dev: the writer binds the GUC from the attribution it writes\n'
  - id: "ac4-guc-parity-covers-every-tenant-relation"
    description: >-
      AC4 binding. `tests/ci/test_tenant_guc_domain_parity.py` (omnibase_infra#4004) drives `scripts/validation/check_tenant_guc_domain_parity.py`,
      which enumerates every relation from the checked-in topology and migration corpus rather than a
