dod_evidence:
  - id: "dod-deploy-live-probe-pr-2032"
    description: >
      Falsifiable deploy-scope probe for OmniNode-ai/omnimarket PR #2032. Reads the ACTUAL content at
      the PR's exact head via the GitHub contents API and asserts publish_snapshot_delta (runner.py) is
      present -- genuinely falsifiable: re-verified 0 occurrences of publish_snapshot_delta on dev at
      the same moment (exit 1), 6 occurrences at the PR head (exit 0).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          body="$(gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/projection/runner.py?ref=f90b947d8685a9296a44312613c7b8f7fde7beb7"
          --jq '.content' | base64 -d)" && count="$(printf '%s' "$body" | grep -c 'publish_snapshot_delta')"
          && [ "$count" -ge 1 ] && gh pr view 2032 --repo OmniNode-ai/omnimarket --json headRefOid --jq
          'if (.headRefOid == "f90b947d8685a9296a44312613c7b8f7fde7beb7") then "true" else error("PR #2032
          head moved off the pinned SHA") end'
  - id: "dod-typecheck-shadow-pr-2032"
    description: >
      L1+ behavioral check (OMN-14409 substance floor): the "typecheck (shadow)" job on PR #2032 is a
      real `mypy --strict` run over the changed source and genuinely fails on a type error (distinct from
      a mere existence/binding probe). Queried live by check-run NAME (not a pinned, ephemeral job id)
      so a re-run on the same head re-validates the same assertion. Local corroboration (same head, same
      command): `uv run mypy src/omnimarket/ --strict` -> "Success: no issues found in 3011 source files".
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          conclusion="$(gh pr view 2032 --repo OmniNode-ai/omnimarket --json statusCheckRollup --jq '.statusCheckRollup[]
          | select(.name == "typecheck (shadow)") | .conclusion')" && [ "$conclusion" = "SUCCESS" ]
