  - id: "occ-self-bind-pr-6285"
    description: >
      Binds OMN-15800 to this OCC companion PR #6285 (self-bind). occ-preflight's merge-eligibility validator
      requires at least one PASS receipt whose pr_number/commit_sha binds to the OCC PR carrying the receipt
      itself (validator_occ_merge_eligibility._receipt_bound_to_pr); every other entry in this contract
      intentionally binds to omnimarket#2032, not this OCC PR, so this entry supplies the missing self-bind
      (established pattern: occ-self-bind-pr-6271/6274/6282). Deliberately does NOT supersede either rebind
      entry above -- a self-bind PR-existence attestation is weaker evidence than a falsifiable content
      probe and must never retire one.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh pr view 6285 --repo OmniNode-ai/onex_change_control --json number,state --jq 'if (.number
          == 6285 and .state == "OPEN") then "true" else error("unexpected OCC self-bind PR state") end'
