ticket_id: OMN-15256
title: Post-deploy business proof gate for onex-dev staging (terminal, fail-closed)
summary: "OCC companion for omninode_infra's OMN-15256 change: a TERMINAL post-deploy business-proof stage
  in deploy-onex-dev.yml plus its decision engine (scripts/evaluate_business_proof.py), I/O driver (scripts/post-deploy-business-proof.sh),
  and hermetic tests. Friction report 2026-07-27 §Recommended-2. Evidence below is STATIC readback of
  the product commit plus hermetic test results — no live proof run has executed the gate against staging
  yet; that is OMN-15101 and is deliberately NOT claimed here. Probe construction (do not 'simplify' back):
  each check fetches once via the raw-content API into a temp file and asserts `test -s` BEFORE counting.
  The base64 form is wrong — the API's base64 carries newlines that BSD tolerates and GNU rejects, so
  it decodes to nothing on a Linux runner. The unguarded form is worse: on empty content the two zero-count
  checks PASSED VACUOUSLY, which is precisely the false-green this ticket exists to remove; the `test
  -s` guard makes empty content a FAIL. Counting uses awk (drains input, always exits 0) rather than `grep
  -q`, which closes the pipe early and trips SIGPIPE under `set -o pipefail`. Probes pin the immutable
  product commit d79c6d74, never the branch name — a branch-name ref makes the attested bytes mutable
  after the fact (reference_never_pin_a_feature_branch_head) and does not change the 404 below, which
  is caused by repo visibility, not by the ref form. KNOWN LIMITATION, scoped precisely: OCC's own Contract
  Compliance Check job runs with the default GITHUB_TOKEN, scoped to onex_change_control; omninode_infra
  is a PRIVATE repo, so that token gets HTTP 404 and all seven correctly BLOCK there — they fail loudly
  instead of two of them passing on empty input. That limitation explains the Contract Compliance Check
  BLOCK ONLY. It does NOT explain the occ-preflight / receipt-gate failures: those returned reason=pr_ticket_mismatch
  — no PASS receipt bound to OCC#5144 itself — fixed by the occ-self-bind entry below. The boundary is
  target-repo visibility, not cross-repo reads in general: the same probe shape went green in OCC CI against
  the PUBLIC omnibase_infra on OCC#5159 with the same repo-scoped token. All seven probes were re-executed
  verbatim at d79c6d74 by a runner holding cross-repo read; all seven exit 0. Receipt provenance: the
  receipts first pushed to this branch were stamped with a merge-controller verifier identity that did
  not author them; they were removed and re-minted by the lane that actually ran the probes."
is_seam_ticket: false
