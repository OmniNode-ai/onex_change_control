  - id: dod-omn19267-acc-ac2
    description: AC2 independent re-run of the profile behavior authored for OMN-19267. Run the original
      regression test on a fresh omnimarket dev export, then require it to turn red with the pre-change
      inference profile at 607cce198d85b51bbd5a107533491f723af372e0. The execution wrapper is authored
      by omn19267-acc.
    source: generated
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix='omn19267-ac2-') as directory:
              root = Path(directory)
              tree = root / 'omnimarket'
              tree.mkdir()
              sha = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/commits/dev', '--jq', '.sha'], text=True).strip()
              archive = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/tarball/' + sha])
              subprocess.run(['tar', 'xz', '--strip-components=1', '-C', str(tree)], input=archive, check=True)
              print('omnimarket dev=' + sha, flush=True)
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              env['UV_PROJECT_ENVIRONMENT'] = str(root / 'venv')
              test = ['uv', 'run', '--frozen', 'pytest', 'tests/unit/delegation/test_prose_task_class_no_think_omn18967.py', '-q', '-p', 'no:cacheprovider']
              subprocess.run(test, cwd=tree, env=env, check=True)
              historical_ref = '607cce198d85b51bbd5a107533491f723af372e0'
              import base64
              old = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/configs/inference_protocols.v1.yaml?ref=' + historical_ref, '--jq', '.content'])
              config = tree / 'src/omnimarket/configs/inference_protocols.v1.yaml'
              config.write_bytes(base64.b64decode(old))
              red = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
              print(red.stdout, end='', flush=True)
              assert red.returncode == 1, 'historical profile must fail the current regression test'
              assert 'reasoning ON' in red.stdout and 'complex_reasoning' in red.stdout, red.stdout
              print(json.dumps({'historical_ref': historical_ref, 'historical_profile_red_exit': red.returncode, 'green_ref': sha}, sort_keys=True))
          PY
