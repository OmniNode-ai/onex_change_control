  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the exact mechanism is identified from the agent's own journal/job-state records for job 0805d076 and its predecessor — same correlation_id redelivered past is_duplicate, or a genuinely new correlation_id published for an already-deployed ref — and named as one or the other. Falsifier: a fix proposed with neither established, i.e. "is_duplicate wasn't sufficient" with no journal citation showing which condition held.
      - id: "AC2"
        statement: |-
          AC2: a consumer-group rejoin never causes the SAME correlation_id to execute a second time. Falsifier: a test drives a rejoin after a command has completed and is committed, and asserts no second job record is created for that correlation_id.
      - id: "AC3"
        statement: |-
          AC3 (positive control): a consumer-group rejoin still delivers a command that was genuinely never processed (the OMN-19259 shape) — this fix must not reintroduce that loss to close this one. Falsifier: the fix makes a rejoin-after-genuine-gap silently skip the unprocessed record.
      - id: "AC4"
        statement: |-
          AC4: if the cause is upstream (a duplicate publish for an already-deployed ref, not a redelivery), the deploy agent still refuses to redeploy a ref it already has running, distinguishably from accepting a legitimate re-request (e.g. an operator-forced redeploy). Falsifier: two commands for the same already-deployed ref, one flagged forced and one not, produce different outcomes; today's behaviour executes both identically.
      - id: "AC5"
        statement: |-
          AC5: after first proving that a bare version-string bump in pyproject.toml/uv.lock (no dependency version change, no code change — the bot's post-release PR shape) has no reachable effect on the running omninode-runtime image or behavior, the classifier reads such a bump as No rebuild. Falsifier: replay one of the three measured bump commits (post-#2822, post-#2813, post-#2817) through the live classifier path (--dry-run, the same invocation runtime-train used to reclassify the queue) and assert the verdict is No rebuild, not runtime.
      - id: "AC6"
        statement: |-
          AC6 (positive control): a pyproject.toml/uv.lock change that DOES reach the runtime — a real dependency version bump, not just this package's own version field — still classifies runtime. Falsifier: the fix narrows the classifier so broadly that a genuine dependency bump also reads No rebuild.
      - id: "AC7"
        statement: |-
          AC7: a real code change to omnimarket (not a version-only bump) still triggers a redeploy exactly as today. Falsifier: any of the live-reclassified RUNTIME PRs (omnimarket#2767, #2779, #2781, #2830, #2819, #2824, #2825, #2826, #2827, #2838) reads No rebuild after the fix.
