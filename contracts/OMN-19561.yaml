  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: every retry_policy the delegation orchestrator contract declares is either honoured by the handler or removed from the contract -- falsifier: a pytest in omnimarket that drives a provider timeout through HandlerDelegationWorkflow and asserts attempts_count against the declared max_retries
      - id: "AC2"
        statement: |-
          AC2: on_runtime_restart is either enforced at runtime start without waiting for traffic, or removed from the contract and the model -- falsifier: a pytest in omnibase_infra that starts the wiring with one stale in-flight row and no dispatch and asserts a terminal is published within one sweep interval
      - id: "AC3"
        statement: |-
          AC3: a duplicate or stale event the orchestrator absorbs without a transition does not move the row updated_at that the completion bound measures -- falsifier: a pytest in omnibase_infra state_io that absorbs a duplicate request on an in-flight row and asserts updated_at is unchanged
      - id: "AC4"
        statement: |-
          AC4: every terminal_failure_cause value the delegate-skill handler can emit is in the contract enum -- falsifier: a pytest in omnimarket that enumerates resolve_terminal_failure_cause outputs against the contract enum
evidence_requirements:
  - kind: "ci"
    description: "PR #3077 product diff scope present"
    command: "gh pr view ${PR_NUMBER} --repo ${REPO} --json files"
