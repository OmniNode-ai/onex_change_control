---
schema_version: "1.0.0"
ticket_id: "OMN-17991"
title: "Enforce effects-only deployment and immutable source pins"
summary: >-
  Code-only, non-seam deployment-tooling change for omnibase_infra PR #3247. It adds a typed effects-only
  deployment plan with immutable source pins, offline candidate/baseline admission, process fencing, and
  verified rollback. It changes no published interface and uses no emergency bypass. It neither proves
  nor performs Docker image build, live deployment, runtime mutation, service action, topic census, or
  DDL.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Four source-bound local pytest chunks cover the six changed script test files."
    command: "See dod_evidence local_done_gate test_passes entries."
  - kind: "ci"
    description: "Product PR #3247 is bound to its exact source head and dev base."
    command: >-
      gh api repos/OmniNode-ai/omnibase_infra/pulls/3247 --jq 'if (.number == 3247 and .head.sha == "a01ebd125b6a2e4ff6d3e8912df3da6f90cd2a68"
      and .head.ref == "codex/omn-17991-effects-only-deploy" and .base.ref == "dev") then ([.number, .head.sha,
      .head.ref, .base.ref] | @tsv) else error("OMN-17991 product binding mismatch") end'
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn17991-effects-candidate"
    description: >-
      Local source-bound candidate-builder evidence for the exact clean product commit. The recorded command
      verifies the commit SHA and full porcelain before creating an owned pytest base directory and running
      the candidate suite under a hard 300-second timeout.
    source: "manual"
    execution_scope: "local_done_gate"
    status: "pending"
    checks:
      - check_type: "test_passes"
        cwd: "${OMNI_HOME}/omni_worktrees/${TICKET_ID}/omnibase_infra"
        check_value: |-
          bash -euo pipefail <<'CHECK'
          test "$(git rev-parse HEAD)" = "a01ebd125b6a2e4ff6d3e8912df3da6f90cd2a68"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          OMN17991_TEST_ROOT="$(mktemp -d)"
          printf 'pytest_basetemp=%s\n' "$OMN17991_TEST_ROOT/cases"
          timeout --kill-after=15s 300s uv run --frozen pytest --basetemp "$OMN17991_TEST_ROOT/cases" -vv --durations=10 tests/scripts/test_build_effects_candidate.py
          CHECK
