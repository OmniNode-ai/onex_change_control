        statement: |-
          AC1: every real gh invocation through the shim appends one JSON line carrying timestamp, lane, command class, method, repository and exit code -- falsifier: uv run pytest tests/scripts/test_gh_usage_log.py -k record -q with a counting fake gh
      - id: "AC2"
        statement: |-
          AC2: the shim passes argv, stdout, stderr and exit code through unchanged -- falsifier: uv run pytest tests/scripts/test_gh_usage_log.py -k passthrough -q
      - id: "AC3"
        statement: |-
          AC3: the log never holds a token value, checked with GH_TOKEN set to a sentinel -- falsifier: uv run pytest tests/scripts/test_gh_usage_log.py -k secret -q
      - id: "AC4"
        statement: |-
          AC4: gh_usage_report.py prints weighted requests per lane per hour and names the share it cannot attribute -- falsifier: uv run pytest tests/scripts/test_gh_usage_log.py -k report -q on a fixture log
      - id: "AC5"
        statement: |-
          AC5: one hour of the installed shim on this Mac attributes at least 90 percent of logged calls to a named lane or session -- falsifier: gh_usage_report.py --since 1h output read beside a header reading of X-RateLimit-Used at both ends of the same hour
