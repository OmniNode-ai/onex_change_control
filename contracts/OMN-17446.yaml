schema_version: 1.0.0
ticket_id: OMN-17446
title: tenant_registry_mirror can never hold the historical tenants — its only source is a time-retained
  topic and no re-announcement path exists
summary: 'tenant_registry_mirror is the relation both the write-path tenant resolver and migration 0034''s
  USING join resolve identity against, and it is populated from exactly one source: onex.tenant.events
  at 168h retention. Four synthetic historical tenants were created before that window, so their TENANT_CREATED
  is unreadable, the mirror can never hold them, and the resolver refuses them permanently. The create-path
  emitter has exactly one call site, inside the tenant-create transaction, and creating requires a free
  slug — so there was no sanctioned way to make a lifecycle event flow for a tenant that already exists.
  This ticket adds that primitive as the third sibling of tenant_topics_backfill and tenant_client_reconcile:
  a standalone, idempotent, ops-only re-trigger of enqueue_tenant_event carrying build_tenant_created_envelope,
  UUID-preserving and fail-closed, with no customer-plane surface.'
