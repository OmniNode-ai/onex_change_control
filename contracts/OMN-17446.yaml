      head. 18 tests covering the four load-bearing properties, every one of which failed with ModuleNotFoundError
      before the module existed: UUID preservation (the emitted event carries the authoritative tenants.tenant_id,
      and agrees with every slug pinned in the consumer-side closed legacy map — disagreement is a hard
      raise in the resolver, not a preference); field-for-field envelope equality against tenant_creation.build_tenant_created_envelope,
      the same builder both create paths call, with only the three default_factory per-emission identifiers
      permitted to differ; fail-closed refusal of an empty, blank, duplicate, or unknown-slug allowlist
      BEFORE any enqueue, asserted by reading back that zero rows were written and the transaction never
      committed; and a static assertion that the module constructs no producer of its own, so it cannot
      bypass the outbox. Also asserts the absence of any set-valued input — there is no "all tenants"
      mode in the signature or the CLI, which is what structurally excludes the operator-deferred tenant
      rather than relying on a denylist a later edit could drop.'
