  - id: "dod-omn17446-ac5-registry-reconcile-gate"
    description: >
      AC5 — a guard that fails closed when a projection whose relation is a registry (read by a write
      path or a migration USING clause) is fed only by a time-retained topic with no reconcile path. Landed
      as scripts/ci/check_registry_projection_reconcile.py in OmniNode-ai/omnimarket#2456, read at head
      sha 3356b5597998c97480d606875e09f8baa6430500, and wired in the SAME change as BOTH the pre-commit
      hook registry-projection-reconcile AND the CI lint-job step "Registry-projection reconcile gate",
      per omni_home operating rule 5. Registry-ness is DERIVED, not declared, because the runtime's table-declaration
      model forbids extra fields: a relation qualifies when another node's ALTER COLUMN TYPE USING conversion
      resolves against it, or a shared projection module that SQL-reads it is imported by a node other
      than its owner. The write-path scan is AST-based and renders f-strings, because the resolver composes
      its SQL as FROM {CONSTANT} and a text grep for the relation name next to FROM misses the very case
      this gate exists for; docstrings are excluded, because one module's docstring carries an operator
      probe query a text scan reads as a live query. The compaction rule is READ from the ONEX topic taxonomy
      rather than hardcoded, and the gate raises rather than passing if it cannot read that taxonomy or
      its own allowlist — a gate that cannot read its own inputs has not passed, it has not run. The sole
      escape hatch is an allowlist requiring every field, treating a blank field as absent, and reporting
      a STALE entry as a violation in its own right. It ships with exactly one entry, for tenant_registry_mirror,
      citing the AC2 re-emit primitive by repo, path and merge sha. The suite is 21 tests, red at authoring
      (module absent) and green after; it includes a positive control proving the gate is probative on
      the real tree — with the exemption removed, scan must flag exactly tenant_registry_mirror — so the
      clean result is not a gate that detects nothing. The four checks below assert the gate exists, that
      it fails closed on its own inputs, and that BOTH wirings are present, since a gate wired in only
      one of them is advisory.
    source: "manual"
    status: "verified"
    binds_ac:
