      the shipped async_resolve_write_tenant_uuid composition against a real asyncpg connection and the
      real 0000_create_tenant_registry_mirror.sql relation in a disposable schema, populating the in-window
      half through the real projection writer. STATED PLAINLY, because the criterion says "fails today
      by construction": this test is NOT red at its parent and cannot honestly be made so. That clause
      was true of the SCENARIO when the ticket was filed, never of this ASSERTION — the resolver already
      refused an unresolvable identity, which is what OMN-16804 built. Red-at-parent would require first
      breaking the resolver. In its place the test carries a mutation control, and one was run: patching
      the resolver to return the identity when the mirror holds no row turned two of its three tests red,
      and the resolver was restored byte-identical (no resolver change appears in #2456's diff). The three
      checks below assert, in order, that the file exists at that sha, that it drives the real resolver
      composition rather than a mock, and that the sibling mutation control is present.
