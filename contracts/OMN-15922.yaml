---
schema_version: 1.0.0
ticket_id: OMN-15922
title: Port the onex auth gateway JWT client into omnibase_infra
summary: 'OCC companion for OmniNode-ai/omnibase_infra PR #2747. The gateway JWT client -- the surface
  an unattended runtime uses to mint a token, store a credential, and keep a session attached -- was built
  in omnibase_core, where it could not stay: ADR-005 forbids core reaching outward for a live HTTP transport,
  and the slice had been routing around that with an entry-point group whose only purpose was the detour.
  This companion binds the evidence that the slice now lives in omnibase_infra behind an infra-owned transport
  protocol (the layering the port exists to restore), that the entry-point indirection is gone rather
  than relocated, that the CLI surface is actually wired so the deployed image gains an ``onex auth``
  command group, and that the ported classes satisfy the OMN-14350 lifecycle-class ratchet under their
  new home rather than being baselined into an allowlist that may only shrink.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - protocols
  - public_api
evidence_requirements:
  - kind: ci
    description: 'PR #2747 CI checks green'
    command: gh pr checks ${PR_NUMBER} --repo ${REPO}
