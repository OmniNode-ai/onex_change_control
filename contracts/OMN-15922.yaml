  - id: "dod-3-live-authenticated-readback"
    binds_ac: ["DoD3"]
    description: |-
      DoD 3, proven live and read back server-side rather than from CLI
      stdout. Lane omn15922-dod3-auth-readback, 2026-09-10T01:43-01:44Z, on
      the staging onex-dev namespace of the DEV-SYSTEM EC2 instance
      i-06169517a92b45f86; every SSM send-command carried
      --comment omn15922-dod3-auth-readback.

      What was done, in the order DoD 3 names it. An EXISTING per-tenant
      confidential machine client -- provisioned 2026-08-24, held in the
      onex-dev Secret named omn15922-dod6-daniyal-cred and resolved by
      REFERENCE, never created, rotated, re-issued or revoked by this lane --
      was exchanged at the realm token endpoint under RFC 6749 s4.4
      grant_type=client_credentials: HTTP 200, token_type Bearer,
      expires_in 300, and NO refresh_token, which is the property the ticket
      calls out (re-grant, never grant_type=refresh_token). The token carried
      azp and principal_id equal to the client id, tenant_id
      18ae3951-376b-4400-af83-c34a137bfda1, tenant_slug d5-e2e-0b5ae67c and
      aud [onex-api, redpanda-events, account] -- the dual-audience shape the
      merged OMN-15922 exchange-input fix exists to accept. That Bearer was
      attached to GET /v1/whoami on the dev gateway: HTTP 200, and the
      SERVER-resolved body named tenant 18ae3951-376b-4400-af83-c34a137bfda1
      / d5-e2e-0b5ae67c, identical to the credential's own tenant_id, which
      is the equality DoD 3 requires. POST /v1/auth/gateway-token then
      returned HTTP 200 with an attach token whose aud is gateway-attach and
      whose azp is the derived gateway-attach principal, tenant-bound
      server-side.

      Why this check is a readback and not a transcript. Every authenticated
      /v1 request writes a usage_events row through the onex-api middleware,
      keyed by the caller's X-Request-ID and stamped with the tenant the
      SERVER resolved, not the tenant the caller claimed. This check reads
      those rows back out of the serving database from inside the onex-api
      pod itself and asserts three things: at least one row exists for this
      lane's correlation-id prefix AND carries the credential's tenant_id;
      the tenant has a non-zero total row count (a positive control, so a
      database that answered zero to everything cannot read as a pass); and
      exactly one distinct tenant appears across the lane's rows, so a
      cross-tenant resolution would be visible rather than averaged away.

      Negative controls, asserted here rather than described. The same
      endpoint with NO Authorization header returned HTTP 401
      auth.credential.absent; with a signature tampered mid-string, and again
      with a payload whose tenant_slug was rewritten, HTTP 401
      auth.credential.invalid. Each refusal used its own correlation id, and
      this check asserts all three wrote ZERO rows -- a refused request must
      leave no server-side trace, which is the half that makes the positive
      row mean something. A fourth control is recorded because it initially
      read as a defect and was not one: flipping the LAST base64url character
      of an RS256 signature returned HTTP 200, because a 342-character
      signature's final character carries four significant bits and two
      unused ones, so A and B decode to identical bytes. That was a
      no-op disguised as a tamper, measured and corrected, not a gateway
      weakness; the two real tamper controls above replaced it.

      Falsifiability, measured rather than asserted. With
      OMN15922_DOD3_REQUEST_PREFIX pointed at a prefix that never happened
      the check exits 1 on DOD3_AUTHENTICATED_ROWS=0; with
      OMN15922_DOD3_TENANT_ID pointed at the nil UUID it exits 1 on both the
      row assertion and the positive control. Both RED legs were run.

      Scope, stated: execution_scope is local_done_gate because this check
      reaches a live cluster through SSM, which hosted compliance has no
      credential for. Every parameter is an environment NAME with the live
      value as its default, so the check is re-runnable by any lane holding
      dev-plane read access and carries no secret material. No token or
      client secret value appears in this contract, this check, or its
      output: the grant is recorded by sha256 prefix and length only.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          INSTANCE="${ONEX_DEV_SYSTEM_INSTANCE_ID:-i-06169517a92b45f86}"
          NS="${ONEX_DEV_NAMESPACE:-onex-dev}"
          TENANT="${OMN15922_DOD3_TENANT_ID:-18ae3951-376b-4400-af83-c34a137bfda1}"
          PREFIX="${OMN15922_DOD3_REQUEST_PREFIX:-omn15922-dod3-auth}"
          CMDS=$(NS="$NS" TENANT="$TENANT" PREFIX="$PREFIX" python3 -c '
          import json, os
          ns, ten, pre = os.environ["NS"], os.environ["TENANT"], os.environ["PREFIX"]
          py = f"""import os, psycopg
          cur = psycopg.connect(os.environ["OMNINODE_CLOUD_DB_URL"]).cursor()
          TEN, PRE = "{ten}", "{pre}%"
          cur.execute("SELECT count(*) FROM usage_events WHERE request_id LIKE %s AND tenant_id = %s::uuid", (PRE, TEN))
          print("DOD3_AUTHENTICATED_ROWS=%d" % cur.fetchone()[0])
          cur.execute("SELECT count(*) FROM usage_events WHERE tenant_id = %s::uuid", (TEN,))
          print("DOD3_TENANT_TOTAL_ROWS=%d" % cur.fetchone()[0])
          cur.execute("SELECT count(DISTINCT tenant_id::text) FROM usage_events WHERE request_id LIKE %s", (PRE,))
          print("DOD3_DISTINCT_TENANTS=%d" % cur.fetchone()[0])
          for label, pat in (("NOAUTH", "omn15922-dod3-noauth-%"), ("SIGTAMPER", "omn15922-dod3-sigtamper-%"), ("PAYTAMPER", "omn15922-dod3-paytamper-%")):
              cur.execute("SELECT count(*) FROM usage_events WHERE request_id LIKE %s", (pat,))
              print("DOD3_REFUSED_%s_ROWS=%d" % (label, cur.fetchone()[0]))
          """
          cmds = [
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
