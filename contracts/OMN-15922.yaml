      audience. Before it, the shipped command refused a genuine provisioned
      credential the gateway had already accepted with HTTP 200. The token
      minter suite drives the live audience shape through the real minter and
      asserts a mint, and carries the two negative controls the widening
      needs -- an audience outside PERMITTED, and a token missing the broker
      audience, both still refused -- so a fix that widened PAST the server
      fails it too.

      The RE-GRANT half. client_credentials issues no refresh_token, which
      this lane confirmed live: the grant returned token_type Bearer,
      expires_in 300 and no refresh_token field. Renewal therefore has to be
      a re-grant inside a declared window, and the renewal-planner suite is
      what holds that shape: a directive that renews at or after expiry
      cannot be constructed, every planned instant lands inside the declared
      window, and a window the client cannot honour is reported rather than
      silently run.

