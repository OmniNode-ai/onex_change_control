    binds_ac: ["DoD2"]
    description: |-
      DoD 2 -- `onex auth token` emits a currently-valid access token and
      re-grants transparently near expiry -- bound to the two behaviour
      suites that hold its two halves, both executed rather than read.

      The MINT half. The merged OMN-15922 fix made the client's
      exchange-input audience rule mirror the server's REQUIRED-subset plus
