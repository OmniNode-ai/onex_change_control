      - id: "AC2"
        statement: |-
          AC2: the released delegate-skill response decodes caller_lane and session_id keys before it declares them, and still refuses any other unknown key -- falsifier: uv run pytest over the omnimarket caller-lane projection test module fails, or check_wire_compatibility.py refuses the step-2 producer after the release
      - id: "AC3"
        statement: |-
          AC3: onex delegate resolves the caller lane (explicit flag, then the lane env vars the gh shim and PR-ownership guard use, then the registered worktree lane) and the Claude Code session id, and writes them into the request metadata and session_id -- falsifier: uv run pytest over the omnibase_infra cli_delegate caller identity test module fails
      - id: "AC4"
        statement: |-
          AC4: a dev-lane onex delegate run publishes a command record carrying the caller lane and session id, and its receipt names the provider -- falsifier: onex delegate --bus kafka --lane dev --locus deployed-lane followed by a read of the command record on the dev lane broker shows no caller lane
