        statement: |-
          AC2: the same shape after a SUCCESSFUL deploy still fails. -- falsifier: pytest asserts FAIL with "reverted part of the plane" for deploy_run_conclusion="success"; if this test ever goes UNPROVEN the change has become a way to not look
      - id: "AC3"
        statement: |-
          AC3: an absent conclusion fails closed. -- falsifier: pytest asserts FAIL for a facts document carrying no deploy_run_conclusion, so omission cannot silence the leg
      - id: "AC4"
        statement: |-
          AC4: the leg never PASSES on a plane it could not judge. -- falsifier: pytest asserts the new UNPROVEN is not PASS; _eval_repin_chain short-circuited only on FAIL, so an UNPROVEN plane verdict was discarded and the projection half decided the leg alone
      - id: "AC5"
        statement: |-
          AC5: the spec-digest split is unaffected by the deploy's conclusion. -- falsifier: pytest asserts FAIL with "SPLIT" for two distinct PINNED digests and deploy_run_conclusion="failure", because that is a manifest fact a failed deploy does not explain
