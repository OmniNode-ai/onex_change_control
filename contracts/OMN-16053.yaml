schema_version: 1.0.0
ticket_id: OMN-16053
title: 'Runner-fleet C2: local git mirrors + Actions tool-cache durability (git-transport egress)'
summary: 'OCC companion for OmniNode-ai/omnibase_infra PR #2755. Every CI job on the 72-runner
  self-hosted fleet cold-clones its repository from github.com through one NAT uplink, because
  the job-started hook correctly destroys the workspace before each job; a full wave is a
  synchronized clone burst that degrades the git plane for every lane (GnuTLS -9/-54 +
  early-EOF checkout kills, 2026-08-14). The C2 component removes that burst: bare mirrors on
  the runner host, a git-daemon bound to the docker bridge gateway only, a flock-serialized
  2-minute refresh (one upstream fetch per repo per interval for the whole fleet), a fail-open
  workspace pre-seed in the bind-mounted job-started hook, and a gated uv git-dependency
  rewrite that serves the exact pinned SHA from the mirror. The component is deployed and
  serving on the runner host; this PR lands the same bytes as repo-managed state so the repo
  is the source of truth again, and this companion binds the evidence that the landed code
  carries the safety properties the design depends on: lineage honesty (checkout still fetches
  the exact requested SHA from github.com; the mirror is a delta reducer, never a source of
  truth), fail-open degradation, push-path pinning back to github.com, and single-fetcher
  upstream refresh.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
