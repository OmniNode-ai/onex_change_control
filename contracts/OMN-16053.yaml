  - id: dod-preseed-is-fail-open-delta-reducer
    description: 'The workspace pre-seed cannot fail a job and cannot substitute for the
      authenticated checkout. Every degraded outcome (mirror absent, unreachable, stale,
      corrupt, probe timeout) leaves the workspace cold and the job unaffected, and a
      successful seed still ends with actions/checkout fetching the exact requested SHA from
      github.com over its own authenticated remote — the seed only shrinks that fetch to a
      delta. Asserted positively on the fail-open markers and the delta-not-clone completion
      line in the landed hook.'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/docker/runners/runner-job-started.sh?ref=412f165c694dc575fc346fc90562248e706fc84a
          --jq '.content' | base64 -d | grep -c 'fail-open'
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/docker/runners/runner-job-started.sh?ref=412f165c694dc575fc346fc90562248e706fc84a
          --jq '.content' | base64 -d | grep -c 'checkout will fetch a delta, not a full clone'
  - id: dod-uv-rewrite-gated-on-exact-pin-servability
    description: 'The uv git-dependency rewrite is emitted only after the hook proves the
      mirror can serve the exact pinned commit with a filtered fetch; a mirror that does not
      advertise the pin leaves uv on its direct github.com path. This is the property that
      makes a stale mirror cost delta bytes instead of failing or mis-resolving a job.
      Asserted on the probe fetch that gates the rewrite.'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/docker/runners/runner-job-started.sh?ref=412f165c694dc575fc346fc90562248e706fc84a
          --jq '.content' | base64 -d | grep -c 'filter=tree:0'
  - id: dod-push-pinned-back-to-github
    description: 'A bare url.insteadOf also rewrites the push URL (documented git behaviour;
      measured during rollout — the daemon serves no receive-pack, so a rewritten push fails
      closed). The landed hook emits an identity pushInsteadOf per rewritten repo so pushes
      resolve back to github.com while the fetch redirect stands. Asserted on the
      pushInsteadOf emission in the landed hook.'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/docker/runners/runner-job-started.sh?ref=412f165c694dc575fc346fc90562248e706fc84a
          --jq '.content' | base64 -d | grep -c 'pushInsteadOf'
  - id: dod-single-upstream-fetcher
    description: 'Mirror refresh cannot itself hammer github.com: the refresh script takes a
      non-blocking flock and exits when another refresh holds it, and every mirror carries the
      uploadpack serving config (allowFilter + allowAnySHA1InWant) applied idempotently on each
      pass so the gated uv rewrite stays servable. Together with the systemd oneshot unit this
      yields one upstream fetch per repo per interval for all 72 runners.'
    source: generated
    checks:
      - check_type: command
        check_value: gh api repos/OmniNode-ai/omnibase_infra/contents/docker/runners/git-mirror-refresh.sh?ref=412f165c694dc575fc346fc90562248e706fc84a
          --jq '.content' | base64 -d | grep -c 'flock -n 9'
      - check_type: command
