          AC2: The mechanism is settled between index-propagation lag and a requires-python bound, with the discriminating observation recorded. -- falsifier: a command shape that resolves omnibase-core==<just-published> for the python_full_version >= '3.14' split at a controlled delay after publish, run at both a short and a long delay, where a short-delay failure plus a long-delay success settles propagation and a failure at both settles the bound.
      - id: "AC3"
        statement: |-
          AC3: If the cause is propagation lag, the leg waits for the version to be resolvable before locking, rather than retrying blindly. -- falsifier: a test driving the wait against an index stub that does not carry the version asserts the leg reports its own timeout outcome token naming the version, and a second against a stub that starts absent and becomes present asserts the leg proceeds and exits zero.
