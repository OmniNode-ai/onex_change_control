---
schema_version: "1.0.0"
ticket_id: "OMN-18085"
title: "omniweb and omnidash dev rollouts are pinned to maxSurge 0 so neither waits on CPU the staging
  node does not have"
summary: >
  OCC companion for OmniNode-ai/omninode_infra PR #1282. Bound by hand (union-resolve) because the autobind
  producer mints nothing today (OMN-18073), the same reason OCC#8760, OCC#8782, OCC#8792 and OCC#8798
  were hand-minted in this window. k8s/onex-dev/omniweb/deployment.yaml declares no strategy, so it inherits
  the Kubernetes default RollingUpdate maxSurge 25% / maxUnavailable 25%. At replicas 2 those percentages
  resolve to maxSurge 1 (fractions round UP) and maxUnavailable 0 (fractions round DOWN), so the Deployment
  is REQUIRED to create a third pod and FORBIDDEN from terminating either running pod first - it can only
  progress by finding 100m of unallocated CPU. The dev-system staging node has almost none. Measured read-only
  over SSM against EC2 i-06169517a92b45f86 at 2026-09-09T16:40Z, node ip-10-40-204-249 is a single 4-CPU
  k3s control-plane with 4000m allocatable, 3880m requested (97%), 120m free, and 2564m actually used
  (64% per kubectl top node) - Insufficient cpu is about REQUESTS against allocatable, never about usage,
  so at 64% use the node was not busy, it was fully committed. Live instance on the rollout this ticket
  was filed for (omniweb#366, merge 7b28a4d087ebd0a4076229697b653939c83fa75f): ReplicaSet omniweb-7dd966bbd9
  rev 168 was created at 16:15:18Z and its surge replica went Pending with "0/1 nodes are available: 1
  Insufficient cpu"; at about 16:33:15Z omnimarket-projection-api finished ITS own rollout and scaled
  ReplicaSet d4c5fcfc5 from 1 to 0, releasing exactly the 100m omniweb needed; omniweb reached Progressing/NewReplicaSetAvailable
  2/2 ready at 16:33:23Z. The rollout was unblocked by an unrelated Deployment, roughly 18 minutes of
  a staging deploy spent waiting on a coin flip, and deploy-onex-staging.yml rolls several 2-replica Deployments
  on the same push so the 120m headroom is a race rather than a guarantee. Stated plainly and recorded
  rather than implied - the rollout SELF-CLEARED at 16:33:23Z, before this change existed; both serving
  pods already carry sha256:1b98a56c64a39261fe0ea5e5e3683f209b172b44f79cbfd0799d502aab747cf5, whose ECR
  tag is sha-7b28a4d087ebd0a4076229697b653939c83fa75f, so this PR does not rescue that rollout, it removes
  the deadlock so the next one does not depend on a coin flip. Cause class is the surge strategy needing
  headroom the node does not reliably have, with the 97% request commitment as the standing condition;
  it is explicitly NOT leaked objects, since all 11 non-current omniweb ReplicaSets are scaled to 0 and
  every Completed Job pod contributes 0m - the positive control being that the per-namespace sum of Running
  and Pending pod requests is 3880m, exactly matching the node's own Allocated resources line. Trimming
  requests was measured and REJECTED: the two pods dominating actual CPU are UNDER-requested, not over
  (omninode-runtime requests 300m and uses 916m, 3.05x; omninode-runtime-effects requests 100m and uses
  692m, 6.92x), so cutting requests would degrade placement quality while leaving a strategy that is wrong
  on its own terms; the genuinely idle 100m requests (three qdrant StatefulSets, kreuzberg, omnidash)
  live in k8s/data-plane and the shared k8s/onex-dev base, outside this dev-only overlay. The fix is maxSurge
  0 / maxUnavailable 1 in the DEV OVERLAY only, which inverts the order so a replacement pod lands in
  the slot a terminating pod frees, needing zero additional headroom, with one of two replicas serving
  throughout. It is in k8s/onex-dev-overlay-dev and not the base because the base is applied to the production-facing
  cluster too (the onex-dev NAMESPACE owns the public app/api/dash hostnames), where maxSurge 0 would
  make every public omniweb deploy drop to a single replica on a cluster that has room to surge properly;
  this overlay is applied by one workflow only, deploy-onex-staging.yml against i-06169517a92b45f86, and
  deploy-onex-prod.yml applies k8s/onex-prod and never this directory. The change cannot revert omniweb's
  image - the digest pin in k8s/onex-dev/omniweb/kustomization.yaml is a floor, and the workflow step
  "Freeze omniweb on its live verified digest" re-pins the ephemeral checkout to the live digest before
  the apply, anchoring on the digest key, so this patch touching only spec.strategy is orthogonal. Lab-first
  is stated honestly rather than claimed: the k8s/onex-lab overlay DOES NOT carry omniweb - it bases on
  ../onex-dev/runtime and ../onex-dev/api only and names omniweb among the seven planes deliberately left
  out, with a matching entry in parity_exclusions.yaml - so no lab surface renders this Deployment and
  no lab pass covers this change. Read-only throughout: no kubectl set, patch, apply, scale or delete
  against any cluster, the public cluster i-0e596e8b557e27785 untouched, no instance resize, no credential
  rotated, re-issued, revoked or minted, and no secret value read, printed or decoded. AC1, AC2 and AC3
  are live-cluster readbacks that are not derivable from this diff; they are recorded on the Linear ticket
  after the staging deploy and are deliberately NOT claimed by any evidence item here. UNION-RESOLVE APPEND
  for OmniNode-ai/omninode_infra PR #1284, the omnidash half of the same ticket, hand-bound for the same
  OMN-18073 reason. One correction to the paragraph above is recorded rather than glossed: PR #1282 stated
  omnidash "has the identical 25%/25%-on-a-full-node shape", which is right about the effect and wrong
  about the source. omnidash does NOT inherit the Kubernetes default - k8s/onex-dev/omnidash/deployment.yaml
  declares maxSurge 1 / maxUnavailable 0 EXPLICITLY, read back live at 2026-09-09T18:07Z as {"rollingUpdate":{"maxSurge":1,"maxUnavailable":0},"type":"RollingUpdate"}
  at replicas 2. Different source, identical arithmetic, identical deadlock: the Deployment must create
  a third pod and may not terminate either running pod first, so it can only progress by finding 100m
  of unallocated CPU on a node with 120m free, and the omnidash pod's effective CPU request is max(init
  10m, sum(containers) 100m) = 100m, the same figure as one omniweb replica. Node arithmetic re-measured
  read-only over SSM against i-06169517a92b45f86 at 2026-09-09T18:07Z with --comment omnidash-rollout-strategy:
  4000m allocatable, 3880m requested (97%), 120m free, omnidash 2 pods Running since 2026-09-02T13:22Z,
  0 Pending cluster-wide. Stated plainly rather than implied: omnidash is NOT currently broken - this
  is a latent deadlock removed before it fires, not an incident repair. The fix is the same one, in the
  same dev overlay, for the same blast-radius reason, and it does not conflict with the omnidash PodDisruptionBudget
  (k8s/onex-dev/omnidash/pdb.yaml, minAvailable 1): a PDB constrains the Eviction API, while a Deployment
  rolling update scales the old ReplicaSet down directly rather than evicting, and maxUnavailable 1 on
  2 replicas leaves 1 pod serving, which is what the budget asks for anyway. Enumeration rather than a
  vague residual: omnidash and omniweb are the ONLY replicas-2 Deployments the k8s/onex-dev-overlay-dev
  render produces, and both are now covered; the four replicas-1 Deployments with the same surge-requiring
  shape (omnimarket-projection-api and umami explicitly, memgraph-lab and pgweb by inherited default)
  are deliberately left alone, because at one replica maxUnavailable 1 is a full outage of that workload
  for the rollout rather than a degraded-but- serving pair. AC6, AC7 and AC8 were added to the Linear
  ticket for the omnidash half before this contract bound to them; AC7 is a live-cluster readback that
  is not derivable from this diff and is deliberately NOT claimed by any evidence item here.
