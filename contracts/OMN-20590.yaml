        statement: |-
          AC3: the dev-202 compose overlay sets ONEX_RUNTIME_SCHEDULER_ENABLED=true on the main runtime service and no other lane overlay sets it -- falsifier: uv run pytest tests/unit/runtime/test_runtime_scheduler_wiring.py -q -k overlay
      - id: "AC4"
        statement: |-
          AC4: on dev-202, with the branch applied to the main runtime, the tick topic HIGH-WATERMARK advances by at least 5 within 10 s with records whose scheduler_id is the lane scheduler, and at least one tick consumer group commits past them -- falsifier: rpk topic describe onex.intent.platform.runtime-tick.v1 -p read twice 10 s apart plus rpk group describe on the registration orchestrator tick group
