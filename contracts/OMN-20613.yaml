          AC2: An A-B-A replay counts A once -- falsifier: a test against real Postgres run with uv run pytest that replays A, B, A and compares the totals
      - id: "AC3"
        statement: |-
          AC3: A failed transaction leaves both the applied-events row and the budget row unchanged -- falsifier: a test against real Postgres run with uv run pytest that injects a failure mid-transaction and reads both tables back
      - id: "AC4"
        statement: |-
          AC4: Out-of-order timestamps keep last_event_at at the greater of stored and incoming and give the correct totals -- falsifier: a test against real Postgres run with uv run pytest that applies events out of order
      - id: "AC5"
        statement: |-
          AC5: The migration lands in both migration locations following fenced-node-migrations.yaml -- falsifier: the repository's migration-sync check run for the node passes, and the PR body quotes the sync rule it followed
      - id: "AC6"
        statement: |-
          AC6: The lab replay with two concurrent writers reads back the same row as a serial replay -- falsifier: a SELECT on the dev lane Postgres compared to the serial-replay totals
