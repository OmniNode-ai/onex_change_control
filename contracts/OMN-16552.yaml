schema_version: "1.0.0"
ticket_id: "OMN-16552"
title: "OCC Companion Merged Gate app-token mint hard-fails on Dependabot PRs before its own bot exemption
  runs"
summary: >
  occ-companion-merged's dependency-bot exemption (DEPENDENCY_BOT_AUTHORS in scripts/ci/check_occ_companion_merged.py)
  is unreachable on omniclaude, omnibase_core, and omniintelligence: each repo's "Mint onexbot-occ-writer
  app token" step (actions/create-github-app-token) runs BEFORE the Python script, and GitHub Actions
  strips repository secrets from Dependabot pull_request runs, so the mint hard-fails and the job never
  reaches the script. Hand-authored because occ-autobind declined to self-mint (no changed-file candidate
  provably RED against the merge base for a workflow-YAML if: condition addition — occ-autobind-no-red-derivable).
