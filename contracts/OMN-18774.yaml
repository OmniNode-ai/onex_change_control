  the collision-resolving UNION, which appends the second companion's evidence
  rather than replacing the first's. No entry authored by the merged companion
  is altered, so no receipt already bound to one is disturbed (OMN-18304).
  The second behavior proof is renamed to a per-PR id because the two
  companions generated the same one, and an evidence id addresses exactly one
  check.
