    description: "Binds omnimarket PR #2013 at head 720ca129fe10a08acf562258df3095b36ef16dcd with the
      grant-regression proof file present."
    source: "generated"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def load(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          pr = load("https://api.github.com/repos/OmniNode-ai/omnimarket/pulls/2013")
          assert pr["state"] == "open", pr
          assert pr["head"]["sha"] == "720ca129fe10a08acf562258df3095b36ef16dcd", pr["head"]["sha"]

          path = "tests/unit/projection/test_tenant_isolation_migrations_grant_app_dashboard_select_omn14894.py"
          blob = load(f"https://api.github.com/repos/OmniNode-ai/omnimarket/contents/{path}?ref=720ca129fe10a08acf562258df3095b36ef16dcd")
          content = base64.b64decode(blob["content"]).decode("utf-8")
          assert "def _unquote" in content
          PY
