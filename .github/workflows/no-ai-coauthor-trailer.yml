#
# OMN-18426: this repo's own call of the AI co-author trailer gate.
#
# Advisory by construction — see the reusable workflow's header. This file
# adds the check to pull requests; it is deliberately absent from
# .github/required-checks.yaml and from branch protection, because
# onex_change_control@main runs with enforce_admins: true.

name: No AI Co-author Trailer

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-ai-coauthor-trailer:
    uses: ./.github/workflows/no-ai-coauthor-trailer-reusable.yml
    permissions:
      contents: read
      pull-requests: read
