# OMN-6912

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: ./.github/workflows/pr-title-check-reusable.yml
    permissions:
      pull-requests: read
