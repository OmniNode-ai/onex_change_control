  contract-compliance:
    name: Contract Compliance Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Only run where we can resolve a PR number: pull_request or merge_group.
    # The `push` event has no associated PR context (main commits have no
    # PR to validate against), so we exclude it — otherwise every push to
    # main would fail at the PR-number resolver step.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap exemption check
        # The gate cannot validate its own CLI before that CLI exists on main.
        # If this PR is the one adding run_contract_compliance_check.py, skip
        # the check — once merged, all downstream PRs will run the full gate.
        id: bootstrap_check
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'scripts/ci/run_contract_compliance_check.py'; then
            echo "Bootstrap PR detected: this PR introduces the contract compliance CLI itself."
            echo "Skipping gate — once merged, all subsequent PRs will be checked."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # OMN-16373: CROSS_REPO_PAT retirement — mint onexbot-occ-writer App
      # token once for the job; reused by both this step and the contract
      # compliance check step below.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.bootstrap_check.outputs.skip != 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
      - name: Set up contracts source
        if: steps.bootstrap_check.outputs.skip != 'true'
        id: contracts_setup
        env:
          OMNI_REPO_CLONE_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ "${{ github.repository }}" = "OmniNode-ai/onex_change_control" ]; then
            # Running in this repo itself — use checked-out contracts (PR diff version)
            ln -s "$GITHUB_WORKSPACE" /tmp/onex_change_control
          else
            if [ -n "${OMNI_REPO_CLONE_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${OMNI_REPO_CLONE_TOKEN}" | base64 | tr -d '\n')"
              git -c "http.https://github.com/.extraheader=${auth_header}" clone --depth=1 https://github.com/OmniNode-ai/onex_change_control.git /tmp/onex_change_control
            else
              git clone --depth=1 https://github.com/OmniNode-ai/onex_change_control.git /tmp/onex_change_control
            fi
          fi
      - name: Set up uv toolchain
        # The runner shells out to ``uv run`` for several check_value commands
        # (e.g. ``uv run pytest``, ``uv run python -c "import yaml; ..."``).
        # Without this step the gate fails with ``sh: 1: uv: not found``.
        # ``uv sync`` (inside setup-uv) also installs pyyaml as a transitive
        # dep of the project, so the previous ``pip install pyyaml`` is
        # redundant.
        if: steps.bootstrap_check.outputs.skip != 'true'
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Resolve PR number (handle merge_group + pull_request)
        if: steps.bootstrap_check.outputs.skip != 'true'
        id: pr_num
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pull_request event carries github.event.pull_request.number directly.
          # merge_group event does not — the head ref encodes it as
          # gh-readonly-queue/<base>/pr-<NUM>-<sha>, so parse NUM from there.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            HEAD_REF="${{ github.event.merge_group.head_ref }}"
            # e.g. refs/heads/gh-readonly-queue/main/pr-287-<sha>
            PR_NUM="$(echo "$HEAD_REF" | sed -nE 's@.*pr-([0-9]+)-[0-9a-f]+.*@\1@p')"
          else
            PR_NUM=""
          fi
          if [[ -z "$PR_NUM" ]]; then
            echo "::error::Could not resolve PR number for event=${{ github.event_name }}"
            exit 1
          fi
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUM"
      - name: Run contract compliance check
        if: steps.bootstrap_check.outputs.skip != 'true'
        # Use ``uv run python`` so the runner script and any ``uv``-prefixed
        # commands inside check_values share the same project venv. This is
        # what lets ``uv run pytest`` / ``uv run python -c …`` succeed inside
        # the runner — see OMN-10086.
        run: |
          uv run python /tmp/onex_change_control/scripts/ci/run_contract_compliance_check.py \
            --pr ${{ steps.pr_num.outputs.pr_num }} \
            --repo ${{ github.repository }} \
            --contracts-dir /tmp/onex_change_control/contracts
        env:
          EMERGENCY_BYPASS: ${{ secrets.EMERGENCY_BYPASS || '' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

  honesty-gate:
    permissions:
      contents: read
    # Receipt Honesty Gate (OMN-12791): scan drift/dod_receipts/ for gamed probes.
    # Blocking: no-op echo probes, deferral language in PASS receipts, self-attestation,
    # fake human verifiers, and deploy-keyword evidence backed by echo-only probe_command.
    #
    # OMN-15689 (R3a AC(e) residual): this job used to check out omnibase_core at a
    # hardcoded SHA (d4884c590...). Per the R3a ruling (no hardcoded validator ref
    # ANYWHERE — not @main, not @dev, not a literal SHA), that pin is a live-skew
    # risk of the same class the ruling fixed for call-receipt-gate.yml /
    # call-occ-preflight.yml: a validator fix merged to omnibase_core dev could not
    # reach this in-repo gate until someone manually bumped the SHA. The checkout
    # ref below is now resolved dynamically by the "Resolve omnibase_core validator
    # ref" step — see that step's comment for the full event matrix (this job runs
    # on push, pull_request, merge_group, AND workflow_dispatch, unlike the PR-only
    # reusable callers R3a originally covered).
    name: Receipt Honesty Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # OMN-15689 (R3a AC(e) residual): resolve the omnibase_core validator ref
      # dynamically instead of the hardcoded SHA this job used to pin. ci.yml
      # (unlike the PR-only reusable callers) runs on four event types, so every
      # one needs a correct, non-hardcoded answer:
      #   - pull_request: the PR's own base branch (github.event.pull_request.base.ref).
      #   - merge_group:  the merge_group's target branch (github.event.merge_group.base_ref).
      #   - push / workflow_dispatch: neither pull_request nor merge_group context
      #     exists, but both events run against an explicit branch — the branch
      #     pushed to, or the branch selected in the manual-dispatch UI — which
      #     GitHub exposes as github.ref_name. That branch is this run's target the
      #     same way a PR's base branch is: dynamically resolved, never a literal.
      # No fallback ref: if none of the above resolves, the job fails closed here
      # before any omnibase_core checkout is attempted.
      - name: Resolve omnibase_core validator ref
        id: validator_ref
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PUSH_OR_DISPATCH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          normalize_branch() {
            printf '%s' "$1" | sed -E 's@^refs/heads/@@; s@^heads/@@'
          }

          if [ -n "${PR_BASE_REF:-}" ]; then
            resolved_ref="$(normalize_branch "$PR_BASE_REF")"
          elif [ -n "${MERGE_GROUP_BASE_REF:-}" ]; then
            resolved_ref="$(normalize_branch "$MERGE_GROUP_BASE_REF")"
          elif [ -n "${PUSH_OR_DISPATCH_REF_NAME:-}" ]; then
            resolved_ref="$(normalize_branch "$PUSH_OR_DISPATCH_REF_NAME")"
          else
            echo "::error::OMN-15689: cannot resolve a PR base ref, merge_group base ref, or push/workflow_dispatch ref — refusing to fall back to any hardcoded omnibase_core ref."
            exit 1
          fi

          echo "ref=${resolved_ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::OMN-15689: omnibase_core validator ref (honesty-gate) resolved dynamically to '${resolved_ref}' (event=${GITHUB_EVENT_NAME})."

      - uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          ref: ${{ steps.validator_ref.outputs.ref }}
          path: omnibase_core_source
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run receipt honesty scan on changed receipts
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PYTHONPATH: ${{ github.workspace }}/omnibase_core_source/src
        run: |
          set -euo pipefail
          changed_file_list=/tmp/changed_receipts.txt
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            base_ref="${BASE_REF#refs/heads/}"
            git fetch origin "$base_ref" --no-tags
            git diff --name-only "origin/${base_ref}"...HEAD -- 'drift/dod_receipts/**/*.yaml' > "$changed_file_list"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA"...HEAD -- 'drift/dod_receipts/**/*.yaml' > "$changed_file_list"
          else
            git ls-files 'drift/dod_receipts/**/*.yaml' > "$changed_file_list"
          fi
          if [[ ! -s "$changed_file_list" ]]; then
            echo "RECEIPT HONESTY GATE PASSED: no changed receipt YAML files"
            exit 0
          fi
          echo "Changed receipt files:"
          cat "$changed_file_list"
          mapfile -t changed_receipts < "$changed_file_list"
          uv run python -m omnibase_core.validation.validator_receipt_honesty \
            --receipts-dir drift/dod_receipts \
            "${changed_receipts[@]}"

  append-only-gate:
    permissions:
      contents: read
    # OCC Append-Only Gate (OMN-13962): enforce the append-only invariant —
    # reject any PR that
    # edits/deletes/renames a merged dod_evidence entry (per-entry hash change)
    # or a merged receipt file under drift/dod_receipts/<TICKET>/. Existing
    # entries are immutable; corrections must be net-new add-only supersession
    # files.
    #
    # OMN-15689 (R3a AC(e) residual): this job used to check out omnibase_core at
    # a hardcoded SHA (f873d8307...), one bump-cycle behind honesty-gate's pin by
    # design ("bump alongside the honesty-gate pin when refreshing"). Per the R3a
    # ruling (no hardcoded validator ref ANYWHERE), both pins are the same
    # live-skew risk the ruling fixed for call-receipt-gate.yml /
    # call-occ-preflight.yml — a validator fix merged to omnibase_core dev could
    # not reach this in-repo gate until someone manually bumped the SHA, and the
    # two pins could (and did) drift out of lockstep with each other. The
    # checkout ref below is now resolved dynamically by the "Resolve omnibase_core
    # validator ref" step — see that step's comment for the full event matrix
    # (this job runs on push, pull_request, merge_group, AND workflow_dispatch).
    name: OCC Append-Only Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # OMN-15689 (R3a AC(e) residual): same dynamic resolution as honesty-gate
      # above, duplicated per-job (not a composite action) to match this repo's
      # existing per-job inline pattern in call-receipt-gate.yml /
      # call-occ-preflight.yml. See honesty-gate's "Resolve omnibase_core
      # validator ref" step for the full event-matrix rationale. No fallback ref.
      - name: Resolve omnibase_core validator ref
        id: validator_ref
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PUSH_OR_DISPATCH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          normalize_branch() {
            printf '%s' "$1" | sed -E 's@^refs/heads/@@; s@^heads/@@'
          }

          if [ -n "${PR_BASE_REF:-}" ]; then
            resolved_ref="$(normalize_branch "$PR_BASE_REF")"
          elif [ -n "${MERGE_GROUP_BASE_REF:-}" ]; then
            resolved_ref="$(normalize_branch "$MERGE_GROUP_BASE_REF")"
          elif [ -n "${PUSH_OR_DISPATCH_REF_NAME:-}" ]; then
            resolved_ref="$(normalize_branch "$PUSH_OR_DISPATCH_REF_NAME")"
          else
            echo "::error::OMN-15689: cannot resolve a PR base ref, merge_group base ref, or push/workflow_dispatch ref — refusing to fall back to any hardcoded omnibase_core ref."
            exit 1
          fi

          echo "ref=${resolved_ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::OMN-15689: omnibase_core validator ref (append-only-gate) resolved dynamically to '${resolved_ref}' (event=${GITHUB_EVENT_NAME})."

      - uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          ref: ${{ steps.validator_ref.outputs.ref }}
          path: omnibase_core_source
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run append-only enforcement on changed tickets
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PYTHONPATH: ${{ github.workspace }}/omnibase_core_source/src
        run: |
          set -euo pipefail
          base_ref="${BASE_REF#refs/heads/}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            git fetch origin "$base_ref" --no-tags
            # Diff against the merge-base, not origin/<base> directly, so receipts
            # that only landed on the base after this branch forked are not
            # mis-flagged as deletions (the validator CLI uses a two-dot diff).
            base_sha="$(git merge-base "origin/${base_ref}" HEAD)"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$BEFORE_SHA"
          else
            echo "APPEND-ONLY GATE PASSED: non-PR event, nothing to diff"
            exit 0
          fi
          changed="$(git diff --name-only "$base_sha"...HEAD -- contracts/ drift/dod_receipts/ || true)"
          # Distinct ticket ids (OMN-NNNN) touched via a contract or receipt path.
          tickets="$(printf '%s\n' "$changed" \
            | sed -nE 's@^(contracts/(OMN-[0-9]+)\.yaml|drift/dod_receipts/(OMN-[0-9]+)/.*)$@\2\3@p' \
            | sort -u)"
          if [[ -z "$tickets" ]]; then
            echo "APPEND-ONLY GATE PASSED: no contract/receipt changes"
            exit 0
          fi
          echo "Tickets touched:"
          printf '%s\n' "$tickets"
          rc=0
          while IFS= read -r tid; do
            [[ -z "$tid" ]] && continue
            echo "--- append-only check: ${tid} (base ${base_sha}) ---"
            if ! uv run python -m omnibase_core.validation.validator_occ_append_only \
                --repo . --ticket-id "$tid" --base-ref "$base_sha"; then
              rc=1
            fi
          done <<< "$tickets"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::APPEND-ONLY GATE FAILED: a PR edited/deleted/renamed a merged dod_evidence entry or receipt. Corrections must be net-new add-only supersession files."
          fi
          exit "$rc"

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    # OMN-14350: non-canonical lifecycle-class ratchet. Unconditional (no needs/if) so
    # it never skips; wired into required CI Summary via needs: + strict success-only check.
    runs-on: >-
      ${{
        (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        )
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/onex_change_control

  precommit-parity-gate:
    name: Precommit Parity Gate
    # OMN-14672 (WS7 fan-out #4, canary OMN-14655 / omnimarket#1783 / omnibase_infra#2318):
    # CI mirror of the two local pre-commit meta-gates over .pre-commit-config.yaml —
    #   1. fail-loud meta-gate (exit-0-on-missing / WARN-SKIP-degrade + stages
    #      coverage: a skipped gate must be byte-indistinguishable from a failing one), and
    #   2. pin-parity (pre-commit `rev:` vs the omnibase_core SHA ci.yml pins for the
    #      SAME validator — the no-noncanonical-lifecycle-classes pair).
    #
    # UNCONDITIONAL BY DESIGN (OMN-14666/14668 lesson). No `needs:`, no `if:`, no
    # paths filter, so the byte-match proof fires on EVERY PR and passes/fails on its
    # own evidence — never conditioned on another job's result (the omnimarket#1783
    # skip-then-vacuous-green window came from a `needs: occ-preflight`). In OCC a
    # STANDALONE workflow file is the wrong shape: OMN-14441 REMOVED a standalone
    # workflow precisely because a separate run_id is invisible to the REQUIRED CI
    # Summary rollup and so cannot block a merge. This job is folded into ci.yml and
    # wired into ci-summary's needs + a strict success-only check below, mirroring
    # no-noncanonical-lifecycle-classes (OMN-14350) — unconditional AND enforced.
    #
    # OMN-14668: runner is HOSTED-PINNED through the centralized public-PR
    # selector, unconditionally. The prior form routed ONLY public-fork PRs to
    # hosted and left every trusted internal PR / push / merge_group on the
    # private runner fleet — a saturated/absent fleet would leave this job
    # queued/cancelled. The ci-summary strict success-only check below
    # already fails closed on a non-`success` result, but pinning to hosted
    # removes the private-runner dependency entirely so the byte-match proof always
    # executes. The gate is short and dependency-free (`uv run --no-project
    # --with pyyaml`), matching the already-hosted omnibase_spi / omnibase_compat
    # parity gates.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Fail-loud meta-gate (exit-0-on-missing / stages coverage)
        run: |
          uv run --no-project --with pyyaml \
            python3 src/onex_change_control/scripts/validate_precommit_fail_loud.py
      - name: Pin-parity check (pre-commit rev vs CI-pinned SHA)
        run: |
          uv run --no-project --with pyyaml \
            python3 src/onex_change_control/scripts/validate_precommit_pin_parity.py

  predicate-parity:
    name: Evidence Admissibility Predicate Parity
    # OMN-15309 (operator ruling 2026-07-29): the OMN-14505 deploy-gate
    # falsifiability predicate — EXECUTED, FALSIFIABLE, OUTSIDE ITS OWN DIFF —
    # is THE admissibility rule for evidence, and this repo's adoption of it
    # lives in src/onex_change_control/validation/evidence_admissibility.py.
    #
    # A comment saying "adopted from omniclaude" is not a mechanism. This job IS
    # the mechanism: it checks out the cited source and EXECUTES the shared case
    # corpus (tests/fixtures/evidence_admissibility_cases.yaml) against BOTH
    # implementations, asserting (a) this repo is never LOOSER than deploy-gate,
    # and (b) the two agree exactly on every case that does not declare a
    # ticketed parity_divergence. Drift into a second definition of "admissible
    # evidence" fails the merge instead of shipping silently.
    #
    # UNCONDITIONAL BY DESIGN (same reasoning as precommit-parity-gate above):
    # no needs:, no if:, no paths filter, hosted-pinned runner. A skip here means
    # something is wrong, not that the gate legitimately opted out — the strict
    # success-only check in ci-summary below fails closed on any non-success.
    #
    # OMNICLAUDE_PIN: pinned to a MERGED commit on omniclaude@main (the ref the
    # deploy-gate reusable workflow is itself consumed at), never a branch head.
    # Bump it deliberately when the upstream predicate changes; a bump that
    # breaks parity is exactly the signal this job exists to raise.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check out omniclaude (the cited source of the OMN-14505 predicate)
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: 7b69d9ba546a1631ec68e96ea03653f94db9eac1
          path: omniclaude_source
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Predicate + parity, proven by execution
        env:
          # Turns a "cannot resolve the upstream file" SKIP into a FAILURE. A
          # skipped parity check in CI is a false green.
          OMN15309_PARITY_REQUIRED: "1"
          OMNICLAUDE_CHECKOUT: ${{ github.workspace }}/omniclaude_source
        run: |
          uv run pytest \
            tests/test_evidence_admissibility.py \
            tests/test_evidence_admissibility_parity.py \
            -q -p no:randomly

  contract-corpus-ratchets:
    name: Contract Corpus Ratchets (OMN-15411)
    # OMN-15411 round 2. The Rule A/B/C/D/E corpus ratchets in
    # tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py are
    # the ONLY surface that sees every contracts/*.yaml: the
    # lint-contract-check-values pre-commit hook is changed-files-scoped (and on
    # a dev PR the CI `Pre-commit` job runs `pre-commit run --files <changed>`,
    # not --all-files), so a rule wired there alone cannot see a violation in a
    # contract the PR does not touch. That module's own docstring claimed these
    # tests "run under pytest over EVERY contract, on every PR" -- they did NOT:
    #
    #   * ci.yml's `test` job carries
    #     `if: ... (github.event_name != 'pull_request' || github.base_ref != 'dev')`
    #     so it is SKIPPED on every PR targeting dev -- the everyday merge path --
    #     and ci-summary's generic rollup passes on a skipped need.
    #   * The only other runner was `tests+coverage (shadow)` in
    #     product-readiness-shadow.yml, which that file's own comment states is
    #     "deliberately kept OUT of required_status_checks, so a red shadow ...
    #     CANNOT block merges".
    #   * OCC dev's required contexts are exactly
    #     ["CI Summary", "required-check-skip-guard / check-skip-vectors"].
    #   * Rule E is warning tier by design (it never changes the linter's exit
    #     code), so the required Pre-commit job is not a backstop for it either.
    #
    # Net effect before this job existed: a NEW Rule A/B/C/D/E violation could
    # land on dev with every required context green. The ratchet was a rule, not
    # a mechanism (feedback_a_rule_is_not_a_mechanism).
    #
    # UNCONDITIONAL BY DESIGN (same reasoning as precommit-parity-gate and
    # predicate-parity above): no needs:, no if:, no paths filter,
    # hosted-pinned runner. A skip here means something is wrong, not that the
    # gate legitimately opted out -- the strict success-only check in ci-summary
    # below fails closed on any non-success result.
    #
    # ANTI-REMOVAL ANCHOR: deleting this job while also deleting its ci-summary
    # wiring would restore the gap silently. scripts/validation/check_corpus_ratchet_wiring.py
    # is a pre-commit hook scoped to .github/workflows/ci.yml, so ANY edit to
    # this file re-asserts (a) the job exists, (b) it is unconditional, (c) it
    # runs the corpus module, (d) ci-summary needs it, and (e) ci-summary has a
    # strict success-only check for it. That hook runs in the required
    # `Pre-commit` context on the dev changed-files path, so the check is not
    # self-referential.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Rule A/B/C/D/E shrink-only corpus ratchets over every contract
        run: |
          uv run pytest \
            tests/unit/scripts/test_lint_contract_check_values_corpus_baseline.py \
            -q -p no:randomly
      - name: Corpus-ratchet CI wiring is intact (anti-removal anchor)
        run: uv run python scripts/validation/check_corpus_ratchet_wiring.py

  yamlfmt-contamination-ratchet:
    name: yamlfmt Contamination Ratchet (OMN-15479)
    # OMN-15479. yamlfmt v0.21.0 (pinned in .pre-commit-config.yaml, running on
    # every commit) rewrites the PARSED VALUE of a folded (`>`) block scalar
    # that carries an internal newline: every internal newline is replaced by
    # the literal token `#magic___^_^___line` and the newline is destroyed --
    # while the hook reports `Passed`. The output is still valid, parseable
    # YAML, so it lands in a merged evidence receipt looking correct.
    #
    # contracts/ and drift/dod_receipts/ are the evidence control plane:
    # actual_output / probe_stdout / check_value are the durable record of what
    # was probed and what came back. A formatter that silently rewrites those
    # fields produces evidence that says something the verifier never observed.
    # 518 files (805 occurrences) already carry the sentinel on dev, and 15
    # files still carry the un-corrupted precondition shape.
    #
    # SCOPE IS DERIVED, NOT DECLARED HERE. The gate reads the yamlfmt hook's own
    # `files`/`exclude` out of .pre-commit-config.yaml and scans exactly what
    # that formatter formats. The first cut hardcoded contracts/ +
    # drift/dod_receipts/ while yamlfmt excludes only ^(\.github/|templates/),
    # leaving 151 files formatter-exposed and ungated -- 8 already contaminated,
    # five of them live node contract.yaml descriptions. Reading the formatter's
    # own declaration is what stops the two drifting apart again; an
    # absent/renamed/duplicated yamlfmt hook fails the gate rather than silently
    # narrowing it. This is also why the sentinel may be spelled literally in
    # THIS file: .github/ is under yamlfmt's exclude, so the formatter never
    # rewrites it and Rule S never scans it.
    #
    # This job is the ONLY required-path surface that sees the WHOLE corpus.
    # The two pre-commit hooks are changed-files scoped (and on a dev PR the
    # required `Pre-commit` job runs `pre-commit run --files <changed>`, not
    # --all-files), so a rule wired there alone cannot see a violation in a
    # receipt the PR does not touch, and cannot see the ratchet baselines drift
    # out of sync with the corpus at all.
    #
    # UNCONDITIONAL BY DESIGN (same reasoning as contract-corpus-ratchets
    # above): no needs:, no if:, no paths filter. A skip here means something is
    # wrong, not that the gate legitimately opted out -- the strict success-only
    # check in ci-summary below fails closed on any non-success result.
    #
    # ANTI-REMOVAL ANCHOR: scripts/validation/check_yamlfmt_contamination.py
    # --check-wiring is a pre-commit hook scoped to this file AND the last step
    # of this job, so ANY edit to ci.yml re-asserts (a) the job exists, (b) it
    # is unconditional, (c) it runs the corpus ratchet and the gate's own
    # RED/GREEN test module, and (d) ci-summary both needs it and applies a
    # strict success-only check to it.
    #
    # The gate NEVER mutates a file. Formatter mutation is the disease, not the
    # cure -- an auto-fixing gate here would be the same class of defect.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Rule S/F shrink-only corpus ratchet over the whole evidence corpus
        run: uv run python scripts/validation/check_yamlfmt_contamination.py --corpus
      - name: Detector RED/GREEN controls and hook-fires-on-a-fixture assertions
        run: |
          uv run pytest \
            tests/unit/scripts/test_yamlfmt_contamination_gate.py \
            -q -p no:randomly
      - name: Contamination-ratchet CI wiring is intact (anti-removal anchor)
        run: uv run python scripts/validation/check_yamlfmt_contamination.py --check-wiring

  supersession-binding-ratchet:
    name: Supersession Binding Ratchet (OMN-15459)
    # OMN-15459. Supersession is the REPAIR primitive of an append-only receipt
    # store, and until this gate landed it was also a laundering channel:
    # check_receipt_hardening.py validated a replacement's schema, hashes and
    # identity and never asked whether the replacement executes the check the
    # superseded item declares. OCC#5534 (merged, 34c8dacc) rebound 8 DISTINCT
    # dod_evidence items to one byte-identical grep of create_kafka_topics.py --
    # so dod-occ-evidence-admissibility-validator now attests that a Kafka-topic
    # script defines a function while the admissibility suite it names goes
    # unrun. OCC#5528 did the same with 6 files one PR earlier. Machine
    # producer, ~20 cohorts/day.
    #
    # The falsifiability shelf cannot see this: that grep IS RED-derivable (1 at
    # the fix ref, 0 at the parent). It is a well-formed probe that falsifies a
    # DIFFERENT item. Every existing gate reasons about a check in isolation;
    # rules S1/S2 reason about the item<->replacement pairing.
    #
    # WHY A WHOLE-CORPUS JOB AND NOT ONLY THE PRE-COMMIT HOOK: the hook
    # (check-receipt-hardening) and the Pre-commit job's changed-receipt step are
    # changed-files scoped, so neither can see the frozen baseline drift out of
    # sync with the corpus, and neither sees a cohort sibling the PR does not
    # touch. This job is the only required-path surface that scans every
    # supersession in drift/dod_receipts/**.
    #
    # UNCONDITIONAL BY DESIGN (same reasoning as contract-corpus-ratchets and
    # yamlfmt-contamination-ratchet above): no needs:, no if:, no paths filter. A
    # skip here means something is wrong, not that the gate legitimately opted
    # out -- the strict success-only check in ci-summary below fails closed on
    # any non-success result.
    #
    # ANTI-REMOVAL ANCHOR: check_receipt_hardening.py --check-supersession-wiring
    # is a pre-commit hook scoped to this file AND the last step of this job, so
    # ANY edit to ci.yml re-asserts (a) the job exists, (b) it is unconditional,
    # (c) it runs the corpus ratchet and the gate's own RED/GREEN test module,
    # and (d) ci-summary both needs it and applies a strict success-only check.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: S1/S2 shrink-only corpus ratchet over every supersession
        run: |
          uv run python scripts/validation/check_receipt_hardening.py \
            --supersession-corpus
      - name: Detector RED/GREEN controls against the live OCC#5534 defect shape
        run: |
          uv run pytest \
            tests/unit/scripts/test_supersession_binding_gate.py \
            -q -p no:randomly
      - name: Supersession-binding CI wiring is intact (anti-removal anchor)
        run: |
          uv run python scripts/validation/check_receipt_hardening.py \
            --check-supersession-wiring

  validate-prod-promotion-grants:
    name: validate-prod-promotion-grants
    # OMN-14441: the prod-promotion-grant trust anchor (CLAUDE.md §2a/§12) had
    # a validator that ran, could fail, and could NOT block a merge — it lived
    # in a standalone workflow file (.github/workflows/validate-prod-promotion-grants.yml,
    # now retired), invisible to this required CI Summary rollup (a separate
    # workflow file gets a separate run_id; OMN-14415 instance #1). Folded in
    # here, unconditional (no needs/if) so it never skips — mirrors
    # no-noncanonical-lifecycle-classes (OMN-14350) below. Deliberately bypasses
    # zone-filter: a grants-file change must never be able to be misclassified
    # into a short-circuited zone.
    runs-on: >-
      ${{
        (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        )
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-15722: a uniform 45m floor across every ci-summary `needs:` member
    # that declares a timeout-minutes. Measured on PR #6173 run 31222755192
    # (head 2df62fc62): inside that ONE run, for the same repo and the same SHA,
    # `Checkout code` ranged 6s to 1358s (22m38s), and `Run ./.github/actions/
    # setup-uv` ranged 93s to 571s (9m31s) across the jobs that reached it,
    # while the ten budgeted gates' own steps took at most 53s. Checkout alone
    # has therefore been observed at 22m38s, so the 5/10/20/25 budgets on dev
    # all sat below an already-observed single-phase latency, and a budget sized
    # to one job's worst total is the same defect one contention spike later.
    # A job that hits its wall is recorded conclusion=cancelled, which CI
    # Summary's fail-closed `!= success` comparison reddens — so this is a
    # starvation bug, not a slow check. Reducing the preamble (fetch-depth: 0
    # full-history clone plus uv provisioning on a 64-runner shared fleet) is
    # addressed below (OMN-15724): this validator has zero git/subprocess
    # usage (single-file read of grants/prod_promotion_grants.yaml, no
    # --pr-author/--base-ref since OMN-14814 removed dual-control), so
    # fetch-depth:1 is provably safe here — unlike check-bot-authored-authz-
    # guard below, which shells git merge-base and keeps fetch-depth:0.
    timeout-minutes: 45
    # OMN-15724 C1: reach the OMN-14027 devpi pull-through cache
    # (omninode-pypi-cache on .201, confirmed healthy/soaked 12d) for this
    # job's setup-uv PyPI downloads. Scoped to this job only — NOT the
    # omnibase_infra fleet-wide activation the 2026-08-08 canary measurement
    # left unauthorized (whole-job p95 did not clear the operator standing
    # rule at fleet scale). Falls back to public PyPI when the runner-type
    # ternary above resolves to the GitHub-hosted fallback (fork-origin PRs
    # can't reach the Tailscale-only cache host), and PIP_EXTRA_INDEX_URL
    # keeps PyPI as a live fallback even on the dedicated-fleet path so a
    # cache miss/outage degrades rather than fails closed (matches the
    # OMN-14027 runbook).
    env:
      UV_DEFAULT_INDEX: >-
        ${{
          (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          )
          && 'https://pypi.org/simple/'
          || 'http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/'
        }}
      UV_INDEX_STRATEGY: unsafe-best-match
      PIP_INDEX_URL: >-
        ${{
          (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          )
          && 'https://pypi.org/simple/'
          || 'http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/'
        }}
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Validate prod-promotion-grants trust anchor (OMN-14441 / OMN-14814)
        run: |
          set -euo pipefail
          # OMN-14814: the approved_by != PR-author dual-control check was
          # removed (sole CODEOWNER — a second, different approver can never
          # be supplied), so --pr-author/--base-ref are no longer passed. The
          # schema + duplicate-id integrity checks remain fail-closed.
          uv run validate-prod-promotion-grants --file grants/prod_promotion_grants.yaml

  check-platform-leads-review-tripwire:
    name: check-platform-leads-review-tripwire
    # OMN-14445: validate-prod-promotion-grants' approved_by != PR-author check
    # (above) is a COMPLETE defense against forged self-approval only while
    # @OmniNode-ai/platform-leads has exactly one member — required_pull_
    # request_reviews (CODEOWNERS enforcement) is intentionally OFF on dev
    # (enabling it would deadlock a solo-lead grant PR; GitHub blocks
    # self-approval of your own PR). This job is the tripwire: it fails the
    # moment platform-leads grows past one member while that gap remains, so
    # the safety property can't silently expire. Unconditional (no needs/if),
    # mirrors validate-prod-promotion-grants / no-noncanonical-lifecycle-classes.
    #
    # NOTE: reading org team membership requires org-scoped read access the
    # default GITHUB_TOKEN does not have (GitHub restricts it to repository-
    # scoped resources). This job uses CROSS_REPO_PAT, verified live on this
    # PR (run 29182101941, job 86621583642) to have sufficient scope: it read
    # a real member count (1) and a real branch-protection fact (False) on
    # the first push. If a future PAT rotation loses read:org scope, this
    # job reports INCONCLUSIVE (exit 2) and fails closed via ci-summary's
    # explicit check below — never a silent pass.
    runs-on: >-
      ${{
        (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        )
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Scope dependency-bot tripwire run
        id: dependency-bot-tripwire-scope
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')"
          printf '%s\n' "$changed_files"
          if grep -qx 'grants/prod_promotion_grants.yaml' <<<"$changed_files"; then
            echo "skip_live_tripwire=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_live_tripwire=true" >> "$GITHUB_OUTPUT"
            echo "Dependency-bot PR does not change prod-promotion grants; skipping live org-private tripwire because repository secrets are withheld for this actor."
          fi
      - name: Check platform-leads-review tripwire (OMN-14445)
        if: ${{ steps.dependency-bot-tripwire-scope.outputs.skip_live_tripwire != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT || github.token }}
          # OMN-14445 review: names which token backed this run so an
          # INCONCLUSIVE failure reads as "token problem" instead of a
          # mystery. secrets.CROSS_REPO_PAT != '' is '' (falsy) when the
          # secret is unset OR withheld by GitHub for a fork-origin PR.
          TOKEN_SOURCE: ${{ secrets.CROSS_REPO_PAT != '' && 'cross_repo_pat' || 'fallback' }}
        run: uv run check-platform-leads-review-tripwire --credential-origin "$TOKEN_SOURCE"

  check-bot-authored-authz-guard:
    name: check-bot-authored-authz-guard
    # OMN-14919: the mechanical closure for the canonical machine OCC producer.
    # A machine writer with a repo-scoped App token can push to ANY path in this
    # repo — App tokens scope by repo, not by path. OCC has no required reviews on
    # dev, CODEOWNERS here is advisory (OMN-14445), and OMN-14441's
    # approved_by != PR-author is trivially satisfied by a bot carrying
    # approved_by: jonah. So a bot could edit grants/** (the prod-promotion trust
    # anchor) or allowlists/** (compliance exemptions) and self-authorize. This job
    # REJECTS any bot-authored PR that touches those two authorization surfaces.
    # Evidence surfaces (contracts/, drift/) are intentionally NOT guarded —
    # machine-minted evidence companions are allowed. Unconditional (no needs/if)
    # so it never skips; folded into the required CI Summary rollup below with a
    # strict fail-closed check, mirroring validate-prod-promotion-grants /
    # check-platform-leads-review-tripwire (a standalone workflow that "runs but
    # cannot block" is the OMN-14415 anti-pattern). Uses only the default
    # GITHUB_TOKEN the checkout persists for the base fetch — the changed-file set
    # and commit identities come from LOCAL git, so NO org-wide CROSS_REPO_PAT is
    # used or needed (OMN-14919 explicitly rejects it).
    runs-on: >-
      ${{
        (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        )
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-15765: 5m was a budget sized to this job's own ~1s of Python logic,
    # not to the preamble it depends on. `actions/checkout@v7` with
    # `fetch-depth: 0` plus the `setup-uv` composite have been observed taking
    # up to ~23m combined on the contended trusted-CI runner fleet
    # (OMN-15722, PR #6173, run 31222755192: checkout alone ranged 6s-22m38s
    # across jobs in one run). A job that hits `timeout-minutes` is recorded
    # `conclusion=cancelled`, and CI Summary's fail-closed `!= success`
    # comparison reddens that as an authz-guard REJECT even though the guard's
    # own logic never ran — this produced 12/17 false "authz violation" reds
    # on the 2026-08-08 D-cluster census (OMN-15765), 5 of them human-authored
    # (occ#6172/#6175/#6176/#6182/#6188). This is starvation, not a matcher
    # defect — the identity/path matcher itself is unit-tested correct in both
    # directions (tests/unit/scripts/test_check_bot_authored_authz_guard.py)
    # and is NOT touched here. 45m matches the uniform floor OMN-15722 set for
    # the other nine timed ci-summary members on this same preamble.
    timeout-minutes: 45
    # OMN-15724 C1: same scoped devpi-cache activation as
    # validate-prod-promotion-grants above (see that job's comment for full
    # rationale). fetch-depth stays 0 here — this job shells
    # `git fetch origin $BASE_REF` + `git merge-base` below and genuinely
    # needs base history (OMN-15724 AC1 split; guard logic untouched).
    env:
      UV_DEFAULT_INDEX: >-
        ${{
          (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          )
          && 'https://pypi.org/simple/'
          || 'http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/'
        }}
      UV_INDEX_STRATEGY: unsafe-best-match
      PIP_INDEX_URL: >-
        ${{
          (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          )
          && 'https://pypi.org/simple/'
          || 'http://omninode-pc.tail75df5e.ts.net:3141/root/pypi/+simple/'
        }}
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Reject bot-authored PRs touching grants/** or allowlists/** (OMN-14919)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref || 'dev' }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          # This is a PR-time authorship check; it is enforced on pull_request.
          # On merge_group / push there is no PR author and the pull_request run
          # already gated the change, so pass rather than emit a false INCONCLUSIVE.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "event=${EVENT_NAME}: authorship guard is enforced on pull_request; passing."
            exit 0
          fi
          # Make origin/${BASE_REF} resolvable for the diff/log range. fetch-depth:0
          # already gave the full head history; this adds the base tip + shared
          # history so the merge-base resolves.
          git fetch origin "${BASE_REF}" --no-tags --quiet || true
          uv run check-bot-authored-authz-guard \
            --repo-root . \
            --base-ref "${BASE_REF}" \
            --pr-author-login "${PR_AUTHOR_LOGIN}" \
            --pr-author-type "${PR_AUTHOR_TYPE}"

  merge-hold-gate:
    # OMN-15484 (fan-out of OMN-15483). The merge sweep lands PRs while
    # adversarial verification is still running against them. OMN-15483 built
    # the fix -- a required check that fails while a PR carries a hold marker in
    # its title or labels, so a held PR can never be required-green for ANY
    # consumer (the Codex controller, `gh pr merge`, auto-merge, a merge queue,
    # or the ONEX merge node) -- but shipped it in omnimarket ONLY.
    #
    # THIS REPOSITORY carries four of the incidents in that ticket's own table
    # (OCC#5588, OCC#5586, OCC#5530/#5531, OCC#5584) and had zero coverage. That
    # is the gap this job closes.
    #
    # NO VOCABULARY IS DECLARED HERE, deliberately. The tokens live in exactly
    # one place fleet-wide -- omnimarket's src/omnimarket/merge_control/
    # hold_marker.py -- and the reusable workflow below reads that module at run
    # time. Copying it here would rebuild, across repos, the precise bug
    # OMN-15483 round 1 found inside omnimarket: two divergent
    # `_DO_NOT_MERGE_RE` definitions, neither a superset of the other, so the
    # same PR was suppressed by one consumer and authored by the other. The
    # reusable workflow scans THIS repo on every run and fails if a second
    # vocabulary ever appears (AC1), proves the gate actually fires here by
    # driving a held vector through it (AC3), and checks that the context name
    # below is not itself a hold token (AC5).
    #
    # UNCONDITIONAL BY DESIGN (AC4): no `needs:`, no `if:`, no paths filter --
    # the same posture as `precommit-parity-gate`, `predicate-parity`,
    # `contract-corpus-ratchets` and `yamlfmt-contamination-ratchet` above. A
    # hold gate an unrelated upstream failure can cascade-skip is not a gate.
    # It is hosted-runner and stdlib-only, so it has no reason to depend on
    # anything.
    #
    # ANTI-REMOVAL ANCHOR: deleting this job together with its ci-summary
    # wiring would restore the gap silently, and no test would notice.
    # scripts/validation/check_merge_hold_gate_wiring.py is a pre-commit hook
    # scoped to this file, so ANY edit here re-asserts (a) the job exists,
    # (b) it is unconditional, (c) it calls the SHARED gate at a non-feature
    # ref, (d) its declared context_name is the context GitHub really mints,
    # (e) ci-summary needs it, and (f) ci-summary has a strict success-only
    # check for it. That hook runs in the required `Pre-commit` context on the
    # dev changed-files path, so the check is not self-referential.
    permissions:
      contents: read
      pull-requests: read
    # `vocabulary_ref` MUST equal the ref in `uses:`. The first selects the
    # workflow FILE, the second selects the omnimarket SOURCE it reads; letting
    # them drift would run one vintage of the gate logic against another vintage
    # of the tokens. check_merge_hold_gate_wiring.py asserts the equality.
    #
    # PIN AN ANCESTOR OF omnimarket `dev`, NEVER A PR-HEAD SHA. This job first
    # pinned 879d6fc6 -- the PR HEAD of omnimarket#1976. It was 40-hex, so the
    # validator below accepted it, but it existed only on the PR branch. When
    # #1976 squash-merged (2026-07-30T18:29:59Z) the branch was deleted, the ref
    # stopped resolving for Actions, and the WHOLE ci.yml failed to load in
    # omnibase_infra, which had shipped the identical pin: runs went
    # conclusion=failure with 0 jobs, taking the required `CI Summary` context
    # down by ABSENCE and wedging every dev PR there. OCC was spared only
    # because this PR had not landed yet. 454c429f is #1976's dev squash
    # commit, reachable from dev permanently.
    uses: OmniNode-ai/omnimarket/.github/workflows/merge-hold-gate-reusable.yml@ca90f81d9fe6734f00b4fe6a1961ffcb93494e96
    with:
      vocabulary_ref: ca90f81d9fe6734f00b4fe6a1961ffcb93494e96
      context_name: merge-hold-gate / evaluate

  contract-shape-v1:
    name: Contract Shape v1 (OMN-15669)
    # OMN-15669 / operator ruling R-0802-9. The assembled contract-testing
    # mechanism: ONE canonical shape (schemas/occ_contract_v1.schema.yaml),
    # ticket identity, binding-agnostic cases, an enumerable case space,
    # shape-correct injected mocks, and dual-binding execution.
    #
    # WHY THIS IS THE REQUIRED-PATH WIRING POINT: OCC dev's required contexts
    # are exactly ["CI Summary", "required-check-skip-guard / check-skip-vectors",
    # "verify / verify", "occ-preflight / eligibility"] (live readback
    # 2026-08-02). `CI Summary` is the only umbrella a new gate can reach, and
    # reaching it requires BOTH a `needs:` entry AND a strict success-only check
    # below — the generic rollup only tests for failure/cancelled, so a SKIPPED
    # job would pass it and this gate would enforce nothing.
    #
    # UNCONDITIONAL BY DESIGN (same reasoning as precommit-parity-gate,
    # predicate-parity and contract-corpus-ratchets above): no needs:, no if:,
    # no paths filter. A skip here means something is wrong, never that the gate
    # legitimately opted out. Scope is decided INSIDE the gate from the changed
    # files, not by a workflow-level path filter that CI cannot prove correct.
    #
    # ANTI-REMOVAL ANCHOR: tests/test_contract_shape_v1_legs.py::
    # test_gate_is_wired_at_the_required_path asserts (a) this job exists,
    # (b) ci-summary needs it, and (c) ci-summary strict-checks its result. That
    # test runs in this job's own first step.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Per-leg RED/GREEN units + every declared case (mock-bound leg)
        run: |
          uv run pytest \
            tests/test_contract_shape_v1_legs.py \
            tests/test_contract_shape_v1_cases.py \
            tests/fixtures/contract_shape_v1/conformant/tests/test_widget_cases.py \
            -q -p no:randomly
      - name: Declared cases, real-bound leg (P6 integration selection)
        run: |
          uv run pytest \
            tests/test_contract_shape_v1_legs.py \
            tests/test_contract_shape_v1_cases.py \
            tests/fixtures/contract_shape_v1/conformant/tests/test_widget_cases.py \
            -q -p no:randomly -m integration
      # REMEDIATION r1: the conformant fixture module is now EXECUTED above, not
      # merely --collect-only'd by the gate. Without this the reference
      # implementation of "the mock validates against the real seam schema" ran
      # nowhere in CI and a divergent mock left the suite green.
      - name: Local pre-commit counterpart runs the SAME entrypoint (rule 5)
        run: |
          set -euo pipefail
          uv run pre-commit run check-contract-shape-v1 --all-files
      - name: Compute changed files vs base
        id: diff
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --no-tags
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE"...HEAD | tr '\n' ' ' > /tmp/changed_files.txt
          echo "files=$(cat /tmp/changed_files.txt)" >> "$GITHUB_OUTPUT"
      - name: Capture the PR body for the identity leg
        if: github.event_name == 'pull_request'
        # READ LIVE, not from github.event.pull_request.body. The event payload
        # is a SNAPSHOT taken when the event fired, so a push that precedes the
        # PR-body trailer update makes the gate compare against a stale body and
        # report identity_trailer_divergence for a PR whose live trailer is
        # correct. That false RED was observed twice on this PR's own branch and
        # was each time cleared by an empty re-trigger commit — a workaround for
        # a race, not a fix. Reading the body at job time removes the race.
        #
        # Fail-closed: `set -euo pipefail` means an API failure fails the step
        # rather than writing an empty body that would look like "no trailer".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '.body // ""' > /tmp/pr_body.txt
          echo "captured PR body: $(wc -c < /tmp/pr_body.txt) bytes (read live)"
      - name: Fetch ticket bodies from Linear (workflow layer, not src/)
        # The gate makes NO network call: the imperative-contract guard blocks
        # raw HTTP from src/ because it bypasses contract transport, and this
        # repo already reads Linear from the workflow layer (stale-todo-gate.yml,
        # todo-audit-on-merge.yml, staleness-monitor.yml). Same idiom here.
        #
        # NOT a graceful degradation: if LINEAR_API_KEY is unset, or a query
        # fails, this writes a map that does not contain the ticket, and the
        # gate returns identity_linear_unreachable RED. Unreachable is RED.
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CHANGED: ${{ steps.diff.outputs.files }}
        run: |
          set -uo pipefail
          echo '{}' > /tmp/ticket_bodies.json
          TICKETS=$(printf '%s' "$CHANGED" | tr ' ' '\n' \
            | grep -oE 'contracts/(v1/)?OMN-[0-9]+\.yaml' \
            | grep -oE 'OMN-[0-9]+' | sort -u || true)
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY unset — ticket bodies unavailable;" \
                 "the identity leg will fail closed for any in-scope contract."
            exit 0
          fi
          python3 - "$TICKETS" <<'PY'
          import json, os, sys, urllib.request
          keys = [t for t in sys.argv[1].split() if t]
          out = {}
          for tid in keys:
              payload = json.dumps({
                  "query": "query($id:String!){issue(id:$id){identifier description}}",
                  "variables": {"id": tid},
              }).encode()
              req = urllib.request.Request(
                  "https://api.linear.app/graphql", data=payload,
                  headers={"Authorization": os.environ["LINEAR_API_KEY"],
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      issue = (json.loads(r.read().decode()).get("data") or {}).get("issue")
                  if isinstance(issue, dict) and isinstance(issue.get("description"), str):
                      out[tid] = issue["description"]
              except Exception as exc:  # noqa: BLE001 - fail closed, never raise
                  print(f"::warning::Linear fetch failed for {tid}: {exc}")
          with open("/tmp/ticket_bodies.json", "w", encoding="utf-8") as fh:
              json.dump(out, fh)
          print(f"fetched {len(out)}/{len(keys)} ticket body/bodies")
          PY
      - name: Gate — canonical contract shape v1 (fail-closed, no allowlist)
        run: |
          set -euo pipefail
          ARGS=(--base-ref "${{ steps.diff.outputs.base }}" --root .)
          ARGS+=(--ticket-bodies /tmp/ticket_bodies.json)
          # P2 needs a PR body. Keyed on the EVENT, never on whether a file
          # happens to exist: a failed body capture must not look like "no PR
          # here, skip the leg". On a pull_request run the leg is mandatory and
          # the capture step above has already failed the job if it could not
          # read the body; on a push/merge run there is no PR, and the CLI
          # requires that exclusion to be DECLARED rather than inferred from an
          # absent file (REMEDIATION r1r) — a silently dropped leg is how a DoD
          # check ended up weaker than the gate it certifies.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--pr-body-file /tmp/pr_body.txt)
          else
            ARGS+=(--skip-identity)
          fi
          # shellcheck disable=SC2086
          uv run check-contract-shape-v1 "${ARGS[@]}" \
            --changed-files ${{ steps.diff.outputs.files }}

  ci-summary:
    name: CI Summary
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-15768 fan-out (enforce-everything wave): NO `needs:`. See
    # scripts/ci/ci_summary_gate.py's module docstring for the full incident
    # history this replaces -- most acutely, OCC#6346 (merged 2026-08-11)
    # merged with `Contract Compliance Check` = failure and `CI Summary` =
    # success on the same head SHA because `contract-compliance` was never
    # even listed in the old `needs:` array. A `needs:`-gated job also never
    # instantiates a check-run until every upstream job reaches a terminal
    # state, so under runner-fleet saturation the required context could go
    # ABSENT rather than red. This job's check-run instantiates immediately
    # and polls this run's own job list (L1/L2/L3) plus the PR head's
    # commits/{sha}/check-runs (L4, cross-workflow contexts) until a terminal
    # verdict, converting PENDING to FAILURE at the deadline below.
    if: always()
    timeout-minutes: 100
    # `checks: read` (OMN-16130) -- an explicit `permissions:` block sets every
    # UNLISTED permission to `none`, not the default `read`. The L4 fetch below
    # (`gh api .../commits/${HEAD_SHA}/check-runs`) needs `checks: read` to
    # succeed; without it every call 403s, the `|| echo '{"check_runs": []}'`
    # fallback silently swallows the error, and EXPECTED_EXTERNAL_CONTEXTS
    # reports all contexts as permanently missing/pending -- indistinguishable
    # from a real gate never completing, so CI Summary loops until the
    # DEADLINE_MINUTES=90 fail-closed timeout on every single PR, every time,
    # regardless of actual context state. Confirmed live: every one of the 18
    # EXPECTED_EXTERNAL_CONTEXTS names showed `completed`/`success` via a
    # directly-authenticated `gh api` call on the same head SHA and poll
    # window where this job's own in-run fetch reported them all missing.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Poll job list + PR-head check-runs until a terminal verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # 90m: comfortably above the slowest observed gate in this run (the
          # cross-repo-cloning jobs -- migration-conflicts, kafka-boundary-parity,
          # migration-inventory -- and the L4 external contexts, none of which
          # have been observed anywhere near this on the trusted runner fleet),
          # while still well under this job's own 100m timeout-minutes so a
          # deadline fires as a clean fail-closed FAILURE rather than a runner
          # timeout=cancelled (which would itself be indistinguishable from a
          # real failure to any consumer, but is worse to debug).
          DEADLINE_MINUTES: "90"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          poll=0
          while true; do
            poll=$((poll + 1))
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --paginate > /tmp/ci_summary_jobs.json
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              # OMN-16141: commits/{sha}/check-runs returns an OBJECT
              # (`{total_count, check_runs: [...]}`), not a bare array. Per
              # `gh help api`, plain `--paginate` on an object-shaped
              # endpoint prints one JSON document PER PAGE, concatenated --
              # not merged -- so a head SHA with >100 check-runs (2+ pages)
              # wrote two back-to-back JSON documents to this file. The
              # downstream `json.loads()` in ci_summary_gate.py's
              # `_load_check_runs()` raised `JSONDecodeError: Extra data` on
              # that concatenated output, was caught, and returned `None` --
              # which `evaluate_external_contexts()` treats as EVERY
              # EXPECTED_EXTERNAL_CONTEXTS entry being unobserved, forever,
              # regardless of their real state (live repro: occ#6618, head
              # d5ed3417204bfe73263805532cd3e38a0d343242, 135 check-runs).
              # `--paginate --slurp` wraps each page's full object into a
              # single outer JSON array instead of concatenating them, so
              # this now parses reliably at any check-run count; the
              # trailing `jq` flattens each page's `check_runs` array into
              # one combined list matching the plain-array shape
              # `_load_check_runs()` already accepts.
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" --paginate --slurp \
                | jq '[.[].check_runs[]]' \
                > /tmp/ci_summary_check_runs.json || echo '[]' > /tmp/ci_summary_check_runs.json
            else
              echo '{"check_runs": []}' > /tmp/ci_summary_check_runs.json
            fi

            set +e
            uv run python scripts/ci/ci_summary_gate.py \
              --jobs-file /tmp/ci_summary_jobs.json \
              --run-attempt "${RUN_ATTEMPT}" \
              --check-runs-file /tmp/ci_summary_check_runs.json \
              --event-name "${EVENT_NAME}"
            code=$?
            set -e

            if [[ "$code" -eq 0 ]]; then
              echo "CI Summary: SUCCESS (poll ${poll})"
              exit 0
            fi
            if [[ "$code" -eq 1 ]]; then
              echo "::error::CI Summary: FAILURE (fail-closed: a gating job or an asserted external context failed/cancelled/is missing)"
              exit 1
            fi

            # PENDING (exit 2): re-poll unless the deadline has passed.
            now=$(date +%s)
            if [[ "$now" -ge "$deadline" ]]; then
              echo "::error::CI Summary: still PENDING after ${DEADLINE_MINUTES}m -- fail-closed (a gate never reached a terminal state)"
              exit 1
            fi
            echo "CI Summary: PENDING (poll ${poll}); re-checking in 30s..."
            sleep 30
          done
