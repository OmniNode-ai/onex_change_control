name: CI

# Runner-routing policy: only fork pull requests use the public selector.
# Same-repository pull requests, pushes, and merge-group events use trusted CI.

on:
  push:
    branches: [main, "hotfix/**"]
  pull_request:
    branches: [main, dev, "hotfix/**"]
    # OMN-15731: default types (opened/synchronize/reopened) don't retrigger
    # on a label change or a draft->ready flip. `labeled`/`unlabeled` cover
    # the ci:ready label (transition-window dual-accept path, see the
    # pre-commit job below); `ready_for_review` covers the now-primary
    # draft-state admission signal so undrafting a PR fires a full
    # evaluation on the current head without requiring a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Zone filter (OMN-10475): short-circuit heavy jobs on docs-only and
  # declarative-evidence-only PRs. Most OCC traffic is contract+receipt
  # YAML in contracts/ and drift/dod_receipts/, both DOCS zone now.
  zone-filter:
    uses: OmniNode-ai/omnibase_core/.github/workflows/zone-filter.yml@dev
    permissions:
      contents: read
      pull-requests: read
    with:
      python-version: "3.12"

  pre-commit:
    name: Pre-commit
    needs: [zone-filter]
    # OMN-15731 revision 2026-08-18: admission gate migrated from the
    # `ci:ready` label to native PR draft state -- this job is gated here --
    # and ONLY for dev-targeting PRs; push/merge_group/main-or-hotfix-
    # targeting PRs are unaffected (`always()` still holds for them),
    # preserving the promotion-boundary guarantee exactly as before. Gating
    # `test` and `type-check` for the `main` promotion boundary would weaken
    # the unconditional full-suite guarantee root CLAUDE.md rule #4 requires
    # at that boundary, so they stay ungated there.
    #
    # Stale-comment correction (same OMN-15731 ticket, earlier commit): this
    # comment previously claimed `test`/`type-check` "already skip on PRs
    # targeting dev by design," so gating them here would add "zero
    # incremental savings." That claim was the exact bug this ticket fixes
    # elsewhere in this file -- a `github.base_ref != 'dev'` carve-out on
    # both jobs' `if:` meant they silently skipped on every dev PR while
    # reading as passing. That carve-out is now removed (see `test`/
    # `type-check` below and their CI-Summary strict block); `test` and
    # `type-check` run unconditionally on non-docs-only PRs, dev included.
    # This job's own admission gate is unaffected by that fix -- it was
    # never conditioned on the (mis)stated rationale, only on ci:ready/draft
    # state -- but the rationale text is corrected here so it does not
    # misdescribe the file it sits in.
    #
    # TRANSITION-WINDOW DUAL-ACCEPT: `!draft` is the new primary admission
    # signal (GitHub-native -- no bot-applied label required, so the
    # OMN-15888 autobind-companion friction closes structurally: the OCC
    # companion emitter's PR-creation call carries no `draft` field, so
    # GitHub defaults every autobind companion to non-draft). The
    # `contains(...'ci:ready')` arm stays as a fallback so PRs opened before
    # this migration that already carry the label are not stranded mid-
    # transition. Do not remove the ci:ready arm in this PR -- it is
    # retired in a follow-up once open label-gated PRs have drained. Fail-
    # closed proof is unchanged and structural: `Pre-commit` stays in
    # STRICT_GATE_JOBS in scripts/ci/ci_summary_gate.py (not
    # SKIPPABLE_GATE_JOBS), so a `skipped` conclusion -- for either reason --
    # already fails `CI Summary` closed; no change to that file was needed.
    if: always() && (github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:ready'))
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      # OMN-15241: reject-required-check-skip-vector is SKIPped in CI *only*.
      # It is a LOCAL shift-left wrapper that resolves the canonical validator
      # from $OMNI_HOME/omniclaude, which does not exist on a GitHub-hosted
      # runner -- it would hard-error here for a missing sibling clone, not for
      # a real skip vector. ZERO enforcement is lost: the identical validator
      # runs in CI on every PR via .github/workflows/required-check-skip-guard-caller.yml
      # (context `required-check-skip-guard / check-skip-vectors`). This is a
      # duplicate-invocation removal, not a gate bypass.
      - name: Run full pre-commit
        if: needs.zone-filter.outputs.docs_only != 'true'
        run: SKIP=check-receipt-honesty,check-receipt-hardening,reject-required-check-skip-vector uv run pre-commit run --all-files
      - name: Run dev PR changed-file pre-commit
        if: needs.zone-filter.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --no-tags
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT "origin/${BASE_REF}"...HEAD || true)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "Dev PR fast-lane: no changed files for pre-commit."
            exit 0
          fi
          SKIP=check-receipt-honesty,check-receipt-hardening,reject-required-check-skip-vector uv run pre-commit run --files "${changed_files[@]}"
      - name: Run evidence-only pre-commit
        if: needs.zone-filter.outputs.docs_only == 'true'
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          base_ref="${BASE_REF#refs/heads/}"
          git fetch origin "$base_ref" --no-tags
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "origin/${base_ref}"...HEAD -- contracts/ drift/dod_receipts/ \
              | grep -E '^(contracts/.*\.ya?ml|drift/dod_receipts/.*\.ya?ml)$' || true
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "Evidence-only fast-lane: no changed contract or receipt YAML files."
            exit 0
          fi
          SKIP=check-receipt-honesty,check-receipt-hardening,reject-required-check-skip-vector uv run pre-commit run --files "${changed_files[@]}"
      # OMN-16373: CROSS_REPO_PAT retirement. Mint a short-lived
      # onexbot-occ-writer App installation token (org secrets
      # ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY) for the sibling-repo
      # read this step needs; the `|| github.token` fallback stays for
      # resilience (same-repo reads still work without the App).
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
      - name: Run receipt hardening on changed receipts
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          base_ref="${BASE_REF#refs/heads/}"
          git fetch origin "$base_ref" --no-tags
          # OMN-15710: the gate's ABS_PATH rule also scans contracts/*.yaml
          # dod_evidence[*].checks[*].check_value, so changed contract files
          # must reach the same invocation as changed receipt files.
          mapfile -t receipt_files < <(
            git diff --name-only --diff-filter=ACMRT "origin/${base_ref}"...HEAD -- drift/dod_receipts/ contracts/ \
              | grep -E '^(drift/dod_receipts/.*\.ya?ml|contracts/.*\.ya?ml)$' || true
          )
          if [ "${#receipt_files[@]}" -eq 0 ]; then
            echo "No changed receipt or contract files for receipt hardening."
            exit 0
          fi
          uv run python scripts/validation/check_receipt_hardening.py "${receipt_files[@]}"

      # OMN-14428: every gate above is scoped to the data files it validates
      # (drift/dod_receipts/, contracts/, ...), so a PR that edits the gate's
      # own code but touches zero data files never executes it. That exact
      # hole is how OCC#3986 merged green with a stale-import ImportError in
      # check_receipt_hardening.py — the file-scoped diff was empty, so the
      # gate script never ran, and only the caught-ImportError compat shim it
      # shipped with kept the (never-exercised) import path "succeeding".
      # A change to a gate must run the gate. `--help` forces full
      # module-level import execution (argparse handles -h before validating
      # required positionals, so this needs no fixture data and works
      # uniformly for any argparse-based validator); check_receipt_hardening
      # additionally gets a real corpus run so a broken gate can't hide
      # behind an import that merely succeeds but a runtime path that
      # doesn't.
      - name: Validator self-check — a gate must run when its own code changes
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          base_ref="${BASE_REF#refs/heads/}"
          git fetch origin "$base_ref" --no-tags
          mapfile -t changed_validators < <(
            git diff --name-only --diff-filter=ACMRT "origin/${base_ref}"...HEAD -- scripts/validation/ \
              | grep -E '^scripts/validation/check_[^/]*\.py$' || true
          )
          if [ "${#changed_validators[@]}" -eq 0 ]; then
            echo "No changed validator scripts; skipping self-check."
            exit 0
          fi
          echo "Validator code changed — executing (not just importing via tests) so the gate can't merge broken behind an empty data-file diff:"
          printf '  %s\n' "${changed_validators[@]}"
          fail=0
          for validator in "${changed_validators[@]}"; do
            if [ ! -f "$validator" ]; then
              echo "  $validator: deleted, skipping."
              continue
            fi
            if ! uv run python "$validator" --help > /tmp/validator_help.log 2>&1; then
              echo "  $validator: FAILED to execute even --help — the gate itself is broken:"
              cat /tmp/validator_help.log
              fail=1
              continue
            fi
            echo "  $validator: --help OK (module-level imports execute cleanly)."
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more changed validators cannot execute. Fix the gate before merging."
            exit 1
          fi

          # Stronger, corpus-backed check for check_receipt_hardening.py specifically:
          # a script that imports fine but breaks on real data (e.g. a lazily-imported
          # symbol) wouldn't be caught by --help alone.
          for validator in "${changed_validators[@]}"; do
            if [ "$(basename "$validator")" != "check_receipt_hardening.py" ] || [ ! -f "$validator" ]; then
              continue
            fi
            mapfile -t corpus_receipts < <(find drift/dod_receipts -name '*.yaml' ! -name '*.supersede.*')
            echo "Running $validator against the full corpus (${#corpus_receipts[@]} receipts)..."
            set +e
            uv run python "$validator" "${corpus_receipts[@]}" > /tmp/validator_corpus.log 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Corpus run: clean (0 violations)."
            elif [ "$status" -eq 1 ] && grep -q "violation(s):" /tmp/validator_corpus.log; then
              echo "Corpus run: gate executed and reported expected violations (legacy corpus debt, not a gate defect)."
            else
              echo "Corpus run FAILED — the gate crashed instead of reporting violations:"
              cat /tmp/validator_corpus.log
              exit 1
            fi
          done

  type-check:
    # Note: This job runs mypy separately from pre-commit for full codebase checking.
    # Pre-commit hook runs mypy only on changed files (pre-push stage), while this job
    # checks the entire codebase (src/ and tests/) to catch type errors across all files.
    #
    # OMN-15731: previously skipped on every dev-targeting PR via a
    # `github.base_ref != 'dev'` clause AND'd onto this condition (added by
    # OMN-14098 / PR #3665, 2026-07-07), on the theory that `smart-test-select`
    # (below) would cover dev PRs instead. It never did -- its outputs
    # (`selected_paths`/`matrix`/`is_full_suite`) were never consumed by any
    # job (no `needs: smart-test-select` anywhere in this file), so the dev
    # path ran NEITHER the full check NOR a governed narrowed one. Since dev
    # is this repo's default branch, that meant type-check ran on
    # essentially zero real PRs for a month. Root fix: no per-branch carve-out
    # here; mypy runs on every non-docs-only PR. OCC's codebase is small
    # enough that unconditional-on-dev matches the CLAUDE.md rule-4
    # fail-closed default until a governed selector is actually wired for
    # type-checking (it currently only narrows pytest, and only in repos
    # that consume it -- OCC never did).
    name: Type Check
    needs: zone-filter
    if: needs.zone-filter.outputs.docs_only != 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run mypy
        run: uv run mypy src/ tests/

  test:
    name: Tests
    # OMN-15731: `smart-test-select` (computed changed-file-based selection
    # via scripts/ci/detect_test_paths.py) existed in this file but was never
    # wired to this job -- no `needs: smart-test-select`, no consumption of
    # its `selected_paths`/`matrix` outputs anywhere. Combined with a
    # `github.base_ref != 'dev'` clause on THIS job's own `if:` (added by
    # OMN-14098 / PR #3665, 2026-07-07), the net effect was that dev-targeting
    # PRs ran neither the governed selector's narrowed set nor the full
    # suite -- zero unit tests, on the default branch. The orphaned
    # smart-test-select job has been removed rather than wired: OCC's suite
    # is small enough that full-suite-on-every-PR matches the CLAUDE.md
    # rule-4 fail-closed default (governed selection is for repos where the
    # full suite is the bottleneck; wiring a selector here is a separate,
    # deliberate follow-up, not a silent-skip default).
    needs: zone-filter
    if: needs.zone-filter.outputs.docs_only != 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      # fetch-depth: 0 is load-bearing, not a default-tidying nicety. The suite
      # now contains git-history-resolving tests -- tests/test_check_evidence_
      # commit_shas.py's TestLiveCorpusOmn14402 calls check_file() with the real
      # git-backed resolver, which shells `git cat-file -e` against every
      # Evidence-Commit SHA cited by the live receipt corpus. A bare
      # `actions/checkout@v7` inherits the action's depth-1 default, which
      # contains only the tip commit, so the OMN-15111 gate can resolve NO
      # historical SHA and reports every honest citation as fabricated -- the
      # receipt would fail no matter which real commit it cited. Same rule this
      # file already applies to check-bot-authored-authz-guard (see the
      # fetch-depth rationale further down): a job that shells git history keeps
      # fetch-depth: 0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run tests with coverage
        run: uv run pytest --cov=onex_change_control --cov-report=term-missing

  schema-purity:
    name: Schema Purity & Naming Check
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [zone-filter, test, contract-compliance]
    # Run when test was successful or skipped (zone-filter docs-only path).
    # Skip only when contract-compliance failed/cancelled or test outright failed.
    if: |
      always() && needs.zone-filter.outputs.docs_only != 'true'
        && needs.contract-compliance.result == 'success'
        && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Check schema purity and naming conventions
        run: uv run check-schema-purity

  substance-floor:
    name: Contract Substance Floor (OMN-14409)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Deliberately UNCONDITIONAL — no zone-filter gate, no path filter, no
    # docs_only skip. The pre-commit hook only fires when a PR touches
    # contracts/*.yaml, so a PR that changes the gate itself (like the one that
    # introduced it) would never execute it: the hook logs "(no files to check)
    # Skipped" and CI goes green having proven nothing. That is precisely the
    # OMN-14416 failure — a defense that never runs — and it nearly shipped
    # inside the fix for it. This job executes the gate on every PR.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Unit tests for the deriver + floor
        run: uv run pytest tests/test_check_contract_substance_floor.py -v
      - name: Sweep the full contract corpus
        run: uv run python scripts/validation/check_contract_substance_floor.py --all
      # OMN-14767 / F-15 — DoD-authoring hygiene gate (placeholder + self-PR
      # impossible-merge). Runs in this same UNCONDITIONAL job (no new workflow,
      # net-minimal surface) so the per-row authoring gate executes on every PR,
      # not only when a PR happens to touch contracts/*.yaml (the OMN-14416
      # "defense that never runs" lesson the substance floor above already learned).
      - name: Unit tests for the DoD-authoring gate
        run: uv run pytest tests/test_check_contract_dod_authoring.py -v
      - name: Sweep the full contract corpus (DoD authoring)
        run: uv run python scripts/validation/check_contract_dod_authoring.py --all

  divergent-automation-pr-guard:
    name: No Divergent Automation PRs (OMN-14778)
    # Deliberately UNCONDITIONAL — no zone-filter/docs_only gate and no path
    # filter. The pre-commit hook only fires when a PR touches a workflow or the
    # checker itself, so a PR that changes neither would never execute it. This
    # job runs the gate on every PR (the OMN-14416 "defense that never runs"
    # lesson) so the retired occ-rerun-downstream anti-pattern — a push-to-main
    # workflow that cuts a branch off main and opens a PR to the divergent `dev`
    # base — cannot be reintroduced.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Unit tests for the guard (RED/GREEN discrimination)
        run: uv run pytest tests/test_no_divergent_automation_pr.py -v
      - name: Scan all workflows for the divergent-automation-PR anti-pattern
        run: uv run python scripts/validation/check_no_divergent_automation_pr.py --all --repo-root .

  no-localhost-fallbacks:
    name: No localhost env-var fallbacks in src/ (OMN-10737)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [zone-filter, test]
    if: needs.zone-filter.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Validate no localhost fallbacks
        run: uv run python scripts/validation/validate_no_env_fallbacks.py

  url-authority-gate:
    # OMN-13563 Wave 4: URL authority ratchet (non-blocking report; pre-commit hook is the
    # blocking surface). Fails only on NEW URL literals outside contracts — baseline is
    # burn-down only. Suppress with: # url-authority-ok: <reason>
    name: URL Authority Gate (OMN-13563)
    needs: [zone-filter]
    if: needs.zone-filter.outputs.docs_only != 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run URL authority ratchet
        continue-on-error: true
        run: >
          uv run python -m omnibase_core.validation.validator_url_authority
          --repo onex_change_control --repo-root . --all src/

  no-new-os-environ:
    # OMN-13563 Wave 4: AST os.environ read gate (non-blocking report; pre-commit hook is
    # the blocking surface). Exempts tests/, scripts/, examples/. Suppress with:
    # # env-read-ok: <reason>
    name: No New os.environ Reads (OMN-13563)
    needs: [zone-filter]
    if: needs.zone-filter.outputs.docs_only != 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Run no-new-os-environ validator
        continue-on-error: true
        run: uv run pre-commit run no-new-os-environ --all-files

  imperative-contract-guard:
    name: Imperative Contract Guard
    # OMN-14098 evidence-only fast-lane: skip heavy code analysis on pure
    # contracts/ + drift/dod_receipts/ evidence PRs (docs_only). Not a required
    # context on dev or main, so skipping cannot wedge branch protection.
    needs: [zone-filter]
    if: needs.zone-filter.outputs.docs_only != 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Validate imperative contract guard wiring
        run: |
          uv run check-imperative-contracts \
            --repo-root . \
            --allowlists-dir allowlists \
            --scan-freestanding
