name: docs-validate

on:
  pull_request:
  push:
    branches: [main, "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # OMN-16413: pinned to the exact omnibase_core merge SHA that fixed the
    # trusted-vs-public runner routing bug in validate-docs.yml (same-repo PRs
    # route to the tailnet-connected fleet; forks route to the public fleet).
    # omnibase_core main is release-synced and does NOT carry this fix yet, so
    # @main cannot be used until the next release cuts. Repoint to @main once a
    # release >= the tag containing d61fdc938a22 ships.
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@33df954e92014de4b465351832c8d8912f8174d8
