name: docs-validate

on:
  pull_request:
  push:
    branches: [main, "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # OMN-16413: pinned to the exact omnibase_core merge SHA that fixed the
    # self-hosted-routing bug in validate-docs.yml (same-repo PRs -> omnibase-ci,
    # forks stay ubuntu-latest). omnibase_core main is release-synced and does
    # NOT carry this fix yet, so @main cannot be used until the next release cuts.
    # Repoint to @main once a release >= the tag containing d61fdc938a22 ships.
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@d61fdc938a22eec34e6e251746d2ac4cb3e063d5
