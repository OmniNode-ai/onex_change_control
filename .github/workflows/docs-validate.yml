name: docs-validate

on:
  pull_request:
  push:
    branches: [main, "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@main
