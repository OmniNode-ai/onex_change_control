#
# call-occ-companion-effect.yml
#
# Per-repo occ-companion-effect trigger for onex_change_control (OMN-15261,
# closing the fan-out gap left when OMN-15012/15013/15017/15018 wired every
# OTHER occ-preflight-enforcing repo but never reached OCC itself). Thin
# caller — all publish logic lives in the omniclaude reusable, which runs
# omnimarket's canonical publisher. Mirrors omnibase_compat's / omnidash's
# caller byte-for-byte except for the ticket/repo references in this header.
#
# On a ticketed product PR (opened/synchronize/reopened/ready_for_review) the
# reusable publishes `onex.cmd.omnimarket.occ-companion-effect-requested.v1`;
# the .201 dev-lane effects runtime (node_occ_companion_effect — the canonical
# RSD-3 write-EFFECT) mints the OCC evidence companion and stamps
# `Evidence-Source: OCC#<n>` onto this PR. Only this path produces
# `occ:machine-minted` + `minted_by_node=true`. Self-referential for
# onex_change_control (the companion PR the effect opens targets the SAME
# repo this workflow runs in) — every other repo's autobind companion also
# lands here, so this is the same code path, not a special case.
#
# TRIGGER COVERAGE (OMN-14987): opened/synchronize alone miss two born-path
# holes. (1) draft->ready_for_review WITHOUT an intervening push never re-fires
# either event -- GitHub emits a distinct ready_for_review event that an
# opened/synchronize-only trigger does not listen for, so a PR opened as draft
# and later marked ready would be permanently stranded unbound (live case:
# omnibase_infra#2407). (2) closed-then-reopened has the same hole via the
# reopened event. Both are listed here from the start. The F-17
# draft-suppression guard is NOT a trigger-level gate -- it lives downstream
# in node_occ_companion_compute (handler_occ_companion_compute.py), which
# checks live pr_is_draft state at compute time, so adding ready_for_review
# here cannot cause a mint while the PR is still a draft; it only unblocks
# the mint for the transition OUT of draft.
#
# TRIGGER — NO base-branch filter, deliberately (the #2377 stacked-PR vector):
# a trigger-level `branches: [main, dev, hotfix/**]` filter means a PR whose
# base is a feature branch never fires, and when that base later retargets
# dev the opened/synchronize events have already passed — the PR silently
# never gets a companion. Every pull_request fires here; the reusable's own
# bot/OMN gate (plus this caller's copy of it) filters what should not
# publish, and any future base filtering must be IN-JOB with a logged skip,
# never at the trigger. call-occ-autobind.yml in this repo carries the same
# no-filter design so both callers stay symmetric on this point.
#
# SELF-COMPANION EXCLUSION (OMN-15334) — the load-bearing guard:
# This caller lives IN onex_change_control, so the companion PR the effect
# opens is itself an OCC PR and, before this guard, re-fired this same caller.
# One product PR (omninode_infra#735, OMN-15332) minted a 43-link cascade
# OCC#5312 -> #5354 on 2026-07-28; a second (OMN-15338) was still growing at
# #5362 when this landed. The `self-companion-guard` job below runs the
# canonical predicate (src/onex_change_control/scripts/check_occ_autobind_trigger.py)
# and the publish job is gated on its output — IN-JOB with a LOGGED skip, as
# the branch-filter note above requires, never a silent green no-op
# (OMN-15022). A depth cap is deliberately NOT used: it still burns N runs and
# still orphans the last link. Both OCC callers share the one predicate so they
# cannot diverge; symmetry here is enforced by
# tests/unit/test_occ_autobind_self_exclusion_omn15334.py.
#
# ADDITIVE / REJECTS NOTHING: this workflow is NOT a required status check. It
# publishes a command; it never fails a PR's merge. A fail-loud exit 1 on the
# trusted runner (unreachable dev broker) is a non-blocking red signal, not a
# merge gate.
#
# PIN CHOICE (E1 failure class): the reusable is pinned `@dev` because that is
# the ref that resolves. `@main` is exactly how the autobind born path died on
# the original omnibase_infra canary: `@main` while the file existed only on
# omniclaude dev fails at workflow parse time and the publisher never runs.
#
# SECRET-FREE: no `secrets: inherit` — the dev-lane broker comes from
# omnimarket's committed config/ci_bus_lanes.yaml overlay (OMN-14813), and the
# dev-lane listener is plaintext. This repo needs no Kafka secrets for this
# workflow.
#
# NO MANUAL-REPLAY ENTRYPOINT HERE (deliberate scope cut, OMN-15261): see the
# matching note in this repo's call-occ-autobind.yml -- the OMN-14993
# `workflow_dispatch` manual-replay job every sibling caller ships needs
# `scripts/ci/occ_manual_replay_precheck.py`, and onex_change_control's
# scripts/** canonical-form guard (OMN-14475, DEFAULT-DENY new scripts)
# BLOCKS a same-PR copy of that script -- its exception registry
# (`allowlists/scripts_exceptions.yaml`) is fetched from
# `onex_change_control@main` in CI, not the PR branch, so a same-PR entry
# cannot self-authorize (anti-self-approval, verified pre-commit-locally
# 2026-07-28). This caller ships the `pull_request`-triggered born path only;
# the manual-replay entrypoint is a tracked, ticketed follow-up.
#
# Ticket: OMN-15261, OMN-15012, OMN-15013, OMN-15017, OMN-14160

name: OCC Companion Effect Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OMN-15334: byte-identical to call-occ-autobind.yml's guard job by design —
  # both callers consult the one canonical predicate, so neither can drift.
  # The centralized PUBLIC runner selector unconditionally (never the trusted
  # runner lane): pure metadata arithmetic, no broker or LAN reachability
  # needed, so the born path does not inherit the .201 runner's availability
  # risk. Checked out from the PR head rather than `dev` so the PR that
  # introduces the predicate is not deadlocked by its own absence at `dev`.
  self-companion-guard:
    name: Self-companion guard (OMN-15334)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      verdict: ${{ steps.decide.outputs.verdict }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out the trigger predicate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/onex_change_control/scripts/check_occ_autobind_trigger.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No `pip install`: the predicate is stdlib-only and imports nothing from
      # its own package. Every attacker-controllable value (PR title, head ref,
      # labels) is passed through env, never interpolated into the shell command.
      - name: Decide whether to publish the companion-effect command
        id: decide
        env:
          OCC_TRIGGER_EVENT_NAME: ${{ github.event_name }}
          OCC_TRIGGER_ACTOR: ${{ github.actor }}
          OCC_TRIGGER_PR_TITLE: ${{ github.event.pull_request.title }}
          OCC_TRIGGER_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OCC_TRIGGER_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python src/onex_change_control/scripts/check_occ_autobind_trigger.py

  occ-companion-effect:
    needs: self-companion-guard
    # Dependency-bot exemption, ticket-token gate and the three self-companion
    # signals all live in the guard module, so they have exactly one definition
    # and cannot drift against a hand-maintained copy of the same conditions in
    # this expression. The reusable keeps its own defensive bot/OMN gate.
    if: needs.self-companion-guard.outputs.should_publish == 'true'
    uses: OmniNode-ai/omniclaude/.github/workflows/call-occ-companion-effect-reusable.yml@dev
    with:
      lane: dev
