#
# Product Readiness — SHADOW workflow (OMN-14704 / OMN-14644 Phase 3, CI-01/CI-02).
#
# Phase 3 fan-out to onex_change_control. This repo has ZERO `needs: occ-preflight`
# product jobs (its `occ-preflight / eligibility` context is standalone and gates
# nothing downstream), so there is NO decouple work to do. This workflow adds an
# ADDITIVE, report-only surface that runs the substantive product proof (lint,
# typecheck, tests+coverage) *independently of* any OCC evidence, then emits the
# typed reason-graph so a `needs: occ-preflight` cascade would project as ONE
# root cause rather than N red/skipped checks.
#
# LOAD-BEARING INVARIANTS (do not weaken — see design §1.1 / §3):
#   1. NO `occ-preflight` anywhere in this workflow's needs-chain. The product
#      subcheck jobs below carry no `needs: occ-preflight`, so Product Readiness
#      reports FIRST on the exact head SHA, independent of any OCC evidence.
#   2. This workflow NEVER references or triggers `call-occ-preflight.yml` and so
#      mints NO OCC request. The authoritative OCC path is untouched and still
#      runs from its own workflow exactly as before.
#   3. REPORT-ONLY / NON-REQUIRED / STANDALONE. This is a SEPARATE workflow and is
#      deliberately NOT folded into `ci.yml`'s required `CI Summary` rollup —
#      folding it in would make it authoritative and violate the shadow invariant.
#      The required dev contexts (`CI Summary`, `verify / verify`, `Pre-commit`,
#      `occ-preflight / eligibility`, `Dep Provenance Gate`, `Doctrine Coverage
#      Matrix`, `call-reject-skip-token / scan / reject-skip-gate-token`) stay
#      byte-identical. Making any context here required is a separate operator-
#      gated WS4 step; do NOT do it here.

name: product-readiness-shadow

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

# Shadow surface: newer head supersedes an in-flight shadow run for the same ref.
concurrency:
  group: product-readiness-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Product subchecks — each INDEPENDENT of occ-preflight ---------------
  lint-shadow:
    name: lint (shadow)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck-shadow:
    name: typecheck (shadow)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Mypy
        run: uv run mypy src/ tests/

  tests-shadow:
    # Fast, hermetic slice (OMN-19194): this job used to run the SAME unscoped
    # full-suite command as ci.yml's required `Tests` job
    # (`pytest --cov=onex_change_control --cov-report=term-missing`, no -m
    # filter, no path scoping) under a job-local timeout-minutes: 45 while the
    # required job carries no timeout-minutes at all (GitHub's 360-minute job
    # default). The two jobs did identical work under different budgets, so
    # once the suite's wall-clock cost grew past ~45 minutes (measured:
    # ~20-22min on 2026-09-08 vs 45m20s cancelled / 45m53s success on
    # 2026-09-22, PR #10816 run 35770887545) this job was guaranteed to be
    # cancelled on every PR -- a report-only shadow that never finishes never
    # reports a real verdict. The four sibling repos' shadows (omnibase_core,
    # omnibase_infra, omnimarket, omniclaude) all scope tests-shadow to a
    # narrow slice for exactly this reason rather than duplicating their
    # repo's full suite; this repo already had the same dedicated slice file
    # (test_product_reason_graph_omn14704.py, from the OMN-14704 Phase 3
    # landing) but it was never wired in here. `-m unit`/`-m "not slow"`
    # narrowing is not a safe substitute in this repo: those markers only
    # cover 115/229 test files, so a marker filter would silently drop most
    # of the suite rather than proving the same population the required
    # `Tests` job proves.
    #
    # The coverage dimension is folded into this job for the shadow surface — its
    # conclusion is passed as BOTH tests_conclusion and coverage_conclusion below.
    name: tests+coverage (shadow)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
      - name: Unit tests (fast, hermetic slice)
        run: uv run pytest tests/ci/test_product_reason_graph_omn14704.py -q --no-header

  # --- Typed reason-graph (ENFORCING on product defects) -------------------
  # NO occ-preflight in this needs-chain. Consumes the product subchecks'
  # conclusions only and emits exactly one typed root. Surfaced NON-required
  # context: `product-readiness-shadow / reason-graph`.
  #
  # ENFORCING (OMN-14709): the step exits NON-ZERO when the elected root is a
  # genuine product defect (PRODUCT_FAILED — lint/typecheck/tests/coverage red).
  # Non-product roots (RUNNER_INFRA / EVIDENCE_MISSING / GITHUB_API_OUTAGE /
  # POLICY_HELD / DEPLOY_TRIGGER_FAILED) and a green graph stay exit 0. This
  # workflow is deliberately kept OUT of `required_status_checks`, so a red
  # shadow reports a red check conclusion but CANNOT block merges — generating
  # the red-side parity the fleet needs without gating on it.
  reason-graph:
    name: reason-graph
    needs: [lint-shadow, typecheck-shadow, tests-shadow]
    # OMN-18580: `!cancelled()` rather than `always()`. This workflow also
    # declares `cancel-in-progress: true`, so a job-level `always()` here
    # holds the superseded run open and blocks its own successor for this
    # job's duration -- the same mechanism proven on `ci.yml`'s `pre-commit`
    # job, where it cost 9-16 minutes per OCC autobind companion. Identical
    # behaviour on every run that is not cancelled, so the red-side parity
    # this shadow exists to generate is untouched.
    if: ${{ !cancelled() }}
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Emit reason graph
        env:
          # Exact head SHA the graph is content-addressed to. For pull_request
          # use the PR head (github.sha is the ephemeral merge commit); for
          # merge_group use the queued head; else the pushed SHA.
          HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha
              || github.event.merge_group.head_sha
              || github.sha }}
          LINT_CONCLUSION: ${{ needs.lint-shadow.result }}
          TYPECHECK_CONCLUSION: ${{ needs.typecheck-shadow.result }}
          TESTS_CONCLUSION: ${{ needs.tests-shadow.result }}
        run: |
          set -uo pipefail
          facts="$(python - <<'PY'
          import json, os
          tests = os.environ.get("TESTS_CONCLUSION", "")
          print(json.dumps({
              "head_sha": os.environ.get("HEAD_SHA", ""),
              "subchecks": {
                  "change_detection": "success",
                  "lint": os.environ.get("LINT_CONCLUSION", ""),
                  "typecheck": os.environ.get("TYPECHECK_CONCLUSION", ""),
                  "tests": tests,
                  "coverage": tests,
              },
          }))
          PY
          )"
          # ENFORCING: --enforce makes the emitter exit non-zero ONLY on a
          # PRODUCT_FAILED root. Capture that exit code WITHOUT set -e swallowing
          # the summary/annotations, then re-raise it at the end.
          graph="$(python scripts/ci/product_reason_graph.py graph --facts-json "$facts" --summary --enforce 2> summary.md)"
          rc=$?
          echo "$graph"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          root_kind="$(printf '%s' "$graph" | python -c 'import json,sys; r=json.load(sys.stdin)["root"]; print(r["kind"] if r else "READY")')"
          if [ "$root_kind" = "READY" ]; then
            echo "::notice title=CI Reason Graph::READY — product dimension is green"
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=CI Reason Graph::ROOT ${root_kind} — enforcing shadow FAILED (product defect; NON-required, does not block merge)"
          else
            echo "::warning title=CI Reason Graph::ROOT ${root_kind} (non-product root; non-fatal shadow)"
          fi
          exit "$rc"
