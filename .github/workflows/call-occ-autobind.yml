#
# call-occ-autobind.yml
#
# Per-repo OCC-autobind trigger for onex_change_control (OMN-15261, closing the
# fan-out gap left when OMN-15012/15013/15017/15018 wired every OTHER
# occ-preflight-enforcing repo but never reached OCC itself). Thin caller — all
# publish logic lives in the omniclaude reusable, which in turn runs
# omnimarket's canonical publisher; this file only wires the trigger and picks
# the lane. Mirrors omnibase_compat's / omnidash's caller byte-for-byte except
# for the ticket/repo references in this header.
#
# WHY THIS WAS MISSING (OMN-15261): onex_change_control enforces
# `occ-preflight / eligibility` on its own PRs (call-occ-preflight.yml) but,
# before this change, had no born-path producer to satisfy it — every OCC
# product PR had to be hand-authored, which the implementer is forbidden from
# doing (feedback_no_self_authored_evidence). Live-verified 2026-07-28: `gh api
# repos/OmniNode-ai/onex_change_control/contents/.github/workflows?ref=dev`
# returned exactly one occ caller (call-occ-preflight.yml) before this PR.
#
# On a ticketed product PR (opened/synchronize/reopened/ready_for_review) the
# reusable publishes `onex.cmd.omnimarket.occ-autobind.v1`; the .201 effects
# runtime (node_pr_lifecycle_fix_effect -> OccCompanionEmitter) mints the OCC
# evidence companion and PATCHes `Evidence-Source: OCC#<n>` onto this PR, so
# occ-preflight resolves without a hand-authored companion. This is
# self-referential for onex_change_control (the companion PR the emitter opens
# targets the SAME repo this workflow runs in) — the emitter already supports
# that shape; every other repo's autobind companion also lands here.
#
# TRIGGER COVERAGE (OMN-14987): opened/synchronize alone miss two born-path
# holes. (1) draft->ready_for_review WITHOUT an intervening push never re-fires
# either event -- GitHub emits a distinct ready_for_review event that this
# workflow did not listen for, so a PR opened as draft and later marked ready
# was permanently stranded unbound (live case: infra#2407). (2)
# closed-then-reopened has the same hole via the reopened event. Both are now
# listed.
#
# BRANCH FILTER: no trigger-level branch filter, matching every other repo's
# caller (the #2377 stacked-PR vector) and call-occ-companion-effect.yml in
# this same repo. Any future base-branch filtering must be IN-JOB with a
# logged skip, never at the trigger.
#
# SELF-COMPANION EXCLUSION (OMN-15334) — the load-bearing guard:
# Because this caller lives IN onex_change_control, the companion PR the
# emitter opens is itself an OCC PR, so before this guard the caller re-fired
# on its own output. One product PR (omninode_infra#735, OMN-15332) minted a
# 43-link cascade OCC#5312 -> #5354 on 2026-07-28, and a second (OMN-15338)
# was still growing at #5362 when this landed. Every link ran the full OCC gate
# matrix for zero evidence, left an orphaned open PR, and left the product PR
# with an `Evidence-Source:` pointing at a companion the OMN-15247 guard then
# closed.
#
# The `self-companion-guard` job below runs the canonical predicate
# (src/onex_change_control/scripts/check_occ_autobind_trigger.py) and the publish
# job is gated on its output. This is IN-JOB with a LOGGED skip, as this
# header's branch-filter note requires — the reason is printed as a
# ::notice:: and surfaced as a job output, never a silent green no-op
# (the OMN-15022 signature). A depth cap is deliberately NOT used: it still
# burns N runs and still orphans the last link. See the module docstring for
# the signals, the seam pins into the omnimarket producers, and the live
# evidence that suppressing evidence PRs cannot strand them (293 of the last
# 300 OCC PRs are `evidence(...)` companions and all merged with
# `occ-preflight / eligibility` green while OCC had no autobind caller at all).
#
# ADDITIVE / REJECTS NOTHING: this workflow is NOT a required status check. It
# publishes a command; it never fails a PR's merge. A fail-loud exit 1 on the
# trusted runner (missing/mismatched dev broker) is a non-blocking red signal,
# not a merge gate.
#
# LANE / SECRET (OMN-14801 / OMN-14800): lane=dev is resolved against
# omnimarket's config/ci_bus_lanes.yaml@main overlay (contract-owned,
# authoritative). As of 2026-07-28, `gh api
# repos/OmniNode-ai/onex_change_control/actions/secrets` returns zero
# KAFKA_BOOTSTRAP_SERVERS-shaped repo secrets (only CLAUDE_CODE_OAUTH_TOKEN) --
# the same state omnidash and omnibase_compat shipped in before their own
# fan-out PRs, and the publisher falls back to the overlay-declared plaintext
# dev broker when the secret is unset (verified live on omnidash's own
# `OCC Autobind Publisher` run: "KAFKA_BOOTSTRAP_SERVERS is not injected;
# publishing to the overlay-declared broker for lane='dev':
# omninode-pc.tail75df5e.ts.net:19092"), so this is not a blocker.
#
# NO MANUAL-REPLAY ENTRYPOINT HERE (deliberate scope cut, OMN-15261): every
# sibling caller (compat, omnidash, spi, infra) also ships an OMN-14993
# `workflow_dispatch` manual-replay job that duplicates
# `scripts/ci/occ_manual_replay_precheck.py` locally. onex_change_control runs
# the scripts/** canonical-form guard (OMN-14475, DEFAULT-DENY new scripts,
# `check-scripts-canonical-form`) which fetches its exception registry
# (`allowlists/scripts_exceptions.yaml`) from `onex_change_control@main` in
# CI, not the PR branch — so a same-PR registry entry cannot self-authorize
# (anti-self-approval, same design as `skip_token_approvals.yaml`). Carrying
# a copy of the precheck script here would be BLOCKED by that gate
# pre-commit-locally-verified 2026-07-28) until a separate, CODEOWNERS-merged
# PR lands the exception first. Rather than block this fix on that unrelated
# governance PR, this caller ships the `pull_request`-triggered born path
# only (which is the actual "no caller at all" gap OMN-15261 closes); the
# manual-replay entrypoint is a tracked, ticketed follow-up once the registry
# entry (or a node-backed replacement) lands.
#
# Ticket: OMN-15261, OMN-15012, OMN-15013, OMN-15017, OMN-14160

name: OCC Autobind Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OMN-15334: the single decision point for "should this PR get a companion?".
  #
  # RUNNER: the centralized PUBLIC selector, unconditionally — no fork/trusted
  # branch like the reusable's OMNI_RUNNER_SELECTOR_V1. The predicate is pure
  # metadata arithmetic needing no broker or LAN reachability, so the born path
  # must not inherit the trusted .201 runner lane's availability risk
  # (omninode-pc was down for ~6h earlier on 2026-07-28). A bare literal runner
  # label is rejected by the CI Naming Convention gate ("workflows must use
  # centralized runner selector variables"), hence the vars indirection. NOTE:
  # that gate is a plain substring grep over .github/workflows with no
  # comment-awareness, so the label names themselves cannot be written here.
  #
  # The predicate is checked out from the PR head, not from `dev`. That is
  # deliberate: pinning to `dev` would deadlock the PR that introduces the
  # predicate (the file does not exist at `dev` yet, so the guard would fail and
  # this PR could never be bound). The anti-self-authorize concern that governs
  # `allowlists/scripts_exceptions.yaml` does not apply -- this predicate grants
  # no authority, it only suppresses machine noise, and it is not a required
  # check.
  self-companion-guard:
    name: Self-companion guard (OMN-15334)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      verdict: ${{ steps.decide.outputs.verdict }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out the trigger predicate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/onex_change_control/scripts/check_occ_autobind_trigger.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No `pip install`: the predicate is stdlib-only and imports nothing from
      # its own package, so it runs on a bare interpreter. Run by file path for
      # the same reason (`import onex_change_control` would pull pydantic +
      # omnibase_core).
      #
      # Every attacker-controllable value (PR title, head ref, labels) is passed
      # through env, never interpolated into the shell command.
      - name: Decide whether to publish the autobind command
        id: decide
        env:
          OCC_TRIGGER_EVENT_NAME: ${{ github.event_name }}
          OCC_TRIGGER_ACTOR: ${{ github.actor }}
          OCC_TRIGGER_PR_TITLE: ${{ github.event.pull_request.title }}
          OCC_TRIGGER_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OCC_TRIGGER_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python src/onex_change_control/scripts/check_occ_autobind_trigger.py

  occ-autobind:
    needs: self-companion-guard
    # The full trigger predicate (bot exemption, ticket token, and the three
    # self-companion signals) lives in the guard module, so it has exactly one
    # definition and cannot drift against a hand-maintained copy of the same
    # conditions in this expression. Enforced by
    # tests/unit/test_occ_autobind_self_exclusion_omn15334.py.
    if: needs.self-companion-guard.outputs.should_publish == 'true'
    # Pinned `@dev` -- call-occ-autobind-reusable.yml exists only on
    # omniclaude dev today, matching every other repo's caller (compat,
    # omnidash, spi, infra). Re-pin to `@main` or a main SHA once the reusable
    # promotes to omniclaude main (OMN-14812).
    uses: OmniNode-ai/omniclaude/.github/workflows/call-occ-autobind-reusable.yml@dev
    secrets: inherit
    with:
      lane: dev
