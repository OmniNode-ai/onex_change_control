# Asserted intent for the OMN-16753 prod-promotion grant REVOCATION.
#
# stage-prod-promotion-grant.yml reads this file in `mode: revoke` and REFUSES
# to run on any disagreement with it. What it checks here is deliberately NOT
# what it checks for a staging request. A staging bundle carries an approved_by
# and an expires_at, and the workflow pins the dispatch inputs to them because
# the bundled receipts attest to probe runs made against those exact values.
#
# A revocation proposes no approver and no expiry, so both of those inputs are
# REFUSED in revoke mode rather than accepted and quietly ignored. What is
# required instead is the durable authorisation itself: `consent_citation` names
# the ledger file and line of the OPERATOR-CONSENT row that authorises this
# removal, and `consent_quote` carries the operator's words verbatim from that
# row. Both are rendered into the PR body, so the authorisation stays resolvable
# after the session that granted it is gone (rule 18). The workflow refuses a
# citation that is not of the form `<path>:<line>` and refuses an empty quote.
#
# Stated plainly rather than implied, because it is the obvious objection: no
# file can prove a human said the words. This records evidence and bounds blast
# radius; it does not authenticate the operator. What it removes is the SILENT
# revocation - one that leaves no artifact naming an authority and a scope.
