#
# `sha256:bc95b9bc…` is `main-sha-8a4ebe6` and it is still, as of
# 2026-09-06T22:26Z, the ONLY `main`-lineage `omnicloud/core` image in ECR.
# Re-verified for this re-stage by a full scan rather than a recent-window
# sample: `aws ecr describe-images --repository-name omnicloud/core` returns 52
# images, of which exactly 1 carries a `main-sha-*` tag — this one, pushed
# 2026-08-28T10:26:09Z. Every image pushed since is dev-lineage, and
# `deploy-onex-prod.yml` refuses any dispatch whose ref is not
# `refs/heads/main`. omninode_infra `main` has advanced since OCC#7899 was
# staged (HEAD is now `bc451167`, the OMN-17350 promotion squash of
# 2026-09-01), and that advance produced no new `main`-lineage build, which is
# why the digest below is unchanged rather than merely uncontested.
#
# TWO ENTRIES, BOTH MECHANICALLY REQUIRED. `deploy-onex-prod.yml` runs the
# OMN-14209 grant gate TWICE on a `deploy_target=onex-api` dispatch:
#   * "Enforce prod-promotion grant — runtime image" carries NO `if:` guard and
#     resolves `RUNTIME_IMAGE_REF` from
#     `k8s/onex-prod/runtime/kustomization.yaml`. Re-read on omninode_infra
#     `main` at `bc451167` for this re-stage: that file still pins
#     `sha256:13c96028…`, unchanged. Entry 1 is a same-digest authorization —
#     it changes no runtime workload, it only lets the unconditional gate
#     resolve. Without it the dispatch BLOCKS before the onex-api gate.
#   * "Enforce prod-promotion grant — onex-api image" resolves the digest for
#     the dispatched `commit_sha` out of ECR. Entry 2 covers it.
#
# A GRANT IS NO LONGER SUFFICIENT ON ITS OWN — READ THIS BEFORE APPROVING.
# OMN-17357 landed on omninode_infra after OCC#7899 was staged and added a
# SECOND, independent precondition to the same consumer script: a GREEN
# staging-green report (`scripts/evaluate_staging_green_bar.py`) that is fresh,
# matches the engine's current bar revision, and is BOUND to the digest being
# promoted. It is evaluated BEFORE the grant, so a dispatch with no report
# never reaches the grant anchor at all. Proven for this re-stage, not
# inferred: run offline against this exact staged file with no report supplied,
# both digests and both dispatchers BLOCK on `[staging-green] BLOCKED
# (absent)`. Merging this PR therefore authorizes a promotion that would still
# be refused today for want of a staging-green bar. That is a fact about the
# current state of the lane, not a defect in this grant, and it is stated here
# so the approver is not surprised by it after merging.
#
# `approved_by` BELOW IS A PROPOSAL, NOT AN APPROVAL. The CODEOWNERS approver
# confirms or replaces it at merge time. It is a real login and not a
# placeholder for the reason OCC#7213 recorded: the consumer enforces
# `approved_by != requested_by` against `github.actor`, so a synthetic
# placeholder would compare unequal to EVERY dispatcher and would silently
# disable the only mechanical anti-self-approval check on this path.
#
# ANTI-SELF-APPROVAL IS SATISFIED ON THE DISPATCHER SIDE, NOT HERE. With the
# staged value `jonahgabriel`, the eventual `workflow_dispatch` actor MUST NOT
# be `jonahgabriel` — it must be another admin on `OmniNode-ai/omninode_infra`
