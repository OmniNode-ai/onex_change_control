title: Central OCC evidence for the OMN-14201 production scale-down prod-promotion grant
summary: >-
  Central OCC evidence for the PR that stages one prod-promotion grant entry onto
  onex_change_control@main for the OMN-14201 production scale-down. The entry is a SAME-DIGEST
  authorization on sha256:13c96028…, the runtime digest k8s/onex-prod/runtime/kustomization.yaml
  already pins on omninode_infra main at bc451167 and the seven onex-prod runtime pods are already
  running. It authorizes exactly one deploy_target=runtime-only dispatch of deploy-onex-prod.yml,
  whose apply is scoped to the namespace bootstrap and k8s/onex-prod/runtime, and whose only content
  change is replica counts (omninode_infra#1310). No image changes, no version roll. PREP ONLY: this
  contract proves the request is well-formed and validated against both the producer-side schema and
  the consumer-side k3s gate. It does NOT authorize prod mutation and it is NOT the approval act.
  The third receipt below records, measured rather than asserted, that the promotion this grant
  covers is currently REFUSED by the OMN-17357 staging-green premise — which is the governing
  ruling's own logic enforced mechanically, not a defect in the grant.
is_seam_ticket: false
