# this PR, per the OMN-15057/X9 finding).
#
# Every REQUIRED row below now carries an optional `branch: dev` or
# `branch: main` field (OMN-15117 schema extension) when the context is
# required on only ONE branch; a row with no `branch:` field is required on
# BOTH branches. Only `CI Summary` is required on both branches today.
#
# 10 rows that were REQUIRED at the 2026-07-20 authoring pass are no longer
# live-required on EITHER branch as of this 2026-07-25 readback and were
# removed (branch protection had already dropped them; removing here follows,
