# Imperative Contract Guard, AI-Slop Pattern Check (strict, PR diff), Context
# Integrity Contract Compliance, PEP 604 Type Union Check (UP007).
#
# Post-reconcile verification: `reconcile_manifest_vs_live.py --branch dev`
# and `--branch main` both return PASS (empty diff in both directions) —
# see PR body for full command output.
#
# RECONCILED 2026-07-30 (OMN-12592, "Require Receipt Gate, Pre-commit, CI
# Summary checks on OCC dev"). `dev` branch protection was flipped FIRST (per
# the Migration Safety procedure below), adding `verify / verify` and
# `occ-preflight / eligibility` to `required_status_checks` on `dev`; this file
# follows that flip. Live `dev` set went 2 -> 4 contexts:
#   ["CI Summary", "required-check-skip-guard / check-skip-vectors",
#    "verify / verify", "occ-preflight / eligibility"]
# with `strict: false` and every non-`required_status_checks` protection field
# preserved byte-for-byte (additive PATCH on the
# `.../protection/required_status_checks` sub-resource).
#
# WHY (the gap this closes): both contexts fired on every `dev` PR but were
# required on `main` only, so on `dev` they failed OPEN — OCC#5597 merged
# 2026-07-30T11:35:59Z with `verify / verify` RED (completed 11:12:17Z) and
# `occ-preflight / eligibility` RED (completed 11:10:03Z), neither a
# superseded stale run. At the time of that pass `CI Summary` could not cover
# them: `ci-summary` was a plain `needs:` aggregator over `ci.yml` jobs only,
# and both of these live in separate workflow files (`call-receipt-gate.yml`,
# `call-occ-preflight.yml`) — separate workflow runs a `needs:` expression can
# never observe. `dev` was therefore strictly weaker than `main` on the repo
# where every real merge lands on `dev`.
#
# UPDATE (OMN-16007, landed on `dev`; pinned by OMN-15487): that structural
# reason no longer holds. `ci-summary` now has NO `needs:` at all — it is the
# `scripts/ci/ci_summary_gate.py` poller, whose L4 layer reads the PR head's
# `commits/{sha}/check-runs` and so DOES observe cross-workflow contexts.
# Both `verify / verify` and `occ-preflight / eligibility` are named in that
# script's EXPECTED_EXTERNAL_CONTEXTS today.
#
# Their direct-required rows below nonetheless STAY. The overlap is deliberate
# belt-and-braces (the gate's own comment on those two entries says so): it
# keeps enforcement independent of branch protection and the poller staying in
# sync with each other. Do not read the poller's coverage as grounds to demote
# either row — the redundancy IS the design.
#
# Three rows changed in this pass:
#   - `verify / verify`             : `branch: main` REMOVED (now both branches)
#   - `occ-preflight / eligibility` : `branch: main` REMOVED (now both branches)
#   - `required-check-skip-guard / check-skip-vectors`: ADVISORY -> REQUIRED
#     with `branch: dev` — pre-existing manifest drift, not introduced here.
#     Branch protection already required it on `dev` as of the 2026-07-27
#     OMN-15241 flip (>=2 independent green runs, the bar its own ADVISORY
#     rationale set); the manifest row was never updated, so
#     `reconcile_manifest_vs_live.py --branch dev` was already FAILing
#     `missing_from_manifest` on it before this change. It is NOT required on
#     `main` (main's 23-context set does not contain it), hence `branch: dev`.
#
# `Pre-commit` deliberately gets NO dev row: it is a `ci.yml` job registered in
# the poller's STRICT_GATE_JOBS (success-only — its `ci:ready` label skip is
# deliberately treated as blocking), so `CI Summary` already gates it
# transitively on `dev`. Adding it as a direct dev context would be redundant,
# and the manifest must mirror live protection exactly or the reconcile fails.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so the reconcile job never observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); len 2 = Shape B/C
# ([caller_job_id, reusable_job_id]) per the design spec's context->job
# resolution algorithm (OMN-14854 ticket, spec section 1). NOTE: these
# `workflow`/`job_path`/`caller_workflow`/`cross_repo_ref` fields are
# documentation for humans — the validator itself resolves every context
# algorithmically by scanning `.github/workflows/` (see
# `_workflow_model.py::resolve_context_to_job`), so they are never a source of
# drift for the pass/fail verdict, only for readability.
#
# RECONCILED 2026-08-19 (OMN-16260, guard-workflow consolidation): the
# `call-reject-skip-token`, `Stale TODO Gate`, `main-target-guard`, and
# `required-check-skip-guard` rows' `workflow:`/`caller_workflow:` fields
# updated from their old standalone filenames (call-reject-skip.yml,
# stale-todo-gate.yml, main-target-guard.yml,
# required-check-skip-guard-caller.yml) to `guards.yml`, the new consolidated
# file that now hosts all four jobs. Each job's own `name:`/job-id and every
# `uses:` target are byte-identical to before, so the composed check-run
# NAME every one of these rows resolves to is unchanged — only the
# documentation field moved, per the file's own note above that these fields
# never drive the pass/fail verdict.

schema_version: 3
classification: toolchain
repo: onex_change_control

gates:
  # OMN-15487 — why this rationale is worded so precisely, and pinned by a test:
  # it previously read "Fail-closed if: always() aggregator over ci.yml
  # sub-jobs", which was false in BOTH directions. It overstated coverage (7 of
  # 33 ci.yml jobs — including `contract-compliance` — were absent from
  # `ci-summary`'s `needs:` entirely, letting OCC#5591 merge 2026-07-30 with
  # Contract Compliance Check RED and CI Summary GREEN on the same head), and
  # after OMN-16007 it understated coverage (there is no `needs:` at all now,
  # and L4 reaches contexts in other workflow files). A rationale that
  # misdescribes the mechanism is what let the original gap survive review, so
  # tests/ci/test_ci_summary_gate.py now fails if this text drifts back toward
  # `needs:`/aggregator vocabulary or stops naming the poller script.
  - name: "CI Summary"
    mode: REQUIRED
    producer_kind: local
    workflow: ci.yml
    job_path: ["ci-summary"]
    skip_semantics: never
    rationale: "Fail-closed if: always() poller — scripts/ci/ci_summary_gate.py. Carries no job
      dependencies: it polls this run's own job list (L1 strict success-only, L2 skippable, L3
      default-deny sweep) plus the PR head's commits/{sha}/check-runs for cross-workflow contexts
      (L4), and converts PENDING to FAILURE at a 90-minute deadline. Coverage is pinned by
      tests/ci/test_ci_summary_gate.py::test_every_pr_triggered_job_is_classified, which fails when
      any PR-triggered job in any workflow file is left unclassified — so this row's coverage claim
      is enforced, not asserted. DO NOT rename. Live required status check on both
      onex_change_control dev and main branch protection (verified 2026-08-27)."

  - name: "verify / verify"
    mode: REQUIRED
    producer_kind: local
    workflow: call-receipt-gate.yml
    job_path: ["verify"]
    skip_semantics: never
    rationale: "Receipt Gate. OMN-15689 (R3a, 2026-08-04): the reusable-workflow `uses:` call to
      omnibase_core/receipt-gate.yml@main was REPLACED by an inline local job (validator ref now
      resolved dynamically from the PR base branch, since `uses:` refs cannot be expressions) —
      producer_kind flipped cross_repo -> local and cross_repo_ref/caller_* dropped to match; the job's
      own `name:` field is literally the composed-looking context string (Shape A), same pattern as the
      `call-reject-skip-token` row below. OMN-12592 (2026-07-30): `branch: main` REMOVED — live required
      status check on BOTH dev and main. Previously main-only, which made it fail OPEN on dev (OCC#5597
      merged with this context RED). Trigger is `pull_request: branches: [main, dev, hotfix/**]` with no
      `paths:` filter, so it reports on every dev PR; verified reporting on 8/8 of the most recently
      merged dev PRs before the flip."

  - name: "Pre-commit"
    mode: REQUIRED
    branch: main
    producer_kind: local
    workflow: ci.yml
    job_path: ["pre-commit"]
    # OMN-15731 label-gated CI pilot: the job's `if:` was extended to
    # `always() && (github.event_name != 'pull_request' || github.base_ref
    # != 'dev' || contains(github.event.pull_request.labels.*.name,
    # 'ci:ready'))`. neutral_ok, not never, because: (1) this row's `branch:
    # main` scope is UNCHANGED by the pilot -- for any PR targeting `main`
    # (the only branch this row is REQUIRED on), the added disjunct
    # `github.base_ref != 'dev'` is true, so the job still runs
    # unconditionally exactly as before; (2) on `dev`, where this row is
    # deliberately NOT a direct required context (see the file-level comment
    # above), a label-skip is caught by a new explicit strict block in
    # `ci-summary` ("did not pass (result: ...) - fail-closed (OMN-15731)")
    # that treats anything but `success` as failure -- so `CI Summary`
    # (dev's actual required context) still fails closed on an unlabeled
    # dev PR. The guard's classifier cannot see either fact (it flags any
    # `github.event.*`-referencing `if:` regardless of branch scoping), so
    # this is a reviewed, documented exception, not an unreviewed skip.
    skip_semantics: neutral_ok
    rationale: "OMN-15731 pilot: dev-targeting PRs without ci:ready legitimately skip; main-targeting
      PRs (this row's actual required scope) are unaffected and still run pre-commit unconditionally.
      dev enforcement moves to a new strict fail-closed block in ci-summary. See the comment above for
      the full chain. Live required status check on onex_change_control main branch protection only
      (verified 2026-07-25 — no longer required on dev)."

  - name: "call-reject-skip-token / scan / reject-skip-gate-token"
    mode: REQUIRED
    branch: main
    producer_kind: local
    workflow: guards.yml
    job_path: ["call-reject-skip-token"]
    skip_semantics: never
    rationale: "Skip-token bypass scanner (OMN-10422) — the gate this guard's own design is modeled on.
      The job's own `name:` field literally contains the composed-looking context string (Shape A, not
      a nested reusable call). Live required status check on main only (verified 2026-07-25 — no longer
      required on dev)."

  - name: "occ-preflight / eligibility"
    mode: REQUIRED
    producer_kind: local
    workflow: call-occ-preflight.yml
    job_path: ["occ-preflight"]
    skip_semantics: never
    rationale: "Central OCC eligibility gate. OMN-15689 (R3a, 2026-08-04): the reusable-workflow
      `uses:` call to omnibase_core/occ-preflight.yml@main was REPLACED by an inline local job
      (validator ref now resolved dynamically from the PR base branch, since `uses:` refs cannot be
