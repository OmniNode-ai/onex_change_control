      match; the job's own `name:` field is literally the composed-looking context string (Shape A),
      same pattern as the `call-reject-skip-token` row below. OMN-12592 (2026-07-30): `branch: main`
      REMOVED — now a live required status check on BOTH dev and main. Closes the OMN-13332 residual:
      that ticket ('make occ-preflight REQUIRED across all auto-merging repos') is Done, yet OCC —
      which has repo-level auto-merge enabled and ships .github/workflows/auto-merge.yml — did not
      require it on dev, the branch every real merge lands on. Trigger is `pull_request: branches:
      [main, dev, hotfix/**]` with no `paths:` filter, so it reports on every dev PR; verified
      reporting on 8/8 of the most recently merged dev PRs before the flip."

