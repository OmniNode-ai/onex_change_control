# readback, required on `main` only, and are now tagged `branch: main`:
# verify / verify, Pre-commit, call-reject-skip-token / scan /
# reject-skip-gate-token, occ-preflight / eligibility, Doctrine Coverage
# Matrix, CI Naming Convention, Validate Contract YAML (OMN-8808),
# zone-filter / Zone Filter (docs-only check), call / validate-docs, Stale
# TODO Gate, main-target-guard, Receipt Honesty Gate.
#
# 10 NEW rows were added for contexts required on `main` only and never
# previously covered by this (dev-only) manifest: CodeQL / CodeQL Analysis
# (python), Kafka Boundary Parity, Migration Conflict Check, Migration
# Inventory Sync, Python<->TypeScript Null Contract, Seam Contract Coverage,
# Imperative Contract Guard, AI-Slop Pattern Check (strict, PR diff), Context
# Integrity Contract Compliance, PEP 604 Type Union Check (UP007).
#
# Post-reconcile verification: `reconcile_manifest_vs_live.py --branch dev`
# and `--branch main` both return PASS (empty diff in both directions) —
# see PR body for full command output.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so the reconcile job never observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); len 2 = Shape B/C
# ([caller_job_id, reusable_job_id]) per the design spec's context->job
# resolution algorithm (OMN-14854 ticket, spec section 1). NOTE: these
# `workflow`/`job_path`/`caller_workflow`/`cross_repo_ref` fields are
# documentation for humans — the validator itself resolves every context
# algorithmically by scanning `.github/workflows/` (see
# `_workflow_model.py::resolve_context_to_job`), so they are never a source of
# drift for the pass/fail verdict, only for readability.

