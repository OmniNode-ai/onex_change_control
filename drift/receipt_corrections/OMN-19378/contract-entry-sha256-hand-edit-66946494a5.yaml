# edited by hand in commit 66946494a5, which reached this trunk through
# OmniNode-ai/onex_change_control#11036. The edit replaced each record's
# contract_entry_sha256 with the hash of the corrected contract entry. The
# check_value in each record still shows the command that was actually
# observed, and that command hashes to the ORIGINAL value. The records as they
# stand therefore say those observations were made against an entry they were
# not made against.
