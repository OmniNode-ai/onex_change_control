    * OMN-15411 Rule E -- the paginated producer is buffered into `files` and
      replayed through `printf` rather than piped straight into an early-exiting
      `grep -q`. An unbounded producer piped into `grep -q` takes SIGPIPE (141),
      and under `bash -o pipefail` that 141 becomes the pipeline's exit status: a
      false RED on evidence that is present.
    * OMN-15382 Rule B -- 5567 is pinned as a literal. A bare ${PR_NUMBER}
      placeholder is pre-substituted by the runner with ITS OWN value, so an item
      whose id embeds pr-5567 while its check_value says ${PR_NUMBER} silently
      re-checks whatever PR the runner happens to be evaluating.

