reason: |-
  INVALIDATION, add-only, no replacement. The superseded receipt (merged in OCC #5974 at
  38ac6a61081b6ff135a7afa57b7c408e4d4981e5, authored by commit f6197f0b3560533e46db0ce540feb3a3120c235a) records
  status PASS for a check that cannot support it, and its own provenance does not resolve. This tombstone removes it
  from resolution so no adjudication can read a GREEN for OMN-15413 acceptance bullet 6 off it. The base receipt file
  is immutable under validator_occ_append_only and is left byte-for-byte intact for audit. No replacement is supplied
  BECAUSE THE HONEST FORM OF THIS EVIDENCE IS THE ABSENCE OF A CHECK: bullet 6 is a universally-quantified negative
  over the state of every live database, and no probe reachable from the dod_verify executor can falsify it. The
  restored disclosed skip is contract entry dod-omn15413-ac6-disclosed-skip-restored (status `skipped`, no `checks`
  key), added add-only in OCC #5975.
  DEFECT 1 — ALWAYS-TRUE. The check greps the changed-file list of omnibase_infra#2557, which merged
  2026-07-30T16:05:58Z and is closed. A merged PR's changed-file list is frozen, so the predicate can never change
  value and the check is frozen-green by construction.
  DEFECT 2 — FAILS OPEN. The check is `gh api ... | python3 -c ...` with no `pipefail`. When the `gh` leg errors, the
  Python leg reads empty stdin, collects no matches and exits 0. Demonstrated live 2026-08-02: substituting a
  non-existent PR number emits `gh: Not Found (HTTP 404)` on stderr and the pipeline exits 0. A GitHub outage, a
  permissions change or a deleted PR all render this check GREEN.
  DEFECT 3 — FALSE FALSIFIABILITY CLAIM. The superseded contract entry states "This check is intentionally not a
  vacuous always-true stand-in: adding any matching live deployment path to #2557's changed-file set makes it exit 1."
  No one can add a path to a merged, closed PR's changed-file set, so the asserted falsification route does not exist.
  DEFECT 4 — PROVENANCE INCOHERENCE. The receipt records contract_entry_sha256
  sha256:18aa9110e64fa16a4570fac1b3c553a987e1936f8f5de8792294ccabf75863c5 with run_timestamp 2026-08-02T14:17:52Z and
  commit_sha acc18c627f8450693f8a169cab26d2d9e87f7898. Recomputing the per-entry hash with
  omnibase_core.validation.validator_receipt_gate.compute_contract_entry_sha256 shows the entry at acc18c627 hashes to
  sha256:4c2db9e764d4b2cbcf80052b235c5edf0673c9ade3b786f38b2867b327c70035 (status `skipped`, no `checks` key), while
  sha256:18aa9110... is the hash of the entry as it exists only at f6197f0b3 (committed 2026-08-02T14:19:20Z). The
  receipt therefore binds a contract entry that did not exist at the commit it names, and its run_timestamp precedes
  that commit by 88 seconds — it records a PASS for a check that did not yet exist.
  HOW IT PASSED EVERY GATE — two blind spots, not a bypass. validator_occ_append_only computes entry drift between the
  MERGE BASE and the PR head; contracts/OMN-15413.yaml was net-new in #5974, and per
  docs/standards/receipt_hashing_and_supersession.md section 3 "a net-new contract passes trivially", so an in-PR
  rewrite of an entry that never existed on dev is structurally invisible to it. Separately, no contract check_value
  lint classifies a merged-PR file-list probe as an always-true shape. Both, plus the missing
  entry-hash-resolves-at-claimed-commit assertion, are ticketed as OMN-15664.
  THE BAR IS NOT WEAKENED BY THIS TOMBSTONE. It was never met: the receipt it invalidates certified nothing about the
  live databases. Bullet 6 returns to its authored state — reported as unproven by mechanism, accepted on operator
  judgement rather than verified.
