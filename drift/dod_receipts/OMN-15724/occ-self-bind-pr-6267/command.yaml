# Corrected 2026-08-09: the original occ-self-bind-pr-6267 check used the bare
# pulls/6267 metadata endpoint, which Contract Compliance Check's OMN-15309
# admissibility predicate refuses as INSIDE_OWN_DIFF (metadata-only gh api
# endpoints prove the change exists, not that anything it claims is true --
# see src/onex_change_control/validation/evidence_admissibility.py
# _GH_METADATA_ENDPOINT_RE). This receipt replaces it with the admissible
# pulls/6267/files shape (verified via classify_evidence(admissible_probes=
# LIVE_PROBE_COMMANDS | EXECUTED_HERMETIC_COMMANDS) -> ADMISSIBLE), asserting
# membership (ci.yml is among the changed files) plus a floor count (>=6)
# rather than an exact count, so it does not go stale on further
# non-file-adding commits to this branch.
