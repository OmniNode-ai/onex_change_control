actual_output: >-
  PASS. This branch keeps the prod-promotion grant schema in two copies and always has; OMN-14441 retired
  that duplication on dev by moving the schema into one module, and that module does not exist here. The
  duplication is now pinned rather than governed by convention: the test reads the workflow's module-level
  COMMON_REQUIRED_FIELDS, IMAGE_REQUIRED_FIELDS, MANIFEST_REQUIRED_FIELDS, OPTIONAL_FIELDS and VALID_TARGET_KINDS
  out of the PYEOF heredoc with ast.literal_eval and asserts each equals the mirror's. It is read with
  ast and never exec, because the heredoc runs the whole validation at import time and executing it would
  validate the live anchor as a side effect of a schema test. The heredoc is located through the PARSED
  workflow YAML rather than off the raw file, so a change to the surrounding workflow shape cannot silently
  make the test read nothing, and test_the_reader_finds_a_real_heredoc is the positive control that fails
  on a short read -- it asserts the extracted source carries REQUIRED_FIELDS and more than 50 lines, without
  which every constant assertion above it would pass vacuously against an empty parse. The reader currently
  returns 311 lines. This test found a REAL pre-existing disagreement on its first run: the workflow has
  tolerated the OMN-13424 consumed/consumed_at/consumed_by_correlation_id lifecycle markers since that
  ticket and the mirror carried no optional set at all. Measured directly before the fix, the mirror returned
  "Entry[0]: unexpected fields: ['consumed', 'consumed_at', 'consumed_by_correlation_id']" on an entry
  the workflow accepts, which means a consumed grant written to the anchor would have passed validate-prod-promotion-grants
  and failed the test job, turning the REQUIRED CI Summary red for a shape the anchor's own validator
  declares legal. The mirror now carries the optional set and the lifecycle type checks.
