actual_output: >-
  PASS, with the RED half kept as a permanent positive control rather than described. Migration Inventory
  Sync is a REQUIRED context on main and was already red before this branch, for five migrations present
  in sibling repos and absent from main's inventory. That is the same recurring class OMN-16130 and OMN-17145
  repaired before, and it blocks every main-target PR until the files are registered, so it is fixed here
  rather than declared pre-existing and left. dev's inventory already lists all five; they are ported
  to main with their real table lists read out of each SQL file rather than copied blank -- 105 creates
  public.ledger_chain, 106 alters delegation_workflow_state, and the three omninode_infra migrations each
  alter public.gateway_workflows and write public.migrations_log. A comment records that 104 is not a
  gap in the sequence: no 104_*.sql exists in omnibase_infra/docker/migrations/forward, the number was
  skipped, and a reader finding 103 followed by 105 would otherwise reasonably suspect a missing entry.
  The two runs above differ only in the --inventory argument. The control is not decoration here: a first
  local run reported the pre-change errors against the post-change source because the CLI resolved its
  boundaries package from a stale installed copy in the venv, which read as the fix having failed. Passing
  --inventory explicitly removes that ambiguity, and the exit status is read directly rather than after
  a pipe, where it would have been the exit status of tail.
