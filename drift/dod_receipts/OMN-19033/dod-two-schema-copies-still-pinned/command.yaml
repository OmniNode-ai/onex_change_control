actual_output: |-
  PASS. The pre-existing OMN-18579 drift suite is green against the restructured workflow: all five
  constant comparisons plus its own positive control.

  WHY THIS ITEM IS IN THIS CONTRACT AT ALL. `main` keeps the grant schema in two copies -- the inline
  validator in the workflow, and its mirror in `tests/test_prod_promotion_grants.py`. The drift suite
  reads the workflow's module-level constants out of its `PYEOF` heredoc with `ast` and asserts the
  mirror equals them. That reader navigates by `jobs['validate-prod-promotion-grants']['steps']` and
  by a regex over each step's `run` body, so a restructure of this workflow is precisely the kind of
  change that can make it read nothing and pass vacuously.

  WHAT WAS PRESERVED ON PURPOSE, and it constrained the design. The job id stays
  `validate-prod-promotion-grants`. The validator stays one `python - <<'PYEOF'` heredoc in one step
  rather than being split. The new `scope` step is a separate step whose `run` body contains no
  `PYEOF` marker, so the reader's regex still finds exactly one heredoc and finds the right one. The
  constants stay module-level assignments, because the reader uses `ast.literal_eval` over top-level
  `ast.Assign` nodes and a constant moved inside the new `finish()` function would have vanished from
  its view.

  THE SUITE CARRIES ITS OWN POSITIVE CONTROL and it is the reason this is evidence rather than
  decoration: `test_the_reader_finds_a_real_heredoc` asserts the extracted source exceeds 50 lines and
  contains `REQUIRED_FIELDS`. Without it, an empty parse would make all five comparisons pass by
  comparing nothing. The extracted heredoc measures 338 lines.
