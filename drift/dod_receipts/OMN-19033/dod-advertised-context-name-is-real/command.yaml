actual_output: |-
  PASS. The workflow declares exactly one `# Required-status-check name:` line, and the single
  backticked value on it is `validate-prod-promotion-grants`, which equals the job's own `name:`.
  The workflow declares no `workflow_call` trigger, so no caller prefix applies.

  THE STRING THIS REPLACES WAS NOT A TYPO, it was an unread instruction. The header told a human to
  require `validate-grants / validate-prod-promotion-grants` on `dev`. Measured against reality:
  there is no `validate-grants` job anywhere in the file, the file does not exist on `dev` at all,
  and the live run reports one job under one name.

      $ gh api .../actions/runs/35578429786/jobs --jq '.jobs[] | {name,conclusion}'
      {"conclusion":"success","name":"validate-prod-promotion-grants"}

  Requiring the advertised string would have put `main` into the state this whole ticket exists to
  prevent: a required context that no run ever reports, held at `expected`, with no job to rerun.

  SCOPED TO THE DECLARATION LINE, and the reason is itself a finding. The first version of this
  assertion scanned the whole file for the wrong string and went red against my own header, because
  the header now recounts the wrong name it used to carry. That history is worth keeping, so the
  assertion reads only the line a human copies from. The count assertion (`len(declarations) == 1`)
  is what keeps the narrower scope safe: a second declaration line carrying a different value cannot
  hide behind the first.
