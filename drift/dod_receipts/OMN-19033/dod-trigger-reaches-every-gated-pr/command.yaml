actual_output: |-
  PASS. The `pull_request` trigger carries no `paths` and no `paths-ignore`, it names both `dev` and
  `main`, the job carries no job-level `if:`, and the `scope` step is present with that id.

  PROVEN IN BOTH DIRECTIONS, which is the only reason the green above means anything. The four
  assertions were first run against a tree with the path filter REINSTATED at its original position
  under `on.pull_request`:

      E  assert ('paths' not in {'branches': ['dev', 'main'],
         'paths': ['grants/prod_promotion_grants.yaml'],
         'types': [...]})
      FAILED tests/test_prod_promotion_grants_required_context.py::
        TestTheTriggerCanReachEveryGatedPullRequest::test_the_pull_request_trigger_has_no_path_filter
      1 failed, 20 passed in 0.80s

  The filter was then removed again and the same command returned 21 passed. The workflow file was
  restored from a byte copy taken before the mutation, so the red direction cost the tree nothing.

  WHAT THE FOUR ASSERTIONS SEPARATE. A path filter and a job-level `if:` fail the same way from
  branch protection's side — no conclusion is reported and the context sits at `expected` forever —
  but they are different mechanisms, so each has its own assertion rather than one assertion standing
  for both. The branch assertion catches the third shape of the same defect: a trigger that reaches
  only one of the two branches that may require this context.

  LIVE CONFIRMATION, beyond the file parse. On OCC#10682 itself, which touches no grant file, the
  check run `validate-prod-promotion-grants` was created and reported `completed / success`. Under the
  previous trigger no check run would have been created at all on that pull request.
