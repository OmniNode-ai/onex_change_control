  PASS. Three assertions over the advisory arm, all against the workflow's own extracted validator.

      exits 0 on a malformed anchor when the anchor is out of scope
      prints `::warning` carrying the SAME findings the enforcing arm prints
      prints an `ADVISORY:` notice naming `grants/prod_promotion_grants.yaml`

  WHY THE SECOND ASSERTION IS THE LOAD-BEARING ONE. An advisory arm that exits 0 is trivially easy to
  write and is exactly the silent gate this ticket's parent class catalogues. The assertion is not
  that something was printed but that the specific finding text was -- `grant_id must match` appears
  in the advisory output, not a generic notice. A green run whose reason is invisible is the defect,
  so the green path is required to carry its own reason into the run summary.

  WHAT THE ARM DOES NOT SOFTEN, stated because a reader could read it as a loosening. It is reached
  only when the `scope` step proved the anchor is not changed by the pull request. Every route by
  which a bad grant can enter the registry is a change to the registry, and every such change takes
  the enforcing arm. The advisory arm exists for exactly one class of finding: a state that arrived
  with the passage of time, on a pull request that nobody wrote to touch it.

  VERBATIM ADVISORY OUTPUT against the malformed fixture:

      ::warning title=Grant anchor would not validate::grants/prod_promotion_grants.yaml has 4 schema violation(s)
        - Entry[0]: grant_id must match 'grant-<uuid4>', got: 'not-a-grant-id'
        - Entry[0]: image_digest must match 'sha256:<64hex>', got: 'sha256:deadbeef'
        - Entry[0]: expires_at must be strictly after created_at (...)
      ADVISORY: this change does not touch grants/prod_promotion_grants.yaml, so the finding above is
      reported and not enforced here. Any change that touches the anchor fails on it.
