check_value: |
  INSTANCE="${ONEX_DEV_SYSTEM_INSTANCE_ID:-i-06169517a92b45f86}"
  NS="${ONEX_DEV_NAMESPACE:-onex-dev}"
  TENANT="${OMN15922_DOD3_TENANT_ID:-18ae3951-376b-4400-af83-c34a137bfda1}"
  PREFIX="${OMN15922_DOD3_REQUEST_PREFIX:-omn15922-dod3-auth}"
  CMDS=$(NS="$NS" TENANT="$TENANT" PREFIX="$PREFIX" python3 -c '
  import json, os
  ns, ten, pre = os.environ["NS"], os.environ["TENANT"], os.environ["PREFIX"]
  py = f"""import os, psycopg
  cur = psycopg.connect(os.environ["OMNINODE_CLOUD_DB_URL"]).cursor()
  TEN, PRE = "{ten}", "{pre}%"
  cur.execute("SELECT count(*) FROM usage_events WHERE request_id LIKE %s AND tenant_id = %s::uuid", (PRE, TEN))
  print("DOD3_AUTHENTICATED_ROWS=%d" % cur.fetchone()[0])
  cur.execute("SELECT count(*) FROM usage_events WHERE tenant_id = %s::uuid", (TEN,))
  print("DOD3_TENANT_TOTAL_ROWS=%d" % cur.fetchone()[0])
  cur.execute("SELECT count(DISTINCT tenant_id::text) FROM usage_events WHERE request_id LIKE %s", (PRE,))
  print("DOD3_DISTINCT_TENANTS=%d" % cur.fetchone()[0])
  for label, pat in (("NOAUTH", "omn15922-dod3-noauth-%"), ("SIGTAMPER", "omn15922-dod3-sigtamper-%"), ("PAYTAMPER", "omn15922-dod3-paytamper-%")):
      cur.execute("SELECT count(*) FROM usage_events WHERE request_id LIKE %s", (pat,))
      print("DOD3_REFUSED_%s_ROWS=%d" % (label, cur.fetchone()[0]))
  """
  cmds = [
    "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
    f"POD=$(sudo -E kubectl -n {ns} get pod -o name | grep onex-api | head -1 | cut -d/ -f2)",
    "cat > /tmp/omn15922_dod3_check.py <<\"PYEOF\"\n" + py + "PYEOF",
    f"sudo -E kubectl -n {ns} exec -i \"$POD\" -c onex-api -- /opt/venv/bin/python - < /tmp/omn15922_dod3_check.py",
    "rm -f /tmp/omn15922_dod3_check.py",
  ]
  print(json.dumps({"commands": cmds}))
  ')
  CID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
    --comment omn15922-dod3-auth-readback --parameters "$CMDS" --query Command.CommandId --output text) || exit 1
  for _ in $(seq 1 60); do
    ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
    case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac
    sleep 3
  done
  OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" --query StandardOutputContent --output text) || exit 1
  echo "$OUT"
  grep -qE '^DOD3_AUTHENTICATED_ROWS=[1-9][0-9]*$' <<< "$OUT" &&
    grep -qE '^DOD3_TENANT_TOTAL_ROWS=[1-9][0-9]*$' <<< "$OUT" &&
    grep -qx 'DOD3_DISTINCT_TENANTS=1' <<< "$OUT" &&
    grep -qx 'DOD3_REFUSED_NOAUTH_ROWS=0' <<< "$OUT" &&
    grep -qx 'DOD3_REFUSED_SIGTAMPER_ROWS=0' <<< "$OUT" &&
    grep -qx 'DOD3_REFUSED_PAYTAMPER_ROWS=0' <<< "$OUT"
