check_value: |-
  if docker inspect omnibase-infra-omn19972-postgres >/dev/null 2>&1; then lab_py="python3 -"; else lab_py="ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201 python3 -"; fi
  $lab_py <<'PY' | grep -E '^AC3-OK pg=1 runs_default=1 runs_slug=1 control_pg=0 control_runs=0$'
  import json, subprocess, urllib.request
  P = "omnibase-infra-omn19972"
  CID = "10ec189c-d617-47ca-8b5a-04ffb0e8c56d"
  CTL = "00000000-0000-4000-8000-000000019972"
  SLUG = "local-ee67b16e7aab"
  def pg(cid):
      sql = "BEGIN READ ONLY; SELECT $q$PGROWS $q$ || count(*) FROM delegation_events WHERE correlation_id::text = $q$" + cid + "$q$; ROLLBACK;"
      try:
          out = subprocess.run(["docker", "exec", "-i", P + "-postgres", "psql", "-X", "-U", "postgres", "-d", "omnidash_analytics", "-At", "-v", "ON_ERROR_STOP=1"], input=sql, capture_output=True, text=True, timeout=30)
      except Exception:
          return "ERR"
      rows = [line.split()[1] for line in out.stdout.splitlines() if line.startswith("PGROWS ")]
      return rows[0] if out.returncode == 0 and len(rows) == 1 else "ERR"
  def runs(query, cid):
      url = "http://127.0.0.1:23002/projection/onex.snapshot.projection.delegation.decisions.v1?" + query + "correlation_id=" + cid
      try:
          with urllib.request.urlopen(url, timeout=15) as r:
              d = json.load(r)
          rows = d["rows"]
          ok = d["row_count"] == len(rows) and all(row["correlation_id"] == cid for row in rows)
      except Exception:
          return "ERR"
      return str(len(rows)) if ok else "ERR"
  facts = (pg(CID), runs("", CID), runs("tenant=" + SLUG + "&", CID), pg(CTL), runs("", CTL))
  print(("AC3-OK" if facts == ("1", "1", "1", "0", "0") else "AC3-FAIL") + " pg=%s runs_default=%s runs_slug=%s control_pg=%s control_runs=%s" % facts)
  PY
