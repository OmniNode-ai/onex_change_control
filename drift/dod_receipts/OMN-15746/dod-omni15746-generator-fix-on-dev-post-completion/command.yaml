probe_stdout: |
  local app_secret=""
  if [ "${ROTATE_UMAMI_SECRET:-0}" = "0" ] && secret_exists "umami-credentials" "$target_ns"; then
    umami_db_password=$(get_secret_key "umami-credentials" "$target_ns" "UMAMI_DB_PASSWORD") || true
    app_secret=$(get_secret_key "umami-credentials" "$target_ns" "APP_SECRET") || true
  fi
  [ -z "$umami_db_password" ] && umami_db_password=$(openssl rand -hex 24)
  [ -z "$app_secret" ] && app_secret=$(openssl rand -hex 32)

  local encoded_pass
  encoded_pass=$(urlencode "$umami_db_password")
  local database_url="postgresql://umami:${encoded_pass}@${POSTGRES_HOST}:${POSTGRES_PORT}/umami?sslmode=${POSTGRES_SSLMODE}"
  # umami's `pg-connection-string` driver aliases bare sslmode=require to
  # verify-full (full CA-chain validation), which fails against RDS's
  # Amazon-issued cert with no CA bundle mounted in the pod
  # ("self-signed certificate in certificate chain"). uselibpqcompat=true
  # restores classic libpq `require` semantics (encrypt, don't verify) --
  # matching how every other in-cluster client already behaves under
  # sslmode=require. Without this, RDS-mode umami connections TLS-fail.
  # See OMN-15738 / OMN-15746.
  if [ "$POSTGRES_SSLMODE" != "disable" ]; then
    database_url="${database_url}&uselibpqcompat=true"
  fi
  c032fa5aa8d58918f6880b89256c2340d882b8d3
