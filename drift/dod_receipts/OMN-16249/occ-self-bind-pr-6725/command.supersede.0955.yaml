  which was true while OCC#6725 was open and became permanently false the moment that PR merged (live
  state is now "closed", merged=true). Every downstream PR validating this contract therefore fails that
  check -- observed on OmniNode-ai/omninode_infra#955, where Contract Compliance reported "4/5 PASS, 0
  WARN, 1 BLOCK" against exactly this item. The replacement asserts only the PR's identity (.number),
  which is stable in every PR state, while keeping the admissible `gh api` probe verb the compliance checker
  requires -- a bare `gh pr view` is classified INERT and proves nothing. Filed as an add-only supersession
  rather than an edit because merged entries and receipts are immutable (OCC Append-Only Gate); an earlier
  revision of this branch edited them directly and that gate correctly rejected it.
