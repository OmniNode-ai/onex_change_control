actual_output: |
  PASS — PR #5568 provably touches contracts/OMN-15352.yaml.

  RED CONTROL: the same command with the asserted path swapped for
  contracts/OMN-99999-does-not-exist.yaml exits 1. So this is a falsifiable diff
  assertion about the PR, not a bare existence probe that would pass for any PR.

  SHAPE NOTES (both deliberate, both mechanically checked by hooks that run on this file):
    * OMN-15411 Rule E — the producer is buffered into `files` and replayed through
      `printf` rather than piped straight into `grep -q`. An unbounded producer piped
      into an early-exiting `grep -q` gets SIGPIPE (141), and under the dod_verify
      runner's `bash -o pipefail` that 141 becomes the pipeline's exit status: a false
      RED on evidence that is actually present.
    * OMN-15382 Rule B — 5568 is pinned literally. The bare ${PR_NUMBER} placeholder
      is pre-substituted by the runner with ITS OWN value before `sh -c` runs, so an
      item whose id embeds pr-5568 while its check_value says ${PR_NUMBER} silently
      re-checks whatever PR the runner happens to be evaluating.

  ADMISSIBILITY: admissible under the OMN-14505/OMN-15309 predicate — `gh api` is in
  LIVE_PROBE_COMMANDS and appears in command position inside the substitution, and
  `/pulls/<n>/files` returns the actual diff so it does NOT match the metadata-only
  refusal (_GH_METADATA_ENDPOINT_RE covers /pulls|issues/<n> and the
  merge/reviews/comments suffixes, not /files).
