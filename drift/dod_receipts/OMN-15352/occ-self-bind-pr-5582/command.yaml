# Self-bind receipt for OCC PR #5582. `occ-preflight / eligibility` fails
# `pr_ticket_mismatch` unless SOME PASS receipt for every cited ticket binds to
# the PR under evaluation or one of its commit SHAs. The binding is supplied
# through BOTH channels: pr_number, and a commit_sha that is a real commit of
# this PR (b8183314c745905224edba1190971f9eb9c914c8, the contract-entry commit).
#
# The check_value shape is deliberately NOT the one #5568 used. See
# actual_output: the #5568 shape is INADMISSIBLE under the predicate it claimed
# to satisfy, and correcting that claim is Finding 1 of the review this PR
# answers. This receipt uses the admissible shape and states, with an executed
# control, exactly how much weaker that shape is.
