  --jq \"[.[].filename]|length\")\" = \"5\"'"
probe_stdout: |
  exit=0 (test emits no stdout; the substitution returned 5, the number of files
  in PR #5582's own diff as reported by the GitHub API: contracts/OMN-15352.yaml
  plus four files under drift/dod_receipts/OMN-15352/)
actual_output: |
  PASS — PR #5582's file count, read from the GitHub API, is 5.

  ADMISSIBILITY: ADMISSIBLE / rule=ADMISSIBLE. Established by EXECUTING the
  predicate over this exact string, not by reasoning about it:

    classify_evidence(<this check_value>,
                      admissible_probes=LIVE_PROBE_COMMANDS | EXECUTED_HERMETIC_COMMANDS,
                      changed_paths=None) -> admissible=True, rule=ADMISSIBLE
    classify_evidence(... , changed_paths=[])   -> admissible=True, rule=ADMISSIBLE

  `gh api` is in LIVE_PROBE_COMMANDS and is in command position; the /pulls/<n>/files
  endpoint is not covered by the metadata-only refusal; and — the part the #5568
  receipt omitted — NO operand matches SELF_REFERENTIAL_PATTERNS, so the DENY half
  does not fire. That omission is what made the #5568 claim false, and correcting
  it is this PR's Finding-1 fix.

  RED CONTROLS:
    RED-1  expected count 5 -> 4                                  : exit 1.
    RED-2  (DID NOT FIRE, and is recorded rather than dropped)
           the analogous assertion against a DIFFERENT PR with the
           same file count — OCC #5479, also 4 files, asserted = 4 : exit 0.

  WHAT RED-2 MEANS. This admissible shape is measurably WEAKER than the
  inadmissible shape it replaces. #5568 asserted a specific path is in the PR's
  diff, which no other PR satisfies by accident; this asserts only a count, which
  any PR of the same size satisfies. The correction being made in this PR is to a
  LABEL, and it buys correctness of the label at a real cost in discriminating
  power. No stronger admissible form exists for an OCC companion asserting its own
  diff: every path such a PR touches is either the receipt tree or a ticket
  contract file, and SELF_REFERENTIAL_PATTERNS denies both unconditionally — even
  when read from the GitHub API at an immutable ref, which is a third-party
  surface by every other measure. That structural gap is owned by OMN-15309 and is
  not claimed as closed here.

  SHAPE NOTES:
    * OMN-15382 Rule B — 5582 is pinned literally. `${PR_NUMBER}` is pre-substituted
      by the runner with ITS OWN value before `sh -c` runs, so an item whose id
      embeds pr-5582 while its check_value used the placeholder would silently
      re-check whatever PR the runner happened to be evaluating.
    * OMN-15411 Rule E — no early-exiting consumer on an unbounded pipe. The
      producer's output is consumed in full by the command substitution, so there
      is no SIGPIPE 141 to be promoted to the pipeline's status under
      `bash -o pipefail`.
    * Hosted-runnable: `gh api` only. No LAN dependency, no ssh, no docker, no
      local filesystem operand.
