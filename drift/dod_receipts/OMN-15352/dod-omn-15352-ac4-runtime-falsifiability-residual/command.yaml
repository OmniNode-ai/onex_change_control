  WHAT IS BEING CORRECTED. Two framings in the merged AC4 supersession overstate
  what it delivered:

    (a) "This PR fixes the proof surface."
    (b) "checks (1) and (2) are the part of AC4 a hosted runner genuinely can
         decide."

  A hosted runner decides ANCESTRY between two SHAs the author typed, and the
  CONTENT of a script at a pinned immutable ref. It does not decide
  DEPLOYEDNESS. The link from f420d5fa26f704c75c3854ba2efc788d36175d13 to what
  .201 is executing is carried ENTIRELY by the seal, which is inadmissible by
  construction and correctly labelled as such. So (a) and (b) are corrected here:
  the merged change improved AUDITABILITY and added two admissible static
  assertions where there had been none — it did not close the condition it was
  written to close.

  THE RESIDUAL, ENUMERATED RATHER THAN ASSERTED (see probe_stdout). Zero
  executing checks on this contract probe .201. The supersession retired the
  single `ssh omni-201-ts` probe, and all four replacements are pinned either to
  immutable SHAs or to a file the same PR authored. None of them can go RED on
  runtime drift: if the dev lane is redeployed, rolled back, or idle-reclaimed to
  zero containers tomorrow, `dod_verify OMN-15352` stays green. AC4 declares
  proof_class live-readback and is now satisfied, mechanically, by static text.
  This entry does not close that and makes no claim to.

  WHAT THIS ENTRY ADDS: the discrimination control the original lane never
  established. The original RED control tested only the marker the fix REMOVED.
  Here the marker the fix ADDED is probed at BOTH revisions: absent (count 0) at
  the stale revision the lane was running before the AC4 redeploy, present five
  times at the revision registry.json reports deployed. So the static leg
  discriminates fixed content from stale content. It still cannot establish which
  of the two is executing on the host, and that limit is the point of this entry.

  RED CONTROLS:
    RED-1  check 1 (expects 0) pointed at the DEPLOYED ref f420d5fa...  : count 5, exit 1.
    RED-2  check 2 (expects 5) pointed at the STALE ref 7964da73...     : count 0, exit 1.
    Together these are stronger than a single-ref control: the pair cannot be
    satisfied by any single revision of the file.

  WHY NO ssh PROBE IS RE-ADDED HERE. A hosted runner has no route to .201 and no
  docker daemon holding those containers, so an ssh check would go red on
  environment rather than on drift — a red that carries no information is worse
  than a recorded residual. Closing this properly needs a scheduled,
  receipt-producing live readback, which is a mechanism build and not an OCC
  contract entry.

  RESIDUAL OWNERSHIP — no new ticket was minted, deliberately. A dedupe search
  found the class already owned three times over:
    OMN-15391  an item's description narrates a proof its command cannot produce
               (admissible, green, vacuous) — this instance is that class.
    OMN-15309  no admissible hermetic form exists for live-external evidence.
    OMN-15325  local-surface claims have no durable binding surface, and a rebind
               retires the claim silently.
  Filing a fourth would have duplicated owned work.

  ALSO NAMED, NOT OWNED BY THIS ENTRY: node_dod_verify imports no admissibility
  predicate anywhere under node_dod_verify/, so `_supersession_is_in_effect` can
  be satisfied entirely by INSIDE_OWN_DIFF checks — supersession is fail-closed
  on execution verdicts only, never on admissibility, so a superseder proving
  nothing independent can retire a live probe. Nearest existing owner: OMN-15459
  (a replacement's check_value is never validated against the item it
  supersedes). This PR is not exploiting that: both of its new entries carry
  admissible checks, and it supersedes nothing that executes.

  SCOPE: proof-surface hygiene on a ticket that is already Done (flipped
  2026-07-30T05:40:36Z on adjudicated double-run dod_verify evidence). Nothing
  here reopens that acceptance and no status was changed. The honest reading of
  a future green on this contract is unchanged by this PR: it certifies merged
  lineage and file content at pinned refs, and it does not certify what .201 is
  running.
