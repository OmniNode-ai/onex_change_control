check_value: |-
  bash -eu <<'CHECK'
  root="$(mktemp -d)"
  trap 'rm -rf "$root"' EXIT
  gh api repos/OmniNode-ai/omniclaude/tarball/0e1ba6dc453128aeed7329846594574c40ee1814 > "$root/source.tar.gz"
