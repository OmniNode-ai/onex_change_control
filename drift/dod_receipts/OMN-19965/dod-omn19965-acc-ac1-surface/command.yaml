  python3 - "$s" <<'PY'
  from pathlib import Path
  import sys
  p = Path(sys.argv[1])
  text = p.read_text()
  assert 'Bash(onex delegate:*)' in text
  p.write_text(text.replace('Bash(onex delegate:*)', 'Bash(onex:*)'))
  PY
  if run -k test_skill_md_documents_the_one_time_permission_rule; then cat "$root/result.log"; exit 1; else stripped_exit=$?; fi
  stripped="$(tail -n 1 "$root/result.log")"
  echo "clean: $clean"
  echo "planted: exit=$planted_exit $planted"
  echo "rule-stripped: exit=$stripped_exit $stripped"
  case "$clean" in *"3 passed"*) ;; *) exit 1;; esac
  case "$planted" in *"1 failed"*) ;; *) exit 1;; esac
  case "$stripped" in *"1 failed"*) ;; *) exit 1;; esac
  test "$planted_exit" = 1
  test "$stripped_exit" = 1
  CHECK
