  t=plugins/onex-delegate/tests/test_delegate_only_surface.py
  s="$root/plugins/onex-delegate/skills/delegate/SKILL.md"
  run() {
    env -u PYTHONPATH uv run --no-project --with pytest python -m pytest "$root/$t" -q -p no:cacheprovider --rootdir="$root" "$@" > "$root/result.log" 2>&1
  }
  run -k 'test_exactly_one_skill_directory or test_skill_md_documents_the_one_time_permission_rule or test_root_marketplace_sources_slim_plugin'
