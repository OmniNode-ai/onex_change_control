check_value: |-
  uv run python - <<'PROBE_20717_MERGED_EXPOSURE'
  import base64
  import os
  import subprocess

  import yaml

  ref = "fc5ef994cd3a76a8ef6e0f622ba9351d148729fe"
  path = "src/omnimarket/nodes/node_projection_delegation/contract.yaml"
  local_git = os.environ.get("OMN20717_GIT_DIR")
  if local_git:
      raw = subprocess.check_output(
          ["git", "--git-dir", local_git, "show", f"{ref}:{path}"], timeout=30
      )
  else:
      encoded = subprocess.check_output(
          ["gh", "api", f"repos/OmniNode-ai/omnimarket/contents/{path}?ref={ref}",
           "--jq", ".content"], timeout=30
      )
      raw = base64.b64decode(encoded)
  contract = yaml.safe_load(raw)
  topic = "onex.snapshot.projection.delegation.decisions.v1"
  exposures = [e for e in contract["projection_api"]["exposures"] if e["topic"] == topic]
  assert len(exposures) == 1, "decisions exposure missing or duplicated"
  exposure = exposures[0]
  assert exposure["table"] == "delegation_events", "decisions reads another table"
  assert "cost_usd" in exposure["columns"], "decisions omits stored cost_usd"
  print(f"MERGED-EXPOSURE-OK repo=OmniNode-ai/omnimarket ref={ref} table=delegation_events column=cost_usd")
  PROBE_20717_MERGED_EXPOSURE
