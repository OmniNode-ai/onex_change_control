  PASS: the readback comment on OMN-19031 records the second row count.

  WHY THE CRITERION WAS REWORDED. AC2's falsifier asked for a non-zero count of
  rows in the TRAILING HOUR. A writer draining a backlog can never produce that:
  `window_start` dates the DATA, not the write, so a writer five days behind
  commits only five-day-old windows while working perfectly. The criterion now
  measures the ADVANCE between two reads, which is decidable in both states.

  THE READING, taken from the writer pod against OMNINODE_INTERNAL_DB_URL,
  read-only via SSM on i-06169517a92b45f86, 2026-09-25:

    read 1  21:24:55Z  max(window_start) 2026-09-20 21:04:53  rows 19,741,779
    read 2  21:29:02Z  max(window_start) 2026-09-20 21:10:35  rows 19,747,900
    read 3  21:47:21Z  max(window_start) 2026-09-20 21:42:53  rows 19,772,102

  Outer pair 22.4 minutes apart: +38.0 minutes of window time and +30,323 rows,
  which is 1.70x realtime sustained across three samples rather than a burst --
  the thing AC2's "ten minutes apart" clause exists to exclude. Both quantities
  advance strictly, and max(window_start) is well past the 2026-09-13T23:36:57Z
  freeze this ticket was filed on.

  WHAT THIS DOES NOT CLAIM. It does not claim the projection is CURRENT. It is
  five days behind and closes around 2026-10-03 at the measured rate. That is
  AC3's and AC4's subject, and both remain open.

  WHY IT IS NOT BOUND TO pr-2754. AC2's previous binding sat on
  `dod-OmniNode-ai-omnimarket-pr-2754`, a merge-state surrogate: the index PR
  merging says nothing about whether the writer subsequently materialized rows,
  in either direction. This item reads a recorded measurement instead.

  THE LIMIT OF THIS CHECK, NAMED. A Linear comment is mutable, so this asserts
  against a record rather than re-deriving the measurement. Re-deriving it needs
  cluster access the OCC verifier does not have; the alternative was a
  merge-state surrogate, which is what this replaces.
