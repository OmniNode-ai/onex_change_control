evidence_item_id: dod-da-19654-ac2-state-path-declared
check_type: command
check_value: |-
  lab_ssh="$(docker inspect omnibase-infra-postgres >/dev/null 2>&1 && echo "sh -c" || echo "ssh -o BatchMode=yes -o ConnectTimeout=15 jonah@192.168.86.201")"
  dep="$($lab_ssh 'sudo -n k3s kubectl get deploy -n onex-dev omninode-runtime -o json')" || exit 1
  cm="$($lab_ssh 'sudo -n k3s kubectl get cm -n onex-dev onex-runtime-config -o json')" || exit 1
  printf '%s' "$dep" > "${TMPDIR:-/tmp}/omn19654-dep.$$.json"
  printf '%s' "$cm" > "${TMPDIR:-/tmp}/omn19654-cm.$$.json"
  python3 - "${TMPDIR:-/tmp}/omn19654-dep.$$.json" "${TMPDIR:-/tmp}/omn19654-cm.$$.json" <<'PY'
  import json, sys
  dep = json.load(open(sys.argv[1]))
  cm = json.load(open(sys.argv[2]))["data"]
  spec = dep["spec"]["template"]["spec"]
  c = spec["containers"][0]
  state = cm.get("ONEX_STATE_DIR")
  vols = {v["name"]: v for v in spec["volumes"]}
  mount = next((m for m in c["volumeMounts"] if state and state.startswith(m["mountPath"].rstrip("/") + "/")), None)
  writable = bool(mount) and "emptyDir" in vols[mount["name"]] and not mount.get("readOnly")
  ro_root = c["securityContext"].get("readOnlyRootFilesystem")
  print(f"ONEX_STATE_DIR={state} mount={mount and mount['mountPath']} emptyDir_writable={writable} readOnlyRootFilesystem={ro_root}")
  sys.exit(0 if state and writable and ro_root else 1)
  PY
  rc=$?
  rm -f "${TMPDIR:-/tmp}/omn19654-dep.$$.json" "${TMPDIR:-/tmp}/omn19654-cm.$$.json"
  exit $rc
