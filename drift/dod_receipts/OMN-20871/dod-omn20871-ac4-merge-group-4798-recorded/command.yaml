  """OMN-20871 AC4 check over the recorded GitHub readback of 2026-10-13. Read-only.

  It reads two files, kept as a copy in the lakshman data area on the lab host. Each is one GitHub API response,
  saved byte for byte on 2026-10-13 at 10:14Z:
    check-run-114258316078.json    GET repos/OmniNode-ai/omnibase_infra/check-runs/114258316078
    workflow-run-38067585409.json  GET repos/OmniNode-ai/omnibase_infra/actions/runs/38067585409
  Both are read whole before anything is graded. It prints one verdict line, AC4-OK or AC4-FAIL, and is red when
  either file is missing, unreadable, not the recorded one (sha256) or not JSON; when the check run is not the
  laptop boot check on the commit that landed omnibase_infra#4798, or did not conclude success, or does not point
  at the recorded workflow run; and when that run is not a completed, successful merge_group run on the queue
  branch of pull request 4798 at the same commit. It reads a record: GitHub is not read again.

  Run on the lab host: python3 - [folder] < this   (the folder defaults to the kept copy).
  """

  import hashlib
  import json
  import os
  import sys

  RECORDED = {
      "check-run-114258316078.json": "e842e129d270dc7fd0a6957f7b278c2531bd57075c84a926d6c8308ebfb6f075",
      "workflow-run-38067585409.json": "c3c0eb8623e05437e04b792b386969675cc5dd852914367793dc974ebf0ce7e4",
  }
  CHECK_NAME = "Runtime Boot Laptop Profile (catalog local) / runtime-boot (mode=catalog-local)"
  LANDED = "cd6fc094ea5befc8e4aa521c40f924cf930e9860"
  RUN_ID = 38067585409
  QUEUE_BRANCH = "gh-readonly-queue/dev/pr-4798-"


  class Fail(Exception):
      pass


  def recorded(root, name):
      raw = open(os.path.join(root, name), "rb").read()
      if hashlib.sha256(raw).hexdigest() != RECORDED[name]:
          raise Fail(name + " is not the recorded file (sha256)")
      return json.loads(raw.decode("utf-8"))


  def verdict(root):
      check = recorded(root, "check-run-114258316078.json")
      run = recorded(root, "workflow-run-38067585409.json")
      wanted = [
          ("check name", check.get("name") == CHECK_NAME),
          ("check commit", check.get("head_sha") == LANDED),
          ("check status", check.get("status") == "completed"),
          ("check conclusion", check.get("conclusion") == "success"),
          ("check points at the run", "/actions/runs/%d/" % RUN_ID in str(check.get("details_url"))),
          ("run id", run.get("id") == RUN_ID),
          ("run event", run.get("event") == "merge_group"),
          ("run branch", str(run.get("head_branch")).startswith(QUEUE_BRANCH)),
          ("run commit", run.get("head_sha") == LANDED),
          ("run status", run.get("status") == "completed"),
          ("run conclusion", run.get("conclusion") == "success"),
      ]
      wrong = [label for label, holds in wanted if not holds]
      if wrong:
          raise Fail("not as recorded: " + ", ".join(wrong))
      return "AC4-OK check_run=%d conclusion=%s event=%s run=%d queue_pr=4798" % (
          check["id"], check["conclusion"], run["event"], run["id"])


  if __name__ == "__main__":
      default = "/data/omninode/lakshman/omn20871-readbacks/OMN-20871-ac4-merge-group-4798-claude89fe-20261013"
      folder = sys.argv[1] if len(sys.argv) > 1 else default
      try:
          print(verdict(folder))
      except Exception as error:
          print("AC4-FAIL " + type(error).__name__ + ": " + str(error))
          sys.exit(1)
  PROBE_20871_AC4
