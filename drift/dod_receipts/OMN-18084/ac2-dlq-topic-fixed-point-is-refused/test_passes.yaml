  PASS: 12 tests green at e13932a406b5bc5ef34fefc210896238ce9a1909.

  At the parent commit a4393794 the parametrised refusal tests fail with DID NOT RAISE
  DlqTopicFixedPointError on all four dead-letter sinks, because get_dlq_topic_for_original
  returns its own input for every one of them. That is f(x) == x, and it is what put
  original_topic equal to the source topic on all 2,000 sampled records.

  Both directions are pinned. test_an_ordinary_topic_still_resolves is the positive control: a
  refusal that refused everything would satisfy the four parametrised cases and break every real
  caller. test_the_legacy_event_type_path_refuses_on_the_same_terms closes the one remaining
  laundering route, derive_dlq_topic_for_event_type's no-event_type path, which delegates here.

  The second class is the part that keeps the typed refusal SAFE. Two boundary helpers on this
  seam are documented as never raising, and one of them raises to withhold an offset. A bare
  refusal reaching either would convert a logged loss into a crash, or into an infinite
  redelivery of a deterministically failing record. Both are asserted to pre-guard and return,
  publishing nothing, rather than catching an exception after the fact. That is why AC2 is
  "every production call site pre-guards" and not merely "the resolver raises".
