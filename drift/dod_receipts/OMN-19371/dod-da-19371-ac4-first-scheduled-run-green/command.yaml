check_type: command
check_value: |-
  repo=OmniNode-ai/omninode_infra
  merged="$(gh pr view 1654 --repo "$repo" --json mergedAt --jq .mergedAt)" || exit 1
  first="$(gh run list --repo "$repo" --workflow m3-tenant-attribution-chain.yml --event schedule --limit 100 --json databaseId,conclusion,createdAt | jq -r --arg m "$merged" '[.[] | select(.createdAt > $m)] | min_by(.createdAt) | "\(.databaseId) \(.conclusion) \(.createdAt)"')" || exit 1
  id="${first%% *}"
  rest="${first#* }"
  conclusion="${rest%% *}"
  d="$(mktemp -d)" || exit 1
  gh run download "$id" --repo "$repo" -D "$d" || { rm -rf "$d"; exit 1; }
  python3 - "$d" "$id" "$conclusion" "$merged" <<'PY'
  import glob, json, sys
  d, run_id, conclusion, merged = sys.argv[1:5]
  doc = json.load(open(glob.glob(d + "/**/c19-staging-receipt.json", recursive=True)[0]))
  counted = set(doc["verdict"]["counted_kinds"])
  legs = {leg["kind"]: leg["reason"] for leg in doc["receipt"]["legs"]}
  held = {"ATTRIBUTED_OK", "REFUSED_BY_RLS"}
  assert len(counted) == 6, counted
  assert all(legs.get(k) in held for k in counted), {k: legs.get(k) for k in counted}
  assert doc["verdict"]["ok"] is True and doc["verdict"]["failures"] == []
  assert conclusion == "success", conclusion
  print(f"first scheduled run after merge {merged}: run={run_id} conclusion={conclusion} verdict.ok={doc['verdict']['ok']} counted_legs_held={len(counted)}/6")
  PY
  rc=$?
  rm -rf "$d"
  exit $rc
