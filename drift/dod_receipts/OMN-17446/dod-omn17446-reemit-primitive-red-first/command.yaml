  What each property proves, and why it is load-bearing:

  UUID PRESERVATION. The emitted envelope carries the authoritative tenants.tenant_id in all three
  places it appears (envelope.tenant_id, payload.tenant.tenant_id, metadata.tags.tenant_id), asserted
