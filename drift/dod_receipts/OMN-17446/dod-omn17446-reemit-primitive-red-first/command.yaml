  every slug pinned in the consumer-side closed legacy map. This is not defensive: the write-path
  resolver treats mirror/legacy-map disagreement as a HARD RAISE, so a re-emit that minted a fresh
  identity for 'omninode' or 'beta-business-proof' would convert two currently-resolving tenants into
  hard failures -- including the tenant the post-deploy business proof itself runs as.

  ENVELOPE SHAPE EQUALITY. Field-for-field equality against build_tenant_created_envelope, the same
  builder both create paths call, with only envelope_id/correlation_id/timestamp permitted to differ
  (they are default_factory fields and differ between two real creates too) -- and those three are
  still asserted present and well-formed. A separate test pins payload["tenant"]'s key set against the
  consumer's extra="forbid" model, so producer drift fails in this repo's own suite rather than days
  later as a mirror row the projection refused.

  FAIL-CLOSED, PROVEN BY READBACK NOT BY THE RAISE. Empty, whitespace-only, duplicate, and
  unknown-slug allowlists each refuse -- and each assertion reads back that ZERO outbox rows were
  written and that the transaction never committed, so "refused" means "nothing was enqueued" rather
  than "an exception was thrown somewhere". A partial emit would half-populate the relation a
  migration's USING clause resolves against, which reads as caught-up and is not.

  NO PRODUCER OF ITS OWN. A static read of the module source asserts it constructs no KafkaProducer,
  so it cannot publish outside the transaction and outside the flusher's ordering -- the fail-open
  path the durable outbox replaced.

  SCOPE, HELD STRUCTURALLY. A signature test asserts tenant_slugs is required and that no set-valued
  parameter (all_tenants / everything / include_all) exists, and a source test asserts no --all,
  --every or --include-all CLI flag exists. That is what excludes the operator-deferred external
  tenant: by the absence of any way to express "all", not by a denylist entry a later edit could drop.
