  added; nothing was removed or relaxed. Scope limit stated plainly: this receipt proves the branch-protection
  SETTING, read back from the API that AC-1 designates as the only acceptable evidence surface. It does
  not by itself prove GitHub's runtime behaviour for requiredApprovingReviewCount=0 plus require_code_owner_reviews=true;
  the behavioural probe (a PR touching grants/prod_promotion_grants.yaml reporting reviewDecision REVIEW_REQUIRED)
