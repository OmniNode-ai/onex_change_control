check_value: |-
  python3 - <<'PY'
  """AC1 + AC2 for OMN-18426, read live from the default branch of all 15 repos in ONE API call."""
  import json
  import subprocess
  import sys

  import yaml

  REPOS = ["RSD", "knowledge-base", "knowledge-base-internal", "omnibase_compat", "omnibase_core",
           "omnibase_infra", "omnibase_spi", "omniclaude", "omnidash", "omniintelligence",
           "omnimarket", "omnimemory", "omninode_infra", "omniweb", "onex_change_control"]
  INSTALLABLE = {"pre-commit", "pre-push", "commit-msg", "prepare-commit-msg", "post-commit",
                 "post-checkout", "post-merge"}

  # One GraphQL request for every repo: the default branch NAME (never assumed to be dev) and the
  # text of .pre-commit-config.yaml at that branch (HEAD: resolves the default branch server-side).
  parts = "\n".join(
      'r{i}: repository(owner: "OmniNode-ai", name: "{name}") {{ '
      'defaultBranchRef {{ name }} '
      'object(expression: "HEAD:.pre-commit-config.yaml") {{ ... on Blob {{ text }} }} }}'.format(i=i, name=name)
      for i, name in enumerate(REPOS)
  )
  result = subprocess.run(["gh", "api", "graphql", "-f", "query=query {\n" + parts + "\n}"],
                          check=True, capture_output=True, text=True)
  data = json.loads(result.stdout)["data"]

  failures = []
  for i, repo in enumerate(REPOS):
      node = data["r{}".format(i)]
      branch = (node.get("defaultBranchRef") or {}).get("name")
      blob = node.get("object")
      if not branch or not blob or not blob.get("text"):
          failures.append(repo)
          print("{}: FAIL no .pre-commit-config.yaml on default branch {}".format(repo, branch))
          continue
      cfg = yaml.safe_load(blob["text"]) or {}
      hooks = [h for r in cfg.get("repos", []) for h in r.get("hooks", [])]
      strip = [h for h in hooks if h.get("id") == "strip-ai-coauthor-trailer"]
      install = cfg.get("default_install_hook_types") or []
      used = {s for h in hooks for s in (h.get("stages") or [])} & INSTALLABLE
      stageless = [h["id"] for h in hooks if not h.get("stages")]
      problems = []
      # AC1: wired exactly once, commit-msg only
      if len(strip) != 1 or strip[0].get("stages") != ["commit-msg"]:
          problems.append("AC1 strip hook={}".format([h.get("stages") for h in strip]))
      # AC2: installed by default; the install list names every installable stage used;
      # stageless hooks pinned to pre-commit
      if "commit-msg" not in install:
          problems.append("AC2 default_install_hook_types={}".format(install))
      missing = sorted(used - set(install) - {"pre-commit"}) if install else sorted(used)
      if install and missing:
          problems.append("AC2 install list lacks used stages {}".format(missing))
      if stageless and cfg.get("default_stages") != ["pre-commit"]:
          problems.append("AC2 {} stageless hooks but default_stages={}".format(len(stageless), cfg.get("default_stages")))
      print("{} {}: {}".format(repo, branch, "PASS" if not problems else "FAIL " + "; ".join(problems)))
      if problems:
          failures.append(repo)

  if failures:
      print("FAIL: {} of {} repos: {}".format(len(failures), len(REPOS), failures))
      sys.exit(1)
  print("PASS: AC1 and AC2 hold on all {} default branches".format(len(REPOS)))
  PY
