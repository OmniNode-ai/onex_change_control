check_type: command
check_value: |-
  uv run python - <<'PY'
  import base64
  import subprocess
  import yaml
  sha = '66f3e88b0975c5ff22a92a57b8e4a45b98001f46'
  raw = subprocess.run(
      ['gh', 'api', 'repos/OmniNode-ai/RSD/contents/.pre-commit-config.yaml?ref=' + sha, '--jq', '.content'],
      check=True, capture_output=True, text=True,
  ).stdout
  cfg = yaml.safe_load(base64.b64decode(raw))
  hooks = [h for r in cfg.get('repos', []) for h in r.get('hooks', [])]
  strip_hooks = [h for h in hooks if h.get('id') == 'strip-ai-coauthor-trailer']
  assert len(strip_hooks) == 1, strip_hooks
  assert strip_hooks[0].get('stages') == ['commit-msg'], strip_hooks[0]
  assert cfg.get('default_install_hook_types') == ['pre-commit', 'commit-msg'], cfg.get('default_install_hook_types')
  assert cfg.get('default_stages') == ['pre-commit'], cfg.get('default_stages')
  print('PASS OmniNode-ai/RSD@' + sha[:12] + ' installs commit-msg by default, default_stages is [pre-commit], strip hook is commit-msg-only')
  PY
