check_value: |-
  python3 - <<'PY'
  """AC3 negative control: both falsifiers the criterion names must turn the proof red."""
  import re
  import shutil
  import subprocess
  import sys
  import tempfile
  from pathlib import Path

  TEST = Path("tests/unit/test_strip_ai_coauthor_trailer_hook.py")
  CONFIG = Path(".pre-commit-config.yaml")
  MUTANTS = {
      "an entry that strips nothing": "true",
      "an entry that strips every line mentioning Claude": "perl -i -ne 'print unless /claude/i'",
  }

  results = []
  for label, entry in MUTANTS.items():
      with tempfile.TemporaryDirectory() as work:
          root = Path(work)
          (root / "tests" / "unit").mkdir(parents=True)
          shutil.copy(TEST, root / "tests" / "unit" / TEST.name)
          original = CONFIG.read_text()
          mutated = re.sub(r"entry: perl -i -ne .*\n", "entry: " + entry + "\n", original, count=1)
          if mutated == original:
              sys.exit("CONTROL BROKEN: the mutation did not apply for " + label)
          (root / CONFIG.name).write_text(mutated)
          run = subprocess.run(
              ["uv", "run", "pytest", str(root / "tests" / "unit" / TEST.name), "-q", "-p", "no:cacheprovider"],
              capture_output=True, text=True,
          )
          tail = run.stdout.strip().splitlines()[-1] if run.stdout.strip() else run.stderr.strip()[-200:]
          if " failed" not in tail:
              sys.exit("CONTROL BROKEN: " + label + " did not turn the proof red: " + tail)
          if "error" in tail:
              sys.exit("CONTROL BROKEN: " + label + " errored instead of failing: " + tail)
          results.append((label, tail))

  print("PASS both falsifiers named in AC3 turn the behaviour test red")
  for label, tail in results:
      print("  " + label + ": " + tail)
  PY
