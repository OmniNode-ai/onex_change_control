  A NAIVE CHECK WAS REJECTED, and the reason is the point. Greping for the OLD swallow comment
  returns 1 at BOTH shas, because the new method quotes that exact old code inside its own docstring
  to explain what it replaced. A contract that had bound AC6 to that grep would have been green with
  the fix reverted. It is not in the contract.

  WHAT WAS READ, both shas side by side. At the parent, the code minted a throwaway uuid4, assigned
  it to the payload, caught the refusal in a bare two-exception handler whose body was a pass, and
  then logged THAT discarded id as the published correlation. The delegation request model is frozen
  with extra forbidden, so on that path the assignment ALWAYS raised and every capture log named a
  correlation appearing nowhere on the broker. At the merge sha the mint is replaced by
  _resolve_wire_correlation_id, which returns the id together with its provenance -- the payload's
  own id when it carries one, a runtime-minted id only to fill a genuine absence, and an explicit
  unstampable report, logged as a warning and never swallowed, when a frozen payload refuses the
  stamp. The same resolved pair then goes to the log line, so the printed id is BY CONSTRUCTION the
  one on the wire rather than a second value that happens to agree.

