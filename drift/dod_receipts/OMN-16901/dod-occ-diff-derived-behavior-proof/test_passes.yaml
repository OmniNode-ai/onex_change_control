    * tests/unit/hooks/lib/test_worktree_prune_policy.py (24) — the pure
      two-part predicate. The four lines that must never move: a dirty tree must
      NEVER classify safe (including when fully merged — merged-ness does not
      launder uncommitted work); an ahead-unmerged branch must NEVER classify
      safe; a squash-merged branch whose tree-diff against dev is empty MUST
      classify safe; an open / In Progress ticket is NEVER prune-eligible however
      spotless the tree. Also covers: a ledger CLAIM newer than the TERMINAL row
      blocking an otherwise-Done ticket, unresolvable ticket state failing closed,
      detached HEAD, unresolvable base ref, unpushed stash, and that every
      violated condition is reported rather than only the first.
    * tests/scripts/test_worktree_auto_prune.py (19) — fact collection, where a
      bug is just as capable of deleting live work as one in the predicate.
      Ledger claim-awareness (a CLAIM after a TERMINAL reopens the ticket;
      CLAIM+TERMINAL on one line resolves to TERMINAL; a section body inherits
      its ticket from the nearest heading; prose mentioning a ticket is not a
      claim), stash attribution (repo-wide stashes attributed to a branch, with
      prefix collisions rejected — `feat/a-extended` is not `feat/a`), tracker
      state mapping (only completed/canceled are terminal), and worktree
      discovery (a linked worktree's .git is a file, a full clone's is a
      directory).

