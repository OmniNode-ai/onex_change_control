check_value: |-
  env -u PYTHONPATH uv run python -c "
  import yaml
  d = yaml.safe_load(open('contracts/OMN-18033.yaml'))
  items = {i['id']: i for i in d['dod_evidence']}
  sup = items['dod-OmniNode-ai-omnibase_core-pr-1710']
  bodies = ' '.join(c['check_value'] for c in sup['checks'])
  assert 'contents/' in bodies and 'pulls/' in bodies, 'superseded item is not tree-only'
  for verb in ('psql', 'rpk ', 'docker ', 'pre-commit run', 'validators.gitignore_baseline'):
      assert verb not in bodies, f'superseded item does contact {verb!r}; premise is wrong'
  ac2 = items['ac2-validator-refuses-an-altered-managed-block']
  assert ac2['binds_ac'] == ['AC2'], ac2.get('binds_ac')
  assert 'validators.gitignore_baseline' in ac2['checks'][0]['check_value']
  retired = {(e['item'], e['label']) for i in d['dod_evidence'] for e in i.get('supersedes_ac_binding', [])}
  assert ('dod-OmniNode-ai-omnibase_core-pr-1710', 'AC1') in retired, retired
  assert ('dod-OmniNode-ai-omnibase_core-pr-1710', 'AC2') in retired, retired
  hand = {label for i in d['dod_evidence'] if i.get('source') == 'manual' for label in i.get('binds_ac', []) if (i['id'], label) not in retired}
  assert hand == {'AC2'}, f'expected AC2 alone to be hand-bound, got {sorted(hand)}'
  print('OK retirement premise holds: superseded checks are tree-only; AC2 is hand-bound to a check that runs the validator; no hand-authored item claims AC1')
  "
