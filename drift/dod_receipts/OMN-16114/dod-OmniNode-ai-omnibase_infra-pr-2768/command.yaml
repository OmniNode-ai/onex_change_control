# Fix 2026-08-17 (post-push, OCC#6595's own Contract Corpus Ratchets check, OMN-15411 Rule E): the
# original check_value piped a base64-decoded file body directly into `grep -q`, which is the
# measured SIGPIPE-fragile shape (grep -q exits at the first match and closes its stdin; if the
# upstream base64 process still has bytes to write it is killed by SIGPIPE, exit 141, which
# `bash -o pipefail` propagates as a false RED on genuinely-passing evidence -- omnimarket's own
# corpus measured this exact shape at 141,0,141,0,141 across 5 runs). Rewritten per the documented
# repair idiom (occ#5496/#5523 precedent): the producer's output is captured into a shell variable
# first, so it runs to completion before anything reads from it, then a printf of that variable is
# piped into grep -qF. Re-verified live: still returns exit 0 with the real evidence, still RED
# against the PR's base ref. Admissibility unaffected: still classifies ADMISSIBLE (gh-api + grep in
# command position, still content-bound, still falsifiable, still outside its own diff) --
