actual_output: |-
  PASS. Four runs, four drains to zero, every one inside the stated 120s bound with a 45ms spread
  across the set (5.123 / 5.168 / 5.157 / 5.148s). Both branches of AC5's falsifier are answered.

  FIRST BRANCH -- "no sanctioned load-and-drain proof exists that can be pointed at onex-dev" -- is
  closed by omninode_infra#1541, merged 2026-09-17T20:48:33Z at squash 4ac73c6c and present on both
  dev and main, with its own test at tests/scripts/test_msk_load_and_drain_omn10856_ac5.py. The load
  half is a third MODE of the existing check rather than a second script, so the producer shares the
  build_aiokafka_auth_kwargs_from_env() wiring with the admin and consumer and there is no second
  credential path. Before it, the only candidate publish path was `onex delegate --bus kafka`, which
  refuses at its pre-flight lane probe with ONEX_CORE_041_INVALID_CONFIGURATION; a producer never
  joins a consumer group, so this path does not depend on that defect or on OMN-15639.

  SECOND BRANCH -- "lag does not return to zero within a stated bound" -- is refuted by the table
  above, against a bound stated in advance rather than fitted afterwards.

  THE CONTROL is peak == published on every run. A harness that never observed lag rise could report a
  drain against a topic where the publish silently failed and produce a vacuous zero; lag rose to
  exactly the published count and returned to zero in all four.

  WHAT THIS DOES NOT CLAIM: a drain proves the group consumed to the log end within the bound, not
  that the records did any work. OMN-13363 is the precedent -- synthetic events consumed, projected
  true reported, lag zero, and zero rows written. AC5 claims consumption; consumption is what these
  runs measure. The harness carries this caveat in its own report, with a test asserting it cannot be
  dropped silently.
