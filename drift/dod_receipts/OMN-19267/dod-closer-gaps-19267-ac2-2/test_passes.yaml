  python3 - <<'PY'
  import base64, json, os, subprocess, tempfile
  from pathlib import Path
  with tempfile.TemporaryDirectory(prefix='closer-gaps-proof-') as directory:
      root = Path(directory)
      refs = {'omnimarket': '341ceb1bd6d74df7b313979dbf65bbeef30f6a93'}
      for repo, ref in refs.items():
          tree = root / repo
          tree.mkdir()
          endpoint = 'repos/OmniNode-ai/omnimarket/tarball/' + ref if repo == 'omnimarket' else 'repos/OmniNode-ai/' + repo + '/tarball/' + ref
          archive = subprocess.check_output(['gh', 'api', '--cache', '1h', endpoint])
          subprocess.run(['tar', 'xz', '--strip-components=1', '-C', str(tree)], input=archive, check=True)
          print(repo + ' source_commit=' + ref, flush=True)
      env = dict(os.environ)
      env.pop('PYTHONPATH', None)
      env.pop('ONEX_TENANT_ID', None)
      env['UV_PROJECT_ENVIRONMENT'] = str(root / 'venv')
      env['OMN_15651_CANDIDATE_WORKSPACE'] = str(root)
      tree = root / 'omnimarket'
      test = ['uv', 'run', '--frozen', 'pytest', 'tests/unit/delegation/test_prose_task_class_no_think_omn18967.py', '-q', '-p', 'no:cacheprovider']
      green = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print(green.stdout + green.stderr, end='', flush=True)
      assert green.returncode == 0, 'current declared falsifier must pass'
      assert ' skipped' not in green.stdout, 'a skipped test is not proof'
      config = tree / 'src/omnimarket/configs/inference_protocols.v1.yaml'
      old_ref = '607cce198d85b51bbd5a107533491f723af372e0'
      old = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/configs/inference_protocols.v1.yaml?ref=' + old_ref, '--jq', '.content'])
      config.write_bytes(base64.b64decode(old))
      red = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print(red.stdout + red.stderr, end='', flush=True)
      assert red.returncode == 1 and 'reasoning' in red.stdout and 'complex_reasoning' in red.stdout
      print(json.dumps({'historical_profile_ref': old_ref, 'historical_red_exit': red.returncode}, sort_keys=True))
      print(json.dumps({'green_exit': green.returncode, 'sources': refs}, sort_keys=True))
  PY
