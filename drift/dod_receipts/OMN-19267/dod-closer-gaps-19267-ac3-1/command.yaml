  python3 - <<'PY'
  import base64, json, os, subprocess, tempfile
  from pathlib import Path
  with tempfile.TemporaryDirectory(prefix='closer-gaps-proof-') as directory:
      root = Path(directory)
      refs = {'omnibase_core': '13ceae69c246a33c9fc8fc4b33f83fb66b89edc6', 'omnibase_infra': '94ead58a3caf4a68e018794ae73e23a1c747d641', 'omnimarket': '341ceb1bd6d74df7b313979dbf65bbeef30f6a93', 'omninode_infra': '79293265d0995fe82d855a85242cbf9c344607de'}
      for repo, ref in refs.items():
          tree = root / repo
          tree.mkdir()
          endpoint = 'repos/OmniNode-ai/omninode_infra/tarball/' + ref if repo == 'omninode_infra' else 'repos/OmniNode-ai/' + repo + '/tarball/' + ref
          archive = subprocess.check_output(['gh', 'api', '--cache', '1h', endpoint])
          subprocess.run(['tar', 'xz', '--strip-components=1', '-C', str(tree)], input=archive, check=True)
          print(repo + ' source_commit=' + ref, flush=True)
      env = dict(os.environ)
      env.pop('PYTHONPATH', None)
      env.pop('ONEX_TENANT_ID', None)
      env['UV_PROJECT_ENVIRONMENT'] = str(root / 'venv')
      env['OMN_15651_CANDIDATE_WORKSPACE'] = str(root)
      tree = root / 'omninode_infra'
      test = ['uv', 'run', '--frozen', 'pytest', 'tests/architecture/test_omn_15651_task_class_authority.py', '-q', '-p', 'no:cacheprovider']
      green = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print(green.stdout + green.stderr, end='', flush=True)
      assert green.returncode == 0, 'current declared falsifier must pass'
      assert ' skipped' not in green.stdout, 'a skipped test is not proof'
      config = root / 'omnimarket/src/omnimarket/configs/inference_protocols.v1.yaml'
      config.write_bytes(config.read_bytes() + b'\n')
      red = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print(red.stdout + red.stderr, end='', flush=True)
      assert red.returncode == 1 and 'inference_protocols.v1.yaml' in red.stdout and 'identity drift' in red.stdout
      print(json.dumps({'whole_file_sha_mutation_red_exit': red.returncode}, sort_keys=True))
      print(json.dumps({'green_exit': green.returncode, 'sources': refs}, sort_keys=True))
  PY
