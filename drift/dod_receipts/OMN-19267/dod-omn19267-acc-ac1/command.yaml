check_type: command
check_value: |-
  python3 - <<'PY'
  import json, os, subprocess, sys
  from pathlib import Path
  state = Path(os.environ['OMNI_HOME']) / '.onex_state'
  run = subprocess.run([
      str(Path(os.environ['OMNI_HOME']) / 'omnibase_infra/scripts/onex'),
      'delegate', 'Explain in three sentences why a test that only checks source text cannot establish runtime behavior.',
      '--task-type', 'reasoning', '--ticket', 'OMN-19267', '--bus', 'kafka',
      '--lane', 'dev', '--locus', 'deployed-lane', '--state-root', str(state), '--json',
  ], capture_output=True, text=True, timeout=600)
  if run.returncode:
      print(json.dumps({'exit_code': run.returncode, 'stdout': run.stdout, 'stderr': run.stderr}, sort_keys=True))
      sys.exit(run.returncode)
  reply = json.loads(run.stdout)
  run_id = reply['run_id']
  receipt = json.loads((state / 'runs' / run_id / 'receipt.json').read_text())
  terminal = receipt['receipt']['result']['terminal_payload']['payload']
  accepted = [a for a in terminal['attempts'] if a['acceptance_decision'] == 'accept']
  result = (state / 'runs' / run_id / 'result.txt').read_text()
  assert receipt['status'] == 'success', receipt
  assert terminal['status'] == 'completed', terminal['status']
  assert accepted and accepted[-1]['tier'] == 'local', accepted
  assert terminal.get('output_refusal') is None, terminal.get('output_refusal')
  assert result.strip() and terminal['response'].strip(), 'empty reasoning deliverable'
  print(json.dumps({'run_id': run_id, 'correlation_id': receipt['correlation_id'],
      'accepted_tier': accepted[-1]['tier'], 'backend_id': accepted[-1]['backend_id'],
      'output_refusal': terminal.get('output_refusal'), 'result_bytes': len(result.encode()),
      'status': terminal['status']}, sort_keys=True))
  PY
