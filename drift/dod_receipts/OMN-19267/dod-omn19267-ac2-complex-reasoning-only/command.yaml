check_value: |-
  python3 - <<'PY'
  # Product under test: repos/OmniNode-ai/omnimarket/commits/b270b04bce8491b51fe9f0dfe7fb64dacd1fbf2a (dev when this probe was authored); the probe itself reads dev at run time.
  import base64, json, os, subprocess, tempfile
  from pathlib import Path
  with tempfile.TemporaryDirectory(prefix='omn19267-c16-ac2-') as directory:
      root = Path(directory)
      tree = root / 'omnimarket'
      tree.mkdir()
      sha = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/commits/dev', '--jq', '.sha'], text=True).strip()
      archive = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/tarball/' + sha])
      subprocess.run(['tar', 'xz', '--strip-components=1', '-C', str(tree)], input=archive, check=True)
      print('omnimarket dev=' + sha, flush=True)
      env = dict(os.environ)
      env.pop('PYTHONPATH', None)
      env.pop('VIRTUAL_ENV', None)
      env['UV_PROJECT_ENVIRONMENT'] = str(root / 'venv')
      node = 'tests/unit/delegation/test_prose_task_class_no_think_omn18967.py'
      test = ['uv', 'run', '--frozen', 'pytest', node, '-q', '-p', 'no:cacheprovider']
      green = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print(green.stdout, end='', flush=True)
      assert green.returncode == 0, 'current declared falsifier must pass'
      assert ' skipped' not in green.stdout, 'a skipped test is not proof'
      assert 'complex_reasoning' in (tree / node).read_text(), 'the sweep must be able to name complex_reasoning'
      historical_ref = '607cce198d85b51bbd5a107533491f723af372e0'
      old = subprocess.check_output(['gh', 'api', 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/configs/inference_protocols.v1.yaml?ref=' + historical_ref, '--jq', '.content'])
      config = tree / 'src/omnimarket/configs/inference_protocols.v1.yaml'
      config.write_bytes(base64.b64decode(old))
      red = subprocess.run(test, cwd=tree, env=env, capture_output=True, text=True)
      print('\n'.join(line for line in red.stdout.splitlines() if line.startswith('FAILED ') or ' failed' in line), flush=True)
      assert red.returncode == 1, 'the pre-change profile must fail the declared falsifier'
      failed = [line for line in red.stdout.splitlines() if line.startswith('FAILED ') and 'complex_reasoning' in line]
      assert failed, 'complex_reasoning must be among the failures: ' + red.stdout[-1500:]
      print(json.dumps({'green_ref': sha, 'historical_ref': historical_ref, 'historical_profile_red_exit': red.returncode, 'complex_reasoning_failures': len(failed)}, sort_keys=True))
  PY
