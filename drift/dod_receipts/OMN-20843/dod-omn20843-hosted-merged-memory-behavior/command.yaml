  python3 - "$source_file" <<'PROBE'
  import runpy
  import sys
  from dataclasses import replace
  m = runpy.run_path(sys.argv[1])
  host = m['Host']('probe', 'probe', frozenset(), None, True)
  reading = m['Reading'](host, mem_avail_gb=44, swap_used_frac=0.96, mem_psi_avg60=0.09, swap_in_kb_s=0, swap_out_kb_s=0)
  assert reading._memory_refusals() == [], 'stale swap occupancy refused'
  psi = replace(reading, swap_used_frac=0, mem_psi_avg60=m['ADMIT_MAX_MEM_PSI'] + 1)._memory_refusals()
  assert len(psi) == 1 and 'memory PSI' in psi[0], psi
  traffic = replace(reading, swap_used_frac=0, swap_in_kb_s=m['ADMIT_MAX_SWAP_KB_S'] + 1)._memory_refusals()
  assert len(traffic) == 1 and 'swap traffic' in traffic[0] and 'KB/s' in traffic[0], traffic
  assert m['_swap_io']('SWAPIO 4 1 2 50000 50000') == (4.0, 8.0)
  assert m['_swap_io']('SWAPIO 4 50000 50000 1 2') == (4.0, 8.0)
  assert m['_swap_io']('SWAPIO 4 30000 30000 40000 40000') == (120000.0, 120000.0)
  parsed = m['parse_probe'](host, 'PROBE 8 0.1 46137344\nSWAPIO 4 1 2 50000 50000', 0)
  assert (parsed.swap_in_kb_s, parsed.swap_out_kb_s) == (4.0, 8.0)
  assert m['_PROBE_BASE'].count('sio=') == 2 and 'echo \"SWAPIO $sio\"' in m['_PROBE_BASE']
  print('stale swap admitted; PSI and sustained swap traffic refused; both sample orders, parsing and probe source checked')
  PROBE
