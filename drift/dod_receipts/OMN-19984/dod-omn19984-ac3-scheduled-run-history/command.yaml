  one() {
    m=$(gh api "$A/runs/$1" --jq '[.path,.event,.head_branch,.conclusion,.head_sha,.created_at]|join(" ")') || { echo "FAIL run $1: run metadata could not be read" >&2; return 1; }
    read -r p e b c s t <<<"$m"
    if [ "$p" != ".github/workflows/$2" ] || [ "$e" != schedule ] || [ "$b" != dev ] || [ "$c" != success ]; then echo "FAIL run $1: $p $e $b $c" >&2; return 1; fi
    l=$(gh run view "$1" -R OmniNode-ai/omninode_infra --log) || { echo "FAIL run $1: run log could not be read" >&2; return 1; }
    v=$(printf '%s\n' "$l" | awk '{ n=index($0,"\t"); if (!n) next; r=substr($0,n+1); n=index(r,"\t"); if (!n) next; r=substr(r,n+1); n=index(r," "); if (!n) next; r=substr(r,n+1); sub(/\r$/,"",r); if (r ~ /^C3[0-9]_VERDICT=/) print r }' | sort -u)
    if [ "$v" != "$3_VERDICT=PASS" ]; then echo "FAIL run $1: verdict lines [$(echo $v)], need exactly one, $3_VERDICT=PASS" >&2; return 1; fi
    echo "$s $t"
  }
  shas=""; for r in $C31; do x=$(one "$r" c31-local-dashboard-parity.yml C31) || exit 1; echo "C31 run $r PASS on ${x%% *}"; shas="$shas ${x%% *}"; done
  n=$(echo $shas | tr ' ' '\n' | sort -u | wc -l | tr -d ' ')
  if [ "$n" != 3 ]; then echo "FAIL C31: $n distinct dev commits, need 3" >&2; exit 1; fi
  ts=""; for r in $C30; do x=$(one "$r" c30-claude-code-plugin-delegate.yml C30) || exit 1; echo "C30 run $r PASS at ${x##* }"; ts="$ts ${x##* }"; done
  lo=$(echo $ts | tr ' ' '\n' | sort | head -1); hi=$(echo $ts | tr ' ' '\n' | sort | tail -1)
  k=$(gh api "$A/workflows/c30-claude-code-plugin-delegate.yml/runs?event=schedule&branch=dev&created=$lo..$hi&per_page=100" --jq .total_count) || { echo "FAIL C30: the scheduled-run listing could not be read" >&2; exit 1; }
  if [ "$k" != 3 ]; then echo "FAIL C30: $k scheduled runs between $lo and $hi, need exactly these 3 consecutive" >&2; exit 1; fi
  echo "AC3 PASS: C31 green on 3 distinct dev commits; C30 green on 3 consecutive scheduled dev runs"
