check_type: command
check_value: |-
  uv run python - <<'PY'
  import pathlib, sys, yaml
  from onex_change_control.validation.ac_criteria import canonical_ac_label

  REQ = "req-transcribed-acceptance-criteria"
  bad: list[str] = []
  seen = 0
  for path in sorted(pathlib.Path("contracts").glob("OMN-*.yaml")):
      data = yaml.safe_load(path.read_text(encoding="utf-8"))
      if not isinstance(data, dict):
          continue
      reqs = [r for r in (data.get("requirements") or []) if isinstance(r, dict)]
      if not any(r.get("id") == REQ for r in reqs):
          continue
      seen += 1
      declared = {
          canonical_ac_label(str(a.get("id")))
          for r in reqs
          for a in (r.get("acceptance") or [])
          if isinstance(a, dict)
      }
      bound = {
          canonical_ac_label(str(e))
          for it in (data.get("dod_evidence") or [])
          if isinstance(it, dict)
          for e in (it.get("binds_ac") or [])
      }
      if not declared or declared != bound:
          bad.append(f"{path.name}: declared={sorted(declared)} binds_ac={sorted(bound)}")
  print(f"{seen} contract(s) carry the transcribed block; {len(bad)} mismatched")
  for line in bad:
      print("MISMATCH", line)
  sys.exit(1 if bad or seen < 25 else 0)
  PY
