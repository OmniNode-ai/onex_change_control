schema_version: 1.0.0
ticket_id: OMN-19143
evidence_item_id: re-running-the-producer-writes-nothing
check_type: command
check_value: |-
  uv run python - <<'PY'
  import pathlib, sys, yaml
  from onex_change_control.validation.ac_criteria import canonical_ac_label

  REQ = "req-transcribed-acceptance-criteria"


  def bound_labels_in_order(data: dict) -> list[str]:
      labels: list[str] = []
      for item in data.get("dod_evidence") or []:
          if not isinstance(item, dict):
              continue
          for entry in item.get("binds_ac") or []:
              label = canonical_ac_label(str(entry))
              if label and label not in labels:
                  labels.append(label)
      return labels


  bad: list[str] = []
  seen = 0
  criteria = 0
  for path in sorted(pathlib.Path("contracts").glob("OMN-*.yaml")):
      data = yaml.safe_load(path.read_text(encoding="utf-8"))
      if not isinstance(data, dict):
          continue
      reqs = [r for r in (data.get("requirements") or []) if isinstance(r, dict)]
      if not any(r.get("id") == REQ for r in reqs):
          continue
      seen += 1
      declared = [
          (str(a.get("id")), str(a.get("statement")))
          for r in reqs
          for a in (r.get("acceptance") or [])
          if isinstance(a, dict)
      ]
      criteria += len(declared)
      if [label for label, _ in declared] != bound_labels_in_order(data):
          bad.append(f"{path.name}: declared order != binds_ac declaration order")
      for label, statement in declared:
          if canonical_ac_label(label) != label:
              bad.append(f"{path.name}: id {label!r} is not already canonical")
          if not statement.strip():
              bad.append(f"{path.name}: {label} has an empty statement")
          if yaml.safe_load(yaml.safe_dump({"s": statement}))["s"] != statement:
              bad.append(f"{path.name}: {label} does not survive a YAML round trip")
  print(f"{seen} contract(s), {criteria} criteria; {len(bad)} unstable")
  for line in bad:
      print("UNSTABLE", line)
  sys.exit(1 if bad or seen < 18 else 0)
  PY
