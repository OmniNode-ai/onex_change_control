actual_output: |-
  PASS. The workflow parses, and the guard is step 14 of promote-manifest — strictly after the gate at 13
  and strictly before the apply at 15. That ordering is the security property, not a stylistic one: after
  the gate means the guard cannot delete anything on a dispatch the grant did not authorize, and before
  the apply means it unblocks the step that was failing. The post-apply live readback at 16 is unaffected
  and still asserts every rendered object exists in the namespace the overlay declared.

  BOUNDED, ASSERTED OVER EXECUTABLE LINES. The guard's 94 executable lines contain no cluster-wide
  `get jobs` sweep and do carry an explicit JOBS allowlist. That is the staging original's stated safety
  property: a recreate re-runs the Job from scratch, so membership requires established idempotency, and
  seed-keycloak-clients.py's docstring guarantees a re-run against an already-correct realm produces all
  op=unchanged lines and exits 0 — GET-then-PUT/POST per client, no destructive step. The checker reads
  executable lines only because the guard's 58 comment lines discuss the sweep it refuses to do; matching
  those produced a false positive on the first run, which was corrected rather than worked around by
  loosening the assertion.

  TWO DEPARTURES FROM THE STAGING PORT, both fail-closed and both deliberate. The namespace is DERIVED
  from the rendered objects rather than hardcoded, because this arm is generic over manifest_path while
  the staging lane applies one fixed overlay; a render whose Jobs disagree about their namespace refuses
  rather than picking one. And a Job that conflicts but is NOT on the allowlist fails the job closed
  naming itself — because skipping it would reproduce this outage on a Job nobody had examined, and
  deleting it would re-run work nobody had established is safe to repeat.
