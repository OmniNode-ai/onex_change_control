actual_output: |-
  PASS. approved_by names a real GitHub login rather than a placeholder, which matters mechanically:
  the consumer enforces approved_by != requested_by against github.actor, so a synthetic value would
  compare unequal to EVERY dispatcher and would silently disable the only anti-self-approval check on
  this path. It differs from both the PR author and the intended dispatcher, so the authoring-time
  refusal in this repo and the dispatch-time refusal in omninode_infra are each satisfied on their own
  terms rather than by assertion.

  What this item does NOT claim: no file anywhere proves a human said the words behind approved_by.
  The CODEOWNERS-gated merge is that act, which is why this PR must be landed by a person.
