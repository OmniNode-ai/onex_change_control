actual_output: |-
  PASS. 44 tests across both files run green against the STAGED registry, hermetically from the repo
  checkout with no network. The suite covers the OMN-18579 manifest-kind rules this entry exercises — all
  four manifest fields required, image_digest forbidden, manifest_path inside manifest_subtree segment-wise
  — and the OMN-13424 at-rest invariant that refuses any expired entry.

  THE SUITE EARNED ITS KEEP HERE. The entry was first drafted without `reason`, which is a COMMON required
  field for every grant whatever it promotes; reading the suite's own _COMMON_REQUIRED_FIELDS constant
  caught the omission before the entry was committed. A grant missing a required field is refused at the
  producer, so the cost would have been a red PR rather than a bad promotion — but the point of running
  the gate is that the omission was found by a check rather than by a reviewer's eye.

  WHAT THIS IS NOT. A SCHEMA gate, not an authorization gate: it proves the entry is well-formed and of
  the kind it claims. It does not prove the promotion is warranted — the CODEOWNERS-gated merge is that
  act — and it does not prove the promotion would SUCCEED, which is what the admissibility and
  staging-premise items address.
