actual_output: |-
  PASS. The registry carries grant-823154a7-18ab-4d54-8d3c-3a2e859d1f87 naming manifest_ref
  b828ec9e65f873149c97d94cbefa9133b9574e5d, and the superseded grant-aeae215d is gone.

  WHAT THE CONTROL DOES AND DOES NOT SEPARATE, said precisely because two of the five greps match on BOTH
  trees. rendered_digest and manifest_subtree are IDENTICAL between the two entries, so those two clauses
  cannot distinguish them and are not claimed to: they assert the fields are present and correct, nothing
  more. The discriminating clauses are the grant id, the manifest_ref, and the negated absence of the old
  id, and all three invert between the trees. A chain whose every clause matched on main would have proven
  only that the file mentions some grant.

  ONLY ONE FIELD MOVED, and it was recomputed rather than assumed. manifest_ref goes ad45e2cc -> b828ec9e
  because omninode_infra#1583 moved main; rendered_digest was recomputed at b828ec9e with that repository's
  own scripts/manifest_promotion_render.py and came back EQUAL to the previous cycle's value, which is the
  expected result and worth checking rather than asserting: #1583 edited .github/workflows/deploy-onex-prod.yml
  and touched nothing under k8s/keycloak-seed. path, subtree, lane, approver and digest are unchanged.

  WHY THE REF HAD TO MOVE AT ALL. The gate reads manifest_ref from its own checkout with `git rev-parse
  HEAD`, so an entry naming ad45e2cc would be refused the moment main advanced past it — regardless of
  whether the tree it names still renders correctly.
