actual_output: |-
  PASS. The premise promote-manifest resolves is met at the ref this grant names, which had to be produced
  afresh rather than reused: the previous cycle's receipt was recorded at ad45e2cc, and b828ec9e supersedes
  it, so resolve_staging_apply would have found nothing bound to the new promoted commit.

  THE THREE THINGS THAT MAKE IT BIND. The verdict is GREEN; the recorded sha is
  b828ec9e65f873149c97d94cbefa9133b9574e5d, equal to this grant's manifest_ref; and the applied set names
  k8s/keycloak-seed/overlays/dev-system, mapped to the k8s/keycloak-seed subtree the grant declares, so the
  resolver binds THIS subtree rather than reading SUBTREE_UNBOUND — which is the same outcome as "a
  different component converged" and would refuse the dispatch. The receipt is accepted for at most 24
  hours from 2026-09-20T20:30:12Z, which outlasts the grant's own 2026-09-20T20:23:15Z expiry, so the grant
  is the binding constraint rather than the receipt.

  A SECOND COMPONENT IS IN THE SAME RECEIPT and that is expected rather than a problem:
  k8s/data-plane/postgres/backup/overlays/dev-system converged in the same run. The emitter records each
  component separately and a component that FAILED to converge cannot ride a sibling's green into a
  promotion of the same tree, which is why the receipt names components rather than carrying one verdict.

  BOUND SELECTION, NOT JUST BOUND ENFORCEMENT. resolve_staging_apply matches on the receipt's own recorded
  sha rather than the run's head sha, which is load-bearing: deploy-onex-staging is also triggered by
  workflow_run, where GitHub attributes the run to the default branch while the receipt records the
  TRIGGERING commit, so a `--commit` filter would miss a perfectly good receipt. On the 2026-09-18 prod run
  that selector was observed skipping four newer completed staging runs to select the one recorded at the
  promoted commit.

  WHAT THIS PREMISE DOES NOT PROVE, and it is the open defect rather than a caveat. Staging enforces no
  pod-security profile on any of its fourteen namespaces, so a GREEN apply establishes that the overlay
  APPLIED, not that the Job RAN. It read GREEN for the revoked grant-90f8e729's manifest too, which
  production then refused at admission. That is OMN-18764, it is open, and on this cycle the
  both-defects-covered item is what stands in for it.
