actual_output: |-
  PASS. The premise promote-manifest resolves is met at authoring time, which the revoked grant's was
  not: at that point main was 8279e2ca and no staging-apply receipt existed there at all, so a dispatch
  would have been refused for want of the receipt rather than for the reason that eventually mattered.

  THE THREE THINGS THAT MAKE IT BIND. The verdict is GREEN; the recorded sha is
  ad45e2cc1a8bbd0c4524e62783ee8fd84532e00c, equal to this grant's manifest_ref; and the applied mapping
  names k8s/keycloak-seed/overlays/dev-system=k8s/keycloak-seed, so resolve_staging_apply binds THIS
  subtree instead of reading SUBTREE_UNBOUND — which is the same outcome as "a different component
  converged" and would refuse the dispatch. The receipt is accepted for at most 24 hours, so it is fresh
  until 2026-09-20T17:38:11Z.

  DEV NOISE CANNOT STEAL THE SELECTION. omninode_infra#1551 changed the selector to match a completed
  staging run whose RECORDED sha equals the promoted ref, rather than taking the most recent successful
  run. On the 2026-09-18 prod run that behaviour was observed directly: it skipped four newer completed
  staging runs to select the one recorded at the promoted commit.

  WHAT THIS PREMISE DOES NOT PROVE, named rather than glossed. Staging enforces no pod-security profile
  on any of its fourteen namespaces, so a GREEN apply there establishes that the overlay APPLIED, not
  that the Job RAN. It went green for the revoked grant's manifest too, which production then refused at
  admission. That is OMN-18764, it is open, and the admissibility item is what covers the gap for this
  dispatch.
