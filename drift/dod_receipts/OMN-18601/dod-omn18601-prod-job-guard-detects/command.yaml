probe_command: |-
  # Detection half of the guard on repos/OmniNode-ai/omninode_infra/commits/9326f415, run against LIVE
  # onex-prod on the public cluster i-0e596e8b557e27785 over SSM, comment omn18601-guard-detection-probe.
  #
  # Render offline, extract the Job the same way the guard does, ship it to the instance, and run the
  # SAME server-side dry-run apply the guard performs. A server dry-run persists nothing, and this probe
  # issues NO delete, so onex-prod is unchanged by it.
  kubectl kustomize k8s/keycloak-seed/overlays/prod | <extract kind=Job name=seed-keycloak-clients>
  kubectl -n onex-prod get job seed-keycloak-clients -o jsonpath={.metadata.uid}
  kubectl apply --server-side --force-conflicts --field-manager=onex-prod-manifest-apply \
    --dry-run=server -f /tmp/desired_job.json
  ... | grep -c 'field is immutable'      # the literal IMMUTABLE_CONFLICT_RE matches
  # CONTROL, same dry-run, an object in the same namespace whose spec is NOT immutable:
  kubectl -n onex-prod get cm seed-keycloak-desired-clients-4888bkdm6h -o json \
    | kubectl apply --server-side --force-conflicts --field-manager=onex-prod-manifest-apply \
      --dry-run=server -f -
probe_stdout: |-
  rendered Job: seed-keycloak-clients ns=onex-prod
  securityContext: {"allowPrivilegeEscalation": false, "capabilities": {"drop": ["ALL"]}}
  ssm status: Success

  LIVE_JOB:
  d612f3af-7e5d-4e23-9ff8-d97f1507cf02

  DRYRUN_OUTPUT:
  The Job "seed-keycloak-clients" is invalid: spec.template: Invalid value:
    core.PodTemplateSpec{...}: field is immutable

  MATCHES_GUARD_LITERAL:
  1

  CONTROL_CONFIGMAP_IS_MUTABLE:
  configmap/seed-keycloak-desired-clients-4888bkdm6h serverside-applied (server dry run)
actual_output: |-
  PASS, and the control is the half that makes it a measurement rather than a restatement of the outage.
  The server-side dry-run of the rendered Job into live onex-prod returns `field is immutable`, which is
  verbatim the literal the guard's IMMUTABLE_CONFLICT_RE matches, at a match count of 1 — so the guard
  detects THIS conflict and would proceed to its recreate branch. The SAME dry-run, same field-manager,
  same namespace, applied to the ConfigMap SUCCEEDS with serverside-applied (server dry run). A dry-run
  that failed on both objects would have proven nothing about immutability; this one distinguishes them.

  NON-MUTATING BY CONSTRUCTION. A server-side dry-run persists nothing and no delete was issued, so
  onex-prod is exactly as it was: the inert Job d612f3af is still present, and the ConfigMap and
  InfisicalSecret remain as the failed promotion left them.

  WHAT IS DELIBERATELY NOT EXERCISED, said plainly rather than left to be assumed. The DELETE half is
  untested, because testing it would mutate production — it would remove the live Job. Its correctness
  therefore rests on two things rather than on a probe: the ported branch is the staging guard's own
  delete-then-let-SSA-recreate step, which has run this path since OMN-15812; and the detection half
  proven here is what decides whether that branch runs at all, with every other dry-run outcome failing
  the job closed instead of guessing.

  A SECOND FACT WORTH RECORDING. The rendered Job carries allowPrivilegeEscalation false and
  capabilities.drop [ALL], so the admissibility fix from omninode_infra#1580 is present in the very
  object this probe shipped. The immutability rejection is a separate obstacle standing in front of a
  manifest that is itself correct, which is why the earlier admissibility proof was necessary but not
  sufficient.

  BOUND TO THE PRODUCT PR, omninode_infra#1583, which carries the guard this receipt measures. The OCC
  eligibility gate binds a ticket's evidence to the PR UNDER REVIEW, and for a product-repo PR that is
  the product repo's number rather than the OCC companion's. This binding is added BEFORE #1583's gate
  runs rather than after it refuses: the same shape cost a round trip on #1580, where the evidence stamp
  named a merged OCC PR whose commit predated the binding, so the gate checked out a tree that could not
  contain it. Both halves are needed and both are present here — this pr_number, and a stamp on #1583
  naming the OCC PR whose merge commit carries it.
