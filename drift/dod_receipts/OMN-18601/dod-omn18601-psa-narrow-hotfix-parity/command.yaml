actual_output: |-
  PASS on both directions, which is what makes the narrowness provable rather than merely intended.
  The whole of k8s/keycloak-seed differs between main and dev by ONE file and 37 insertions, so no
  other change to the promoted subtree is left behind by taking the narrow route; and after applying
  the two files, the diff of that subtree and its test against origin/dev is EMPTY -- the branch carries
  dev's bytes, not a reconstruction of them.

  WHY A HOTFIX RATHER THAN A PROMOTION. main-target-guard.yml admits a hotfix/* head with
  hotfix-evidence and a backmerge link as a first-class path, the same shape omninode_infra#1556 used.
  The alternative, promoting all of dev, drags in twelve unrelated merges and their gates.

  WHAT THIS ROUTE DEFERS AND DOES NOT FIX. omninode_infra#1565 is red on a hook-topic grant mirror that
  names onex.evt.omniclaude.team-evidence-written.v1 while omniclaude's hook_edge_lane.yaml no longer
  declares that class. That drift is real and it is dev-only: main's copy of
  aws/cluster-dev/omniclaude_hook_event_topics.json carries no such entry, which is why this branch
  never touches the file and the parity gate has nothing to object to. The next promotion of all of dev
  still has to regenerate that mirror.
