actual_output: |-
  PASS, and the control is the half that makes it a measurement. The check exits 0 against the
  registry this revocation produces and exits 1 against onex_change_control@main at 6c54c74f8,
  where grant-90f8e729-c65c-4693-9bc0-b0df390f2d2e is still live. A check that was silently broken
  would have exited 0 on BOTH trees; it did not.

  Deliberately NOT written as an absence-grep on the grant id. The revocation header names that id
  on purpose, so `! grep -Fq 'grant-90f8e729'` would match the comment and report a false failure --
  the shape OCC#8670 used is unsafe here for exactly that reason.

  WHAT IS REMOVED: one manifest grant naming rendered_digest sha256:33b54afe at manifest_ref
  8279e2ca. It was consumed in substance by deploy-onex-prod.yml run 35392020746 -- every gate
  premise passed, three objects applied to onex-prod, live readback confirmed -- and then the
  workload failed to admit under the restricted pod-security profile, DeadlineExceeded with zero
  pods. omninode_infra#1563 moves the render to sha256:976ef4de, so this entry could only ever
  re-authorize a manifest production refuses.

  NOTHING IN PRODUCTION IS MUTATED. Removing an authorization is not a workload change.

  PR-BOUND EXPLICITLY. This receipt carries pr_number 10302, the PR that performs the revocation it
  evidences. The OCC merge-eligibility gate binds a ticket's evidence to the PR under review either by
  `pr_number == <this PR>` or by `commit_sha` matching one of the PR's own commits, and it resolves
  receipts only under drift/dod_receipts. The structural self-bind at
  drift/occ_bindings/OMN-18601/occ-self-bind-pr-10302/command.yaml follows OMN-18075 and is read by
  omnibase_core main, but .github/workflows/call-receipt-gate.yml installs omnibase_core pinned at
  37bd8519, which has no occ_bindings support and therefore cannot see that file. pr_number here is the
  binding the pinned gate actually reads. The occ_bindings receipt stays in place and becomes the live
  path once that pin advances.

  CHECK RE-POINTED AT THIS RECEIPT BY OCC#10454, with the measurement above unchanged. This item's
  check_value was `grep -Eq` for an empty entries list on the live registry -- an assertion about registry
  STATE. OCC#10454 stages the replacement grant-aeae215d, so that assertion stops holding the moment a
  new authorization is written, which is the registry working rather than a regression. The removal this
  receipt evidences is unchanged and still true: grant-90f8e729 was removed, measured at 6c54c74f8 with
  a control that inverted, and it has not returned -- a search for that grant id finds only the revocation
  header that names it on purpose. What is asserted is therefore narrower and exact: the revocation WAS
  measured, at 6c54c74f8, not that the file is at rest now -- it deliberately is not.

  THE PATTERN, SO THE NEXT AUTHOR DOES NOT REDISCOVER IT. Every item on this contract that asserts
  registry STATE inverts when that state legitimately changes, and there are now two directions of it:
  the staged-state items inverted when OCC#10302 revoked, and this at-rest item inverted when OCC#10454
  re-staged. The remedy each time is the same, and it is not a workaround -- move the check to the receipt
  that holds the measurement and its control, and narrow the description to what is actually claimed.
