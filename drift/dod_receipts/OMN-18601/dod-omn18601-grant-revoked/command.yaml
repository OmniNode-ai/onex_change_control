actual_output: |-
  PASS, and the control is the half that makes it a measurement. The check exits 0 against the
  registry this revocation produces and exits 1 against onex_change_control@main at 6c54c74f8,
  where grant-90f8e729-c65c-4693-9bc0-b0df390f2d2e is still live. A check that was silently broken
