  Deliberately NOT written as an absence-grep on the grant id. The revocation header names that id
  on purpose, so `! grep -Fq 'grant-90f8e729'` would match the comment and report a false failure --
  the shape OCC#8670 used is unsafe here for exactly that reason.

  WHAT IS REMOVED: one manifest grant naming rendered_digest sha256:33b54afe at manifest_ref
  8279e2ca. It was consumed in substance by deploy-onex-prod.yml run 35392020746 -- every gate
  premise passed, three objects applied to onex-prod, live readback confirmed -- and then the
  workload failed to admit under the restricted pod-security profile, DeadlineExceeded with zero
  pods. omninode_infra#1563 moves the render to sha256:976ef4de, so this entry could only ever
  re-authorize a manifest production refuses.

  NOTHING IN PRODUCTION IS MUTATED. Removing an authorization is not a workload change.

  PR-BOUND EXPLICITLY. This receipt carries pr_number 10302, the PR that performs the revocation it
  evidences. The OCC merge-eligibility gate binds a ticket's evidence to the PR under review either by
  `pr_number == <this PR>` or by `commit_sha` matching one of the PR's own commits, and it resolves
  receipts only under drift/dod_receipts. The structural self-bind at
  drift/occ_bindings/OMN-18601/occ-self-bind-pr-10302/command.yaml follows OMN-18075 and is read by
  omnibase_core main, but .github/workflows/call-receipt-gate.yml installs omnibase_core pinned at
  37bd8519, which has no occ_bindings support and therefore cannot see that file. pr_number here is the
  binding the pinned gate actually reads. The occ_bindings receipt stays in place and becomes the live
  path once that pin advances.
