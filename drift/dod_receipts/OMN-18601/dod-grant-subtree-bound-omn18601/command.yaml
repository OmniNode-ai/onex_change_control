actual_output: |-
  PASS, with two controls. The overlay renders to exactly three objects and nothing else, digesting
  to the value the grant pins, and derive_namespace() resolves to onex-prod — so what the grant
  authorizes is what the gate will apply.

  FIRST CONTROL: subtree_violations returns [] against the declared bound k8s/keycloak-seed and 2
  against the tighter bound k8s/keycloak-seed/overlays/prod. That is what makes the empty result a
  measurement rather than a silently broken probe, and it is also why manifest_subtree is DECLARED
  wider than manifest_path — the overlay names ../../base as a resource, so a bound of the overlay
  path alone would refuse the very tree it authorizes.

  SECOND CONTROL: the identical render at the pre-promotion commit e746a665 digests to the same value,
  pinning that omninode_infra#1556 moved manifest_ref and changed no file under k8s/keycloak-seed.
  rendered_digest was therefore recomputed and confirmed stable, not assumed stable.
