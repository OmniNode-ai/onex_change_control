actual_output: |-
  PASS. approved_by names a real GitHub login rather than a placeholder, which matters mechanically: the
  consumer enforces approved_by != requested_by against github.actor, so a synthetic value would compare
  unequal to EVERY dispatcher and would silently disable the only mechanical anti-self-approval check on
  this path. It differs from both the PR author and the intended dispatcher, so the authoring-time refusal
  in this repository and the dispatch-time refusal in omninode_infra are each satisfied on their own terms
  rather than by assertion.

  WHO CAN LAND THIS, measured rather than assumed. main requires code-owner review with admins enforced,
  and CODEOWNERS assigns grants/prod_promotion_grants.yaml to @OmniNode-ai/platform-leads, whose members
  are jonahgabriel and jake-b-omni. GitHub refuses an approving review on one's own pull request, so the
  only person who can approve this PR is jonahgabriel. That is the property the registry exists to have:
  the author of an authorization is structurally barred from blessing it.

  WHAT THIS DOES NOT CLAIM: no file anywhere proves a human said the words behind approved_by. The
  CODEOWNERS-gated merge is that act, which is why this PR must be landed by a person.

  CHECK RE-POINTED AT THIS RECEIPT BY OCC#10471, and for a sharper reason than the values item. That chain
  names a grant id, so it INVERTS loudly when the entry goes. This one named only `approved_by:
  jonahgabriel`, and the replacement grant-823154a7 carries the same approver — so after the prune it would
  have kept PASSING while silently measuring a DIFFERENT entry than the one this item describes. A check
  that passes for the wrong reason is worse than one that fails for the right one: the red gets fixed, the
  false green gets trusted. Reading this receipt binds the claim back to grant-aeae215d specifically, which
  is the entry the probe above actually examined.
