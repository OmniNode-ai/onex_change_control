actual_output: |-
  PASS, and the control is what makes it a measurement. The same checker REFUSES the same Job at 8279e2ca,
  naming both absent fields, and ADMITS it at ad45e2cc. A checker that was silently broken would have
  admitted BOTH refs; it did not. This is the question the 2026-09-18T20:32Z dispatch never asked: run
  35392020746 satisfied every identity premise, applied all three objects to onex-prod with a live
  readback, and then Job seed-keycloak-clients reached DeadlineExceeded at 22:06Z having created ZERO
  pods, with ten FailedCreate events naming exactly the two fields above.

  IDENTITY AND ADMISSIBILITY WERE MEASURED ON THE SAME BYTES. The digest recomputed at ad45e2cc equals
  the rendered_digest this entry declares, so the tree proven admissible is the tree the grant authorizes
  rather than a neighbouring one. The declared manifest_subtree k8s/keycloak-seed is wider than
  manifest_path because the overlay's kustomization names ../../base: the transitive tree is six files
  spanning both directories, and a subtree equal to manifest_path would refuse the very overlay this
  grant kind exists to authorize.

  WHAT THIS DOES NOT CLAIM. The rendered pod template is ADMISSIBLE; whether the Job then does its
  seeding work is answered only by a real run. The general defect — that the gate's stability premise
  proves an overlay APPLIED rather than RAN — is OMN-18764 and stays open. This item covers that gap by
  hand for this one dispatch, which is the honest description of it.
