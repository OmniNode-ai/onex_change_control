actual_output: |-
  PASS on both defects, each with a control that inverts, which is what distinguishes this from the two
  previous cycles where one premise was proven and another was never examined.

  DEFECT ONE, ADMISSIBILITY — proven at the grant's own ref. The render at b828ec9e admits under the
  restricted profile; the same checker REFUSES the same Job at 8279e2ca and names both absent fields. This
  defect was already covered at ad45e2cc by omninode_infra#1580, and covering it alone was NOT enough:
  run 35465514637 passed every identity premise, applied two of three objects, and still could not apply
  the Job.

  DEFECT TWO, IMMUTABILITY — the one that stopped the last attempt. A batch/v1 Job's spec.template cannot
  be updated, so the inert Job onex-prod has held since 2026-09-18 (uid d612f3af, zero pods ever admitted)
  blocked the corrected manifest. deploy-onex-prod.yml at b828ec9e carries 17 references to the OMN-15812
  pre-apply guard where the same file at ad45e2cc carried 0 — presence, counted. And the guard's DETECTION
  fires on this exact conflict: the server dry-run of the rendered Job returns the immutable-field error
  the guard's IMMUTABLE_CONFLICT_RE matches, at match count 1, while the SAME dry-run on the ConfigMap in
  the same namespace SUCCEEDS. A dry-run failing on both would have proven nothing about immutability.

  WHAT REMAINS UNCOVERED, named rather than left for someone to discover. OMN-18764 is open: the
  staging-apply premise proves an overlay APPLIED, not that a Job RAN, and staging enforces no pod-security
  profile on any of its namespaces — so the receipt this grant depends on will read GREEN whether or not the
  Job can run in production. The admissibility measurement above is what stands in for that, by hand, for
  this dispatch only. And the guard's DELETE branch is unexercised, because exercising it would mutate
  production; its correctness rests on it being the staging guard's own step, which has run that path since
  OMN-15812, with detection deciding whether it runs at all.

  SO WHAT THIS ITEM CLAIMS, exactly: b828ec9e is the first commit at which both KNOWN premise defects on
  this path are covered. It does not claim there is no third.
