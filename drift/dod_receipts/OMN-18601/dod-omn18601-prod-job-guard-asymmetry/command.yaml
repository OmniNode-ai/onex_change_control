actual_output: |-
  PASS as a diagnosis, and the counts are what make it one rather than a story about why a run failed.

  WHAT WAS NOT THE CAUSE, ruled out before blaming anything. Every premise the manifest arm enforces
  passed: the grant matched, rendered_digest matched, the subtree was bound, and the staging-apply receipt
  resolved at the promoted commit ad45e2cc. The dispatch gating was also correct — promote-to-prod and
  converge-public-staging both skipped under deploy_target=public-only, so promote-manifest ran alone,
  which is what the inputs were chosen for. The admissibility fix was not the problem either: the Job the
  render declares carries allowPrivilegeEscalation false and capabilities.drop [ALL].

  WHAT THE CAUSE IS. A batch/v1 Job's .spec.template is immutable end-to-end, so applying a Job whose pod
  template differs from the live one is REJECTED rather than merged. onex-prod still holds the inert Job
  from the 2026-09-18 reconcile — uid d612f3af, created 21:56:46Z, succeeded and failed both <none>,
  zero pods ever admitted — and that object is an unremovable obstacle to applying the corrected manifest
  over it. Two of the three objects landed; only the Job could not.

  THE ASYMMETRY IS THE DEFECT. deploy-onex-staging.yml carries 14 references to the OMN-15812 pre-apply
  Job guard and deploy-onex-prod.yml carried 0. Identical bytes therefore applied cleanly on dev-system
  and were refused in production, which is exactly the shape of the gap OMN-18764 describes for a
  different premise: the staging lane can answer a question production asks, and the prod lane does not
  ask it. This is a SECOND premise defect on the same path, not a restatement of the first.
