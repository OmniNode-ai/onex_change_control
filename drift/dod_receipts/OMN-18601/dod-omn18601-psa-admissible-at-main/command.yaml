actual_output: |-
  PASS, and the control is the half that makes it a measurement. The same checker REFUSES the same Job
  on main 8279e2ca unmodified, naming both absent fields, and ADMITS it once the two files are applied.
  A checker that was silently broken would have admitted BOTH trees; it did not. This is the question
  the 20:32Z dispatch never asked: run 35392020746 satisfied every identity premise the grant gate
  enforces, applied all three objects to onex-prod with a live readback, and then the Job reached
  DeadlineExceeded with ZERO pods because the admission controller refused every one.

  The rendered digest at this tree is sha256:976ef4de626144f156a6a227c3b881066e07273476a5f19f00b96e6e454fad06,
  which is the value a promotion of all of dev would also have produced -- the narrow hotfix and the
  full promotion render the prod overlay identically, because the whole of k8s/keycloak-seed differs
  between main and dev by exactly the one file this carries. The grant recomputes the digest again at
  the post-merge main sha, because the gate renders from its own checkout rather than trusting a value.

  WHAT THIS DOES NOT CLAIM. It proves the rendered pod template is ADMISSIBLE, not that the Job will
  do its work. Whether the seeding logic succeeds is answered only by a real run, and the general gap
  between an overlay that APPLIES and a workload that RUNS is OMN-18764, which stays open.
