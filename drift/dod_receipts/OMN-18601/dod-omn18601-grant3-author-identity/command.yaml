actual_output: |-
  PASS, and the probe is deliberately ENTRY-SCOPED rather than a grep of the file, which is the lesson the
  previous cycle's item recorded on its way out.

  WHY THE SHAPE CHANGED. A live `grep -Fq 'approved_by: jonahgabriel' grants/prod_promotion_grants.yaml`
  does not invert when an entry is replaced, because every entry on this path carries the same approver. It
  keeps PASSING while silently measuring whichever entry happens to be present — a check that passes for
  the wrong reason, which is worse than one that fails for the right one, because the red gets fixed and the
  false green gets trusted. This probe parses the registry, selects the entry by grant_id, asserts exactly
  one match, and reads approved_by off THAT entry.

  THE FACT ITSELF is mechanical and unchanged. approved_by names jonahgabriel, a real GitHub login rather
  than a placeholder, because omninode_infra's scripts/validate_prod_promotion_grant.py refuses any entry
  whose approved_by equals the dispatching identity under outcome self_granted. A synthetic value would
  compare unequal to EVERY dispatcher and would silently disable the only mechanical anti-self-approval
  control on this path. It differs from the PR author and from the intended dispatcher, both jake-b-omni.

  WHO CAN LAND IT, measured. main requires code-owner review with admins enforced, CODEOWNERS assigns this
  file to @OmniNode-ai/platform-leads (jonahgabriel and jake-b-omni), and GitHub refuses an approving review
  on one's own pull request — so jonahgabriel alone can approve this. That is the property the registry
  exists to have: the author of an authorization is structurally barred from blessing it.

  WHAT THIS DOES NOT CLAIM: no file anywhere proves a human said the words behind approved_by. The
  CODEOWNERS-gated merge is that act.
