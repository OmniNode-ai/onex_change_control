actual_output: |-
  PASS: 40 passed, ruff clean, mypy --strict clean.

  The suite moved 18 -> 40 BY ADDITION - no pre-existing case was removed or weakened, and the
  case names above are the record of that. The four invariants the revoke path is required to hold
  each have a named case, and each fails if the invariant is dropped:

    removes named entries      test_removes_every_named_entry_and_returns_to_rest
                               test_removes_only_the_named_entry_and_keeps_the_other_verbatim
    refuses a missing entry    test_refuses_when_a_named_entry_is_absent
                               test_refuses_when_the_registry_is_already_at_rest
    refuses a remaining expiry test_refuses_when_an_expired_entry_would_remain
                               test_removing_the_expired_entry_too_is_permitted (the refusal is
                               about what REMAINS, not about what is removed)
    header byte-identical      test_header_bytes_are_identical_after_removal

  Six further cases pin the workflow wiring itself, because a tested script that nothing calls is
  not a gate: that mode offers stage|revoke and DEFAULTS TO STAGE (a mis-typed dispatch must not
  remove grants), that approved_by/expires_at are no longer required inputs, that the add-only
  splice step is skipped in revoke mode (it refuses unless the registry is already at rest, which
  is what a revocation is trying to restore), that the removal script is staged off the dispatch
  ref rather than invoked from a work tree checked out at origin/main which does not carry it, and
  that the workflow still performs no prod mutation.

  SCOPE, stated so the suite is not over-read: this proves the removal logic and the wiring. It
  does not run the workflow - that needs an App token and a real main - and it is not an
  authorization gate. The App-authored run that exercises it end to end is the separate revocation
  PR against main.
