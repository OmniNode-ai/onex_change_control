  PASS, with the caveat stated rather than buried.

  LEG B against the revoked file: the CONSUMER of this grant file - omninode_infra's
  scripts/validate_prod_promotion_grant.py, the exact script deploy-onex-prod.yml runs - now returns
  exit 1 `[prod-grant] BLOCKED (absent): no grant entry found` for BOTH digests and for BOTH
  dispatchers. The authorization is gone, not merely expired or marked consumed.

  THE POSITIVE CONTROL is what makes those four readings a measurement. The identical probe against
  onex_change_control@main at 5df6a9d6bb returns exit 0 PASS for daniyalabbas96 on both digests and
  exit 1 BLOCKED (self_granted) for jonahgabriel on both. A no-op probe - a bad path, an unreadable
  file - would have blocked on BOTH trees and produced the same four BLOCKED lines on this branch; it
  did not.

  LEG A IS THE REAL-WORLD RESULT AND IT SAYS NOTHING ABOUT THE GRANT. With no staging-green report,
  all four combinations block on the OMN-17357 premise BEFORE the grant anchor is read. That premise is
  reported here rather than leaned on. The leg-B fixture exists ONLY to get past it and isolate the
  grant anchor; it is emphatically NOT evidence that staging is green - it is not, which is part of why
  these grants were revoked.

  CROSS-REPO by construction, which is why the hosted check_value is the receipt-grep form: the consumer
  lives in the PRIVATE omninode_infra repo, which the OCC runner has no checkout of and no token for, so
  a gh-api check_value would fail for lack of read access rather than for lack of evidence. All three
  blocks are carried verbatim in probe_stdout above.
