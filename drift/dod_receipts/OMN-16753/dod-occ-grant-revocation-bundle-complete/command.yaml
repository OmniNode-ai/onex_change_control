  The revocation bundle is a SUBDIRECTORY of the staging bundle, not a replacement for it: the
  staging bundle stays as the record of what was granted and the revocation sits beside it as the
  record of how that grant ended. It carries no entries_block.yaml - a revocation adds no entries,
  it names the ones to remove - and the workflow's required-file list differs by mode accordingly.

  The bundled occ_contract.yaml is byte-stable under this repo's yamlfmt at the contracts/ path the
  workflow copies it to. That matters because the App branch commits it directly with no pre-commit
  run, so a file that yamlfmt would reformat there would land unformatted and fail the App PR's own
  Pre-commit job - which is exactly how OCC#8504 died on a different contract defect.
