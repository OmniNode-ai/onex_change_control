check_value: |-
  cd "${OMNI_HOME}/omnimarket" || exit 2
  t="$(mktemp -d)"
  mkdir -p "$t/bin" "$t/good" "$t/bad"
  printf '#!/bin/sh\necho GATE_REACHED\n' > "$t/bin/uv" && chmod +x "$t/bin/uv"
  env -u PYTHONPATH uv run python -c "import sys, yaml; s = next(x for x in yaml.safe_load(open('.github/workflows/ci.yml'))['jobs']['lint']['steps'] if x.get('name') == 'Canonical-shape flip-bundle seam gate (OMN-15344 fan-out)'); open(sys.argv[1], 'w').write(s['run'])" "$t/step.sh" || exit 2
