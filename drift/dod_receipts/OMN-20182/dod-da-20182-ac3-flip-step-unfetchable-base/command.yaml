  git -C "$t/good" remote add origin "$t/origin.git"
  git -C "$t/bad" init -q
  git -C "$t/bad" remote add origin "$t/no-such-origin.git"
  (cd "$t/good" && PATH="$t/bin:$PATH" bash -e "$t/step.sh") > "$t/good.out" 2>&1; good=$?
  (cd "$t/bad" && PATH="$t/bin:$PATH" bash -e "$t/step.sh") > "$t/bad.out" 2>&1; bad=$?
  good_gate="$(grep -c GATE_REACHED "$t/good.out")"; bad_gate="$(grep -c GATE_REACHED "$t/bad.out")"
  echo "reachable origin: step rc=$good gate_reached=$good_gate"
  echo "unfetchable origin: step rc=$bad gate_reached=$bad_gate"
  rm -rf "$t"
  test "$good" -eq 0 && test "$good_gate" -eq 1 && test "$bad" -ne 0 && test "$bad_gate" -eq 0
