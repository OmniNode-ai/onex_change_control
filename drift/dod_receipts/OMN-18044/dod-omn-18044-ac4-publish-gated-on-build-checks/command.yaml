check_type: command
check_value: |-
  gh api 'repos/OmniNode-ai/omninode_infra/contents/.github/workflows/publish-beta-board.yml?ref=c5904e7634346e99281ada31492aa55e2059cfa0' --jq '.content' | base64 -d | python3 -c '
  import sys, re
  t = sys.stdin.read()
  steps = re.split(r"\n(?=      - name: )", t)
  idx = {}
  for i, s in enumerate(steps):
      m = re.search(r"- name: (.*)", s)
      if m: idx.setdefault(m.group(1).strip(), i)
  build = next(i for k, i in idx.items() if k.startswith("Build checks"))
  up = idx["Upload to S3"]
  assert build < up, "upload is not sequenced after build checks"
  assert "sys.exit(1)" in steps[build], "build checks never fail the job"
  for name, i in (("build-checks", build), ("upload", up)):
      seg = steps[i]
      assert "continue-on-error" not in seg, name + " step is bypassable"
      assert not re.search(r"^\s+if:", seg, re.M), name + " step is conditional"
  print("OK: publish is gated behind a hard-failing build check")'
