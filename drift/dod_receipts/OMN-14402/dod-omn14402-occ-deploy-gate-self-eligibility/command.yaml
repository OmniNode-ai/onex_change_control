# Three independent facts identify commits[0] as what the author MEANT:
#   1. It shares a 9-character prefix with the garbled value (72b52d1d7...);
#      the remaining 31 characters diverge. That is the signature of a short
#      SHA padded out to 40 characters, not of an unrelated commit.
#   2. This receipt's own run_timestamp (2026-07-12T04:57:00Z) falls strictly
