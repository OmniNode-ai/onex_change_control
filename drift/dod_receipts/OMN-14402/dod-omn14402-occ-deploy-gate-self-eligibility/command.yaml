# A clone that happens to still hold commits[0] as a dangling object resolves
# it; a fresh CI checkout does not fetch unreachable objects, so binding to it
# would pass locally and fail in CI forever. That is the same defect class this
# repo already ratchets against in OMN-15540 Rule F ("a feature-branch ref 404s
# once the branch is deleted on merge -- pin the squash commit on the
