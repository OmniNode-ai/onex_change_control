reason: >-
  Rebind this receipt's commit identifier, which was GARBLED at authoring time on 2026-07-12. Every SHA
  slot in the base receipt reads 72b52d1d758597147bc0763e7918b67c42504ccd, which is not a commit object
  anywhere: `git cat-file -e <sha>^{commit}` exits 128 ("Not a valid object name") and `gh api repos/OmniNode-ai/onex_change_control/commits/<sha>`
  returns HTTP 422 ("No commit found for SHA"). It surfaced when OMN-16007 removed ci.yml's `github.base_ref
  != 'dev'` carve-out from the "Run full pre-commit --all-files" step, letting the OMN-15111 Evidence-Commit
  SHA existence gate scan the whole receipt corpus on the merge path for the first time; it was the corpus's
  only violation. IT IS A GARBLED REAL SHA, NOT A FABRICATION. `gh pr view 4007 --repo OmniNode-ai/onex_change_control
  --json commits,headRefName,mergeCommit,mergedAt` shows commits[0].oid = 72b52d1d71d5e93518e357a059847c7e89d49f9a
  ("evidence(OMN-14402): add deploy-gate assessment", committedDate 2026-07-12T04:55:45Z), commits[1].oid
  = 08ef93f901553d47cf85305823a172695eaac18f (2026-07-12T04:57:50Z), headRefName jonah/omn-14402-deploy-gate-evidence,
  mergeCommit 0c5012bfa6b44e64e856977d740ab90070a93777, mergedAt 2026-07-12T05:03:11Z. Three facts identify
  commits[0] as what the author meant - it shares a 9-character prefix with the garbled value while the
  remaining 31 characters diverge (the signature of a short SHA padded to 40, not an unrelated commit);
  this receipt's own run_timestamp 2026-07-12T04:57:00Z falls strictly between commits[0] and commits[1],
  so commits[0] was the branch head when the probe ran; and pr_number 4007 plus the branch name match
  that PR exactly. BUT COMMITS[0] IS NOT WHAT THE RECEIPT MAY CITE. PR #4007 was squash- merged, so its
  branch commits never landed on the mainline and the branch was deleted: `git rev-list --parents -n1
  0c5012bf...` shows ONE parent (squash, not merge), and `git rev-list --all | grep -c 72b52d1d71d5e93518e357a059847c7e89d49f9a`
  returns 0 - reachable from zero refs. A clone that still holds it as a dangling object resolves it;
  a fresh CI checkout does not fetch unreachable objects, so binding to it would pass locally and fail
  in CI forever - the same defect class OMN-15540 Rule F already ratchets against. THE DURABLE BINDING
  IS THEREFORE THE SQUASH COMMIT, 0c5012bfa6b44e64e856977d740ab90070a93777, used in the replacement below,
  verified on four counts - its subject is PR #4007's title verbatim; its commit date 2026-07-12T05:03:11Z
  equals the PR's mergedAt to the second; `git merge-base --is-ancestor 0c5012bf... origin/dev` exits
  0; and its diff contains this receipt file. WHAT CHANGED - only the 40-character identifier, in all
  6 slots that carried it (commit_sha; the Evidence-Commit and Evidence-Head trailers, the pr_commit_shas
  tuple and the occ_commit_sha argument inside probe_command; and the occ_commit_sha echoed in probe_stdout).
  WHAT DID NOT CHANGE - no verdict field, and no re-run. status, exit_code, check_value, actual_output,
  run_timestamp and probe_stdout's eligible/reason/detail/ticket_ids are byte-identical to the base. The
  eligibility result is independent of this string: validator_occ_merge_eligibility echoes occ_commit_sha
  back without resolving it, which is why nothing caught this for a month and is also why correcting it
  cannot change what the probe concluded (the sibling receipt dod-omn14402-occ-self-eligibility passes
  40 zeros into the same argument and likewise returns eligible: true). Delivered as this net-new append-only
  record rather than an edit to the merged receipt, per the OCC Append-Only Gate: merged receipts are
  immutable and corrections must be net-new '.supersede.<NNNN>.yaml' add-only files.
