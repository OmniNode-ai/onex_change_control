check_value: |-
  python3 - <<'PROBE'
  import json
  import os
  from pathlib import Path
  import re
  import subprocess
  import tempfile
  import yaml

  caller = subprocess.check_output([
      "git", "show", "0c82123aacc3d1e3db39f5d9277fecf60e931536:.github/workflows/call-reject-skip.yml"
  ], text=True)
  uses = yaml.safe_load(caller)["jobs"]["call-reject-skip-token"]["uses"]
  pin = uses.rsplit("@", 1)[1]
  assert pin == "cb11e382966e354126cba07441e8f2b05faedee4", uses
  reusable = subprocess.check_output([
      "git", "-C", str(Path(os.environ["OMNI_HOME"]) / "omniclaude"),
      "show", pin + ":.github/workflows/reject-deploy-gate-skip.yml"
  ], text=True)
  assert not re.search(r"occ-preflight\.yml@", reusable)
  steps = yaml.safe_load(reusable)["jobs"]["scan-skip-tokens"]["steps"]
  scan = next(step["run"] for step in steps if "check_surface()" in step.get("run", ""))
  assert "${{" not in scan
  with tempfile.TemporaryDirectory() as scratch:
      root = Path(scratch)
      body = root / "body.txt"
      body.write_text("Routine change")
      fake_gh = root / "gh"
      fake_gh.write_text("#!/bin/bash\ncase \"$1 $2\" in\n"
                         "  'pr diff') printf '%s\\n' \"$PROBE_DIFF\" ;;\n"
                         "  'pr view') printf '%s\\n' 'Routine change' ;;\n"
                         "  *) exit 64 ;;\nesac\n")
      fake_gh.chmod(0o755)
      env = {**os.environ, "PATH": str(root) + os.pathsep + os.environ["PATH"],
             "RUNNER_TEMP": str(root), "RESOLVED_BODY_PATH": str(body),
             "RESOLVED_PR_NUMBER": "364", "RESOLVED_PR_AUTHOR": "probe-author",
             "PR_TITLE": "Routine change", "EVENT_NAME": "pull_request",
             "REPO": "OmniNode-ai/omnibase_spi"}
      prefix = "diff --git a/probe.md b/probe.md\n--- a/probe.md\n+++ b/probe.md\n@@ -0,0 +1 @@\n+"
      results = {}
      for case, line, expected in (("clean", "Routine change", 0),
                                   ("planted", "[" + "skip-" + "deploy-gate:probe]", 1)):
          env["PROBE_DIFF"] = prefix + line + "\n"
          run = subprocess.run(["bash", "-c", scan], env=env, capture_output=True, text=True)
          print(run.stdout, end="")
          assert run.returncode == expected, (case, run.returncode, run.stdout, run.stderr)
          if case == "planted":
              assert "changed file diff contains" in run.stdout, run.stdout
          results[case] = run.returncode
      print(json.dumps({"pin": pin, "nested_preflight": False, "scan_exit_codes": results}, sort_keys=True))
  PROBE
