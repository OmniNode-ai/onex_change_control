reason: >-
  The base receipt's check_value `gh pr checks 2682 --repo OmniNode-ai/omnibase_infra --json name,state
  --jq '[.[] | select(.state=="FAILURE")] | length == 0'` prints the boolean `false` to stdout (a non-required
  "Enable Auto-Merge" check is FAILURE) but exits 0 regardless — `jq` without `-e` never propagates a
  `false` top-level result to a nonzero exit code, so this check_value can never fail the gate no matter
  what CI state it observes. The receipt's own probe_stdout/actual_output (CI Summary = SUCCESS on head
  f4cdcb42f) is sound and is not disputed; only the declared, re-runnable check_value is broken. This
  supersession rewrites check_value to assert the real claim — CI Summary conclusion SUCCESS on the pinned
  head — using `jq -e` so a false result exits nonzero and fails the command, verified live in both directions
  (true case exits 0/prints true; a deliberately-false FAILURE-state filter against the same PR exits
  1/prints false) before landing. No merged file is edited; this is a net-new append-only record per ModelReceiptSupersession
  (OMN-13888 scope item 3), same class as OMN-13953 / OMN-15630 / OCC#6220.
