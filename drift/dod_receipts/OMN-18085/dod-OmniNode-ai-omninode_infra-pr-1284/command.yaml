  The patch pins the omnidash rollout to maxSurge 0 / maxUnavailable 1 in the DEV OVERLAY only.

  Correction to PR #1282's framing, recorded here rather than glossed: #1282 said omnidash "has
  the identical 25%/25%-on-a-full-node shape". Right about the effect, wrong about the source.
  omnidash does NOT inherit the Kubernetes default - k8s/onex-dev/omnidash/deployment.yaml
  declares maxSurge 1 / maxUnavailable 0 EXPLICITLY, and the live Deployment reads back the same
  at 2026-09-09T18:07Z:
    2 {"rollingUpdate":{"maxSurge":1,"maxUnavailable":0},"type":"RollingUpdate"}
  Different source, identical arithmetic, identical deadlock: at replicas 2 the Deployment must
  create a third pod and may not terminate either running pod first, so it can only progress by
  finding 100m of unallocated CPU on a node with 120m free.

  AC8 (the enumeration) is bound here and is discharged by the rendered overlay: omnidash and
  omniweb are the ONLY replicas-2 Deployments the render produces, and both now carry maxSurge 0 /
  maxUnavailable 1. The four replicas-1 Deployments with the same surge-requiring shape -
  omnimarket-projection-api and umami (explicit maxSurge 1 / maxUnavailable 0), memgraph-lab and
  pgweb (no strategy, inheriting the default) - are named and deliberately left alone, because at
  one replica maxUnavailable 1 is a full outage of that workload for the rollout rather than a
  degraded-but-serving pair.

  Stated plainly rather than implied: omnidash is NOT currently broken. Both pods have been
  Running since 2026-09-02T13:22Z and the cluster-wide count of pods awaiting scheduling was zero
  at 2026-09-09T18:07Z. This is a latent deadlock removed before it fires, not an incident repair.
