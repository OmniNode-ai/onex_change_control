actual_output: |-
  PASS: PR #1285 is open on OmniNode-ai/omninode_infra at 0746b49b34e3cdb6d68af538d049e2d48e6fb48c,
  and its diff is exactly one file, aws/cluster-dev/variables.tf. Nothing else is touched - no
  kubernetes manifest, no overlay, no workload.

  The change sets instance_type_system from t3a.large to t3a.2xlarge so the terraform declaration
  stops disagreeing with the live instance. The declaration had said t3a.large (2 vCPU) while the
  dev-system staging node i-06169517a92b45f86 had been running t3a.xlarge (4 vCPU) since
  2026-05-11, and launch template versions v6, v7 and v8 all carry t3a.large while the ASG tracks
  $Latest - so a replacement at any point in the last two months would have returned the cluster
  at HALF size, undetected.

  AC2 is bound here and is discharged by LIVE READBACK, not by this diff. The node was resized in
  place from t3a.xlarge to t3a.2xlarge on 2026-09-09 under the operator consent row at omni_home
  docs/tracking/ROLLING_WORK_LEDGER.md:5463. Measured over SSM with --comment staging-resize-8cpu,
  before and after:

    allocatable cpu     4000m        -> 8000m
    cpu requested       3880m (97%)  -> 3880m (48%)     [requests UNCHANGED]
    free headroom       120m         -> 4120m
    allocatable memory  16212040Ki   -> 32572104Ki
    memory requested    10380Mi (65%)-> 10380Mi (32%)

  AC2 asks for at least one omniweb replica's request (100m) of headroom. The node now has 4120m.
  The improvement is purely capacity: no request was changed by this work.

  The node is the same object, not a replacement - kubectl reported ip-10-40-204-249 Ready with
  age 121d after the resize, and the private IP 10.40.204.249, ENI eni-07fb2285a976aadf6 and
  Elastic IP 18.209.126.195 were all unchanged. 41 pods Running before and 41 after, zero missing
  and zero new by name. Downtime was 4m58s, stop issued 18:37:53Z to first HTTP 200 at 18:42:51Z.

  This PR runs no terraform apply, and an apply could not have produced the live change anyway:
  it writes a new launch template version, and because the ASG tracks $Latest that version takes
  effect on the NEXT launch while a running instance keeps the type it booted with.
