  PASS: the pushed commit resolves on OmniNode-ai/omninode_infra and 83 tests pass at it.

  The behavior this diff changes is what the overlay RENDERS, so the proof is a rendered-manifest
  control taken in this lane rather than asserted, using kubectl kustomize k8s/onex-dev-overlay-dev
  locally with no cluster contact.

  RED control, rendered from origin/dev (the pre-change tree):
    omninode-runtime          requests.cpu=300m  startup=10x180=1800s  progressDeadline=1800s  readiness.failureThreshold=3
    omninode-runtime-effects  requests.cpu=100m  startup=10x180=1800s  progressDeadline=1800s  readiness.failureThreshold=3

  GREEN, rendered from the pushed commit:
    omninode-runtime          requests.cpu=1000m startup=10x360=3600s  progressDeadline=3600s  readiness.failureThreshold=6
    omninode-runtime-effects  requests.cpu=800m  startup=10x360=3600s  progressDeadline=3600s  readiness.failureThreshold=6

  limits.cpu is 1000m on both sides -- unchanged, deliberately, for the reason OMN-17372 records.

  The zero is not vacuous: the two renders differ, and the diff between them is exactly EIGHT hunks
  (counted with `diff -u | grep -c '^@@'`, not eyeballed) over an 8815-line render, containing only
  progressDeadlineSeconds, readinessProbe.failureThreshold, requests.cpu and
  startupProbe.failureThreshold, twice each. Nothing else moved -- no image, no replicas, no env,
  and no generated-ConfigMap name-suffix hash.

  WHY THESE VALUES. Measured on the live pods while both were Ready and unstarved, node load average
  2.28 on eight cores, omninode-runtime Ready since 18:58:10Z and effects since 18:52:24Z -- these
  are steady state, not startup spikes:

    omninode-runtime          821m / 859m / 839m / 864m against a 300m request (peak 916m on ticket)
    omninode-runtime-effects  596m / 890m / 648m / 662m against a 100m request (peak 692m on ticket)

  The startup budget moves because a boot that SUCCEEDED exceeded it: omninode-runtime-effects took
  1919s on 2026-09-09 (17:20:19Z -> 17:52:18Z) against a budget of 1800s.

  THE GATE ITSELF IS RE-BASELINED, deliberately rather than relaxed, and it GAINS two assertions it
  did not have, both RED on the parent:

    test_effects_runtime_cpu_request_matches_measured_demand      (parent renders 100m)
    test_startup_budget_covers_the_worst_boot_that_ever_completed (parent budget 1800s < 1919s)

  The second exists because the pre-existing test_startup_budget_equals_the_rollout_budget only
  checks that the startup and rollout budgets AGREE with each other; it cannot notice that both are
  too small. The ceiling in test_cpu_requests_fit_the_node_headroom moves 320m -> 3720m for a stated
  reason: it was pinned to a 4-vCPU node that has since been resized to 8 vCPU by another lane under
  its own operator-approved grant.

  WHAT THIS PROVES, AND WHAT IT DOES NOT. It proves AC10 (the rendered requests are 1000m and 800m,
