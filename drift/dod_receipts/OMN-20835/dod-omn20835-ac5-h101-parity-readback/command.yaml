  r = lp.read_pool([host])[0]
  marks = subprocess.run(SSH + [host.target, MARK], capture_output=True, text=True, timeout=60).stdout
  print("h101 read error:", r.error if r else "unreadable")
  if r is None or r.error is not None or r.parity is None:
      sys.exit(2)
