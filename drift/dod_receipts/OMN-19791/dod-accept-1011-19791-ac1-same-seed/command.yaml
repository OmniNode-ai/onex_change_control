  assert d1 == d2, "dev-lane draws differ"
  print("DEV_LANE_DRAWS_IDENTICAL items=%d manifest_id=%s recomputed_matches=True" % (len(d1["items"]), d1["manifest_id"]))
  ' # repos/OmniNode-ai/omnimarket/tests/nodes/node_delegation_eval_sample_compute
