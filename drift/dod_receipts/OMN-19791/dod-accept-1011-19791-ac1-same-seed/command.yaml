  import hashlib, json, os, subprocess
  kb = os.environ["KNOWLEDGE_BASE_INTERNAL_PATH"]
  m = "reports/delegation-evals/manifests/2026-10-05-omn-19791"
  d1, d2 = (json.loads(subprocess.check_output(["git", "-C", kb, "show", f"origin/main:{m}-draw-{n}.json"])) for n in (1, 2))
