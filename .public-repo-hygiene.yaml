# Public-repository hygiene gate — this repo's declaration (OMN-18014).
#
# Layer (a) of the gate: the TOP-LEVEL PATH ALLOWLIST. Anything tracked at the
# repository root that is not named below fails. This is the half that refuses
# the next junk directory nobody has invented yet — a denylist must anticipate
# that directory, an allowlist does not.
#
# Seeded from OmniNode-ai/onex_change_control@dev at adoption time, MINUS the entries that
# are themselves findings. Adding an entry here is a decision to publish that
# directory, not a formality.
#
# WITHHELD AT ADOPTION, and they must stay withheld:
#   .evidence — a finding, not a root entry. Fix or delete it; do not
#   drift — a finding, not a root entry. Fix or delete it; do not
#     add it here.
#
# mode: report — the gate records every finding with a per-class count and
# exits 0. It flips to enforce when the residue is FIXED, never by moving the
# residue into this file: that is the recurrence mechanism the OMN-17992
# programme exists to remove.

mode: report
suppression_registry: ".public-repo-hygiene-suppressions.yaml"

allowed_top_level:
  - ".canary"
  - ".duplicate-id-registries.yaml"
  - ".github"
  - ".gitignore"
  - ".kb-doc-gate.yaml"
  - ".markdown-link-check.json"
  - ".occ_pc3.log"
  - ".occ_pc4.log"
  - ".occ_self.log"
  - ".occ_self2.log"
  - ".onex_ratchets"
  - ".pre-commit-config.yaml"
  - ".pre-commit-hooks"
  - ".pre-commit-hooks.yaml"
  - ".public-repo-hygiene-suppressions.yaml"
  - ".public-repo-hygiene.yaml"
  - ".yamlfmt"
  - "CHANGELOG.md"
  - "CLAUDE.md"
  - "LICENSE"
  - "README.md"
  - "SECURITY.md"
  - "allowlists"
  - "architecture-handshakes"
  - "contracts"
  - "docs"
  - "dod_sweep_exemptions.yaml"
  - "env_contract.yaml"
  - "eval_suites"
  - "evidence"
  - "grants"
  - "migration_conflict_suppressions.yaml"
  - "pyproject.toml"
  - "registry"
  - "schemas"
  - "scripts"
  - "src"
  - "standards"
  - "systemd"
  - "templates"
  - "tests"
  - "uv.lock"
  - "workflows"
