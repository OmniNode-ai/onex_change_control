#
# Conformant GREEN fixture for the OMN-15669 contract-shape-v1 gate.
# Synthetic ticket id: fixture data, never a live OCC contract.
schema_version: occ-contract/v1
ticket_id: OMN-99999
title: Conformant reference contract for the canonical shape v1 gate

interface:
  inputs:
    - name: widget_id
      type: str
      required: true
      constraints:
        min_length: 1
    - name: weight_g
      type: int
      required: true
      constraints:
        minimum: 0
  outputs:
    - name: widget
      type: dict[str, object]
      required: true
  error_taxonomy:
    - code: WIDGET_ID_EMPTY
      when: widget_id is the empty string
      raises: jsonschema.ValidationError
    - code: WEIGHT_NEGATIVE
      when: weight_g is below the declared minimum
      raises: jsonschema.ValidationError

dependencies:
  - name: widget_store
    seam_schema: schemas/widget_seam.schema.yaml
    injectable: true

cases:
  - id: widget_store_seam
    class: golden_chain
    behavior: mock and real stores both emit a payload matching the seam schema
    test_path: tests/test_widget_cases.py
    bindings: both
    covers:
      - dependency:widget_store
      - input:widget_id.min_length
  - id: widget_id_empty
    class: error_chain
    behavior: an empty widget_id is rejected against the seam schema
    test_path: tests/test_widget_cases.py
    bindings: mock
    covers:
      - error:WIDGET_ID_EMPTY
  - id: weight_negative
    class: error_chain
    behavior: a negative weight is rejected against the seam schema
    test_path: tests/test_widget_cases.py
    bindings: mock
    covers:
      - error:WEIGHT_NEGATIVE
      - input:weight_g.minimum

dod_evidence:
  - id: dod-fixture-cases
    description: The declared cases pass under the real runner.
    status: PASS
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_widget_cases.py -q
