---
# HAND-MAINTAINED declared configuration for the migration inventory (OMN-15772).
#
# This file says which peer repository, which branch, and which directory each
# migration set is derived FROM, plus the runner/tracking metadata that cannot
# be read off a git tree. It deliberately carries NO migration file lists:
# those are DERIVED by generate-migration-inventory and written to
# migration_inventory.yaml, which is a generated artifact.
#
# Branches are pinned explicitly rather than inferred from origin/HEAD. A peer
# changing its default branch must be a visible edit here, not a silent change
# in what the gate validates against -- and origin/HEAD is observably
# unreliable: a canonical clone read it as 'main' for a peer whose real
# default branch on GitHub is 'dev'.
#
# Adding a peer repo, retargeting a branch, or moving a migration directory
# belongs here. Adding a migration FILE does not: regenerate instead.
version: "1"
databases:
  omnibase_infra:
    connection_env: OMNIBASE_INFRA_DB_URL
    migration_sets:
      - source_repo: omnibase_infra
        branch: dev
        directory: docker/migrations/forward
        runner: scripts/run-forward-migrations.sh
        tracking_table: public.schema_migrations
  omniintelligence:
    connection_env: OMNIINTELLIGENCE_DB_URL
    migration_sets:
      - source_repo: omnibase_infra
        branch: dev
        directory: docker/migrations/intelligence
        runner: scripts/run-intelligence-migrations.sh
        tracking_table: schema_migrations
      - source_repo: omniintelligence
        branch: dev
        directory: deployment/database/migrations
        runner: "k8s migration job"
        tracking_table: schema_migrations
        note: "Canonical source; omnibase_infra/docker/migrations/intelligence/ is a copy"
  omnidash_analytics:
    connection_env: OMNIDASH_ANALYTICS_DB_URL
    migration_sets:
      - source_repo: omnidash-archived
        branch: main
        directory: migrations
        runner: "drizzle-kit (npm run db:migrate)"
        tracking_table: "drizzle internal"
        note: "Read-model schema frozen in omnidash-archived; active omnidash (Vite/React) has no DB migrations."
  omnimemory:
    connection_env: OMNIMEMORY_DB_URL
    migration_sets:
      - source_repo: omnimemory
        branch: dev
        directory: deployment/database/migrations
        runner: "k8s migration job"
  omninode_cloud:
    connection_env: OMNINODE_CLOUD_DB_URL
    migration_sets:
      - source_repo: omninode_infra
        branch: dev
        directory: db/migrations
        runner: "k8s migration job (Dockerfile.migrate)"
        tracking_table: schema_migrations
  omniclaude:
    connection_env: OMNICLAUDE_DB_URL
    migration_sets:
      - source_repo: omniclaude
        branch: dev
        directory: sql/migrations
        runner: "k8s migration job"
  omniweb:
    connection_env: null
    migration_sets:
      - source_repo: omniweb
        branch: dev
        directory: scripts/migrations
        runner: "k8s ConfigMap"
