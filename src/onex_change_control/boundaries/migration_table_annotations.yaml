# OPTIONAL table annotations for the derived migration inventory (OMN-15772).
#
# Keys are "<source_repo>/<directory>/<file>". Values are the tables a human
# asserts the migration creates or modifies.
#
# This layer is hand-maintained and entirely optional: a migration with no
# annotation is NOT an error. It exists because table sets are not reliably
# derivable from SQL text, while file lists are. A comment-stripped
# CREATE/ALTER TABLE + INSERT INTO + UPDATE regex was measured against the
# hand-authored values and disagreed with 30 of them, losing information in
# BOTH directions: it misses the target of an index-only migration
# (CREATE INDEX ... ON <table>) and it adds migration-bookkeeping tables
# (db_metadata, migrations_log, schema_migrations) the annotations
# deliberately omit. Gating a whole-file comparison on a heuristic that lossy
# would turn every SQL text edit in a peer repo into a red check here, so
# table sets stay annotations instead of becoming generated output.
#
# An annotation naming a file that is no longer in its peer's tree is a hard
# error from generate-migration-inventory: stale listings are exactly what
# OMN-15771 had to reconcile by hand.
