---
# ONEX Change Control Pre-commit Configuration
# Mirrors ONEX ecosystem settings for consistency
#
# PERFORMANCE OPTIMIZATION:
# =========================
# Two-stage validation strategy for optimal developer experience:
#
# PRE-COMMIT (target: <15 seconds):
#   - Formatting (ruff format/fix)
#   - Basic file checks (whitespace, large files, merge conflicts)
#
# PRE-PUSH (quick validation before sharing):
#   - mypy type checking (changed files only)
#
# Note: ruff replaces both black and isort (10-100x faster)
#
# USAGE:
#   pre-commit install                    # Install pre-commit hooks
#   pre-commit install --hook-type pre-push  # Install pre-push hooks
#   pre-commit run --all-files            # Run all pre-commit hooks
repos:
  # OMN-15479: yamlfmt contamination ratchet.
  #
  # yamlfmt v0.21.0 rewrites the PARSED VALUE of a folded (`>`) block scalar
  # carrying an internal newline -- replacing each internal newline with the
  # literal `#magic___^_^___line` and destroying the newline -- while reporting
  # `Passed`. The corruption is a FIXED POINT (a second yamlfmt pass is a
  # no-op), so it never self-heals.
  #
  # WHAT THE ORDERING + fail_fast ACTUALLY BUY (corrected 2026-07-30; the
  # earlier note here was wrong). Declaration order alone does NOT protect the
  # working tree: with the repo-level `fail_fast: false`, pre-commit keeps
  # running the remaining hooks after an earlier one fails, so yamlfmt executed
  # in the SAME `git commit` and rewrote the file anyway -- the gate objected
  # while the formatter destroyed the text it was objecting about. The real
  # guarantee was never "the original survives", it was "the corrupted image
  # cannot LAND": the commit aborts, and on every retry the now-corrupted file
  # trips Rule S, which stays red until a human restores the text.
  #
  # `fail_fast: true` on the scanning hook below closes the remaining half.
  # pre-commit stops the run at the first failing hook when that hook declares
  # it, so yamlfmt never executes in an invocation this gate has already
  # rejected, and the author's original text is still on disk to fix. The cost
  # is that a failure here suppresses the rest of the chain for that run --
  # one failure reported instead of several. That is the right trade when the
  # suppressed hook is the one that would silently overwrite the evidence.
  # Declaration order still matters: fail_fast only helps if this hook is
  # reached before yamlfmt.
  #
  # Rule S: the sentinel in a parsed value -- proof the formatter rewrote
  # authored content. Rule F: a folded scalar carrying an internal newline --
  # the precondition. SCOPE IS NOT RESTATED HERE: the gate reads the yamlfmt
  # hook's own `files`/`exclude` below and scans exactly what the formatter
  # formats, so widening that exclude widens the gate in the same commit.
  # `files:` on this hook is therefore every YAML file -- the script, not the
  # hook regex, is the single scope authority; out-of-scope paths print a NOTE.
  # Both rules are shrink-only ratchets against frozen baselines in
  # .onex_ratchets/, because 518 files already carry the sentinel and 15 carry
  # the precondition; a flat assertion would be permanently red and therefore
  # unmergeable.
  #
  # The gate NEVER auto-fixes. Formatter mutation is the disease, not the cure.
  - repo: local
    hooks:
      - id: check-yamlfmt-contamination
        name: yamlfmt contamination ratchet (OMN-15479)
        description: >
          Reject the yamlfmt line-marker sentinel in a parsed value (Rule S) and NEW folded (`>`) block
          scalars carrying an internal newline (Rule F, the corruption precondition), across exactly the
          file set the yamlfmt hook formats. Shrink-only ratchets against frozen baselines; never mutates
          a file. Note this text names the sentinel in prose rather than spelling it: Rule S fires on
          the literal token in any parsed value, and the gate holds its own declaration surfaces to that
          rule instead of exempting them.
        entry: uv run python scripts/validation/check_yamlfmt_contamination.py
        language: system
        files: \.ya?ml$
        pass_filenames: true
        fail_fast: true
        stages: [pre-commit]
      - id: check-yamlfmt-contamination-wiring
        name: yamlfmt contamination ratchet stays wired into required CI (OMN-15479)
        description: >
          Anti-removal anchor. The pre-commit hook above is changed-files scoped, so the corpus-wide shrink-only
          ratchet only has merge-blocking force through ci.yml's unconditional yamlfmt-contamination-ratchet
          job plus its strict success-only check in ci-summary. Deleting both halves in one edit would
          silently re-open the gap. Scoped to ci.yml so ANY edit to that file re-asserts the wiring.
        entry: uv run python scripts/validation/check_yamlfmt_contamination.py --check-wiring
        language: system
        files: ^\.github/workflows/ci\.yml$
        pass_filenames: true
        stages: [pre-commit]

  # YAML formatting (standard across ecosystem, OMN-4862)
  # Configuration in .yamlfmt file (ecosystem-aligned settings)
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: ^(\.github/|templates/)

  # Essential file formatting (standard across ecosystem)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^\.github/workflows/claude.*\.yml$  # Exclude Claude workflows to match main exactly
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
  # ONEX Python Development Hooks
  # Order: ruff format → ruff check (formatting before linting)
  # Note: ruff replaces both black and isort (10-100x faster)
  # Using official ruff-pre-commit for consistency across environments
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6  # Upgraded to canonical ecosystem version (OMN-4858)
    hooks:
      - id: ruff-format
        name: ruff format (auto-format)
        stages: [pre-commit]
        exclude: ^evidence/
      - id: ruff
        name: ruff check (linting + import sorting)
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]
        exclude: ^evidence/
  # Local hooks — all use uv run for consistency
  - repo: local
    hooks:
      - id: mypy-type-check
        name: mypy (type checking)
        entry: bash -c 'uv run mypy "$@" --show-error-codes --no-error-summary' --
        language: system
        types: [python]
        files: ^(src/onex_change_control/|tests/).*\.py$  # Check both source and tests for consistency with CI
        pass_filenames: true  # Only check changed files, not entire codebase
        stages: [pre-push]  # Moved to pre-push: ~1-5s for changed files only
      - id: validate-string-versions
        name: Reject string version anti-patterns (Python + YAML)
        language: system
        entry: uv run python scripts/validation/validate_string_versions.py
        types_or: [python, yaml]
        exclude: >-
          ^(\.github/|contracts/(?!OMN-)|drift/|eval_suites/|schemas/|standards/|templates/|src/onex_change_control/nodes/.*/contract\.yaml$)
        pass_filenames: true
        stages: [pre-commit]
      - id: check-ai-slop
        name: Check for AI-slop patterns
        language: system
        entry: uv run python scripts/validation/check_ai_slop.py --strict
        types_or: [python, markdown]
        pass_filenames: true
        stages: [pre-commit]
      - id: check-dep-provenance
        name: Forbid first-party git-source overrides (OMN-13873)
        entry: uv run --frozen python scripts/check_dep_provenance.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]
      - id: no-env-file
        name: Reject committed .env files (except .env.example)
        entry: bash -c 'if git diff --cached --name-only | grep -E "(^|/)\\.env([._-].+)?$" | grep -vE
          "\\.env\\.example" | grep -q .; then echo "BLOCKED - .env staged. Use ~/.omnibase/.env instead.
          To unstage, run git reset HEAD <file>"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: no-planning-docs
        name: Block planning docs (belong in omni_home/docs/plans/)
        entry: "bash -c 'PLAN_FILES=$(git diff --cached --name-only -- \"docs/plans/\"); if [ -n \"$PLAN_FILES\"
          ]; then echo \"ERROR: Planning docs must live in omni_home/docs/plans/, not in this repo:\";
          echo \"$PLAN_FILES\"; echo; echo \"Move your file to: $OMNI_HOME/docs/plans/\"; exit 1; fi'"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: validate-spdx-headers
        name: ONEX SPDX Header Requirement
        entry: uv run python scripts/validation/validate_spdx_headers.py
        language: system
        pass_filenames: true
        files: ^(src|tests|scripts|examples)/.*\.py$
        exclude: ^(archived/|archive/)
        stages: [pre-commit]
      - id: check-db-boundary-registry
        name: DB boundary exception registry validation
        entry: bash -c 'uv run check-db-boundary --validate-all --registry registry/db-boundary-exceptions.yaml'
        language: system
        pass_filenames: false
        files: ^registry/db-boundary-exceptions\.yaml$
        stages: [pre-commit]
      - id: check-published-events-structure
        name: Validate published_events structure in contract.yaml
        entry: uv run python scripts/validation/check_published_events_structure.py
        language: system
        pass_filenames: true
        files: contract\.yaml$
        stages: [pre-commit]
      - id: no-divergent-automation-pr
        name: No divergent automation PRs (push-main branch cut → non-main base, OMN-14778)
        entry: uv run python scripts/validation/check_no_divergent_automation_pr.py --all --repo-root
          .
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|scripts/validation/check_no_divergent_automation_pr\.py)$
        stages: [pre-commit]
      - id: check-runner-routing
        name: Fork-aware GitHub Actions runner routing (OMN-15699)
        entry: uv run python scripts/validation/check_runner_routing.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]
      - id: check-seam-contract-coverage
        name: Seam contract coverage
        entry: uv run python scripts/validation/check_seam_contract_coverage.py
        language: system
        pass_filenames: false
        files: ^src/onex_change_control/(kafka|models/model_|enums/enum_interface)
        stages: [pre-commit]
      - id: no-localhost-fallbacks
        name: No localhost env-var fallbacks in src/ (OMN-10737)
        language: system
        entry: uv run python scripts/validation/validate_no_env_fallbacks.py
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: check-imperative-contracts-freestanding
        name: Imperative contract guard with freestanding reachability
        language: system
        entry: >-
          uv run check-imperative-contracts --repo-root . --allowlists-dir allowlists --scan-freestanding
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: check-scripts-canonical-form
        name: Scripts canonical-form guard (DEFAULT-DENY new scripts, OMN-14475)
        language: system
        entry: >-
          uv run check-imperative-contracts --repo-root . --allowlists-dir allowlists --scan-scripts
        pass_filenames: false
        files: ^scripts/
        stages: [pre-commit]
      - id: no-hardcoded-topics
        name: No hardcoded ONEX topic strings
        language: system
        entry: uv run check-hardcoded-topics
        types_or: [python, yaml, ts, javascript]
        exclude: ^(contracts/|src/onex_change_control/boundaries/|drift/dod_receipts/|evidence/)  # Manifests, receipts, and archived evidence may document actual topic usage
        pass_filenames: true
        stages: [pre-commit]
      - id: no-untracked-todos
        name: No untracked TODO/FIXME/HACK comments
        language: system
        entry: uv run check-todo-format
        types: [python]
        stages: [pre-commit]
      - id: check-bot-authored-authz-guard
        name: Reject bot-authored authz changes (OMN-14919 / OMN-15008)
        description: >
          Pre-commit mirror of the check-bot-authored-authz-guard CI gate (OMN-14919). Rejects a staged
          change touching grants/** or allowlists/** authored under a known machine identity, via the
          SAME evaluate() decision core as the CI gate (--staged mode substitutes the in-progress commit's
          `git var GIT_AUTHOR_IDENT`/`GIT_COMMITTER_IDENT` identity for the merged-PR history).
        language: system
        entry: uv run check-bot-authored-authz-guard --staged
        files: ^(grants/|allowlists/)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14068: onboard onex_change_control into the G2 hardcoded-IP-family
      # validators (OMN-13294). Same COMPUTE handlers as omnibase_core's own
      # pre-commit config (in-memory bus backend here, Kafka backend in CI), so
      # local and CI verdicts cannot drift. BLOCKING (no warn-only). Suppress a
      # line with `# onex-allow-internal-ip` (private-ip / localhost-url) or
      # `# onex-allow-topic-literal` (topic-string) / `# onex-allow-todo-marker`
      # (todo-marker); suppress a whole file whose subject IS the marker token
      # with the matching `-file-` variant.
      #
      # Scope (OMN-14068): the confirmed gap is `src/onex_change_control/`
      # PRODUCTION Python code (374 tracked files) having zero mechanical
      # coverage — not the repo's scripts/, .github/workflows/, or contracts/
      # evidence corpus, which carry a large legitimate population of example
      # markers/IPs/topics as their documented SUBJECT (contracts/ and
      # drift/dod_receipts/ already exempted from no-hardcoded-topics for the
      # same reason). Scoping `files:` to src/onex_change_control/ closes the
      # confirmed gap precisely without requiring a repo-wide suppression sweep
      # of unrelated tooling that discusses these tokens as data.
      - id: check-private-ip-compute
        name: No hardcoded private-IP literals in src/ — COMPUTE/bus (OMN-13294)
        entry: uv run python -m omnibase_core.validation.private_ip.runtime_private_ip
        language: system
        files: ^src/onex_change_control/.*\.(py|ya?ml|md|json|sh|toml|txt|rst|cfg|ini)$
        pass_filenames: true
        stages: [pre-commit]
      - id: check-localhost-url-compute
        name: No hardcoded localhost/loopback URL literals in src/ — COMPUTE/bus (OMN-13294)
        entry: uv run python -m omnibase_core.validation.localhost_url.runtime_localhost_url
        language: system
        files: ^src/onex_change_control/.*\.(py|ya?ml|md|json|sh|toml|txt|rst|cfg|ini)$
        pass_filenames: true
        stages: [pre-commit]
      - id: check-hardcoded-topic-compute
        name: No hardcoded onex.* topic literals in src/ — COMPUTE/bus (OMN-13294)
        entry: uv run python -m omnibase_core.validation.hardcoded_topic.runtime_hardcoded_topic
        language: system
        files: ^src/onex_change_control/.*\.(py|ya?ml|md|json|sh|toml|txt|rst|cfg|ini)$
        exclude: ^src/onex_change_control/boundaries/  # data-declared boundary rules, not handler literals
        pass_filenames: true
        stages: [pre-commit]
      - id: check-todo-marker-compute
        name: No agent-left TODO/FIXME/HACK markers in src/ — COMPUTE/bus (OMN-13294)
        entry: uv run python -m omnibase_core.validation.todo_marker.runtime_todo_marker
        language: system
        files: ^src/onex_change_control/.*\.(py|ya?ml|md|json|sh|toml|txt|rst|cfg|ini)$
        pass_filenames: true
        stages: [pre-commit]
      - id: no-required-anthropic-key
        name: Block ANTHROPIC_API_KEY as required (OMN-7467)
        language: system
        entry: uv run check-anthropic-key-guard
        types_or: [python, markdown, yaml, ts, javascript]
        exclude: ^(tests/|examples/|docs/)
        stages: [pre-commit]
      - id: validate-contract-yaml
        name: Validate ticket contract YAML against ModelTicketContract (OMN-8808)
        language: system
        entry: uv run validate-yaml
        files: ^contracts/OMN-.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]
      - id: lint-contract-check-values
        name: Contract check_value fail-open pattern lint (OMN-9350)
        entry: uv run python scripts/lint_contract_check_values.py
        language: system
        files: ^contracts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]
      - id: dod-evidence-required
        name: Require dod_evidence on ticket contracts
        entry: uv run python scripts/check_dod_evidence_present.py
        language: system
        files: ^contracts/OMN-\d+\.yaml$
        pass_filenames: true
        stages: [pre-commit]
      # OMN-15411 anti-removal anchor. The Rule A/B/C/D/E corpus ratchets are
      # only merge-blocking because ci.yml's `contract-corpus-ratchets` job is
      # wired into the required `CI Summary` context with a strict success-only
      # check. Deleting both halves in one edit would silently re-open the gap,
      # and the ratchet tests cannot catch that -- they would just stop running.
      # Scoped to ci.yml so ANY edit to that file re-asserts the wiring, both
      # locally and in the required CI `Pre-commit` job (which on a dev PR runs
      # `pre-commit run --files <changed>`).
      - id: check-corpus-ratchet-wiring
        name: Contract corpus ratchets stay wired into required CI (OMN-15411)
        entry: uv run python scripts/validation/check_corpus_ratchet_wiring.py
        language: system
        files: ^\.github/workflows/ci\.yml$
        pass_filenames: true
        stages: [pre-commit]

      # OMN-15484. Same anti-removal shape as the hook above, for the Merge
      # Hold Gate. Four of the incidents in OMN-15483's table happened in THIS
      # repo, every one of them with all required contexts green, because the
      # gate did not exist here. The repair is one job plus one strict
      # success-only check in ci-summary -- two halves that can be deleted
      # together in a single edit, with nothing to notice. Scoped to ci.yml so
      # ANY edit to that file re-asserts the wiring, locally and in the required
      # CI `Pre-commit` job.
      - id: check-merge-hold-gate-wiring
        name: Merge Hold Gate stays wired into required CI (OMN-15484)
        entry: uv run python scripts/validation/check_merge_hold_gate_wiring.py
        language: system
        files: ^\.github/workflows/ci\.yml$
        pass_filenames: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: check-receipt-honesty
        name: Receipt Honesty Gate (OMN-12791)
        description: >
          Scan drift/dod_receipts/ for gamed probes: no-op echo PASS receipts, deferral language in PASS
          output, self-attestation, fake human verifiers, and deploy-keyword evidence backed only by echo.
          Exit 1 on any violation.
        entry: uv run python -m omnibase_core.validation.validator_receipt_honesty
        language: system
        files: ^drift/dod_receipts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      - id: check-contract-substance-floor
        name: Contract Substance Floor (OMN-14409)
        description: >
          A ticket contract must declare at least one dod_evidence check above tier L0 — a check that
          could fail if the work were wrong. Existence probes (`gh pr view <n> --json number,state`) prove
          the PR object exists and pass identically whether the code is correct or broken, so they cannot
          stand alone. Evidence-Source binding/stamp items remain fully valid; they just do not count
          toward the floor. Legacy contracts are grandfathered in scripts/validation/substance_floor_legacy_allowlist.yaml
          (ratchet: may only shrink).
        entry: uv run python scripts/validation/check_contract_substance_floor.py
        language: system
        files: ^contracts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      - id: check-contract-shape-v1
        name: Canonical contract shape v1 (OMN-15669)
        description: >
          Local counterpart of the unconditional `contract-shape-v1` CI job (folded into the required
          CI Summary rollup). Same entrypoint, same engine, same one schema artifact — CLAUDE.md rule
          5: a check that only runs in CI is detection, and a violation commits with every local hook
          green. Validates each touched v1 contract (contracts/v1/*.yaml, plus any legacy contract that
          already carries the occ-contract/v1 marker — migration is one-way) against schemas/occ_contract_v1.schema.yaml
          and the semantic legs: enumerable case space, declared cases really collected by the runner,
          seam schemas resolved and executed via assert_seam_shape (AST, not substring), dual-binding
          axis, and the v1 falsifiability floor. The P2 ticket-identity leg needs a PR body and a Linear
          read, neither of which exists at commit time, so it runs in CI only — the local hook is a strict
          subset by construction, never a divergent second opinion.
        entry: uv run check-contract-shape-v1 --skip-identity
        language: system
        files: ^contracts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      - id: check-dod-authoring-hygiene
        name: Contract DoD-authoring hygiene (OMN-14767 / F-15)
        description: >
          A contract's dod_evidence checks are executed BEFORE the product PR merges. This gate is the
          per-row complement to the substance floor: it rejects (1) no-op / TODO placeholder check_values
          (`# TODO: verify: ...` — a comment that always exits 0 and proves nothing) and (2) self-PR impossible-merge
          assertions (`state == MERGED`, `.merged == true`, non-null `mergedAt` on ${PR_NUMBER}) that
          can never pass while the PR is still open. Legacy contracts are grandfathered in scripts/validation/dod_authoring_legacy_allowlist.yaml
          (ratchet: may only shrink).
        entry: uv run python scripts/validation/check_contract_dod_authoring.py
        language: system
        files: ^contracts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      - id: check-receipt-hardening
        name: Receipt Hardening Gate (OMN-13060 / retro A-5 / OMN-15459 / OMN-15710)
        description: >
          Receipts produced on/after 2026-06-12 must carry contract_sha256 matching sha256(contracts/<ticket>.yaml),
          and PASS receipts may not use session-local verifier aliases. Legacy receipts (run_timestamp
          before cutoff) are exempt. Supersessions (OMN-15459) must additionally bind to the item they
          replace: no byte-identical replacement.check_value across different items in one cohort (S1),
          and the replacement must reference the superseded item's own declared artifact family (S2).
          OMN-15710: no machine-specific absolute path (/Users/, /Volumes/, /home/<user>/) in check_value/probe_command
          (receipts) or dod_evidence[*].checks[*].check_value (contracts), and a PASS receipt's probe_stdout
          (NOT actual_output — deliberately out of scope, see the module docstring) must be shape-consistent
          with a bounded, documented registry of terminal-command classes (printf/echo literals, grep
          -c, wc -l, --jq sha/oid paths). Exit 1 on any violation.
        entry: uv run python scripts/validation/check_receipt_hardening.py
        language: system
        files: ^(drift/dod_receipts/.*\.yaml|contracts/.*\.yaml)$
        pass_filenames: true
        stages: [pre-commit]

      - id: check-supersession-binding-wiring
        name: Supersession binding ratchet stays wired into required CI (OMN-15459)
        description: >
          Anti-removal anchor. Asserts .github/workflows/ci.yml still declares the unconditional supersession-binding-ratchet
          job, that the job runs the corpus ratchet, its RED/GREEN test module and this wiring check,
          and that ci-summary both needs it and fails closed on any non-success result. Scoped to ci.yml
          so every workflow edit re-asserts the wiring; a gate whose two halves can be deleted in one
          edit is not a gate.
        entry: uv run python scripts/validation/check_receipt_hardening.py --check-supersession-wiring
        language: system
        pass_filenames: false
        files: ^\.github/workflows/ci\.yml$
        stages: [pre-commit]

      - id: check-evidence-commit-shas
        name: Evidence-Commit SHA Existence Gate (OMN-15111)
        description: >
          Every "Evidence-Commit: <sha>" citation embedded in a staged receipt YAML's check_value / probe_command
          / actual_output text must resolve to a real commit in this repository's local git history (offline
          `git cat-file -e`, no network calls). Catches a fabricated or truncated SHA at authoring time,
          before it is committed — nothing else in the fleet has ever validated this trailer. The cross-repo
          binding check (does the SHA also match the product PR's current Evidence-Source?) is network-dependent
          and lives in omnibase_core's receipt-gate.yml CI step.
        entry: uv run python scripts/validation/check_evidence_commit_shas.py
        language: system
        files: ^drift/dod_receipts/.*\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      - id: normalization-symmetry
        name: normalization-symmetry
        entry: uv run python -m omnibase_core.validation.checker_normalization_symmetry
        language: system
        pass_filenames: false

      # Skip-token rejection gate (OMN-11412 / OMN-10414)
      # Blocks [skip-*] bypass tokens in staged markdown/yaml/txt files.
      # Escape hatch: add '# skip-token-allowed: <receipt-id>' with a traceable approval receipt.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-gate bypass tokens (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: >-
          ^(tests/.*fixtures/|contracts/(OMN-10414|OMN-10417|OMN-10967)\.yaml|drift/dod_receipts/OMN-10414/dod-004/command\.yaml)$
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-gate bypass tokens in commit messages (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]
  # OMN-13299: Validator-requirements fleet gate
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: f826fb0a0d7891c9ca1bb5c60781edca52052499  # pragma: allowlist secret
    hooks:
      - id: validate-validator-requirements
        args:
          - --repo
          - onex_change_control
          - --spec
          - architecture-handshakes/validator-requirements.yaml
          - --baseline
          - architecture-handshakes/validator-requirements-baseline.yaml
  # OMN-13563 Wave 4: URL authority + os.environ read gates from omnibase_core.
  # check-url-authority: ratchet — any NEW URL literal outside a contract fails.
  #   Suppress with: # url-authority-ok: <reason>
  # no-new-os-environ: AST gate — block ALL os.environ/os.getenv reads outside KEEP_ALLOWLIST.
  #   Suppress with: # env-read-ok: <reason> (structural bootstrap seams only)
  #   Exempts tests/, scripts/, examples/ unconditionally (via internal skip logic).
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 2ec86385174864fd2baee16c1fa9b6b5af04ba85  # pragma: allowlist secret
    hooks:
      - id: check-url-authority
        args: [--repo, onex_change_control, --repo-root, .]
        exclude: ^(tests/|scripts/|examples/|drift/|evidence/).*\.py$
      - id: no-new-os-environ
        exclude: ^(tests/|scripts/|examples/)

  # OMN-14350: non-canonical lifecycle-class ratchet (fan-out from the omnibase_core
  # canary #1430). Consumes the canonical omnibase_core remote hook and ratchets this
  # repo's frozen residual set (.onex_ratchets/noncanonical_class_allowlist.yaml) DOWN
  # toward zero. rev is pinned to a specific core dev SHA (never a moving ref, per the
  # deterministic-truth doctrine). CI merge-gating is via the dedicated
  # .github/workflows/noncanonical-lifecycle-gate.yml job; this local hook is dev-ergonomics.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 63635097705d832e0ee9c4811093efb31349105c  # pragma: allowlist secret
    hooks:
      - id: no-noncanonical-lifecycle-classes
        args: [--allowlist, .onex_ratchets/noncanonical_class_allowlist.yaml, src/onex_change_control]
        files: ^src/onex_change_control/.*\.py$

  # OMN-14434 (fan-out from OMN-14401): reject config/registry YAML files
  # declaring duplicate ids over a non-unique key. Checked registries are
  # declared config-as-data in .duplicate-id-registries.yaml (currently just
  # grants/prod_promotion_grants.yaml, keyed on grant_id). files: below
  # scopes triggering to the manifest itself and the checked registry, so a
  # future PR that only touches prod_promotion_grants.yaml still fires this.
  # Pinned to the merged omnibase_core#1434 dev commit.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: c6ebe3c49448ef821013c616d5dbe1e764104d85  # pragma: allowlist secret
    hooks:
      - id: check-duplicate-registry-ids
        files: ^(\.duplicate-id-registries\.yaml|grants/prod_promotion_grants\.yaml)$

  # OMN-14672 (WS7 fan-out #4, canary OMN-14655 / omnimarket#1783 / omnibase_infra#2318):
  # CI<->pre-commit byte-match parity gate. Two local meta-gates over this very
  # file, wired as BOTH pre-commit hooks (here) and an unconditional CI job (the
  # precommit-parity-gate job in .github/workflows/ci.yml, folded into the
  # required CI Summary rollup) in this same PR, so the class cannot regenerate
  # on the next wrapper script (feedback_a_rule_is_not_a_mechanism).
  - repo: local
    hooks:
      # Fail-loud meta-gate: hard-rejects the exit-0-on-missing-path /
      # WARN-SKIP-degrade class (a skipped gate must be byte-indistinguishable
      # from a failing one) plus any hook `stages:` value that
      # default_install_hook_types does not install (DRIFT-2 / DRIFT-2a).
      - id: precommit-fail-loud-meta-gate
        name: Pre-commit fail-loud meta-gate (OMN-14672)
        entry: uv run python src/onex_change_control/scripts/validate_precommit_fail_loud.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|scripts/.*\.(sh|py)|\.pre-commit-hooks/.*\.sh)$
      # Pin-parity ratchet: fails closed the moment the pre-commit `rev:` pin
      # for a shared omnibase_core validator diverges from the SHA the same
      # validator's ci.yml job pins (DRIFT-3). See PIN_PAIRS in the script.
      - id: precommit-pin-parity
        name: Pre-commit/CI pin-parity check (OMN-14672)
        entry: uv run python src/onex_change_control/scripts/validate_precommit_pin_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$
      # OMN-15241: Required-Check Skip-Vector Guard (canary OMN-14854) -- LOCAL
      # parity for a guard this repo already runs CI-only via
      # .github/workflows/guards.yml (OMN-16260). Without this hook a
      # skip-vector violation commits with every local hook GREEN and is caught only
      # after push -- detection without local enforcement (root CLAUDE.md Rule #5).
      #
      # Fails closed when a workflow file or the required-checks manifest introduces
      # any of the five skip vectors on a REQUIRED context: a path-scoped trigger, an
      # ungated job-level `if:`, an ungated reusable-caller `if:`, a missing
      # pull_request/merge_group trigger, or a `needs:` with no `if:` that provably
      # runs regardless of the needs result (OMN-15057 vector 5).
      #
      # The wrapper executes the SAME validator the CI reusable workflow executes
      # (canonical copy in omniclaude, resolved via $OMNI_HOME), so local and CI
      # verdicts cannot diverge on validator logic.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-15241)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]
# Configuration
# OMN-14672 (DRIFT-2a fix): every stage a hook uses MUST be installed by
# `pre-commit install`. Previously [pre-commit, pre-push] only, so the
# reject-deploy-gate-skip-token-commit-msg hook (stages:[commit-msg]) silently
# never installed locally — a false-green. The precommit-fail-loud-meta-gate
# above now fails closed if this drifts again.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes for onex_change_control

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_schedule: weekly
  submodules: false
