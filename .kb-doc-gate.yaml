#
# KB doc gate config — OMN-16615 / OMN-17172.
#
# strict: canonical documentation for this repo now lives in the knowledge base
# (https://github.com/OmniNode-ai/knowledge-base and knowledge-base-internal).
# The Wave-4 migration has landed and this repo carries zero markdown outside
# the operator-ruled allowed set, so the gate scans the whole tree rather than
# only the PR diff. That is what keeps a scrubbed repo scrubbed.
#
# Every ordinary markdown file that remains here (README.md, CLAUDE.md,
# CHANGELOG.md, SECURITY.md, .github/CONTRIBUTING.md) is covered by the
# validator's default allowed set, so no entry below is needed for prose.
#
# The one repo-specific entry is an INTERLOCK, not a doc exemption. A merged
# DoD receipt artifact under drift/dod_receipts/ is immutable: the required
# `OCC Append-Only Gate` rejects any PR that deletes, renames or edits one
# ("merged receipts are immutable; corrections must be net-new
# '.supersede.<NNNN>.yaml' add-only files"). This scrub tried to delete the
# single .md receipt artifact in that tree and the gate refused, correctly —
# that file is evidence DATA a gate reads, not documentation, exactly like the
# ruling's tests/**/fixtures/** allowance. Migrating it is not available
# either, since a rename is the same violation. Without this entry the two
# required gates contradict each other and no PR can satisfy both.
mode: strict
allowed:
  - "drift/dod_receipts/**"
