---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.omninode.ai/occ-cross-repo-subject/v1
title: OCC cross-repository evidence subject
description: >-
  Wire shape for ModelCrossRepoSubject. The authoritative model lives in omnibase_core (OMN-17580); this
  schema is a non-authoritative CI/static parity artifact and contains no environment or credential data.
type: object
additionalProperties: false
required:
  - schema_version
  - purpose
  - repository
  - pull_request
  - revision
  - contract_source
  - artifact_sha256
properties:
  schema_version:
    const: occ-cross-repo-subject/v1
  purpose:
    const: evidence_only
  repository:
    $ref: '#/$defs/repository'
  pull_request:
    type: object
    additionalProperties: false
    required: [repository, number, base, head, state, merge_commit_sha]
    properties:
      repository:
        $ref: '#/$defs/repository'
      number:
        type: integer
        minimum: 1
        maximum: 2147483647
      base:
        $ref: '#/$defs/revision_ref'
      head:
        $ref: '#/$defs/revision_ref'
      state:
        enum: [OPEN, MERGED]
      merge_commit_sha:
        oneOf:
          - type: string
            pattern: '^[0-9a-f]{40}$'
          - type: 'null'
  revision:
    type: object
    additionalProperties: false
    required: [kind, sha]
    properties:
      kind:
        enum: [head, merge_commit]
      sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
  contract_source:
    type: object
    additionalProperties: false
    required: [repository, commit_sha, path, file_sha256, entry_sha256]
    properties:
      repository:
        $ref: '#/$defs/repository'
      commit_sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
      path:
        type: string
        minLength: 1
        pattern: '^(?!/)(?!.*//)(?!.*(?:^|/)\.\.?(?:/|$))[A-Za-z0-9._/-]+$'
      file_sha256:
        $ref: '#/$defs/digest'
      entry_sha256:
        $ref: '#/$defs/digest'
  artifact_sha256:
    $ref: '#/$defs/digest'
allOf:
  - if:
      properties:
        pull_request:
          properties:
            state: {const: OPEN}
    then:
      properties:
        pull_request:
          properties:
            merge_commit_sha: {type: 'null'}
        revision:
          properties:
            kind: {const: head}
  - if:
      properties:
        pull_request:
          properties:
            state: {const: MERGED}
    then:
      properties:
        pull_request:
          properties:
            merge_commit_sha:
              type: string
              pattern: '^[0-9a-f]{40}$'
        revision:
          properties:
            kind: {const: merge_commit}
$defs:
  repository:
    type: object
    additionalProperties: false
    required: [github_owner, github_name, canonical_remote]
    properties:
      github_owner:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      github_name:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      canonical_remote:
        type: string
        pattern: '^https://github\.com/[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*\.git$'
  revision_ref:
    type: object
    additionalProperties: false
    required: [github_owner, github_name, canonical_remote, ref, sha]
    properties:
      github_owner:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      github_name:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      canonical_remote:
        type: string
        pattern: '^https://github\.com/[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*\.git$'
      ref:
        type: string
        minLength: 1
        pattern: '^[^\x00-\x20\x7f~^:?*\\\[]+$'
      sha:
        type: string
        pattern: '^[0-9a-f]{40}$'
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
