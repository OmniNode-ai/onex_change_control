$schema: https://json-schema.org/draft/2020-12/schema
$id: https://onex.omninode.ai/schemas/occ_cross_repo_subject_v1.schema.yaml
title: OCC cross-repository evidence subject v1
description: >-
  Explicit immutable evidence provenance. This shape carries no authorization, deployment, execute-enabled,
  principal, or activation semantics.
type: object
additionalProperties: false
required:
  - schema_version
  - purpose
  - repository
  - pull_request
  - revision
  - contract_source
  - artifact_sha256
properties:
  schema_version:
    const: occ-cross-repo-subject/v1
  purpose:
    const: evidence_only
  repository:
    $ref: '#/$defs/product_repository'
  pull_request:
    $ref: '#/$defs/pull_request'
  revision:
    $ref: '#/$defs/revision'
  contract_source:
    $ref: '#/$defs/contract_source'
  artifact_sha256:
    $ref: '#/$defs/digest'
$defs:
  sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
    minLength: 40
    maxLength: 40
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    minLength: 71
    maxLength: 71
  product_repository:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: omnibase_infra
      canonical_remote:
        const: https://github.com/OmniNode-ai/omnibase_infra.git
  occ_repository:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: onex_change_control
      canonical_remote:
        const: https://github.com/OmniNode-ai/onex_change_control.git
  pull_request:
    type: object
    additionalProperties: false
    required:
      - repository
      - number
      - base
      - head
      - state
      - merge_commit_sha
    properties:
      repository:
        $ref: '#/$defs/product_repository'
      number:
        type: integer
        minimum: 1
        maximum: 2147483647
      base:
        $ref: '#/$defs/product_repository_ref'
      head:
        $ref: '#/$defs/product_repository_ref'
      state:
        enum:
          - OPEN
          - MERGED
      merge_commit_sha:
        anyOf:
          - type: 'null'
          - $ref: '#/$defs/sha'
    allOf:
      - if:
          properties:
            state:
              const: OPEN
        then:
          properties:
            merge_commit_sha:
              type: 'null'
      - if:
          properties:
            state:
              const: MERGED
        then:
          properties:
            merge_commit_sha:
              $ref: '#/$defs/sha'
  revision:
    type: object
    additionalProperties: false
    required:
      - kind
      - sha
    properties:
      kind:
        enum:
          - head
          - merge_commit
      sha:
        $ref: '#/$defs/sha'
  contract_source:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit_sha
      - path
      - file_sha256
      - entry_sha256
    properties:
      repository:
        $ref: '#/$defs/occ_repository'
      commit_sha:
        $ref: '#/$defs/sha'
      path:
        const: contracts/OMN-17486.yaml
      file_sha256:
        $ref: '#/$defs/digest'
      entry_sha256:
        $ref: '#/$defs/digest'
  product_repository_ref:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
      - ref
      - sha
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: omnibase_infra
      canonical_remote:
        const: https://github.com/OmniNode-ai/omnibase_infra.git
      ref:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\x00\r\n]+$'
      sha:
        $ref: '#/$defs/sha'
