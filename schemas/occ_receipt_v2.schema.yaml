---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.omninode.ai/occ-receipt/v2
title: OCC receipt schema 2.0.0 cross-repository extension
description: >-
  The existing ModelDodReceipt fields remain authoritative. This static extension documents the required
  cross_repo_subject binding; the complete receipt model remains in omnibase_core.
type: object
additionalProperties: false
required:
  - schema_version
  - ticket_id
  - evidence_item_id
  - check_type
  - check_value
  - status
  - run_timestamp
  - commit_sha
  - runner
  - verifier
  - probe_command
  - probe_stdout
  - contract_sha256
  - contract_entry_sha256
  - cross_repo_subject
properties:
  schema_version: {const: '2.0.0'}
  ticket_id: {type: string, minLength: 1}
  evidence_item_id: {type: string, minLength: 1}
  check_type: {type: string, minLength: 1}
  check_value: {type: string, minLength: 1}
  status: {const: PASS}
  run_timestamp: {type: string, format: date-time}
  commit_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  runner: {type: string, minLength: 1}
  verifier: {type: string, minLength: 1, maxLength: 200}
  probe_command: {type: string, maxLength: 10000}
  probe_stdout: {type: string, maxLength: 1000000}
  actual_output: {type: [string, 'null']}
  exit_code: {type: [integer, 'null']}
  duration_ms: {type: [integer, 'null'], minimum: 0}
  pr_number: {const: null}
  contract_sha256: {$ref: '#/$defs/digest'}
  contract_entry_sha256: {$ref: '#/$defs/digest'}
  branch: {type: [string, 'null']}
  working_dir: {type: [string, 'null']}
  proof_packet: {type: [object, 'null']}
  diff_attestations:
    type: array
    items:
      enum: [NET_NEW_ONLY, RECEIPTS_UNMODIFIED, CONTRACT_UNMODIFIED]
  evidence_class:
    enum: [ui_dashboard, backend, unclassified, runtime_ops, null]
  mutation_command: {type: [string, 'null']}
  mutation_verb: {type: [string, 'null']}
  target_identity: {type: [string, 'null']}
  no_source_change: {type: boolean}
  prevention_followup: {type: [string, 'null']}
  cross_repo_subject:
    $ref: 'https://schemas.omninode.ai/occ-cross-repo-subject/v1'
    # Remaining optional ModelDodReceipt fields are intentionally not repeated;
    # validation of those fields stays with the canonical core model.
$defs:
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
