---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT

$schema: https://json-schema.org/draft/2020-12/schema
$id: occ_receipt_v2.schema.yaml
title: OCC canonical cross-repository receipt v2
description: >-
  A complete ModelDodReceipt with an explicit, evidence-only cross-repository subject. v1 receipts remain
  same-repository receipts and cannot carry the cross_repo_subject field. The nested v1 subject contains
  remote metadata only; receipt identity and contract bindings stay at this top level.
type: object
additionalProperties: false
required:
  - schema_version
  - ticket_id
  - evidence_item_id
  - check_type
  - check_value
  - status
  - run_timestamp
  - commit_sha
  - runner
  - verifier
  - probe_command
  - probe_stdout
  - contract_sha256
  - contract_entry_sha256
  - cross_repo_subject
properties:
  schema_version:
    const: '2.0.0'
  ticket_id:
    const: OMN-17486
  evidence_item_id:
    type: string
    minLength: 1
    maxLength: 200
  check_type:
    enum:
      - test_exists
      - test_passes
      - file_exists
      - grep
      - command
      - endpoint
      - behavior_proven
      - semantic_grading
  check_value:
    type: string
    minLength: 1
    maxLength: 10000
  status:
    const: PASS
  run_timestamp:
    type: string
    format: date-time
  commit_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  runner:
    type: string
    minLength: 1
  verifier:
    type: string
    minLength: 1
    maxLength: 200
  probe_command:
    type: string
    minLength: 1
    maxLength: 10000
  probe_stdout:
    type: string
    maxLength: 1000000
  actual_output:
    type: [string, 'null']
  exit_code:
    type: [integer, 'null']
  duration_ms:
    type: [integer, 'null']
    minimum: 0
  pr_number:
    type: [integer, 'null']
    minimum: 1
  contract_sha256:
    $ref: '#/$defs/digest'
  contract_entry_sha256:
    $ref: '#/$defs/digest'
  branch:
    type: [string, 'null']
  working_dir:
    type: [string, 'null']
  proof_packet:
    type: [object, 'null']
  diff_attestations:
    type: array
    items:
      type: string
  evidence_class:
    type: [string, 'null']
  mutation_command:
    type: [string, 'null']
  mutation_verb:
    type: [string, 'null']
  target_identity:
    type: [string, 'null']
  no_source_change:
    type: boolean
  prevention_followup:
    type: [string, 'null']
  cross_repo_subject:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - purpose
      - repository
      - pull_request
      - revision
      - contract_source
      - artifact_source
    properties:
      schema_version:
        const: occ-cross-repo-subject/v1
      purpose:
        const: evidence_only
      repository:
        $ref: '#/$defs/product_repository'
      pull_request:
        $ref: '#/$defs/pull_request'
      revision:
        $ref: '#/$defs/revision'
      contract_source:
        $ref: '#/$defs/contract_source'
      artifact_source:
        $ref: '#/$defs/artifact_source'
$defs:
  sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
    minLength: 40
    maxLength: 40
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    minLength: 71
    maxLength: 71
  product_repository:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: omnibase_infra
      canonical_remote:
        const: https://github.com/OmniNode-ai/omnibase_infra.git
  occ_repository:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: onex_change_control
      canonical_remote:
        const: https://github.com/OmniNode-ai/onex_change_control.git
  pull_request:
    type: object
    additionalProperties: false
    required:
      - repository
      - number
      - base
      - head
      - state
    properties:
      repository:
        $ref: '#/$defs/product_repository'
      number:
        type: integer
        minimum: 1
        maximum: 2147483647
      base:
        $ref: '#/$defs/product_repository_ref'
      head:
        $ref: '#/$defs/product_repository_ref'
      state:
        enum:
          - OPEN
          - MERGED
      merge_commit_sha:
        anyOf:
          - type: 'null'
          - $ref: '#/$defs/sha'
    allOf:
      - if:
          properties:
            state:
              const: OPEN
        then:
          properties:
            merge_commit_sha:
              type: 'null'
      - if:
          properties:
            state:
              const: MERGED
        then:
          required:
            - merge_commit_sha
          properties:
            merge_commit_sha:
              $ref: '#/$defs/sha'
  revision:
    type: object
    additionalProperties: false
    required:
      - kind
    properties:
      kind:
        enum:
          - head
          - merge_commit
  contract_source:
    type: object
    additionalProperties: false
    required:
      - repository
      - commit_sha
      - path
    properties:
      repository:
        $ref: '#/$defs/occ_repository'
      commit_sha:
        $ref: '#/$defs/sha'
      path:
        const: contracts/OMN-17486.yaml
  artifact_source:
    type: object
    additionalProperties: false
    required:
      - repository
      - path
      - artifact_sha256
    properties:
      repository:
        $ref: '#/$defs/product_repository'
      path:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[^/\\\x00\r\n][^\\\x00\r\n]*$'
        allOf:
          - not:
              pattern: '(^|/)(\.{1,2})(/|$)'
          - not:
              pattern: '//'
      artifact_sha256:
        $ref: '#/$defs/digest'
  product_repository_ref:
    type: object
    additionalProperties: false
    required:
      - github_owner
      - github_name
      - canonical_remote
      - ref
      - sha
    properties:
      github_owner:
        const: OmniNode-ai
      github_name:
        const: omnibase_infra
      canonical_remote:
        const: https://github.com/OmniNode-ai/omnibase_infra.git
      ref:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\x00\r\n]+$'
      sha:
        $ref: '#/$defs/sha'
