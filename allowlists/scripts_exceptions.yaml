---
# scripts_exceptions.yaml — CODEOWNERS-approved registry for scripts/** exceptions
#
# OMN-14475: the ONLY way a NEW scripts/** file may land under the DEFAULT-DENY
# canonical-form policy. The scripts guard (check-imperative-contracts
# --scan-scripts) fetches this file from onex_change_control@main in CI (NOT the
# PR branch), so an entry cannot be self-added on a downstream PR — approval is
# a separate, CODEOWNERS-reviewed PR against this file. This mirrors the
# anti-self-approval design of skip_token_approvals.yaml.
#
# Default answer for any new scripts/** file is: build it as a canonical
# CONTRACT+NODE+HANDLER. An exception is justified ONLY when the script provably
# cannot be a node yet — see the disposition + good-reason cases below.
#
# Schema per entry (validated by ModelScriptException; a malformed entry grants
# NOTHING — fail-closed):
#   path:         repo-relative path of the script (e.g. scripts/ci/x.py)
#   repo:         repository the path belongs to (e.g. omnibase_infra)
#   disposition:  node_backed | permanent | convert
#   ticket:       tracking ticket (OMN-XXXX) — conversion ticket, or the
#                 permanent-boundary rationale ticket
#   reason:       brief human-readable justification (which good-reason case)
#   approved_by:  GitHub login of the CODEOWNERS approver, RECORDED on approval.
#                 ADVISORY / not code-enforced for scripts exceptions: nothing
#                 in code compares approved_by to the PR author here (the field
#                 defaults to blank, and no validator reads it). The sole
#                 approved_by != author code check in this repo is
#                 validate_prod_promotion_grants.py, which applies ONLY to
#                 prod-promotion grants — not to this registry. The real gate is
#                 CODEOWNERS review on the separate @main PR that adds the entry.
#
# Dispositions:
#   node_backed — thin shim whose substantive work dispatches to an ONEX
#                 node/handler. CORROBORATED by the guard: a node_backed entry
#                 with no dispatch call is a false claim and is BLOCKED.
#   permanent   — provably-cannot-be-a-node glue that runs where no ONEX runtime
#                 exists yet:
#                   (A) CI/workflow-layer glue (a GitHub Actions step wrapping
#                       uv/gh/docker before the package/runtime is installed);
#                   (B) deploy/host-layer shell glue (chicken-and-egg with the
#                       runtime it brings up);
#                   (C) bootstrap/provisioning that creates the substrate a node
#                       needs (seed-infisical, create_kafka_topics);
#                   (D) git-hook / pre-commit standalone entrypoints.
#                 A high logic score is surfaced as a LOUD advisory to the
#                 reviewer, never a block — CODEOWNERS approval is the authority.
#   convert     — logic-bearing script pending conversion to a node (tracked
#                 debt). Carries a conversion ticket; removed once it lands.
#
# To add an entry:
#   1. Open a PR against onex_change_control adding the entry below.
#   2. CODEOWNERS (@OmniNode-ai/platform-leads) reviews; the approver's GitHub
#      login is recorded as approved_by. The gate is that CODEOWNERS review on
#      this @main-resolved file — approved_by itself is advisory (no code check
#      compares it to the PR author for scripts exceptions).
#
# Burn-down: convert/node_backed entries are removed when the script is
# converted or when the shim is verified node-backed; permanent entries persist
# with their rationale ticket.

# NOTE: approved_by is intentionally left empty on these proposed entries. The
# CODEOWNERS (operator) review of THIS PR is the approval act; the approver's
# GitHub login is recorded on approval. An implementer cannot self-approve — the
# implementer cannot merge this CODEOWNERS-gated file.
entries:
  # WS-RT (release-train) scripts. deploy_source_ref.py + cut-lab-ref.sh (RT-1)
  # already merged → grandfathered into the omnibase_infra baseline, not here.
  - path: scripts/release_drift_monitor.py
    repo: omnibase_infra
    disposition: convert
    ticket: OMN-14478
    reason: >-
      RT-7 gh/PyPI fact-gather I/O shell; convert to an EFFECT node feeding the COMPUTE handler (release_drift_monitor_lib).
      Tracked debt, converts after omnibase_infra#2272 lands.
    approved_by: ""
  - path: scripts/release_drift_monitor_lib.py
    repo: omnibase_infra
    disposition: convert
    ticket: OMN-14478
    reason: >-
      RT-7 pure drift-evaluation logic = a COMPUTE handler verbatim; convert to node_release_drift_monitor's
      COMPUTE handler after omnibase_infra#2272 lands.
    approved_by: ""
  - path: scripts/ci/publish_with_retry.py
    repo: omnibase_infra
    disposition: permanent
    ticket: OMN-14479
    reason: >-
      RT-8 CI-layer glue (case A): a subprocess retry/backoff wrapper around `uv publish` invoked inside
      release.yml, where no ONEX runtime exists. The failure-classifier extraction to a COMPUTE is a tracked
      follow-up (OMN-14479).
    approved_by: ""
  - path: scripts/ci/product_reason_graph.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-14704
    reason: >-
      Phase-3 shadow (OMN-14644) CI-layer glue (case A): a stdlib-only, no-I/O reason-graph emitter invoked
      inside product-readiness-shadow.yml under a bare setup-python step (no ONEX runtime, no package
      install). It classifies already-resolved sibling job conclusions and hashes a content-addressed
      root receipt; report-only, non-required, mints no OCC request. Mirrors the merged omnimarket canary
      (#1796) so the reason-graph stays fleet-uniform.
    approved_by: ""
  - path: scripts/validation/check_contract_dod_authoring.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-14767
    reason: >-
      F-15 contract DoD-authoring gate: a pre-commit standalone entrypoint (case D) + CI-layer validator
      (case A), sibling to check_contract_substance_floor.py (baseline). Pure YAML-in / exit-code-out
      contract linter over contracts/*.yaml; runs in pre-commit and the ci.yml substance-floor job before
      any package/runtime exists. Same permanent boundary as every other scripts/validation guard.
    approved_by: ""
  - path: scripts/validation/check_no_divergent_automation_pr.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-14778
    reason: >-
      Divergent-automation-PR guard: a pre-commit standalone entrypoint (case D) + CI-layer validator
      (case A), sibling to check_contract_dod_authoring.py. Pure YAML-in / exit-code-out linter over .github/workflows/*.yaml
      that operates on the CI substrate itself (it inspects workflow files), so it cannot be an ONEX node
      — it runs in pre-commit and the ci.yml divergent-automation-pr-guard job before any package/runtime
      exists. Retires the OMN-10487 occ-rerun-downstream generator that opened unmergeable main→dev PRs;
      same permanent boundary as every other scripts/validation guard.
    approved_by: ""
  - path: scripts/validation/check_evidence_commit_shas.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15111
    reason: >-
      Evidence-Commit SHA existence gate: a pre-commit standalone entrypoint (case D), sibling to check_receipt_hardening.py.
      Pure YAML-in / exit-code-out linter over drift/dod_receipts/*.yaml that shells out to local `git
      cat-file` plumbing before any package/runtime exists — it cannot be an ONEX node. Closes the finding
      that the fleet-wide "Evidence-Commit: <sha>" PR-body/receipt trailer (in use since OMN-14494) was
      never validated by anything; this is the offline, authoring-time backstop, complementing the network-dependent
      CI check in omnibase_core's receipt-gate.yml.
    approved_by: ""
  - path: scripts/validation/check_yamlfmt_contamination.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15479
    reason: >-
      yamlfmt contamination ratchet: a pre-commit standalone entrypoint (case D) + CI-layer validator
      (case A), sibling to check_receipt_hardening.py and check_corpus_ratchet_wiring.py. Pure YAML-in
      / exit-code-out linter over exactly the file set yamlfmt formats — scope read from the yamlfmt hook's
      own files/exclude in .pre-commit-config.yaml — with a git-plumbing corpus enumeration; it must run
      inside the pre-commit hook chain BEFORE the yamlfmt hook, and inside a ci.yml job, before any package/runtime
      exists — so it cannot be an ONEX node. Closes the OMN-15479 finding that yamlfmt v0.21.0 rewrites
      the parsed value of a folded (`>`) block scalar carrying an internal newline (each internal newline
      replaced by the formatter's literal line-marker sentinel, the newline destroyed) while reporting
      Passed, leaving 518 files / 805 occurrences of silently-corrupted content already merged on dev.
      Also carries its own --check-wiring anti-removal anchor for the ci.yml job + ci-summary strict check.
      Same permanent boundary as every other scripts/validation guard.
    approved_by: ""
  - path: scripts/validation/check_corpus_ratchet_wiring.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15411
    reason: >-
      Corpus-ratchet CI wiring gate: a pre-commit standalone entrypoint (case A), sibling to check_no_divergent_automation_pr.py.
      Pure YAML-in / exit-code-out linter over .github/workflows/ci.yml that operates on the CI substrate
      itself, so it cannot be an ONEX node — it must run in pre-commit and inside a ci.yml job before
      any package/runtime exists. Closes the OMN-15411 round-2 finding that the Rule A/B/C/D/E corpus
      ratchets had no merge-blocking force on the dev path (ci.yml's `test` job is skipped on PRs targeting
      dev, ci-summary's generic rollup passes on a skipped need, and the `tests+coverage (shadow)` runner
      is deliberately non-required). It is the anti-removal anchor for the `contract-corpus-ratchets`
      job + its strict success-only check in ci-summary; without it both halves can be deleted in one
      edit and the ratchets silently stop running. Same permanent boundary as every other scripts/validation
      guard.
    approved_by: ""
  - path: scripts/validation/check_merge_hold_gate_wiring.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15484
    reason: >-
      Merge-hold-gate CI wiring gate: a pre-commit standalone entrypoint (case A), structurally identical
      to check_corpus_ratchet_wiring.py directly above and granted on the same basis. Pure YAML-in / exit-code-out
      linter over .github/workflows/ci.yml that operates on the CI substrate itself, so it cannot be an
      ONEX node — it must run in pre-commit before any package or runtime exists. Closes the OMN-15484
      fan-out of OMN-15483: the merge sweep landed PRs inside the adversarial-verification window, and
      four of the incidents in that ticket's table happened in THIS repo (OCC#5588, #5586, #5530/#5531,
      #5584) with every required context green, because the hold gate existed only in omnimarket. It is
      the anti-removal anchor for the `merge-hold-gate` job + its strict success-only check in ci-summary
      — two halves that can be deleted in one edit with nothing to notice — and it additionally pins the
      cross-repo seam no single-repo test can see: that the job calls the SHARED reusable workflow rather
      than re-declaring the hold vocabulary locally (which is what AC1 forbids, and what produced two
      divergent definitions inside one repo in round 1), that `uses:` and `vocabulary_ref` name the same
      ref so gate logic and tokens cannot drift to different vintages, and that the declared `context_name`
      equals the context GitHub actually mints, since that string is validated against the canonical vocabulary
      in the OTHER repository. Same permanent boundary as every other scripts/validation guard.
    approved_by: ""
  - path: scripts/validation/check_runner_routing.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15699
    reason: >-
      Fork-aware runner-routing policy gate: a pre-commit standalone entrypoint (case D) and CI/workflow
      layer validator (case A) over .github/workflows/*.yml. It prevents untrusted fork code reaching
      self-hosted runners and prevents same-repository PRs from being sent to the public selector; it
      must inspect workflow expressions before any ONEX runtime exists, so it cannot be an ONEX node.
    approved_by: ""
  - path: scripts/ci/ci_summary_gate.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-15768
    reason: >-
      CI Summary poller (OMN-15768 enforce-everything wave): CI/workflow-layer glue (case A), the same
      permanent boundary as every other scripts/validation guard and its own sibling scripts/ci/product_reason_graph.py.
      Invoked from the ci-summary job in ci.yml BEFORE any package install completes for downstream jobs,
      evaluating the GitHub Actions jobs API + commits/{sha}/ check-runs payloads to render a fail-closed
      verdict for the sole required umbrella context on OCC dev/main. It replaces the prior needs-gated
      aggregator whose needs-graph omission let OCC#6346 merge with Contract Compliance Check red and
      CI Summary green on the same head SHA, and whose skip-as-pass generic rollup let 12 jobs silently
      skip on every dev PR while reading as passing. Ported in structure from omnibase_infra's proven
      scripts/ci/ci_summary_gate.py (same permanent CI-layer glue classification there). It cannot be
      an ONEX node: it inspects the CI substrate's own run/check-run state before any node runtime is
      available in that job.
    approved_by: ""
  - path: scripts/ci/check_governance_paths.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-16117
    reason: >-
      Governance-path auto-merge exclusion (OMN-16117): CI/workflow-layer glue (case A), the same permanent
      boundary as its siblings scripts/ci/ci_summary_gate.py and scripts/ci/merge_queue_enqueue.py (baseline).
      Invoked from a single step in auto-merge.yml BEFORE any package install completes in that job, deciding
      -- from a GitHub-API-resolved PR changed-file set the workflow passes in as JSON -- whether the
      PR touches a guarded governance file (grants/prod_promotion_grants.yaml, allowlists/skip_token_approvals.yaml)
      and must therefore be excluded from auto-merge arming, fail-closed on an undetermined changed-file
      set. It cannot be an ONEX node: it must gate a bare `gh pr merge --auto` shell step in a workflow
      with no ONEX runtime bootstrap, the same constraint that governs every other permanent entry in
      this file. Pure, no I/O, unit-tested in tests/unit/scripts/test_check_governance_paths.py.
    approved_by: ""
  - path: scripts/ci/governance_advisory_gate.py
    repo: onex_change_control
    disposition: permanent
    ticket: OMN-16117
    reason: >-
      Advisory governance-file gate (OMN-16117, second vector): CI/workflow-layer glue (case A), the same
      permanent boundary as its sibling scripts/ci/check_governance_paths.py, from which it imports GOVERNANCE_PATHS
      and touches_governance_path directly (no second path list). Invoked from the standalone .github/workflows/governance-file-advisory-gate.yml
      BEFORE any package install completes in that job, to hard-fail a PR check whenever the PR's GitHub-API-resolved
      changed-file set touches a guarded governance file, so that "all checks green" is never true for
      such a PR even when an external driver bypasses auto-merge.yml entirely. Deliberately NOT wired
      into ci.yml, CI Summary's STRICT_GATE_JOBS/SKIPPABLE_GATE_JOBS, or required-checks.yaml -- it must
      stay advisory because occ main has enforce_admins:true and a required failing check there would
      wedge every future prod-promotion grant landing, including emergency prod recovery. It cannot be
      an ONEX node: it must gate a bare `pull_request` workflow step before any ONEX runtime bootstrap,
      the same constraint that governs every other permanent entry in this file. Pure, no I/O, unit-tested
      in tests/unit/scripts/test_governance_advisory_gate.py.
    approved_by: ""
