      a tag that has never existed in ECR — with a real digest. image_digest sha256:13c96028566b7f429fd46298304fb61c03c325b3e45f60638cce61c28185fcf6
      (`omninode-runtime`, tag `pinned-onex-prod-live-13c96028`) is the digest the onex-prod runtime plane
      is ALREADY running; re-verified ACTIVE in ECR via `aws ecr describe-images` on 2026-08-26. THIS
      IS NOT A NEW RUNTIME IMAGE PROMOTION — it is a same-digest authorization, precedented by OCC#6599
      (OMN-15181) and OCC#7084 (OMN-16205). It is required because the workflow's grant gate resolves
      the RUNTIME digest unconditionally for every deploy_target including runtime-only (the `Enforce
      prod-promotion grant / runtime image (OMN-14209)` step reads `RUNTIME_IMAGE_REF` from `k8s/onex-prod/runtime/kustomization.yaml`),
      while the workflow's `kubectl apply --server-side --force-conflicts -k k8s/onex-prod` step carries
      no deploy_target condition and therefore applies the omniintelligence overlay in the same run. Sibling
      entry grant-9c23ed5d-2f44-4757-90d4-1fb84b4b3b43 under the SAME promotion_batch_id covers the omniintelligence
      digest that is the actual content change. Repo change under authorization: omninode_infra#1016 (base
      dev) pins both `k8s/onex-prod/omniintelligence/kustomization.yaml` and `k8s/onex-prod/omniintelligence/deployment.yaml`
      to sha256:a66ff063 — it must be merged to dev AND promoted to omninode_infra@main before dispatch,
      because deploy-onex-prod.yml refuses any dispatch whose GITHUB_REF is not refs/heads/main. Rollback:
      `kubectl -n onex-prod rollout undo deployment/omniintelligence` returns the workload to the PRIOR
      ReplicaSet, which is the broken `:placeholder` spec — rollback restores the pre-existing ImagePullBackOff,
