# prod_promotion_grants.yaml — un-forgeable trust anchor for prod-promotion approvals
#
# OMN-13418 Phase 2a: This file is the canonical grant registry for production
# promotion approvals. It is protected by a dedicated CODEOWNERS rule requiring
# @OmniNode-ai/platform-leads approval on any PR that touches this file.
#
# Schema per entry:
#   grant_id:           unique UUID identifying this grant (format: "grant-<uuid4>")
#   runtime_lane:       target runtime lane being promoted to (e.g. "prod")
#   image_digest:       sha256 digest of the image being promoted (format: "sha256:<hex>")
#   promotion_batch_id: batch identifier grouping related promotions (format: "batch-<uuid4>")
#   approved_by:        GitHub login of the platform-leads approver (CODEOWNERS-enforced)
#   expires_at:         ISO-8601 UTC datetime after which the grant is invalid
#   created_at:         ISO-8601 UTC datetime when the grant was created
#   reason:             human-readable justification for the promotion
#
# Optional single-use lifecycle markers (OMN-13424; absent == not consumed):
#   consumed:                    bool — once a promotion using this grant reaches a
#                                terminal deploy state, mark true (or remove the entry)
#   consumed_at:                 ISO-8601 UTC datetime the grant was consumed
#   consumed_by_correlation_id:  UUID of the redeploy run that consumed it
#   The resolver treats a consumed grant as ABSENT — no replay of a spent grant.
#
# Invariants enforced by the dedicated validation workflow
# (.github/workflows/validate-prod-promotion-grants.yml):
#   - File must parse as valid YAML
#   - Top-level key must be "entries" (list)
#   - Each entry must have all required fields present; only the OMN-13424
#     consumed* lifecycle markers are tolerated as extra fields
#   - grant_id must match pattern: grant-[0-9a-f-]{36}
#   - image_digest must match pattern: sha256:[0-9a-f]{64}
#   - expires_at and created_at must be ISO-8601 UTC datetimes
#   - expires_at must be after created_at
#   - NO EXPIRED ENTRY may remain (OMN-13424): a grant whose expires_at is in the
#     past FAILs the check — it must be pruned so at rest the file is entries: []
#
# To add a grant:
#   1. Open a PR against onex_change_control with a new entry below.
#   2. CODEOWNERS (@OmniNode-ai/platform-leads) must review and approve.
#   3. The approver's GitHub login becomes the approved_by value.
#   4. The approver MUST differ from the PR author (enforced by CODEOWNERS gate).
#
# This file intentionally starts empty. Entries are added only through the
# CODEOWNERS-gated approval process — never by automated agents or CI.
#
# GRANT REQUEST (OMN-16626) — PREP ONLY, staged by an agent lane
# (`omn16626-promotion-prep`) on 2026-08-26 under the operator consent recorded
# in `omni_home/docs/tracking/ROLLING_WORK_LEDGER.md` row `2026-08-26T19:22:09Z`
# (lane `operator-consents-1900`): "OMN-16626 image promotion GRANTED ... repo
# pin fixes + grant-file PR prepared by lanes, dispatch by operator/Daniyal per
# standing no-session-dispatch rule."
#
# THIS PR MUST NOT BE MERGED BY ANY AGENT. It becomes effective only when a
# human operator lands it on `onex_change_control@main` — that CODEOWNERS-gated
# merge is the anti-self-issue anchor an agent structurally cannot complete
# (OMN-13418).
#
# `approved_by` BELOW IS A PROPOSAL, NOT AN APPROVAL. Per step 3 of the process
# above, the `approved_by` value is produced by the actual approval act. The
# entries below were staged by an agent lane, not by an approver, so the value
# they carry (`jonahgabriel`) is an operator-owned placeholder that the
# CODEOWNERS approver MUST confirm or replace at merge time.
#
# STEP 4 OF THE PROCESS ABOVE IS NOT SATISFIED BY THE STAGED VALUE. The PR
# author is `jonahgabriel` and the staged `approved_by` is `jonahgabriel`; on
# this repo's own header rule ("the approver MUST differ from the PR author")
# that IS self-approval as staged. This is disclosed here rather than claimed
# away. The approver closes it by setting `approved_by` to their own login —
# which must not be the PR author — before merging.
#
# WHY IT IS A REAL LOGIN AND NOT A LITERAL PLACEHOLDER STRING: this repo's
# schema validator requires `approved_by` to be a non-empty string, so the
# field cannot be omitted; and the consumer
# (`omninode_infra/scripts/validate_prod_promotion_grant.py`, OMN-14209)
# enforces `approved_by != requested_by` against `github.actor`. A synthetic
# placeholder would compare unequal to EVERY dispatcher and would therefore
# silently disable the only mechanical anti-self-approval check that exists on
# this path. A real login is the safer staging value; it is still a proposal.
#
# ANTI-SELF-APPROVAL ON THE CONSUMER SIDE — READ BEFORE DISPATCHING. The
# consumer's check is satisfied only by the DISPATCHER differing from
# `approved_by`; nothing about this file's own review satisfies it. Verified by
# running the consumer's own `resolve_grant_for_digest` against this file:
# dispatcher `daniyalabbas96` -> resolved; dispatcher `jonahgabriel` ->
# `self_granted`, BLOCKED. So with the staged value, Daniyal (`daniyalabbas96`,
# verified `admin` on `OmniNode-ai/omninode_infra` on 2026-08-25 per OCC#7084)
# must be the `workflow_dispatch` actor for `deploy-onex-prod.yml`. If
# `approved_by` is changed at merge time, re-derive the permitted dispatcher
# from the new value. Note this repo's `main` header above has NOT absorbed
# OMN-14814's sole-CODEOWNER carve-out (dev-only, commit `f2b49416f`); the
# stricter main-branch text is what governs this PR and is what the paragraph
# above is measured against.
#
# `expires_at: 2026-08-28T20:00:00Z` is likewise a PROPOSAL (~48h from staging);
# the approver may shorten it at merge time. `requested_by` is deliberately not
# a YAML field (see schema above) — the requester is the agent lane named at the
# top of this block, recorded here and in the ledger row cited above.
#
# PRUNED IN THIS PR: the two OMN-16205 / OMN-16207 entries added by OCC#7084
# (`grant-5f94d77d-...` runtime, `grant-a1257e52-...` omniweb) both carried
# `expires_at: 2026-08-26T19:47:00Z` and lapsed unused — no
# `deploy-onex-prod.yml` run consumed them. The OMN-13424 invariant enforced by
# `validate-prod-promotion-grants` refuses to let ANY expired entry remain, so
# this file cannot pass CI with them present; they are removed rather than
# silently extended. Removed with them is their own per-request comment
# paragraph (the "GRANT REQUEST (OMN-16205 / OMN-16207 / OMN-13418)" block that
# sat here on `main`), because it documents entries that no longer exist. That
# per-request paragraph is the ONLY header text on `main` this PR does not carry
# forward: the durable schema / invariant / process header above — including the
# OMN-13424 `entries: []` at-rest invariant and the four-step approval process —
# is byte-identical to `main`. If the OMN-16205 / OMN-16620 ingress cutover
# still needs a grant it must be RE-ISSUED in its own PR. The runtime entry
# below re-authorizes the SAME runtime digest (`sha256:13c96028...`), but ONLY
# for the OMN-16626 scope stated in its `reason`; the pruned entry's explicit
# "this grant also authorizes the ingress-host swap itself" scope statement does
# NOT carry over.
# ---------------------------------------------------------------------------
