    runtime_lane: prod
    image_digest: sha256:13c96028566b7f429fd46298304fb61c03c325b3e45f60638cce61c28185fcf6
    promotion_batch_id: batch-404af076-32a6-449c-b60a-1e8848e3fe3c
    # PROPOSAL — the CODEOWNERS approver sets this at merge time (see header).
