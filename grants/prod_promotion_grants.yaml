      omninode_infra's `scripts/validate_prod_promotion_grant.py` (OMN-14209). No raw SSH/kubectl path
      is used or implied. NO PROD MUTATION HAS OCCURRED OR IS AUTHORIZED BY THIS PR; the workflow_dispatch
      is a separate, explicit, subsequent human action by a dispatcher who is not `approved_by`.
