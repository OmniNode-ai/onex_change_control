      on container port 8053. A failure here presents as Init:CrashLoopBackOff or an unready pod, and
      it WILL fail the run — but late, and not where you would look first: `omniintelligence` is absent
      from the `Verify PROD runtime rollout` step's `runtime_deployments` list, so that step passes regardless.
      The blocking signal comes from the always-run `Post-deploy verification gate (OMN-11969)`, whose
