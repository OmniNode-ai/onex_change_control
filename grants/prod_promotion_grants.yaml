      `scripts/validate_prod_promotion_grant.py` (k3s/EKS cloud-plane, OMN-14209), NOT the `.201` compose-lane
      `node_redeploy_orchestrator` path. No raw SSH/kubectl retag/recreate path is used or implied — all
      promotion routes through the gated workflow after this grant lands on `@main`. NO PROD MUTATION
      HAS OCCURRED OR IS AUTHORIZED BY THIS PR; the workflow_dispatch is a separate, explicit, subsequent
      human action.
