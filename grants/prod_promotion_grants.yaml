    created_at: "2026-08-28T14:45:00Z"
    reason: >-
      OMN-16799 entry 1 of 2 — RUNTIME SAME-DIGEST AUTHORIZATION, not a new runtime promotion. image_digest
      sha256:13c96028566b7f429fd46298304fb61c03c325b3e45f60638cce61c28185fcf6 is the digest onex-prod's
      runtime plane is ALREADY running and the digest pinned in `k8s/onex-prod/runtime/kustomization.yaml`
      on omninode_infra `main` (8a4ebe69) and `dev` (ab92b08b) alike — the same digest OCC#7213's now-pruned
      grant-3c885a33-552b-4ff1-a5c6-a3c31011fa9e authorized, and the same one run 33117155819 already
