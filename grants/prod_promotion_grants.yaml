    reason: >-
      OMN-16626 companion grant, sibling to grant-3c885a33-552b-4ff1-a5c6-a3c31011fa9e under the SAME
      promotion_batch_id, scoped to the `omniintelligence` image on onex-prod. image_digest sha256:a66ff06391f3e0644b0750ebc52399cc8395971b01fdeec85106132fdeaf1da8
      is the newest clean `omniintelligence` ECR build, re-verified 2026-08-26 via `aws ecr describe-images`
      (tags `dev-latest` and `1a28aa47c559d492b4b64b3931c0be0135ee5b88`, pushed 2026-08-26T12:26:32Z;
      the next-newest push is sha256:148ea0dd at 2026-08-26T07:43:27Z). Unlike the sibling entry this
      IS a real image promotion: onex-prod has never successfully run an omniintelligence image, so there
      is no previously-served digest to match. HONESTY NOTE FOR THE APPROVER: the k3s grant gate (OMN-14209)
      resolves only the runtime and onex-api digests, so it will never mechanically read THIS entry —
      it is recorded because this digest is what the promotion actually changes, and a grant registry
      that omits the promoted image would be a false record. FIRST-BOOT CAVEAT: this digest has never
      booted in onex-prod. Its `wait-for-migration` initContainer hard-fails unless Secret `omniintelligence-credentials`
      carries POSTGRES_PASSWORD (Infisical-synced) and the `omniintelligence` database on omninode-postgres.data-plane.svc.cluster.local
