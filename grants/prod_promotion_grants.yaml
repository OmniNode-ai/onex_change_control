# prod_promotion_grants.yaml — un-forgeable trust anchor for prod-promotion approvals
#
# OMN-13418 Phase 2a: This file is the canonical grant registry for production
# promotion approvals. It is protected by a dedicated CODEOWNERS rule requiring
# @OmniNode-ai/platform-leads approval on any PR that touches this file.
#
# Schema per entry:
#   grant_id:           unique UUID identifying this grant (format: "grant-<uuid4>")
#   runtime_lane:       target runtime lane being promoted to (e.g. "prod")
#   image_digest:       sha256 digest of the image being promoted (format: "sha256:<hex>")
#   promotion_batch_id: batch identifier grouping related promotions (format: "batch-<uuid4>")
#   approved_by:        GitHub login of the platform-leads approver (CODEOWNERS-enforced)
#   expires_at:         ISO-8601 UTC datetime after which the grant is invalid
#   created_at:         ISO-8601 UTC datetime when the grant was created
#   reason:             human-readable justification for the promotion
#
# Optional single-use lifecycle markers (OMN-13424; absent == not consumed):
#   consumed:                    bool — once a promotion using this grant reaches a
#                                terminal deploy state, mark true (or remove the entry)
#   consumed_at:                 ISO-8601 UTC datetime the grant was consumed
#   consumed_by_correlation_id:  UUID of the redeploy run that consumed it
#   The resolver treats a consumed grant as ABSENT — no replay of a spent grant.
#
# Invariants enforced by the dedicated validation workflow
# (.github/workflows/validate-prod-promotion-grants.yml):
#   - File must parse as valid YAML
#   - Top-level key must be "entries" (list)
#   - Each entry must have all required fields present; only the OMN-13424
#     consumed* lifecycle markers are tolerated as extra fields
#   - grant_id must match pattern: grant-[0-9a-f-]{36}
#   - image_digest must match pattern: sha256:[0-9a-f]{64}
#   - expires_at and created_at must be ISO-8601 UTC datetimes
#   - expires_at must be after created_at
#   - NO EXPIRED ENTRY may remain (OMN-13424): a grant whose expires_at is in the
#     past FAILs the check — it must be pruned so at rest the file is entries: []
#
# To add a grant:
#   1. Open a PR against onex_change_control with a new entry below.
#   2. CODEOWNERS (@OmniNode-ai/platform-leads) must review and approve.
#   3. The approver's GitHub login becomes the approved_by value.
#   4. The approver MUST differ from the PR author (enforced by CODEOWNERS gate).
#
# This file intentionally starts empty. Entries are added only through the
# CODEOWNERS-gated approval process — never by automated agents or CI.
#
# GRANT REQUEST (OMN-16799) — PREP ONLY, staged by an agent lane on
# 2026-08-28. THIS PR MUST NOT BE MERGED BY ANY AGENT. It becomes effective
# only when a human operator lands it on `onex_change_control@main` — that
# CODEOWNERS-gated merge is the anti-self-issue anchor an agent structurally
# cannot complete (OMN-13418). The merge IS the approval act.
#
# WHAT THIS AUTHORIZES: exactly one gated `deploy-onex-prod.yml` dispatch, run
# with `deploy_target=onex-api` AND `reclaim_api_hostname=true` in the SAME
# run. Those two are deliberately coupled: `omninode_infra#1044`'s
# "Validate reclaim_api_hostname input" step refuses `reclaim_api_hostname=true`
# unless `deploy_target` is `onex-api` or `all`, precisely so the hostname
# `api.omninode.ai` can only ever be pointed at an onex-api digest that this
# gate has already cleared. Promotion and hostname reclaim ride one dispatch.
#
# TWO ENTRIES, BOTH MECHANICALLY REQUIRED. `deploy-onex-prod.yml` runs the
# OMN-14209 grant gate TWICE on a `deploy_target=onex-api` dispatch:
#   * "Enforce prod-promotion grant — runtime image" carries NO `if:` guard
#     (verified against the workflow source: the step's own comment says
#     "Runtime image is deployed unconditionally for every deploy_target
#     value ... so this check also runs unconditionally"). It resolves
#     `RUNTIME_IMAGE_REF` from `k8s/onex-prod/runtime/kustomization.yaml`,
#     which pins sha256:13c96028… on BOTH omninode_infra `main` and `dev`.
#     Entry 1 covers it as a same-digest authorization.
#   * "Enforce prod-promotion grant — onex-api image" (`if: deploy_target !=
#     'runtime-only'`) resolves the digest for the dispatched `commit_sha`
#     out of ECR. Entry 2 covers sha256:bc95b9bc…, the real promotion.
# Without entry 1 the dispatch BLOCKS at the first gate before reaching the
# onex-api one. A single-entry grant would have failed closed.
#
# `approved_by` BELOW IS A PROPOSAL, NOT AN APPROVAL. As staged, the PR author
# and `approved_by` are both `jonahgabriel`, which is self-approval on this
# branch's own header rule (step 4 above). That is disclosed here rather than
# claimed away. The CODEOWNERS approver confirms or replaces the value at merge
