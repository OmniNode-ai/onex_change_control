      `kubectl apply -k` is a no-op for the runtime image and no runtime pod is rescheduled by this grant.
      Sibling entry grant-7013b49e-f714-4ead-8910-e6ffda84df56 under the SAME promotion_batch_id covers
      the onex-api digest that is the actual content change; see it for the shared rollback statement.
      Consumer: omninode_infra's `scripts/validate_prod_promotion_grant.py` (k3s/EKS cloud plane, OMN-14209),
      NOT the `.201` compose-lane `node_redeploy_orchestrator` path. No raw SSH/kubectl retag/recreate
      path is used or implied — all promotion routes through the gated workflow after this grant lands
      on `@main`. NO PROD MUTATION HAS OCCURRED OR IS AUTHORIZED BY THIS PR; the workflow_dispatch is
      a separate, explicit, subsequent human action.
  - grant_id: grant-7013b49e-f714-4ead-8910-e6ffda84df56
    runtime_lane: prod
    image_digest: sha256:bc95b9bc5a1860dd666ecea4e82e278ff4ddb2d08da5d280ba8472b7041309ab
    promotion_batch_id: batch-404af076-32a6-449c-b60a-1e8848e3fe3c
    # PROPOSAL — the CODEOWNERS approver sets this at merge time (see header).
    approved_by: jonahgabriel
    expires_at: "2026-08-30T16:00:00Z"
    created_at: "2026-08-28T14:45:00Z"
    reason: >-
      OMN-16799 entry 2 of 2 — THE ACTUAL PROMOTION. Authorizes the gated `deploy-onex-prod.yml` dispatch
      with deploy_target=onex-api AND reclaim_api_hostname=true, which (a) promotes onex-prod's `onex-api`
      Deployment from the digest it currently serves (sha256:b4c325545e1012aef53772d1a3f5a30eb9af3809b9a4036e28a156db906581bc,
      pinned in `k8s/onex-prod/api/deployment.yaml`) to image_digest sha256:bc95b9bc5a1860dd666ecea4e82e278ff4ddb2d08da5d280ba8472b7041309ab,
      and (b) DELETES the stale `onex-dev/onex-api` Ingress on the public cluster so `onex-prod/onex-api`
      becomes the single claimant of `api.omninode.ai` (OMN-16620 left the git half done and the live
      half undone; `kubectl apply -k` never prunes and no pipeline owned that object). PROVENANCE OF THE
      DIGEST, verified rather than asserted: ECR 272493677981.dkr.ecr.us-east-1.amazonaws.com/omnicloud/core,
      built by "Build and push onex-api image to ECR" run 33179880143 (conclusion success, 2026-08-28T14:23:12Z)
      from omninode_infra `main` at headSha 8a4ebe6919a52f8de272fb908e90866e8514e3cd — the current `main`
      HEAD — and tagged with that commit SHA, which is how `deploy-onex-prod.yml`'s `resolve-ecr-digest`
      action (exact-match only; `fallback-to-latest` is NOT passed, so a wrong commit_sha fails loud rather
      than silently resolving some other image) will resolve it. Trivy CRITICAL/HIGH clean. Contains `docker/onex-api/tenant_event_outbox.py`.
      WHY THE HOSTNAME RECLAIM IS IN SCOPE OF THIS GRANT AND NOT A SEPARATE ONE: the reclaim points a
      public hostname at whatever onex-api digest is live, so omninode_infra#1044 fails the run CLOSED
