---
# governed_lane_grants.yaml - authorization anchor for compose-config changes
# to the governed .201 compose lanes (OMN-20260, operator ruling
# 2026-10-01T10:37:55Z lane=compose-grant-kind: "new grant type approved.").
#
# WHAT THIS FILE AUTHORIZES
#   One compose-config change to one governed compose lane: `stability-test`
#   or `judge`. Such a change (a port bind, an env value, a service flag) has
#   no image digest and no kustomize overlay, so no prod_promotion_grants.yaml
#   kind can name it, yet the lanes are governed by rule 2a (OMN-15243).
#
# WHAT IT CANNOT AUTHORIZE
#   Anything in production (the AWS onex-prod namespace) or any image
#   promotion. omninode_infra's dispatch gate, the omnimarket resolver and
#   omnibase_infra's lane-deploy interlock read prod_promotion_grants.yaml
#   only; none reads this file.
#
# SCHEMA (enforced by `uv run validate-governed-lane-grants`; the module
# docstring of src/onex_change_control/scripts/validate_governed_lane_grants.py
# is the field reference)
#   grant_id, target_kind: compose_config, runtime_lane, compose_project,
#   compose_files, env_files, profiles, services, compose_ref,
#   rendered_digest, requested_by, approved_by (!= requested_by), expires_at,
#   created_at, reason; optional consumed / consumed_at /
#   consumed_by_correlation_id.
#
# HOW IT IS CONSUMED
#   omnibase_infra scripts/apply_governed_compose_config.py reads this file at
#   onex_change_control@main (never a PR branch), requires the checkout to be
#   at compose_ref, re-renders `docker compose config` from exactly the named
#   inputs, and refuses unless the digest matches before it recreates exactly
#   the named services.
#
# LIFECYCLE
#   At rest: entries: []. An expired entry fails CI and must be pruned. A
#   later operator "hold" is a prune or `consumed: true` merged to main.
#
# To add a grant: open a hotfix/* PR against main with one entry. A platform
# lead other than the requester reviews it under CODEOWNERS and sets
# approved_by and expires_at. An agent cannot complete that review.
entries: []
