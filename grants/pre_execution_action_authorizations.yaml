# Canonical pre-execution action-authorization registry (OMN-17462).
#
# At rest this registry is empty. A future authorization entry is valid only if
# it cryptographically binds its ticket, contracts/<ticket>.yaml, immutable OCC
# commit, and contract SHA-256; specifies exactly one action/source/artifact and
# database/schema/service/principal; remains execute_enabled: false; has an
# issuer, expiry, and unique nonce; and declares one_time_use: true.
#
# A consumer must atomically claim the nonce before action execution and write
# consumed/consumed_at/consumed_by_correlation_id through its governed durable
# ledger. This registry validates authorization shape and binding only; it does
# not execute, consume, deploy, or grant a live action.
entries: []
